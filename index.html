rburga**, wykorzystywany w PET), niestabilność genomu, unikanie odpowiedzi immunologicznej i wzrost w otoczeniu zapalenia. **Przerzuty** to najważniejsza cecha złośliwości, odróżniająca nowotwór złośliwy od łagodnego. Nowotwory mogą wytwarzać hormony ektopowo: rak drobnokomórkowy płuca wydziela ACTH (zespół Cushinga) i wazopresynę (SIADH), a inne guzy białko podnoszące wapń (hiperkalcemia). Markery to m.in. **CA 125** (rak jajnika) i **CEA** (rak jelita grubego).", "**Kinetyka wzrostu**: guz o masie 1 g (ok. 10⁹ komórek, granica wykrywalności klinicznej) powstaje po ok. **30 podwojeniach**, a do 1 kg (masy śmiertelnej) wystarcza tylko **10 kolejnych**. Cykl komórkowy komórek nowotworowych nie jest krótszy niż prawidłowych. **Frakcja wzrostowa** w jawnych klinicznie guzach zwykle nie przekracza 20%, a w litych rakach wynosi 1–5%. Dlatego chemioterapia jest mało skuteczna w rakach, a skuteczna w chłoniakach. Masa guza zależy też od utraty komórek (apoptoza, martwica z niedotlenienia). Czas podwojenia raka jelita lub płuca wynosi ok. 2–3 miesięcy. Według hipotezy **nowotworowych komórek macierzystych** niewielka frakcja komórek (np. < 0,01% w AML) dzieli się asymetrycznie i odnawia guz. Inwazję umożliwiają **metaloproteazy**, proteazy serynowe i katepsyny, wydzielane głównie przez komórki **podścieliska**. Podścielisko nie jest biernym rusztowaniem. Guz jest **heterogenny** (subklony), a przerzuty bywają bardziej jednorodne niż guz pierwotny.", "**Protoonkogeny** przechodzą w **onkogeny** przez mutacje **przyrostu funkcji**, które działają **dominująco** (wystarczy jeden allel). Mechanizmy to mutacja punktowa (**RAS** – kodony 12 i 61, białko niewrażliwe na GAP, stale związane z GTP), **amplifikacja** (N-MYC w nerwiaku zarodkowym, do 1200 kopii; ERBB2/HER2 w ok. 30% raków piersi; obie złe rokowniczo), **nadekspresja** (EGFR w 80% płaskonabłonkowych raków płuca) i **translokacja**. Przykłady translokacji: **t(9;22) – chromosom Philadelphia, fuzja BCR-ABL** z konstytutywnie aktywną kinazą tyrozynową w **PBSz** oraz **t(8;14) – MYC** obok genu łańcucha ciężkiego immunoglobulin w **chłoniaku Burkitta** (endemicznie w Afryce, z EBV). Grupy protoonkogenów: czynniki wzrostu (SIS – PDGF), receptory kinaz tyrozynowych (ERBB1/EGFR, ERBB2, **RET**, KIT, MET, FLT3), białka transdukcji (SRC, ABL, RAS, RAF, AKT, GSP), czynniki transkrypcyjne (MYC, FOS, JUN, RAR) oraz regulatory cyklu i apoptozy (cyklina D1, CDK4, **BCL2** w chłoniakach grudkowych, **MDM2** hamujące p53 w mięsakach).", "**Geny supresorowe** (hamulce proliferacji) wymagają **utraty obu alleli** (recesywnie na poziomie komórki, często przez **utratę heterozygotyczności – LOH**), ale predyspozycja dziedziczna ujawnia się klinicznie jako cecha dominująca. **RB** hamuje przejście z fazy G1 do S w punkcie restrykcyjnym przez wiązanie E2F. Jego inaktywację powoduje hiperfosforylacja przez kompleksy cyklina D–CDK4/6. Inhibitory INK4 (p16 – mutacje w ok. 3/4 raków trzustki) i p21/p27 hamują kinazy CDK. **TP53**, „strażnik genomu”, zatrzymuje cykl (p21), indukuje naprawę DNA, a przy nienaprawialnym uszkodzeniu apoptozę (BAX). Jest zmutowany w > 50% guzów litych. Mutacja TP53 daje oporność na radio- i chemioterapię. Mutacja germinalna TP53 to **zespół Li-Fraumeni**. Inne geny supresorowe: **APC** (degradacja β-kateniny), **PTEN** (hamuje szlak PI3K–AKT; zespół Cowdena), **NF1** (neurofibromina, białko GAP dla RAS), NF2 (merlina), **WT1** (guz Wilmsa), **VHL**, SMAD4, CDH1 (E-kadheryna; rodzinny rak żołądka). **Teoria dwóch uderzeń Knudsona** (siatkówczak) wyjaśnia, dlaczego postać dziedziczna występuje wcześniej, często obustronnie i wieloogniskowo. Geny „**odźwierni**” (*gatekeeper*: APC, RB, NF1, VHL) bezpośrednio kontrolują wzrost, a geny „**opiekunowie**” (*caretaker*: MMR, BRCA) odpowiadają za naprawę DNA. Do zmian epigenetycznych należą hipermetylacja promotorów genów supresorowych (przy ogólnej hipometylacji DNA guza), deacetylacja histonów (HDAC) i mikroRNA.", "**Wieloetapowa kancerogeneza** przebiega przez inicjację, promocję i progresję. **Sekwencja gruczolak–rak** (Vogelstein): **APC** (5q) → hipometylacja → **K-RAS** (12p) → utrata DCC/**SMAD4** (18q) → **TP53** (17p). Ok. 15% sporadycznych raków jelita grubego powstaje drogą **niestabilności mikrosatelitarnej**. **Nowotwory dziedziczne** stanowią ok. 10% wszystkich nowotworów. **Zespół Lyncha** (HNPCC) wynika z mutacji genów naprawy niesparowanych zasad (hMLH1, hMSH2 – ok. 60%). Ryzyko nowotworu wynosi ok. 80%: rak jelita grubego, endometrium, jajnika, żołądka, jelita cienkiego i nerki. **FAP** (germinalna mutacja APC) to tysiące polipów i ok. 1% raków jelita grubego. **BRCA1** (17q21) i **BRCA2** (13q12) uczestniczą w naprawie podwójnych pęknięć i rekombinacji homologicznej. Odpowiadają za dziedziczny rak piersi i jajnika (w Polsce bada się najczęstsze mutacje BRCA1). **MEN2** to wyjątek, bo mutacja przyrostu funkcji dotyczy protoonkogenu **RET**, z penetracją ok. 100% dla raka rdzeniastego tarczycy. Profilaktyczną tyreoidektomię wykonuje się w MEN2A w wieku ok. 5–6 lat, a w MEN2B wcześniej. Zespoły niestabilności DNA to ataksja-teleangiektazja (ATM), **zespół Nijmegen** (NBS1, częsty w Polsce), xeroderma pigmentosum, anemia Fanconiego i zespół Blooma. **Czynniki środowiskowe**: inicjator chemiczny wymaga aktywacji metabolicznej do elektrofila tworzącego addukty z DNA, a promotor musi działać po inicjatorze. Dym tytoniowy odpowiada za ok. 85% raków płuca. Promieniowanie jonizujące wywołuje białaczki (ok. 7 lat po ekspozycji) i raka tarczycy u dzieci (Czarnobyl, rearanżacje RET/PTC). UVB tworzy dimery pirymidynowe. Aflatoksyna B1 i HBV wywołują raka wątroby. Rakotwórcze wirusy to **HPV** (inaktywacja RB i p53), **EBV** (Burkitt, chłoniaki w immunosupresji, Hodgkin, rak nosogardła), HBV i **HTLV-1**. **Ucieczka immunologiczna** przebiega w 3 fazach: eliminacji, równowagi i ucieczki. Punkty kontrolne to **CTLA-4** (konkuruje z CD28 o CD80/86) i **PD-1/PD-L1** (apoptoza limfocytu T). Ich blokada jest podstawą immunoterapii. Mikrośrodowisko guza tworzą Treg, MDSC, makrofagi M2, TGF-β, IDO i PGE2."], "review": [{"h": "Cechy nowotworu złośliwego", "items": ["Rozrost autonomiczny, **monoklonalny**, nieustający po ustąpieniu bodźca", "Niezależność od sygnałów wzrostu; niewrażliwość na inhibitory; **oporność na apoptozę i anoikis**", "Nieograniczony potencjał replikacyjny – **reaktywacja telomerazy** (fizjologicznie w okresie płodowym)", "**Angiogeneza**: VEGF, FGF (+ HGF, angiopoetyny); inhibitory: angiostatyny, endostatyny", "**Efekt Warburga** – glikoliza zamiast oddychania tlenowego → PET (FDG)", "Niestabilność genomu, inwazja, przerzuty, unikanie układu odpornościowego, zapalenie promujące nowotwór, heterogenność", "**Przerzuty** – najważniejsza cecha złośliwości; drogi: krwionośna, chłonna, jamy ciała", "Rak = nowotwór złośliwy nabłonkowy; mięsak – mezenchymalny; białaczki i chłoniaki – z komórek ruchomych", "Anaplazja – brak zróżnicowania uniemożliwiający ustalenie tkanki wyjściowej", "Ektopowe wydzielanie: rak drobnokomórkowy płuca – **ACTH** (Cushing), **ADH** (SIADH); białko wywołujące hiperkalcemię; markery **CA 125** (jajnik), **CEA** (jelito grube)"]}, {"h": "Kinetyka wzrostu i biologia guza", "items": ["**30 podwojeń** → 1 g (~10⁹ komórek, ~1 cm³) – wykrywalność; **+10 podwojeń** → 1 kg (masa śmiertelna)", "Cykl komórkowy komórek nowotworu – nie krótszy niż prawidłowych", "**Frakcja wzrostowa** < 20% w jawnych guzach, 1–5% w litych rakach → słaba odpowiedź na cytostatyki; wysoka w chłoniakach", "Utrata komórek (apoptoza, martwica) – rak piersi i jelita grubego rosną wolno; czas podwojenia raka jelita/płuca ~2–3 mies.", "**Nowotworowe komórki macierzyste** – podziały asymetryczne; w AML < 0,01% komórek (CD34+)", "Inwazja: **metaloproteazy**, proteazy serynowe, katepsyny – głównie z komórek **podścieliska**; uwalniają czynniki wzrostu (IGF z IGFBP)", "Przerzut tworzy < 1/1000 komórek; komórki krążące pojawiają się przed przerzutami", "Subklony – heterogenność; przerzuty bardziej homogenne"]}, {"h": "Protoonkogeny i onkogeny", "items": ["Mutacje **przyrostu funkcji**, **dominujące** (jeden allel)", "Mechanizmy: **mutacja punktowa** (RAS kodon 12/61 – oporność na GAP, stale RAS-GTP), **amplifikacja** (N-MYC – neuroblastoma; ERBB2 – rak piersi), **nadekspresja** (EGFR – 80% raków płaskonabłonkowych płuca), **translokacja/inwersja**", "**t(9;22)** – chromosom Philadelphia, **BCR-ABL** → konstytutywna kinaza tyrozynowa → **przewlekła białaczka szpikowa**", "**t(8;14)** – **MYC** pod kontrolą promotora łańcucha ciężkiego Ig → **chłoniak Burkitta** (endemiczny – Afryka, EBV)", "Czynniki wzrostu: SIS (PDGF-B), INT-2/HST (FGF)", "Receptory (kinazy tyrozynowe): **ERBB1 (EGFR)**, **ERBB2 (HER2)** – 30% raków piersi, **RET** (rak rdzeniasty i brodawkowaty tarczycy, guz chromochłonny), KIT (GIST), MET, FGFR3, FLT3 (AML)", "Transdukcja: SRC, ABL (niereceptorowe); **RAS** (H-, K-, N-) → RAF → MEK → ERK; GSP (gruczolaki przysadki, tarczycy); AKT/PKB (antyapoptotycznie)", "Czynniki transkrypcyjne: **MYC** (+ Max), FOS, JUN, HOX, **RAR** (białaczka promielocytowa – PML-RARA)", "Cykl i apoptoza: **cyklina D1**, CDK4; **BCL2** (chłoniak grudkowy), BCL6 (chłoniak rozlany z dużych komórek B), **MDM2** (inaktywacja p53 – mięsaki)"]}, {"h": "Geny supresorowe", "items": ["Utrata funkcji obu alleli (recesywne komórkowo); predyspozycja kliniczna – **dominująca**", "Kryteria: hamowanie wzrostu/indukcja apoptozy, zespół dziedziczny przy mutacji germinalnej, LOH w guzach, mutacje obu alleli w guzach sporadycznych, fenotyp u myszy", "**RB**: wiąże **E2F** → blok G1/S w punkcie R; inaktywacja przez **hiperfosforylację** (cyklina D–CDK4/6); mutacje w ~40% nowotworów", "Inhibitory CDK: **INK4** (p15, **p16**, p18, p19 – cyklina D–CDK4/6); **p21, p27, p57** – wszystkie CDK; p16 – 3/4 raków trzustki, rodzinny czerniak", "**TP53** – „strażnik genomu”: **p21** (zatrzymanie cyklu), naprawa DNA (GADD45), **BAX** (apoptoza), MDM2 (sprzężenie zwrotne); t½ ~20 min", "TP53 zmutowany w > 50% guzów litych; mutacja negatywnie dominująca; **oporność na radio- i chemioterapię**; brak w guzie Wilmsa i raku jądra", "**Zespół Li-Fraumeni** – germinalna TP53: mięsaki, rak piersi, guzy mózgu, rak kory nadnerczy, białaczki", "**APC** – degradacja β-kateniny (brak → β-katenina/TCF → MYC, cyklina D1); FAP, rak jelita grubego", "**PTEN** – fosfataza PIP3 → hamuje AKT; zespół Cowdena", "**NF1** – neurofibromina (GAP → inaktywuje RAS); **NF2** – merlina (nerwiaki osłonkowe, oponiaki); **WT1** – guz Wilmsa; **VHL**; **SMAD4** (TGF-β); **CDH1** (E-kadheryna – rodzinny rak żołądka)", "Geny naprawy DNA: MMR (Lynch), **BRCA1/2**, **ATM** (ataksja-teleangiektazja), **NBS1** (Nijmegen – częsty w Polsce; chłoniaki B), XPA (xeroderma pigmentosum – UV), FANC (anemia Fanconiego), BLM (Bloom)"]}, {"h": "Kancerogeneza i nowotwory dziedziczne", "items": ["**Teoria dwóch uderzeń Knudsona** (siatkówczak, 1/20 000 dzieci; 1/3 dziedziczne): dziedziczny – 1 mutacja germinalna + 1 somatyczna (często delecja 13q14) → wcześniej, **obustronnie, wieloogniskowo**; nosiciele – ryzyko mięsaków kości", "**Sekwencja gruczolak–rak (Vogelstein)**: **APC (5q)** → hipometylacja/MYC → **K-RAS (12p)** → **DCC/SMAD4 (18q)** → **TP53 (17p)**; COX-2 – hamuje apoptozę, angiogeneza", "~15% sporadycznych raków jelita grubego – **niestabilność mikrosatelitarna**", "Nowotwory dziedziczne – ~10% wszystkich; rak piersi ~10% dziedziczny", "**Zespół Lyncha (HNPCC)**: geny MMR – **hMLH1, hMSH2** (~60%), hMSH6, PMS1/2; fenotyp mutatorowy, niestabilność mikrosatelitarna; ryzyko ~80%; rak jelita grubego, **endometrium**, jajnika, żołądka, jelita cienkiego, nerki", "**FAP**: germinalna APC, setki–tysiące polipów, ~1% raków jelita grubego; dziedziczenie kliniczne AD", "**BRCA1** (17q21) / **BRCA2** (13q12–13): naprawa podwójnych pęknięć, rekombinacja homologiczna; rak piersi (często < 30. r.ż.) i jajnika", "**MEN2**: mutacja aktywująca protoonkogen **RET** (wyjątek!), penetracja ~100%; MEN2A – rak rdzeniasty tarczycy + guz chromochłonny + nadczynność przytarczyc; MEN2B – + nerwiaki śluzówek; 20–25% raków rdzeniastych dziedzicznych → badanie RET u każdego chorego; profilaktyczna tyreoidektomia MEN2A ~5–6 lat, MEN2B wcześniej", "**Gatekeeper** (APC, RB, NF1, VHL) – 1 zdarzenie do inicjacji po mutacji germinalnej; **caretaker** (MMR, BRCA) – potrzeba 3 zdarzeń → późniejszy początek", "Epigenetyka: hipometylacja globalna + **hipermetylacja promotorów genów supresorowych** (p16, MLH1, BRCA1, CDH1); acetylacja histonów (HAT) aktywuje, **HDAC** wycisza; mikroRNA"]}, {"h": "Czynniki środowiskowe, wirusy, odporność", "items": ["Kancerogeneza chemiczna: **inicjacja** (mutacja; aktywacja metaboliczna do elektrofila → addukty DNA) → **promocja** (proliferacja; tylko po inicjacji) → progresja", "**Dym tytoniowy** – ~85% raków płuca; także jama ustna, krtań, przełyk, trzustka, pęcherz; polimorfizm CYP450 modyfikuje ryzyko", "Promieniowanie jonizujące: **białaczki** (średnio ~7 lat, nie CLL), **rak tarczycy u dzieci** (Czarnobyl – rearanżacje **RET/PTC**, rola niedoboru jodu), pierś, płuca, ślinianki", "**UVB** (280–320 nm) – **dimery pirymidynowe** → czerniak, raki skóry (mutacje TP53, RAS)", "Aflatoksyna B1 / HBV – rak wątroby (różne „odciski palców” mutacji TP53)", "Rak piersi: estrogeny (wczesna menarche, późna menopauza, nieródki, brak karmienia, otyłość); rak jelita grubego: dieta uboga w błonnik, bogata w tłuszcze i czerwone mięso, NChZJ", "Wirusy: **HPV** (rak szyjki – inaktywacja RB i degradacja p53; potrzebne dodatkowe mutacje), **EBV** (Burkitt, chłoniaki B w immunosupresji, Hodgkin, rak nosogardła), **HBV** (rak wątrobowokomórkowy), **HTLV-1** (białaczka T)", "Immunoredagowanie: **eliminacja → równowaga → ucieczka**", "Aktywacja limfocytu T: prezentacja antygenu (MHC–TCR) + kostymulacja (**CD28–CD80/86**)", "**CTLA-4** – konkuruje z CD28 o CD80/86 → hamuje aktywację; **PD-1** (limfocyt T) + **PD-L1/PD-L2** (komórka nowotworu) → apoptoza/wyczerpanie limfocytu → blokada = immunoterapia", "Mikrośrodowisko immunosupresyjne: **Treg**, **MDSC**, makrofagi M2, TGF-β, IL-10, VEGF, IDO, arginaza, PGE2; CD8+ w guzie – korzystne; dużo Treg – niekorzystne"]}], "cards": [{"q": "Jaka cecha jednoznacznie odróżnia nowotwór złośliwy od łagodnego?", "a": "**Zdolność do tworzenia przerzutów** (oraz inwazja miejscowa)."}, {"q": "Wymień główne cechy nowotworu złośliwego (hallmarks).", "a": "Niezależność od sygnałów wzrostu, niewrażliwość na inhibitory, oporność na apoptozę, nieograniczona replikacja, angiogeneza, inwazja i przerzuty, przestawienie metabolizmu (Warburg), niestabilność genomu, unikanie odpowiedzi immunologicznej, zapalenie promujące nowotwór."}, {"q": "Czym jest efekt Warburga i gdzie się go wykorzystuje?", "a": "Komórki nowotworowe czerpią energię głównie z **glikolizy** (nawet w obecności tlenu) – wykorzystywane w **PET** z FDG."}, {"q": "Czym jest anoikis?", "a": "Programowana śmierć komórki pozbawionej kontaktu z macierzą zewnątrzkomórkową; komórki nowotworowe są na nią oporne, co ułatwia przerzutowanie."}, {"q": "Jakie hormony może ektopowo wydzielać rak drobnokomórkowy płuca?", "a": "**ACTH** (zespół Cushinga) i **wazopresynę** (SIADH, hiponatremia)."}, {"q": "Ile podwojeń komórkowych potrzeba do powstania guza 1 g, a ile do 1 kg?", "a": "Ok. **30** podwojeń → 1 g (~10⁹ komórek, wykrywalny klinicznie); tylko **10 kolejnych** → 1 kg (masa śmiertelna)."}, {"q": "Czym jest frakcja wzrostowa guza i jakie ma znaczenie terapeutyczne?", "a": "Odsetek dzielących się komórek – w litych rakach często **1–5%**, w jawnych guzach < 20%. Cytostatyki działają na komórki proliferujące → słaba skuteczność w rakach, dobra w **chłoniakach**."}, {"q": "Na czym polega hipoteza nowotworowych komórek macierzystych?", "a": "Nieliczna frakcja komórek (np. < 0,01% w AML) zdolna do **samoodnawiania i podziałów asymetrycznych** odtwarza guz – bez ich zniszczenia wyleczenie nie jest możliwe."}, {"q": "Jakie są najsilniejsze czynniki proangiogenne guza?", "a": "**VEGF** i **FGF** (oraz HGF, angiopoetyny, efryny); hamują angiogenezę angiostatyny i endostatyny."}, {"q": "Jaką rolę w inwazji odgrywają metaloproteazy i kto je wydziela?", "a": "Trawią macierz i błonę podstawną, ułatwiają migrację i angiogenezę, uwalniają czynniki wzrostu (np. IGF); wydzielane głównie przez **komórki podścieliska** jako proenzymy."}, {"q": "Dlaczego komórki nowotworowe są „nieśmiertelne”?", "a": "Mają **reaktywowaną telomerazę**, która odbudowuje telomery – nie dochodzi do starzenia replikacyjnego."}, {"q": "Jaki charakter mają mutacje protoonkogenów?", "a": "**Przyrost funkcji**, **dominujące** (wystarczy jeden allel): mutacje punktowe, amplifikacja, nadekspresja, translokacje."}, {"q": "Jak mutacja RAS prowadzi do transformacji?", "a": "Mutacje (kodon **12** lub 61) czynią RAS niewrażliwym na **GAP** – białko pozostaje związane z **GTP** (stale aktywne) → ciągła stymulacja kaskady RAF–MEK–ERK."}, {"q": "Na czym polega translokacja t(9;22) i w jakiej chorobie występuje?", "a": "Powstaje **chromosom Philadelphia** z genem fuzyjnym **BCR-ABL** – konstytutywnie aktywna kinaza tyrozynowa → **przewlekła białaczka szpikowa**."}, {"q": "Jaka translokacja jest typowa dla chłoniaka Burkitta?", "a": "**t(8;14)** – **MYC** przeniesiony w sąsiedztwo genu łańcucha ciężkiego immunoglobulin → stała nadekspresja MYC; endemicznie u dzieci w Afryce, związek z **EBV**."}, {"q": "W jakich nowotworach występuje amplifikacja N-MYC i ERBB2 i co oznacza?", "a": "**N-MYC** – nerwiak zarodkowy (neuroblastoma, do 1200 kopii); **ERBB2 (HER2)** – rak piersi (~30%) i jajnika. W obu – **złe rokowanie**."}, {"q": "Jaką funkcję pełni białko BCL2 i gdzie jest nadeksprymowane?", "a": "Hamuje apoptozę (stosunek BCL2/BAX decyduje o przeżyciu komórki); nadekspresja – **chłoniak grudkowy**."}, {"q": "Jak MDM2 sprzyja nowotworzeniu?", "a": "Hamuje i kieruje do degradacji **p53**; nadekspresja MDM2 (np. w **mięsakach**) inaktywuje p53 bez mutacji TP53."}, {"q": "Czym jest utrata heterozygotyczności (LOH)?", "a": "Utrata drugiego, prawidłowego allelu genu supresorowego (najczęściej przez delecję) u osoby z jednym zmutowanym allelem – inaktywacja obu kopii."}, {"q": "Dlaczego predyspozycja do nowotworów z mutacji genów supresorowych dziedziczy się klinicznie dominująco?", "a": "Komórkowo mutacja jest recesywna, ale utrata drugiego allelu zdarza się tak często, że **już heterozygota ma bardzo wysokie ryzyko** nowotworu."}, {"q": "Jak białko RB kontroluje cykl komórkowy?", "a": "Aktywne (hipofosforylowane) RB wiąże **E2F** i blokuje przejście **G1→S** w punkcie restrykcyjnym R; **hiperfosforylacja** przez cyklinę D–CDK4/6 zwalnia blok."}, {"q": "Jak działają inhibitory INK4 i rodziny p21/p27?", "a": "**INK4 (p16, p15, p18, p19)** hamują kompleksy cykliny D z CDK4/6 → RB pozostaje aktywne. **p21, p27, p57** hamują wszystkie CDK."}, {"q": "Dlaczego TP53 nazywa się „strażnikiem genomu”?", "a": "Przy uszkodzeniu DNA p53 **zatrzymuje cykl w G1 (p21)**, indukuje **naprawę DNA**, a gdy uszkodzenie jest nienaprawialne – **apoptozę (BAX)**; zapobiega przekazaniu błędu komórkom potomnym."}, {"q": "Jakie znaczenie rokownicze ma mutacja TP53 w guzie?", "a": "**Niekorzystne** – brak apoptozy indukowanej uszkodzeniem DNA → **oporność na radio- i chemioterapię**."}, {"q": "Dlaczego zmutowane p53 łatwo wykryć immunohistochemicznie?", "a": "Prawidłowe p53 ma t½ ok. **20 minut**; formy zmutowane są degradowane wolniej i kumulują się w jądrze."}, {"q": "Czym jest zespół Li-Fraumeni?", "a": "Dziedziczny zespół z **germinalną mutacją TP53**: mięsaki tkanek miękkich i kości, rak piersi, guzy mózgu, rak kory nadnerczy w dzieciństwie, białaczki."}, {"q": "Jaka jest funkcja białka APC?", "a": "Tworzy kompleks z **β-kateniną** i ułatwia jej degradację; brak APC → β-katenina przechodzi do jądra i z TCF/LEF aktywuje **MYC i cyklinę D1**."}, {"q": "Jak działa PTEN jako gen supresorowy?", "a": "Fosfataza usuwająca fosforan z **PIP3** → hamuje aktywację kinazy **AKT/PKB** (przeżycie, wzrost, proliferacja); mutacja germinalna – zespół Cowdena."}, {"q": "Jak mutacja NF1 aktywuje szlak RAS?", "a": "NF1 koduje **neurofibrominę (GAP)**, która nasila aktywność GTP-azową RAS; jej brak utrzymuje RAS w formie aktywnej (GTP)."}, {"q": "Na czym polega teoria dwóch uderzeń Knudsona?", "a": "Do powstania nowotworu potrzebna jest inaktywacja **obu alleli** genu supresorowego. W postaci dziedzicznej jedna mutacja jest germinalna – wystarczy jedno zdarzenie somatyczne."}, {"q": "Czym różni się siatkówczak dziedziczny od sporadycznego?", "a": "Dziedziczny: **wcześniej**, częściej **obustronny i wieloogniskowy**, ryzyko innych nowotworów (mięsaki kości). Sporadyczny: później, jednostronny (obie mutacje somatyczne)."}, {"q": "Przedstaw sekwencję gruczolak–rak jelita grubego według Vogelsteina.", "a": "**APC (5q)** → hipometylacja DNA → **K-RAS (12p)** → utrata **DCC/SMAD4 (18q)** → **TP53 (17p)** → rak."}, {"q": "Jaki odsetek nowotworów ma charakter dziedziczny?", "a": "Ok. **10%** (podobnie ok. 10% raków piersi)."}, {"q": "Jaka jest przyczyna zespołu Lyncha i jakie nowotwory w nim występują?", "a": "Germinalne mutacje genów **naprawy niesparowanych zasad (MMR)** – hMLH1, hMSH2 (~60%), hMSH6, PMS2 → niestabilność mikrosatelitarna. Rak **jelita grubego** (bez polipowatości), **endometrium**, jajnika, żołądka, jelita cienkiego, nerki; ryzyko ~80%."}, {"q": "Czym jest rodzinna polipowatość gruczolakowata (FAP)?", "a": "Germinalna mutacja **APC** → setki–tysiące polipów jelita grubego, na których podłożu rozwija się rak; ~1% raków jelita grubego."}, {"q": "Jaka jest funkcja białek BRCA1 i BRCA2?", "a": "Naprawa **podwójnych pęknięć DNA** i **rekombinacja homologiczna**; mutacje germinalne → dziedziczny **rak piersi i jajnika** (BRCA1 – 17q21, BRCA2 – 13q12–13)."}, {"q": "Dlaczego MEN2 jest wyjątkiem wśród nowotworów dziedzicznych?", "a": "Mutacja germinalna dotyczy **protoonkogenu RET** (przyrost funkcji), a nie genu supresorowego; penetracja dla raka rdzeniastego tarczycy ~100%."}, {"q": "Jakie nowotwory wchodzą w skład MEN2A i MEN2B?", "a": "**MEN2A**: rak rdzeniasty tarczycy + guz chromochłonny + pierwotna nadczynność przytarczyc. **MEN2B**: rak rdzeniasty + guz chromochłonny + **nerwiaki błon śluzowych**."}, {"q": "Kiedy wykonuje się profilaktyczną tyreoidektomię u nosicieli mutacji RET?", "a": "W **MEN2A ok. 5.–6. r.ż.**, w **MEN2B jeszcze wcześniej** (szybki rozwój raka)."}, {"q": "Czym różnią się geny typu gatekeeper od caretaker?", "a": "**Gatekeeper** (APC, RB, NF1, VHL) – bezpośrednio kontrolują wzrost w danej tkance; ich utrata inicjuje nowotwór. **Caretaker** (MMR, BRCA) – nadzorują naprawę DNA; ich utrata tylko ułatwia kolejne mutacje."}, {"q": "Dlaczego siatkówczak dziedziczny pojawia się wcześniej niż dziedziczny rak jelita czy piersi?", "a": "Przy germinalnej mutacji genu **gatekeeper** (RB) wystarcza **jedno** zdarzenie; przy genie **caretaker** potrzebne są ~**3** (drugi allel opiekuna + oba allele odźwiernego)."}, {"q": "Jakie zmiany epigenetyczne sprzyjają nowotworom?", "a": "**Hipermetylacja promotorów genów supresorowych** (przy globalnej hipometylacji), **deacetylacja histonów** (HDAC – wyciszenie), zaburzenia mikroRNA i lncRNA."}, {"q": "Czym różni się inicjacja od promocji w kancerogenezie chemicznej?", "a": "**Inicjacja** – trwała zmiana DNA (mutacja). **Promocja** – pobudzenie proliferacji zainicjowanych komórek; działa tylko **po** inicjacji (nawet z opóźnieniem), nie przed nią."}, {"q": "Dlaczego kancerogeny chemiczne wymagają aktywacji metabolicznej?", "a": "Dopiero metabolity **elektrofilne** wiążą się kowalencyjnie z DNA, tworząc **addukty**; jeśli naprawa zawiedzie i nie dojdzie do apoptozy, mutacja się utrwala."}, {"q": "Jakie nowotwory wywołuje promieniowanie jonizujące?", "a": "Najwcześniej **białaczki** (średnio ~7 lat; nie CLL), **rak tarczycy u dzieci**, rak piersi, płuc, ślinianek."}, {"q": "Jaki mechanizm ma kancerogenne działanie UVB?", "a": "Tworzenie **dimerów pirymidynowych** w DNA (mutacje TP53, RAS) → czerniak i raki skóry; naprawę zaburza xeroderma pigmentosum."}, {"q": "Jakie mutacje stwierdzano w rakach tarczycy u dzieci po Czarnobylu?", "a": "**Rearanżacje RET/PTC** (fuzja domeny kinazowej RET z genem stale aktywnym w tyreocytach) – ostatecznie powiązane raczej z wiekiem dzieci niż z promieniowaniem."}, {"q": "Jaki odsetek raków płuca przypisuje się paleniu papierosów?", "a": "Ok. **85%**."}, {"q": "Jakie czynniki zwiększają ryzyko raka piersi?", "a": "Długa ekspozycja na estrogeny: **wczesna menarche, późna menopauza**, nieródki, brak karmienia piersią, **otyłość** (aromatyzacja w tkance tłuszczowej), dieta bogatotłuszczowa, predyspozycja genetyczna (~10%)."}, {"q": "Jak HPV przyczynia się do raka szyjki macicy?", "a": "Białka wirusowe **inaktywują RB** i nasilają **degradację p53**; DNA wirusa zintegrowane klonalnie, ale do transformacji potrzebne są dodatkowe mutacje (np. RAS)."}, {"q": "Z jakimi nowotworami wiąże się wirus Epsteina-Barr?", "a": "**Chłoniak Burkitta**, chłoniaki B w immunosupresji (HIV, przeszczepy), część przypadków **chłoniaka Hodgkina**, endemiczny **rak nosogardła**."}, {"q": "Który retrowirus jest jednoznacznie rakotwórczy u człowieka?", "a": "**HTLV-1** – białaczka/chłoniak z limfocytów T."}, {"q": "Jakie są fazy immunoredagowania nowotworu?", "a": "**Eliminacja** (nadzór immunologiczny) → **równowaga** → **ucieczka** (kliniczne ujawnienie nowotworu)."}, {"q": "Jak działa punkt kontrolny CTLA-4?", "a": "CTLA-4 na limfocycie T **konkuruje z CD28** o cząsteczki CD80/CD86 na komórkach prezentujących antygen → hamuje kostymulację i aktywację limfocytu T."}, {"q": "Jak działa oś PD-1/PD-L1?", "a": "**PD-L1/PD-L2** na komórce nowotworowej wiąże **PD-1** na limfocycie T → apoptoza/wyłączenie limfocytu; blokada tej interakcji przywraca odpowiedź przeciwnowotworową (immunoterapia)."}, {"q": "Jakie komórki i czynniki tworzą immunosupresyjne mikrośrodowisko guza?", "a": "**Limfocyty Treg**, **MDSC**, makrofagi M2; TGF-β, IL-10, VEGF, IDO, arginaza, NOS, PGE2, adenozyna."}, {"q": "Jakie znaczenie rokownicze ma skład nacieku limfocytarnego w guzie?", "a": "Obecność **CD8+** – korzystna; duża liczba **Treg** i limfocytów **B** – niekorzystna."}], "sources": []}, {"id": "z-krew", "num": "3", "title": "Układ krwiotwórczy", "summary": ["**Hemopoeza** przebiega w szpiku z wielopotencjalnej komórki macierzystej (CFU) pod wpływem czynników wzrostu (CSF, interleukin, EPO). Obejmuje namnażanie, różnicowanie i dojrzewanie. **Erytrocyt** żyje ok. **120 dni**. Energię czerpie z glikolizy beztlenowej. W cyklu Rapoporta-Lueberinga powstaje **2,3-DPG** (zmniejsza powinowactwo Hb do O₂), a cykl pentozowy (ok. 10% glukozy) dostarcza **NADPH** potrzebnego do odtwarzania glutationu. **EPO** wydzielana przez nerki w odpowiedzi na niedotlenienie hamuje apoptozę CFU-E. **Retikulocyty** odzwierciedlają aktywność erytropoezy. **Niedokrwistość** to Hb poniżej normy. Objawy ogólne: bladość, osłabienie, duszność wysiłkowa, tachykardia, szmer czynnościowy. Mechanizmy kompensacji to przesunięcie krzywej dysocjacji, krążenie hiperkinetyczne i tachypnoë. Podział **morfologiczny** (MCV, MCH): **mikrocytowa niedobarwliwa** (niedobór Fe, talasemia, syderoblastyczna), **normocytowa** (hemolityczne, aplastyczne, ostra utrata krwi, choroby przewlekłe), **makrocytowa** (niedobór B12 i folianów, choroby wątroby, MDS, niedoczynność tarczycy). Podział **etiopatogenetyczny**: utrata krwi, upośledzone wytwarzanie, hemoliza i niedokrwistości wtórne.", "**Niedokrwistość z niedoboru żelaza** jest najczęstsza. Przyczyny: przewlekłe krwawienia (przewód pokarmowy, obfite miesiączki), zwiększone zapotrzebowanie (wzrost, ciąża), zaburzenia wchłaniania i dieta. Z ok. 15 mg Fe w diecie wchłania się ok. 10%, w dwunastnicy, przez DMT1 (po redukcji przez Dcytb). Do krwi żelazo przechodzi przez **ferroportynę** (z hefajstyną). Transportuje je transferyna, a magazynowane jest jako ferrytyna i hemosyderyna. Kluczowy regulator to **hepcydyna** z wątroby, która **degraduje ferroportynę**, czyli zmniejsza wchłanianie i uwalnianie żelaza z makrofagów. Jej wytwarzanie spada przy niedoborze Fe i hipoksji (HIF) i rośnie w zapaleniu (IL-6). Kolejność zmian: najpierw spadają zapasy (↓ ferrytyny), potem ↓ Fe i ↑ TIBC, a na końcu pojawia się mikrocytowa niedobarwliwa niedokrwistość z anulocytami. Objawy swoiste: **koilonychia**, zajady, zanikowe zapalenie języka, zespół Plummera-Vinsona, niebieskie twardówki i **pica**. **Niedokrwistość syderoblastyczna** to zaburzenie wbudowywania żelaza w hem z **syderoblastami pierścieniowatymi**. Bywa wrodzona (syntaza ALA) lub nabyta (MDS, niedobór B6, izoniazyd, ołów). **Niedokrwistość chorób przewlekłych** wynika ze ↑ hepcydyny (blokada Fe w makrofagach), ↓ EPO pod wpływem IL-6 i skrócenia życia erytrocytów. W **PChN** główną przyczyną jest **niedobór EPO**.", "**Niedokrwistości megaloblastyczne** wynikają z niedoboru **B12** lub **kwasu foliowego**, kofaktorów syntezy DNA, co powoduje zaburzenie dojrzewania jądra względem cytoplazmy. Witamina B12 (z produktów zwierzęcych) wchłania się w **końcowym odcinku jelita krętego** z **czynnikiem Castle'a** (komórki okładzinowe). Jej zapasy w wątrobie wystarczają na lata, a zapasy folianów tylko na miesiące. Przyczyny niedoboru B12: zanikowe zapalenie żołądka, gastrektomia, choroba Crohna, bruzdogłowiec szeroki i dieta wegańska. Objawy: makrocytoza, pancytopenia, **hipersegmentacja neutrofilów**, bogatokomórkowy szpik megaloblastyczny, żółtawa skóra, **język Huntera** oraz objawy neurologiczne (zwyrodnienie **sznurów tylnych i bocznych**: zaburzenia czucia wibracji, ataksja, parestezje, otępienie). Objawy neurologiczne mogą wystąpić bez niedokrwistości i nie towarzyszą niedoborowi folianów. **Choroba Addisona-Biermera** to autoimmunologiczne zanikowe zapalenie żołądka z przeciwciałami przeciw komórkom okładzinowym i czynnikowi Castle'a, ze zwiększonym ryzykiem raka żołądka. **Niedokrwistość aplastyczna** to pancytopenia z „pustym” szpikiem zastąpionym tłuszczem (przyczyny: promieniowanie, benzen, leki, wirusy). Skutki to krwawienia, zakażenia i objawy anemii. **Aplazja czysto czerwonokrwinkowa** występuje m.in. w zakażeniu parwowirusem B19.", "**Niedokrwistości hemolityczne** to czas życia erytrocytów < 50 dni. Cechy laboratoryjne: **retikulocytoza**, ↑ LDH, ↑ bilirubiny pośredniej i urobilinogenu w moczu. Przyczyny wewnątrzkrwinkowe: **sferocytoza wrodzona** (AD, niedobór spektryny i ankyryny, ↓ oporności osmotycznej, niszczenie w śledzionie), **PNH** (nabyty niedobór kotwicy GPI, hemoliza zależna od dopełniacza w nocy przy niższym pH; może przejść w aplazję lub AML), **niedobór G6PD** (XR, hemoliza po lekach utleniających i bobie), **niedokrwistość sierpowata** (AR, Glu6Val w łańcuchu β, polimeryzacja HbS w hipoksji, zatory w mikrokrążeniu, przełomy) i **talasemia β** (minor: łagodna mikrocytoza z prawidłowym Fe i ↑ HbA2; major: ciężka niedokrwistość, hepatosplenomegalia, deformacje kości). Przyczyny zewnątrzkrwinkowe: mechaniczne (sztuczne zastawki), toksyczne i **immunologiczne** (przeciwciała ciepłe i zimne, **dodatni test Coombsa**). **Czerwienice wtórne** wynikają ze ↑ EPO: przy hipoksji (choroby płuc, sinicze wady serca) lub bez niej (guzy nerki i wątroby, zespół Cushinga, androgeny). Leukocytoza i leukopenia mają wiele przyczyn (zakażenia, GKS, zawał, leki: tyreostatyki, klozapina, metamizol, cytostatyki).", "**Nowotwory układu krwiotwórczego.** **AML** to blokada dojrzewania blastów, wyparcie prawidłowej hemopoezy i **przerwa białaczkowa**. Czynniki ryzyka: promieniowanie, benzen, wcześniejsza chemioterapia, MDS i MPN, zespół Downa i Fanconiego. Objawy: zakażenia, niedokrwistość, krwawienia i nacieki. **MDS** to nieefektywna hemopoeza z cytopeniami i nasiloną apoptozą prekursorów. U 20–30% chorych przechodzi w AML. **MPN** (mutacje JAK2 V617F, CALR, MPL) to: **PBSz** (Ph+/BCR-ABL, ogromna leukocytoza, splenomegalia, fazy przewlekła, akceleracji i blastyczna z > 30% blastów), **czerwienica prawdziwa** (JAK2, ↓ EPO, nadmierna lepkość krwi, zakrzepy, świąd po kąpieli, dna moczanowa, purpurowa twarz), **nadpłytkowość samoistna** (zakrzepy, erytromelalgia, krwawienia przy nabytym vWD) i **pierwotne włóknienie szpiku** (megakariocyty wydzielają PDGF, włóknienie, hemopoeza pozaszpikowa, splenomegalia). **ALL** wywodzi się z prekursorów B lub T (TdT+). **Chłoniaki** powstają głównie z limfocytów B, bo hipermutacje somatyczne i przełączanie klas w ośrodkach rozmnażania sprzyjają translokacjom: **t(14;18) BCL2** – chłoniak grudkowy (indolentny), **t(11;14) cyklina D1** – chłoniak z komórek płaszcza, **t(8;14) MYC** – Burkitt. **DLBCL** to najczęstszy chłoniak dorosłych (agresywny, często wyleczalny). **CLL** to najczęstsza białaczka dorosłych (limfocytoza > 5 G/l, CD5+/CD19+/CD23+, cienie Gumprechta, AIHA, złe rokowanie przy del17p i TP53). **Chłoniak Hodgkina**: komórki **Reed-Sternberga** (CD15+, CD30+), szczyty zachorowań w 20.–30. i po 50. r.ż., węzły śródpiersia, **objawy B** (gorączka Pela-Ebsteina, poty, utrata masy ciała) i świąd. Czynniki zakaźne chłoniaków: **EBV, HIV, HCV, HTLV-1, *H. pylori* (MALT)**. **Szpiczak mnogi** daje białko M i kryteria **CRAB** (hiperkalcemia, niewydolność nerek przez łańcuchy lekkie, niedokrwistość, osteoliza przez RANKL i IL-6). **MGUS** przechodzi w MM w ok. 1% rocznie.", "**Hemostaza** obejmuje naczynie, płytki i krzepnięcie z fibrynolizą. Śródbłonek działa przeciwzakrzepowo (prostacyklina, NO, siarczan heparanu, trombomodulina, t-PA), a uszkodzenie odsłania czynnik tkankowy. Płytki: **adhezja** (vWF–GPIb, zwłaszcza przy dużych siłach ścinania), **agregacja** (GPIIb/IIIa wiąże fibrynogen) i uwalnianie ziarnistości (ADP, serotonina, PF4, PDGF). Czynniki **II, VII, IX i X** (oraz białka C i S) wymagają **witaminy K** do γ-karboksylacji. Układ antykoagulacyjny tworzą antytrombina III, trombomodulina, białko C i białko S (inaktywują Va i VIIIa). Fibrynolizę prowadzą plazminogen, plazmina, t-PA i u-PA, a hamują α2-antyplazmina i PAI-1. **Skazy płytkowe** dają drobne wybroczyny i krwawienia z błon śluzowych. Należą tu małopłytkowości (z ↓ wytwarzania, z hipersplenizmu, **ITP** z przeciwciałami IgG przeciw glikoproteinom płytek i płytkami olbrzymimi, HIT, DIC, TTP/HUS) i trombopatie (**trombastenia Glanzmanna** – defekt GPIIb/IIIa, AR; choroba puli magazynowej; leki: ASA, NLPZ). **Skazy osoczowe** to krwiaki, **wylewy do stawów** i ↑ APTT. **Hemofilia A** (cz. VIII, 85%) i **B** (cz. IX) dziedziczą się XR i dają opóźnione krwawienia przy prawidłowym czopie płytkowym. **Choroba von Willebranda** to najczęstsza wrodzona skaza (zwykle AD; typ 1 – ilościowy, 80%; typ 2 – jakościowy; typ 3 – brak vWF). Skazy nabyte: **niedobór witaminy K** (choroby wątroby, cholestaza, antybiotyki, VKA, noworodki) i **DIC** (zużycie czynników i płytek, mikrozakrzepy, ↑ D-dimerów, ↓ fibrynogenu; przyczyny: sepsa, powikłania położnicze, urazy, nowotwory). **Skazy naczyniowe**: choroba Rendu-Oslera-Webera (AD, teleangiektazje), Ehlers-Danlos, Marfan, **zapalenie naczyń IgA (Schönleina-Henocha)** z plamicą na wyprostnych powierzchniach kończyn, bólami brzucha, krwiomoczem i bólami stawów, oraz szkorbut, GKS i amyloidoza. **Trombofilie** wrodzone to **czynnik V Leiden** (oporność na aktywne białko C), mutacja protrombiny G20210A i niedobory białka C, białka S i AT III. Nabyte to **zespół antyfosfolipidowy** i hiperhomocysteinemia."], "review": [{"h": "Erytrocyt i podział niedokrwistości", "items": ["Erytrocyt: ~**120 dni**, glikoliza beztlenowa; **2,3-DPG** (cykl Rapoporta-Lueberinga) ↓ powinowactwa Hb do O₂; cykl pentozowy (~10% glukozy) → **NADPH** (glutation, redukcja methemoglobiny)", "**EPO** – nerki, odpowiedź na hipoksję; hamuje apoptozę CFU-E", "Retikulocyty – aktywność erytropoezy (↑ w hemolizie i po krwotoku)", "Objawy ogólne: bladość, osłabienie, duszność, tachykardia, szmer skurczowy; kompensacja – krążenie hiperkinetyczne, przesunięcie krzywej dysocjacji", "**Mikrocytowa**: niedobór Fe, talasemia, syderoblastyczna (część), choroby przewlekłe (część)", "**Normocytowa**: hemolityczne, aplastyczne, ostra utrata krwi, choroby przewlekłe", "**Makrocytowa**: niedobór B12/folianów, choroby wątroby, MDS, niedoczynność tarczycy", "Ostra utrata krwi > 30% objętości → wstrząs; początkowo Hb i Ht prawidłowe, leukocytoza i trombocytoza; później niedokrwistość z retikulocytozą"]}, {"h": "Żelazo i niedokrwistości hipochromiczne", "items": ["Dieta ~15 mg Fe/d, wchłanianie ~10% (dwunastnica, górny odcinek jelita czczego); witamina C ↑, szczawiany i fityniany ↓", "**Dcytb** (redukcja Fe³⁺→Fe²⁺) → **DMT1** → enterocyt → **ferroportyna** + hefajstyna → transferyna", "**Hepcydyna** (wątroba) → internalizacja i degradacja **ferroportyny** → ↓ wchłaniania i uwalniania z makrofagów; ↓ przy niedoborze Fe i hipoksji (HIF), ↑ w zapaleniu (IL-6)", "Etapy niedoboru: ↓ zapasów (**ferrytyna**) → ↓ Fe, ↑ **TIBC**, ↓ wysycenia transferyny → mikrocytoza, anulocyty, anizo- i poikilocytoza", "Objawy: **koilonychia**, zajady, zanikowe zapalenie języka, **zespół Plummera-Vinsona**, niebieskie twardówki, **pica**", "Przyczyny: krwawienia (p. pokarmowy, obfite miesiączki), ciąża, wzrost, zaburzenia wchłaniania (resekcja żołądka, celiakia, NChZJ), dieta", "**Syderoblastyczna**: zaburzenie syntezy hemu, **syderoblasty pierścieniowate**; wrodzona (syntaza ALA) lub nabyta (MDS, niedobór B6, izoniazyd, ołów)", "**Choroby przewlekłe**: ↑ hepcydyny (Fe zablokowane w makrofagach), ↓ EPO (IL-6), skrócone życie erytrocytów; ferrytyna prawidłowa/↑", "**PChN**: głównie **niedobór EPO** (+ toksyny mocznicowe, krwawienia, ↑ hepcydyny)"]}, {"h": "Megaloblastyczne i aplastyczne", "items": ["Niedobór **B12/folianów** → zaburzenie syntezy DNA → asynchronia dojrzewania jądra i cytoplazmy", "B12: produkty zwierzęce, **czynnik Castle'a**, wchłanianie w **końcowym odcinku jelita krętego**; zapasy na lata (foliany – miesiące)", "Przyczyny niedoboru B12: zanik błony śluzowej żołądka, gastrektomia, choroba Crohna/resekcja jelita krętego, **bruzdogłowiec szeroki**, dieta wegańska", "Obraz: makrocytoza, pancytopenia, **hipersegmentacja neutrofilów**, szpik bogatokomórkowy megaloblastyczny, ↑ LDH, żółtawa skóra", "Neurologicznie (tylko B12): zwyrodnienie **sznurów tylnych i bocznych** (czucie wibracji, ataksja), parestezje, otępienie – mogą być bez niedokrwistości", "**Język Huntera** (gładki, czerwony, piekący), biegunki", "**Addison-Biermer**: autoimmunologiczne zanikowe zapalenie żołądka, przeciwciała przeciw komórkom okładzinowym i czynnikowi Castle'a, bezkwaśność, ↑ ryzyko **raka żołądka**", "**Aplastyczna**: pancytopenia, szpik „pusty” (tłuszcz); przyczyny – promieniowanie, benzen, rozpuszczalniki, leki (cytostatyki, tyreostatyki), wirusy", "**Aplazja czysto czerwonokrwinkowa** – m.in. parwowirus B19, chłoniaki, hemolizy"]}, {"h": "Niedokrwistości hemolityczne i czerwienice", "items": ["Hemoliza: czas życia < 50 dni; **retikulocytoza, ↑ LDH, ↑ bilirubiny pośredniej, ↑ urobilinogenu**; zewnątrz- (śledziona, wątroba) lub wewnątrznaczyniowa", "**Sferocytoza wrodzona**: AD, niedobór **spektryny/ankyryny**, ↓ oporności osmotycznej, niszczenie w śledzionie; czaszka wieżowata, przełomy hemolityczne, owrzodzenia podudzi", "**PNH**: nabyty niedobór kotwicy **GPI** → wrażliwość na dopełniacz; nocna hemoglobinuria (↓ pH we śnie), zakrzepica, pancytopenia, przejście w aplazję/AML", "**Niedobór G6PD**: XR, hemoliza po lekach (chlorochina), kwasicy, **bobie (fawizm)**", "**Sierpowata**: AR, **Glu→Val w pozycji 6 łańcucha β**; polimeryzacja HbS w hipoksji, kwasicy → sierpowacenie, zatory, hepatosplenomegalia, przełomy", "Hemoglobiny dorosłych: **HbA (α₂β₂) 95–98%**, HbA2 (α₂δ₂), HbF (α₂γ₂)", "**Talasemia β**: ↓ łańcuchów β, ↑ HbA2 (i HbF); minor – łagodna mikrocytoza, prawidłowe Fe, komórki tarczowate; major – ciężka niedokrwistość, hepatosplenomegalia, deformacje kości", "Zewnątrzkrwinkowe: mechaniczne (zastawki), toksyczne (ołów, jady), **immunologiczne** (ciepłe/zimne przeciwciała – **test Coombsa**), hipersplenizm", "**Czerwienice wtórne** (↑ EPO): hipoksja (choroby płuc, sinicze wady serca, wodonercze) lub bez hipoksji (guzy nerki i wątroby, Cushing, androgeny)", "Granulocytopenia polekowa: cytostatyki, **tyreostatyki**, karbamazepina, walproinian, **klozapina**, NLPZ, kotrimoksazol"]}, {"h": "Nowotwory mieloidalne", "items": ["**AML**: blokada dojrzewania, akumulacja blastów, **przerwa białaczkowa**; czynniki ryzyka – promieniowanie, **benzen**, palenie, chemioterapia (alkilujące, inhibitory topoizomerazy), MDS/MPN, zespół Downa, Fanconiego; objawy – zakażenia, anemia, krwawienia, nacieki (wątroba, śledziona, opony), bóle stawów", "**MDS**: nieefektywna hemopoeza, cytopenie, nasilona apoptoza prekursorów, hipermetylacja; dysplazja, syderoblasty pierścieniowate; **20–30% → AML**", "**MPN** – mutacje **JAK2 V617F** (ekson 12), **CALR**, **MPL**, CSF3R; ryzyko zakrzepicy i transformacji w AML", "**PBSz (CML)**: **Ph (t(9;22)) / BCR-ABL** u ~95%; leukocytoza do setek tysięcy, niedojrzałe granulocyty; **splenomegalia**; fazy: przewlekła → akceleracji → blastyczna (> 30% blastów); leukostaza", "**Czerwienica prawdziwa**: JAK2 V617F (nadwrażliwość na EPO), **↓ EPO w surowicy**, ↑ Ht, często leuko- i trombocytoza; lepkość → zakrzepy, bóle głowy, szumy uszne; **świąd po gorącej kąpieli** (histamina), dna i kamica moczanowa, purpurowosinicze zabarwienie twarzy, choroba wrzodowa", "**Nadpłytkowość samoistna**: płytki > 1000 G/l, JAK2/CALR/MPL; zakrzepy (także żył wątrobowych), **erytromelalgia**; krwawienia – nabyty niedobór vWF", "**Pierwotne włóknienie szpiku**: megakariocyty → **PDGF** → fibroblasty → włóknienie; **hemopoeza pozaszpikowa**, masywna splenomegalia, niedokrwistość; rozpoznanie – trepanobiopsja"]}, {"h": "Nowotwory limfoidalne", "items": ["**ALL**: prekursory B/T, TdT+, PAS+; nacieki OUN, bóle kostne", "Chłoniaki B częstsze niż T – **hipermutacje somatyczne** i **przełączanie klas** w ośrodkach rozmnażania → ryzyko translokacji", "Agresywne: **DLBCL** (najczęstszy u dorosłych; „triple hit” MYC+BCL2+BCL6 – złe rokowanie), Burkitt, chłoniak z komórek płaszcza; indolentne: **grudkowy** (t(14;18) BCL2, nieuleczalny, przeżycia > 15 lat), strefy brzeżnej/MALT, CLL/SLL, białaczka włochatokomórkowa", "Translokacje: **t(14;18) BCL2** – grudkowy; **t(11;14) CCND1** – płaszcza; **t(8;14) MYC** – Burkitt; t(4;14) FGFR3 – szpiczak", "Czynniki zakaźne: **EBV** (Burkitt, Hodgkin, DLBCL), **HHV-8** (Castleman, PEL), **HIV**, **HCV** (śledzionowy strefy brzeżnej), **HTLV-1** (ATLL), ***H. pylori* (MALT żołądka)**, *Chlamydia psittaci* (MALT oka), *Borrelia* (chłoniaki skóry), *P. falciparum* (Burkitt endemiczny); niedobory odporności (Wiskott-Aldrich, AT), immunosupresja", "**Objawy B**: utrata ≥ 10% masy w 6 mies., poty nocne, gorączka > 38°C ≥ 2 tyg.", "**CLL**: najczęstsza białaczka dorosłych; limfocytoza > 5 G/l, **CD5+, CD19+, CD23+**, **cienie Gumprechta**; AIHA w 5–10%; zła prognoza – **del17p/TP53**, del11q/ATM", "**Chłoniak Hodgkina**: z limfocytów B, **komórki Reed-Sternberga** (~2%) i mikrośrodowisko; cHL (~95%) **CD15+, CD30+**; NLPHL – CD20+; szczyty 20–30 i > 50 r.ż.; niebolesne węzły nadprzeponowe/śródpiersie, **gorączka Pela-Ebsteina**, poty, utrata masy, **świąd**", "Rozpoznanie chłoniaka – **wycięcie całego węzła** + histopatologia z immunohistochemią", "**Szpiczak mnogi**: plazmocyty, białko M; RANKL, IL-6 (osteoklasty ↑), DKK1, sklerostyna (osteoblasty ↓) → osteoliza; kryteria **CRAB**: hiperkalcemia, niewydolność nerek (łańcuchy lekkie), niedokrwistość, zmiany kostne; zespół nadlepkości", "**MGUS** → MM ~**1% rocznie**; szpiczak tlący się – bez objawów"]}, {"h": "Hemostaza i skazy krwotoczne", "items": ["Śródbłonek: **prostacyklina, NO** (antyagregacyjnie), glikokaliks (siarczan heparanu), **trombomodulina**, AT III, t-PA/u-PA, PAI-1, vWF, czynnik tkankowy w ścianie", "Płytki: ziarnistości α (PF4, β-TG, PDGF, P-selektyna, fibrynogen, cz. V), gęste (ADP, serotonina, Ca²⁺); **adhezja vWF–GPIb**, agregacja przez **GPIIb/IIIa**–fibrynogen", "Czynniki zależne od **wit. K**: **II, VII, IX, X** (+ białka C i S) – γ-karboksylacja Glu; kompleksy tenazy (IXa-VIIIa) i protrombinazy (Xa-Va)", "Antykoagulacja: **AT III** (wątroba), **trombomodulina** → aktywacja **białka C** (+ białko S) → inaktywacja Va i VIIIa", "Fibrynoliza: plazminogen → plazmina (t-PA, u-PA) → FDP/D-dimery; hamują α2-antyplazmina, PAI-1/2", "**Skazy płytkowe**: wybroczyny, krwawienia z nosa, dziąseł, dróg rodnych; objawy przy płytkach < 100 G/l", "Małopłytkowości: ↓ wytwarzania (aplazja, nacieki, leki, B12), przyspieszone niszczenie (**ITP** – IgG przeciw glikoproteinom, płytki olbrzymie; HIT; hipersplenizm), zużycie (DIC, TTP, HUS)", "Trombopatie: **trombastenia Glanzmanna** (GPIIb/IIIa, AR – brak agregacji i retrakcji), choroba puli magazynowej; nabyte – ASA, NLPZ, choroby wątroby, gammapatie", "**Skazy osoczowe**: krwiaki, **wylewy do stawów** (artropatia), ↑ **APTT** przy prawidłowym INR (hemofilie)", "**Hemofilia A** (cz. VIII, 85%), **B** (cz. IX, ~10%) – **XR**; opóźnione krwawienia mimo prawidłowego czopu płytkowego", "**Choroba von Willebranda** – najczęstsza wrodzona skaza, AD (12p); vWF – adhezja płytek, ochrona cz. VIII; typ 1 (80%) ilościowy, typ 2 jakościowy, typ 3 – brak", "**Niedobór wit. K**: choroby wątroby, cholestaza, zespoły złego wchłaniania, antybiotyki, VKA, noworodki", "**DIC**: aktywacja krzepnięcia i fibrynolizy → zużycie fibrynogenu, V, VIII, płytek; mikrozakrzepy (nerki, płuca, nadnercza) + krwawienia; ↑ APTT, ↑ INR, **↓ fibrynogenu, ↑ D-dimerów, ↓ płytek**; przyczyny – sepsa, położnicze, urazy, nowotwory, oparzenia, ostre zapalenie trzustki", "**Skazy naczyniowe**: **Rendu-Osler-Weber** (AD, teleangiektazje), Ehlers-Danlos, Marfan, OI; **zapalenie naczyń IgA (Schönlein-Henoch)** – plamica na wyprostnych powierzchniach kończyn, bóle brzucha, krwawe stolce, krwiomocz, bóle stawów (po infekcji); GKS, plamica starcza, amyloidoza, **szkorbut**", "**Trombofilie wrodzone**: **czynnik V Leiden** (oporność na aktywne białko C), protrombina **G20210A**, niedobory **białka C, S, AT III**; zakrzepy w nietypowych miejscach; nabyte – **zespół antyfosfolipidowy**, hiperhomocysteinemia"]}], "cards": [{"q": "Jak długo żyje erytrocyt i gdzie jest niszczony?", "a": "Średnio **120 dni**; niszczony w układzie siateczkowo-śródbłonkowym (głównie śledziona)."}, {"q": "Jaką rolę pełni 2,3-DPG w erytrocycie?", "a": "Powstaje w cyklu Rapoporta-Lueberinga i **zmniejsza powinowactwo hemoglobiny do tlenu** (ułatwia oddawanie O₂ tkankom)."}, {"q": "Do czego erytrocyt potrzebuje cyklu pentozowego?", "a": "Dostarcza **NADPH** – do odtwarzania zredukowanego glutationu i redukcji methemoglobiny (obrona przed stresem oksydacyjnym)."}, {"q": "Gdzie powstaje erytropoetyna i jak działa?", "a": "Głównie w **nerkach** w odpowiedzi na niedotlenienie; zapobiega apoptozie prekursorów erytroidalnych (CFU-E)."}, {"q": "Podaj podział niedokrwistości według MCV z przykładami.", "a": "**Mikrocytowe**: niedobór Fe, talasemia, syderoblastyczna. **Normocytowe**: hemolityczne, aplastyczne, ostra utrata krwi, choroby przewlekłe. **Makrocytowe**: niedobór B12/folianów, choroby wątroby, MDS, niedoczynność tarczycy."}, {"q": "Dlaczego tuż po ostrym krwotoku Hb i Ht mogą być prawidłowe?", "a": "Tracona jest krew pełna; rozcieńczenie przez napływ płynu tkankowego następuje stopniowo – niedokrwistość (z retikulocytozą) ujawnia się później."}, {"q": "Ile żelaza wchłania się z diety i gdzie?", "a": "Z ok. 15 mg dziennie – ok. **10%**, w **dwunastnicy i górnym odcinku jelita czczego** (DMT1, Dcytb)."}, {"q": "Jak hepcydyna reguluje gospodarkę żelazem?", "a": "Wiąże i powoduje degradację **ferroportyny** → ↓ wchłaniania Fe w jelicie i ↓ uwalniania z makrofagów. Jej synteza ↓ przy niedoborze Fe i hipoksji, ↑ w stanie zapalnym (IL-6)."}, {"q": "Jak zmieniają się parametry gospodarki żelazem w niedoborze żelaza?", "a": "↓ **ferrytyny** (najwcześniej), ↓ Fe, **↑ TIBC**, ↓ wysycenia transferyny; potem mikrocytoza i hipochromia."}, {"q": "Jakie są swoiste objawy przewlekłego niedoboru żelaza?", "a": "**Koilonychia** (paznokcie łyżeczkowate), zajady, zanikowe zapalenie języka, zaburzenia połykania (**zespół Plummera-Vinsona**), niebieskie twardówki, **pica**."}, {"q": "Czym charakteryzuje się niedokrwistość syderoblastyczna i jakie są jej przyczyny?", "a": "Zaburzenie wbudowywania żelaza w hem, nieefektywna erytropoeza, **syderoblasty pierścieniowate**. Wrodzona (syntaza ALA) lub nabyta: MDS, niedobór **B6**, **izoniazyd**, **ołów**."}, {"q": "Jaki jest mechanizm niedokrwistości chorób przewlekłych?", "a": "Zapalenie → **↑ hepcydyny** → żelazo zablokowane w makrofagach; IL-6 **↓ EPO**; skrócony czas życia erytrocytów."}, {"q": "Co jest główną przyczyną niedokrwistości w przewlekłej chorobie nerek?", "a": "**Niedobór erytropoetyny** (dodatkowo toksyny mocznicowe, krwawienia, ↑ hepcydyny)."}, {"q": "Gdzie wchłania się witamina B12 i co jest do tego potrzebne?", "a": "W **końcowym odcinku jelita krętego**, w kompleksie z **czynnikiem wewnętrznym Castle'a** wydzielanym przez komórki okładzinowe żołądka."}, {"q": "Dlaczego niedobór folianów ujawnia się szybciej niż niedobór B12?", "a": "Zapasy folianów wystarczają na **kilka miesięcy**, a B12 w wątrobie – na **wiele miesięcy–lata**."}, {"q": "Jakie są przyczyny niedoboru witaminy B12?", "a": "Zanik błony śluzowej żołądka (Addison-Biermer), gastrektomia, choroba Crohna/resekcja jelita krętego, **bruzdogłowiec szeroki**, dieta wegańska."}, {"q": "Jaki jest obraz krwi i szpiku w niedokrwistości megaloblastycznej?", "a": "Makrocytoza, aniso- i poikilocytoza, pancytopenia, **hipersegmentacja neutrofilów**; szpik bogatokomórkowy z megaloblastami (asynchronia dojrzewania jądra i cytoplazmy)."}, {"q": "Jakie objawy neurologiczne daje niedobór B12?", "a": "Zwyrodnienie **sznurów tylnych i bocznych** rdzenia: zaburzenia czucia wibracji, niestabilny chód, bolesne parestezje, otępienie, psychozy – mogą wystąpić bez niedokrwistości; nie występują w niedoborze folianów."}, {"q": "Czym jest choroba Addisona-Biermera?", "a": "Autoimmunologiczne zanikowe zapalenie żołądka z przeciwciałami przeciw **komórkom okładzinowym i czynnikowi Castle'a** → niedobór B12 + bezkwaśność; ↑ ryzyko **raka żołądka**."}, {"q": "Jakie są cechy niedokrwistości aplastycznej?", "a": "**Pancytopenia**, szpik ubogokomórkowy zastąpiony tłuszczem; objawy: skaza krwotoczna (małopłytkowość), ciężkie zakażenia (granulocytopenia), objawy anemii."}, {"q": "Jaki wirus wywołuje aplazję czysto czerwonokrwinkową?", "a": "**Parwowirus B19** (zwłaszcza u chorych z przewlekłą hemolizą – przełom aplastyczny)."}, {"q": "Jakie wykładniki laboratoryjne wskazują na hemolizę?", "a": "**Retikulocytoza**, ↑ **LDH**, ↑ **bilirubiny pośredniej**, ↑ urobilinogenu w moczu (↓ haptoglobiny)."}, {"q": "Jaki defekt powoduje sferocytozę wrodzoną?", "a": "Niedobór białek cytoszkieletu (**spektryny, ankyryny**) → kulisty kształt, ↓ oporności osmotycznej, niszczenie w śledzionie; dziedziczenie AD."}, {"q": "Jaki jest mechanizm nocnej napadowej hemoglobinurii?", "a": "Nabyty niedobór kotwicy **GPI** → brak białek chroniących przed **dopełniaczem**; hemoliza nasila się w nocy (↓ pH) → ciemny poranny mocz; może przejść w aplazję lub AML."}, {"q": "Jaka mutacja wywołuje niedokrwistość sierpowatą i co wyzwala sierpowacenie?", "a": "Zamiana **kwasu glutaminowego na walinę w pozycji 6 łańcucha β**; HbS polimeryzuje przy **hipoksji, kwasicy**, odwodnieniu, po alkoholu → zatory w mikrokrążeniu."}, {"q": "Jakie są prawidłowe hemoglobiny człowieka dorosłego?", "a": "**HbA (α₂β₂)** 95–98%, **HbA2 (α₂δ₂)** i śladowo **HbF (α₂γ₂)**."}, {"q": "Czym różni się talasemia minor od major?", "a": "**Minor** (heterozygoty): łagodna mikrocytowa niedokrwistość, **prawidłowe stężenie Fe**, komórki tarczowate, ↑ HbA2. **Major** (homozygoty): ciężka niedokrwistość, hepatosplenomegalia, deformacje kości, dawniej zgon przed 10. r.ż."}, {"q": "Co wykrywa test Coombsa?", "a": "Obecność **przeciwciał (lub dopełniacza) na erytrocytach** – niedokrwistości autoimmunohemolityczne (ciepłe i zimne)."}, {"q": "Jakie są przyczyny czerwienicy wtórnej?", "a": "↑ EPO z **hipoksji** (choroby płuc, sinicze wady serca, wodonercze, torbiele nerek) lub **bez hipoksji** (guzy nerki i wątroby wydzielające EPO, zespół Cushinga, androgeny)."}, {"q": "Czym jest przerwa białaczkowa (hiatus leukaemicus)?", "a": "Obecność we krwi/szpiku blastów i dojrzałych komórek przy **braku form pośrednich** – typowe dla ostrych białaczek."}, {"q": "Jakie są czynniki ryzyka AML?", "a": "Promieniowanie, radio- i chemioterapia (alkilujące, inhibitory topoizomerazy), **benzen**, palenie, MDS/MPN, aplazja, PNH, zespoły Downa i Fanconiego, wiek, płeć męska."}, {"q": "Czym są zespoły mielodysplastyczne?", "a": "Klonalne zaburzenia z **nieefektywną hemopoezą** (nasilona apoptoza prekursorów) i cytopeniami; dysplazja, syderoblasty pierścieniowate; **20–30% przechodzi w AML**."}, {"q": "Jakie mutacje są typowe dla nowotworów mieloproliferacyjnych?", "a": "**JAK2 V617F** (i ekson 12), **CALR**, **MPL**, CSF3R; w CML – **BCR-ABL**."}, {"q": "Jakie są fazy przewlekłej białaczki szpikowej?", "a": "**Przewlekła → akceleracji → blastyczna** (> 30% blastów we krwi)."}, {"q": "Jakie są objawy czerwienicy prawdziwej?", "a": "Purpurowosinicze zabarwienie twarzy i dłoni, bóle i zawroty głowy, szumy uszne, powikłania zakrzepowo-zatorowe, **świąd po gorącej kąpieli**, dna i kamica moczanowa, choroba wrzodowa, splenomegalia."}, {"q": "Jak zachowuje się stężenie EPO w czerwienicy prawdziwej, a jak we wtórnej?", "a": "W **prawdziwej – obniżone** (autonomiczna proliferacja, JAK2), we **wtórnej – podwyższone**."}, {"q": "Jakie są powikłania nadpłytkowości samoistnej?", "a": "Głównie **zakrzepowo-zatorowe** (udar, zawał, zakrzepica żył wątrobowych, **erytromelalgia**); rzadziej krwawienia – nabyty niedobór vWF przy bardzo wysokich płytkach."}, {"q": "Jaki jest mechanizm pierwotnego włóknienia szpiku?", "a": "Proliferujące megakariocyty wydzielają **PDGF** → aktywacja fibroblastów → kolagen i retikulina → włóknienie; **hemopoeza pozaszpikowa** i splenomegalia."}, {"q": "Dlaczego chłoniaki z komórek B są częstsze niż z komórek T?", "a": "Limfocyty B przechodzą **hipermutacje somatyczne** i **przełączanie klas** immunoglobulin – procesy z pękaniem DNA sprzyjające translokacjom."}, {"q": "Jakie translokacje są typowe dla chłoniaka grudkowego, z komórek płaszcza i Burkitta?", "a": "Grudkowy – **t(14;18) BCL2**; płaszcza – **t(11;14) cyklina D1 (CCND1)**; Burkitt – **t(8;14) MYC**."}, {"q": "Jakie drobnoustroje wiążą się z rozwojem chłoniaków?", "a": "**EBV**, HHV-8, **HIV**, **HCV**, **HTLV-1**, ***H. pylori*** (MALT żołądka), *Chlamydia psittaci*, *Borrelia burgdorferi*, *P. falciparum* (Burkitt endemiczny)."}, {"q": "Czym są objawy B w chłoniakach?", "a": "Utrata ≥ 10% masy ciała w 6 miesięcy, **poty nocne**, **gorączka > 38°C** utrzymująca się ≥ 2 tygodnie."}, {"q": "Jaki jest najczęstszy chłoniak dorosłych i co pogarsza rokowanie?", "a": "**DLBCL** (agresywny, ale często wyleczalny); rokowanie pogarsza **„triple hit”** – rearanżacje MYC, BCL2 i BCL6."}, {"q": "Jakie są cechy przewlekłej białaczki limfocytowej?", "a": "Najczęstsza białaczka dorosłych; limfocytoza **> 5 G/l**, fenotyp **CD5+, CD19+, CD23+**, **cienie Gumprechta**; AIHA w 5–10%; złe rokowanie – **del17p/TP53**, del11q/ATM."}, {"q": "Jakie są cechy chłoniaka Hodgkina?", "a": "Komórki **Reed-Sternberga** (cHL: **CD15+, CD30+**) w odczynowym mikrośrodowisku; szczyty 20–30 i > 50 r.ż.; niebolesne węzły nadprzeponowe/śródpiersia, gorączka **Pela-Ebsteina**, poty, utrata masy, **świąd**; związek z EBV i HIV."}, {"q": "Co oznacza akronim CRAB w szpiczaku mnogim?", "a": "**C**alcium – hiperkalcemia, **R**enal – niewydolność nerek (łańcuchy lekkie), **A**nemia, **B**ones – zmiany osteolityczne."}, {"q": "Jaki jest mechanizm osteolizy w szpiczaku?", "a": "Komórki szpiczaka wydzielają czynniki aktywujące osteoklasty (**RANKL, IL-6**) i hamujące osteoblasty (**DKK1, sklerostyna**)."}, {"q": "Jak często MGUS przechodzi w szpiczaka mnogiego?", "a": "Ok. **1% rocznie** – wymaga systematycznej kontroli."}, {"q": "Jakie substancje przeciwzakrzepowe wytwarza śródbłonek?", "a": "**Prostacyklinę, NO**, adenozynę, glikokaliks z siarczanem heparanu, **trombomodulinę**, AT III, t-PA."}, {"q": "Jakie glikoproteiny płytkowe odpowiadają za adhezję i agregację?", "a": "**Adhezja**: GPIb (wiąże **vWF**), GPIa/IIa (kolagen). **Agregacja**: **GPIIb/IIIa** – receptor fibrynogenu."}, {"q": "Które czynniki krzepnięcia zależą od witaminy K?", "a": "**II, VII, IX, X** oraz białka **C i S** (γ-karboksylacja reszt kwasu glutaminowego – wiązanie Ca²⁺)."}, {"q": "Jak działa układ białka C?", "a": "Trombina związana z **trombomoduliną** aktywuje **białko C**, które z **białkiem S** inaktywuje czynniki **Va i VIIIa**."}, {"q": "Czym różnią się objawy skaz płytkowych od osoczowych?", "a": "**Płytkowe**: drobne wybroczyny, krwawienia z błon śluzowych (nos, dziąsła, drogi rodne). **Osoczowe**: krwiaki, **wylewy do stawów** i mięśni, krwawienia po zabiegach, często opóźnione."}, {"q": "Czym jest małopłytkowość immunologiczna (ITP)?", "a": "Autoprzeciwciała **IgG przeciw glikoproteinom płytek** → niszczenie płytek w śledzionie (i ↓ trombopoezy); w rozmazie **płytki olbrzymie**."}, {"q": "Jaki defekt powoduje trombastenię Glanzmanna?", "a": "Brak/defekt **GPIIb/IIIa** (receptora fibrynogenu) → brak agregacji i retrakcji skrzepu; dziedziczenie AR."}, {"q": "Czym różni się hemofilia A od B i jak się dziedziczą?", "a": "**A** – niedobór **czynnika VIII** (85%), **B** – **czynnika IX** (~10%); obie **recesywnie sprzężone z X** (chorują mężczyźni)."}, {"q": "Dlaczego w hemofilii krwawienia są opóźnione?", "a": "Czop płytkowy powstaje prawidłowo, ale brak cz. VIII/IX uniemożliwia wytworzenie trombiny i fibryny – czop nie zostaje utrwalony."}, {"q": "Jaki wynik badań krzepnięcia jest typowy dla hemofilii?", "a": "**Wydłużony APTT (czas kaolinowo-kefalinowy)** przy prawidłowym INR i liczbie płytek."}, {"q": "Jaka jest najczęstsza wrodzona skaza krwotoczna i jakie są jej typy?", "a": "**Choroba von Willebranda** (AD, gen na 12p). Typ 1 – ilościowy niedobór (80%), typ 2 – jakościowy defekt vWF, typ 3 – brak vWF (z wtórnym ↓ cz. VIII)."}, {"q": "Jakie są przyczyny niedoboru witaminy K?", "a": "Choroby wątroby, **cholestaza** (żółtaczka mechaniczna), zespoły złego wchłaniania, antybiotyki niszczące florę jelitową, **antagoniści wit. K**, okres noworodkowy."}, {"q": "Jakie wyniki badań wskazują na DIC?", "a": "Wydłużony **APTT** i ↑ **INR**, **↓ fibrynogenu**, **↑ D-dimerów (FDP)**, **małopłytkowość**."}, {"q": "Jakie są przyczyny DIC?", "a": "**Sepsa**, powikłania położnicze, urazy, nowotwory, oparzenia, ukąszenia węży, **ostre zapalenie trzustki** – uwolnienie czynnika tkankowego, uszkodzenie śródbłonka."}, {"q": "Jakie są objawy zapalenia naczyń IgA (zespołu Schönleina-Henocha)?", "a": "**Plamica** na wyprostnych powierzchniach kończyn, **bóle brzucha** i krwawe stolce, **krwiomocz**, bóle i obrzęki stawów; zwykle po infekcji górnych dróg oddechowych."}, {"q": "Czym jest choroba Rendu-Oslera-Webera?", "a": "Wrodzona (AD) naczyniakowatość krwotoczna – zanik warstwy mięśniowej i sprężystej → **teleangiektazje** skóry i błon śluzowych, które krwawią; objawy nasilają się z wiekiem."}, {"q": "Jakie są wrodzone przyczyny trombofilii?", "a": "**Czynnik V Leiden** (oporność na aktywne białko C), mutacja **protrombiny G20210A**, niedobory **białka C, białka S, antytrombiny III**."}, {"q": "Jakie są nabyte trombofilie?", "a": "**Zespół antyfosfolipidowy** (przeciwciała antykardiolipinowe, antykoagulant toczniowy) i ciężka **hiperhomocysteinemia**."}], "sources": []}, {"id": "z-immuno", "num": "4", "title": "Wybrane zagadnienia z immunopatologii", "summary": ["**Odporność wrodzona** jest nieswoista, natychmiastowa i nie zależy od wcześniejszego kontaktu z antygenem. Tworzą ją bariery (ciągłość skóry i błon śluzowych, HCl w żołądku, ruch rzęsek, lizozym, kwaśny odczyn pochwy, mikrobiom), komórki (monocyty i makrofagi, komórki dendrytyczne, neutrofile, eozynofile, komórki NK) oraz układy humoralne (dopełniacz, białka ostrej fazy, cytokiny). Komórki rozpoznają **PAMP** (wzorce drobnoustrojów) i **DAMP** (wzorce uszkodzonych komórek) receptorami **PRR**. Najważniejsze z nich to **receptory Toll-podobne**: TLR2 (kwas lipotejchojowy bakterii Gram+, zymosan grzybów), **TLR4 (LPS Gram−)**, TLR5 (flagelina), TLR3 (dsRNA), TLR7 (ssRNA), TLR9 (DNA, CpG). **MHC/HLA** kodują geny na **chromosomie 6**. Klasa I (z β2-mikroglobuliną) występuje na prawie wszystkich komórkach jądrzastych (poza neuronami i plemnikami) i hamuje komórki NK. Klasa II występuje tylko na komórkach prezentujących antygen. Skojarzenia z HLA: **B27** (ZZSK, reaktywne zapalenie stawów, zapalenie błony naczyniowej), **DR3** (celiakia, Graves, cukrzyca typu 1), **DR4** (RZS), DR2 (SM), B5 (Behçet), A3 (hemochromatoza).", "**Cytokiny** przekazują sygnały między komórkami: IL-1, IL-6 i TNF-α (zapalenie, ostra faza), IL-2 (proliferacja T), IL-4 i IL-5 (Th2, limfocyty B, eozynofile), IL-8 (chemotaksja neutrofili), IL-12 (Th1, NK), IFN-γ (Th1, makrofagi), IL-10 i TGF-β (wyciszanie). Są celem **leków biologicznych**: anty-TNF (infliksymab, adalimumab, golimumab, białko fuzyjne etanercept), anty-IL-6R (tocilizumab), anty-IL-1 (anakinra), anty-IL-17 (sekukinumab), anty-IL-12/23 (ustekinumab), anty-CD20 (rytuksymab), abatacept (CTLA-4-Ig, blokuje kostymulację), anifrolumab (receptor IFN typu I), oraz **inhibitorów JAK** (tofacytynib, barycytynib, upadacytynib). **Białka ostrej fazy** wytwarza wątroba pod wpływem IL-6, IL-1 i TNF-α. **CRP i SAA** rosną > 1000 razy, haptoglobina i fibrynogen > 100 razy, a albumina spada (ujemne białko ostrej fazy). **Dopełniacz** (ok. 30 białek) aktywuje się drogą **klasyczną** (kompleksy IgG/IgM, C1q → C4b2a), **lektynową** (MBL) i **alternatywną** (samoistna hydroliza C3, czynnik B, properdyna). Wspólnym ogniwem jest **C3**, a efekty to **opsonizacja (C3b)**, **anafilatoksyny (C3a, C5a)** i **MAC (C5b–C9)**, który wywołuje lizę.", "**Odporność nabyta** jest swoista i ma pamięć. Antygeny wewnątrzkomórkowe są prezentowane z **MHC I limfocytom CD8+**, a zewnątrzkomórkowe z **MHC II limfocytom CD4+**. Aktywacja limfocytu T wymaga sygnału TCR–MHC i **kostymulacji** (CD28–CD80/86, LFA-1–ICAM-1), którą kontroluje CTLA-4. Th1 aktywują makrofagi, a Th2 wspierają wytwarzanie przeciwciał. **Immunoglobuliny**: **IgG** (70–75%, 4 podklasy, przechodzi przez łożysko, wiąże dopełniacz), **IgM** (ok. 10%, pentamer, pierwsza odpowiedź, wewnątrznaczyniowo), **IgA** (15–20%, wydzieliny, dimer), IgD (< 1%, na limfocytach B) i **IgE** (śladowo, na mastocytach i bazofilach; pasożyty, alergia). **Zapalenie** objawia się zaczerwienieniem, obrzękiem, ociepleniem, bólem i upośledzeniem funkcji. Mediatory: **eikozanoidy** (fosfolipaza A2 uwalnia kwas arachidonowy; **COX-1** konstytutywna chroni śluzówkę żołądka, **COX-2** indukowana w zapaleniu; prostaglandyny wywołują ból i gorączkę, **prostacyklina** rozszerza naczynia i hamuje płytki, **tromboksan** obkurcza naczynia i agreguje płytki; 5-lipoksygenaza wytwarza leukotrieny, a LTB4 przyciąga i przytwierdza leukocyty), **NO** (cGMP, rozszerzenie naczyń), **histamina** (H1: przepuszczalność, skurcz oskrzeli; H2: wydzielanie soku żołądkowego), kininy (bradykinina), reaktywne formy tlenu i **metaloproteinazy** (hamowane przez TIMP). Zapalenie wygaszają apoptoza i włóknienie.", "**Nadwrażliwość** według Coombsa i Gella. **Typ I** (natychmiastowa, anafilaktyczna): IgE na receptorach FcεRI mastocytów. Alergen łączy cząsteczki IgE, co uwalnia histaminę i inne mediatory (katar sienny, astma, uczulenie na jad owadów). **Typ II** (cytotoksyczny): IgG lub IgM przeciw antygenom komórek, dopełniacz i ADCC. Przykłady: reakcja poprzetoczeniowa, choroba hemolityczna noworodka, AIHA, zespół Goodpasture'a, miastenia, choroba Gravesa. **Typ III** (kompleksy immunologiczne): odkładanie kompleksów, dopełniacz, C3a i C5a. Przykłady: choroba posurowicza, **SLE**, krioglobulinemia w HCV, bakteryjne zapalenie wsierdzia. **Typ IV** (opóźniony, komórkowy, z limfocytami T i makrofagami) ma odmiany kontaktową (hapteny, komórki Langerhansa, wyprysk), tuberkulinową i **ziarniniakową** (gruźlica, trąd, sarkoidoza, choroba Crohna). **Autoimmunizacja** to złamanie tolerancji: niepełna eliminacja autoreaktywnych klonów, antygeny ukryte, **mimikra antygenowa** i predyspozycja HLA. Choroby dzielą się na narządowo nieswoiste i swoiste. Autoprzeciwciała wykrywa się immunofluorescencją pośrednią (przesiewowo, wzór świecenia) i metodami immunoenzymatycznymi (swoiście). **SLE**: anty-dsDNA i anty-Sm, kompleksy immunologiczne, leczenie hydroksychlorochiną, GKS, immunosupresją, belimumabem i anifrolumabem. **RZS**: zapalenie błony maziowej z łuszczką, czynnik reumatoidalny (IgM przeciw Fc IgG, nieswoisty) i **anty-CCP** (swoiste), leczenie metotreksatem i lekami biologicznymi. **Twardzina układowa**: włóknienie poprzedzone objawem Raynauda; **anty-Scl-70** w postaci uogólnionej, **antycentromerowe** w ograniczonej. **Zapalenia naczyń** dzieli się według kalibru: duże (Takayasu, olbrzymiokomórkowe), średnie (guzkowe zapalenie tętnic, Kawasaki) i małe (ANCA: **c-ANCA/PR3** – GPA, **p-ANCA/MPO** – MPA i EGPA). Miopatie zapalne: anty-Jo-1 (zespół antysyntetazowy), anty-Mi-2, często związek z nowotworem. Zapalenia narządowo swoiste: Hashimoto (anty-TPO, anty-Tg), Graves (**TRAb/TSI** stymulujące receptor TSH), choroba Addisona (APS-1 i APS-2), cukrzyca typu 1 (anty-GAD, ICA), anemia Addisona-Biermera, **miastenia** (przeciw receptorowi ACh), zespół Lamberta-Eatona (kanały wapniowe), Guillain-Barré (anty-GM1), pęcherzyca (desmogleiny), Goodpasture (błona podstawna).", "**Niedobory odporności.** Pierwotne występują z częstością ok. 1:10 000, a 50–65% z nich to niedobory przeciwciał. Niedobory limfocytów B dają zakażenia bakteriami otoczkowymi: **agammaglobulinemia Brutona** (XR, kinaza tyrozynowa BTK), **izolowany niedobór IgA** (najczęstszy), zespół hiper-IgM (defekt przełączania klas) i **CVID**. Niedobory limfocytów T dają zakażenia oportunistyczne od niemowlęctwa i powikłania po szczepionkach żywych (BCG): **SCID**, **zespół DiGeorge'a** (niedorozwój grasicy, 22q11), Wiskott-Aldrich (wyprysk, małopłytkowość, zakażenia), ataksja-teleangiektazja. Defekty fagocytozy: **przewlekła choroba ziarniniakowa** (niedobór **oksydazy NADPH**, brak wybuchu tlenowego, ropnie i ziarniniaki) i **LAD** (brak łańcucha β integryny CD18). Niedobory dopełniacza: niedobór **inhibitora C1** daje wrodzony obrzęk naczynioruchowy. Niedobory wtórne: **AIDS** (HIV wiąże gp120 z CD4, ubywa limfocytów Th; zakażenia oportunistyczne, mięsak Kaposiego, chłoniaki; leczenie ART) i **immunosupresja** (GKS; cytostatyki; azatiopryna hamuje syntezę puryn; mykofenolan hamuje dehydrogenazę IMP; **cyklosporyna i takrolimus** to inhibitory kalcyneuryny, które blokują NF-AT i IL-2; sirolimus hamuje mTOR; przeciwciała anty-IL-2R i anty-TNF). **Choroby autozapalne** (gorączki okresowe) to genetyczne zaburzenia odporności wrodzonej, np. inflamasomopatie z nadmiarem IL-1β i IL-18 (kriopirynopatie FCAS i NOMID, HIDS, PFAPA, **TRAPS**, DIRA). Przebiegają z nawracającą gorączką bez zakażenia, niewrażliwą na antybiotyki. W **odpowiedzi przeciwnowotworowej** antygeny dzielą się na swoiste i towarzyszące (onkopłodowe: **AFP, CEA**). Nowotwór unika odpowiedzi przez ↓ MHC I, ↓ kostymulacji, TGF-β i Treg. Immunoterapia obejmuje przeciwciała (rytuksymab), szczepionki z komórek dendrytycznych (sipuleucel-T), **inhibitory punktów kontrolnych** i komórki **CAR-T**. **Szczepionki**: żywe atenuowane, inaktywowane, podjednostkowe i rekombinowane, toksoidy oraz **mRNA** (w nanocząstkach lipidowych; nie wnika do jądra komórkowego)."], "review": [{"h": "Odporność wrodzona, PRR, HLA", "items": ["Bariery: skóra i błony śluzowe, kwasy tłuszczowe, **HCl**, ruch rzęsek, kwaśna pochwa, przepływ moczu, **lizozym**, mikrobiom (komensale)", "Komórki: monocyty/makrofagi, komórki dendrytyczne, neutrofile, eozynofile, **NK**; humoralnie – dopełniacz, białka ostrej fazy, cytokiny", "**PRR** rozpoznają **PAMP** (drobnoustroje) i **DAMP** (uszkodzone komórki); 3 klasy: wydzielane (opsoniny), powierzchniowe (endocytoza i prezentacja), sygnałowe", "**TLR**: TLR1/2 – lipoproteiny, kwas lipotejchojowy (Gram+), zymosan; **TLR4 – LPS (Gram−)**; TLR5 – flagelina; TLR6/10 – lipopeptydy prątków; wewnątrzkomórkowe: TLR3 – dsRNA, TLR7 – ssRNA, TLR8 – RNA bakterii, TLR9 – DNA", "**MHC/HLA** – chromosom 6, największy polimorfizm; **klasa I** (łańcuch α + β2-mikroglobulina) – wszystkie komórki jądrzaste (nie neurony, plemniki); **klasa II** (α+β) – komórki prezentujące antygen; klasa III – składowe dopełniacza", "MHC I hamuje NK (rozpoznanie „swój”); brak MHC I → zabicie przez NK", "HLA: **B27** – ZZSK (OR 70–150), reaktywne zapalenie stawów, zapalenie błony naczyniowej; **A3/B14** – hemochromatoza; B5 – Behçet; **DR2** – SM; **DR3** – celiakia, Graves, cukrzyca typu 1; **DR4** – RZS"]}, {"h": "Cytokiny, leki biologiczne, ostra faza, dopełniacz", "items": ["**IL-1, TNF-α, IL-6** – zapalenie i ostra faza; **IL-2** – proliferacja T; IL-3 – komórki macierzyste, mastocyty; **IL-4, IL-5** – Th2, B, eozynofile; IL-7 – progenitory; **IL-8** – chemotaksja neutrofili; IL-10 – wyciszanie; **IL-12** – Th1, NK; IFN-α/β – przeciwwirusowo, ↑ HLA; **IFN-γ** (Th1) – makrofagi; TGF-β – IgA, wyciszanie", "Anty-TNF: **infliksymab, adalimumab, golimumab**, **etanercept** (białko fuzyjne); anty-IL-6R: **tocilizumab**; anty-IL-1: anakinra; anty-IL-17: sekukinumab; anty-IL-12/23: ustekinumab; anty-HER2: trastuzumab", "**Rytuksymab** (anty-CD20), **abatacept** (CTLA-4-Ig – blokada kostymulacji), **belimumab** (anty-BLyS/BAFF), **anifrolumab** (receptor IFN typu I)", "**Inhibitory JAK** (jakinibi): tofacytynib, barycytynib, upadacytynib, ruksolitynib – szlak JAK-STAT", "Białka ostrej fazy (wątroba; IL-6, IL-1, TNF-α, IFN-γ): **CRP, SAA > 1000×**; haptoglobina, fibrynogen > 100×; α1-antytrypsyna, ceruloplazmina, α1-glikoproteina > 10×; **albumina ↓** (ujemne)", "CRP – opsonizacja, aktywacja dopełniacza drogą klasyczną", "Dopełniacz – ~30 białek, kaskada; **klasyczna** (IgG/IgM, C1q-C1r-C1s → C4b2a), **lektynowa** (MBL – cukry bakterii), **alternatywna** (samoistna hydroliza C3, czynnik B, properdyna – pętla wzmocnienia)", "Efekty: **C3b – opsonizacja**; **C3a, C5a – anafilatoksyny**; **C5b–C9 – MAC** (liza); usuwanie kompleksów immunologicznych", "Niedobory dopełniacza – zakażenia, autoimmunizacja; nadmierna aktywacja – sepsa, martwica"]}, {"h": "Odporność nabyta i immunoglobuliny", "items": ["Antygeny wewnątrzkomórkowe → **MHC I → CD8+** (cytotoksyczne); zewnątrzkomórkowe → **MHC II → CD4+** (pomocnicze)", "Aktywacja T: TCR–MHC/peptyd + **kostymulacja** (CD28–CD80/86, CD2–LFA-3, LFA-1–ICAM-1); hamuje **CTLA-4**", "Th1 – aktywacja makrofagów; Th2 – przeciwciała; antygeny grasiczoniezależne aktywują B bez T; **superantygeny** aktywują T bez prezentacji", "Limfocyty T – grasica; B – szpik (płodowo wątroba); NK – szpik (odporność wrodzona)", "Ig: 2 łańcuchy ciężkie + 2 lekkie (κ lub λ); region zmienny wiąże antygen, stały – funkcje efektorowe; klasa wg łańcucha ciężkiego (γ, μ, α, δ, ε)", "**IgG** 70–75% – 4 podklasy, **przechodzi przez łożysko**, wiąże dopełniacz", "**IgM** ~10% – **pentamer**, pierwsza odpowiedź, tylko wewnątrznaczyniowo, wiąże dopełniacz", "**IgA** 15–20% – wydzieliny (ślina, mleko, śluzówki), monomer/dimer", "**IgD** < 1% – powierzchnia limfocytów B; **IgE** – śladowo, na mastocytach/bazofilach; pasożyty, alergia"]}, {"h": "Zapalenie i mediatory", "items": ["Objawy: **rubor, tumor, calor, dolor, functio laesa**", "Inicjacja: płytki (uraz), TLR makrofagów (drobnoustroje), opsonizacja przez dopełniacz", "Komórki miejscowe: fibroblasty, makrofagi, śródbłonek, komórki dendrytyczne/Langerhansa; napływające – mastocyty, limfocyty, monocyty, **neutrofile**", "**Fosfolipaza A2** uwalnia kwas arachidonowy → **COX** → PG, prostacyklina, tromboksany; → **5-LOX** → leukotrieny; 15-LOX → lipoksyny (gojenie)", "**COX-1** konstytutywna (ochrona śluzówki żołądka), **COX-2** indukowana zapaleniem; NLPZ hamują COX, GKS – ekspresję COX-2 i PLA2", "PG: migracja komórek, ↑ wrażliwości na ból, gorączka, resorpcja kości; **prostacyklina** – rozszerzenie naczyń, ↓ agregacji; **tromboksan** – agregacja, skurcz", "**LTB4** – adhezja leukocytów, przepuszczalność, chemotaksja; leukotrieny cysteinylowe – skurcz oskrzeli", "**NO** (L-arginina, NOS → cGMP) – rozszerzenie naczyń (EDRF)", "**Histamina**: H1 – przepuszczalność żyłek, rozszerzenie naczyń, **skurcz oskrzeli**, śluz; H2 – **wydzielanie soku żołądkowego**; H3 – neuroprzekaźniki", "Kininy (kalikreina → bradykinina, receptor B2), RFT, **metaloproteinazy** (kolagenazy, żelatynazy, stromelizyny; hamuje **TIMP**)", "Zakończenie zapalenia: antyproteazy, cytokiny przeciwzapalne, **apoptoza** (bez zapalenia), **włóknienie**"]}, {"h": "Nadwrażliwość (Coombs i Gell)", "items": ["**Typ I** – natychmiastowa: **IgE** na FcεRI mastocytów, mostkowanie przez alergen → histamina, cytokiny; katar sienny, astma, anafilaksja, jad owadów; ↑ IgE w surowicy", "**Typ II** – cytotoksyczny: **IgG/IgM** przeciw antygenom komórek/macierzy → dopełniacz (MAC), makrofagi (FcγR), ADCC; reakcja poprzetoczeniowa, **choroba hemolityczna noworodka**, AIHA, Goodpasture, miastenia, Graves", "**Typ III** – kompleksy immunologiczne: nadmiar/niedostateczne usuwanie → odkładanie, dopełniacz, C3a/C5a; **choroba posurowicza**, **SLE**, krioglobulinemia (HCV), bakteryjne zapalenie wsierdzia, alveolitis alergiczne", "**Typ IV** – opóźniony, **komórkowy** (limfocyty T, makrofagi): **kontaktowy** (hapteny, komórki Langerhansa – wyprysk kontaktowy), **tuberkulinowy** (stwardnienie po PPD), **ziarniniakowy** (gruźlica, trąd, sarkoidoza, choroba Crohna)", "Ziarniniak immunologiczny: komórki nabłonkowate, makrofagi, **limfocyty**; wokół ciała obcego – bez limfocytów", "Nadwrażliwość nie występuje przy pierwszym kontakcie z antygenem"]}, {"h": "Autoimmunizacja i autoprzeciwciała", "items": ["Tolerancja – nabyta w rozwoju osobniczym; złamanie: niepełna eliminacja klonów w grasicy, **antygeny ukryte**, **mimikra antygenowa**, bezpośrednia stymulacja B; predyspozycja HLA", "Immunofluorescencja pośrednia – przesiew (wzór świecenia); metody immunoenzymatyczne – swoiste przeciwciała", "**SLE**: **anty-dsDNA, anty-Sm** (swoiste), antyhistonowe (toczeń polekowy), U1-RNP (MCTD); świecenie homogenne/obwodowe; kompleksy → kłębuszkowe zapalenie nerek, cytopenie, APS; leczenie – **hydroksychlorochina**, GKS, MMF, azatiopryna, cyklofosfamid, **rytuksymab, belimumab, anifrolumab**", "**Zespół Sjögrena**: **Ro/SS-A, La/SS-B**", "**RZS**: zapalenie błony maziowej, **łuszczka**, niszczenie chrząstki i kości; **czynnik reumatoidalny** (IgM przeciw Fc IgG – nieswoisty), **anty-CCP** (swoiste); leczenie – metotreksat, leflunomid, sulfasalazyna, hydroksychlorochina, anty-TNF, tocilizumab, abatacept, rytuksymab, JAKi", "**Twardzina układowa**: objaw Raynauda → włóknienie; **anty-Scl-70** (topoizomeraza I) – uogólniona; **antycentromerowe** – ograniczona; świecenie jąderkowe; anty-RNAP III; PM-Scl – zespół nakładania", "Zapalenie mięśni: **anty-Jo-1** (zespół antysyntetazowy + śródmiąższowe zapalenie płuc), anty-Mi-2, anty-MDA5, anty-TIF1γ (paraneoplazja)", "**Zapalenia naczyń**: duże (Takayasu, olbrzymiokomórkowe), średnie (guzkowe zapalenie tętnic, Kawasaki), małe (GPA, EGPA, MPA, krioglobulinemia, IgA); **c-ANCA (PR3) – GPA (Wegener)**; **p-ANCA (MPO) – MPA**, EGPA", "„Zespół miażdżycy przyspieszonej przez przewlekłe zapalenie” (CIEAS) – ↑ ryzyka sercowo-naczyniowego w chorobach autoimmunologicznych", "Narządowe: **Hashimoto** (anty-TPO, anty-Tg), **Graves** (TRAb/TSI pobudzające receptor TSH), **Addison** autoimmunologiczny (APS-1: + niedoczynność przytarczyc, kandydoza, niedokrwistość złośliwa; APS-2: + cukrzyca, choroby tarczycy), **cukrzyca typu 1** (anty-GAD, ICA 512), niedokrwistość złośliwa, **miastenia** (anty-AChR, ~90%), **Lambert-Eaton** (kanały Ca²⁺), Guillain-Barré (anty-GM1), pęcherzyca, **Goodpasture** (błona podstawna)", "AIHA: ciepłe **IgG** (często anty-Rh), zimne **IgM** (antygeny I/i, wiążą dopełniacz)"]}, {"h": "Niedobory odporności i inne", "items": ["Pierwotne ~1:10 000; **50–65% to niedobory przeciwciał**; objawy – częste, przewlekłe zakażenia, powikłania po szczepionkach żywych", "Niedobory B → **bakterie otoczkowe** (ropotwórcze); niedobory T → **zakażenia oportunistyczne**", "**Agammaglobulinemia Brutona** (XR, kinaza tyrozynowa BTK – brak dojrzałych B), **izolowany niedobór IgA**, **zespół hiper-IgM** (brak przełączania klas), **CVID** (zaburzenie współpracy T–B)", "**SCID**, **DiGeorge** (niedorozwój grasicy i przytarczyc, wady serca – 22q11), **Wiskott-Aldrich** (wyprysk, małopłytkowość, zakażenia), ataksja-teleangiektazja", "**Przewlekła choroba ziarniniakowa** – brak **oksydazy NADPH** (brak wybuchu tlenowego) → ropnie, ziarniniaki", "**LAD** – mutacja łańcucha β integryny (CD18) → brak adhezji i wiązania C3bi → zakażenia ropne", "Niedobór **inhibitora C1** → **wrodzony obrzęk naczynioruchowy** (najczęstszy defekt dopełniacza)", "**AIDS**: HIV-1/2, gp120 wiąże **CD4** → ↓ Th; drogi: płciowa, krew, wertykalna, zakłucia; zakażenia oportunistyczne, **mięsak Kaposiego**, chłoniaki; ART", "Immunosupresja: GKS, alkilujące, antymetabolity (**azatiopryna** – synteza puryn; **MMF** – dehydrogenaza IMP), **cyklosporyna/takrolimus** (kalcyneuryna → NF-AT → ↓ IL-2), **sirolimus** (mTOR), basiliksymab (anty-IL-2R), anty-TNF, surowica antylimfocytarna", "**Choroby autozapalne** (gorączki okresowe): defekty odporności wrodzonej; **inflamasomopatie** (↑ IL-1β, IL-18: kriopirynopatie – FCAS, NOMID, Muckle-Wells), HIDS, PFAPA, **TRAPS** (receptor TNF), DIRA, DITRA, CANDLE; nawracająca gorączka bez zakażenia, nie reaguje na antybiotyki", "Antygeny nowotworowe: swoiste (białka wirusowe) i towarzyszące (**onkopłodowe – AFP, CEA**); ucieczka: ↓ MHC I, ↓ kostymulacji, apoptoza limfocytów, TGF-β, Treg", "Immunoterapia: przeciwciała (rytuksymab), szczepionki z komórek dendrytycznych (**sipuleucel-T** – rak prostaty), **inhibitory punktów kontrolnych**, **CAR-T**", "Szczepionki: żywe atenuowane (polio doustna, świnka, różyczka, żółta febra, **BCG**), zabite (wścieklizna, grypa, krztusiec), fragmenty (otoczki pneumokoków), **toksoidy** (tężec), rekombinowane, **mRNA** (nanocząstki lipidowe; nie wnika do jądra, stymuluje odporność komórkową i humoralną)"]}], "cards": [{"q": "Czym różni się odporność wrodzona od nabytej?", "a": "**Wrodzona** – nieswoista, natychmiastowa, nie zależy od wcześniejszego kontaktu z antygenem. **Nabyta** – swoista, rozwija się przy kolejnych ekspozycjach dzięki **pamięci immunologicznej**."}, {"q": "Co to są PAMP, DAMP i PRR?", "a": "**PAMP** – wzorce molekularne drobnoustrojów; **DAMP** – wzorce uszkodzonych/martwych komórek własnych; **PRR** – receptory rozpoznające te wzorce (np. TLR)."}, {"q": "Który receptor Toll-podobny rozpoznaje LPS bakterii Gram-ujemnych?", "a": "**TLR4**."}, {"q": "Jakie struktury rozpoznają wewnątrzkomórkowe TLR?", "a": "**TLR3** – dsRNA wirusów, **TLR7** – ssRNA, **TLR8** – RNA bakterii, **TLR9** – DNA (motywy CpG)."}, {"q": "Na jakim chromosomie leżą geny HLA i gdzie występują białka klasy I i II?", "a": "**Chromosom 6**. Klasa I – prawie wszystkie komórki jądrzaste (bez neuronów i plemników); klasa II – tylko **komórki prezentujące antygen**."}, {"q": "Jaką rolę odgrywa MHC klasy I w działaniu komórek NK?", "a": "Rozpoznanie własnych cząsteczek MHC I **hamuje** komórki NK; komórki bez MHC I (np. zakażone, nowotworowe) są przez nie zabijane."}, {"q": "Z jakimi chorobami wiąże się HLA-B27?", "a": "**Zesztywniające zapalenie stawów kręgosłupa** (największe ryzyko), reaktywne zapalenie stawów, zapalenie
