Statyny** (atorwastatyna, **rosuwastatyna**, symwastatyna, prawastatyna, fluwastatyna, pitawastatyna) hamują **reduktazę HMG-CoA**, kluczowy enzym syntezy cholesterolu. W hepatocytach przybywa wtedy **receptorów LDL** i spada stężenie **LDL-C** (o 30–50% przy umiarkowanej intensywności i ≥ 50% przy dużej: atorwastatyna 40–80 mg, rosuwastatyna 20–40 mg). Działają też plejotropowo (stabilizują blaszkę, przeciwzapalnie) i zmniejszają ryzyko zdarzeń sercowo-naczyniowych. Działania niepożądane: **bóle mięśni (SAMS)**, **miopatia i rabdomioliza** (z kontrolą CK), wzrost aminotransferaz (rzadko istotne uszkodzenie wątroby), nieznacznie większe ryzyko cukrzycy, a rzadko miopatia martwicza o podłożu immunologicznym. Według PRAC (2023) statyny mogą też wywołać lub nasilić **miastenię**. Są **przeciwwskazane w ciąży** i w czynnej chorobie wątroby.", "**Ryzyko miopatii po statynach** rośnie przy inhibitorach **CYP3A4** (klarytromycyna, azole, rytonawir, sok grejpfrutowy, werapamil, diltiazem, amiodaron). Dotyczy to **symwastatyny, lowastatyny i atorwastatyny**. Rośnie też przy połączeniu z gemfibrozylem (przeciwwskazanym ze statynami), cyklosporyną, kolchicyną, w niedoczynności tarczycy, niewydolności nerek i u osób starszych. Prawastatyna i rosuwastatyna nie są metabolizowane przez CYP3A4. **Ezetymib** hamuje białko **NPC1L1**, czyli wchłanianie cholesterolu w jelicie, i obniża LDL o około 20%. Zwykle łączy się go ze statyną. **Inhibitory PCSK9**: przeciwciała **ewolokumab i alirokumab** podawane podskórnie (obniżają LDL o ~60%) oraz **inklisiran** (siRNA podawany co 6 miesięcy). Spowalniają degradację receptorów LDL. **Kwas bempedoinowy** hamuje liazę ATP-cytrynianową i aktywuje się tylko w wątrobie, więc nie wywołuje bólów mięśni, ale może podnosić kwas moczowy.", "**Fibraty** (fenofibrat, gemfibrozyl, bezafibrat) są agonistami **PPAR-α**. Zwiększają aktywność lipazy lipoproteinowej, **obniżają triglicerydy** (o 30–50%) i podnoszą HDL. Stosuje się je w ciężkiej hipertriglicerydemii, w której zapobiegają ostremu zapaleniu trzustki. Mogą wywoływać miopatię (zwłaszcza **gemfibrozyl ze statyną**), kamicę żółciową i wzrost kreatyniny (fenofibrat), a także nasilają działanie warfaryny. **Żywice jonowymienne** (kolestyramina, kolesewelam, kolestypol) wiążą kwasy żółciowe w jelicie. Mogą jednak **podnosić triglicerydy**, wywołują zaparcia i wzdęcia oraz **zmniejszają wchłanianie** innych leków (warfaryny, digoksyny, lewotyroksyny i witamin ADEK), dlatego zachowuje się odstępy. Kolestyraminę stosuje się też w świądzie przy cholestazie i w biegunce po kwasach żółciowych. **Kwasy omega-3** (ester etylowy kwasu eikozapentaenowego, ikozapent) obniżają TG. Niacyna ma dziś znikome znaczenie (zaczerwienienie, hiperglikemia, hiperurykemia). Celem leczenia są wartości LDL-C zależne od ryzyka (np. < 55 mg/dl przy bardzo wysokim ryzyku).", "**Leki stosowane w osteoporozie**: podstawą jest **wapń i witamina D** (cholekalcyferol). **Bisfosfoniany** (alendronian, ryzedronian, ibandronian, **kwas zoledronowy** dożylnie raz w roku) **hamują osteoklasty** (alendronian hamuje syntazę pirofosforanu farnezylu). Doustne trzeba przyjmować **na czczo, popijając pełną szklanką wody, w pozycji pionowej przez 30 minut**, bez jedzenia i innych leków, bo grożą **zapaleniem przełyku**. Rzadkie powikłania to **martwica kości szczęki** (głównie po dużych dawkach dożylnych w onkologii), **atypowe złamania kości udowej** i reakcja ostrej fazy po podaniu dożylnym. Są przeciwwskazane przy hipokalcemii i niskim GFR. **Denosumab** (przeciwciało anty-RANKL podawane podskórnie co 6 miesięcy) zmniejsza aktywność osteoklastów, ale po odstawieniu następuje **efekt z odbicia** (złamania kręgów), dlatego trzeba kontynuować leczenie bisfosfonianem. Może wywołać hipokalcemię. **Teryparatyd** i abaloparatyd to analogi PTH podawane przerywanie, które działają **anabolicznie**. **Romosozumab** (anty-sklerostyna) też działa anabolicznie, ale wiąże się z ryzykiem sercowo-naczyniowym. Inne leki: **raloksyfen** (SERM, zwiększa ryzyko ŻChZZ), **kalcytonina** (dziś ograniczona z powodu ryzyka nowotworów), sole fluoru i ranelinian strontu (wycofany z powodu ryzyka sercowo-naczyniowego) oraz HTZ.", "**Leki stosowane w otyłości** (przy BMI ≥ 30 albo ≥ 27 z chorobami towarzyszącymi, zawsze ze zmianą stylu życia): **agoniści GLP-1** (liraglutyd 3 mg, **semaglutyd 2,4 mg** raz w tygodniu) i **tirzepatyd** (GIP/GLP-1) dają największy spadek masy ciała (15–20%). **Orlistat** hamuje **lipazy** żołądkowo-jelitowe (wydala się ~30% tłuszczu) i powoduje tłuszczowe stolce, nietrzymanie stolca oraz niedobór witamin ADEK. **Naltrekson z bupropionem** działa ośrodkowo, zmniejszając łaknienie, ale podnosi RR i obniża próg drgawkowy. Wycofano sibutraminę (zdarzenia sercowo-naczyniowe), rimonabant (depresja, samobójstwa) i fenfluraminę (wady zastawek, nadciśnienie płucne) jako leki odchudzające."], "review": [{"h": "Statyny", "items": ["Hamują **reduktazę HMG-CoA** → ↓ syntezy cholesterolu → **↑ receptorów LDL** w wątrobie → ↓ LDL-C", "Duża intensywność: **atorwastatyna 40–80 mg, rosuwastatyna 20–40 mg** (↓ LDL ≥ 50%)", "Działania plejotropowe: stabilizacja blaszki, przeciwzapalne, poprawa funkcji śródbłonka", "Działania: **bóle mięśni**, **miopatia**, **rabdomioliza** (CK > 10× GGN, mioglobinuria), ↑ AlAT/AspAT, ↑ ryzyka cukrzycy, IMNM (anty-HMGCR)", "PRAC 2023: statyny mogą **wywołać lub nasilić miastenię** (także oczną) → przy nasileniu odstawić", "Metabolizm: **CYP3A4** – symwastatyna, lowastatyna, atorwastatyna; **nie CYP3A4** – prawastatyna, rosuwastatyna (fluwastatyna – CYP2C9)", "↑ ryzyka miopatii: **klarytromycyna, azole, rytonawir, sok grejpfrutowy, werapamil, diltiazem, amiodaron**, **gemfibrozyl**, cyklosporyna, kolchicyna, niedoczynność tarczycy, niewydolność nerek, wiek", "Przeciwwskazania: **ciąża i karmienie**, czynna choroba wątroby", "Krótko działające (symwastatyna) – wieczorem; atorwastatyna/rosuwastatyna – o dowolnej porze"]}, {"h": "Ezetymib, PCSK9, kwas bempedoinowy", "items": ["**Ezetymib** – hamuje **NPC1L1** (wchłanianie cholesterolu w jelicie) → LDL ↓ ~20%; zwykle + statyna", "**Ewolokumab, alirokumab** – przeciwciała **anty-PCSK9** s.c. co 2–4 tyg. → ↓ degradacji receptorów LDL → LDL ↓ ~60%", "**Inklisiran** – siRNA hamujące syntezę PCSK9; s.c. co 6 mies.", "**Kwas bempedoinowy** – hamuje liazę ATP-cytrynianową; prolek aktywowany tylko w wątrobie (brak w mięśniach) → **bez bólów mięśni**; ↑ kwasu moczowego", "Cel LDL-C: bardzo wysokie ryzyko **< 55 mg/dl** i ↓ ≥ 50%; wysokie < 70 mg/dl"]}, {"h": "Fibraty, żywice, omega-3", "items": ["**Fibraty** (fenofibrat, gemfibrozyl, bezafibrat) – agoniści **PPAR-α** → ↑ lipazy lipoproteinowej → **↓ TG 30–50%**, ↑ HDL", "Wskazanie: ciężka **hipertriglicerydemia** (prewencja zapalenia trzustki), dyslipidemia aterogenna", "Fibraty: miopatia (**gemfibrozyl + statyna – przeciwwskazane**; fenofibrat bezpieczniejszy), **kamica żółciowa**, ↑ kreatyniny, ↑ działania **warfaryny**", "**Żywice** (kolestyramina, kolestypol, kolesewelam) – wiążą kwasy żółciowe → ↑ syntezy kwasów żółciowych z cholesterolu", "Żywice: **↑ TG**, zaparcia, wzdęcia; **↓ wchłaniania** warfaryny, digoksyny, lewotyroksyny, wit. ADEK → odstęp 1 h przed / 4 h po", "Kolestyramina – też **świąd w cholestazie**, biegunka po kwasach żółciowych, przyspieszenie eliminacji leflunomidu", "**Kwasy omega-3** (ikozapent etylu) – ↓ TG; niacyna – zaczerwienienie (prostaglandyny), hiperglikemia, hiperurykemia (dziś marginalna)"]}, {"h": "Osteoporoza", "items": ["Podstawa: **wapń + witamina D**", "**Bisfosfoniany**: alendronian (1×/tydz.), ryzedronian, ibandronian (1×/mies., i.v. co 3 mies.), **kwas zoledronowy** (i.v. 1×/rok) – hamują osteoklasty (syntaza pirofosforanu farnezylu)", "Przyjmowanie doustnych: **na czczo**, pełna szklanka **wody**, **pozycja pionowa 30 min**, bez jedzenia/leków/wapnia (biodostępność < 1%)", "Działania: **zapalenie i owrzodzenie przełyku**, **martwica kości szczęki** (onkologia, i.v., zabiegi stomatologiczne), **atypowe złamania podkrętarzowe kości udowej**, reakcja ostrej fazy (i.v.), hipokalcemia; przeciwwskazane przy GFR < 30–35", "„Wakacje lekowe” po 3–5 latach (wg ryzyka)", "**Denosumab** – anty-**RANKL**, s.c. co 6 mies.; **po odstawieniu – efekt z odbicia** (mnogie złamania kręgów) → kontynuacja bisfosfonianem; hipokalcemia (PChN)", "**Teryparatyd, abaloparatyd** – analogi PTH s.c. codziennie → działanie **anaboliczne** (max 24 mies.)", "**Romosozumab** – anty-sklerostyna (anabolicznie + antyresorpcyjnie); ↑ ryzyka zawału i udaru", "**Raloksyfen** – SERM: ↓ złamań kręgów, ↓ raka piersi; ↑ **ŻChZZ**, uderzenia gorąca", "**Kalcytonina** – dziś ograniczona (ryzyko nowotworów); **ranelinian strontu** – wycofany (ryzyko sercowo-naczyniowe, DRESS); sole fluoru – marginalne"]}, {"h": "Otyłość", "items": ["Wskazania: **BMI ≥ 30** lub **≥ 27** z chorobami towarzyszącymi + dieta i aktywność", "**Semaglutyd 2,4 mg/tydz.**, **liraglutyd 3 mg/d** – agoniści GLP-1; **tirzepatyd** (GIP/GLP-1) – największy ↓ masy (15–20%)", "**Orlistat** – inhibitor **lipazy** trzustkowej i żołądkowej (↓ wchłaniania tłuszczu ~30%): **tłuszczowe stolce**, parcie, nietrzymanie stolca, niedobór **wit. ADEK**; ↓ wchłaniania cyklosporyny, lewotyroksyny", "**Naltrekson + bupropion** – ośrodkowo (POMC); ↑ RR, nudności, ↓ progu drgawkowego", "Wycofane: **sibutramina** (zawały, udary), **rimonabant** (depresja, samobójstwa), **fenfluramina** (wady zastawek, nadciśnienie płucne)"]}], "cards": [{"q": "Jaki jest mechanizm działania statyn?", "a": "Hamują **reduktazę HMG-CoA** → ↓ syntezy cholesterolu w wątrobie → **↑ ekspresji receptorów LDL** → ↑ wychwytu LDL z krwi."}, {"q": "Które statyny i w jakich dawkach to terapia o dużej intensywności?", "a": "**Atorwastatyna 40–80 mg** i **rosuwastatyna 20–40 mg** (↓ LDL-C o ≥ 50%)."}, {"q": "Jakie są działania niepożądane statyn?", "a": "**Bóle mięśni**, miopatia, **rabdomioliza**, ↑ aminotransferaz, niewielki ↑ ryzyka cukrzycy, rzadko immunologiczna miopatia martwicza; wg PRAC 2023 – wywołanie/nasilenie **miastenii**."}, {"q": "Które statyny są metabolizowane przez CYP3A4, a które nie?", "a": "**CYP3A4**: symwastatyna, lowastatyna, atorwastatyna. **Nie przez CYP3A4**: **prawastatyna, rosuwastatyna** (fluwastatyna – CYP2C9)."}, {"q": "Jakie leki zwiększają ryzyko rabdomiolizy w połączeniu z symwastatyną?", "a": "**Klarytromycyna, erytromycyna, azole, rytonawir**, sok grejpfrutowy, **werapamil, diltiazem, amiodaron**, cyklosporyna, **gemfibrozyl**, kolchicyna."}, {"q": "Dlaczego statyny są przeciwwskazane w ciąży?", "a": "Cholesterol jest niezbędny do rozwoju płodu (synteza błon, steroidów) – ryzyko wad; także w karmieniu piersią."}, {"q": "Jakie ostrzeżenie dotyczące statyn wprowadził PRAC w 2023 r.?", "a": "Statyny mogą **wywołać lub nasilić miastenię** (także oczną) – przy nasileniu objawów lek należy odstawić."}, {"q": "Jaki jest mechanizm działania ezetymibu?", "a": "Hamuje białko **NPC1L1** w rąbku szczoteczkowym jelita → ↓ **wchłaniania cholesterolu** (LDL ↓ ok. 20%)."}, {"q": "Jak działają inhibitory PCSK9?", "a": "PCSK9 kieruje receptory LDL do degradacji; **przeciwciała (ewolokumab, alirokumab)** lub **siRNA (inklisiran)** zmniejszają aktywność PCSK9 → więcej receptorów LDL → LDL ↓ ok. 50–60%."}, {"q": "Czym wyróżnia się kwas bempedoinowy?", "a": "Hamuje **liazę ATP-cytrynianową** (wcześniej niż statyny w szlaku); aktywowany tylko w **wątrobie** → nie powoduje bólów mięśni; może ↑ kwasu moczowego."}, {"q": "Jaki jest mechanizm działania fibratów i ich główne wskazanie?", "a": "Agoniści **PPAR-α** → ↑ lipazy lipoproteinowej, ↓ TG (30–50%), ↑ HDL. Wskazanie: **ciężka hipertriglicerydemia** (zapobieganie zapaleniu trzustki)."}, {"q": "Którego fibratu nie łączy się ze statyną i dlaczego?", "a": "**Gemfibrozylu** – hamuje glukuronidację statyn → duże ryzyko **rabdomiolizy**; fenofibrat jest bezpieczniejszy."}, {"q": "Jakie są działania niepożądane żywic jonowymiennych?", "a": "Zaparcia, wzdęcia, **↑ triglicerydów**, ↓ wchłaniania witamin ADEK i wielu leków (warfaryny, digoksyny, lewotyroksyny)."}, {"q": "Jak należy przyjmować leki razem z kolestyraminą?", "a": "Inne leki **1 h przed lub 4–6 h po** kolestyraminie (wiąże je w jelicie)."}, {"q": "Jaki jest mechanizm działania bisfosfonianów?", "a": "Wbudowują się w hydroksyapatyt i **hamują osteoklasty** (azotowe bisfosfoniany – syntazę pirofosforanu farnezylu) → ↓ resorpcji kości."}, {"q": "Jak prawidłowo przyjmować alendronian?", "a": "**Rano na czczo**, popić **pełną szklanką zwykłej wody**, pozostać w **pozycji pionowej przez 30 min**, nie jeść ani nie przyjmować innych leków (wapnia) przez ten czas."}, {"q": "Jakie są rzadkie, ale ciężkie powikłania leczenia bisfosfonianami?", "a": "**Martwica kości szczęki** (zwłaszcza duże dawki i.v. w onkologii, zabiegi stomatologiczne) i **atypowe złamania kości udowej**; ponadto zapalenie przełyku (doustne), reakcja ostrej fazy (i.v.)."}, {"q": "Jaki jest mechanizm działania denosumabu?", "a": "Przeciwciało monoklonalne przeciw **RANKL** → hamowanie tworzenia i aktywności osteoklastów; s.c. co 6 miesięcy."}, {"q": "Co grozi po odstawieniu denosumabu?", "a": "**Efekt z odbicia** – szybka utrata masy kostnej i **mnogie złamania kręgów** → po zakończeniu trzeba podać bisfosfonian."}, {"q": "Jak działa teryparatyd?", "a": "Analog **PTH** podawany **przerywanie** (s.c. raz dziennie) → przewaga działania **anabolicznego** (pobudzenie osteoblastów); maksymalnie 24 miesiące."}, {"q": "Jakie są korzyści i ryzyka raloksyfenu?", "a": "SERM: ↓ złamań kręgów, ↓ ryzyka inwazyjnego raka piersi; ryzyka – **żylna choroba zakrzepowo-zatorowa**, uderzenia gorąca, kurcze łydek."}, {"q": "Jaki jest mechanizm działania orlistatu i jego działania niepożądane?", "a": "Hamuje **lipazy** trzustkową i żołądkową → ↓ wchłaniania tłuszczu. Działania: **tłuszczowe stolce**, parcie na stolec, nietrzymanie stolca, niedobór witamin **ADEK**."}, {"q": "Które leki najskuteczniej zmniejszają masę ciała?", "a": "Agoniści GLP-1 (**semaglutyd 2,4 mg** raz w tygodniu, liraglutyd 3 mg) i **tirzepatyd** (GIP/GLP-1) – ↓ masy ciała o ok. 15–20%."}, {"q": "Dlaczego wycofano sibutraminę i rimonabant?", "a": "**Sibutramina** – ↑ ryzyka zawału serca i udaru. **Rimonabant** (antagonista CB1) – depresja i myśli samobójcze."}], "sources": [{"t": "AkdÄ Drug Safety Mail 2023-51 – statyny a miastenia (zalecenie PRAC/EMA, 2023)", "u": "https://www.akdae.de/arzneimittelsicherheit/drug-safety-mail/newsdetail/drug-safety-mail-2023-51"}]}, {"id": "f-hormony-plciowe", "num": "F22", "title": "Hormony płciowe, leki przeciwhormonalne i antykoncepcja", "summary": ["**Estrogeny**: estradiol, walerianian estradiolu, estriol, etynyloestradiol (syntetyczny, silny, odporny na metabolizm wątrobowy) i estrogeny skoniugowane. Działają przez receptory jądrowe ERα i ERβ. Wskazania: **hormonalna terapia zastępcza (HTZ)** w objawach menopauzy (uderzenia gorąca, atrofia pochwy), hipogonadyzm i antykoncepcja. Kobietom z zachowaną macicą zawsze podaje się estrogen **razem z progestagenem**, bo sam estrogen powoduje rozrost i raka endometrium. Ryzyka: **żylna choroba zakrzepowo-zatorowa** (mniejsza przy podaniu przezskórnym), rak piersi (HTZ złożona, długotrwała), udar, kamica żółciowa. Przeciwwskazania: ŻChZZ w wywiadzie, trombofilia, rak piersi i endometrium, niewyjaśnione krwawienie z dróg rodnych, czynna choroba wątroby, przebyty zawał lub udar. **SERM**: tamoksyfen (rak piersi), raloksyfen (osteoporoza), klomifen (indukcja owulacji) i bazedoksyfen. **Inhibitory aromatazy** (letrozol, anastrozol) stosuje się w raku piersi, a letrozol także w indukcji owulacji w PCOS.", "**Progestageny**: progesteron, dydrogesteron, medroksyprogesteron, lewonorgestrel, desogestrel, gestoden, dienogest, drospirenon (antymineralokortykoidowy i antyandrogenny) i octan cyproteronu (silnie antyandrogenny). Wskazania: ochrona endometrium w HTZ, antykoncepcja, endometrioza, zaburzenia miesiączkowania i wsparcie fazy lutealnej. **Mifepryston** (antagonista receptora progesteronu) z mizoprostolem służy do farmakologicznego przerwania ciąży, a **octan uliprystalu** (selektywny modulator receptora progesteronu, do 120 h) i **lewonorgestrel** (1,5 mg, najlepiej do 72 h) do antykoncepcji awaryjnej.", "**Antykoncepcja hormonalna złożona (estrogen z progestagenem)** hamuje owulację (spada FSH i LH), zagęszcza śluz szyjkowy i zmienia endometrium. Ma postać tabletek, plastrów i krążków. Najważniejsze ryzyko to **ŻChZZ**: według MHRA i EMA (2014) na 10 000 kobiet rocznie przypada około **2 przypadków u niestosujących**, **5–7** przy lewonorgestrelu, noretysteronie i norgestymacie oraz **9–12** przy gestodenie, desogestrelu i drospirenonie. Najwyższe ryzyko występuje w pierwszym roku stosowania. Rośnie też ryzyko zawału i udaru, zwłaszcza u palaczek > 35 lat i przy migrenie z aurą. Przeciwwskazania: ŻChZZ w wywiadzie lub trombofilia, migrena z aurą, palenie > 15 papierosów dziennie powyżej 35 r.ż., niekontrolowane nadciśnienie, choroba niedokrwienna, rak piersi, ciężka choroba wątroby i okres do 6 tygodni po porodzie przy karmieniu piersią. Skuteczność zmniejszają **induktory enzymów** (ryfampicyna, karbamazepina, fenytoina, ziele dziurawca) oraz wymioty i biegunka. Korzyści dodatkowe to mniejsze ryzyko raka jajnika i endometrium oraz regulacja cyklu.", "**Antykoncepcja jednoskładnikowa (progestagenna)**: tabletki z desogestrelem lub drospirenonem, implant z etonogestrelem, zastrzyki z medroksyprogesteronem (zmniejszają gęstość kości) i wkładka z lewonorgestrelem. Można ją stosować u kobiet z przeciwwskazaniem do estrogenów, w tym karmiących piersią. Główną wadą są nieregularne krwawienia. **Androgeny**: testosteron (żele, plastry, zastrzyki) w **hipogonadyzmie męskim**. Działania niepożądane to czerwienica (kontrola hematokrytu), trądzik, zatrzymanie płynów, zahamowanie spermatogenezy i ryzyko nadużywania (sterydy anaboliczne). Testosteron jest przeciwwskazany przy raku prostaty i piersi u mężczyzn.", "**Antyandrogeny**: **octan cyproteronu** (antyandrogen i progestagen, stosowany w hirsutyzmie, trądziku i raku prostaty). Według EMA (2020) zwiększa ryzyko **oponiaka**, zależne od dawki kumulacyjnej. Dawki ≥ 10 mg/d stosuje się tylko po niepowodzeniu innych metod, a przebyty oponiak jest przeciwwskazaniem, także dla preparatów złożonych w małej dawce. Inne antyandrogeny: niesteroidowe (bikalutamid, flutamid, enzalutamid, apalutamid w raku prostaty; flutamid jest hepatotoksyczny), **abirateron** (inhibitor CYP17), **inhibitory 5α-reduktazy** (finasteryd i dutasteryd w łagodnym rozroście prostaty i łysieniu androgenowym; zmniejszają PSA o ok. 50%, wywołują zaburzenia seksualne i są teratogenne dla płodu męskiego), spironolakton oraz **analogi GnRH** (goserelina, leuprorelina, tryptorelina; po początkowym wyrzucie hormonów hamują oś przysadkowo-gonadową, czyli wykonują kastrację farmakologiczną) i antagoniści GnRH (degareliks, relugoliks). W zaburzeniach erekcji stosuje się **inhibitory PDE-5** (sildenafil, tadalafil), których **nie wolno łączyć z azotanami**."], "review": [{"h": "Estrogeny i HTZ", "items": ["Estradiol, walerianian estradiolu, estriol (miejscowo), **etynyloestradiol** (syntetyczny – antykoncepcja), estrogeny skoniugowane", "Receptory jądrowe **ERα/ERβ**", "HTZ: objawy wypadowe, atrofia pochwy, prewencja osteoporozy; **z zachowaną macicą zawsze + progestagen** (ochrona endometrium)", "Ryzyka: **ŻChZZ** (mniejsza przy podaniu **przezskórnym**), **rak piersi** (HTZ złożona, > 5 lat), udar, rak endometrium (estrogen sam), kamica żółciowa", "Działania: tkliwość piersi, nudności, bóle głowy, krwawienia", "Przeciwwskazania: ŻChZZ/trombofilia, **rak piersi/endometrium**, niewyjaśnione krwawienie z dróg rodnych, czynna choroba wątroby, przebyty zawał/udar, porfiria", "**SERM**: tamoksyfen (pierś – antagonista; macica – agonista), **raloksyfen** (kość +, pierś –, macica neutralnie), **klomifen** (podwzgórze – antagonista → ↑ FSH/LH → owulacja), bazedoksyfen", "**Inhibitory aromatazy**: letrozol, anastrozol, eksemestan – rak piersi u kobiet po menopauzie; letrozol – indukcja owulacji (PCOS)"]}, {"h": "Progestageny i antyprogestageny", "items": ["Progesteron (naturalny – wsparcie fazy lutealnej, zagrażający poród przedwczesny), **dydrogesteron**, medroksyprogesteron, noretysteron, **lewonorgestrel**, **desogestrel**, gestoden, **dienogest** (endometrioza), **drospirenon** (antymineralokortykoidowy i antyandrogenny), **octan cyproteronu** (silnie antyandrogenny)", "Wskazania: ochrona endometrium (HTZ), antykoncepcja, endometrioza, zaburzenia miesiączkowania, krwawienia czynnościowe", "**Mifepryston** – antagonista receptora progesteronu (+ mizoprostol – przerwanie ciąży)", "Antykoncepcja awaryjna: **lewonorgestrel 1,5 mg** (najlepiej ≤ 72 h), **octan uliprystalu** 30 mg (≤ **120 h**), wkładka miedziana (≤ 5 dni)"]}, {"h": "Antykoncepcja złożona", "items": ["Mechanizm: **hamowanie owulacji** (↓ FSH, LH), zagęszczenie śluzu szyjkowego, zmiany endometrium; tabletki, plastry, krążki", "**ŻChZZ na 10 000 kobiet/rok**: niestosujące **~2**; lewonorgestrel/noretysteron/norgestymat **5–7**; etonogestrel/norelgestromin 6–12; **gestoden/desogestrel/drospirenon 9–12** (MHRA/EMA 2014)", "Najwyższe ryzyko ŻChZZ w **1. roku** stosowania (i po przerwie ≥ 4 tyg.)", "Ryzyko zawału/udaru: **palenie > 35 lat**, **migrena z aurą**, nadciśnienie", "Przeciwwskazania: ŻChZZ/trombofilia, **migrena z aurą**, palenie ≥ 15 papierosów/d > 35 r.ż., niekontrolowane nadciśnienie, choroba niedokrwienna, rak piersi, ciężka choroba wątroby, unieruchomienie/duży zabieg, < 6 tyg. po porodzie przy karmieniu", "↓ skuteczności: **ryfampicyna, karbamazepina, fenytoina, okskarbazepina, topiramat, ziele dziurawca**, wymioty/biegunka", "Korzyści: ↓ raka jajnika i endometrium, regularne cykle, ↓ dysmenorrhea, ↓ trądziku (progestageny antyandrogenne)", "Działania: tkliwość piersi, nudności, plamienia, bóle głowy, wahania nastroju, ↓ libido, ↑ RR"]}, {"h": "Antykoncepcja progestagenna i androgeny", "items": ["Tabletki: **desogestrel**, drospirenon; implant (**etonogestrel**); zastrzyki (**medroksyprogesteron** – ↓ gęstości kości, opóźniony powrót płodności); **wkładka z lewonorgestrelem**", "Można stosować przy **przeciwwskazaniach do estrogenów** i w **karmieniu piersią**", "Wada: **nieregularne krwawienia**", "**Testosteron** (żel, plastry, i.m.) – hipogonadyzm męski; **czerwienica** (kontrola Hct), trądzik, retencja płynów, ↓ spermatogenezy, bezdech senny; przeciwwskazany: **rak prostaty**, rak piersi u mężczyzn", "Sterydy anaboliczne (nadużywanie): hepatotoksyczność, dyslipidemia, kardiomiopatia, atrofia jąder, ginekomastia, agresja"]}, {"h": "Antyandrogeny i leki urologiczne", "items": ["**Octan cyproteronu** – blokuje receptor androgenowy + progestagen (↓ LH): hirsutyzm, trądzik, rak prostaty, parafilie", "EMA 2020: **oponiak** (zależny od dawki kumulacyjnej); dawki **≥ 10 mg/d** – tylko gdy inne metody zawiodły, najmniejsza skuteczna dawka; **przebyty oponiak – przeciwwskazanie** (także małe dawki z etynyloestradiolem); po rozpoznaniu – trwałe odstawienie", "Niesteroidowe: **bikalutamid**, flutamid (hepatotoksyczny), **enzalutamid**, apalutamid, darolutamid – rak prostaty", "**Abirateron** – inhibitor **CYP17** (↓ syntezy androgenów); z prednizonem (nadmiar mineralokortykoidów)", "**Finasteryd, dutasteryd** – inhibitory **5α-reduktazy**: BPH, łysienie androgenowe; **↓ PSA ~50%**, zaburzenia erekcji/libido, teratogenne (kobiety w ciąży nie dotykają tabletek)", "**Analogi GnRH** (goserelina, leuprorelina, tryptorelina) – ciągłe podawanie → desensytyzacja → kastracja farmakologiczna; początkowy **wyrzut (flare)** testosteronu → osłona antyandrogenem; **antagoniści GnRH** (degareliks, relugoliks) – bez wyrzutu", "**Inhibitory PDE-5** (sildenafil, tadalafil) – zaburzenia erekcji, BPH (tadalafil), nadciśnienie płucne; **przeciwwskazane z azotanami**; bóle głowy, zaczerwienienie, zaburzenia widzenia barw (sildenafil), NAION"]}], "cards": [{"q": "Dlaczego w HTZ u kobiety z zachowaną macicą łączy się estrogen z progestagenem?", "a": "Sam estrogen powoduje **rozrost i raka endometrium**; progestagen chroni endometrium."}, {"q": "Jakie są główne ryzyka HTZ?", "a": "**Żylna choroba zakrzepowo-zatorowa** (mniejsza przy drodze **przezskórnej**), **rak piersi** (HTZ złożona, długotrwała), udar, kamica żółciowa."}, {"q": "Jakie są przeciwwskazania do estrogenów?", "a": "ŻChZZ w wywiadzie/trombofilia, **rak piersi i endometrium**, niewyjaśnione krwawienie z dróg rodnych, czynna choroba wątroby, przebyty zawał lub udar."}, {"q": "Jak działa klomifen w indukcji owulacji?", "a": "Jako **SERM blokuje receptory estrogenowe w podwzgórzu** → brak ujemnego sprzężenia zwrotnego → ↑ GnRH, FSH i LH → owulacja."}, {"q": "Czym różni się działanie tamoksyfenu i raloksyfenu na macicę?", "a": "**Tamoksyfen** działa na endometrium **agonistycznie** (ryzyko raka endometrium); **raloksyfen** – neutralnie. Oba działają antagonistycznie na pierś."}, {"q": "Jaki jest mechanizm działania złożonej antykoncepcji hormonalnej?", "a": "**Hamowanie owulacji** (↓ FSH i LH), zagęszczenie śluzu szyjkowego, zmiany endometrium utrudniające zagnieżdżenie."}, {"q": "Jak kształtuje się ryzyko ŻChZZ przy różnych tabletkach antykoncepcyjnych (na 10 000 kobiet/rok)?", "a": "Niestosujące – **~2**; z **lewonorgestrelem**, noretysteronem, norgestymatem – **5–7**; z **gestodenem, desogestrelem, drospirenonem – 9–12**."}, {"q": "Kiedy ryzyko ŻChZZ podczas antykoncepcji złożonej jest największe?", "a": "W **pierwszym roku** stosowania (zwłaszcza pierwszych miesiącach) oraz po wznowieniu po przerwie ≥ 4 tygodni."}, {"q": "Wymień przeciwwskazania do złożonej antykoncepcji hormonalnej.", "a": "ŻChZZ w wywiadzie/trombofilia, **migrena z aurą**, **palenie > 35 r.ż.**, niekontrolowane nadciśnienie, choroba niedokrwienna serca, przebyty udar, rak piersi, ciężka choroba wątroby, duży zabieg z unieruchomieniem."}, {"q": "Które leki osłabiają skuteczność antykoncepcji hormonalnej?", "a": "**Induktory enzymów**: ryfampicyna, karbamazepina, fenytoina, okskarbazepina, topiramat, fenobarbital, **ziele dziurawca**, niektóre leki przeciw HIV."}, {"q": "Jakie są pozaantykoncepcyjne korzyści antykoncepcji złożonej?", "a": "**↓ ryzyka raka jajnika i endometrium**, regularne i mniej bolesne miesiączki, mniejsza utrata krwi, poprawa trądziku."}, {"q": "Kiedy wybiera się antykoncepcję progestagenną zamiast złożonej?", "a": "Przy **przeciwwskazaniach do estrogenów** (ryzyko zakrzepowe, migrena z aurą, palenie > 35 r.ż.) i u kobiet **karmiących piersią**."}, {"q": "Jakie jest główne działanie niepożądane antykoncepcji progestagennej?", "a": "**Nieregularne krwawienia/plamienia**; medroksyprogesteron w zastrzykach – ↓ gęstości mineralnej kości."}, {"q": "Jakie leki stosuje się w antykoncepcji awaryjnej i do kiedy?", "a": "**Lewonorgestrel 1,5 mg** – najlepiej do **72 h**; **octan uliprystalu** 30 mg – do **120 h**; wkładka miedziana – do 5 dni."}, {"q": "Jaki jest mechanizm działania mifeprystonu?", "a": "**Antagonista receptora progesteronu** – z mizoprostolem stosowany do farmakologicznego przerwania ciąży."}, {"q": "Jakie są działania niepożądane terapii testosteronem?", "a": "**Czerwienica** (↑ hematokrytu), trądzik, retencja płynów, **zahamowanie spermatogenezy** (niepłodność), bezdech senny, ginekomastia; przeciwwskazany w raku prostaty."}, {"q": "Jaki jest mechanizm działania octanu cyproteronu?", "a": "**Blokuje receptory androgenowe** i działa jako **progestagen** (hamuje wydzielanie LH → ↓ testosteronu)."}, {"q": "Jakie ryzyko octanu cyproteronu opisała EMA w 2020 r.?", "a": "Ryzyko **oponiaka**, zależne od dawki kumulacyjnej. Dawki ≥ 10 mg/d – tylko po niepowodzeniu innych metod; przebyty/obecny oponiak – przeciwwskazanie (także dla małych dawek z etynyloestradiolem)."}, {"q": "Jak działa abirateron?", "a": "Hamuje **CYP17** (17α-hydroksylaza/17,20-liaza) → ↓ syntezy androgenów w nadnerczach, jądrach i guzie; podawany z prednizonem (by zapobiec nadmiarowi mineralokortykoidów)."}, {"q": "Jaki jest mechanizm działania finasterydu i jego wpływ na PSA?", "a": "Hamuje **5α-reduktazę** (testosteron → dihydrotestosteron); **obniża PSA o ok. 50%** (wynik trzeba podwoić przy interpretacji)."}, {"q": "Dlaczego kobiety w ciąży nie powinny dotykać rozkruszonych tabletek finasterydu?", "a": "Lek może wchłonąć się przez skórę i zaburzyć rozwój narządów płciowych **płodu męskiego** (↓ DHT)."}, {"q": "Jak analogi GnRH wywołują kastrację farmakologiczną i jakie jest ryzyko na początku leczenia?", "a": "Ciągła stymulacja → **desensytyzacja** receptorów przysadki → ↓ LH/FSH → ↓ testosteronu. Na początku – **wyrzut (flare)** hormonów → nasilenie objawów raka prostaty (osłona antyandrogenem)."}, {"q": "Dlaczego inhibitorów PDE-5 nie wolno łączyć z azotanami?", "a": "Oba zwiększają **cGMP** w mięśniach gładkich naczyń → **ciężka hipotensja**, zawał, zgon."}, {"q": "Jakie działania niepożądane mają inhibitory PDE-5?", "a": "Bóle głowy, zaczerwienienie twarzy, niedrożność nosa, dyspepsja, **zaburzenia widzenia barw** (sildenafil – PDE6), bóle pleców (tadalafil), NAION, priapizm."}], "sources": [{"t": "MHRA Drug Safety Update – Combined hormonal contraceptives and VTE: review confirms risk is small (2014, za przeglądem EMA)", "u": "https://www.gov.uk/drug-safety-update/combined-hormonal-contraceptives-and-venous-thromboembolism-review-confirms-risk-is-small"}, {"t": "EMA – Restrictions in use of cyproterone due to meningioma risk (komunikat, 2020)", "u": "https://www.ema.europa.eu/en/documents/press-release/restrictions-use-cyproterone-due-meningioma-risk_en.pdf"}]}, {"id": "f-gks", "num": "F23", "title": "Glikokortykosteroidy i antagoniści kortykosteroidów", "summary": ["**Glikokortykosteroidy (GKS)** wiążą się z cytoplazmatycznym **receptorem glikokortykoidowym**. Kompleks przemieszcza się do jądra i zmienia transkrypcję genów: hamuje NF-κB i AP-1, czyli syntezę cytokin, COX-2 i cząsteczek adhezyjnych, i indukuje białka przeciwzapalne, takie jak lipokortyna (aneksyna 1), która hamuje fosfolipazę A2. Efekt genomowy pojawia się po kilku godzinach, a duże dawki działają też szybko, pozagenomowo. GKS działają **przeciwzapalnie, immunosupresyjnie i przeciwalergicznie**. Metabolicznie nasilają glukoneogenezę (hiperglikemia), katabolizm białek i redystrybucję tkanki tłuszczowej oraz działają permisywnie wobec katecholamin.", "**Porównanie preparatów** (siła przeciwzapalna względem hydrokortyzonu i działanie mineralokortykoidowe). **Hydrokortyzon** (1, z wyraźnym działaniem mineralokortykoidowym) jest lekiem z wyboru w **niedoczynności kory nadnerczy** i przełomie nadnerczowym. Prednizon (prolek aktywowany w wątrobie do prednizolonu, ok. 4 razy silniejszy od hydrokortyzonu) i **metyloprednizolon** (5, z minimalnym działaniem mineralokortykoidowym, stosowany w pulsach dożylnych) to leki pośrednie. **Deksametazon** i **betametazon** (25–30) działają długo i nie mają działania mineralokortykoidowego. Przenikają przez łożysko, dlatego stosuje się je w **dojrzewaniu płuc płodu** przy porodzie przedwczesnym, a także w obrzęku mózgu i jako lek przeciwwymiotny. **Fludrokortyzon** to silny mineralokortykoid stosowany w niedoczynności kory nadnerczy z hydrokortyzonem i w hipotonii ortostatycznej. Dawki równoważne: 20 mg hydrokortyzonu = 5 mg prednizonu = 4 mg metyloprednizolonu = 0,75 mg deksametazonu.", "**Drogi podania i wskazania**: wziewnie (astma, POChP), donosowo (alergiczny nieżyt nosa), miejscowo na skórę (od słabych, jak hydrokortyzon, do bardzo silnych, jak klobetazol; na skórze grożą zanikiem, rozstępami i trądzikiem posteroidowym), dostawowo, doodbytniczo (budezonid w NChZJ) i ogólnie. Ogólnie stosuje się je w chorobach autoimmunologicznych (toczeń, zapalenia naczyń, RZS), zaostrzeniach astmy i POChP, **anafilaksji** (jako uzupełnienie adrenaliny, nie zamiast niej), chorobach nerek (zespół nerczycowy), białaczkach i chłoniakach, przeszczepach, obrzęku mózgu przy guzach, zapaleniu opon (deksametazon przed antybiotykiem w pneumokokowym zapaleniu opon) i w ciężkim COVID-19 (deksametazon u chorych wymagających tlenu).", "**Działania niepożądane przy długotrwałym leczeniu ogólnym (jatrogenny zespół Cushinga)**: otyłość centralna, twarz księżycowata, kark bawoli, rozstępy, ścieńczenie skóry, siniaki, trądzik, **hiperglikemia i cukrzyca posteroidowa**, **nadciśnienie**, retencja sodu, hipokaliemia, **osteoporoza** (profilaktyka wapniem, witaminą D, a przy długim leczeniu bisfosfonianem), martwica jałowa głowy kości udowej, miopatia (proksymalna), **zaćma** (podtorebkowa tylna) i **jaskra**, centralna surowicza chorioretinopatia, **zakażenia** (także oportunistyczne, reaktywacja gruźlicy i HBV, maskowanie objawów), zaburzenia gojenia ran, wrzody (zwłaszcza z NLPZ), zaburzenia psychiczne (euforia, bezsenność, psychoza), u dzieci **zahamowanie wzrastania**, a także zaburzenia lipidowe i zakrzepica.", "**Zahamowanie osi podwzgórze–przysadka–nadnercza**: po dłuższym leczeniu (zwykle > 3 tygodni dawkami > 5 mg prednizolonu) **nie wolno nagle odstawiać GKS**. Zmniejsza się je stopniowo, inaczej grozi **ostra niewydolność kory nadnerczy** (hipotensja, wstrząs, hiponatremia, hipoglikemia). W stanach stresu (operacja, ciężka infekcja) trzeba **zwiększyć dawkę**. Leki podaje się rano, zgodnie z rytmem dobowym. Stężenie GKS obniżają induktory CYP3A4 (ryfampicyna, karbamazepina), a podwyższają inhibitory (rytonawir, ketokonazol). Rytonawir z wziewnym flutikazonem może wywołać zespół Cushinga. **Antagoniści i inhibitory syntezy kortykosteroidów**: **ketokonazol, metyrapon** (hamuje 11β-hydroksylazę), osilodrostat i **mitotan** (adrenolityk w raku kory nadnerczy) w zespole Cushinga, **mifepryston** (antagonista receptora glikokortykoidowego) oraz antagoniści receptora mineralokortykoidowego (spironolakton i eplerenon).", "Uwaga do źródeł: ten rozdział opiera się na wiedzy podręcznikowej, w zakresie zgodnym z literaturą z sylabusu. Nie weryfikowałem go dodatkowo w konkretnej ChPL."], "review": [{"h": "Mechanizm i działania", "items": ["Receptor glikokortykoidowy (cytoplazma) → jądro → **↓ transkrypcji genów prozapalnych** (hamowanie **NF-κB, AP-1**) i ↑ białek przeciwzapalnych (**lipokortyna/aneksyna 1** → ↓ fosfolipazy A2 → ↓ prostaglandyn i leukotrienów)", "↓ COX-2, cytokin (IL-1, IL-6, TNF), cząsteczek adhezyjnych; ↓ limfocytów, eozynofili, monocytów; **↑ neutrofili** (demarginacja)", "Działanie: przeciwzapalne, immunosupresyjne, przeciwalergiczne, przeciwwymiotne (deksametazon)", "Metabolicznie: ↑ glukoneogenezy (hiperglikemia), katabolizm białek, lipoliza i redystrybucja tłuszczu, ↓ wchłaniania Ca²⁺", "Efekt genomowy po godzinach; duże dawki – szybkie efekty pozagenomowe"]}, {"h": "Preparaty", "items": ["**Hydrokortyzon**: siła 1, **mineralokortykoidowo +** → **niedoczynność kory nadnerczy**, przełom nadnerczowy (100 mg i.v.)", "**Prednizon** (prolek → prednizolon w wątrobie), **prednizolon**: siła 4; mineralokortykoidowo słabo", "**Metyloprednizolon**: siła 5; pulsy i.v. (np. rzut SM, zapalenia naczyń, odrzucanie przeszczepu)", "**Deksametazon, betametazon**: siła 25–30, długie działanie (36–72 h), **brak działania mineralokortykoidowego**; **przenikają przez łożysko** → dojrzewanie płuc płodu (24–34 tydz.); obrzęk mózgu, wymioty, ciężki COVID-19", "**Fludrokortyzon** – silny mineralokortykoid: Addison (z hydrokortyzonem), hipotonia ortostatyczna", "Równoważne: **20 mg hydrokortyzonu = 5 mg prednizonu = 4 mg metyloprednizolonu = 0,75 mg deksametazonu**", "Wziewne/donosowe: budezonid, flutikazon, mometazon, beklometazon, cyklezonid; skóra: hydrokortyzon (słaby) → mometazon → **klobetazol** (bardzo silny); budezonid p.o. (duży efekt pierwszego przejścia) – NChZJ"]}, {"h": "Wskazania", "items": ["Choroby autoimmunologiczne i zapalne: toczeń, RZS, zapalenia naczyń, polimialgia, sarkoidoza, autoimmunologiczne zapalenie wątroby", "Astma i POChP (wziewnie; zaostrzenia – ogólnie), alergie, **anafilaksja** (uzupełnienie adrenaliny), obrzęk naczynioruchowy", "Nefrologia: zespół nerczycowy, kłębuszkowe zapalenia nerek", "Hematoonkologia: białaczki, chłoniaki, szpiczak; obrzęk mózgu przy guzach (deksametazon); przeciwwymiotnie", "Przeszczepy (immunosupresja), immunologiczne działania niepożądane immunoterapii", "**Pneumokokowe zapalenie opon** – deksametazon przed/z antybiotykiem; ciężki COVID-19 z tlenoterapią – deksametazon", "Substytucja: niedoczynność kory nadnerczy, wrodzony przerost nadnerczy"]}, {"h": "Działania niepożądane", "items": ["**Jatrogenny zespół Cushinga**: otyłość centralna, twarz księżycowata, kark bawoli, rozstępy, ścieńczenie skóry, siniaki, trądzik, hirsutyzm", "Metaboliczne: **hiperglikemia/cukrzyca posteroidowa**, dyslipidemia, **nadciśnienie**, retencja Na⁺ i wody, **hipokaliemia**", "Kości i mięśnie: **osteoporoza** (wapń + wit. D, bisfosfonian przy ≥ 3 mies. leczenia), **martwica jałowa głowy kości udowej**, **miopatia proksymalna**, u dzieci **zahamowanie wzrastania**", "Oczy: **zaćma podtorebkowa tylna**, **jaskra**, centralna surowicza chorioretinopatia", "**Zakażenia** (oportunistyczne, reaktywacja **gruźlicy**, HBV, VZV; maskowanie gorączki i objawów otrzewnowych), upośledzone gojenie ran", "Przewód pokarmowy: wrzody (szczególnie **z NLPZ**), zapalenie trzustki", "Psychiczne: euforia, bezsenność, wahania nastroju, **psychoza sterydowa**", "Miejscowo: wziewne – kandydoza jamy ustnej, chrypka; skórne – zanik skóry, rozstępy, trądzik posteroidowy, teleangiektazje"]}, {"h": "Odstawianie, interakcje, antagoniści", "items": ["Leczenie > **3 tygodni** (dawki > ~5 mg prednizolonu) → **supresja osi HPA** → **stopniowe odstawianie**", "Nagłe odstawienie → **przełom nadnerczowy** (hipotensja, wstrząs, hiponatremia, hiperkaliemia, hipoglikemia) lub nawrót choroby", "Stres (operacja, ciężka infekcja, uraz) – **zwiększyć dawkę** (dawki stresowe hydrokortyzonu); karta sterydowa", "Dawkowanie **rano** (rytm dobowy kortyzolu), ewentualnie co drugi dzień", "Interakcje: **induktory CYP3A4** (ryfampicyna, karbamazepina, fenytoina) ↓; **inhibitory** (rytonawir, kobicystat, ketokonazol) ↑ → **rytonawir + flutikazon/budezonid → zespół Cushinga**; NLPZ (wrzody), diuretyki (hipokaliemia), leki przeciwcukrzycowe (↓ działania), żywe szczepionki (przeciwwskazane przy dawkach immunosupresyjnych)", "Hamowanie syntezy kortyzolu: **ketokonazol, metyrapon** (11β-hydroksylaza), **osilodrostat**, etomidat (i.v.), **mitotan** (adrenolityk – rak kory nadnerczy)", "**Mifepryston** – antagonista receptora GKS (i progesteronowego); pasyreotyd – choroba Cushinga (przysadkowa)", "Antagoniści receptora mineralokortykoidowego: **spironolakton, eplerenon**, finerenon"]}], "cards": [{"q": "Jaki jest mechanizm przeciwzapalnego działania glikokortykosteroidów?", "a": "Wiążą **receptor glikokortykoidowy**, który w jądrze hamuje czynniki transkrypcyjne **NF-κB i AP-1** (↓ cytokin, COX-2, cząsteczek adhezyjnych) i indukuje białka przeciwzapalne, np. **lipokortynę** (↓ fosfolipazy A2)."}, {"q": "Jak GKS wpływają na liczbę leukocytów we krwi?", "a": "↓ limfocytów, eozynofili i monocytów, ale **↑ neutrofili** (demarginacja i uwalnianie ze szpiku)."}, {"q": "Który GKS jest lekiem z wyboru w niedoczynności kory nadnerczy i dlaczego?", "a": "**Hydrokortyzon** – ma działanie glikokortykoidowe i **mineralokortykoidowe** (jak kortyzol); w pierwotnej niedoczynności często + **fludrokortyzon**."}, {"q": "Który GKS stosuje się w przełomie nadnerczowym i w jakiej dawce?", "a": "**Hydrokortyzon 100 mg i.v.** (bolus), następnie wlew/podawanie co 6 h + płyny i glukoza."}, {"q": "Czym różni się prednizon od prednizolonu?", "a": "**Prednizon** jest prolekiem – w wątrobie przekształcany w aktywny **prednizolon** (w ciężkiej niewydolności wątroby lepiej podać prednizolon)."}, {"q": "Jakie są cechy deksametazonu?", "a": "Bardzo silny (ok. 25–30× hydrokortyzon), **długo działający**, **bez działania mineralokortykoidowego**, przenika przez łożysko i do OUN."}, {"q": "Do czego stosuje się deksametazon lub betametazon w położnictwie?", "a": "Do **przyspieszenia dojrzewania płuc płodu** przy zagrażającym porodzie przedwczesnym (ok. 24–34 tydz.) – przenikają przez łożysko."}, {"q": "Podaj dawki równoważne GKS względem 20 mg hydrokortyzonu.", "a": "**5 mg prednizonu/prednizolonu = 4 mg metyloprednizolonu = 0,75 mg deksametazonu**."}, {"q": "Do czego stosuje się fludrokortyzon?", "a": "Silny **mineralokortykoid** – w pierwotnej niedoczynności kory nadnerczy (choroba Addisona) z hydrokortyzonem oraz w **hipotonii ortostatycznej**."}, {"q": "Jaką rolę pełnią GKS w anafilaksji?", "a": "Tylko **uzupełniającą** (zapobieganie reakcji dwufazowej) – lekiem pierwszego wyboru jest **adrenalina i.m.**; GKS działają po godzinach."}, {"q": "Kiedy podaje się deksametazon w zapaleniu opon mózgowo-rdzeniowych?", "a": "W bakteryjnym (zwłaszcza **pneumokokowym**) zapaleniu opon – przed pierwszą dawką antybiotyku lub razem z nią (↓ powikłań neurologicznych, głuchoty)."}, {"q": "Wymień objawy jatrogennego zespołu Cushinga.", "a": "Otyłość centralna, **twarz księżycowata**, kark bawoli, **rozstępy**, ścieńczenie skóry i siniaki, trądzik, hirsutyzm, nadciśnienie, hiperglikemia, osteoporoza, miopatia proksymalna."}, {"q": "Jakie są działania niepożądane GKS na narząd wzroku?", "a": "**Zaćma podtorebkowa tylna**, **jaskra** (↑ ciśnienia śródgałkowego), centralna surowicza chorioretinopatia."}, {"q": "Jak zapobiegać osteoporozie posteroidowej?", "a": "Najmniejsza skuteczna dawka, **wapń + witamina D**, aktywność fizyczna; przy leczeniu ≥ 3 miesiące i ryzyku złamań – **bisfosfonian** (lub denosumab, teryparatyd)."}, {"q": "Jakie zakażenia mogą się ujawnić podczas leczenia GKS?", "a": "Zakażenia oportunistyczne (grzybicze, PCP), **reaktywacja gruźlicy**, WZW B, półpasiec; GKS maskują gorączkę i objawy otrzewnowe."}, {"q": "Dlaczego GKS z NLPZ zwiększają ryzyko powikłań przewodu pokarmowego?", "a": "Sumowanie działania wrzodotwórczego (NLPZ ↓ prostaglandyn, GKS upośledzają gojenie) → ↑ ryzyka **wrzodów i krwawień** – wskazana osłona IPP."}, {"q": "Jakie zaburzenia psychiczne mogą wywołać GKS?", "a": "Euforia, bezsenność, drażliwość, depresja, **psychoza sterydowa** (zależnie od dawki)."}, {"q": "Jaki wpływ mają GKS na wzrastanie dzieci?", "a": "**Hamują wzrastanie** (także wziewne w dużych dawkach) – konieczne monitorowanie wzrostu."}, {"q": "Dlaczego nie wolno nagle odstawić GKS po długotrwałym leczeniu?", "a": "Długotrwała podaż hamuje oś **podwzgórze–przysadka–nadnercza** (atrofia kory nadnerczy) → nagłe odstawienie grozi **ostrą niewydolnością kory nadnerczy** (przełomem)."}, {"q": "Od jakiego czasu leczenia GKS należy liczyć się z supresją osi HPA?", "a": "Zwykle po **> 3 tygodniach** leczenia dawkami > ok. 5 mg prednizolonu/dobę (lub wielokrotnych kursach) – wtedy odstawia się stopniowo."}, {"q": "Co zrobić z dawką GKS u pacjenta przewlekle leczonego, który przechodzi operację?", "a": "**Zwiększyć dawkę** (dawki stresowe hydrokortyzonu okołooperacyjnie) – nadnercza nie odpowiedzą prawidłowo na stres."}, {"q": "O jakiej porze podaje się GKS i dlaczego?", "a": "**Rano** – zgodnie z dobowym rytmem kortyzolu, co zmniejsza supresję osi HPA."}, {"q": "Jaka interakcja może wywołać zespół Cushinga u pacjenta stosującego wziewny flutikazon?", "a": "Jednoczesne stosowanie **rytonawiru** (lub kobicystatu, itrakonazolu) – silnych inhibitorów CYP3A4 → kumulacja flutikazonu/budezonidu."}, {"q": "Jakie leki hamują syntezę kortyzolu i kiedy się je stosuje?", "a": "**Ketokonazol, metyrapon** (inhibitor 11β-hydroksylazy), osilodrostat, etomidat (i.v.), **mitotan** – w zespole Cushinga (mitotan – rak kory nadnerczy)."}, {"q": "Jak działa mifepryston w hiperkortyzolemii?", "a": "Jest **antagonistą receptora glikokortykoidowego** (w dużych dawkach), blokuje działanie kortyzolu."}, {"q": "Jakie są miejscowe działania niepożądane GKS stosowanych na skórę?", "a": "**Zanik skóry**, rozstępy, teleangiektazje, trądzik i zapalenie wokół ust posteroidowe, opóźnione gojenie, wchłanianie ogólne (duże powierzchnie, okluzja, dzieci)."}, {"q": "Dlaczego budezonid doustny ma mało działań ogólnych?", "a": "Ma **duży efekt pierwszego przejścia** w wątrobie (~90%) – działa głównie miejscowo w jelicie (NChZJ, mikroskopowe zapalenie jelita)."}], "sources": []}, {"id": "f-tarczyca", "num": "F24", "title": "Hormony tarczycy, leki przeciwtarczycowe i inne leki hormonalne", "summary": ["**Lewotyroksyna (L-T4)** to lek z wyboru w **niedoczynności tarczycy**. Jest prohormonem przekształcanym w tkankach w aktywną T3 przez dejodynazy. Ma długi t½ (ok. 7 dni), więc stan stacjonarny osiąga się po 6 tygodniach. Przyjmuje się ją **rano na czczo, 30–60 min przed śniadaniem**. Dawkę dobiera się według **TSH** (kontrola po 6–8 tygodniach). U osób starszych i z chorobą wieńcową zaczyna się od małej dawki (12,5–25 µg), bo grozi dławica i arytmie. W ciąży zapotrzebowanie **rośnie** o 25–50%. Przedawkowanie daje objawy nadczynności: tachykardię, migotanie przedsionków i osteoporozę. Wchłanianie zmniejszają preparaty **wapnia i żelaza**, IPP, leki zobojętniające, żywice i kawa, a metabolizm przyspieszają induktory enzymów. Lewotyroksyna nasila działanie warfaryny. **Liotyronina (T3)** działa szybko i krótko. Stosuje się ją w śpiączce hipometabolicznej (z L-T4 i hydrokortyzonem) i przed scyntygrafią.", "**Leki przeciwtarczycowe – tioamidy**: **tiamazol** (metimazol) i karbimazol (prolek tiamazolu) oraz **propylotiouracyl (PTU)**. Hamują **peroksydazę tarczycową** (TPO), czyli organifikację jodu i sprzęganie jodotyrozyn. PTU dodatkowo hamuje obwodową konwersję T4 do T3. Efekt kliniczny pojawia się po kilku tygodniach, bo w tarczycy są zapasy hormonów. Najgroźniejsze działanie niepożądane to **agranulocytoza** (zwykle w pierwszych 3 miesiącach). Przy gorączce lub bólu gardła trzeba natychmiast zbadać morfologię i odstawić lek. Inne działania niepożądane: wysypka, świąd, bóle stawów i hepatotoksyczność (PTU: **ciężka martwica wątroby**, dlatego jest lekiem drugiego wyboru). Według PRAC (2019) tiamazol i karbimazol mogą wywołać **ostre zapalenie trzustki** (po którym nie wolno ich ponownie stosować) i zwiększają ryzyko **wad wrodzonych w I trymestrze** (aplazja skóry, wady twarzoczaszki, ściany brzucha i przewodu pokarmowego, VSD). Dlatego w I trymestrze preferuje się PTU, a od II trymestru tiamazol, w najmniejszej skutecznej dawce. U kobiet w wieku rozrodczym zaleca się skuteczną antykoncepcję.", "**Jod i inne leki**: duże dawki jodu (płyn Lugola, jodek potasu) przejściowo **hamują uwalnianie hormonów i syntezę** (efekt Wolffa–Chaikoffa), zmniejszają ukrwienie tarczycy i przygotowują chorego do operacji. W przełomie tarczycowym podaje się je co najmniej godzinę **po** tioamidzie. Jodek potasu chroni tarczycę przy skażeniu radioaktywnym jodem. **Jod radioaktywny ¹³¹I** niszczy tkankę tarczycy (choroba Gravesa–Basedowa, wole guzkowe toksyczne, rak zróżnicowany). Jest przeciwwskazany w ciąży i podczas karmienia, a później często rozwija się niedoczynność. **β-blokery** (propranolol, który hamuje też konwersję T4 do T3) łagodzą objawy adrenergiczne. W **przełomie tarczycowym** stosuje się tioamid (najlepiej PTU), następnie jod, β-bloker, GKS (hamują konwersję i działają w razie względnej niedoczynności kory nadnerczy), chłodzenie i płyny, bez aspiryny (wypiera hormony z białek). Nadczynność tarczycy mogą wywołać **amiodaron** i środki kontrastowe zawierające jod, a niedoczynność lit, amiodaron, interferon i inhibitory punktów kontrolnych.", "**Inne leki hormonalne.** **Przysadka i podwzgórze**: hormon wzrostu (somatotropina; niedobór GH, zespół Turnera, przewlekła choroba nerek), analogi somatostatyny (oktreotyd, lanreotyd, pasyreotyd; w akromegalii, guzach neuroendokrynnych i krwawieniu z żylaków przełyku; dają kamicę żółciową), pegwisomant (antagonista receptora GH), agoniści dopaminy (**kabergolina** i bromokryptyna w prolactinoma i hiperprolaktynemii), **desmopresyna** (analog wazopresyny działający na V2: moczówka prosta ośrodkowa, moczenie nocne, hemofilia i choroba vWD; grozi **hiponatremią**), wazopresyna i terlipresyna (wstrząs, zespół wątrobowo-nerkowy, krwawienie z żylaków), antagoniści receptora wazopresyny (**tolwaptan** w SIADH i ADPKD; zbyt szybka korekta Na⁺ grozi demielinizacją), oksytocyna (indukcja porodu, krwotok poporodowy; zatrucie wodne) i gonadotropiny.", "**Gospodarka wapniowo-fosforanowa i nadnercza**: **witamina D** (cholekalcyferol, alfakalcydol, kalcytriol; w niedoczynności przytarczyc i PChN), **kalcymimetyki** (cynakalcet, etelkalcetyd zwiększają wrażliwość receptora wapniowego i obniżają PTH we wtórnej nadczynności przytarczyc; dają hipokalcemię), parathormon rekombinowany (niedoczynność przytarczyc), a w leczeniu hiperkalcemii płyny, bisfosfoniany dożylnie, kalcytonina, denosumab i GKS. **Rdzeń nadnerczy (guz chromochłonny)**: najpierw α-bloker, potem β-bloker. Inhibitor syntezy katecholamin metyrozyna jest rzadko stosowany. W ostrej niewydolności nadnerczy podaje się **hydrokortyzon dożylnie**."], "review": [{"h": "Lewotyroksyna", "items": ["L-T4 – prohormon → **T3** (dejodynazy obwodowe); t½ ~7 dni", "Niedoczynność tarczycy (pierwotna, wtórna), po tyreoidektomii, supresja TSH w raku zróżnicowanym", "Przyjmować **rano na czczo, 30–60 min przed śniadaniem**, popić wodą", "Monitorowanie: **TSH po 6–8 tyg.** od zmiany dawki (w niedoczynności wtórnej – fT4)", "Seniorzy / choroba wieńcowa: start **12,5–25 µg** i powolne zwiększanie (dławica, arytmie)", "**Ciąża – ↑ zapotrzebowania o 25–50%** (zwiększyć dawkę od razu)", "Przedawkowanie: tachykardia, **migotanie przedsionków**, ↓ masy, osteoporoza, drżenie", "↓ wchłaniania: **wapń, żelazo**, IPP, leki zobojętniające, sukralfat, żywice, kawa, soja, błonnik → odstęp ≥ 4 h", "↑ metabolizmu: ryfampicyna, karbamazepina, fenytoina; estrogeny ↑ TBG (↑ zapotrzebowania)", "Nasila działanie **warfaryny**; ↑ zapotrzebowania na insulinę", "**Liotyronina (T3)** – szybka i krótka; śpiączka hipometaboliczna (+ L-T4 i.v. + **hydrokortyzon**)"]}, {"h": "Tioamidy", "items": ["**Tiamazol**, karbimazol (prolek), **propylotiouracyl (PTU)** – hamują **peroksydazę tarczycową (TPO)**: organifikacja jodu, sprzęganie", "PTU dodatkowo **↓ konwersji T4 → T3**", "Efekt po **2–6 tyg.** (zapasy hormonów)", "**Agranulocytoza** (najczęściej w pierwszych 3 mies.): gorączka, **ból gardła**, owrzodzenia → **natychmiast morfologia** i odstawienie", "Inne: wysypka, świąd, artralgia, zapalenie wątroby (cholestatyczne – tiamazol), **PTU – ciężka martwica wątroby** → lek II wyboru", "PRAC 2019 – tiamazol/karbimazol: **ostre zapalenie trzustki** (odstawić, nie wznawiać); **wady wrodzone w I trymestrze** (aplasia cutis, wady twarzoczaszki, ściany brzucha, p. pokarmowego, VSD) → skuteczna antykoncepcja; w ciąży najmniejsza dawka", "Ciąża: **I trymestr – PTU**, od II trymestru – tiamazol"]}, {"h": "Jod, ¹³¹I, β-blokery, przełom", "items": ["Duże dawki **jodu** (płyn Lugola, KI): **efekt Wolffa–Chaikoffa** (↓ syntezy), **↓ uwalniania** hormonów, ↓ ukrwienia → przygotowanie do operacji (7–10 dni), przełom tarczycowy", "W przełomie jod **≥ 1 h po tioamidzie** (by nie dostarczyć substratu do syntezy)", "**Jodek potasu** – blokada tarczycy przy skażeniu radioaktywnym jodem", "**¹³¹I** – Graves–Basedow, wole guzkowe toksyczne, rak zróżnicowany; **przeciwwskazany w ciąży i laktacji**; następowa niedoczynność; może nasilić orbitopatię (osłona GKS)", "**Propranolol** – objawy adrenergiczne, ↓ konwersji T4 → T3", "**Przełom tarczycowy**: tioamid (PTU) → jod → β-bloker → **GKS** (hydrokortyzon) → chłodzenie (**paracetamol, nie ASA**), płyny; leczenie przyczyny", "Leki zaburzające czynność tarczycy: **amiodaron** (nadczynność typu 1 i 2, niedoczynność), jodowe kontrasty, **lit** (niedoczynność, wole), interferon α, inhibitory punktów kontrolnych, inhibitory kinaz tyrozynowych"]}, {"h": "Przysadka i podwzgórze", "items": ["**Somatotropina** – niedobór GH, zespół Turnera, Pradera–Williego, PChN u dzieci, SGA", "Analogi somatostatyny: **oktreotyd, lanreotyd**, pasyreotyd – akromegalia, guzy neuroendokrynne (zespół rakowiaka), krwawienie z żylaków przełyku; **kamica żółciowa**, biegunka, hiperglikemia", "**Pegwisomant** – antagonista receptora GH (akromegalia)", "**Kabergolina**, bromokryptyna – agoniści D2: prolactinoma, hiperprolaktynemia, hamowanie laktacji", "**Desmopresyna** (V2): **moczówka prosta ośrodkowa**, moczenie nocne, hemofilia A łagodna, vWD typu 1 → **hiponatremia** (ograniczyć płyny)", "**Wazopresyna, terlipresyna** (V1): wstrząs naczyniorozkurczowy, krwawienie z żylaków przełyku, zespół wątrobowo-nerkowy; niedokrwienie", "**Tolwaptan** – antagonista V2: **SIADH** (hiponatremia), ADPKD; zbyt szybka korekta Na⁺ → **osmotyczna demielinizacja**; hepatotoksyczny", "**Oksytocyna** – indukcja/wzmacnianie porodu, **krwotok poporodowy**; nadmierne skurcze, **zatrucie wodne** (działanie antydiuretyczne); karbetocyna", "Gonadotropiny (FSH, hCG) – stymulacja owulacji, IVF (zespół hiperstymulacji jajników)"]}, {"h": "Wapń, przytarczyce, nadnercza", "items": ["**Cholekalcyferol** (D3), **alfakalcydol** (1α-OH – wymaga 25-hydroksylacji w wątrobie), **kalcytriol** (aktywny) – w niedoczynności przytarczyc i PChN (brak 1α-hydroksylazy)", "Przedawkowanie wit. D: **hiperkalcemia** (nudności, wielomocz, kamica, zaburzenia rytmu)", "**Kalcymimetyki** (cynakalcet p.o., etelkalcetyd i.v.) – ↑ wrażliwości receptora wapniowego (CaSR) → ↓ PTH: wtórna nadczynność przytarczyc (dializy), rak przytarczyc; **hipokalcemia**", "Hiperkalcemia: **nawodnienie 0,9% NaCl**, **bisfosfoniany i.v.** (kwas zoledronowy), kalcytonina (szybko, tachyfilaksja), denosumab, GKS (ziarniniaki, chłoniaki, nadmiar wit. D), furosemid po nawodnieniu", "Hipokalcemia ostra: **glukonian wapnia i.v.**", "Guz chromochłonny: **α-bloker** (fenoksybenzamina/doksazosyna) → potem β-bloker; metyrozyna (inhibitor hydroksylazy tyrozynowej)", "Ostra niewydolność kory nadnerczy: **hydrokortyzon 100 mg i.v.** + NaCl + glukoza"]}], "cards": [{"q": "Jak prawidłowo przyjmować lewotyroksynę?", "a": "**Rano na czczo, 30–60 minut przed śniadaniem**, popijając wodą; z odstępem ≥ 4 h od preparatów wapnia, żelaza, leków zobojętniających."}, {"q": "Kiedy kontroluje się TSH po zmianie dawki lewotyroksyny i dlaczego?", "a": "Po **6–8 tygodniach** – t½ L-T4 wynosi ok. 7 dni, a stan stacjonarny osiąga się po ok. 5–6 t½."}, {"q": "Dlaczego u starszych pacjentów z chorobą wieńcową lewotyroksynę włącza się małą dawką?", "a": "Szybkie wyrównanie zwiększa zapotrzebowanie mięśnia sercowego na tlen → ryzyko **dławicy, zawału i arytmii**; start od **12,5–25 µg/d**."}, {"q": "Jak zmienia się zapotrzebowanie na lewotyroksynę w ciąży?", "a": "**Rośnie o ok. 25–50%** – dawkę zwiększa się od razu po potwierdzeniu ciąży i monitoruje TSH."}, {"q": "Jakie leki i substancje zmniejszają wchłanianie lewotyroksyny?", "a": "**Preparaty wapnia i żelaza**, IPP, leki zobojętniające, sukralfat, żywice jonowymienne (kolestyramina), kawa, soja, błonnik."}, {"q": "Jakie są objawy przedawkowania lewotyroksyny?", "a": "Objawy nadczynności: tachykardia, **migotanie przedsionków**, kołatania, drżenie, utrata masy ciała, bezsenność, **osteoporoza** (przewlekle)."}, {"q": "Jak leczy się śpiączkę hipometaboliczną?", "a": "L-T4 (± T3) **dożylnie**, **hydrokortyzon** (do czasu wykluczenia niedoczynności nadnerczy), ogrzewanie bierne, wsparcie oddechu i krążenia, leczenie hiponatremii i hipoglikemii."}, {"q": "Jaki jest mechanizm działania tiamazolu i propylotiouracylu?", "a": "Hamują **peroksydazę tarczycową** → ↓ organifikacji jodu i sprzęgania jodotyrozyn (↓ syntezy T4/T3). **PTU** dodatkowo hamuje obwodową konwersję T4 → T3."}, {"q": "Dlaczego efekt tioamidów pojawia się dopiero po kilku tygodniach?", "a": "Hamują **syntezę**, a nie uwalnianie hormonów – najpierw muszą się wyczerpać zapasy hormonów zmagazynowane w koloidzie."}, {"q": "Jakie jest najgroźniejsze działanie niepożądane tioamidów i jak postępować?", "a": "**Agranulocytoza** (zwykle w pierwszych 3 miesiącach). Przy **gorączce lub bólu gardła** – natychmiast morfologia z rozmazem i odstawienie leku."}, {"q": "Dlaczego propylotiouracyl jest lekiem drugiego wyboru?", "a": "Ze względu na ryzyko **ciężkiej, piorunującej martwicy wątroby**."}, {"q": "Który tioamid wybiera się w I trymestrze ciąży i dlaczego?", "a": "**Propylotiouracyl** – tiamazol/karbimazol w I trymestrze zwiększają ryzyko **wad wrodzonych** (aplasia cutis, wady twarzoczaszki, ściany brzucha, VSD); od II trymestru – tiamazol."}, {"q": "Jakie ostrzeżenia dotyczące tiamazolu i karbimazolu wprowadził PRAC w 2019 r.?", "a": "Ryzyko **ostrego zapalenia trzustki** (odstawić, nie stosować ponownie) i **wad wrodzonych** przy ekspozycji w I trymestrze/dużych dawkach → skuteczna antykoncepcja u kobiet w wieku rozrodczym."}, {"q": "Jak działają duże dawki jodu na tarczycę?", "a": "Przejściowo hamują **syntezę** (efekt Wolffa–Chaikoffa) i **uwalnianie** hormonów oraz zmniejszają ukrwienie tarczycy – przygotowanie do operacji, przełom tarczycowy."}, {"q": "Dlaczego w przełomie tarczycowym jod podaje się dopiero po tioamidzie?", "a": "Podany wcześniej dostarczyłby **substratu do syntezy** nowych hormonów; tioamid najpierw blokuje organifikację (odstęp ≥ 1 h)."}, {"q": "Jakie leki stosuje się w przełomie tarczycowym?", "a": "**Tioamid (PTU)** → **jod** → **β-bloker** (propranolol) → **GKS** (hydrokortyzon) + chłodzenie, płyny; leczenie czynnika wywołującego."}, {"q": "Dlaczego w przełomie tarczycowym nie stosuje się kwasu acetylosalicylowego do obniżania gorączki?", "a": "Salicylany **wypierają hormony tarczycy z białek** → ↑ wolnych T4/T3; stosuje się paracetamol."}, {"q": "Kiedy stosuje się jod radioaktywny i jakie ma przeciwwskazania?", "a": "Choroba Gravesa–Basedowa, wole guzkowe toksyczne, rak zróżnicowany tarczycy. **Przeciwwskazany w ciąży i podczas karmienia piersią**; częsty skutek – niedoczynność tarczycy."}, {"q": "Jakie leki mogą wywołać zaburzenia czynności tarczycy?", "a": "**Amiodaron** (nad- i niedoczynność), jodowe środki kontrastowe, **lit** (niedoczynność, wole), interferon α, inhibitory punktów kontrolnych, inhibitory kinaz tyrozynowych."}, {"q": "Do czego stosuje się analogi somatostatyny i jakie mają działania niepożądane?", "a": "**Oktreotyd, lanreotyd**: akromegalia, guzy neuroendokrynne (zespół rakowiaka), krwawienie z żylaków przełyku. Działania: **kamica żółciowa**, biegunka, bóle brzucha, zaburzenia glikemii."}, {"q": "Jakie są wskazania i główne działanie niepożądane desmopresyny?", "a": "Moczówka prosta ośrodkowa, moczenie nocne, łagodna hemofilia A i choroba von Willebranda typu 1. Działanie niepożądane: **hiponatremia** (zatrucie wodne)."}, {"q": "Jaki jest mechanizm działania tolwaptanu i jego główne ryzyko?", "a": "Antagonista receptora wazopresynowego **V2** → akwareza; SIADH, ADPKD. Ryzyko: **zbyt szybka korekta hiponatremii → osmotyczna demielinizacja**; hepatotoksyczność."}, {"q": "Do czego stosuje się oksytocynę i jakie ma działania niepożądane?", "a": "Indukcja i wzmacnianie czynności skurczowej, **krwotok poporodowy**. Działania: nadmierne skurcze macicy (niedotlenienie płodu), **zatrucie wodne** (działanie antydiuretyczne), hipotensja (bolus)."}, {"q": "Czym różni się alfakalcydol od kalcytriolu?", "a": "**Kalcytriol** to aktywna 1,25(OH)₂D₃. **Alfakalcydol** (1α-OH-D₃) wymaga tylko 25-hydroksylacji w **wątrobie** – oba omijają nerkową 1α-hydroksylazę (PChN, niedoczynność przytarczyc)."}, {"q": "Jak działają kalcymimetyki?", "a": "**Zwiększają wrażliwość receptora wapniowego (CaSR)** przytarczyc → ↓ wydzielania PTH; wtórna nadczynność przytarczyc u dializowanych, rak przytarczyc. Ryzyko: **hipokalcemia**."}, {"q": "Jak leczy się ciężką hiperkalcemię?", "a": "**Nawodnienie 0,9% NaCl**, **bisfosfoniany i.v.** (kwas zoledronowy), kalcytonina (szybki, krótkotrwały efekt), denosumab, GKS (chłoniaki, sarkoidoza, nadmiar wit. D), dializa w ciężkich przypadkach."}], "sources": [{"t": "HSA (Singapur) – komunikat na podstawie zaleceń PRAC (EMA) 2019: tiamazol/karbimazol – ostre zapalenie trzustki i wady wrodzone", "u": "https://www.hsa.gov.sg/announcements/risk-of-acute-pancreatitis-and-congenital-malformations-associated-with-the-use-of-carbimazole-or-thiamazole/"}]}, {"id": "f-anest", "num": "F25", "title": "Leki znieczulenia ogólnego i miejscowego, leki zwiotczające", "summary": ["**Znieczulenie ogólne** łączy cztery składowe: sen (hipnozę), analgezję, zwiotczenie mięśni i zniesienie odruchów. Zwykle osiąga się je kilkoma lekami (anestezja zbilansowana). **Anestetyki wziewne** (sewofluran, desfluran, izofluran oraz podtlenek azotu) charakteryzuje **MAC**, czyli minimalne stężenie pęcherzykowe, przy którym 50% pacjentów nie reaguje ruchem na nacięcie skóry. Im mniejszy MAC, tym silniejszy anestetyk. O szybkości indukcji i wybudzenia decyduje rozpuszczalność we krwi: **niski współczynnik krew/gaz** (desfluran, podtlenek azotu, sewofluran) oznacza szybkie zaśnięcie i szybkie wybudzenie. **Sewofluran** nie drażni dróg oddechowych, dlatego nadaje się do indukcji wziewnej, zwłaszcza u dzieci. Desfluran drażni drogi oddechowe. Anestetyki halogenowe obniżają ciśnienie tętnicze, działają depresyjnie na oddychanie, rozszerzają oskrzela, zwiększają przepływ mózgowy i nasilają działanie leków zwiotczających. Razem z sukcynylocholiną mogą wywołać **hipertermię złośliwą**. **Podtlenek azotu** ma duży MAC (>100%) i działa silnie przeciwbólowo. Przechodzi do zamkniętych przestrzeni z gazem (odma, niedrożność, ucho środkowe), a przewlekła ekspozycja inaktywuje witaminę B12.", "**Anestetyki dożylne.** **Propofol** to najczęstszy lek do indukcji i TIVA. Działa szybko, a pacjent wybudza się z niewielkimi nudnościami (efekt przeciwwymiotny). Działania niepożądane: spadek ciśnienia, bezdech i ból przy wstrzyknięciu, a przy długich, wysokodawkowych wlewach **zespół poinfuzyjny propofolu** (kwasica metaboliczna, rabdomioliza, hiperkaliemia, niewydolność serca). **Ketamina** jest antagonistą NMDA i wywołuje znieczulenie dysocjacyjne. Daje silną analgezję, **pobudza układ współczulny** (zwiększa ciśnienie i tętno), zachowuje odruchy z dróg oddechowych i rozszerza oskrzela, dlatego sprawdza się we wstrząsie i w astmie. Wywołuje jednak halucynacje i koszmary przy wybudzaniu, a esketamina donosowo jest stosowana w depresji lekoopornej. **Etomidat** jest stabilny hemodynamicznie, ale hamuje syntezę kortyzolu (11β-hydroksylazę). **Tiopental** (barbiturat) jest dziś stosowany rzadko i przeciwwskazany w porfirii. **Midazolam** (benzodiazepina) służy do premedykacji i sedacji, a jego antagonistą jest **flumazenil**. **Deksmedetomidyna** (α2-agonista) daje sedację, z której pacjenta można wybudzić, bez depresji oddechu. Ponadto stosuje się opioidy (fentanyl, sufentanyl, remifentanyl, który hydrolizują esterazy osoczowe, więc działa krótko niezależnie od czasu wlewu).", "**Leki zwiotczające mięśnie (blokujące przewodnictwo nerwowo-mięśniowe).** **Depolaryzujące – sukcynylocholina (suksametonium)**: agonista receptora nikotynowego płytki motorycznej, który utrzymuje depolaryzację (faza I, z widocznymi fascykulacjami). Działa najszybciej (ok. 1 minuta) i krótko (5–10 minut), bo rozkłada ją **butyrylocholinoesteraza** osoczowa (przy jej wrodzonym niedoborze dochodzi do przedłużonego bezdechu). Wskazanie to szybka intubacja (RSI). Działania niepożądane: **hiperkaliemia** (zwłaszcza w oparzeniach, urazach rdzenia, unieruchomieniu i miopatiach), bradykardia, bóle mięśni, wzrost ciśnienia śródgałkowego i śródczaszkowego, **hipertermia złośliwa**. Inhibitory acetylocholinoesterazy nie odwracają, a nawet nasilają jej działanie. **Niedepolaryzujące** (kompetycyjni antagoniści nAChR): steroidowe (**rokuronium**, wekuronium, pankuronium) i benzylizochinolinowe (atrakurium i **cisatrakurium**, które rozpadają się samoistnie w wyniku **eliminacji Hofmanna**, niezależnie od nerek i wątroby; atrakurium uwalnia histaminę). Ich działanie nasilają anestetyki wziewne, aminoglikozydy, magnez, hipotermia i kwasica.", "**Odwracanie blokady**: **neostygmina** (inhibitor AChE) zwiększa stężenie ACh w szczelinie synaptycznej i odwraca blok niedepolaryzujący. Podaje się ją razem z **atropiną lub glikopironium**, które blokują muskarynowe działania niepożądane (bradykardię i nadmierne wydzielanie). **Sugammadeks** to selektywny lek wiążący zwiotczające: γ-cyklodekstryna, która otacza cząsteczkę **rokuronium lub wekuronium** i ją inaktywuje (enkapsulacja), co pozwala odwrócić nawet głęboki blok. Nie działa na sukcynylocholinę ani na benzylizochinoliny. Może wywołać reakcje nadwrażliwości i bradykardię oraz zmniejszać skuteczność antykoncepcji hormonalnej (jak pominięta tabletka). **Hipertermia złośliwa** to farmakogenetyczna choroba mięśni (najczęściej mutacja **RYR1**) wywoływana przez anestetyki wziewne i/lub sukcynylocholinę. Objawy: wzrost EtCO₂, sztywność mięśni (szczękościsk), tachykardia, hipertermia, kwasica, hiperkaliemia i rabdomioliza. Leczenie: odstawić czynnik wywołujący, hiperwentylować 100% tlenem i podać **dantrolen dożylnie**, który wiąże RYR1 i hamuje uwalnianie Ca²⁺ z siateczki sarkoplazmatycznej. Dantrolenu nie łączy się z blokerami kanału wapniowego (ryzyko hiperkaliemii i niewydolności serca).", "**Leki miejscowo znieczulające** blokują **kanały sodowe bramkowane napięciem** od wewnątrz komórki. Do kanału wnikają w postaci niezjonizowanej, a działają jako kation. W tkance objętej stanem zapalnym (kwaśne pH) działają słabiej, bo większa część leku jest zjonizowana. Najpierw blokują cienkie włókna bólowe (Aδ i C), a na końcu ruchowe. **Estry** (prokaina, benzokaina, **tetrakaina**, chloroprokaina, kokaina) rozkładają esterazy osoczowe i częściej dają **reakcje alergiczne** (metabolit PABA). **Amidy** (**lidokaina**, **bupiwakaina**, ropiwakaina, lewobupiwakaina, mepiwakaina, artykaina, prilokaina) metabolizuje wątroba. Nazwy amidów mają w rdzeniu dwa „i” (lIdokaIna). **Adrenalina** obkurcza naczynia, wydłuża działanie i zmniejsza toksyczność ogólną, ale nie wolno jej stosować w okolicach z krążeniem krańcowym (np. palce, prącie) w niektórych technikach. **Toksyczność ogólna (LAST)**: najpierw objawy z OUN (drętwienie okolicy ust, metaliczny smak, szumy uszne, drgawki, śpiączka), potem z układu krążenia (zaburzenia rytmu, zatrzymanie krążenia; najbardziej kardiotoksyczna jest **bupiwakaina**). Leczenie: tlen, opanowanie drgawek (benzodiazepina) i **20% emulsja lipidowa dożylnie**. **Prilokaina** (i benzokaina) może wywołać **methemoglobinemię**, którą leczy się błękitem metylenowym. Kokaina jako jedyna obkurcza naczynia, bo hamuje wychwyt zwrotny noradrenaliny.", "Uwaga do źródeł: w dokumentach EMA zweryfikowałem sugammadeks (EPAR) i dantrolen (Agilus RMP). Pozostała część rozdziału opiera się na wiedzy podręcznikowej."], "review": [{"h": "Anestetyki wziewne", "items": ["**MAC** – stężenie pęcherzykowe, przy którym 50% pacjentów nie reaguje ruchem na nacięcie; **mały MAC = silny lek**; MAC ↓ u starszych, w hipotermii, z opioidami i benzodiazepinami; ↑ u dzieci, alkoholików", "**Współczynnik krew/gaz**: mały → szybka indukcja i wybudzenie (**desfluran < N₂O < sewofluran** < izofluran)", "**Sewofluran** – nie drażni dróg oddechowych → **indukcja wziewna (dzieci)**", "**Desfluran** – najszybsze wybudzenie, drażni drogi oddechowe (kaszel, skurcz krtani), tachykardia", "Halogenowe: ↓ RR (rozszerzenie naczyń), depresja oddechu, **rozszerzenie oskrzeli**, ↑ przepływu mózgowego (↑ ICP), rozkurcz macicy, **nasilają leki zwiotczające**, wyzwalacz **hipertermii złośliwej**", "**Podtlenek azotu**: MAC > 100% (słaby anestetyk, silny analgetyk), **dyfuzja do przestrzeni z gazem** (odma, niedrożność jelit, ucho środkowe) – przeciwwskazany; **inaktywacja witaminy B12** (neuropatia, niedokrwistość megaloblastyczna), nudności, hipoksja dyfuzyjna przy wybudzeniu"]}, {"h": "Anestetyki dożylne", "items": ["**Propofol** (GABA_A): szybka indukcja, TIVA, sedacja; **przeciwwymiotny**; ↓ RR, bezdech, ból przy wstrzyknięciu; **zespół poinfuzyjny propofolu** (kwasica, rabdomioliza, hiperkaliemia, niewydolność serca) przy długich, dużych wlewach", "**Ketamina** (antagonista **NMDA**): znieczulenie dysocjacyjne, **silna analgezja**, **↑ RR i HR** (sympatykomimetycznie), **rozszerzenie oskrzeli**, zachowane odruchy → wstrząs, astma, warunki polowe; halucynacje, koszmary przy wybudzeniu (benzodiazepina), ↑ ślinienia; esketamina – depresja lekooporna", "**Etomidat**: **stabilność hemodynamiczna**; **hamowanie 11β-hydroksylazy** (supresja nadnerczy), mioklonie, PONV", "**Tiopental** (barbiturat): szybki, kumulacja; **przeciwwskazany w porfirii**; martwica przy podaniu dotętniczym", "**Midazolam**: premedykacja, sedacja, amnezja wsteczna/następcza; antagonista **flumazenil**", "**Deksmedetomidyna** (α₂-agonista): sedacja „do wybudzenia”, bez depresji oddechu; bradykardia, hipotensja", "Opioidy: fentanyl, sufentanyl, **remifentanyl** (esterazy osoczowe → krótki czas niezależny od długości wlewu); antagonista nalokson"]}, {"h": "Leki zwiotczające", "items": ["**Sukcynylocholina** (depolaryzujący agonista nAChR): **fascykulacje**, start ~1 min, czas 5–10 min, rozkład przez **butyrylocholinoesterazę** (niedobór → przedłużony bezdech); **szybka intubacja (RSI)**", "Sukcynylocholina – działania: **hiperkaliemia** (oparzenia, uraz rdzenia, unieruchomienie, miopatie, rabdomioliza – przeciwwskazana), bradykardia (dzieci, druga dawka), bóle mięśni, ↑ ciśnienia śródgałkowego/śródczaszkowego, **hipertermia złośliwa**, szczękościsk", "**Niedepolaryzujące** (kompetycyjni antagoniści nAChR): steroidowe – **rokuronium** (szybki start – alternatywa w RSI), wekuronium, pankuronium (wagolityczny, tachykardia); benzylizochinolinowe – atrakurium (**uwalnia histaminę**), **cisatrakurium**", "Atrakurium/cisatrakurium – **eliminacja Hofmanna** (spontaniczna, zależna od pH i temperatury) → wybór w niewydolności nerek i wątroby", "Nasilają blokadę: **anestetyki wziewne, aminoglikozydy**, magnez, lit, hipotermia, kwasica, hipokaliemia, miastenia (↑ wrażliwości na niedepolaryzujące)", "Monitorowanie: stymulacja nerwu (TOF – train-of-four)"]}, {"h": "Odwracanie blokady i hipertermia złośliwa", "items": ["**Neostygmina** (inhibitor AChE) → ↑ ACh → odwraca blok **niedepolaryzujący**; + **atropina/glikopironium** (osłona przed bradykardią i wydzielaniem); nie odwraca głębokiego bloku; **nasila** blok sukcynylocholiny", "**Sugammadeks** – γ-cyklodekstryna, **enkapsuluje rokuronium i wekuronium** (dzieci od urodzenia – rokuronium); odwraca także głęboki blok; **nie działa** na sukcynylocholinę i benzylizochinoliny", "Sugammadeks – działania: nadwrażliwość/anafilaksja, bradykardia; **↓ skuteczności antykoncepcji hormonalnej** (jak pominięta tabletka)", "**Hipertermia złośliwa** – mutacja **RYR1** (rzadziej CACNA1S); wyzwalacze: **anestetyki wziewne halogenowe i sukcynylocholina**", "Objawy: **↑ EtCO₂** (wczesny), szczękościsk/sztywność, tachykardia, hipertermia (późno), kwasica mieszana, hiperkaliemia, rabdomioliza, mioglobinuria", "Leczenie: odstawić wyzwalacz, hiperwentylacja **100% O₂**, **dantrolen i.v.** (wiąże RYR1 → ↓ uwalniania Ca²⁺ z siateczki sarkoplazmatycznej), chłodzenie, leczenie hiperkaliemii; **nie łączyć dantrolenu z blokerami kanału wapniowego**", "Bezpieczne u podatnych: propofol, ketamina, opioidy, benzodiazepiny, N₂O, leki niedepolaryzujące, miejscowo znieczulające"]}, {"h": "Leki miejscowo znieczulające", "items": ["Mechanizm: blokada **kanałów sodowych bramkowanych napięciem** od strony wewnątrzkomórkowej (postać zjonizowana); preferencja kanałów otwartych/inaktywowanych (blok zależny od użycia)", "Przenikają przez błonę jako **zasada niezjonizowana** → w **kwaśnym środowisku (zapalenie, ropień) słabsze działanie**", "Kolejność blokady: **cienkie włókna bólowe (Aδ, C)** i autonomiczne → temperatura, dotyk → **ruchowe na końcu**", "**Estry**: prokaina, chloroprokaina, **tetrakaina**, benzokaina, kokaina – **esterazy osoczowe**, metabolit **PABA → alergie**", "**Amidy**: **lidokaina**, mepiwakaina, prilokaina, artykaina, **bupiwakaina**, ropiwakaina, lewobupiwakaina – **wątroba** (CYP); alergia rzadka; „dwa i” w nazwie", "**Adrenalina** w roztworze: ↓ wchłaniania → dłuższe działanie, mniejsza toksyczność, mniejsze krwawienie", "**LAST** (toksyczność ogólna): drętwienie wokół ust, metaliczny smak, szumy uszne, zaburzenia widzenia → **drgawki** → śpiączka; kardiotoksyczność (bradyarytmie, VT/VF, asystolia) – **bupiwakaina najbardziej kardiotoksyczna**", "Leczenie LAST: przerwać podawanie, tlen, benzodiazepina na drgawki, **20% emulsja lipidowa i.v.**, RKO (mniejsze dawki adrenaliny)", "**Prilokaina**, benzokaina → **methemoglobinemia** (leczenie: **błękit metylenowy**)", "**Kokaina** – jedyny miejscowy anestetyk **obkurczający naczynia** (hamuje wychwyt NA)", "Lidokaina – także lek przeciwarytmiczny klasy Ib; EMLA (lidokaina + prilokaina) – na skórę przed wkłuciem"]}], "cards": [{"q": "Co to jest MAC anestetyku wziewnego?", "a": "**Minimalne stężenie pęcherzykowe**, przy którym 50% pacjentów nie reaguje ruchem na nacięcie skóry. **Im mniejszy MAC, tym silniejszy anestetyk**."}, {"q": "Jaki wpływ na szybkość indukcji ma współczynnik rozpuszczalności krew/gaz?", "a": "**Mały współczynnik** (słaba rozpuszczalność we krwi) → szybkie osiągnięcie stężenia w mózgu → **szybka indukcja i wybudzenie** (desfluran, N₂O, sewofluran)."}, {"q": "Który anestetyk wziewny stosuje się do indukcji wziewnej u dzieci i dlaczego?", "a": "**Sewofluran** – nie drażni dróg oddechowych, ma przyjemny zapach i szybki początek działania."}, {"q": "Dlaczego desfluranu nie stosuje się do indukcji wziewnej?", "a": "**Drażni drogi oddechowe** – kaszel, skurcz krtani, nadmierne wydzielanie; może wywołać tachykardię."}, {"q": "Jakie są przeciwwskazania i działania niepożądane podtlenku azotu?", "a": "**Dyfunduje do zamkniętych przestrzeni z gazem** – przeciwwskazany w odmie, niedrożności jelit, zatorze powietrznym, chorobach ucha środkowego. Przewlekle **inaktywuje witaminę B12** (neuropatia, niedokrwistość megaloblastyczna)."}, {"q": "Jakie są zalety propofolu?", "a": "Szybki początek, krótkie działanie, szybkie i „czyste” wybudzenie, **działanie przeciwwymiotne** – lek do indukcji, TIVA i sedacji."}, {"q": "Czym jest zespół poinfuzyjny propofolu?", "a": "Powikłanie długotrwałych wlewów dużych dawek: **kwasica metaboliczna, rabdomioliza, hiperkaliemia, hipertriglicerydemia, niewydolność serca i nerek**, arytmie."}, {"q": "Jaki jest mechanizm działania ketaminy i jej charakterystyczne cechy?", "a": "**Antagonista receptora NMDA** – znieczulenie dysocjacyjne, **silna analgezja**, **↑ RR i HR**, rozszerzenie oskrzeli, zachowane odruchy z dróg oddechowych; halucynacje przy wybudzeniu."}, {"q": "U jakich pacjentów ketamina jest szczególnie przydatna?", "a": "We **wstrząsie / niestabilności hemodynamicznej**, w **astmie** (bronchodylatacja), w warunkach przedszpitalnych i polowych, do analgezji przy bolesnych zabiegach."}, {"q": "Jaka jest zaleta i główna wada etomidatu?", "a": "Zaleta: **stabilność hemodynamiczna**. Wada: **hamuje 11β-hydroksylazę → supresja syntezy kortyzolu**; także mioklonie, nudności."}, {"q": "W jakiej chorobie metabolicznej przeciwwskazane są barbiturany (tiopental)?", "a": "W **porfirii** – indukują syntazę ALA i mogą wywołać ostry napad porfirii."}, {"q": "Czym wyróżnia się remifentanyl?", "a": "Jest hydrolizowany przez **niespecyficzne esterazy osoczowe i tkankowe** → bardzo krótkie działanie niezależne od czasu wlewu i funkcji wątroby/nerek."}, {"q": "Jak działa sukcynylocholina?", "a": "Jest **depolaryzującym agonistą receptora nikotynowego** płytki motorycznej – utrzymuje depolaryzację (fascykulacje), po której płytka staje się niepobudliwa."}, {"q": "Czym jest rozkładana sukcynylocholina i co się dzieje przy niedoborze tego enzymu?", "a": "**Butyrylocholinoesterazą** (pseudocholinoesterazą) osoczową. Przy wrodzonym niedoborze/atypowym enzymie – **przedłużony bezdech** (godziny)."}, {"q": "W jakich stanach sukcynylocholina grozi groźną hiperkaliemią?", "a": "Przy **oparzeniach, rozległych urazach, uszkodzeniu rdzenia, unieruchomieniu, chorobach nerwowo-mięśniowych/miopatiach** (np. dystrofia Duchenne'a), rabdomiolizie – proliferacja receptorów pozazłączowych."}, {"q": "Jakie są działania niepożądane sukcynylocholiny?", "a": "**Hiperkaliemia**, bradykardia, bóle mięśni (fascykulacje), ↑ ciśnienia śródgałkowego, śródczaszkowego i śródżołądkowego, **hipertermia złośliwa**, szczękościsk, przedłużony bezdech."}, {"q": "Jak działają niedepolaryzujące leki zwiotczające?", "a": "Są **kompetycyjnymi antagonistami receptora nikotynowego** płytki motorycznej (bez fascykulacji) – działanie odwracają inhibitory AChE lub sugammadeks (aminosteroidy)."}, {"q": "Który niedepolaryzujący lek zwiotczający może zastąpić sukcynylocholinę w szybkiej intubacji?", "a": "**Rokuronium** w dużej dawce (szybki początek); w razie potrzeby blok można szybko odwrócić **sugammadeksem**."}, {"q": "Co to jest eliminacja Hofmanna i których leków dotyczy?", "a": "**Spontaniczny rozpad** zależny od pH i temperatury, niezależny od wątroby i nerek – **atrakurium i cisatrakurium** (wybór w niewydolności narządowej)."}, {"q": "Który lek zwiotczający uwalnia histaminę?", "a": "**Atrakurium** (i miwakurium; dawniej tubokuraryna) – zaczerwienienie, hipotensja, skurcz oskrzeli; cisatrakurium praktycznie nie uwalnia histaminy."}, {"q": "Jakie leki i stany nasilają działanie niedepolaryzujących leków zwiotczających?", "a": "**Anestetyki wziewne, aminoglikozydy**, magnez, lit, blokery kanału wapniowego, hipotermia, kwasica, hipokaliemia, **miastenia**."}, {"q": "Jak odwraca się blok niedepolaryzujący neostygminą i dlaczego dodaje się atropinę?", "a": "**Neostygmina** hamuje AChE → ↑ ACh, która wypiera lek z receptora. **Atropinę lub glikopironium** podaje się, by zablokować muskarynowe skutki ↑ ACh (bradykardię, ślinienie, skurcz oskrzeli)."}, {"q": "Czy neostygmina odwraca blok wywołany sukcynylocholiną?", "a": "**Nie** – nasila blok depolaryzujący (fazę I), bo ↑ ACh dodatkowo depolaryzuje płytkę."}, {"q": "Jak działa sugammadeks?", "a": "Jest **selektywnym lekiem wiążącym zwiotczające** (γ-cyklodekstryną) – **enkapsuluje rokuronium i wekuronium** i je inaktywuje; odwraca także głęboką blokadę."}, {"q": "Na które leki zwiotczające sugammadeks nie działa?", "a": "Na **sukcynylocholinę** i **benzylizochinoliny** (atrakurium, cisatrakurium) – nie mają struktury steroidowej."}, {"q": "Jaką interakcję sugammadeksu trzeba omówić z pacjentką?", "a": "Sugammadeks może **wiązać progestagen** → zmniejsza skuteczność antykoncepcji hormonalnej (traktować jak pominiętą tabletkę; dodatkowa metoda przez 7 dni)."}, {"q": "Czym jest hipertermia złośliwa i co ją wywołuje?", "a": "Farmakogenetyczna choroba mięśni szkieletowych (najczęściej mutacja **RYR1**) – niekontrolowane uwalnianie Ca²⁺ wywołane przez **anestetyki wziewne halogenowe i/lub sukcynylocholinę**."}, {"q": "Jaki jest najwcześniejszy objaw hipertermii złośliwej?", "a": "**Niewyjaśniony wzrost EtCO₂** (hiperkapnia) i tachykardia; dalej sztywność (szczękościsk), kwasica, hiperkaliemia, rabdomioliza; gorączka bywa późna."}, {"q": "Jak leczy się hipertermię złośliwą?", "a": "Odstawić wyzwalacz, hiperwentylacja **100% tlenem**, **dantrolen i.v.**, chłodzenie, leczenie kwasicy i hiperkaliemii, monitorowanie diurezy."}, {"q": "Jaki jest mechanizm działania dantrolenu?", "a": "Wiąże **receptor rianodynowy RYR1** i stabilizuje go w stanie spoczynku → **hamuje uwalnianie Ca²⁺ z siateczki sarkoplazmatycznej** mięśni szkieletowych."}, {"q": "Czego nie łączyć z dantrolenem?", "a": "**Blokerów kanału wapniowego** (np. werapamil) – ryzyko **hiperkaliemii i niewydolności serca**."}, {"q": "Jaki jest mechanizm działania leków miejscowo znieczulających?", "a": "Blokują **kanały sodowe bramkowane napięciem** (od wewnątrz komórki) → brak potencjału czynnościowego i przewodzenia impulsów."}, {"q": "Dlaczego leki miejscowo znieczulające działają słabiej w tkance objętej zap
