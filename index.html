zulica", "**Sztywność karku** – opór przy przyginaniu brody do mostka; mierzona liczbą palców", "**Brudziński karkowy** – zgięcie nóg w biodrach i kolanach przy przyginaniu głowy", "**Brudziński łonowy** – ucisk na spojenie łonowe → zgięcie nóg", "**Kernig** – biodro i kolano zgięte 90°, prostujemy kolano → opór (zwykle obustronnie)", "**Amos** („trójnóg”) – siedząc z wyprostowanymi nogami podpiera się rękami z tyłu", "**Brdlik** („całowanie kolan”) – skłon niemożliwy bez zgięcia nóg; dotknięcie głową kolan możliwe do 5.–6. r.ż.", "**Lasègue** – NIE oponowy: ból wzdłuż n. kulszowego przy unoszeniu wyprostowanej nogi (norma do 80°); korzenie lędźwiowo-krzyżowe; zwykle jednostronny"]}, {"h": "Napięcie i siła", "items": ["Badane ruchami biernymi; norma – niewielki, symetryczny opór", "**Spastyczność** (piramidowa) – „scyzorykowa”: duży opór na początku, nagle ustępuje; wyraźniejsza przy szybkim ruchu", "**Sztywność** (pozapiramidowa) – „ołowiana rura”, przez cały ruch; z drżeniem – **„koło zębate”**; lepiej przy powolnym ruchu", "Niedowład (paresis) / porażenie (paralysis)", "Próba: wyciągnięte ręce, oczy zamknięte – kończyna niedowładna opada / opóźnia się", "**Miastenia** – męczliwość: słabnięcie przy powtarzaniu ruchu"]}, {"h": "Nerwy czaszkowe", "items": ["**I** – każdy przewód osobno, znane zapachy; bez amoniaku (drażni n. V)", "**II** – ostrość (Snellen: rysunki ręki/E dla przedszkolaków), pole widzenia metodą **konfrontacyjną** (od ok. 4 lat, ~50 cm), dno oka (okulista)", "**III** – wszystkie mięśnie gałki poza skośnym górnym i prostym bocznym + dźwigacz powieki + źrenica; **IV** – skośny górny; **VI** – prosty boczny", "**V** – czucie twarzy (V1 do kąta powiek + rogówka; V2 do kąta ust; V3 – żuchwa, język); punkty: nadoczodołowy, podoczodołowy, bródkowy; ruchowo żwacze, skrzydłowe (żuchwa zbacza w stronę chorą); odruch żuchwowy", "**VII ośrodkowy** – tylko dolna twarz (opadanie kącika ust, „nadymanie policzka”); czoło zachowane (unerwienie obustronne)", "**VII obwodowy** – cała połowa twarzy: nie marszczy czoła, nie domyka oka, **objaw Bella**, wygładzony fałd nosowo-wargowy; ± utrata smaku ⅔ przednich języka", "**Objaw Chwostka** – uderzenie w nerw VII przed uchem → skurcz twarzy: **tężyczka**", "**VIII** – mowa głośna z **6 m**, szept z **3 m** (po otoskopii); dalej kamerton, audiometria", "**IX/X** – łuk po stronie porażenia niżej, **języczek zbacza w stronę zdrową**, objaw firankowy; krztuszenie, płyny przez nos, mowa nosowa; X – chrypka (jednostronne), bezgłos (obustronne); IX – smak ⅓ tylnej języka", "**XI** – m. mostkowo-obojczykowo-sutkowy (skręt głowy) i górna część czworobocznego (unoszenie barków)", "**XII** – język zbacza **w stronę uszkodzenia**, zanik, drżenia pęczkowe"]}, {"h": "Odruchy fizjologiczne (poziomy)", "items": ["Brzuszne: górne **Th8–Th9**, środkowe **Th10–Th11**, dolne **Th11–Th12** (brak: otyłość, ostry brzuch, uszkodzenie rdzenia/drogi piramidowej)", "Podeszwowy – zgięcie palców; pojawia się pod koniec **2. r.ż.**", "Nosidłowy – **L1–L2**; jedyny, który u zdrowych może być niesymetryczny", "Dwugłowy **C5–C6**; trójgłowy **C6–C7**; ramienno-promieniowy **C5–C6**", "Kolanowy **L2–L4**; skokowy **S1–S2**", "**Jendrassik** – zahaczone palce rąk i rozciąganie (ułatwia odruchy z kończyn dolnych)", "Wzmożone – ośrodkowy neuron ruchowy; osłabione – obwodowy neuron, choroby mięśni; odruch polikloniczny, **stopotrząs**"]}, {"h": "Odruchy patologiczne", "items": ["**Babiński** – drażnienie podeszwy → grzbietowe zgięcie palucha ± wachlarz palców; fizjologiczny **do 2. r.ż.** (niedojrzała mielinizacja)", "Uszkodzenie powyżej skrzyżowania piramid → Babiński po stronie **przeciwnej**; poniżej → po tej samej", "**Rossolimo** – uderzenie w opuszki palców stopy → zgięcie podeszwowe palców", "**Oppenheim** – ucisk wzdłuż krawędzi piszczeli → grzbietowe zgięcie palucha", "Patologiczne + ↑napięcie + ↑odruchy głębokie = **uszkodzenie układu piramidowego**"]}, {"h": "Równowaga, zborność, czucie", "items": ["Chód po linii, potem stopa za stopą; oczy otwarte i zamknięte", "**Móżdżek** – zaburzenia podobne przy otwartych i zamkniętych oczach; chód „marynarski”", "**Sznury tylne** – nasilają się po zamknięciu oczu; chód tylnopowrózkowy (kontrola wzrokiem)", "**Romberg** – stopy złączone, ręce wyciągnięte, oczy otwarte → zamknięte", "Palec–nos, palec–palec, pięta–kolano: **dysmetria**, **drżenie zamiarowe** (móżdżek)", "**Diadochokineza** – szybkie pronacja/supinacja, opozycja kciuka, guziki; spowolnione w uszkodzeniu móżdżku; u dzieci < 5 lat fizjologicznie mniej precyzyjne", "Ataksja móżdżkowa: ropień, **ostra ataksja móżdżkowa**, guzy móżdżku/płatów czołowych, abetalipoproteinemia, ataksja-teleangiektazja", "Ataksja tylnosznurowa: choroba Friedreicha, niedobór wit. B12", "Czucie powierzchniowe: dotyk (wacik), ból (igła), temperatura (probówki), **dermoleksja**", "Zaburzona dermoleksja przy prawidłowym czuciu → zaburzenie funkcji syntetycznej kory", "Czucie głębokie: ułożenie i ruch bierny, od palców (dystalnie → proksymalnie)"]}], "cards": [{"q": "Od jakiego wieku można przeprowadzić klasyczne badanie neurologiczne, a od kiedy oczekiwać pełnej współpracy?", "a": "Klasyczny schemat – zwykle od **18.–24. miesiąca**; pełna współpraca – od ok. **5. roku życia**."}, {"q": "Wymień 8 punktów schematu badania neurologicznego.", "a": "1. Świadomość 2. Objawy oponowe 3. Napięcie i siła mięśniowa 4. Nerwy czaszkowe 5. Odruchy fizjologiczne 6. Odruchy patologiczne 7. Równowaga, zborność, ruchy precyzyjne 8. Czucie."}, {"q": "O czym świadczą dodatnie objawy oponowe?", "a": "O podrażnieniu lub zapaleniu opon mózgowo-rdzeniowych albo o **krwotoku podpajęczynówkowym**."}, {"q": "Jak bada się i mierzy sztywność karku?", "a": "Bierne przyginanie głowy leżącego dziecka, by broda dotknęła mostka; przy sztywności – opór. Stopień – **liczba palców** mieszczących się między brodą a mostkiem."}, {"q": "Na czym polega objaw Brudzińskiego karkowy?", "a": "Bierne przyginanie głowy do mostka wywołuje samoistne **zgięcie kończyn dolnych** w biodrach i kolanach."}, {"q": "Na czym polega objaw Brudzińskiego łonowy?", "a": "Ucisk na **spojenie łonowe** powoduje zgięcie kończyn dolnych w biodrach i kolanach."}, {"q": "Na czym polega objaw Kerniga?", "a": "Kończynę zgiętą w kolanie zginamy w biodrze do 90°, potem prostujemy kolano – **opór mięśniowy** uniemożliwiający wyprost = objaw dodatni (zwykle obustronnie)."}, {"q": "Czy objaw Lasègue'a jest objawem oponowym?", "a": "**Nie** – świadczy o zapaleniu/ucisku **korzeni nerwowych** dolnej części rdzenia (ból wzdłuż n. kulszowego przy unoszeniu wyprostowanej nogi; norma do ok. 80°)."}, {"q": "Czym jest objaw Amosa?", "a": "„Objaw trójnogu” – dziecko siedzące z wyprostowanymi nogami musi podpierać się rękami za tułowiem."}, {"q": "Czym jest objaw Brdlika?", "a": "„Objaw całowania kolan” – dziecko nie może wykonać skłonu bez zgięcia nóg w biodrach i kolanach. Dotknięcie głową kolan jest fizjologicznie możliwe do 5.–6. r.ż."}, {"q": "Czym różni się spastyczność od sztywności?", "a": "**Spastyczność** (piramidowa) – „scyzorykowa”: duży opór na początku ruchu biernego, który nagle ustępuje. **Sztywność** (pozapiramidowa) – stały opór przez cały ruch („ołowiana rura”), z drżeniem – „koło zębate”."}, {"q": "Jaka próba ujawnia niewielki niedowład kończyn górnych?", "a": "Dziecko z zamkniętymi oczami trzyma wyciągnięte przed siebie ręce – po stronie niedowładu kończyna **opada** (lub „opóźnia się” przy unoszeniu)."}, {"q": "Co charakteryzuje miastenię w badaniu siły?", "a": "Osłabienie mięśni narastające w miarę **powtarzania** tego samego ruchu."}, {"q": "Dlaczego do badania węchu nie używa się amoniaku?", "a": "Bo drażni błonę śluzową i pobudza bardziej **nerw trójdzielny** niż węchowy."}, {"q": "Od jakiego wieku można badać pole widzenia i jaką metodą?", "a": "U dzieci **powyżej ok. 4 lat**, metodą **konfrontacyjną** (porównanie z polem widzenia badającego, ok. 50 cm, każde oko osobno)."}, {"q": "Które mięśnie gałki ocznej unerwiają nerwy IV i VI?", "a": "**IV** – mięsień skośny górny; **VI** – mięsień prosty zewnętrzny (boczny). Pozostałe – nerw III."}, {"q": "Jakie są punkty wyjścia gałęzi nerwu trójdzielnego?", "a": "Nerw **nadoczodołowy** (V1) – wcięcie nadoczodołowe; **podoczodołowy** (V2) – otwór podoczodołowy; **bródkowy** (V3) – otwór bródkowy."}, {"q": "W którą stronę zbacza żuchwa przy jednostronnym porażeniu mięśnia skrzydłowego?", "a": "**W stronę chorą** (dziecko nie może przesunąć jej w stronę zdrową)."}, {"q": "Jak odróżnić ośrodkowe od obwodowego porażenia nerwu VII?", "a": "**Ośrodkowe** – tylko dolna część twarzy (kącik ust, policzek); czoło i zamykanie oka zachowane (unerwienie korowe obustronne). **Obwodowe** – cała połowa twarzy: brak marszczenia czoła, niedomykanie oka, **objaw Bella**, wygładzony fałd nosowo-wargowy."}, {"q": "Czym jest objaw Bella?", "a": "W obwodowym porażeniu n. VII przy próbie zaciśnięcia powiek gałka oczna po stronie porażenia **zwraca się ku górze** (oko się nie domyka)."}, {"q": "Czym jest objaw Chwostka i o czym świadczy?", "a": "Uderzenie młoteczkiem w pień n. VII przed uchem wywołuje skurcz mięśni twarzy – **tężyczka**."}, {"q": "Jak orientacyjnie bada się słuch?", "a": "Po otoskopii: dziecko bokiem, oczy zamknięte, zatyka drugie ucho; mowa głośna z **6 m**, szept z **3 m**. Odchylenia → próby stroikowe, audiometria."}, {"q": "Jak wygląda jednostronne porażenie nerwów IX i X?", "a": "Łuk podniebienny po stronie porażenia niżej i nie unosi się, **języczek zbacza w stronę zdrową**, objaw firankowy tylnej ściany gardła; krztuszenie, płyny przez nos, mowa nosowa; chrypka (n. X)."}, {"q": "W którą stronę zbacza język przy porażeniu nerwu XII?", "a": "**W stronę uszkodzenia**; po tej stronie widoczny zanik mięśni języka."}, {"q": "Podaj poziomy odruchów brzusznych.", "a": "Górne – **Th8–Th9**; środkowe – **Th10–Th11**; dolne – **Th11–Th12**."}, {"q": "Kiedy brak odruchów brzusznych?", "a": "U otyłych, w ostrych chorobach chirurgicznych brzucha, przy uszkodzeniu rdzenia kręgowego lub drogi piramidowej."}, {"q": "Który odruch może być u zdrowych niesymetryczny?", "a": "**Odruch nosidłowy** (L1–L2) – drażnienie przyśrodkowej powierzchni uda → uniesienie jądra."}, {"q": "Podaj poziomy odruchów: dwugłowy, trójgłowy, kolanowy, skokowy.", "a": "Dwugłowy **C5–C6**; trójgłowy **C6–C7**; kolanowy **L2–L4**; skokowy **S1–S2** (ramienno-promieniowy C5–C6)."}, {"q": "Na czym polega manewr Jendrassika?", "a": "Dziecko zahacza palce jednej ręki o palce drugiej i je rozciąga – odwraca uwagę i ułatwia wywołanie odruchów z kończyn dolnych."}, {"q": "Co oznaczają wzmożone, a co osłabione odruchy głębokie?", "a": "Wzmożone – uszkodzenie **ośrodkowego** neuronu ruchowego. Osłabione – uszkodzenie **obwodowego** neuronu ruchowego lub choroby mięśni."}, {"q": "Do kiedy odruch Babińskiego jest fizjologiczny i dlaczego?", "a": "Do **2. roku życia** – z powodu późnej mielinizacji dróg piramidowych."}, {"q": "Po której stronie wystąpi odruch Babińskiego przy uszkodzeniu powyżej skrzyżowania piramid?", "a": "Po stronie **przeciwnej** do uszkodzenia (poniżej skrzyżowania – po tej samej stronie)."}, {"q": "Jak wywołuje się odruch Rossolimo?", "a": "Mocnym uderzeniem opuszkami palców w opuszki palców stopy – dodatni, gdy palce zginają się podeszwowo."}, {"q": "Jak wywołuje się odruch Oppenheima?", "a": "Przesuwając palce z uciskiem wzdłuż krawędzi kości piszczelowej od guzowatości do stawu skokowego – dodatni: grzbietowe zgięcie palucha."}, {"q": "Jak odróżnić zaburzenia równowagi móżdżkowe od tylnosznurowych?", "a": "Móżdżkowe – podobne przy oczach otwartych i zamkniętych. Tylnosznurowe – **nasilają się po zamknięciu oczu** (dodatni Romberg)."}, {"q": "Na czym polega próba Romberga?", "a": "Dziecko stoi ze złączonymi stopami i wyciągniętymi rękami, najpierw z oczami otwartymi, potem zamkniętymi (także stopa przed stopą)."}, {"q": "Co oznacza drżenie zamiarowe w próbie palec–nos?", "a": "Drżenie nasilające się przy zbliżaniu do celu – objaw **uszkodzenia móżdżku** (razem z dysmetrią)."}, {"q": "Czym jest diadochokineza i jak ją oceniać u małych dzieci?", "a": "Zdolność wykonywania szybkich naprzemiennych ruchów (pronacja–supinacja, opozycja kciuka, guziki). Spowolniona w uszkodzeniu móżdżku. U dzieci do ok. **5. r.ż.** precyzja jest fizjologicznie mniejsza."}, {"q": "Jaka jest najczęstsza przyczyna ataksji u dzieci?", "a": "**Uszkodzenie móżdżku** (np. ostra ataksja móżdżkowa po infekcji, ropień, guzy)."}, {"q": "Czym jest dermoleksja i co oznacza jej zaburzenie?", "a": "Rozpoznawanie znaków kreślonych na skórze. Zaburzona przy prawidłowym czuciu powierzchniowym → zaburzenie **czynności syntetycznej kory mózgu**."}, {"q": "Jak bada się czucie głębokie?", "a": "Przy zamkniętych oczach dziecko określa kierunek ruchu biernego i ułożenie kończyny; zaczynamy od stawów **dystalnych** (palce), przechodząc proksymalnie przy zaburzeniach."}]}, {"id": "neuro-niemowle", "num": "4.8", "title": "Badanie neurologiczne niemowląt", "summary": ["Badanie neurologiczne niemowlęcia ocenia stan układu nerwowego i jednocześnie **poziom rozwoju psychoruchowego**. Dziecko nie może płakać ani się bać. Najpierw orientacyjnie porównuje się rozwój w czterech sferach (lokomocja i kontrola postawy, koordynacja wzrokowo-ruchowa, kontakty społeczne, mowa) z normą dla wieku. Badanie prowadzi się w **czterech pozycjach**: na plecach, w pozycji pionowej, na brzuchu i w podwieszeniu poziomym.", "**Objawy oponowe** u niemowlęcia to głównie uwypuklone i nadmiernie tętniące ciemiączko, poszerzone szwy, odgięciowe ułożenie głowy i opór przy zginaniu karku. Objaw Brudzińskiego karkowy ma w 1. półroczu małą wartość, bo występuje też u zdrowych. **Nerwy czaszkowe** ocenia się w ograniczonym zakresie. Do 6. tygodnia występuje tylko reakcja na światło (odruch oczno-powiekowy i oczno-karkowy). Pod koniec 2. miesiąca niemowlę wodzi wzrokiem, a pod koniec 4. miesiąca mruga obronnie. U noworodka fizjologiczny jest objaw „oczu lalki”. Słuch do około 3. miesiąca ocenia się odruchem Moro i odruchem uszno-powiekowym, a po 4.–6. miesiącu po zwrocie głowy do dźwięku.", "**Ułożenie.** W 1. półroczu przeważa napięcie zginaczy (ułożenie zgięciowe), które potem przechodzi w pośrednie i wyprostne. Do 6. miesiąca na ułożenie kończyn wpływa pozycja głowy (odruchy toniczne szyjne). Ułożenia patologiczne to: odgięciowe (mózgowe porażenie dziecięce), utrwalona asymetria (niedowład połowiczy, wada kręgosłupa), **„pozycja żabki”** (hipotonia) i wyprostne (hipertonia). **Ruchy** w 1. półroczu są uogólnione i symetryczne, a w 2. półroczu stają się wybiórcze. Chwytanie rozwija się od odruchu chwytnego (do 3.–4. miesiąca), przez chwyt nakrywkowy (do około 6. miesiąca) i nożycowy (do 9. miesiąca), do chwytu z przeciwstawieniem kciuka.", "**Napięcie mięśniowe** ocenia się przez spoistość mięśni, zakres ruchów biernych i symetrię (głowa w linii środkowej) oraz przez odruchy głębokie. Różnice wiekowe: odruchu z mięśnia trójgłowego nie da się wywołać do 3. tygodnia, odruch skokowy jest polikloniczny do 6. tygodnia, a przy odruchu kolanowym do 6. miesiąca kurczą się też przywodziciele drugiej nogi. Odruchy brzuszne pojawiają się w 7.–8. miesiącu, a podeszwowy pod koniec 2. roku. Odruch Rossolimo jest fizjologiczny do 6.–7. miesiąca, a tendencja do objawu Babińskiego do 2. roku życia.", "**Automatyzmy ruchowe** to odruchy noworodkowe o określonym czasie występowania. Na plecach bada się: skrzyżowany wyprost (do 2. miesiąca), asymetryczny toniczny odruch szyjny (ATOS, do 6. miesiąca), odruch chwytny (do 3. miesiąca), **Moro** (do 5.–6. miesiąca), toniczny szyjny prostujący (do 6. miesiąca), spiralny (od 7.–8. miesiąca do 2.–3. roku), szukania (do 3.–4. miesiąca) i ssania (do końca 1. roku). W pozycji pionowej: podparcie i automatyczny chód (do 4. miesiąca), astazja (5.–6. miesiąc), gotowość do stania (od 7.–9. miesiąca) i błędnikowy odruch prostujący głowę. Na brzuchu: toniczny szyjny symetryczny (3.–6. miesiąc), **Galant** (do 6. miesiąca) i automatyczne pełzanie. W podwieszeniu poziomym ocenia się ustawienie głowy (do 2. miesiąca poniżej osi tułowia, od 2. w osi, od 4. powyżej), **odruch Landaua** (od 6.–7. miesiąca), gotowość do skoku (od 7.–8. miesiąca) i **reakcję spadochronową** (od 8.–9. miesiąca). Patologiczne jest zarówno **przetrwanie** automatyzmu ponad normę, jak i jego **brak**."], "review": [{"h": "Zasady", "items": ["Ocena = stan neurologiczny + **poziom rozwoju psychoruchowego**", "Nie badać dziecka płaczącego, niespokojnego, przestraszonego", "4 sfery: lokomocja i postawa, koordynacja wzrokowo-ruchowa, kontakty społeczne, mowa", "4 pozycje: **na plecach, pionowa, na brzuchu, podwieszenie poziome**"]}, {"h": "Objawy oponowe i nerwy czaszkowe", "items": ["Oponowe u niemowlęcia: **uwypuklone, tętniące ciemiączko**, poszerzone szwy, odgięcie głowy, opór karku", "Brudziński karkowy w 1. półroczu – mała wartość (bywa u zdrowych)", "n. I – nie do oceny", "n. II: do 6. tyg. – odruch oczno-powiekowy i oczno-karkowy na światło; koniec 2. mies. – wodzi wzrokiem; koniec 4. mies. – mruganie obronne", "Noworodek: **objaw oczu lalki** (fizjologiczny); skojarzone patrzenie od 2. mies., płynne ruchy gałek ok. 5. mies.", "Ustawienie gałek – odbicie światła w środku źrenic; badamy tylko reakcję bezpośrednią", "n. V – ssanie, odruch żuchwowy; n. VII – mimika spontaniczna", "n. VIII: do ok. 3. mies. – Moro, odruch uszno-powiekowy; po 4.–6. mies. – zwrot głowy do dźwięku", "n. IX/X – podniebienie, ssanie; n. XII – język"]}, {"h": "Ułożenie i ruchy", "items": ["1. półrocze – przewaga napięcia zginaczy (**ułożenie zgięciowe**, ręce przywiedzione)", "2. półrocze – pośrednie → wyprostne", "Patologiczne: **odgięciowe** (MPD); utrwalona asymetria (niedowład połowiczy, wada kręgosłupa); **„pozycja żabki”** (hipotonia); wyprostne (hipertonia)", "Ruchy: 1. półrocze – uogólnione, symetryczne (szybkie zgięcie, powolny wyprost); 2. półrocze – wybiórcze, dystalne", "Chwytanie: odruch chwytny (do 3.–4. mies.) → nakrywkowy (do ~6. mies.) → nożycowy (do 9. mies.) → z przeciwstawieniem kciuka"]}, {"h": "Napięcie i odruchy", "items": ["Spoistość mięśni (porównaj z mięśniami między I i II k. śródręcza), zakres ruchów biernych, symetria – **głowa w linii środkowej**", "Odruch z m. trójgłowego – niewywoływalny do **3. tyg.**", "Skokowy polikloniczny – do **6. tyg.**", "Kolanowy z kurczem przywodzicieli drugiej nogi – do **6. mies.**", "Brzuszne właściwe – od **7.–8. mies.** (u noworodka rozlana reakcja)", "Podeszwowy – pod koniec **2. r.ż.**", "Rossolimo – fizjologiczny do **6.–7. mies.**; tendencja do Babińskiego – do **2. r.ż.**"]}, {"h": "Automatyzmy – na plecach", "items": ["**Skrzyżowany wyprost** – ucisk podudzia → wyprost i przywiedzenie drugiej nogi (do **2. mies.**)", "**ATOS** – skręt głowy → wyprost kończyn po stronie twarzy, zgięcie po stronie potylicy (do **6. mies.**)", "**Chwytny** rąk i stóp – max 2.–6. tyg., do **3. mies.**", "**Moro** – bodziec dźwiękowy/wstrząs → I faza odwiedzenie i wyprost rąk, II faza zgięcie i przywiedzenie („obejmowanie”) (do **5.–6. mies.**)", "Toniczny szyjny prostujący tułów – obrót całego ciała za głową (do 6. mies., max do 3.)", "Prostujący **spiralny** – obrót barków, potem miednicy (od 7.–8. mies. do 2.–3. r.ż.)", "**Szukania** – drażnienie policzka → zwrot głowy (do **3.–4. mies.**; może nie wystąpić po karmieniu)", "**Ssania** – do końca **1. r.ż.**"]}, {"h": "Automatyzmy – pionowo, na brzuchu, w podwieszeniu", "items": ["Pionowo: **podparcie i chód automatyczny** do **4. mies.** → **astazja** 5.–6. mies. → gotowość do stania od 7.–9. mies.", "Błędnikowy odruch prostujący głowę – przechylenie → szczyt głowy najwyżej, usta poziomo", "Na brzuchu: **toniczny szyjny symetryczny** (3.–6. mies.) – odgięcie głowy → wyprost rąk i zgięcie nóg; zgięcie głowy → odwrotnie", "**Galant** – drażnienie wzdłuż linii pachowej na wys. L1 → wygięcie tułowia wklęsłością ku bodźcowi (do **6. mies.**)", "Automatyczne pełzanie – podparcie stóp", "Podwieszenie poziome: głowa do 2. mies. **poniżej** osi tułowia; od 2. mies. w osi; od 4. **powyżej**", "**Landau** (od **6.–7. mies.**) – uniesienie głowy + wygięcie tułowia wypukłością w dół + wyprost bioder", "Gotowość do skoku (od 7.–8. mies.) – wyprost rąk przy zbliżaniu do podłoża głową w dół", "**Reakcja spadochronowa** (od **8.–9. mies.**) – postawa skoczka spadochronowego", "Patologia = **przetrwanie** ponad normę ORAZ **brak** wykształcenia odruchu"]}], "cards": [{"q": "W jakich czterech pozycjach bada się neurologicznie niemowlę?", "a": "Na plecach (supinacyjna), w pozycji pionowej, na brzuchu (pronacyjna) i w podwieszeniu poziomym."}, {"q": "Jakie są objawy oponowe u niemowlęcia?", "a": "**Uwypuklenie i nadmierne tętnienie ciemiączka**, poszerzenie szwów, odgięciowe ułożenie głowy, opór przy badaniu sztywności karku."}, {"q": "Dlaczego objaw Brudzińskiego karkowy ma małą wartość w 1. półroczu?", "a": "Bo występuje także u **zdrowych** niemowląt."}, {"q": "Jak wygląda reakcja na bodźce wzrokowe do 6. tygodnia życia?", "a": "Tylko reakcja na światło: odruch **oczno-powiekowy** (zaciskanie powiek) i **oczno-karkowy** (odgięcie głowy)."}, {"q": "Kiedy niemowlę wodzi wzrokiem, a kiedy mruga obronnie?", "a": "Wodzi wzrokiem pod koniec **2. miesiąca**; zamyka powieki w odruchu obronnym pod koniec **4. miesiąca**."}, {"q": "Czym jest objaw oczu lalki u noworodka?", "a": "Przy obrocie głowy gałki oczne nie podążają za nią – fizjologiczny u noworodka."}, {"q": "Jak ocenia się słuch u niemowlęcia do 3. miesiąca i po 4.–6. miesiącu?", "a": "Do ok. 3. mies. – odruch **Moro** i odruch **uszno-powiekowy** na nagły dźwięk. Po 4.–6. mies. – **zwrot głowy** w kierunku źródła dźwięku."}, {"q": "Jak zmienia się ułożenie niemowlęcia w 1. roku?", "a": "1. półrocze – **ułożenie zgięciowe** (przewaga napięcia zginaczy). 2. półrocze – pośrednie, potem wyprostne."}, {"q": "Co oznacza „pozycja żabki” u niemowlęcia?", "a": "**Hipotonię** (obniżone napięcie mięśniowe)."}, {"q": "Jakie ułożenie jest charakterystyczne dla mózgowego porażenia dziecięcego?", "a": "**Odgięciowe** z odchyleniem głowy do tyłu i ograniczoną aktywnością (lub wyprostne w hipertonii)."}, {"q": "Co oznacza trwała asymetria ułożenia z łukowatym wygięciem tułowia?", "a": "Niedowład połowiczy lub wadę rozwojową kręgosłupa."}, {"q": "Jak rozwija się czynność chwytania?", "a": "Odruch chwytny (zanika w 3.–4. mies.) → chwyt **nakrywkowy** (do ok. 6. mies.) → **nożycowy** (do 9. mies.) → chwytanie z **przeciwstawieniem kciuka**."}, {"q": "Dlaczego przy badaniu symetrii napięcia głowa niemowlęcia musi być w linii środkowej?", "a": "Aby wyeliminować wpływ **asymetrycznego tonicznego odruchu szyjnego** na rozkład napięcia."}, {"q": "Jakie różnice w odruchach głębokich wynikają z wieku niemowlęcia?", "a": "Odruch z m. trójgłowego niewywoływalny do **3. tyg.**; skokowy polikloniczny do **6. tyg.**; przy kolanowym do **6. mies.** kurczą się przywodziciele drugiego uda."}, {"q": "Kiedy pojawiają się właściwe odruchy brzuszne?", "a": "Ok. **7.–8. miesiąca** życia (u noworodka – rozlana reakcja mięśni brzucha)."}, {"q": "Do kiedy fizjologiczny jest odruch Rossolimo?", "a": "Do **6.–7. miesiąca** życia."}, {"q": "Opisz odruch skrzyżowanego wyprostu i czas jego występowania.", "a": "Ucisk przyśrodkowej powierzchni jednego podudzia → toniczny wyprost i przywiedzenie drugiej kończyny; do końca **2. miesiąca**."}, {"q": "Opisz asymetryczny toniczny odruch szyjny (ATOS).", "a": "Skręt głowy w bok → **wyprost kończyn po stronie twarzy** i zgięcie po stronie potylicy (postawa szermierza); do **6. miesiąca**."}, {"q": "Do kiedy występuje odruch chwytny?", "a": "Największe nasilenie 2.–6. tydzień, utrzymuje się do **3. miesiąca** (ręce i stopy)."}, {"q": "Opisz odruch Moro i do kiedy występuje.", "a": "Bodziec dźwiękowy / uderzenie w podłoże / szarpnięcie pieluszki → I faza: **odwiedzenie i wyprost** kończyn górnych; II faza: **zgięcie i przywiedzenie** do klatki („obejmowanie”). Do **5.–6. miesiąca**."}, {"q": "Do kiedy występują odruchy szukania i ssania?", "a": "**Szukania** – do 3.–4. miesiąca (może nie wystąpić po karmieniu). **Ssania** – do końca 1. roku życia."}, {"q": "Czym jest odruch prostujący spiralny i kiedy występuje?", "a": "Skręt głowy → obrót barków z kończyną górną, potem miednicy z kończyną dolną; od **7.–8. miesiąca do 2.–3. roku** życia."}, {"q": "Do kiedy występuje odruch podparcia i automatycznego chodu?", "a": "Do **4. miesiąca**; potem w 5.–6. miesiącu fizjologiczna **astazja**, a od 7.–9. miesiąca gotowość do stania."}, {"q": "Opisz toniczny symetryczny odruch szyjny.", "a": "Odgięcie głowy → wyprost kończyn górnych i zgięcie dolnych; zgięcie głowy → zgięcie górnych i wyprost dolnych. Występuje w **3.–6. miesiącu**."}, {"q": "Opisz odruch Galanta.", "a": "Drażnienie tułowia wzdłuż linii pachowej na wysokości L1 → boczne zgięcie tułowia **wklęsłością po stronie drażnienia**; do **6. miesiąca**."}, {"q": "Jak zmienia się ustawienie głowy w podwieszeniu poziomym?", "a": "Do 2. mies. głowa **poniżej** osi tułowia (tułów wygięty łukiem); od 2. mies. – **w osi**; od 4. mies. – **powyżej** linii tułowia."}, {"q": "Czym jest odruch Landaua i od kiedy występuje?", "a": "Od **6.–7. miesiąca**: w podwieszeniu poziomym uniesienie głowy z wygięciem tułowia wypukłością ku dołowi i wyprostem bioder."}, {"q": "Od kiedy pojawia się reakcja spadochronowa?", "a": "Od **8.–9. miesiąca** – przy szybkim zbliżaniu do podłoża dziecko przyjmuje pozycję skoczka spadochronowego (uniesiona głowa, wyprostowane kończyny)."}, {"q": "Kiedy automatyzmy ruchowe świadczą o patologii?", "a": "Zarówno gdy **przetrwają** ponad okres fizjologiczny, jak i gdy się **nie wykształcą** – skutkuje to zaburzeniem rozwoju ruchowego (pozycji czworonożnej i dwunożnej)."}]}, {"id": "aneks", "num": "A", "title": "Aneks: rozwój somatyczny w liczbach i skala Glasgow", "summary": ["Aneks podręcznika zawiera siatki centylowe (WHO 0–5 lat oraz OLA/OLAF 3–18 lat dla wysokości, masy, BMI i ciśnienia), tabele rozwoju uzębienia i funkcji psychomotorycznych, skalę Tannera oraz dwie tabele najczęściej przydatne na zajęciach: **zestawienie rozwoju somatycznego** ze wzorami na należną masę i długość ciała oraz **zmodyfikowaną skalę śpiączek Glasgow** dla dzieci.", "**Rozwój somatyczny.** Noworodek waży ok. 3,5 kg (2,5–4,5), mierzy ok. 50 cm (48–52), ma obwód głowy 34–35 cm i obwód klatki ok. 33 cm. Masę urodzeniową wyrównuje do 10. doby, podwaja ok. 4. miesiąca, potraja ok. 11. miesiąca, czterokrotnie zwiększa ok. 2. roku, a siedmiokrotnie ok. 7. roku. Długość ciała w 12. miesiącu wynosi ok. 75 cm. Ciemiączko przednie zarasta między 9. a 14.–18. miesiącem, a tylne do 4. miesiąca. Obwód klatki zrównuje się z obwodem głowy w 2.–3. miesiącu.", "**Wzory orientacyjne.** Należna masa ciała: 3–12 miesięcy = (wiek w miesiącach + 9) / 2; 1–6 lat = wiek w latach × 2 + 8; 7–12 lat = (wiek w latach × 7 − 5) / 2. Należna długość ciała w wieku 2–12 lat = wiek w latach × 5 + 85 cm.", "**Zmodyfikowana skala Glasgow** ocenia otwieranie oczu (1–4), odpowiedź słowną (1–5, z osobnymi kryteriami dla 0–23 miesięcy, 2–5 lat i powyżej 5 lat) oraz odpowiedź ruchową (1–6). Suma wynosi od 3 do 15 pkt: **≥ 9 pkt** to prawidłowa świadomość, **8 pkt** płytkie zaburzenia świadomości, a **≤ 7 pkt** śpiączka. Badanie powtarza się wielokrotnie, żeby ocenić dynamikę zaburzeń."], "review": [{"h": "Rozwój somatyczny – liczby", "items": ["Noworodek: masa ok. **3,5 kg** (2,5–4,5); długość **50 cm** (48–52); obwód głowy **34–35 cm**; obwód klatki ok. **33 cm** (o 1–2 cm mniejszy)", "Masa: wyrównuje do **10. doby**; ×2 ok. 4. mies.; ×3 ok. **11. mies.**; ×4 ok. 2. r.ż.; ×7 ok. 7. r.ż.", "Przyrost masy: 1.–5. mies. ok. **700 g/mies.**; 6.–12. mies. ok. **500 g/mies.**; 4–6 lat 2 kg/rok; 7–12 lat 3 kg/rok; pokwitanie ok. 5 kg/rok", "Długość: 0–3 mies. +10 cm; 4–6 mies. +6 cm; 7–12 mies. +8 cm; w 12. mies. ok. **75 cm**; 2. r.ż. +10–13 cm; 3. r.ż. +7,5–10 cm; potem 5–6 cm/rok do skoku", "Skok pokwitaniowy: dziewczęta 12.–15. r.ż. 4–9 cm/rok; chłopcy 14.–20. r.ż. 7–13 cm/rok", "Obwód głowy: do 6. mies. +1,5 cm/mies.; 7.–12. mies. +0,5 cm/mies.; w 3. r.ż. 90% ostatecznej wielkości", "Obwód klatki = obwód głowy w **2.–3. mies.**", "Ciemiączko przednie zarasta 9.–14.–18. mies.; tylne do 4. mies."]}, {"h": "Wzory", "items": ["Masa 3–12 mies. = **(wiek w mies. + 9) / 2**", "Masa 1–6 lat = **wiek (lata) × 2 + 8**", "Masa 7–12 lat = **(wiek (lata) × 7 − 5) / 2**", "Długość 2–12 lat = **wiek (lata) × 5 + 85 cm**", "Zęby mleczne = wiek w miesiącach − 6"]}, {"h": "Zmodyfikowana skala Glasgow", "items": ["**Oczy (1–4)**: 4 spontanicznie; 3 na hałas (< 1 r.) / na polecenie (> 1 r.); 2 na ból; 1 brak", "**Słowna 0–23 mies. (1–5)**: 5 śmieje się, „kosi-kosi”; 4 płacze, daje się uspokoić; 3 ciągły płacz, krzyk; 2 „chrząka”, pobudzony; 1 brak", "**Słowna 2–5 lat**: 5 słowa i zwroty; 4 słowa nieadekwatne; 3 płacz/krzyk; 2 „chrząka”; 1 brak", "**Słowna > 5 lat**: 5 zorientowany; 4 rozmawia, zdezorientowany; 3 niewłaściwe słowa; 2 niezrozumiałe dźwięki; 1 brak", "**Ruchowa (1–6)**: 6 spontaniczna (< 1 r.) / spełnia polecenia (> 1 r.); 5 lokalizuje ból; 4 cofa kończynę; 3 odkorowanie (zgięciowe); 2 odmóżdżenie (wyprostne); 1 brak", "Suma **3–15**: **≥ 9** prawidłowa świadomość; **8** płytkie zaburzenia; **≤ 7** śpiączka"]}], "cards": [{"q": "Kiedy noworodek wyrównuje fizjologiczny ubytek masy ciała?", "a": "Do ok. **10. doby** życia."}, {"q": "Ile waży dziecko orientacyjnie w stosunku do masy urodzeniowej w 2. i 7. roku życia?", "a": "W 2. r.ż. – ok. **4-krotność**; w 7. r.ż. – ok. **7-krotność** masy urodzeniowej."}, {"q": "Jaka jest orientacyjna długość ciała 12-miesięcznego dziecka?", "a": "Ok. **75 cm**."}, {"q": "Podaj wzór na należną masę ciała niemowlęcia 3–12 mies.", "a": "**(wiek w miesiącach + 9) / 2** [kg]."}, {"q": "Podaj wzór na należną masę ciała dziecka 1–6 lat.", "a": "**wiek w latach × 2 + 8** [kg]."}, {"q": "Podaj wzór na należną masę ciała dziecka 7–12 lat.", "a": "**(wiek w latach × 7 − 5) / 2** [kg]."}, {"q": "Podaj wzór na należną długość ciała dziecka 2–12 lat.", "a": "**wiek w latach × 5 + 85** [cm]."}, {"q": "Jakie jest tempo wzrastania przed skokiem pokwitaniowym?", "a": "Ok. **5–6 cm/rok**."}, {"q": "Jak duży jest skok pokwitaniowy u dziewcząt i chłopców (wg Aneksu)?", "a": "Dziewczęta (12.–15. r.ż.) – **4–9 cm/rok**; chłopcy (14.–20. r.ż.) – **7–13 cm/rok**."}, {"q": "Jaki procent ostatecznej wielkości osiąga obwód głowy w 3. roku życia?", "a": "Ok. **90%**."}, {"q": "Jakie trzy elementy ocenia skala Glasgow i jaki jest zakres punktów?", "a": "Otwieranie oczu (1–4), odpowiedź słowną (1–5), odpowiedź ruchową (1–6); suma **3–15** pkt."}, {"q": "Jak interpretujemy wynik zmodyfikowanej skali Glasgow u dziecka?", "a": "**≥ 9 pkt** – prawidłowa świadomość; **8 pkt** – płytkie zaburzenia świadomości; **≤ 7 pkt** – śpiączka."}, {"q": "Za co niemowlę (0–23 mies.) dostaje 5 pkt w odpowiedzi słownej?", "a": "Śmieje się, „robi kosi-kosi”."}, {"q": "Ile punktów w odpowiedzi ruchowej to „odkorowanie”, a ile „odmóżdżenie”?", "a": "Wzmożone napięcie zginaczy (odkorowanie) – **3 pkt**; prężenia wyprostne (odmóżdżenie) – **2 pkt**."}, {"q": "Za co w skali Glasgow przyznaje się 4 pkt za otwieranie oczu, a za co 3 pkt u niemowlęcia?", "a": "4 – **spontanicznie**; 3 – u dziecka < 1 roku **na hałas** (> 1 roku – na polecenie)."}]}]}, {"short": "Farmakologia", "title": "Farmakologia z toksykologią", "subtitle": "Rozdziały wg tematów ćwiczeń z sylabusu (SUM, III rok lekarskiego). Kluczowe leki zweryfikowane w Charakterystykach Produktu Leczniczego (Rejestr Produktów Leczniczych).", "note": "Materiał pomocniczy do nauki – nie zastępuje podręcznika ani ChPL. Dawki i szczegóły porównuj z wykładami i aktualną ChPL. Źródła są podane pod streszczeniem każdego rozdziału.", "chapters": [{"id": "f-ogolna", "num": "F1", "title": "Farmakologia ogólna: farmakodynamika, farmakokinetyka, interakcje, ciąża", "summary": ["**Farmakodynamika** opisuje, co lek robi z organizmem. Większość leków działa przez **receptory**: jonotropowe (kanały jonowe, np. nikotynowy, GABA-A), metabotropowe sprzężone z białkiem G (np. β-adrenergiczne, muskarynowe, opioidowe), receptory o aktywności kinazy (np. receptor insuliny) i receptory jądrowe (steroidy, hormony tarczycy). Leki mogą też działać na enzymy (np. inhibitory ACE, COX), przenośniki (np. SSRI, digoksyna na Na⁺/K⁺-ATPazę) i kanały jonowe, a niektóre działają niereceptorowo (leki zobojętniające, osmotyczne).", "**Agonista** wiąże się z receptorem i go aktywuje, a o sile odpowiedzi decyduje **aktywność wewnętrzna**. **Agonista częściowy** (np. buprenorfina) nawet przy pełnym obsadzeniu receptorów daje słabszy efekt maksymalny i w obecności pełnego agonisty działa jak antagonista. **Antagonista kompetycyjny** przesuwa krzywą dawka–efekt w prawo bez zmiany efektu maksymalnego (da się go „przełamać” większą dawką agonisty). Antagonista niekompetycyjny lub nieodwracalny obniża efekt maksymalny. **Agonista odwrotny** zmniejsza konstytutywną aktywność receptora. Miary leku to **powinowactwo** (Kd), **siła działania** (EC50/ED50) i **skuteczność** (Emax). **Indeks terapeutyczny** to TD50/ED50, a im jest mniejszy, tym lek bardziej niebezpieczny (np. digoksyna, lit, aminoglikozydy, warfaryna, teofilina).", "**Farmakokinetyka** opisuje, co organizm robi z lekiem (LADME: uwalnianie, wchłanianie, dystrybucja, metabolizm, wydalanie). **Biodostępność** (F) to frakcja dawki, która w niezmienionej postaci dociera do krążenia systemowego. Dla podania dożylnego wynosi 100%, a obniża ją m.in. **efekt pierwszego przejścia** przez wątrobę (np. nitrogliceryna, propranolol, morfina doustnie). **Objętość dystrybucji** (Vd) to pozorna objętość, w której rozpuściłby się lek: duża Vd oznacza kumulację w tkankach (np. amiodaron, digoksyna), a mała pozostawanie we krwi (np. warfaryna, silnie związana z albuminami). **Klirens** to objętość osocza oczyszczana z leku w jednostce czasu. Okres półtrwania t½ = 0,693 × Vd / CL. **Stan stacjonarny** osiąga się po około **4–5 okresach półtrwania** i po takim samym czasie lek jest praktycznie wyeliminowany. Dawka nasycająca pozwala szybko osiągnąć stężenie terapeutyczne.", "Większość leków eliminuje się według **kinetyki I rzędu**: stała frakcja w jednostce czasu, stały t½. Przy **kinetyce 0 rzędu** eliminowana jest stała ilość w jednostce czasu, bo enzymy są wysycone (etanol, fenytoina, duże dawki salicylanów), a małe zwiększenie dawki może dać duży wzrost stężenia. **Metabolizm** dzieli się na I fazę (utlenianie, redukcja, hydroliza, głównie cytochrom P450, zwłaszcza **CYP3A4**, który metabolizuje około połowy leków, oraz CYP2D6, 2C9, 2C19, 1A2) i II fazę (sprzęganie: glukuronidacja, sulfatacja, acetylacja, z glutationem), która zwykle daje związki polarne, łatwiej wydalane z moczem. **Proleki** wymagają aktywacji (np. klopidogrel, kodeina → morfina przez CYP2D6, enalapril → enalaprylat).", "**Interakcje** mogą być farmakokinetyczne albo farmakodynamiczne. Farmakokinetyczne polegają najczęściej na **indukcji enzymów** (ryfampicyna, karbamazepina, fenytoina, fenobarbital, ziele dziurawca), co obniża stężenie innych leków i daje np. nieskuteczność antykoncepcji, albo na **inhibicji** (makrolidy z wyjątkiem azytromycyny, azole, rytonawir, sok grejpfrutowy, cymetydyna, amiodaron, werapamil), co zwiększa stężenie i toksyczność. Do farmakokinetycznych należy też wypieranie z białek i zmiany wydalania nerkowego (np. NLPZ i diuretyki obniżają klirens litu). Interakcje farmakodynamiczne to synergizm (np. benzodiazepina + opioid → depresja oddechowa, leki serotoninergiczne → zespół serotoninowy, kilka leków wydłużających QT) albo antagonizm.", "**Działania niepożądane** klasyfikuje się jako typ A (zależne od dawki, przewidywalne, wynikające z mechanizmu), typ B (niezależne od dawki, idiosynkrazja i alergia), C (przewlekłe), D (odroczone: teratogenność, kancerogenność), E (po odstawieniu) i F (niepowodzenie terapii). Zgłasza się je do URPL. **Ciąża**: najbardziej wrażliwy jest okres organogenezy (ok. 3.–8. tydzień). Wcześniej obowiązuje zasada „wszystko albo nic”. Przykłady leków teratogennych to izotretynoina, kwas walproinowy, warfaryna, ACEI i sartany (II i III trymestr), tetracykliny, lit, metotreksat i talidomid. NLPZ w III trymestrze grożą przedwczesnym zamknięciem przewodu tętniczego.", "Uwaga do źródeł: ten rozdział dotyczy pojęć ogólnych i opiera się na wiedzy podręcznikowej, w zakresie zgodnym z literaturą z sylabusu. Nie ma tu konkretnych produktów, które można by sprawdzić w ChPL."], "review": [{"h": "Receptory i farmakodynamika", "items": ["Jonotropowe (ms): nikotynowy, GABA-A, NMDA, 5-HT3", "Sprzężone z białkiem G (s–min): adrenergiczne, muskarynowe, opioidowe, dopaminowe, histaminowe", "Kinazowe: insulina, czynniki wzrostu; jądrowe (godz.–dni): steroidy, T3/T4, wit. D, PPAR", "**Powinowactwo** – Kd; **siła działania** – EC50; **skuteczność** – Emax", "Antagonista kompetycyjny: krzywa **w prawo**, Emax bez zmian", "Antagonista niekompetycyjny/nieodwracalny: **↓ Emax**", "Agonista częściowy: niższy Emax; wobec pełnego agonisty – działa antagonistycznie (buprenorfina)", "Tachyfilaksja – szybki spadek odpowiedzi (np. efedryna, azotany); tolerancja – wolniejsza", "**Indeks terapeutyczny** = TD50/ED50; wąski: digoksyna, lit, warfaryna, aminoglikozydy, teofilina, fenytoina, wankomycyna"]}, {"h": "Farmakokinetyka – LADME", "items": ["Wchłanianie: dyfuzja bierna postaci niezjonizowanej (równanie Hendersona–Hasselbalcha); słabe kwasy lepiej w kwaśnym środowisku", "**Biodostępność F**: i.v. = 100%; ↓ przez efekt pierwszego przejścia", "Duży efekt pierwszego przejścia: nitrogliceryna (podjęzykowo!), propranolol, morfina p.o., lidokaina", "**Vd** = dawka / C0; duża Vd: amiodaron, digoksyna, TLPD; mała: warfaryna, heparyna, aminoglikozydy", "Wiązanie z albuminami (kwasy) i α1-kwaśną glikoproteiną (zasady); działa tylko frakcja wolna", "**t½ = 0,693 × Vd / CL**", "Stan stacjonarny po **4–5 t½**; eliminacja ~97% po 5 t½", "Dawka nasycająca = Css × Vd / F; dawka podtrzymująca = Css × CL × τ / F", "Kinetyka **I rzędu** – stała frakcja; **0 rzędu** – stała ilość (etanol, fenytoina, salicylany w dużych dawkach)", "Bariera krew–mózg: leki lipofilne, niezjonizowane, niezwiązane; glikoproteina P wypompowuje"]}, {"h": "Metabolizm i wydalanie", "items": ["Faza I: utlenianie (CYP450), redukcja, hydroliza", "Faza II: glukuronidacja, sulfatacja, **acetylacja** (wolni/szybcy acetylatorzy – izoniazyd, hydralazyna, prokainamid, sulfonamidy), sprzęganie z glutationem (paracetamol!)", "**CYP3A4** ~50% leków; CYP2D6 (kodeina, tramadol, metoprolol, TLPD) – polimorfizm; CYP2C9 (warfaryna); CYP2C19 (klopidogrel, IPP); CYP1A2 (teofilina, klozapina; indukowany paleniem)", "**Proleki**: enalapril, klopidogrel, kodeina, lewodopa, azatiopryna, cyklofosfamid, walacyklowir", "Wydalanie nerkowe: filtracja, sekrecja kanalikowa (probenecyd hamuje sekrecję penicylin), wchłanianie zwrotne", "Alkalizacja moczu ↑ wydalanie słabych kwasów (salicylany, fenobarbital); zakwaszenie – słabych zasad", "Krążenie jelitowo-wątrobowe: doksycyklina, estrogeny, digitoksyna"]}, {"h": "Interakcje", "items": ["**Induktory**: ryfampicyna, karbamazepina, fenytoina, fenobarbital, ziele dziurawca, przewlekły alkohol, palenie (CYP1A2)", "**Inhibitory**: klarytromycyna, erytromycyna, ketokonazol/itrakonazol/flukonazol, rytonawir, sok grejpfrutowy, cymetydyna, amiodaron, werapamil, diltiazem, fluoksetyna/paroksetyna (CYP2D6)", "Induktor → ↓ stężenie (np. nieskuteczna antykoncepcja, odrzucenie przeszczepu przy cyklosporynie)", "Inhibitor → ↑ toksyczność (np. statyna + klarytromycyna → rabdomioliza)", "Lit: NLPZ, tiazydy, ACEI → ↑ stężenie litu", "Farmakodynamiczne: benzodiazepiny + opioidy + alkohol → depresja oddechowa; SSRI + tramadol/MAOI/linezolid → zespół serotoninowy; leki wydłużające QT → torsade de pointes; ACEI + spironolakton + K⁺ → hiperkaliemia"]}, {"h": "Działania niepożądane i ciąża", "items": ["**A** – zależne od dawki (augmented); **B** – dziwaczne (bizarre): alergia, idiosynkrazja", "**C** – przewlekłe; **D** – odroczone (teratogenne, rakotwórcze); **E** – po odstawieniu; **F** – niepowodzenie leczenia", "Idiosynkrazja: np. hemoliza po lekach utleniających przy niedoborze G6PD", "Zgłaszanie: **URPL**", "Ciąża: 0–2 tydz. „wszystko albo nic”; **3–8 tydz. – organogeneza** (największe ryzyko wad)", "Teratogeny: izotretynoina, walproinian (wady cewy nerwowej), karbamazepina, fenytoina, warfaryna (embriopatia), ACEI/sartany (fetotoksyczne II–III trym.), tetracykliny (zęby, kości), lit (anomalia Ebsteina), metotreksat, talidomid, mykofenolan", "NLPZ po 20. tyg. – małowodzie; III trymestr – **przedwczesne zamknięcie przewodu tętniczego**", "Bezpieczniejsze w ciąży: paracetamol, penicyliny, cefalosporyny, heparyny (nie przechodzą przez łożysko), metyldopa, labetalol, nifedypina, insulina, lewotyroksyna"]}], "cards": [{"q": "Czym różni się powinowactwo od aktywności wewnętrznej leku?", "a": "**Powinowactwo** – zdolność wiązania z receptorem (Kd). **Aktywność wewnętrzna** – zdolność do wywołania odpowiedzi po związaniu. Antagonista ma powinowactwo, ale zerową aktywność wewnętrzną."}, {"q": "Jak antagonista kompetycyjny zmienia krzywą dawka–efekt agonisty?", "a": "Przesuwa ją **w prawo** (↑ EC50), ale **Emax się nie zmienia** – działanie można przełamać większą dawką agonisty."}, {"q": "Jak działa antagonista niekompetycyjny lub nieodwracalny?", "a": "**Obniża efekt maksymalny** (Emax) – zwiększenie dawki agonisty nie przywraca pełnej odpowiedzi."}, {"q": "Czym jest agonista częściowy? Podaj przykład.", "a": "Lek, który nawet przy pełnym obsadzeniu receptorów daje słabszą odpowiedź niż agonista pełny; w obecności agonisty pełnego działa jak antagonista. Przykład: **buprenorfina** (μ), pindolol (β)."}, {"q": "Czym różni się siła działania od skuteczności leku?", "a": "**Siła działania (potency)** – dawka/stężenie potrzebne do efektu (EC50). **Skuteczność (efficacy)** – maksymalny możliwy efekt (Emax)."}, {"q": "Co to jest indeks terapeutyczny i które leki mają wąski indeks?", "a": "Stosunek TD50/ED50 (dawki toksycznej do skutecznej). Wąski: **digoksyna, lit, warfaryna, aminoglikozydy, teofilina, fenytoina, wankomycyna** – wymagają monitorowania stężeń/efektu."}, {"q": "Czym jest tachyfilaksja?", "a": "Szybkie (w ciągu minut–godzin) zmniejszenie odpowiedzi na kolejne dawki leku, np. efedryna (wyczerpanie zapasów noradrenaliny), azotany."}, {"q": "Co oznacza skrót LADME?", "a": "Liberation (uwalnianie), Absorption (wchłanianie), Distribution (dystrybucja), Metabolism (metabolizm), Elimination (wydalanie)."}, {"q": "Czym jest biodostępność i jaka jest po podaniu dożylnym?", "a": "Frakcja podanej dawki, która w niezmienionej postaci dociera do krążenia ogólnego; po podaniu **dożylnym = 100%**."}, {"q": "Czym jest efekt pierwszego przejścia? Podaj przykłady leków.", "a": "Metabolizm leku w wątrobie (i ścianie jelita) zanim dotrze do krążenia ogólnego po podaniu doustnym. Duży u: **nitrogliceryny** (dlatego podjęzykowo), propranololu, morfiny, lidokainy (niepodawana doustnie)."}, {"q": "Co oznacza duża objętość dystrybucji?", "a": "Lek gromadzi się w tkankach (stężenie w osoczu małe), np. **amiodaron, digoksyna, TLPD**. Hemodializa jest wtedy mało skuteczna w zatruciu."}, {"q": "Jak oblicza się okres półtrwania z Vd i klirensu?", "a": "**t½ = 0,693 × Vd / CL**."}, {"q": "Po ilu okresach półtrwania osiąga się stan stacjonarny?", "a": "Po ok. **4–5 okresach półtrwania** (tyle samo trwa praktycznie całkowita eliminacja leku po odstawieniu)."}, {"q": "Po co stosuje się dawkę nasycającą?", "a": "Aby szybko osiągnąć stężenie terapeutyczne leku o długim t½ (np. amiodaron, digoksyna, wankomycyna). Dawka nasycająca = Css × Vd / F."}, {"q": "Czym różni się kinetyka I i 0 rzędu? Podaj leki o kinetyce 0 rzędu.", "a": "**I rzędu** – eliminowana stała **frakcja** leku w jednostce czasu (stały t½). **0 rzędu** – stała **ilość** (wysycenie enzymów). Przykłady 0 rzędu: **etanol, fenytoina, salicylany w dużych dawkach**."}, {"q": "Dlaczego fenytoina jest trudna w dawkowaniu?", "a": "Ma kinetykę wysycenia (0 rzędu w zakresie terapeutycznym) i wąski indeks terapeutyczny – niewielki wzrost dawki może dać nieproporcjonalnie duży wzrost stężenia i toksyczność."}, {"q": "Jakie reakcje obejmuje I i II faza metabolizmu?", "a": "**I faza**: utlenianie (CYP450), redukcja, hydroliza – wprowadzenie/odsłonięcie grupy funkcyjnej. **II faza**: sprzęganie – glukuronidacja, sulfatacja, acetylacja, metylacja, z glutationem – zwiększa polarność."}, {"q": "Który izoenzym cytochromu P450 metabolizuje najwięcej leków?", "a": "**CYP3A4** (ok. połowy stosowanych leków)."}, {"q": "Jakie leki są metabolizowane przez CYP2D6 i dlaczego polimorfizm ma znaczenie?", "a": "Kodeina, tramadol, metoprolol, TLPD, wiele neuroleptyków. Wolni metabolizerzy – brak efektu proleków (kodeina → morfina) lub toksyczność; ultraszybcy – toksyczność kodeiny (ryzyko depresji oddechowej)."}, {"q": "Czym są proleki? Podaj przykłady.", "a": "Leki nieaktywne, aktywowane w organizmie: **enalapril** (→ enalaprylat), **klopidogrel**, **kodeina** (→ morfina), lewodopa (→ dopamina), cyklofosfamid, azatiopryna, walacyklowir."}, {"q": "Których leków dotyczy polimorfizm acetylacji?", "a": "Izoniazydu, hydralazyny, prokainamidu, sulfonamidów, dapsonu. Wolni acetylatorzy – ryzyko toksyczności (np. polineuropatia po izoniazydzie, toczeń polekowy po hydralazynie/prokainamidzie)."}, {"q": "Wymień najważniejsze induktory enzymów cytochromu P450.", "a": "**Ryfampicyna, karbamazepina, fenytoina, fenobarbital, ziele dziurawca**, przewlekłe picie alkoholu; palenie tytoniu (CYP1A2)."}, {"q": "Wymień najważniejsze inhibitory CYP3A4.", "a": "**Klarytromycyna, erytromycyna**, azole (ketokonazol, itrakonazol, worykonazol), **rytonawir**, sok grejpfrutowy, werapamil, diltiazem, amiodaron."}, {"q": "Jakie są skutki podania induktora CYP z doustną antykoncepcją lub cyklosporyną?", "a": "Przyspieszony metabolizm → ↓ stężenie: **nieskuteczna antykoncepcja**, ryzyko **odrzucenia przeszczepu** (cyklosporyna, takrolimus)."}, {"q": "Jakie leki zwiększają stężenie litu?", "a": "**NLPZ, diuretyki tiazydowe, ACEI i sartany** (zmniejszają klirens nerkowy litu)."}, {"q": "Jak zmiana pH moczu wpływa na wydalanie leków?", "a": "Alkalizacja moczu zwiększa jonizację i wydalanie **słabych kwasów** (salicylany, fenobarbital); zakwaszenie – słabych zasad. Wykorzystywane w leczeniu zatruć."}, {"q": "Jak probenecyd wpływa na penicyliny?", "a": "Hamuje ich **sekrecję kanalikową** → przedłuża i zwiększa stężenie penicylin."}, {"q": "Podaj przykłady interakcji farmakodynamicznych o dużym znaczeniu klinicznym.", "a": "Benzodiazepiny/alkohol + opioidy → **depresja oddechowa**; SSRI + MAOI/tramadol/linezolid → **zespół serotoninowy**; leki wydłużające QT → **torsade de pointes**; ACEI + spironolakton → **hiperkaliemia**; warfaryna + NLPZ → krwawienia."}, {"q": "Czym różnią się działania niepożądane typu A i B?", "a": "**Typ A** – zależne od dawki, przewidywalne z mechanizmu, częste (np. krwawienie po warfarynie). **Typ B** – niezależne od dawki, nieprzewidywalne: alergia, idiosynkrazja (np. anafilaksja po penicylinie)."}, {"q": "Czym jest idiosynkrazja? Podaj przykład.", "a": "Nietypowa, uwarunkowana genetycznie reakcja na lek, np. **hemoliza** po lekach utleniających (prymachina, sulfonamidy, nitrofurantoina) przy niedoborze G6PD; hipertermia złośliwa po sukcynylocholinie i anestetykach wziewnych."}, {"q": "Dokąd zgłasza się działania niepożądane leków w Polsce?", "a": "Do **Urzędu Rejestracji Produktów Leczniczych, Wyrobów Medycznych i Produktów Biobójczych (URPL)** – może to zrobić lekarz, farmaceuta i pacjent."}, {"q": "Który okres ciąży jest najbardziej wrażliwy na działanie teratogenne?", "a": "**Okres organogenezy – ok. 3.–8. tydzień** po zapłodnieniu. Wcześniej obowiązuje zasada „wszystko albo nic”."}, {"q": "Wymień leki o udowodnionym działaniu teratogennym.", "a": "**Izotretynoina, kwas walproinowy, warfaryna, lit, talidomid, metotreksat, mykofenolan**, karbamazepina, fenytoina, tetracykliny; ACEI/sartany (fetotoksyczne w II–III trymestrze)."}, {"q": "Jaki jest skutek stosowania kwasu walproinowego w ciąży?", "a": "Wady **cewy nerwowej** (rozszczep kręgosłupa), inne wady wrodzone oraz zaburzenia neurorozwojowe (↓ IQ, autyzm)."}, {"q": "Dlaczego NLPZ są przeciwwskazane w III trymestrze ciąży?", "a": "Grożą **przedwczesnym zamknięciem przewodu tętniczego** płodu (nadciśnienie płucne), małowodziem (zaburzenie czynności nerek płodu), wydłużeniem porodu i krwawieniem."}, {"q": "Który lek przeciwzakrzepowy jest preferowany w ciąży i dlaczego?", "a": "**Heparyna (zwłaszcza drobnocząsteczkowa)** – nie przechodzi przez łożysko. Warfaryna jest teratogenna (embriopatia warfarynowa)."}, {"q": "Jakie leki przeciwnadciśnieniowe można stosować w ciąży?", "a": "**Metyldopa, labetalol, nifedypina** (o przedłużonym uwalnianiu). Przeciwwskazane: ACEI, sartany, aliskiren."}]}, {"id": "f-opioidy", "num": "F2", "title": "Opioidowe leki przeciwbólowe i antagoniści opioidów", "summary": ["Opioidy działają przez receptory sprzężone z białkiem Gi/o: **μ (MOP), κ (KOP) i δ (DOP)**. Aktywacja hamuje cyklazę adenylanową, otwiera kanały potasowe (hiperpolaryzacja) i zamyka kanały wapniowe, co zmniejsza uwalnianie neuroprzekaźników bólowych (m.in. substancji P i glutaminianu) w rogach tylnych rdzenia, w pniu mózgu i we wzgórzu oraz aktywuje zstępujące układy antynocyceptywne. Receptor **μ** odpowiada za analgezję, euforię, **depresję oddechową**, zwężenie źrenic, zaparcia i uzależnienie. Receptor **κ** daje analgezję rdzeniową, dysforię, sedację i diurezę.", "**Morfina** to wzorcowy agonista μ. Doustnie ma niską biodostępność, bo podlega efektowi pierwszego przejścia. Jest glukuronidowana do aktywnego **morfino-6-glukuronidu**, który kumuluje się w niewydolności nerek, oraz do morfino-3-glukuronidu. Działa przeciwbólowo, uspokajająco, przeciwkaszlowo, wywołuje zwężenie źrenic, nudności i wymioty (pobudzenie strefy chemoreceptorowej), zaparcia, zatrzymanie moczu, skurcz zwieracza Oddiego, uwalnianie histaminy (świąd, skurcz oskrzeli, spadek RR) i bradykardię. **Tolerancja nie rozwija się na zwężenie źrenic ani na zaparcia**.", "Inne opioidy: **kodeina** (prolek aktywowany do morfiny przez CYP2D6, działa przeciwkaszlowo), **tramadol** (słaby agonista μ, a jego metabolit O-desmetylotramadol, powstający przez CYP2D6, jest silniejszy; dodatkowo hamuje wychwyt zwrotny serotoniny i noradrenaliny, obniża próg drgawkowy i grozi zespołem serotoninowym), **fentanyl** (ok. 100 razy silniejszy od morfiny, lipofilny, plastry przezskórne zmienia się co 72 h, metabolizowany przez CYP3A4, a szybkie podanie dożylne powoduje sztywność klatki piersiowej), **petydyna** (metabolit norpetydyna działa drgawkotwórczo, a z MAOI grozi ciężką interakcją), **metadon** (długi t½, leczenie substytucyjne, wydłuża QT, antagonista NMDA), **oksykodon**, **buprenorfina** (częściowy agonista μ o bardzo silnym wiązaniu, efekt pułapowy depresji oddechowej, słabo odwracana naloksonem), **nalbufina i butorfanol** (agoniści κ i antagoniści μ) oraz **loperamid** (nie przenika przez barierę krew–mózg, działa przeciwbiegunkowo).", "**Antagoniści**: **nalokson** (krótko działający, podawany i.v., i.m., s.c. lub donosowo, odwraca przedawkowanie, ale działa krócej niż wiele opioidów, więc grozi nawrót depresji oddechowej, a u uzależnionych wywołuje ostry zespół odstawienny) oraz **naltrekson** (doustny, długo działający, w leczeniu uzależnienia od alkoholu i opioidów). **Metylonaltrekson** i **naloksegol** to obwodowi antagoniści stosowani w zaparciach poopioidowych. Nalorfina i lewalorfan to starsze leki o mieszanym działaniu.", "**Przedawkowanie** opioidów objawia się triadą: **śpiączka, szpilkowate źrenice, depresja oddechowa**. W leczeniu zapewnia się drożność dróg oddechowych i wentylację oraz podaje nalokson w dawkach powtarzanych (lub we wlewie). **Zespół odstawienny** daje objawy przeciwne do działania opioidów: rozszerzenie źrenic, łzawienie, wyciek z nosa, ziewanie, „gęsią skórkę”, biegunkę, bóle mięśni, niepokój i tachykardię. Jest bardzo nieprzyjemny, ale u dorosłych rzadko zagraża życiu. **Przeciwwskazania** do silnych opioidów: niewydolność oddechowa, ostry napad astmy, uraz głowy ze wzrostem ciśnienia śródczaszkowego, ostry brzuch, MAOI w ciągu 14 dni i ostre zatrucie alkoholem. Opioidów nie należy łączyć z benzodiazepinami ani z alkoholem."], "review": [{"h": "Receptory opioidowe", "items": ["Wszystkie sprzężone z **Gi/o**: ↓ cAMP, ↑ przewodnictwa K⁺ (hiperpolaryzacja), ↓ napływu Ca²⁺ (↓ uwalniania przekaźników)", "**μ (MOP)**: analgezja nadrdzeniowa i rdzeniowa, euforia, **depresja oddechowa**, zwężenie źrenic, zaparcia, uzależnienie; ligand endogenny – β-endorfina, endomorfiny", "**κ (KOP)**: analgezja rdzeniowa, **dysforia**, sedacja, diureza (↓ ADH); ligand – dynorfiny", "**δ (DOP)**: analgezja, modulacja nastroju; ligand – enkefaliny", "Receptor NOP (nocyceptyna/orfanina FQ)"]}, {"h": "Morfina – działanie", "items": ["OUN: analgezja, sedacja, euforia, **depresja oddechowa** (↓ wrażliwość ośrodka na CO₂), hamowanie kaszlu, **zwężenie źrenic** (jądro Edingera–Westphala), nudności/wymioty (CTZ)", "Przewód pokarmowy: ↓ perystaltyki napędowej, ↑ napięcia zwieraczy → **zaparcia**; skurcz zwieracza Oddiego", "Drogi moczowe: ↑ napięcie zwieracza → zatrzymanie moczu", "Uwalnianie **histaminy**: świąd, rumień, skurcz oskrzeli, ↓ RR", "Bradykardia; ↑ ciśnienie śródczaszkowe (przez ↑ CO₂)", "Metabolizm: glukuronidacja → **M6G** (aktywny, kumulacja w niewydolności nerek) i M3G (neurotoksyczny)", "Tolerancja: na analgezję, euforię, depresję oddechową, nudności; **brak tolerancji na zwężenie źrenic i zaparcia**"]}, {"h": "Przegląd opioidów", "items": ["**Kodeina** – prolek (CYP2D6 → morfina), przeciwkaszlowa; ultraszybcy metabolizerzy → toksyczność (przeciwwskazana < 12 lat)", "**Dihydrokodeina**, **oksykodon** (± nalokson w preparacie złożonym), **hydromorfon**", "**Tramadol** – słaby μ + hamuje wychwyt 5-HT i NA; metabolit M1 (CYP2D6); ↓ próg drgawkowy, zespół serotoninowy z SSRI/MAOI", "**Fentanyl** – ~100× silniejszy od morfiny, lipofilny; plaster co **72 h**, stężenie stabilne po 12–24 h; gorączka/ciepło ↑ wchłanianie; CYP3A4; sztywność klatki przy szybkim i.v.; **sufentanyl, remifentanyl** (esterazy, bardzo krótki), alfentanyl", "**Petydyna** – metabolit **norpetydyna** (drgawki); z **MAOI** – zespół serotoninowy; nie do bólu przewlekłego", "**Metadon** – długi i zmienny t½, substytucja w uzależnieniu, antagonizm NMDA, **wydłuża QT**", "**Buprenorfina** – częściowy agonista μ (antagonista κ), silne wiązanie, **efekt pułapowy** depresji oddechowej, słabo odwracalna naloksonem; podjęzykowo, plastry; substytucja (z naloksonem)", "**Nalbufina, butorfanol, pentazocyna** – agoniści κ / antagoniści (częściowi) μ: mogą wywołać odstawienie u uzależnionych; pentazocyna – dysforia", "**Loperamid** – agonista μ, nie przenika przez BBB (substrat P-gp) → przeciwbiegunkowy", "**Dekstrometorfan** – przeciwkaszlowy, antagonista NMDA, słabe działanie opioidowe"]}, {"h": "Antagoniści", "items": ["**Nalokson** – czysty antagonista μ/κ/δ; i.v./i.m./s.c./donosowo; działa **30–90 min** → krócej niż morfina/metadon → **ryzyko nawrotu** depresji oddechowej → dawki powtarzane lub wlew", "U uzależnionych – ostry zespół abstynencyjny", "**Naltrekson** – doustny, długo działający; uzależnienie od alkoholu i opioidów (po detoksykacji)", "**Metylonaltrekson, naloksegol** – obwodowi antagoniści μ → zaparcia poopioidowe", "Nalorfina, lewalorfan – starsze leki o działaniu mieszanym (antagoniści μ, agoniści κ)"]}, {"h": "Przedawkowanie, odstawienie, przeciwwskazania", "items": ["Triada przedawkowania: **śpiączka + szpilkowate źrenice + depresja oddechowa** (± hipotensja, bradykardia, obrzęk płuc)", "Leczenie: drożność dróg oddechowych, wentylacja, **nalokson** (miareczkowanie, powtarzanie)", "Odstawienie: rozszerzone źrenice, łzawienie, katar, ziewanie, „gęsia skórka”, biegunka, bóle mięśni, niepokój, tachykardia, nadciśnienie", "Przeciwwskazania: niewydolność oddechowa, ciężka astma, uraz głowy/↑ ICP, ostry brzuch, kolka żółciowa, guz chromochłonny, MAOI ≤ 14 dni, ostre zatrucie alkoholem", "Interakcje: **benzodiazepiny, alkohol, gabapentyna/pregabalina** → głęboka sedacja, depresja oddechowa, zgon; MAOI; leki cholinolityczne → zaparcia, zatrzymanie moczu", "Drabina analgetyczna WHO: nieopioidowe → słabe opioidy (tramadol, kodeina) → silne opioidy (morfina, oksykodon, fentanyl, buprenorfina) ± leki wspomagające"]}], "cards": [{"q": "Z jakim białkiem G sprzężone są receptory opioidowe i jaki jest skutek ich aktywacji?", "a": "Z **Gi/o** → hamowanie cyklazy adenylanowej (↓ cAMP), otwarcie kanałów K⁺ (hiperpolaryzacja), zamknięcie kanałów Ca²⁺ (↓ uwalniania neuroprzekaźników, np. substancji P, glutaminianu)."}, {"q": "Jakie efekty wywołuje aktywacja receptora μ?", "a": "Analgezja, euforia, **depresja oddechowa**, zwężenie źrenic, zaparcia, sedacja, uzależnienie fizyczne."}, {"q": "Jakie efekty wywołuje aktywacja receptora κ?", "a": "Analgezja (głównie rdzeniowa), **dysforia**, sedacja, zwiększona diureza (hamowanie wydzielania ADH)."}, {"q": "Jakie są endogenne ligandy receptorów opioidowych?", "a": "**β-endorfina** (μ), **enkefaliny** (δ), **dynorfiny** (κ), endomorfiny (μ)."}, {"q": "Jaki jest mechanizm depresji oddechowej po opioidach?", "a": "Zmniejszenie wrażliwości ośrodka oddechowego w pniu mózgu na **CO₂** (receptory μ)."}, {"q": "Dlaczego opioidy zwężają źrenice?", "a": "Pobudzają **jądro Edingera–Westphala** (przywspółczulne unerwienie zwieracza źrenicy)."}, {"q": "Na które działania morfiny nie rozwija się tolerancja?", "a": "Na **zwężenie źrenic** i **zaparcia** – dlatego zaparcia trzeba profilaktycznie leczyć przez cały czas terapii."}, {"q": "Jakie są aktywne metabolity morfiny i jakie mają znaczenie?", "a": "**Morfino-6-glukuronid** – silnie przeciwbólowy, **kumuluje się w niewydolności nerek** (sedacja, depresja oddechowa). Morfino-3-glukuronid – nieaktywny przeciwbólowo, neurotoksyczny (mioklonie, hiperalgezja)."}, {"q": "Dlaczego morfina może wywołać skurcz oskrzeli i świąd?", "a": "Bo uwalnia **histaminę** z komórek tucznych (także rumień, spadek ciśnienia)."}, {"q": "Jak morfina działa na przewód pokarmowy i drogi żółciowe?", "a": "Zmniejsza perystaltykę napędową i zwiększa napięcie zwieraczy (**zaparcia**), wywołuje **skurcz zwieracza Oddiego** (↑ ciśnienia w drogach żółciowych)."}, {"q": "Dlaczego kodeina jest przeciwwskazana u dzieci < 12 lat i u ultraszybkich metabolizerów CYP2D6?", "a": "Jest prolekiem przekształcanym przez **CYP2D6 w morfinę** – u ultraszybkich metabolizerów powstaje dużo morfiny → ryzyko ciężkiej **depresji oddechowej** i zgonu."}, {"q": "Jaki jest podwójny mechanizm działania tramadolu?", "a": "Słaby agonista **μ** (silniej działa metabolit O-desmetylotramadol powstający przez CYP2D6) oraz **hamowanie wychwytu zwrotnego serotoniny i noradrenaliny**."}, {"q": "Jakie są dwa charakterystyczne działania niepożądane tramadolu wynikające z jego mechanizmu?", "a": "**Obniżenie progu drgawkowego** (drgawki) i **zespół serotoninowy** (zwłaszcza z SSRI, SNRI, MAOI, TLPD)."}, {"q": "Ile razy fentanyl jest silniejszy od morfiny i jakie ma cechy?", "a": "Ok. **100 razy**; bardzo lipofilny – szybki początek działania, podawany i.v., przezskórnie, przezśluzówkowo; metabolizm przez **CYP3A4**."}, {"q": "Co ile godzin zmienia się plaster z fentanylem i kiedy osiąga się stężenie stałe?", "a": "Co **72 godziny**; stężenie w surowicy stabilizuje się po **12–24 h** – pełnego efektu nie ocenia się przed upływem 24 h. Nie stosuje się w bólu ostrym/pooperacyjnym."}, {"q": "Jak gorączka wpływa na działanie fentanylu w plastrach?", "a": "Wysoka temperatura ciała lub zewnętrzne źródła ciepła (sauna, termofor) **zwiększają wchłanianie** fentanylu → ryzyko przedawkowania."}, {"q": "Jakie działanie niepożądane może wywołać szybkie dożylne podanie fentanylu?", "a": "**Sztywność mięśni klatki piersiowej** („wooden chest”) utrudniającą wentylację."}, {"q": "Czym wyróżnia się remifentanyl?", "a": "Bardzo krótkim działaniem – jest hydrolizowany przez **nieswoiste esterazy** osocza i tkanek, niezależnie od wątroby i nerek; stosowany we wlewie w anestezji."}, {"q": "Dlaczego petydyna nie nadaje się do leczenia bólu przewlekłego?", "a": "Jej metabolit **norpetydyna** kumuluje się (zwłaszcza w niewydolności nerek) i wywołuje **drgawki**; ponadto z MAOI – ciężki zespół serotoninowy."}, {"q": "Jakie są cechy metadonu?", "a": "Długi i zmienny t½ (ryzyko kumulacji), dobra biodostępność doustna, antagonizm receptora NMDA; stosowany w **leczeniu substytucyjnym** i bólu; **wydłuża odstęp QT**."}, {"q": "Czym jest buprenorfina i jakie ma cechy kliniczne?", "a": "**Częściowy agonista μ** (antagonista κ) o bardzo silnym wiązaniu z receptorem: **efekt pułapowy** depresji oddechowej, słabo odwracalna naloksonem; podjęzykowo i w plastrach; leczenie substytucyjne (z naloksonem)."}, {"q": "Dlaczego nalbufina lub buprenorfina może wywołać zespół odstawienny u osoby uzależnionej od heroiny?", "a": "Bo działają jako **antagoniści (lub częściowi agoniści) receptora μ** – wypierają pełnego agonistę, zmniejszając jego działanie."}, {"q": "Dlaczego loperamid nie działa ośrodkowo?", "a": "Nie przenika przez barierę krew–mózg (jest wypompowywany przez **glikoproteinę P**) – działa tylko na receptory μ w jelitach (przeciwbiegunkowo)."}, {"q": "Jaki jest mechanizm działania naloksonu i drogi jego podania?", "a": "**Kompetycyjny antagonista** receptorów opioidowych (głównie μ). Podawany i.v., i.m., s.c. lub donosowo."}, {"q": "Dlaczego po podaniu naloksonu trzeba obserwować pacjenta?", "a": "Nalokson działa krótko (ok. **30–90 min**) – krócej niż wiele opioidów (morfina, metadon, preparaty o przedłużonym uwalnianiu) → **nawrót depresji oddechowej**; konieczne powtarzanie dawek lub wlew."}, {"q": "Jaki skutek ma podanie naloksonu osobie uzależnionej od opioidów?", "a": "**Ostry zespół abstynencyjny** – dlatego dawkę się miareczkuje."}, {"q": "Do czego stosuje się naltrekson?", "a": "Doustny, długo działający antagonista opioidowy – w leczeniu **uzależnienia od alkoholu** (zmniejsza głód) i podtrzymaniu abstynencji od opioidów (po detoksykacji)."}, {"q": "Jak działa metylonaltrekson (naloksegol) i do czego się go stosuje?", "a": "**Obwodowy antagonista μ** (nie przenika do OUN) – leczenie **zaparć poopioidowych** bez znoszenia analgezji."}, {"q": "Jaka triada objawów wskazuje na zatrucie opioidami?", "a": "**Śpiączka, szpilkowate źrenice, depresja oddechowa**."}, {"q": "Jakie są objawy zespołu odstawiennego od opioidów?", "a": "**Rozszerzenie źrenic**, łzawienie, wyciek z nosa, ziewanie, „gęsia skórka”, biegunka, kurcze brzucha, bóle mięśni, niepokój, bezsenność, tachykardia, nadciśnienie."}, {"q": "Wymień przeciwwskazania do stosowania morfiny.", "a": "Niewydolność oddechowa, ostry napad astmy, **uraz głowy / ↑ ciśnienia śródczaszkowego**, śpiączka, ostry brzuch, kolka wątrobowa, guz chromochłonny, ostre zatrucie alkoholem, stany drgawkowe, **MAOI** (i 2 tyg. po ich odstawieniu)."}, {"q": "Dlaczego nie łączy się opioidów z benzodiazepinami?", "a": "Sumowanie działania depresyjnego na OUN → głęboka sedacja, **depresja oddechowa**, śpiączka, zgon (podobnie z alkoholem, gabapentyną, pregabaliną)."}, {"q": "Jaka interakcja morfiny z lekami przeciwpłytkowymi jest opisana w ChPL?", "a": "Morfina może **zmniejszać i opóźniać działanie inhibitorów P2Y12** (np. klopidogrelu) przez spowolnienie wchłaniania z przewodu pokarmowego."}, {"q": "Jakie leki stosuje się na kolejnych stopniach drabiny analgetycznej WHO?", "a": "I – nieopioidowe (paracetamol, NLPZ, metamizol); II – słabe opioidy (**tramadol, kodeina**, dihydrokodeina); III – silne opioidy (**morfina, oksykodon, fentanyl, buprenorfina**, metadon); na każdym stopniu ± leki wspomagające."}, {"q": "Który opioid stosuje się jako lek przeciwkaszlowy niebędący typowym opioidem przeciwbólowym?", "a": "**Dekstrometorfan** (antagonista NMDA, działanie przeciwkaszlowe ośrodkowe); także kodeina."}], "sources": [{"t": "ChPL – Morfina (Autostrzykawka Morfina przeciwko bólowi 20 mg/2 ml), Rejestr Produktów Leczniczych", "u": "https://rejestry.ezdrowie.gov.pl/api/rpl/medicinal-products/41661/characteristic"}, {"t": "EMA – Fentanyl-ratiopharm TTS, Aneks I–III (ChPL, j. polski)", "u": "https://www.ema.europa.eu/pl/documents/referral/fentanyl-ratiopharm-25-50-75-100-mg-h-tts-article-29-referral-annex-i-ii-iii_pl.pdf"}]}, {"id": "f-nlpz", "num": "F3", "title": "NLPZ, paracetamol, metamizol, leki przeciwreumatyczne i przeciwdnawe", "summary": ["**Niesteroidowe leki przeciwzapalne (NLPZ)** hamują **cyklooksygenazę (COX)** i w ten sposób zmniejszają syntezę prostaglandyn i tromboksanu. Działają przeciwbólowo, przeciwgorączkowo i przeciwzapalnie, a kwas acetylosalicylowy także przeciwpłytkowo. **COX-1** jest konstytutywna: chroni błonę śluzową żołądka, utrzymuje przepływ nerkowy i odpowiada za syntezę TXA2 w płytkach. **COX-2** jest głównie indukowana w zapaleniu, choć konstytutywnie występuje m.in. w nerkach i śródbłonku, gdzie wytwarza prostacyklinę. Z tego wynikają działania niepożądane: nieselektywne NLPZ uszkadzają przewód pokarmowy, a koksyby (celekoksyb, etorykoksyb) są łagodniejsze dla żołądka, ale zaburzają równowagę TXA2/PGI2 i zwiększają ryzyko sercowo-naczyniowe. Według EMA **diklofenak** ma podobne ryzyko sercowo-naczyniowe jak koksyby.", "Grupy chemiczne NLPZ: salicylany (kwas acetylosalicylowy), pochodne kwasu arylooctowego (diklofenak, indometacyna, aceklofenak), arylopropionowego (ibuprofen, naproksen, ketoprofen, deksketoprofen), oksykamy (piroksykam, meloksykam, długi t½), fenamaty (kwas mefenamowy), nimesulid (hepatotoksyczny, ograniczony czas stosowania), nabumeton (prolek) oraz pochodne pirazolonu i pirazolidyny (metamizol, fenylbutazon). **Kwas acetylosalicylowy** hamuje COX **nieodwracalnie** przez acetylację, a płytka bez jądra nie syntetyzuje nowego enzymu, więc mała dawka (75–150 mg) działa przeciwpłytkowo przez cały okres życia płytki (7–10 dni). U dzieci z infekcją wirusową grozi **zespołem Reye'a**, a w zatruciu wywołuje mieszane zaburzenia kwasowo-zasadowe: najpierw zasadowicę oddechową, potem kwasicę metaboliczną.", "Działania niepożądane NLPZ: **owrzodzenia i krwawienia z przewodu pokarmowego** (profilaktyka IPP), **nefrotoksyczność** (zmniejszenie przepływu nerkowego, zwłaszcza z ACEI lub sartanem i diuretykiem w „triple whammy”, retencja Na⁺ i wody, hiperkaliemia, śródmiąższowe zapalenie nerek), wzrost RR i osłabienie działania leków hipotensyjnych, ryzyko zawału i udaru, **astma aspirynowa** (przesunięcie metabolizmu kwasu arachidonowego na leukotrieny), reakcje nadwrażliwości i hepatotoksyczność. W III trymestrze ciąży NLPZ są przeciwwskazane. Interakcje dotyczą warfaryny i SSRI (krwawienia), litu i metotreksatu (wzrost stężeń) oraz leków hipotensyjnych. Ibuprofen przyjęty przed ASA osłabia jego działanie przeciwpłytkowe.", "**Paracetamol** działa przeciwbólowo i przeciwgorączkowo, ale prawie nie działa przeciwzapalnie (słabo hamuje COX obwodowo, gdzie dużo jest nadtlenków). Nie uszkadza żołądka i nie wpływa na płytki, dlatego jest bezpieczny w ciąży i u dzieci. Po przedawkowaniu szlaki sprzęgania ulegają wysyceniu, a przez CYP2E1 powstaje **NAPQI**. Gdy wyczerpie się glutation, NAPQI wywołuje **martwicę wątroby** (szczyt uszkodzenia 72–96 h). Odtrutka to **N-acetylocysteina**, najskuteczniejsza w ciągu 8–10 h. Ryzyko zwiększają alkoholizm, głodzenie i induktory enzymów. **Metamizol** jest pochodną pirazolonu o silnym działaniu przeciwbólowym, przeciwgorączkowym i spazmolitycznym. Najgroźniejsze ryzyko to niezależna od dawki **agranulocytoza**. Według EMA (2024) gorączka, ból gardła i owrzodzenia śluzówek wymagają natychmiastowego przerwania leczenia i wykonania morfologii z rozmazem. Szybkie podanie dożylne może spowodować spadek ciśnienia.", "**Leki modyfikujące przebieg reumatoidalnego zapalenia stawów (LMPCh)** działają wolno, przez tygodnie lub miesiące. Lekiem pierwszego wyboru jest **metotreksat** (antagonista kwasu foliowego podawany raz w tygodniu z kwasem foliowym; działa hepatotoksycznie, mielotoksycznie, uszkadza płuca i jest teratogenny). Stosuje się też sulfasalazynę (rozkładaną w jelicie do 5-ASA i sulfapirydyny; daje oligospermię, niedobór folianów i agranulocytozę), leflunomid, **chlorochinę lub hydroksychlorochinę** (wymagają badań okulistycznych z powodu **retinopatii**), sole złota (dziś rzadko: proteinuria, cytopenie, zmiany skórne) i leki biologiczne (anty-TNF). **Dna moczanowa**: w napadzie stosuje się NLPZ, **kolchicynę** (hamuje polimeryzację tubuliny i migrację neutrofili, ma wąski indeks terapeutyczny i daje biegunkę, wymioty, mielosupresję oraz interakcje z inhibitorami CYP3A4/P-gp, np. klarytromycyną) albo glikokortykosteroidy. Leczenie przewlekłe opiera się na **allopurinolu lub febuksostacie** (inhibitory oksydazy ksantynowej, z ciężką interakcją z azatiopryną i 6-merkaptopuryną) i lekach urykozurycznych."], "review": [{"h": "COX i mechanizm NLPZ", "items": ["Kwas arachidonowy → **COX** → PGG2/PGH2 → PGE2, PGI2 (prostacyklina), TXA2", "**COX-1** – konstytutywna: ochrona śluzówki żołądka, przepływ nerkowy, **TXA2 w płytkach**", "**COX-2** – indukowana w zapaleniu; konstytutywnie w nerkach, śródbłonku (PGI2), mózgu", "Działanie: przeciwbólowe, przeciwgorączkowe (↓ PGE2 w podwzgórzu), przeciwzapalne, przeciwpłytkowe (ASA)", "Lipooksygenaza (leukotrieny) – NLPZ jej nie hamują → przesunięcie szlaku → **astma aspirynowa**"]}, {"h": "Podział NLPZ", "items": ["Salicylany: **kwas acetylosalicylowy**, diflunisal", "Kwas arylooctowy: **diklofenak**, aceklofenak, **indometacyna** (zamykanie PDA u wcześniaków)", "Kwas arylopropionowy: **ibuprofen, naproksen, ketoprofen, deksketoprofen**", "Oksykamy: **piroksykam, meloksykam** (długi t½, 1×/dobę)", "Fenamaty: kwas mefenamowy; **nimesulid** (hepatotoksyczny – max 15 dni); **nabumeton** (prolek)", "Pirazolony/pirazolidyny: **metamizol**, propyfenazon, fenylbutazon", "Koksyby (selektywne COX-2): **celekoksyb, etorykoksyb**"]}, {"h": "Kwas acetylosalicylowy", "items": ["**Nieodwracalna acetylacja COX** (seryna) – płytka nie odtwarza enzymu → efekt **7–10 dni**", "Dawka przeciwpłytkowa **75–150 mg**; przeciwbólowa/przeciwgorączkowa 0,5–1 g; przeciwzapalna ≥ 3–4 g/d", "**Zespół Reye'a** – dzieci i młodzież (granica 12–16 lat wg ChPL preparatu) z infekcją wirusową (encefalopatia + stłuszczenie wątroby)", "Zatrucie: szum w uszach, hiperwentylacja → **zasadowica oddechowa → kwasica metaboliczna**, hipertermia; leczenie: węgiel, **alkalizacja moczu** NaHCO₃, hemodializa", "Ibuprofen przed ASA – blokuje dostęp do COX-1 → osłabia działanie przeciwpłytkowe"]}, {"h": "Działania niepożądane NLPZ", "items": ["**Przewód pokarmowy**: owrzodzenia, krwawienia, perforacje → IPP u osób z grupy ryzyka (wiek > 65, wrzód w wywiadzie, GKS, antykoagulanty, SSRI)", "**Nerki**: ↓ GFR (zwł. odwodnienie, „triple whammy” NLPZ + ACEI/ARB + diuretyk), retencja Na⁺/wody, obrzęki, **hiperkaliemia**, śródmiąższowe zapalenie nerek, nefropatia analgetyczna", "**Układ krążenia**: ↑ RR, zaostrzenie niewydolności serca, ↑ ryzyko zawału i udaru (koksyby, **diklofenak** – EMA 2013)", "Diklofenak przeciwwskazany: **NYHA II–IV, choroba niedokrwienna serca, choroba tętnic obwodowych, choroba naczyń mózgowych**", "Astma aspirynowa (triada Samtera: astma + polipy nosa + nadwrażliwość na ASA)", "Ciąża: przeciwwskazane w **III trymestrze** (przewód tętniczy), od 20. tyg. – małowodzie", "Interakcje: warfaryna/SSRI/GKS (krwawienia), **lit i metotreksat** (↑ stężenie), ACEI/diuretyki (↓ działanie, ↑ nefrotoksyczność)"]}, {"h": "Paracetamol", "items": ["Przeciwbólowy i przeciwgorączkowy, **brak działania przeciwzapalnego**; bez wpływu na żołądek i płytki", "Bezpieczny w ciąży, u dzieci, w chorobie wrzodowej", "Max ~4 g/d u dorosłych (mniej przy alkoholizmie, niedożywieniu, chorobie wątroby)", "Przedawkowanie: wysycenie glukuronidacji i sulfatacji → CYP2E1 → **NAPQI** → wyczerpanie **glutationu** → martwica wątroby (strefa 3)", "Przebieg: 0–24 h skąpoobjawowo; 24–72 h ↑ AlAT; **72–96 h** max uszkodzenia", "Odtrutka: **N-acetylocysteina** (prekursor glutationu) – najlepiej w ciągu **8–10 h**; nomogram Rumacka–Matthew", "Czynniki ryzyka: alkoholizm, głodzenie, induktory (karbamazepina, ryfampicyna, izoniazyd)"]}, {"h": "Metamizol", "items": ["Pirazolon: silny przeciwbólowy, przeciwgorączkowy, **spazmolityczny**; słaby przeciwzapalny", "**Agranulocytoza** – niezależna od dawki, może wystąpić także u wcześniej tolerujących lek i krótko po odstawieniu", "EMA 2024: gorączka, dreszcze, **ból gardła, owrzodzenia śluzówek** → natychmiast **przerwać lek** i wykonać morfologię z rozmazem (nie czekać na wynik)", "Rutynowe monitorowanie morfologii **nie jest zalecane**", "Przeciwwskazania: agranulocytoza po pirazolonach w wywiadzie, upośledzona czynność szpiku, choroby układu krwiotwórczego", "Szybkie i.v. → **hipotensja**; reakcje anafilaktyczne"]}, {"h": "LMPCh (RZS) i dna moczanowa", "items": ["**Metotreksat** – antagonista folianów (hamuje reduktazę dihydrofolianową); **raz w tygodniu** + kwas foliowy; działania: hepatotoksyczność, mielosupresja, zapalenie płuc, owrzodzenia jamy ustnej, **teratogenny**; interakcje: NLPZ, kotrimoksazol, PPI", "**Sulfasalazyna** → 5-ASA + sulfapirydyna; oligospermia, niedobór folianów, agranulocytoza, pomarańczowy mocz", "**Chlorochina / hydroksychlorochina** – **retinopatia** (kontrola okulistyczna), wydłużenie QT, hemoliza przy niedoborze G6PD", "**Sole złota** – proteinuria (nefropatia błoniasta), cytopenie, zmiany skórne; dziś rzadko", "Leflunomid – hamuje syntezę pirymidyn; hepatotoksyczny, teratogenny (eliminacja cholestyraminą)", "**Kolchicyna** – hamuje polimeryzację **tubuliny** → ↓ migracji neutrofili; napad dny; biegunka, wymioty, mielosupresja, miopatia; interakcje z **klarytromycyną**, cyklosporyną (inhibitory CYP3A4/P-gp) – zgony", "**Allopurinol, febuksostat** – inhibitory oksydazy ksantynowej; allopurinol + **azatiopryna/6-MP** → ciężka mielotoksyczność; HLA-B*5801 – zespół DRESS/SJS", "Napad dny: NLPZ, kolchicyna, GKS; nie rozpoczynać allopurinolu w trakcie napadu bez osłony"]}], "cards": [{"q": "Jaki jest mechanizm działania NLPZ?", "a": "Hamowanie **cyklooksygenazy (COX-1 i COX-2)** → ↓ syntezy prostaglandyn (PGE2, PGI2) i tromboksanu A2 z kwasu arachidonowego."}, {"q": "Czym różnią się funkcje COX-1 i COX-2?", "a": "**COX-1** – konstytutywna: ochrona śluzówki żołądka, przepływ nerkowy, TXA2 w płytkach. **COX-2** – głównie indukowana w zapaleniu (ból, gorączka), konstytutywnie m.in. w nerkach i śródbłonku (prostacyklina)."}, {"q": "Dlaczego koksyby zwiększają ryzyko zakrzepowo-zatorowe?", "a": "Hamują wytwarzanie **prostacykliny** (COX-2 śródbłonka – antyagregacyjna, rozszerzająca naczynia), nie hamując **TXA2** płytek (COX-1) → przewaga działania prozakrzepowego."}, {"q": "Jakie przeciwwskazania wprowadzono dla diklofenaku po ocenie EMA w 2013 r.?", "a": "Zastoinowa niewydolność serca **NYHA II–IV**, choroba niedokrwienna serca, choroba tętnic obwodowych, choroba naczyń mózgowych – ryzyko sercowo-naczyniowe podobne do koksybów."}, {"q": "Czym różni się działanie kwasu acetylosalicylowego na COX od innych NLPZ?", "a": "ASA **nieodwracalnie acetyluje** COX (resztę seryny); pozostałe NLPZ hamują COX odwracalnie."}, {"q": "Dlaczego działanie przeciwpłytkowe ASA utrzymuje się 7–10 dni?", "a": "Płytki nie mają jądra i nie syntetyzują nowej COX-1 – efekt trwa przez cały okres ich życia."}, {"q": "Jaka dawka ASA działa przeciwpłytkowo?", "a": "**75–150 mg/dobę** (dawka przeciwbólowa 0,5–1 g, przeciwzapalna ≥ 3–4 g/dobę)."}, {"q": "Czym jest zespół Reye'a?", "a": "Ostra encefalopatia ze stłuszczeniem wątroby u dzieci z infekcją wirusową (grypa, ospa) przyjmujących **kwas acetylosalicylowy** – dlatego ASA nie stosuje się u dzieci i młodzieży z infekcjami wirusowymi (granica wieku w ChPL zależy od preparatu – zwykle 12 lub 16 lat)."}, {"q": "Jakie zaburzenia kwasowo-zasadowe występują w zatruciu salicylanami?", "a": "Najpierw **zasadowica oddechowa** (pobudzenie ośrodka oddechowego), potem **kwasica metaboliczna** z luką anionową; do tego szum w uszach, hipertermia, wymioty."}, {"q": "Jak leczy się zatrucie salicylanami?", "a": "Węgiel aktywowany, **alkalizacja moczu wodorowęglanem sodu** (↑ wydalanie słabego kwasu), uzupełnianie płynów i potasu, w ciężkich przypadkach **hemodializa**."}, {"q": "Dlaczego ibuprofen może osłabiać działanie kardioprotekcyjne ASA?", "a": "Przyjęty przed ASA odwracalnie zajmuje miejsce aktywne COX-1 w płytkach i **uniemożliwia jej acetylację** przez ASA."}, {"q": "Czym jest astma aspirynowa?", "a": "Napady skurczu oskrzeli po NLPZ – hamowanie COX przesuwa metabolizm kwasu arachidonowego na **leukotrieny** (lipooksygenaza). Triada Samtera: astma + polipy nosa + nadwrażliwość na ASA."}, {"q": "Wymień NLPZ z grupy pochodnych kwasu arylopropionowego.", "a": "**Ibuprofen, naproksen, ketoprofen, deksketoprofen**, flurbiprofen."}, {"q": "Wymień NLPZ z grupy oksykamów i ich cechę.", "a": "**Piroksykam, meloksykam**, lornoksykam – długi okres półtrwania (dawkowanie raz na dobę)."}, {"q": "Do czego stosuje się indometacynę u noworodków?", "a": "Do farmakologicznego **zamknięcia przetrwałego przewodu tętniczego** (PDA) u wcześniaków (także ibuprofen)."}, {"q": "Dlaczego czas stosowania nimesulidu jest ograniczony?", "a": "Z powodu **hepatotoksyczności** – maksymalnie 15 dni, tylko leczenie drugiego rzutu."}, {"q": "Jakie są czynniki ryzyka powikłań żołądkowo-jelitowych NLPZ i jak im zapobiegać?", "a": "Wiek > 65 lat, wrzód/krwawienie w wywiadzie, duże dawki, łączenie z GKS, antykoagulantami, SSRI, ASA. Profilaktyka: **inhibitor pompy protonowej**, wybór koksybu, najmniejsza skuteczna dawka."}, {"q": "Czym jest „triple whammy”?", "a": "Połączenie **NLPZ + ACEI/sartan + diuretyk** → wysokie ryzyko ostrego uszkodzenia nerek (↓ przepływu przez tętniczkę doprowadzającą i odprowadzającą + hipowolemia)."}, {"q": "Jak NLPZ wpływają na nerki?", "a": "↓ prostaglandyn rozszerzających tętniczkę doprowadzającą → ↓ GFR (zwłaszcza w odwodnieniu, niewydolności serca, marskości), retencja sodu i wody, obrzęki, **hiperkaliemia**, śródmiąższowe zapalenie nerek."}, {"q": "Z jakimi lekami NLPZ wchodzą w ważne interakcje?", "a": "**Warfaryna, SSRI, GKS** (krwawienia), **lit i metotreksat** (↑ stężenia – toksyczność), ACEI/sartany/diuretyki (↓ działania hipotensyjnego, nefrotoksyczność)."}, {"q": "Dlaczego paracetamol nie działa przeciwzapalnie?", "a": "Słabo hamuje COX w tkankach obwodowych, w których jest wysokie stężenie **nadtlenków** (ognisko zapalne); działa głównie ośrodkowo."}, {"q": "Jakie są zalety paracetamolu w porównaniu z NLPZ?", "a": "Nie uszkadza śluzówki żołądka, **nie wpływa na płytki**, nie zaostrza astmy aspirynowej (w zwykłych dawkach); bezpieczny w ciąży i u dzieci."}, {"q": "Jaki jest mechanizm hepatotoksyczności paracetamolu?", "a": "Po przedawkowaniu wysycają się glukuronidacja i sulfatacja → więcej leku metabolizowane przez **CYP2E1 do NAPQI** → wyczerpanie **glutationu** → NAPQI wiąże białka hepatocytów → martwica (strefa okołożylna)."}, {"q": "Jaka jest odtrutka w zatruciu paracetamolem i kiedy jest najskuteczniejsza?", "a": "**N-acetylocysteina** (odtwarza zapasy glutationu) – najskuteczniejsza podana w ciągu **8–10 h** od przyjęcia; decyzję ułatwia nomogram Rumacka–Matthew (stężenie ≥ 4 h)."}, {"q": "Kiedy następuje maksymalne uszkodzenie wątroby w zatruciu paracetamolem?", "a": "Po **72–96 godzinach** – wcześniej pacjent może mieć niewiele objawów."}, {"q": "Jakie czynniki zwiększają ryzyko hepatotoksyczności paracetamolu?", "a": "Przewlekły alkoholizm, głodzenie/niedożywienie (↓ glutationu), induktory enzymów (karbamazepina, fenytoina, ryfampicyna, izoniazyd), choroby wątroby."}, {"q": "Jakie działania ma metamizol?", "a": "Silne **przeciwbólowe, p
