 około **3. roku życia** jest fizjologiczne. Wysklepienie ocenia się w staniu i w leżeniu. Stopa płaska patologiczna jest sztywna. Inne zniekształcenia to stopa wydrążona, końsko-szpotawa, przywiedzenie śródstopia i paluch koślawy."], "review": [{"h": "Kończyny", "items": ["Pomiar: **kolec biodrowy przedni górny → kostka przyśrodkowa**; różnica **≥ 1 cm** = anizomelia", "Amelia, fokomelia (dystalny odcinek wprost z tułowia), mikromelia; adaktylia, polidaktylia, syndaktylia", "**Arachnodaktylia** – zespół Marfana; krótkie szerokie palce – zespół Downa", "Skrócenie kciuka, IV i V palca – **rzekoma niedoczynność przytarczyc**", "**Palce pałeczkowate** – sinicze wady serca, przewlekłe choroby płuc i wątroby, mukowiscydoza"]}, {"h": "Krzywica – objawy", "items": ["Czaszka: spłaszczenie i **rozmiękanie potylicy**, opóźnione zarastanie ciemiączka, **czaszka kwadratowa**, opóźnione ząbkowanie", "Klatka: **różaniec krzywiczy**, **bruzda Harrisona**, klatka dzwonowata lub kurza", "Miednica spłaszczona przednio-tylnie", "Kończyny: **bransolety krzywicze**, kończyny dolne X (koślawe) lub O (szpotawe)", "Rozpoznanie wymaga badań lab. (stężenie wit. D)"]}, {"h": "Stawy", "items": ["Zatarte obrysy – płyn wysiękowy, krew, obrzęk okołostawowy", "Ograniczenie czynnej = biernej → ból lub obrzęk stawu", "Ograniczona czynna, zachowana bierna → uszkodzenie ścięgien lub **porażenie wiotkie**", "Łatwiej pokazać dziecku ruch niż go tłumaczyć"]}, {"h": "Stawy biodrowe", "items": ["Na plecach: pozorne skrócenie uda (jednostronne), szeroka szpara międzyudowa (obustronne), pogłębiony fałd pachwinowy po stronie chorej", "Na brzuchu: fałd pośladkowy **wyżej** po stronie zwichnięcia; asymetria szpary międzypośladkowej", "Odwodzenie przy zgięciu 90°: norma **70–80°** (u chłopców nieco mniej)", "**Ortolani** (do 3. mies.) – przeskakiwanie głowy kości udowej przy odwodzeniu i ucisku wzdłuż osi uda", "**Barlow** – wyważanie głowy za tylny brzeg panewki przy ucisku i powrót po zwolnieniu; nie powtarzać często", "**USG bioder** – obowiązkowe badanie przesiewowe", "Starsze dziecko: skrócenie, chód utykający / kaczkowaty, skolioza, dodatni **objaw Trendelenburga** (opadanie miednicy po stronie nieobciążonej – niewydolność m. pośladkowego średniego)"]}, {"h": "Kręgosłup", "items": ["Krzywizny niewidoczne u noworodka, ustalają się do **6.–7. r.ż.**", "Nadmierna lordoza lędźwiowa u przedszkolaka – fizjologiczna (normalizuje się do ok. 11. r.ż.)", "Pion: guzowatość potyliczna → wyrostek kolczysty **C7** → szpara międzypośladkowa", "**Skolioza** – opisz odcinek i stronę szczytu; przyczyny ortopedyczne, nerwowo-mięśniowe, metaboliczne, idiopatyczne", "**Test Adamsa**: skłon w przód, dłonie złączone – **garb żebrowy** i wał mięśniowy", "Ruchomość: zgięcie/prostowanie (szyjny, lędźwiowy), zgięcia boczne (piersiowy), rotacja (szyjny)", "Opukiwanie paliczkiem; **objaw szczytowy** – ucisk na szczyt głowy wywołuje ból na poziomie zmiany"]}, {"h": "Stopy", "items": ["Płaskostopie fizjologiczne do ok. **3. r.ż.**", "Oceniaj w staniu (obciążenie) i w leżeniu (odciążenie)", "Elastyczne stopy płasko-koślawe: cecha rodzinna, trisomia 21, Marfan, MPD, dystrofia", "Stopa płaska patologiczna – **sztywna**", "Inne: stopa wydrążona, **końsko-szpotawa**, przywiedzione śródstopie, rozszczep stopy, paluch koślawy"]}], "cards": [{"q": "Jak mierzy się długość kończyny dolnej i kiedy różnica jest patologiczna?", "a": "Od **kolca biodrowego przedniego górnego do szczytu kostki przyśrodkowej**. Różnica **≥ 1 cm** = anizomelia (patologiczna)."}, {"q": "Jak orientacyjnie porównać długość ud u leżącego dziecka?", "a": "Ułożyć na plecach na twardym podłożu z kończynami zgiętymi pod kątem prostym w biodrach i kolanach – kolano krótszego uda leży niżej."}, {"q": "Co to jest fokomelia?", "a": "Brak ramienia i przedramienia (lub uda i goleni) – dystalny odcinek kończyny wyrasta bezpośrednio z tułowia."}, {"q": "W jakim zespole występuje arachnodaktylia?", "a": "W **zespole Marfana** (długie, cienkie palce)."}, {"q": "Skrócenie kciuka, IV i V palca jest typowe dla…?", "a": "**Rzekomej niedoczynności przytarczyc**."}, {"q": "W jakich chorobach występują palce pałeczkowate?", "a": "W stanach przewlekłego niedotlenienia tkanek: sinicze wady serca, przewlekłe choroby płuc i wątroby, **mukowiscydoza**."}, {"q": "Wymień objawy krzywicy w obrębie czaszki.", "a": "Spłaszczenie i rozmiękanie potylicy, opóźnione zarastanie ciemiączka, **czaszka kwadratowa**, opóźnione wyrzynanie zębów."}, {"q": "Wymień objawy krzywicy w obrębie klatki piersiowej.", "a": "**Różaniec krzywiczy**, **bruzda Harrisona**, klatka dzwonowata lub kurza."}, {"q": "Czym są bransolety krzywicze?", "a": "Zgrubienia nasad dalszych kości przedramion w krzywicy."}, {"q": "Co oznacza jednakowe ograniczenie ruchomości czynnej i biernej w stawie?", "a": "Zwykle **ból lub obrzęk stawu**."}, {"q": "Kiedy ruchomość czynna jest ograniczona przy zachowanej biernej?", "a": "Przy uszkodzeniu ścięgien mięśni poruszających staw albo **porażeniu wiotkim** kończyny."}, {"q": "Jakie objawy zwichnięcia biodra szukamy u niemowlęcia leżącego na plecach?", "a": "Pozorne skrócenie uda (jednostronne), poszerzona szpara międzyudowa (obustronne), pogłębiony fałd pachwinowy po stronie chorej, asymetria szpary sromowej, ograniczone odwodzenie."}, {"q": "Gdzie znajduje się fałd pośladkowy po stronie zwichnięcia biodra?", "a": "**Wyżej** niż po stronie zdrowej."}, {"q": "Jaki jest prawidłowy kąt odwiedzenia w stawach biodrowych u niemowlęcia?", "a": "**70–80°** (przy biodrach zgiętych 90°), często aż do zetknięcia ud z podłożem; u chłopców zwykle nieco mniej."}, {"q": "Na czym polega objaw Ortolaniego?", "a": "Dziecko na plecach, biodra zgięte 90°; lekki ucisk na kolana wzdłuż osi ud + odwodzenie. Pod palcami na krętarzach wyczuwa się **przeskakiwanie głowy kości udowej** po stronie zwichnięcia. Badany do 3. miesiąca."}, {"q": "Na czym polega objaw Barlowa?", "a": "Ucisk na kolana wzdłuż osi uda, potem zwolnienie – w niestabilnym biodrze głowa kości udowej **wyskakuje za tylny brzeg panewki** i samoistnie wraca. Nie powtarzać często (uszkadza panewkę)."}, {"q": "Jakie badanie jest dziś podstawą przesiewu w kierunku dysplazji bioder?", "a": "**USG stawów biodrowych** – obowiązkowe badanie przesiewowe."}, {"q": "Na czym polega objaw Trendelenburga i co oznacza wynik dodatni?", "a": "Dziecko staje na jednej nodze. Dodatni – **miednica opada po stronie nieobciążonej**, co oznacza niewydolność m. pośladkowego średniego (np. po zwichnięciu biodra)."}, {"q": "Jaki chód występuje przy obustronnym zwichnięciu bioder?", "a": "Kołyszący, a następnie **kaczkowaty**."}, {"q": "Kiedy ustalają się fizjologiczne krzywizny kręgosłupa?", "a": "Do **6.–7. roku życia**. Nadmierna lordoza lędźwiowa u przedszkolaka jest fizjologiczna."}, {"q": "Przez jakie punkty powinien przechodzić pion poprowadzony od guzowatości potylicznej?", "a": "Przez środek wyrostka kolczystego **C7** i przez **szparę międzypośladkową**."}, {"q": "Na czym polega test Adamsa i co ujawnia?", "a": "Powolny skłon tułowia w przód z dłońmi złączonymi (palce między stopami). Ujawnia asymetrię tułowia – w skoliozie **garb żebrowy** i wał mięśniowy po stronie skrzywienia."}, {"q": "Jakie są przyczyny skoliozy?", "a": "Ortopedyczne (różnica długości kończyn, wady kręgów), neurologiczne i nerwowo-mięśniowe (MPD, dystrofia, guzy rdzenia), metaboliczne (osteoporoza) oraz idiopatyczne."}, {"q": "Czym jest objaw szczytowy?", "a": "Ucisk na szczyt głowy stojącego dziecka wywołuje ból kręgosłupa na wysokości toczącego się procesu chorobowego."}, {"q": "Do jakiego wieku płaskostopie jest fizjologiczne?", "a": "Do około **3. roku życia**."}, {"q": "Czym różni się płaskostopie fizjologiczne od patologicznego?", "a": "Patologiczna stopa płaska jest **sztywna**; elastyczne stopy płasko-koślawe mogą być cechą rodzinną lub towarzyszyć zespołom (trisomia 21, Marfan, MPD, dystrofia)."}]}, {"id": "glowa-szyja", "num": "4.3", "title": "Badanie przedmiotowe: głowa, oczy, nos, uszy, jama ustna, szyja", "summary": ["**Czaszka.** Ocenia się kształt (stożkogłowie, czaszka kwadratowa w krzywicy, krótkogłowie), proporcje i **obwód głowy** mierzony na wysokości łuków brwiowych i guzowatości potylicznej. **Małogłowie** to obwód < 3. centyla (zespoły wad, encefalopatia niedotlenieniowo-niedokrwienna), a **wielkogłowie** > 97. centyla (najczęściej wodogłowie, też choroby metaboliczne lub cecha rodzinna). U niemowlęcia bada się ciemiączka: przednie ma ok. 2 × 2 cm, leży na poziomie kości lub nieco niżej i zarasta do 18. miesiąca. Napięte i uwypuklone wskazuje na wzrost ciśnienia śródczaszkowego (zapalenie opon, krwawienie), a zapadnięte na **odwodnienie**. Bada się też szwy i **craniotabes** (rozmiękanie kości ciemieniowo-potylicznych). Opukiwanie może dać odgłos „pękniętego garnka” (wodniaki podtwardówkowe). Osłuchiwanie czaszki nie jest rutynowe, choć głośne szmery występują w przetokach tętniczo-żylnych i wadzie żyły Galena.", "**Oczy.** Ocenia się osadzenie gałek (hiperteloryzm, wytrzeszcz, zapadnięcie), ustawienie (zez), ruchomość i oczopląs. Pozorny zez zbieżny może występować do 3. miesiąca, a nawet do 1. roku życia. Badamy powieki (ptoza, epicanthus, skośne szpary), objawy oczne w chorobie Gravesa–Basedowa (Stellwag, Dalrymple, Graefe, Kocher), drogi łzowe, spojówki, twardówki (niebieskie w osteogenesis imperfecta), rogówki i tęczówki (plamki Brushfielda w zespole Downa, coloboma). **Źrenice**: oceniamy kształt, szerokość i równość, reakcję bezpośrednią i konsensualną na światło oraz na zbieżność i akomodację. Rozszerzenie źrenic daje m.in. atropina i amfetamina, zwężenie morfina i barbiturany. **Leukokoria** (biała źrenica) może oznaczać zaćmę, retinopatię wcześniaków lub siatkówczaka.", "**Nos i zatoki.** Ocenia się kształt, ruch skrzydełek nosa (zwiększony wysiłek oddechowy), przedsionek, wydzielinę, drożność i cuchnięcie (zapalenie zatok, ciało obce). U noworodka niedrożność może wynikać z **zarośnięcia nozdrzy tylnych**. Obrzęk i zaczerwienienie u nasady nosa i przyśrodkowej części powiek wskazują na **zapalenie zatok sitowych**, groźne powikłaniami. **Uszy**: górny przyczep małżowiny powinien leżeć na wysokości zewnętrznego kąta oka lub wyżej, a nisko osadzone małżowiny towarzyszą wadom wrodzonym. Przewód słuchowy uwidacznia się, pociągając małżowinę ku tyłowi u niemowlęcia albo ku górze i tyłowi u starszego dziecka. Bolesność przy ucisku na skrawek sugeruje zapalenie ucha, które potwierdza się otoskopem.", "**Jama ustna i gardło** bada się wyłącznie oglądaniem, zwykle na końcu badania. Kolejno ocenia się wargi, przedsionek, zęby, język i okolicę podjęzykową, podniebienie, migdałki i tylną ścianę gardła. Ważne objawy to: plamki Koplika w odrze, pleśniawki w drożdżycy, wargi i język „malinowy” w chorobie Kawasaki, zajady, przerost dziąseł po fenytoinie i w białaczce, język malinowy w płonicy, ranula, perły Epsteina, rozdwojony języczek. **Zęby mleczne** (20) wyrzynają się od ok. 6. do 25. miesiąca, a ząbkowanie kończy się najpóźniej w 30. miesiącu. Ich liczbę szacuje się wzorem **wiek w miesiącach − 6**. Zęby stałe pojawiają się od 5.–6. roku życia, a do 14. roku jest ich 28. **Migdałki** są powiększone, gdy wystają poza przedni łuk podniebienny, a fizjologicznie zmniejszają się około 8. roku życia. Ropień okołomigdałkowy objawia się uwypukleniem łuku, przesunięciem języczka i szczękościskiem. Ropień pozagardłowy objawia się uwypukleniem tylnej ściany gardła, odgięciem głowy i ślinotokiem.", "**Szyja.** Ocenia się kształt, ruchomość i symetrię: kark bawoli w zespole Cushinga, **płetwistość szyi** w zespole Turnera i Noonana, krótką szyję w zespole Klippla–Feila oraz kręcz szyi kręgowy lub mięśniowy. **Tarczycę** ogląda się (skala WHO: 0, I, II) i bada palpacyjnie od tyłu podczas połykania. Fizjologicznie jest wyczuwalna od okresu pokwitania. Przy wolu ocenia się jego wielkość, kształt, ruchomość, bolesność, konsystencję, guzki i szmer naczyniowy. U niemowlęcia wiotka krtań daje świst wdechowy. **Tchawica** leży w linii środkowej, a jej przemieszczenie w bok występuje przy odmie lub niedodmie."], "review": [{"h": "Czaszka", "items": ["Obwód głowy: na wysokości **łuków brwiowych i guzowatości potylicznej**; +12 cm w 1. r.ż.", "**Małogłowie** < 3. centyla (zespoły wad, encefalopatia niedotlenieniowo-niedokrwienna); **wielkogłowie** > 97. centyla (najczęściej **wodogłowie**)", "Stożkogłowie – przedwczesne zarośnięcie wszystkich szwów; czaszka kwadratowa – krzywica", "Ciemiączko przednie ok. 2×2 cm, na poziomie lub nieco poniżej kości, zarasta do **18. mies.**", "Opóźnione zarastanie: krzywica, ↑ciśnienie śródczaszkowe, cecha osobnicza", "**Napięte/uwypuklone** → zapalenie opon, krwawienie, ↑ICP; **zapadnięte** → **odwodnienie**", "Ciemiączko tylne ok. 0,5 cm, zarasta do 6.–8. tyg. (max 4. mies.); przetrwałe – ↑ICP, wrodzona niedoczynność tarczycy", "Badaj, gdy dziecko **nie płacze**", "**Craniotabes**: niedobór wit. D, nadmiar fosforanów, osteopenia wcześniaków, osteogenesis imperfecta, zespół Downa", "Odgłos „pękniętego garnka” – **wodniaki podtwardówkowe**; bolesność wyrostka sutkowatego – powikłania zapalenia ucha", "Szmer nad czaszką – przetoki tętniczo-żylne, **wada żyły Galena**"]}, {"h": "Oczy", "items": ["Hiperteloryzm (wady wrodzone); wytrzeszcz / zapadnięcie (zespół Hornera, Crouzona)", "Zez zbieżny / rozbieżny; ruchomość: poziomo, pionowo, skośnie, zbieżność", "Śledzenie przedmiotu od **2. mies.**; pozorny zez zbieżny do 3. mies. (nawet do 1. r.ż.)", "Oczopląs fizjologiczny: optokinetyczny i krótkotrwały przy skrajnym spojrzeniu w bok", "Powieki: ptoza, epicanthus, szpary mongoloidalne / antymongoloidalne; jęczmień, gradówka, entropion, ektropion", "Graves–Basedow: **Stellwag** (rzadkie mruganie), **Dalrymple** (szeroka szpara), **Graefe** (rąbek twardówki przy patrzeniu w dół), **Kocher** (przy patrzeniu w górę)", "Twardówki niebieskie (fizjologicznie u niemowląt) – **osteogenesis imperfecta**; żółte – hiperbilirubinemia", "Tęczówka: coloboma, **plamki Brushfielda** (zespół Downa), heterochromia"]}, {"h": "Źrenice", "items": ["Norma: równe, okrągłe, średniej wielkości, reagują na światło, zbieżność i akomodację", "Mydriasis: atropina, amfetamina, ciężkie niedotlenienie OUN, ból/podniecenie", "Zwężenie: **morfina** i pochodne, barbiturany", "Anisocoria: zespół Hornera, bywa u zdrowych", "Uszkodzenie **n. II**: oświetlenie chorego oka – brak reakcji obu; zdrowego – zwężenie obu", "Uszkodzenie **n. III**: po stronie chorej brak reakcji bezpośredniej i pośredniej; oświetlenie chorego oka zwęża źrenicę zdrowego", "Argyll Robertson – brak reakcji na światło, zachowana na akomodację (kiła OUN)", "**Leukokoria**: zaćma, odwarstwienie siatkówki, retinopatia wcześniaków, **siatkówczak**"]}, {"h": "Nos, zatoki, uszy", "items": ["Ruch skrzydełek nosa – zwiększony wysiłek oddechowy", "Niedrożność u noworodka – **zarośnięcie nozdrzy tylnych**; u starszych – zapalenie, polipy, alergia", "Cuchnięcie z nosa – ropne zapalenie zatok, **ciało obce**, ozaena", "Obrzęk i zaczerwienienie u nasady nosa i przyśrodkowych części powiek – **zapalenie zatok sitowych** (groźne powikłania)", "Małżowina: górny przyczep na wysokości **zewnętrznego kąta oka** lub wyżej; nisko osadzone – wady wrodzone", "Dołki i wyrośla przeduszne – pozostałości łuków skrzelowych", "Przewód słuchowy: niemowlę – małżowina **ku tyłowi**; starsze dziecko – **ku górze i tyłowi**", "Bolesność skrawka – zapalenie ucha środkowego (potwierdź otoskopem)"]}, {"h": "Jama ustna", "items": ["Kolejność: wargi → przedsionek → zęby → język i okolica podjęzykowa → podniebienie → migdałki → tylna ściana gardła", "Wargi: rozszczep; sine (wady sinicze); suche (odwodnienie, kwasica); **Kawasaki** – przekrwione, spękane + język malinowy; zajady (wit. B2, Candida)", "Plamki barwnikowe na wargach – polipowatość przewodu pokarmowego", "Śluzówka: **plamki Koplika** (wczesny objaw odry), pleśniawki (drożdżyca), afty", "Ujście ślinianki przyusznej na wysokości 2. górnego przedtrzonowca; świnka – obrzęk unosi płatek ucha", "Dziąsła: przerost – **fenytoina**, ostra białaczka nielimfoblastyczna", "Język: duży – glikogenoza, wrodzona niedoczynność tarczycy, naczyniak; malinowy – **płonica**; gładki czerwony – język Huntera (niedokrwistość złośliwa); geograficzny, pobrużdżony – cecha osobnicza; zanik jednostronny – porażenie **n. XII**", "Ranula – torbiel ślinianki podjęzykowej", "Podniebienie: rozszczep („wilcza paszcza”), gotyckie; **perły Epsteina** u noworodków; rozdwojony języczek – najlżejszy rozszczep"]}, {"h": "Zęby", "items": ["Mleczne: **20**; wyrzynają się od ok. 6. (8.) do 25. mies.; normalny początek 5.–10. mies. (wcześniaki 6.–11.); koniec najpóźniej **30. mies.**", "Wzór: **liczba zębów = wiek w miesiącach − 6**; albo 4 zęby na każde 6 mies.", "Opóźnienie: niedożywienie, niedoczynność tarczycy, krzywica, trisomia 21, cecha rodzinna", "Stałe: od **5.–6. r.ż.** (pierwsze trzonowce); do 14. r.ż. – **28**; trzecie trzonowce po 18. r.ż.; uzębienie mieszane 6–12 lat", "Przebarwienia szkliwa: hiperbilirubinemia (żółtozielone–czarne), porfiria (czerwonobrunatne), **tetracykliny** (żółtobrunatne, do ok. 8. r.ż.)"]}, {"h": "Migdałki i gardło", "items": ["Ocena: „a”, szpatułka na nasadę języka, głęboki oddech ustami; krótko", "Powiększone, gdy wystają **poza przedni łuk podniebienny**; fizjologicznie maleją ok. **8. r.ż.**", "Powiększenie jednego migdałka – możliwy **chłoniak**", "Przerost migdałka gardłowego: oddychanie ustami, twarz adenoidalna, wady zgryzu, niedosłuch, chrapanie", "Naloty: angina, mononukleoza, błonica, grzybica", "**Ropień okołomigdałkowy**: uwypuklenie łuku, języczek przesunięty na stronę zdrową, szczękościsk, kręcz szyi", "**Ropień pozagardłowy**: uwypuklenie tylnej ściany, odgięcie głowy, dysfagia, duszność, ślinotok"]}, {"h": "Szyja, tarczyca, krtań", "items": ["Kark bawoli – zespół Cushinga; **płetwistość szyi** – zespół Turnera, Noonana; krótka szyja z niską linią włosów – Klippel–Feil", "Kręcz szyi kręgowy lub mięśniowy; ruchomość: broda do mostka, ucho do barku", "Wole wg WHO: **I** – widoczne po odgięciu głowy; **II** – widoczne przy pionowej głowie, bez deformacji zarysów; **III** – duże, deformuje zarysy szyi", "Palpacja tarczycy **od tyłu**, przy połykaniu; wyczuwalna fizjologicznie od pokwitania", "Wole: obwód szyi, kształt, symetria, ruchomość, przesuwalność skóry, bolesność (zapalenie), konsystencja, guzki, węzły, szmer", "Wiotka krtań niemowlęcia – świst wdechowy nasilający się przy płaczu", "Tchawica w linii środkowej; przemieszczenie – odma, niedodma, guzy szyi"]}], "cards": [{"q": "Jak mierzy się obwód głowy?", "a": "Na wysokości **łuków brwiowych i guzowatości potylicznej**; wynik odnosi się do siatek centylowych."}, {"q": "Kiedy rozpoznajemy małogłowie i wielkogłowie?", "a": "Małogłowie – obwód głowy **< 3. centyla**; wielkogłowie – **> 97. centyla**."}, {"q": "Jakie są najczęstsze przyczyny małogłowia i wielkogłowia?", "a": "Małogłowie – zespoły wad wrodzonych, okołoporodowa encefalopatia niedotlenieniowo-niedokrwienna. Wielkogłowie – najczęściej **wodogłowie**; też choroby metaboliczne (gangliozydozy), cecha rodzinna."}, {"q": "Co oznacza napięte, uwypuklone ciemiączko, a co zapadnięte?", "a": "Napięte/uwypuklone – **wzrost ciśnienia śródczaszkowego** (zapalenie opon, krwawienie). Zapadnięte ze zmniejszonym napięciem – **odwodnienie**."}, {"q": "Dlaczego ciemiączko bada się, gdy dziecko nie płacze?", "a": "Bo płacz zwiększa napięcie i tętnienie ciemiączka – wynik nie byłby miarodajny."}, {"q": "Jakie są przyczyny opóźnionego zarastania ciemiączka przedniego?", "a": "Krzywica, zwiększone ciśnienie śródczaszkowe, nieprawidłowy rozwój kości czaszki; może być cechą osobniczą."}, {"q": "Co może oznaczać przetrwałe ciemiączko tylne?", "a": "Zwiększone ciśnienie śródczaszkowe lub **wrodzoną niedoczynność tarczycy**."}, {"q": "Czym jest craniotabes i kiedy występuje?", "a": "Ogniska rozmiękania kości w okolicy ciemieniowo-potylicznej – niedobór wit. D, nadmiar fosforanów, osteopenia wcześniaków, osteogenesis imperfecta, czasem zespół Downa."}, {"q": "Co oznacza odgłos „pękniętego garnka” przy opukiwaniu czaszki niemowlęcia?", "a": "Jest charakterystyczny dla **wodniaków podtwardówkowych**."}, {"q": "Kiedy nad czaszką słychać głośny szmer?", "a": "W **przetokach tętniczo-żylnych** i wadach **żyły wielkiej mózgu (Galena)**; cichy szmer nad ciemiączkiem może towarzyszyć ↑ICP."}, {"q": "Do kiedy pozorny zez zbieżny może być fizjologiczny?", "a": "Do **3. miesiąca** (nawet do końca 1. roku życia). Prawidłowe śledzenie przedmiotu – od 2. miesiąca."}, {"q": "Jaki oczopląs jest fizjologiczny?", "a": "**Optokinetyczny** (przy patrzeniu na migające przedmioty) i krótkotrwały (kilka ruchów) przy skrajnym spojrzeniu w bok. Utrzymujący się przy patrzeniu w bok – patologiczny."}, {"q": "Wymień objawy oczne w chorobie Gravesa–Basedowa.", "a": "**Stellwag** – rzadkie mruganie; **Dalrymple** – poszerzona szpara powiekowa; **Graefe** – rąbek twardówki nad tęczówką przy patrzeniu w dół; **Kocher** – rąbek twardówki przy patrzeniu w górę."}, {"q": "Niebieskie twardówki u starszego dziecka sugerują…?", "a": "**Osteogenesis imperfecta** (u niemowląt niebieskawe twardówki są fizjologiczne)."}, {"q": "Czym są plamki Brushfielda?", "a": "Drobne odbarwienia tęczówki u dzieci z **zespołem Downa**."}, {"q": "Jakie substancje rozszerzają, a jakie zwężają źrenice?", "a": "Rozszerzają: **atropina** (parasympatykolityki), **amfetamina** (sympatykomimetyki); też ciężkie niedotlenienie OUN. Zwężają: **morfina** i pochodne, barbiturany."}, {"q": "Jak wygląda reakcja źrenic przy uszkodzeniu nerwu II?", "a": "Oświetlenie chorego oka nie zmienia wielkości żadnej źrenicy; oświetlenie zdrowego oka zwęża **obie** źrenice."}, {"q": "Jak wygląda reakcja źrenic przy uszkodzeniu nerwu III?", "a": "Po stronie chorej brak reakcji bezpośredniej i pośredniej; oświetlenie chorego oka wywołuje zwężenie źrenicy **drugiego** oka."}, {"q": "Co to jest objaw Argylla Robertsona?", "a": "Brak reakcji źrenic na światło przy zachowanej reakcji na akomodację – typowy dla kiły OUN (u dzieci nie występuje)."}, {"q": "Co może powodować leukokorię?", "a": "Zaćma, odwarstwienie siatkówki, bliznowacenie w retinopatii wcześniaków, **siatkówczak**."}, {"q": "Co może być przyczyną niedrożności nosa u noworodka?", "a": "**Zarośnięcie nozdrzy tylnych**."}, {"q": "Co sugeruje jednostronne cuchnięcie z nosa u dziecka?", "a": "**Ciało obce** w przewodzie nosowym (także ropne zapalenie zatok szczękowych, ozaena)."}, {"q": "Jakie objawy wskazują na ostre zapalenie zatok sitowych?", "a": "Obrzęk i zaczerwienienie skóry powyżej i nad nasadą nosa oraz przyśrodkowej części powiek górnych – stan z ryzykiem poważnych powikłań."}, {"q": "Jak ocenia się prawidłowe osadzenie małżowin usznych?", "a": "Górny przyczep małżowiny na wysokości **zewnętrznego kąta oka** lub nieco powyżej. Niskie osadzenie (bliżej kątów żuchwy) – patologia, zwykle z innymi wadami."}, {"q": "Jak uwidocznić przewód słuchowy zewnętrzny u niemowlęcia i starszego dziecka?", "a": "Niemowlę – pociągnąć małżowinę **ku tyłowi**; starsze dziecko – **ku górze i ku tyłowi**."}, {"q": "W jakiej kolejności oglądamy jamę ustną i gardło?", "a": "Czerwień wargowa → przedsionek → uzębienie → język i okolica podjęzykowa → podniebienie twarde i miękkie → migdałki podniebienne → tylna ściana gardła."}, {"q": "Czym są plamki Koplika?", "a": "Drobne białe plamki na błonie śluzowej policzków – jeden z **wczesnych objawów odry**."}, {"q": "Jakie zmiany w jamie ustnej są typowe dla choroby Kawasaki?", "a": "Przekrwione, obrzęknięte, spękane wargi, przekrwiona śluzówka jamy ustnej, **język malinowy**; do tego powiększone węzły szyjne."}, {"q": "Jakie są przyczyny przerostu dziąseł u dzieci?", "a": "Leczenie **fenytoiną** oraz ostra białaczka nielimfoblastyczna (z krwawieniem)."}, {"q": "Gdzie znajduje się ujście ślinianki przyusznej i jak wygląda świnka?", "a": "Na wysokości **drugich górnych zębów przedtrzonowych**. W śwince obrzęk ślinianki wypełnia przestrzeń za żuchwą i **unosi płatek ucha**."}, {"q": "Ile jest zębów mlecznych i kiedy powinno zakończyć się ząbkowanie?", "a": "**20**; ząbkowanie najpóźniej do **30. miesiąca** życia (wyrzynają się zwykle od ok. 6. do 25. mies.)."}, {"q": "Jak orientacyjnie obliczyć należną liczbę zębów mlecznych?", "a": "**Liczba zębów = wiek w miesiącach − 6** (albo: po 4 zęby na każde kolejne 6 miesięcy)."}, {"q": "Kiedy zaczynają wyrzynać się zęby stałe i ile ich jest do 14. r.ż.?", "a": "Od ok. **5.–6. roku życia** (pierwsze trzonowce); do 14. roku – **28** zębów stałych. Trzecie trzonowce zwykle po 18. r.ż."}, {"q": "Jakie przebarwienia szkliwa powodują tetracykliny?", "a": "**Żółtobrunatne** + hipoplazja szkliwa – jeśli podawano je ciężarnej w III trymestrze, matce karmiącej lub dziecku do ok. 8. roku życia."}, {"q": "Jakie znaczenie ma język malinowy?", "a": "Typowy dla **płonicy** (szkarlatyny); także choroby Kawasaki."}, {"q": "Co oznacza czerwony, wygładzony język (Huntera)?", "a": "Jeden z objawów **niedokrwistości złośliwej**."}, {"q": "Jednostronny zanik mięśni języka świadczy o…?", "a": "Porażeniu **nerwu podjęzykowego (XII)**."}, {"q": "Czym są perły Epsteina?", "a": "Drobne cysty na podniebieniu twardym noworodków; ustępują samoistnie."}, {"q": "Kiedy uznajemy migdałki podniebienne za powiększone?", "a": "Gdy wystają wyraźnie **poza krawędź przedniego łuku podniebiennego**. Fizjologicznie zmniejszają się ok. **8. roku życia**."}, {"q": "Co może oznaczać powiększenie tylko jednego migdałka podniebiennego?", "a": "Może być spowodowane **chłoniakiem nieziarniczym**."}, {"q": "Jakie objawy pośrednio wskazują na przerost migdałka gardłowego?", "a": "Oddychanie przez otwarte usta, twarz adenoidalna, wady zgryzu, niedosłuch, nawracające zapalenia uszu, chrapanie."}, {"q": "Jakie objawy sugerują ropień okołomigdałkowy?", "a": "Uwypuklenie i zaczerwienienie łuku podniebiennego, przesunięcie języczka na stronę przeciwną, **szczękościsk**, czasem kręcz szyi w stronę chorą."}, {"q": "Jakie objawy sugerują ropień pozagardłowy?", "a": "Uwypuklenie tylnej ściany gardła, odgięciowe ułożenie głowy, trudności w połykaniu i oddychaniu, **ślinotok**."}, {"q": "W jakich zespołach występuje płetwistość szyi?", "a": "W **zespole Turnera** (dziewczynki) i **zespole Noonana** (obie płcie)."}, {"q": "Jak klasyfikujemy wole wg WHO?", "a": "**I** – tarczyca widoczna dopiero po odgięciu głowy; **II** – widoczna jako uwypuklenie, bez deformacji bocznych zarysów szyi; **III** – duża, deformuje boczne zarysy szyi."}, {"q": "Jak bada się palpacyjnie tarczycę i od kiedy jest fizjologicznie wyczuwalna?", "a": "Obejmując szyję oburącz **od tyłu**, palce od chrząstki tarczowatej do dołka nadmostkowego, przy połykaniu śliny. Wyczuwalna od **okresu pokwitania**."}, {"q": "Co powoduje świst wdechowy u niemowlęcia nasilający się przy płaczu?", "a": "Nieproporcjonalnie mała krtań z **wiotkim szkieletem chrzęstnym**."}, {"q": "Kiedy tchawica przesuwa się w bok?", "a": "Przy **odmie opłucnowej**, niedodmie lub dużych tworach patologicznych szyi."}]}, {"id": "klatka-pluca", "num": "4.4", "title": "Badanie przedmiotowe: klatka piersiowa i układ oddechowy", "summary": ["Klatkę piersiową bada się oglądaniem, obmacywaniem, opukiwaniem i osłuchiwaniem. Zmiany lokalizuje się za pomocą **linii topograficznych** (środkowa przednia, mostkowe, przymostkowe, środkowo-obojczykowe, pachowe przednie, środkowe i tylne, łopatkowe, przykręgosłupowe, pośrodkowa tylna) i punktów orientacyjnych: kąta Ludwiga (przyczep II żebra), VII żebra (ostatniego połączonego z mostkiem) i wyrostka kolczystego C7.", "**Oglądanie.** U niemowlęcia klatka piersiowa jest beczkowata z poziomymi żebrami, a później taki kształt jest patologiczny. U dzieci przeważa typ normosteniczny. Do kształtów patologicznych należą klatka kurza, szewska (lejkowata), dzwonowata z bruzdą Harrisona i garb sercowy. Oceniamy symetrię ruchów, przy czym „spóźnianie się” jednej połowy przemawia za bólem, płynem lub odmą. Tor oddychania w 1. roku życia jest brzuszny, a od rozpoczęcia chodzenia piersiowo-brzuszny. Częstość oddechów wynosi u noworodka ok. 44/min, u małego dziecka 26–32/min, a u starszego 16–22/min. Patologiczne wzorce to tachypnoë, bradypnoë (guzy mózgu), bezdechy (u noworodka fizjologiczne do 10 s) oraz oddech Cheyne'a–Stokesa, Biota i Kussmaula (kwasica, śpiączka cukrzycowa, mocznica). Duszność u niemowlęcia objawia się sinicą, bezdechami, tachypnoë, ruchem skrzydełek nosa, zaciąganiem klatki i stękaniem wydechowym.", "**Obmacywanie.** Oceniamy bolesność, symetrię ruchomości (dłonie na łukach żebrowych) i **drżenie głosowe** („czterdzieści cztery”, u niemowlęcia podczas płaczu). Drżenie jest osłabione lub zniesione przy płynie w opłucnej i odmie, a wzmożone nad płucem bezpowietrznym z drożnym oskrzelem. Można też wyczuć tarcie opłucnej i odmę podskórną.", "**Opukiwanie** wykonuje się metodą pośrednią: palec do palca, ruch w nadgarstku, dwukrotne uderzenie. Opukiwanie **porównawcze** w ustalonych punktach daje prawidłowo odgłos jawny symetryczny. Stłumienie oznacza bezpowietrzność lub płyn, odgłos nadmiernie jawny rozedmę, a bębenkowy odmę. Ognisko jest wykrywalne, jeśli ma ≥ 5 cm średnicy i leży ≤ 5 cm od ściany klatki. Opukiwanie **topograficzne** wyznacza dolne granice płuc, które u młodszych dzieci leżą o jedno międzyżebrze wyżej. Ruchomość dolnych granic wynosi 5–8 cm i zmniejsza się przy zrostach, płynie i porażeniu nerwu przeponowego.", "**Osłuchiwanie** zaczyna się porównawczo, w tych samych punktach, w których opukiwano. Płacz dziecka nie przeszkadza, a nawet ułatwia ocenę głębokiego wdechu. **Szmer pęcherzykowy** przypomina głoskę „f”, a wydech słychać tylko przez krótki fragment. **Szmer oskrzelowy** przypomina „h”, z wydechem dłuższym niż wdech. Fizjologicznie słychać go tylko nad krtanią i tchawicą do kąta Ludwiga, a poniżej (np. w płatowym zapaleniu płuc) jest patologiczny. Dźwięki dodatkowe to: **świsty i furczenia** przy zwężeniu oskrzeli, głośniejsze na wydechu; **trzeszczenia** na szczycie wdechu (zapalenie, niedodma, zastój w niewydolności lewokomorowej); **rzężenia wilgotne** przy płynnej wydzielinie w oskrzelach, na wdechu i wydechu; **tarcie opłucnowe** pod koniec wdechu i na początku wydechu (suche zapalenie opłucnej)."], "review": [{"h": "Punkty orientacyjne", "items": ["**Kąt Ludwiga** – połączenie rękojeści z trzonem mostka, przyczep **II żebra**; poziom podziału tchawicy", "VII żebro – ostatnie przyczepione do mostka", "Wyrostek kolczysty **C7** – dobrze widoczny u dzieci", "Linia łopatkowa – przez dolny kąt łopatki; pachowa przednia – brzeg m. piersiowego większego; pachowa tylna – brzeg m. najszerszego grzbietu"]}, {"h": "Oglądanie", "items": ["Niemowlę: klatka **beczkowata**, żebra poziome, tor **brzuszny** – później beczkowata = patologia", "Typy: normosteniczny (kąt między łukami żebrowymi prosty), asteniczny (ostry kąt), pykniczny (rozwarty kąt)", "Patologiczne: **kurza**, **szewska/lejkowata**, **dzwonowata z bruzdą Harrisona**, płaska, asymetryczna, garb sercowy", "Powłóczenie jednej połowy: ból (zapalenie opłucnej), odma, płyn", "Tor: brzuszny (1. r.ż.) → piersiowo-brzuszny (od chodzenia); w pokwitaniu dziewczęta piersiowy, chłopcy brzuszny", "Oddechy paradoksalne: porażenie n. przeponowego, złamania żeber/mostka", "Wydłużony wydech (astma) → wrażenie odwrócenia faz: wydech – wdech – przerwa"]}, {"h": "Częstość i typy oddechu", "items": ["Noworodek ok. **44/min**; małe dziecko **26–32/min**; starsze **16–22/min**", "Tachypnoë: gorączka, choroby restrykcyjne, kwasica", "Bradypnoë: **guzy mózgu**", "Bezdechy u noworodka (zwłaszcza wcześniaka) fizjologiczne do **10 s** we śnie; dłuższe – posocznica, zapalenie opon, hipoglikemia, krwawienie do OUN, hipotermia, hipowolemia, niedokrwistość", "**Cheyne'a–Stokesa** – przerwa ok. ½ min, potem narastające i zanikające oddechy (ośrodek oddechowy)", "**Biota** – całkowicie nieregularny (ośrodkowy)", "**Kussmaula** – szybki i głęboki: kwasica ketonowa, mocznica, kwasica", "Duszność u niemowlęcia: sinica, bezdechy, tachypnoë, **ruch skrzydełek nosa**, zaciąganie klatki, **stękanie wydechowe**"]}, {"h": "Obmacywanie", "items": ["Bolesność, symetria ruchów (dłonie na łukach żebrowych)", "**Drżenie głosowe**: „czterdzieści cztery” / „raz, raz”; niemowlę – płacz", "Osłabione/zniesione – **płyn w opłucnej, odma**", "Wzmożone – płuco bezpowietrzne z **drożnym oskrzelem** (np. zapalenie płatowe)", "Wyczuwalne tarcie opłucnej, trzeszczenie odmy podskórnej"]}, {"h": "Opukiwanie", "items": ["Pośrednie: III palec prawej ręki → środkowy paliczek III palca lewej w międzyżebrzu; ruch w nadgarstku; 2 uderzenia", "Punkty porównawcze: okolice nad- i podobojczykowe; II pmż. w l. środkowo-obojczykowej (odgłos podstawowy wg Orłowskiego); IV pmż.; VI pmż. w l. pachowej środkowej; nad grzebieniami łopatek; międzyłopatkowo; pod kątami łopatek; szczyty", "Norma: odgłos **jawny symetryczny**", "**Stłumiony** – bezpowietrzność lub płyn; **nadmiernie jawny** – rozedma; **bębenkowy** – odma", "Wykrywalne ognisko: średnica ≥ **5 cm**, głębokość ≤ **5 cm**", "Granice dolne > 12 lat (płuco prawe): przymostkowa – VI żebro; środkowo-obojczykowa – VI; pachowa środkowa – VIII; łopatkowa – X; przykręgosłupowa – kręg Th10 (lewe: Th11)", "Młodsze dzieci – granice **o jedno międzyżebrze wyżej**", "Ruchomość dolnych granic: **5–8 cm**; ↓ zrosty, płyn, porażenie n. przeponowego", "Granice wysoko: bębnica, wodobrzusze, guz wątroby, płyn, porażenie przepony; nisko: rozedma, napad astmy"]}, {"h": "Osłuchiwanie", "items": ["Najpierw porównawczo, potem szczegółowo; spokojny i głęboki oddech, po kaszlu; **płacz ułatwia**", "**Szmer pęcherzykowy** – jak „f”; wydech krótki, bez przerwy między fazami; prawidłowy / wzmożony / osłabiony / zniesiony", "**Szmer oskrzelowy** – jak „h”; wydech > wdech, z przerwą; fizjologiczny tylko do **kąta Ludwiga**; poniżej – np. **płatowe zapalenie płuc**", "**Świsty** (wysokie), **furczenia** (niskie), piski – zwężenie oskrzeli (wydzielina, obrzęk, skurcz); głośniejsze na **wydechu**", "**Trzeszczenia** – szczyt **wdechu**; zapalenie, niedodma (znikają po kilku głębokich wdechach), zastój (niewydolność lewokomorowa)", "**Rzężenia wilgotne** drobno-, średnio-, grubobańkowe – płyn w oskrzelach; wdech i wydech", "**Tarcie opłucnowe** – skrzypiące; koniec wdechu i początek wydechu; suche zapalenie opłucnej"]}], "cards": [{"q": "Czym jest kąt Ludwiga i dlaczego jest ważny?", "a": "Połączenie rękojeści z trzonem mostka – miejsce przyczepu **II żebra**; odpowiada też poziomowi podziału tchawicy (do niego fizjologicznie słychać szmer oskrzelowy)."}, {"q": "Jaki kształt ma klatka piersiowa niemowlęcia i kiedy ten kształt jest patologiczny?", "a": "**Beczkowaty**, z poziomymi żebrami. Utrzymywanie się go w późniejszych okresach życia jest patologiczne."}, {"q": "Wymień patologiczne kształty klatki piersiowej.", "a": "Kurza, szewska (lejkowata), dzwonowata z bruzdą Harrisona, płaska, asymetryczna (wady kręgosłupa, mostka, żeber, choroby nerwowo-mięśniowe), z garbem sercowym."}, {"q": "Co oznacza „spóźnianie się” jednej połowy klatki przy oddychaniu?", "a": "Asymetryczne zmniejszenie ruchomości – ból (zapalenie opłucnej), **odma** lub **płyn** w jamie opłucnej."}, {"q": "Jaki jest tor oddychania w 1. roku życia i kiedy się zmienia?", "a": "**Brzuszny**; piersiowo-brzuszny ustala się, gdy dziecko zaczyna chodzić. W pokwitaniu dziewczęta – piersiowy, chłopcy – brzuszny."}, {"q": "Podaj prawidłową częstość oddechów w zależności od wieku.", "a": "Noworodek ok. **44/min**; małe dziecko **26–32/min**; starsze dziecko **16–22/min**."}, {"q": "Jaka częstość oddechów towarzyszy guzom mózgu?", "a": "**Zwolniona (bradypnoë)**."}, {"q": "Jakie bezdechy u noworodka są fizjologiczne?", "a": "Krótkie epizody we śnie trwające **nie dłużej niż 10 s**, w 1. miesiącu życia (częściej u wcześniaków)."}, {"q": "Jakie są przyczyny patologicznych bezdechów u noworodka?", "a": "Posocznica, zapalenie opon, hipoglikemia, krwawienie do OUN, hipotermia, hipowolemia, niedokrwistość."}, {"q": "Opisz oddech Cheyne'a–Stokesa.", "a": "Po przerwie ok. **½ minuty** oddechy najpierw wolne i płytkie, potem coraz głębsze i częstsze, następnie stopniowo zanikające – zaburzenia ośrodka oddechowego."}, {"q": "Czym jest oddech Kussmaula i kiedy występuje?", "a": "Przyspieszone i **pogłębione** oddechy – kwasica ketonowa (śpiączka cukrzycowa), mocznica, inne kwasice."}, {"q": "Czym jest oddech Biota?", "a": "Całkowicie nieregularny oddech (zmienna częstość i głębokość) pochodzenia ośrodkowego."}, {"q": "Jakie są objawy duszności u noworodka i niemowlęcia?", "a": "Sinica, bezdechy, przyspieszony oddech, **ruch skrzydełek nosa**, zaciąganie klatki piersiowej, **stękanie wydechowe**."}, {"q": "Jak bada się drżenie głosowe u niemowlęcia?", "a": "Podczas **płaczu** (starsze dziecko powtarza „czterdzieści cztery” lub „raz, raz”), przykładając całą dłoń symetrycznie."}, {"q": "Kiedy drżenie głosowe jest osłabione, a kiedy wzmożone?", "a": "Osłabione/zniesione – **płyn w opłucnej, odma**. Wzmożone – nad płucem **bezpowietrznym przy drożnym oskrzelu** (np. zapalenie płatowe)."}, {"q": "Jak prawidłowo wykonać opukiwanie pośrednie?", "a": "Środkowy paliczek III palca lewej ręki ściśle w międzyżebrzu; uderzamy opuszką zgiętego III palca prawej ręki, ruchem tylko w nadgarstku, **dwukrotnie** w każdym miejscu."}, {"q": "Co to jest odgłos podstawowy wg Orłowskiego?", "a": "Odgłos opukowy w **II lewym międzyżebrzu** w linii środkowo-obojczykowej."}, {"q": "Co oznacza odgłos opukowy stłumiony, nadmiernie jawny i bębenkowy nad płucami?", "a": "**Stłumiony** – bezpowietrzność tkanki lub płyn w opłucnej; **nadmiernie jawny** – rozedma; **bębenkowy** – odma opłucnowa."}, {"q": "Jakie ognisko bezpowietrzne da się wypukać u starszego dziecka?", "a": "O średnicy **≥ 5 cm**, położone **≤ 5 cm** od ściany klatki piersiowej."}, {"q": "Gdzie leży dolna granica prawego płuca w linii środkowo-obojczykowej, pachowej środkowej i łopatkowej (dziecko > 12 lat)?", "a": "Środkowo-obojczykowa – **VI żebro**; pachowa środkowa – **VIII żebro**; łopatkowa – **X żebro** (przykręgosłupowo – kręg Th10)."}, {"q": "Jak różnią się granice płuc u młodszych dzieci?", "a": "Leżą **o jedną przestrzeń międzyżebrową wyżej**."}, {"q": "Jaka jest ruchomość dolnych granic płuc i co ją zmniejsza?", "a": "**5–8 cm** (zależnie od wieku). Zmniejszają ją zrosty opłucnowe, płyn w opłucnej, porażenie nerwu przeponowego."}, {"q": "Dlaczego płacz nie przeszkadza w osłuchiwaniu płuc?", "a": "Bo ułatwia ocenę – w fazie płaczu dziecko wykonuje **głęboki wdech**."}, {"q": "Opisz szmer pęcherzykowy.", "a": "Podobny do szeptanej głoski **„f”**; fizjologiczny; krótka faza wydechowa (słyszalna przez ⅓ wydechu), brak przerwy między wdechem a wydechem."}, {"q": "Opisz szmer oskrzelowy i kiedy jest patologiczny.", "a": "Chuchający, jak głoska **„h”**, wydech dłuższy od wdechu, z przerwą. Fizjologiczny nad krtanią i tchawicą do **kąta Ludwiga**; poniżej – patologiczny (płuco bezpowietrzne z drożnym oskrzelem, np. **płatowe zapalenie płuc**)."}, {"q": "Skąd biorą się świsty i furczenia i kiedy są głośniejsze?", "a": "Ze zwężenia oskrzela (gęsta wydzielina, obrzęk śluzówki, skurcz mięśniówki). Głośniejsze na **wydechu**. Furczenia – niskie, świsty – wysokie, piski – bardzo wysokie."}, {"q": "Kiedy słychać trzeszczenia i jakie są ich przyczyny?", "a": "Na **szczycie wdechu** – upowietrznianie niedodmowych pęcherzyków (niedodma, zapalenie) lub zastój krwi (niewydolność lewokomorowa)."}, {"q": "Jak odróżnić trzeszczenia z niedodmy?", "a": "Słychać je w dolnych partiach płuc i **znikają po kilku głębokich wdechach**."}, {"q": "Czym są rzężenia wilgotne i kiedy je słychać?", "a": "Powstają przez płynną wydzielinę w oskrzelach (drobno-, średnio-, grubobańkowe – zależnie od średnicy oskrzela); słyszalne na **wdechu i wydechu**."}, {"q": "Jak brzmi tarcie opłucnowe i kiedy je słychać?", "a": "Twardy, skrzypiący odgłos; najlepiej pod **koniec wdechu i na początku wydechu**. U dzieci najczęściej suche zapalenie opłucnej."}]}, {"id": "krazenie", "num": "4.5", "title": "Badanie przedmiotowe: układ krążenia, tętno, ciśnienie", "summary": ["**Oglądanie** obejmuje garb sercowy, nadmierne tętnienia (w dołku podsercowym od prawej komory, w dołku nadmostkowym od łuku aorty, w II lewym międzyżebrzu od pnia płucnego), żyły szyjne i uderzenie koniuszkowe. U leżącego płasko dziecka żyły szyjne są niewidoczne, a w pozycji 45° widać je na 1–2 cm nad obojczykiem. Zapadają się na wdechu. Widoczne tętno żylne wskazuje na utrudniony odpływ do prawego przedsionka lub ucisk na żyłę główną górną (guzy, węzły śródpiersia).", "**Obmacywanie.** U niemowlęcia uderzenie koniuszkowe leży w IV międzyżebrzu, 1–1,5 cm na zewnątrz od lewej linii środkowo-obojczykowej, a u starszych dzieci w V międzyżebrzu, 0,5–1 cm do wewnątrz od niej. Prawidłowo da się je przykryć opuszką palca. Uderzenie rozlane wskazuje na przerost lewej komory, a osłabione na płyn w osierdziu lub lewej opłucnej. Przesuwa się w lewo i w dół przy powiększeniu lewego serca, w stronę chorego płuca przy zrostach i ku stronie przeciwnej przy płynie lub odmie. **Koci mruk** (drżenie) towarzyszy szmerom ≥ 4/6, a drżenie w dołku nadmostkowym zastawkowemu zwężeniu aorty.", "**Opukiwanie** wyznacza granice stłumienia względnego, zawsze w kierunku od płuca do serca, z palcem ułożonym równolegle do granicy. Granice zmieniają się z wiekiem (tabela 5): u niemowlęcia lewa granica leży 1–1,5 cm na zewnątrz od linii środkowo-obojczykowej, a górna na II żebrze. Powyżej 7. roku życia są niemal takie jak u dorosłego.", "**Osłuchiwanie** prowadzi się w kilku pozycjach, membraną (dźwięki wysokie) i lejkiem (niskie). Niemowlę najlepiej osłuchiwać podczas snu lub ssania. Kolejność punktów: zastawka mitralna (koniuszek), aortalna (II prawe międzyżebrze), płucna (II lewe międzyżebrze), trójdzielna (prawy brzeg mostka przy IV chrząstce) i **punkt Erba** (lewy brzeg mostka przy IV chrząstce). Oceniamy miarowość: **niemiarowość oddechowa** jest fizjologiczna i ustępuje po wstrzymaniu oddechu. Oceniamy też częstość (tabela 6) oraz głośność, akcentację i czystość tonów. **Fizjologiczne rozdwojenie II tonu** jest zmienne oddechowo, słyszalne na wdechu w II lewym międzyżebrzu. Stałe rozdwojenie II tonu oznacza ubytek międzyprzedsionkowy lub zwężenie zastawki płucnej.", "**Szmery** mogą być zewnątrzsercowe (tarcie osierdzia), organiczne, czynnościowe (gorączka, niedokrwistość, nadczynność tarczycy) lub **niewinne**. Niewinne są niemal zawsze skurczowe, ciche (< 3/6), zmienne z pozycją i nasilają się po wysiłku. Należą do nich szmer Stilla, szmer przepływu płucnego, szmer tętnic szyjnych i buczenie żylne. Każdy szmer opisujemy przez fazę, czas w cyklu, punctum maximum, promieniowanie, charakter i głośność w 6-stopniowej **skali Levine'a**. Rozdział wiąże też typowe wady z miejscami osłuchiwania. Szmer maszynowy (ciągły) oznacza przetrwały przewód tętniczy.", "**Tętno** bada się na tętnicach szyjnych, promieniowych, udowych i grzbietowych stóp. Oceniamy częstość, miarowość, zgodność z akcją serca, wypełnienie, napięcie i chybkość. Słabe tętno na kończynach dolnych przy silnym na górnych wskazuje na **koarktację aorty**. Tętno chybkie występuje w niedomykalności aorty, PDA i nadczynności tarczycy, a leniwe w zwężeniu aorty. Wzrost temperatury o 1°C przyspiesza tętno o 8–10/min. **Ciśnienie (RR)** mierzy się u wypoczętego dziecka, po 5 minutach siedzenia, mankietem odpowiedniej szerokości, trzykrotnie, i liczy średnią z II i III pomiaru. Ciśnienie rozkurczowe odpowiada IV fazie Korotkowa u dzieci < 12 lat i V fazie u starszych. Wynik odnosi się do centyli: < 90. centyla norma, 90.–95. wysokie prawidłowe, > 95. nadciśnienie."], "review": [{"h": "Oglądanie i obmacywanie", "items": ["Tętnienia: dołek podsercowy – **prawa komora**; dołek nadmostkowy – **łuk aorty**; II lewe pmż. – pień płucny; II prawe pmż. – tętniak aorty", "Żyły szyjne: niewidoczne na płasko; przy 45° do **1–2 cm** nad obojczykiem; zapadają się na wdechu", "Widoczne tętno żylne – utrudniony odpływ do prawego przedsionka, ucisk na ż. główną górną (guzy, węzły śródpiersia)", "Uderzenie koniuszkowe: niemowlę – **IV pmż., 1–1,5 cm na zewnątrz** od l. środkowo-obojczykowej lewej; starsze – **V pmż., 0,5–1 cm do wewnątrz**", "Szerokość – na opuszkę palca; **rozlane** – przerost lewej komory", "Wzmożone – wysiłek, emocje, nadczynność tarczycy; osłabione – płyn w osierdziu, płyn/powietrze w lewej opłucnej, zaciskające zapalenie osierdzia, otyłość", "Przesunięcie: lewo i dół – powiększenie lewego serca; lewo – prawa komora; ku chorej stronie – zrosty; ku zdrowej – płyn/odma; po prawej – **dekstrokardia**", "**Koci mruk** – szmer ≥ **4/6**; drżenie w dołku nadmostkowym – zwężenie zastawki aorty"]}, {"h": "Granice serca (stłumienie względne)", "items": ["Opukuj **od płuca do serca**, palec równolegle do granicy", "Niemowlę: prawa – l. przymostkowa prawa; górna – **II żebro**; lewa – **1–1,5 cm na zewnątrz** od l. środkowo-obojczykowej, IV pmż.", "2–5 lat: prawa – l. przymostkowa; górna – II pmż.; lewa – 0,5–1 cm na zewnątrz, IV pmż.", "> 5 lat: prawa – l. przymostkowa; górna – II pmż.; lewa – **l. środkowo-obojczykowa**, V pmż.", "> 7 lat: prawa – 0,5–1 cm od prawego brzegu mostka; górna – **III żebro**; lewa – 0,5–1 cm do wewnątrz od l. środkowo-obojczykowej", "Stłumienie bezwzględne – u dzieci małe znaczenie"]}, {"h": "Osłuchiwanie – miejsca i tony", "items": ["**Mitralna** – koniuszek; **aortalna** – II pmż. prawe; **płucna** – II pmż. lewe; **trójdzielna** – prawy brzeg mostka, IV chrząstka; **punkt Erba** – lewy brzeg mostka, IV chrząstka", "Membrana – wysokie częstotliwości; lejek – niskie", "Niemowlę – w czasie snu lub ssania", "I ton – zamknięcie zastawek przedsionkowo-komorowych; głośniejszy nad koniuszkiem; **zgodny z tętnem**", "II ton – zamknięcie zastawek półksiężycowatych; głośniejszy u podstawy", "**Niemiarowość oddechowa**: ↑ HR na wdechu, ↓ na wydechu; ustępuje po wstrzymaniu oddechu", "Wzmożony I ton – **zwężenie mitralne**; wzmożony II ton nad aortą – nadciśnienie; nad płucną – nadciśnienie płucne", "Osłabienie obu tonów – otyłość, rozedma, płyn w opłucnej, niewydolność, **płyn w osierdziu**", "Osłabiony I ton – zapalenie mięśnia sercowego, dur brzuszny", "**Fizjologiczne rozdwojenie II tonu** – zmienne oddechowo, na wdechu, II lewe pmż.", "Stałe rozdwojenie II tonu – **ASD**, zwężenie zastawki płucnej; paradoksalne (na wydechu) – kardiomiopatia przerostowa, blok lewej odnogi"]}, {"h": "Częstość serca (tab. 6)", "items": ["Do 1. mies.: **100–160**/min", "Do 6. mies.: 100–140", "6–12 mies.: 100–120", "2–6 lat: 90–110", "7–10 lat: 80–100", "11–14 lat: **70–90**", "+1°C temperatury = +8–10 uderzeń/min"]}, {"h": "Szmery", "items": ["Zewnątrzsercowe (osierdziowe): skurcz i rozkurcz, nasila ucisk słuchawką, nie promieniują", "Opłucnowo-osierdziowe – zależne od oddechu", "Wewnątrzsercowe: organiczne / czynnościowe (gorączka, niedokrwistość, nadczynność tarczycy) / **niewinne**", "Niewinne: prawie zawsze **skurczowe**, ciche (< **3/6**), zmienne z pozycją (głośniejsze na leżąco), nasilają się po wysiłku; najczęściej 8–12 lat", "**Stilla (klasyczny)** – między koniuszkiem a punktem Erba, 3–6 lat", "Przepływu płucnego – II–III lewe pmż., 8–14 lat; u noworodków znika w 3.–6. mies.", "Tętnic szyjnych – okolice nadobojczykowe (częściej prawa)", "**Buczenie żylne** – ciągły, pod obojczykiem, głośniejszy w siedzeniu, nasila się przy skręcie głowy; znika na leżąco; 3–6 lat", "Skurczowe: niedomykalność zastawek AV, zwężenie półksiężycowatych, ASD, VSD; rozkurczowe: zwężenie AV, niedomykalność półksiężycowatych; **ciągły (maszynowy) – PDA**", "Opis: faza, czas (proto-/mezo-/tele-/holosystoliczny), punctum maximum, promieniowanie, charakter, głośność, zmienność"]}, {"h": "Skala Levine'a", "items": ["**1/6** – bardzo cichy, słyszalny po chwili, najlepiej przy wstrzymanym oddechu", "**2/6** – cichy, słyszalny od razu", "**3/6** – średnio głośny, **nigdy** nie towarzyszy mu koci mruk", "**4/6** – głośny, zwykle z **kocim mrukiem**; słyszalny przez dłoń badającego", "**5/6** – bardzo głośny, słyszalny przez przedramię", "**6/6** – słyszalny ze słuchawką 1 cm od klatki"]}, {"h": "Wady a miejsce osłuchiwania", "items": ["Koniuszek: niedomykalność mitralna, wypadanie płatka mitralnego (skurczowe)", "Lewy dolny brzeg mostka: **VSD**, podzastawkowe zwężenie aorty, niedomykalność trójdzielna, szmer Stilla", "Punkt Erba: niedomykalność aortalna (rozkurczowy)", "II lewe pmż.: **ASD** (skurczowy), zwężenie zastawki płucnej (promieniuje do pleców), **PDA** (skurczowo-rozkurczowy), przepływ płucny"]}, {"h": "Tętno", "items": ["Tętnice: szyjne, promieniowe, udowe, grzbietowe stóp; opuszki II–IV palca", "Cechy: częstość, miarowość, zgodność z akcją serca, wypełnienie, napięcie, chybkość; symetria", "Słabe/brak na udowych przy dobrym na ramiennych → **koarktacja aorty**", "Wzmożone tętno udowe + tętnienie ciemiączka u niemowlęcia → **PDA**", "**Chybkie** – niedomykalność aorty, PDA, nadczynność tarczycy; **leniwe** – zwężenie aorty", "Deficyt tętna – różnica HR nad koniuszkiem i na obwodzie (ekstrasystolia)", "Bradykardia patologiczna: ↑ICP, hiperbilirubinemia, podrażnienie n. X, bloki"]}, {"h": "Ciśnienie tętnicze", "items": ["Wypoczęte dziecko, siedzące, ramię na wysokości serca, **5 min** spoczynku; bez jedzenia/palenia 30 min", "Niemowlę – w czasie karmienia lub snu (we śnie o 5–7 mm Hg niższe)", "Mankiet za wąski → **fałszywie zawyżony** wynik; za szeroki → zaniżony", "Napompuj ~30 mm Hg ponad zanik tętna; wypuszczaj 2–3 mm Hg/s", "Skurczowe – I ton; rozkurczowe – **IV faza Korotkowa < 12 lat**, V faza > 12 lat", "3 pomiary, średnia z II i III; wyższe RR na prawym ramieniu → koarktacja", "Niemowlę: metoda palpacyjna (pojawienie się tętna = skurczowe) lub oscylometryczna", "Kończyna dolna: na brzuchu, osłuchiwanie w dole podkolanowym", "Średnie: 0–1 r. **90/60**; 1–3 r. 95/65; 3–6 r. 100/65; 6–9 r. 105/65; 9–12 r. 110/70; 13–15 r. **120/80**", "ESH: < 90. centyla – norma; 90.–95. – wysokie prawidłowe; > 95. do 99. + 5 mm Hg – **nadciśnienie I°**; > 99. + 5 mm Hg – **II°**"]}], "cards": [{"q": "Gdzie znajduje się uderzenie koniuszkowe u niemowlęcia, a gdzie u starszego dziecka?", "a": "Niemowlę – **IV międzyżebrze, 1–1,5 cm na zewnątrz** od lewej linii środkowo-obojczykowej. Starsze dziecko – **V międzyżebrze, 0,5–1 cm do wewnątrz** od tej linii."}, {"q": "Co oznacza rozlane uderzenie koniuszkowe?", "a": "Uderzenie zajmujące większą powierzchnię niż opuszka palca – **powiększenie (przerost) lewej komory**."}, {"q": "Kiedy uderzenie koniuszkowe jest osłabione lub niewyczuwalne?", "a": "Płyn w worku osierdziowym, płyn/powietrze w lewej jamie opłucnej, zaciskające zapalenie osierdzia, obrzęk tkanek, otyłość."}, {"q": "W którą stronę przesuwa się uderzenie koniuszkowe przy płynie w opłucnej, a w którą przy zrostach?", "a": "Przy płynie lub odmie – **w stronę przeciwną**. Przy zrostach i zmianach włóknistych – **w stronę chorego płuca**."}, {"q": "Czym jest „koci mruk” i kiedy się pojawia?", "a": "Wyczuwalne drżenie ściany klatki piersiowej przy wadzie serca – towarzyszy szmerom o głośności **≥ 4/6** w skali Levine'a."}, {"q": "Drżenie w dołku nadmostkowym jest charakterystyczne dla…?", "a": "**Zastawkowego zwężenia aorty**."}, {"q": "Tętnienie w dołku podsercowym pochodzi od…?", "a": "**Prawej komory** serca."}, {"q": "Jak prawidłowo opukiwać granice serca?", "a": "Zawsze prostopadle do wyznaczanej granicy, **od strony płuca w kierunku serca**, z palcem-plesymetrem ułożonym równolegle do granicy."}, {"q": "Podaj granice serca u niemowlęcia.", "a": "Prawa – prawa linia przymostkowa; górna – **II żebro**; lewa – **1–1,5 cm w lewo** od lewej linii środkowo-obojczykowej, w IV międzyżebrzu."}, {"q": "Podaj granice serca u dziecka powyżej 7. roku życia.", "a": "Prawa – 0,5–1 cm w prawo od prawego brzegu mostka; górna – **III żebro**; lewa – 0,5–1 cm do wewnątrz od lewej linii środkowo-obojczykowej."}, {"q": "Wymień miejsca osłuchiwania serca w kolejności.", "a": "Zastawka dwudzielna – koniuszek; aortalna – II pmż. po prawej mostka; płucna – II pmż. po lewej; trójdzielna – prawy brzeg mostka przy IV chrząstce; **punkt Erba** – lewy brzeg mostka przy IV chrząstce."}, {"q": "Kiedy najlepiej osłuchiwać serce niemowlęcia?", "a": "W ułożeniu, które akceptuje bez krzyku – najlepiej **podczas snu lub ssania**."}, {"q": "Czym różni się membrana od lejka fonendoskopu?", "a": "Membrana – lepsza słyszalność dźwięków o **wysokiej** częstotliwości; lejek – o **niskiej**."}, {"q": "Jak odróżnić I ton od II tonu serca?", "a": "I ton jest głośniejszy nad zastawkami przedsionkowo-komorowymi (koniuszek) i **zgodny z falą tętna** na obwodzie; II – głośniejszy nad zastawkami aorty i pnia płucnego."}, {"q": "Jak odróżnić niemiarowość oddechową od patologicznej?", "a": "Oddechowa: przyspieszenie na wdechu, zwolnienie na wydechu; **ustępuje po wstrzymaniu oddechu**. Patologiczna (ekstrasystolie, migotanie, bloki) się nie umiarawia."}, {"q": "Podaj fizjologiczną częstość serca: do 1. mies., 2–6 lat, 11–14 lat.", "a": "Do 1. mies. **100–160**/min; 2–6 lat **90–110**/min; 11–14 lat **70–90**/min."}, {"q": "O ile przyspiesza tętno wzrost temperatury o 1°C?", "a": "O **8–10 uderzeń/min**."}, {"q": "Z jaką wadą wiąże się wzmożony I ton?", "a": "Ze **zwężeniem zastawki dwudzielnej**."}, {"q": "Co oznacza wzmożony II ton nad zastawką aortalną, a co nad płucną?", "a": "Nad aortą – **nadciśnienie tętnicze**; nad tętnicą płucną – **wzrost ciśnienia w krążeniu płucnym**."}, {"q": "Kiedy dochodzi do osłabienia obu tonów serca?", "a": "Przyczyny pozasercowe: otyłość, rozedma, płyn w lewej opłucnej. Sercowe: niewydolność krążenia, **płyn w worku osierdziowym**."}, {"q": "Opisz fizjologiczne rozdwojenie II tonu.", "a": "Bardzo częste u dzieci, **zmienne oddechowo** – słyszalne na **wdechu** w II lewym międzyżebrzu, znika na wydechu."}, {"q": "Kiedy rozdwojenie II tonu jest stałe (niezmienne oddechowo)?", "a": "W **ubytku przegrody międzyprzedsionkowej (ASD)** i zwężeniu zastawki tętnicy płucnej."}, {"q": "Kiedy występuje paradoksalne rozdwojenie II tonu (na wydechu)?", "a": "W kardiomiopatii przerostowej ze zwężeniem drogi odpływu lewej komory i w bloku lewej odnogi pęczka Hisa."}, {"q": "Jak odróżnić szmer osierdziowy od opłucnowo-osierdziowego?", "a": "Osierdziowy – w skurczu i rozkurczu, nasila się przy ucisku słuchawką, nie promieniuje. Opłucnowo-osierdziowy – zależy od oddychania (nasila się na wdechu)."}, {"q": "Jakie są cechy szmerów niewinnych?", "a": "Prawie zawsze **skurczowe**, głośność **< 3/6**, zmienne z pozycją (głośniejsze na leżąco), nasilają się po wysiłku; brak zmian anatomicznych. Najczęściej w wieku 8–12 lat."}, {"q": "Gdzie i w jakim wieku słychać szmer Stilla?", "a": "Między **koniuszkiem a punktem Erba**; typowo w wieku **3–6 lat**."}, {"q": "Opisz szmer buczenia żylnego.", "a": "Pozasercowy, **ciągły**, ze szczytem w rozkurczu, pod obojczykiem (częściej prawym); głośniejszy w siedzeniu/staniu niż na leżąco, nasila się przy skręcie głowy; 3–6 lat."}, {"q": "Szmer przepływu płucnego u noworodka – do kiedy znika?", "a": "Do **3.–6. miesiąca** życia (częstszy u wcześniaków, promieniuje na obie strony klatki)."}, {"q": "Jaki szmer daje przetrwały przewód tętniczy (Botalla)?", "a": "**Skurczowo-rozkurczowy (ciągły, „maszynowy”)**, w II lewym międzyżebrzu / pod lewym obojczykiem."}, {"q": "Jakie wady dają szmery skurczowe, a jakie rozkurczowe?", "a": "**Skurczowe**: niedomykalność zastawek AV, zwężenie zastawek półksiężycowatych, ASD, VSD. **Rozkurczowe**: zwężenie zastawek AV, niedomykalność półksiężycowatych."}, {"q": "Opisz 6-stopniową skalę Levine'a.", "a": "1/6 – bardzo cichy, po chwili osłuchiwania; 2/6 – cichy, od razu; 3/6 – średnio głośny, bez kociego mruku; 4/6 – głośny, z kocim mrukiem; 5/6 – słyszalny przez przedramię; 6/6 – słyszalny z fonendoskopem 1 cm od klatki."}, {"q": "Gdzie najlepiej słychać szmer VSD?", "a": "Nad **dolną częścią mostka po lewej stronie** (szmer skurczowy)."}, {"q": "Gdzie słychać szmer w ASD i zwężeniu zastawki płucnej?", "a": "W **II lewym międzyżebrzu** przy mostku – szmery skurczowe, mogą promieniować do pleców."}, {"q": "Gdzie słychać szmer niedomykalności zastawki aortalnej?", "a": "W **punkcie Erba** – szmer rozkurczowy."}, {"q": "Jakie cechy tętna oceniamy?", "a": "Częstość, miarowość, zgodność z akcją serca, wypełnienie, napięcie, chybkość; symetrię nad jednoimiennymi tętnicami."}, {"q": "Co oznacza słabe tętno na tętnicach udowych przy dobrym na ramiennych?", "a": "**Koarktację aorty** (także wyższe RR na prawym ramieniu)."}, {"q": "Co sugeruje wzmożone tętno udowe z tętnieniem ciemiączka u niemowlęcia?", "a": "**Drożny przewód tętniczy (Botalla)**."}, {"q": "Kiedy tętno jest chybkie, a kiedy leniwe?", "a": "**Chybkie**: niedomykalność zastawki aorty, przetrwały przewód tętniczy, nadczynność tarczycy. **Leniwe**: zwężenie zastawki aorty."}, {"q": "Czym jest deficyt tętna?", "a": "Różnica między liczbą skurczów serca nad koniuszkiem a tętnem na obwodzie (np. w ekstrasystolii)."}, {"q": "Jakie są zasady pomiaru RR u dziecka?", "a": "Wypoczęte, spokojne; siedząc, ramię na wysokości serca, 5 min odpoczynku; 30 min bez jedzenia/palenia; odpowiedni mankiet; napompować ~30 mm Hg ponad zanik tętna, wypuszczać 2–3 mm Hg/s; 3 pomiary, średnia z II i III."}, {"q": "Jak wpływa szerokość mankietu na wynik pomiaru RR?", "a": "Za wąski – wynik **fałszywie zawyżony**; za szeroki – zaniżony."}, {"q": "Która faza Korotkowa odpowiada ciśnieniu rozkurczowemu u dzieci?", "a": "U dzieci **< 12 lat – IV faza** (wyraźne ściszenie); **> 12 lat – V faza** (zanik tonów)."}, {"q": "Jak mierzy się RR u niemowląt?", "a": "Metodą **palpacyjną** Riva-Rocciego (pojawienie się fali tętna na t. promieniowej = ciśnienie skurczowe) lub oscylometrycznie; najlepiej podczas karmienia lub snu."}, {"q": "Podaj średnie RR u dziecka 0–1 r., 6–9 lat i 13–15 lat.", "a": "0–1 r. – **90/60**; 6–9 lat – **105/65**; 13–15 lat – **120/80** mm Hg."}, {"q": "Jak klasyfikujemy ciśnienie tętnicze u dzieci wg ESH?", "a": "< 90. centyla – prawidłowe; 90.–95. – wysokie prawidłowe; > 95. do 99. centyla + 5 mm Hg – **nadciśnienie I°**; > 99. centyla + 5 mm Hg – **nadciśnienie II°**."}]}, {"id": "brzuch", "num": "4.6", "title": "Badanie przedmiotowe: brzuch, narządy moczowo-płciowe, dojrzewanie", "summary": ["Brzuch bada się u dziecka leżącego na wznak w kolejności **oglądanie → osłuchiwanie → opukiwanie → obmacywanie**. Osłuchuje się przed palpacją, żeby jej nie zmieniła objawów osłuchowych. Do opisu dzieli się brzuch na **9 okolic**: liniami poziomymi przez dolne krawędzie X żeber i górne brzegi grzebieni biodrowych oraz pionowymi w połowie między linią środkową a kolcami biodrowymi. Można też podzielić go na 4 kwadranty przez pępek.", "**Oglądanie.** Oceniamy symetrię (guzy, megacolon, powiększone narządy). W przerostowym zwężeniu odźwiernika (chłopcy w wieku 3–6 tygodni) widać falę perystaltyczną od lewego podżebrza. Brzuch u niemowlęcia jest wysklepiony nieco powyżej łuków żebrowych, u starszego dziecka na ich poziomie. Brzuch wysklepiony wyżej wskazuje na obrzęk, otyłość, wzdęcie lub wodobrzusze, a zapadnięty na wyniszczenie lub odwodnienie. Ruchomość oddechowa powłok zanika w zapaleniu otrzewnej. U noworodka sprawdza się pępek i kikut pępowiny (zakażenie zagraża życiu) oraz **drożność odbytu**. Szukamy też przepuklin (uwięźnięta jest nieodprowadzalna), rozstępu mięśni prostych i poszerzonych żył (głowa meduzy przy nadciśnieniu wrotnym).", "**Osłuchiwanie.** Prawidłowo słychać perystaltykę (kruczenia, przelewania). Cisza oznacza niedrożność porażenną lub zapalenie otrzewnej. Perystaltyka wzmożona występuje w biegunce i początkowo w niedrożności mechanicznej. Szmery naczyniowe mogą pochodzić z aorty lub zwężonych tętnic nerkowych. **Opukiwanie**: prawidłowo odgłos bębenkowy, a stłumienie wskazuje na wodobrzusze, guz lub powiększony narząd. Dużą ilość płynu potwierdza **objaw chełbotania**.", "**Obmacywanie** wykonuje się ciepłymi rękami, odwracając uwagę dziecka. Niemowlę może leżeć na kolanach matki, a badanie wykorzystuje fazę wydechu. Zaczyna się od miejsca najdalszego od bólu, a gdy nie wiadomo, gdzie boli, od **lewego dołu biodrowego**, przeciwnie do ruchu wskazówek zegara. Palpacja powierzchowna ocenia napięcie (obrona mięśniowa, brzuch deskowaty), bolesność, **objaw Blumberga** i opory. Palpacja głęboka ocenia narządy. **Wątroba** u noworodka wystaje do 2 cm pod łukiem żebrowym, u rocznego dziecka do 1 cm, w 2.–3. roku życia może być wyczuwalna na łuku, a u starszych jest niewyczuwalna. Oceniamy jej brzeg, powierzchnię, spoistość, bolesność i ruchomość. Należy pamiętać o pozornej hepatomegalii (obniżenie wątroby przy rozedmie lub płynie). **Pęcherzyk żółciowy** jest niewyczuwalny, a jego bolesność ujawnia **objaw Chełmońskiego**. **Śledziona** jest prawidłowo niewyczuwalna. U niemowląt powiększa się w kierunku lewego dołu biodrowego, dlatego bada się ją od tego miejsca. Powiększają ją białaczki, ziarnica, choroba Gauchera i niedokrwistości hemolityczne.", "**Jelita**: badanie zaczyna się od esicy. Jelito cienkie jest prawidłowo niewyczuwalne, a poszerzone pętle z masami kałowymi występują w chorobie Hirschsprunga i zaparciu nawykowym. **Wyrostek robaczkowy** ocenia się po bolesności w punktach **McBurneya i Lanza** oraz objawach Jaworskiego, Rovsinga i Blumberga. **Nerki** bada się oburącz. Wyczuwalna nerka jest powiększona lub przemieszczona. **Objaw Goldflama** (bolesność przy wstrząsaniu okolicy lędźwiowej) jest dodatni w kamicy i odmiedniczkowym zapaleniu nerek. Pełny pęcherz moczowy może być wyczuwalny nad spojeniem, więc badanie powtarza się po mikcji.", "**Narządy płciowe zewnętrzne i dojrzewanie.** Ocenia się typ narządów płciowych i zgodność rozwoju z wiekiem. **Przedwczesne dojrzewanie** to cechy pokwitania przed 8. rokiem życia u dziewczynek i przed 9. u chłopców. **Opóźnione** to brak cech w wieku 14–16 lat u dziewcząt i 16–18 lat u chłopców. U chłopców sprawdza się wielkość prącia (u otyłych wykluczyć pseudomicropenis), stulejkę (fizjologiczną u noworodka), położenie ujścia cewki (spodziectwo, wierzchniactwo), mosznę i jądra (wnętrostwo, jądro wędrujące, wodniak, skręt). U dziewczynek ocenia się wargi sromowe (większe zakrywają mniejsze), śluzówkę, wydzielinę, ujście cewki i łechtaczkę. Fazy dojrzewania opisują **skala Reynoldsa–Winesa** (I–V) i **skala Tannera** (Th – piersi, G – genitalia, P – owłosienie łonowe)."], "review": [{"h": "Zasady", "items": ["Kolejność: **oglądanie → osłuchiwanie → opukiwanie → obmacywanie**", "9 okolic: linie poziome – dolne krawędzie **X żeber** i górne brzegi grzebieni biodrowych; pionowe – połowa odległości linia środkowa ↔ kolce biodrowe przednie", "Okolice: prawe podżebrze, nadbrzusze, lewe podżebrze; boczne, pępkowa; dół biodrowy prawy, nadłonowa, dół biodrowy lewy", "4 kwadranty – linia środkowa × linia przez pępek"]}, {"h": "Oglądanie", "items": ["**Przerostowe zwężenie odźwiernika**: chłopcy 3–6 tyg., fala perystaltyczna od lewego podżebrza do odźwiernika, guz „oliwka”", "Wysklepienie: niemowlę – nieco **powyżej** łuków żebrowych; poniemowlęce – na poziomie lub nieco poniżej", "Powiększony brzuch: obrzęk powłok, otyłość, wzdęcie, **wodobrzusze**; zapadnięty – wyniszczenie, odwodnienie", "Brak ruchomości oddechowej powłok – **zapalenie otrzewnej**", "Tętnienie w nadbrzuszu: aorta, prawa komora, tętniak aorty (unoszące)", "Noworodek: pępek (sączenie, zaczerwienienie, ropa = zakażenie zagrażające życiu); **drożność odbytu**", "Przepukliny: wrota, wielkość, odprowadzalność (uwięźnięta – nieodprowadzalna); rozstęp mięśni prostych", "**Głowa meduzy** – utrudniony odpływ wrotny; poszerzone żyły boczne i dolne – utrudniony odpływ żyłą główną dolną", "Okolica odbytu: szczeliny, guzki krwawnicze, wypadanie śluzówki"]}, {"h": "Osłuchiwanie i opukiwanie", "items": ["Norma: perystaltyka (kruczenia, przelewania)", "**Cisza** – niedrożność porażenna, zapalenie otrzewnej", "Wzmożona – biegunka; początek niedrożności mechanicznej (odcinek doprowadzający)", "Szmery naczyniowe – aorta, zwężenie tętnic nerkowych", "Opukiwanie: norma **bębenkowy**; stłumienie – wodobrzusze, lity guz, powiększone narządy (fizjologicznie: pełny żołądek, pełny pęcherz)", "**Objaw chełbotania** – fala płynu przy opukiwaniu, wyczuwalna drugą ręką"]}, {"h": "Obmacywanie", "items": ["Ciepłe ręce; rozmowa, oddychanie ustami, zgięte nogi; niemowlę na kolanach matki; wykorzystuj **wydech**", "Start: najdalej od bólu; gdy brak informacji – **lewy dół biodrowy**, przeciwnie do wskazówek zegara", "Powierzchowne: napięcie (**obrona mięśniowa**, brzuch deskowaty), bolesność, **objaw Blumberga** (ból przy nagłym oderwaniu ręki = objaw otrzewnowy), opory", "Głębokie: ta sama kolejność, ruchy zgodne z oddechem; jedną ręką lub oburącz"]}, {"h": "Wątroba, pęcherzyk, śledziona", "items": ["Wątroba w l. środkowo-obojczykowej: noworodek do **2 cm** pod łukiem; roczne – do **1 cm**; 2.–3. r.ż. – na łuku; starsze – niewyczuwalna", "Badanie: od prawego talerza biodrowego w górę; brzeg uderza w palce na szczycie wdechu", "Hepatomegalia: niewydolność krążenia, choroby rozrostowe i metaboliczne, WZW", "**Pozorna hepatomegalia** – obniżenie (rozedma, płyn w prawej opłucnej, zniekształcenie klatki)", "Brzeg prawidłowo obły, równy; spoistość ↑ – marskość, nowotwory, przekrwienie, glikogenozy, galaktozemia, mukopolisacharydozy", "Pęcherzyk niewyczuwalny; **objaw Chełmońskiego** – uderzenie pięścią w dłoń na prawym łuku żebrowym → ból (kamica, ropniak)", "Śledziona niewyczuwalna; niemowlę – powiększa się w kierunku **lewego dołu biodrowego**, starsze – w dół i ku pępkowi", "Badanie od lewego dołu biodrowego, palce ku lewej pasze; albo **nachwytem** (drobne powiększenie)", "Splenomegalia: **białaczki, ziarnica, choroba Gauchera, niedokrwistości hemolityczne**, zakażenia", "Trzustka – wyczuwalna tylko przy dużym powiększeniu (pozycja Grotta); ból w nadbrzuszu/lewym podżebrzu promieniujący do pleców"]}, {"h": "Jelita, wyrostek, nerki, pęcherz", "items": ["Jelita: od **esicy**, potem zstępnica, poprzecznica, wstępnica, kątnica; jelito cienkie niewyczuwalne", "Poszerzone pętle z kałem: **choroba Hirschsprunga**, zaparcie nawykowe", "**Punkt McBurneya** – ⅓ odległości od prawego kolca biodrowego przedniego górnego na linii do pępka", "**Punkt Lanza** – ⅓ odległości od prawego kolca na linii łączącej oba kolce", "**Jaworski** – ból narasta przy powolnym opuszczaniu uniesionej prawej kończyny z uciskiem okolicy wyrostka", "**Rovsing** – ucisk lewego dołu biodrowego → ból w prawym", "**Blumberg** – przy zapaleniu otrzewnej", "Nerki: palpacja oburęczna na wdechu; prawidłowo niewyczuwalne (czasem dolny biegun prawej u szczupłych)", "**Objaw Goldflama** – ból przy wstrząsaniu okolic kątów żebrowo-kręgowych: kamica, odmiedniczkowe zapalenie nerek, zapalenie okołonerkowe", "Pęcherz: pełny wyczuwalny nad spojeniem – zbadaj ponownie po mikcji"]}, {"h": "Narządy płciowe i dojrzewanie", "items": ["Przedwczesne dojrzewanie: < **8 lat** dziewczynki, < **9 lat** chłopcy", "Opóźnione: brak cech u dziewcząt w **14–16** lat, u chłopców w **16–18** lat", "Chłopcy: prącie (pseudomicropenis u otyłych), napletek (u noworodka **fizjologiczna stulejka**), **spodziectwo** (ujście po stronie brzusznej), wierzchniactwo, wyciek, moszna, jądra", "**Wnętrostwo** – jądro poza moszną; sprowadzalne do moszny = **jądro wędrujące**", "Bolesne jądro – zapalenie jądra/najądrza, **skręt powrózka**; powiększone niebolesne – wodniak, nowotwór", "Dziewczynki: wargi większe zakrywają mniejsze; śluzówka, wydzielina, ujście cewki, łechtaczka", "**Reynolds–Wines** I–V (np. dziewczęta V: brodawka wciągnięta w pierś, pełne owłosienie, miesiączka)", "**Tanner**: Th (piersi), G (genitalia), P (owłosienie łonowe), stadia I–V", "Zmiany w strukturze gruczołów piersiowych – potwierdź **USG**"]}], "cards": [{"q": "W jakiej kolejności bada się brzuch i dlaczego?", "a": "Oglądanie → **osłuchiwanie** → opukiwanie → obmacywanie. Osłuchiwanie przed palpacją, by palpacja nie zmieniła charakteru i nasilenia objawów osłuchowych."}, {"q": "Jak wyznacza się 9 okolic brzucha?", "a": "Linie poziome: przez dolne krawędzie **X żeber** i górne brzegi grzebieni biodrowych. Linie pionowe: w połowie odległości między linią środkową a kolcami biodrowymi przednimi."}, {"q": "Jak wygląda brzuch niemowlęcia z przerostowym zwężeniem odźwiernika?", "a": "Typowo chłopiec 3–6 tyg.; widoczna fala wzmożonej perystaltyki od lewego górnego kwadrantu w kierunku odźwiernika, czasem wyczuwalny guzek w kształcie **oliwki**."}, {"q": "Jak prawidłowo wysklepiony jest brzuch u niemowlęcia i u starszego dziecka?", "a": "Niemowlę – nieco **powyżej** poziomu łuków żebrowych; dziecko poniemowlęce – na poziomie łuków lub nieco poniżej."}, {"q": "Kiedy zanika ruchomość oddechowa powłok brzusznych?", "a": "W **zapaleniu otrzewnej**."}, {"q": "Na co zwracamy uwagę w okolicy pępka u noworodka?", "a": "Na pępowinę/kikut: sączenie, zaczerwienienie, wydzielinę śluzowo-ropną lub ropną – objawy zakażenia, które może **zagrażać życiu**."}, {"q": "Co oznacza „głowa meduzy”?", "a": "Poszerzone żyły powłok wokół pępka – **utrudniony odpływ w układzie żyły wrotnej** (nadciśnienie wrotne)."}, {"q": "Co trzeba sprawdzić w okolicy odbytu u noworodka?", "a": "**Drożność odbytu** – jego zarośnięcie jest wadą wrodzoną."}, {"q": "Co oznacza „cisza” przy osłuchiwaniu brzucha?", "a": "Brak perystaltyki – **niedrożność porażenna**, zapalenie otrzewnej."}, {"q": "Jak zmienia się perystaltyka w niedrożności mechanicznej?", "a": "Początkowo jest **wzmożona** w doprowadzającym odcinku pętli jelitowej."}, {"q": "Jaki jest prawidłowy odgłos opukowy nad brzuchem i co oznacza stłumienie?", "a": "Prawidłowo **bębenkowy**. Stłumienie – wodobrzusze, duży lity guz, powiększone narządy miąższowe (fizjologicznie: pełny żołądek, pełny pęcherz)."}, {"q": "Czym jest objaw chełbotania?", "a": "Przy dużej ilości płynu w jamie brzusznej opukiwanie jednej strony brzucha wywołuje falę płynu wyczuwalną ręką położoną po drugiej stronie."}, {"q": "Jak zmniejszyć napięcie powłok brzusznych u dziecka podczas badania?", "a": "Ciepłe ręce, rozmowa odwracająca uwagę, oddychanie przez otwarte usta, zgięte nogi; niemowlę na kolanach matki; ucisk w **fazie wydechu** (także u płaczącego dziecka)."}, {"q": "Od którego miejsca zaczynamy palpację brzucha?", "a": "Od okolicy **najodleglejszej od bólu**; jeśli nie wiemy, gdzie boli – od **lewego dołu biodrowego**, przeciwnie do ruchu wskazówek zegara."}, {"q": "Na czym polega objaw Blumberga?", "a": "Ból wyraźnie nasila się przy **nagłym oderwaniu ręki** od powłok po ucisku – dodatni objaw otrzewnowy."}, {"q": "Czym jest brzuch deskowaty?", "a": "Skrajnie wzmożone napięcie powłok (obrona mięśniowa) – objaw **ostrego zapalenia otrzewnej**."}, {"q": "Ile wystaje wątroba spod łuku żebrowego u noworodka, rocznego dziecka i starszego dziecka?", "a": "Noworodek – do **2 cm**; roczne – do **1 cm**; 2.–3. r.ż. – na granicy łuku; starsze – schowana pod łukiem (niewyczuwalna)."}, {"q": "Czym jest pozorna hepatomegalia?", "a": "Wyczuwalna wątroba z powodu jej **obniżenia**, nie powiększenia – np. rozedma, płyn w prawej opłucnej, zniekształcenie klatki."}, {"q": "Kiedy wzrasta spoistość wątroby?", "a": "W marskości, chorobach nowotworowych, przekrwieniu biernym, chorobach spichrzeniowych (glikogenozy, galaktozemia, mukopolisacharydozy)."}, {"q": "Na czym polega objaw Chełmońskiego?", "a": "Uderzenie pięścią w lewą rękę ułożoną wzdłuż **prawego łuku żebrowego** wywołuje ból – choroby pęcherzyka (kamica, ropniak) i wątroby."}, {"q": "W którym kierunku powiększa się śledziona u niemowlęcia i u starszego dziecka?", "a": "Niemowlę – w kierunku **lewego dołu biodrowego**; starsze dziecko – ku dołowi i w kierunku pępka. Dlatego badanie zaczyna się od lewego dołu biodrowego."}, {"q": "W jakich chorobach powiększa się śledziona?", "a": "**Białaczki**, ziarnica złośliwa, choroba Gauchera, niedokrwistości hemolityczne, niektóre choroby zakaźne."}, {"q": "Na czym polega badanie śledziony nachwytem?", "a": "Stojąc po lewej stronie, kładziemy dłoń na dolnej części klatki i zaginamy palce pod lewy łuk żebrowy; brzeg wyczuwamy przy głębokim wdechu – dobre do wykrycia niewielkiego powiększenia."}, {"q": "Gdzie leży punkt McBurneya?", "a": "W **⅓ odległości od prawego kolca biodrowego przedniego górnego**, na linii łączącej go z pępkiem."}, {"q": "Gdzie leży punkt Lanza?", "a": "W **⅓ odległości od prawego kolca biodrowego**, na linii łączącej oba kolce biodrowe przednie górne."}, {"q": "Na czym polega objaw Jaworskiego?", "a": "Zginamy prawą kończynę dolną w biodrze, uciskając okolicę wyrostka, potem dziecko powoli ją opuszcza – przy zapaleniu wyrostka **ból narasta w miarę opuszczania**."}, {"q": "Na czym polega objaw Rovsinga?", "a": "Ucisk w **lewym** dole biodrowym wywołuje ból odczuwany w **prawym** dole biodrowym."}, {"q": "W jakich chorobach wyczuwalne są poszerzone pętle jelita grubego wypełnione masami kałowymi?", "a": "W **chorobie Hirschsprunga** i zaparciu nawykowym."}, {"q": "Jak bada się nerki i kiedy są wyczuwalne?", "a": "Oburęcznie (jedna ręka na brzuchu bocznie od m. prostego, druga od tyłu w okolicy lędźwiowej), zbliżając dłonie na wdechu. Prawidłowo niewyczuwalne; wyczuwalna – powiększona lub przemieszczona (u szczupłych czasem dolny biegun prawej)."}, {"q": "Na czym polega objaw Goldflama i kiedy jest dodatni?", "a": "Ból przy wstrząsaniu okolic kątów żebrowo-kręgowych – kamica nerkowa, **odmiedniczkowe zapalenie nerek**, zapalenie okołonerkowe (ból z kręgosłupa/mięśni to nie Goldflam)."}, {"q": "Co zrobić, gdy nad spojeniem wyczuwamy gładki, obły opór?", "a": "To może być pełny pęcherz moczowy – **powtórzyć badanie po mikcji**."}, {"q": "Kiedy rozpoznajemy przedwczesne dojrzewanie płciowe?", "a": "Gdy cechy pokwitania pojawiają się **przed 8. r.ż. u dziewczynek** i **przed 9. r.ż. u chłopców**."}, {"q": "Kiedy rozpoznajemy opóźnione dojrzewanie płciowe?", "a": "Brak cech dojrzewania u dziewcząt w wieku **14–16 lat**, u chłopców w wieku **16–18 lat**."}, {"q": "Czym jest spodziectwo, a czym wierzchniactwo?", "a": "**Spodziectwo** – ujście cewki moczowej po **brzusznej** stronie prącia. **Wierzchniactwo** – rozszczepienie **grzbietowej** części prącia."}, {"q": "Jak odróżnić wnętrostwo od jądra wędrującego?", "a": "Gdy jądra brak w mosznie, sprawdzamy kanał pachwinowy – jeśli jądro **da się sprowadzić do moszny**, to jądro wędrujące; jeśli nie – wnętrostwo."}, {"q": "Jakie są przyczyny bolesności jądra?", "a": "Zapalenie jądra i najądrza, **skręt powrózka nasiennego**."}, {"q": "Co oceniamy u dziewczynki w badaniu zewnętrznych narządów płciowych?", "a": "Rozwój warg sromowych (większe zakrywają mniejsze), śluzówkę sromu, wydzielinę w przedsionku pochwy, ujście cewki, wielkość łechtaczki."}, {"q": "Co opisują symbole Th, G i P w skali Tannera?", "a": "**Th** – rozwój piersi (thelarche); **G** – narządy płciowe chłopców (genitalia); **P** – owłosienie łonowe (pubarche); każde w stadiach I–V."}, {"q": "Opisz fazę V wg Reynoldsa–Winesa u dziewcząt.", "a": "Brodawka wciągnięta w pierś, typowe owłosienie płciowe, pełne owłosienie pod pachami, **miesiączka**."}]}, {"id": "neuro", "num": "4.7", "title": "Badanie neurologiczne dzieci w wieku przedszkolnym i szkolnym", "summary": ["Większość dzieci po **18.–24. miesiącu** można badać według klasycznego schematu neurologicznego, ale pełnej współpracy można oczekiwać dopiero od około **5. roku życia**. Schemat obejmuje: 1) stan świadomości, 2) objawy oponowe, 3) napięcie i siłę mięśniową, 4) nerwy czaszkowe, 5) odruchy fizjologiczne, 6) odruchy patologiczne, 7) równowagę, zborność i ruchy precyzyjne, 8) czucie.", "**Objawy oponowe** świadczą o podrażnieniu lub zapaleniu opon albo o krwotoku podpajęczynówkowym. Towarzyszą im ból głowy, wymioty, światłowstręt i przeczulica. Badamy: **sztywność karku** (mierzoną liczbą palców między brodą a mostkiem), **objaw Brudzińskiego karkowy** (zgięcie nóg przy przyginaniu głowy) i **łonowy**, **objaw Kerniga** (opór przy prostowaniu kolana po zgięciu biodra do 90°), **objaw Amosa** („trójnóg”) i **objaw Brdlika** („całowanie kolan”). **Objaw Lasègue'a** nie jest objawem oponowym, tylko korzeniowym (nerw kulszowy).", "**Napięcie mięśniowe** bada się ruchami biernymi. Hipotonia oznacza wiotkość. Hipertonia jest albo **spastyczna** (piramidowa, „scyzorykowa”: duży opór na początku ruchu, który nagle ustępuje), albo w postaci **sztywności** (pozapiramidowa, „ołowiana rura”, z drżeniem jako „koło zębate”). **Siłę** ocenia się wobec oporu ręki badającego, a niewielki niedowład wykrywają próby z wyciągniętymi rękami (opadanie lub opóźnianie się kończyny). W miastenii siła słabnie przy powtarzaniu ruchu.", "**Nerwy czaszkowe.** Węch (I) bada się znanymi zapachami, bez amoniaku, który drażni nerw V. Wzrok (II) obejmuje ostrość (tablice Snellena z ręką lub literą E u przedszkolaków), pole widzenia metodą konfrontacyjną (od około 4 lat) i dno oka. Nerwy III, IV i VI odpowiadają za ruchy gałek, przy czym IV unerwia mięsień skośny górny, VI prosty boczny, a III pozostałe mięśnie, dźwigacz powieki i źrenicę. Nerw V ma trzy gałęzie czuciowe (punkty wyjścia: nadoczodołowy, podoczodołowy, bródkowy) i część ruchową (żwacze, skrzydłowe, odruch żuchwowy). Nerw VII: w porażeniu **ośrodkowym** objęta jest tylko dolna część twarzy, a w **obwodowym** cała połowa twarzy (z czołem i objawem Bella). **Objaw Chwostka** występuje w tężyczce. Nerw VIII bada się mową głośną z 6 m i szeptem z 3 m. Nerwy IX/X: łuk podniebienny po stronie porażenia jest niżej, języczek zbacza w stronę zdrową, występuje objaw firankowy, krztuszenie się i chrypka. Nerw XI unerwia mięsień mostkowo-obojczykowo-sutkowy i czworoboczny. Przy porażeniu nerwu XII język zbacza **w stronę uszkodzenia** i zanika.", "**Odruchy fizjologiczne** dzielą się na powierzchniowe (brzuszne Th8–Th12, podeszwowy pojawiający się pod koniec 2. roku życia, nosidłowy L1–L2) i głębokie, czyli rozciągowe (z mięśnia dwugłowego C5–C6, trójgłowego C6–C7, ramienno-promieniowego C5–C6, kolanowy L2–L4, skokowy S1–S2). Ich badanie ułatwia **manewr Jendrassika**. Odruchy głębokie są wzmożone przy uszkodzeniu ośrodkowego neuronu ruchowego, a osłabione przy uszkodzeniu obwodowego i w miopatiach. **Odruchy patologiczne** (Babińskiego, Rossolimo, Oppenheima, stopotrząs) wraz ze spastycznością i hiperrefleksją wskazują na uszkodzenie drogi piramidowej. **Odruch Babińskiego** jest fizjologiczny do 2. roku życia.", "**Równowaga i zborność.** Chód badamy po linii z oczami otwartymi i zamkniętymi. Przy uszkodzeniu **móżdżku** zaburzenia są podobne przy oczach otwartych i zamkniętych, a przy uszkodzeniu **sznurów tylnych** nasilają się po zamknięciu oczu (dotyczy to też **próby Romberga**). Stosuje się próby palec–nos, palec–palec i pięta–kolano. Ich zaburzenia to dysmetria i **drżenie zamiarowe**. **Diadochokineza** to szybkie naprzemienne ruchy, a ich zaburzenie wskazuje na móżdżek. U dzieci do około 5. roku życia precyzja ruchów jest fizjologicznie mniejsza. Najczęstszą przyczyną ataksji u dzieci jest uszkodzenie móżdżku, w tym ostra ataksja móżdżkowa. **Czucie** powierzchniowe (dotyk, ból, temperatura, dermoleksja) i głębokie (ułożenie i ruch bierny) bada się przy zamkniętych oczach, symetrycznie, od dystalnych części kończyn."], "review": [{"h": "Schemat badania", "items": ["Klasyczny schemat od ok. **18.–24. mies.**; pełna współpraca od ok. **5 lat**", "1 świadomość → 2 objawy oponowe → 3 napięcie i siła → 4 nerwy czaszkowe → 5 odruchy fizjologiczne → 6 patologiczne → 7 równowaga i zborność → 8 czucie", "Świadomość: ilościowe (przymglenie → senność → przedśpiączka → śpiączka) i jakościowe (majaczenie, pomroczność, splątanie – trudne u małych dzieci)"]}, {"h": "Objawy oponowe", "items": ["Przyczyny: podrażnienie/zapalenie opon, **krwotok podpajęczynówkowy**; + ból głowy, wymioty, światłowstręt, przec
