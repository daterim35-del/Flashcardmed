, probiotyki; podstawa: **doustne płyny nawadniające (ORS)**", "NChZJ: **mesalazyna**, sulfasalazyna, **budezonid** (efekt pierwszego przejścia – mało działań ogólnych), azatiopryna, metotreksat, anty-TNF, wedolizumab, ustekinumab, inhibitory JAK"]}, {"h": "Wątroba, drogi żółciowe, trzustka, robaki", "items": ["**Kwas ursodeoksycholowy (UDCA)** – **PBC**, cholestaza ciężarnych, rozpuszczanie drobnych złogów cholesterolowych (pęcherzyk czynny)", "Sylimaryna, fosfolipidy „hepatoprotekcyjne” – słabe dowody", "Cholerytyki (↑ produkcji żółci) vs cholekinetyki (↑ opróżniania pęcherzyka – siarczan magnezu, oleje)", "**Enzymy trzustkowe (pankreatyna)** – z posiłkiem; niewydolność zewnątrzwydzielnicza, **mukowiscydoza**; duże dawki – kolonopatia włókniejąca", "**Mebendazol, albendazol** – wiążą **β-tubulinę** robaków: owsiki, glista, włosogłówka, tęgoryjec; albendazol – bąblowica, wągrzyca; teratogenne", "**Pyrantel** – agonista nikotynowy → porażenie spastyczne (owsiki, glista)", "**Prazykwantel** – ↑ przepuszczalności dla **Ca²⁺** → skurcz: **tasiemce, przywry** (schistosomatoza), wągrzyca", "**Iwermektyna** – kanały Cl⁻ bramkowane glutaminianem: **świerzb**, węgorek, onchocerkoza", "Owsica: leczyć **wszystkich domowników**, powtórzyć dawkę po **2 tygodniach**, higiena"]}], "cards": [{"q": "Jaki jest mechanizm działania inhibitorów pompy protonowej?", "a": "Proleki aktywowane w kwaśnym środowisku kanalików komórki okładzinowej → **nieodwracalnie wiążą H⁺/K⁺-ATPazę** (pompę protonową) – ostatni etap wydzielania HCl."}, {"q": "Kiedy przyjmować IPP i dlaczego?", "a": "**30–60 minut przed posiłkiem** (zwykle śniadaniem) – działają tylko na **aktywne pompy**, które są pobudzane przez posiłek."}, {"q": "Jakie są skutki długotrwałego stosowania IPP?", "a": "Niedobór **witaminy B12**, **hipomagnezemia**, ↓ wchłaniania żelaza, ↑ ryzyka **złamań**, zakażenie **C. difficile**, zapalenia płuc, śródmiąższowe zapalenie nerek, polipy dna żołądka, nadkwaśność z odbicia po odstawieniu."}, {"q": "Który IPP wybrać u chorego na klopidogrelu?", "a": "**Pantoprazol** – słabo hamuje CYP2C19; omeprazol i esomeprazol osłabiają aktywację klopidogrelu."}, {"q": "Czym wyróżnia się cymetydyna wśród H2-blokerów?", "a": "Jest **inhibitorem cytochromu P450** (liczne interakcje) i działa **antyandrogennie** (ginekomastia, impotencja)."}, {"q": "Dlaczego ranitydynę wycofano z obrotu?", "a": "Z powodu zanieczyszczenia **N-nitrozodimetyloaminą (NDMA)** – prawdopodobnym kancerogenem."}, {"q": "Jakie działania niepożądane mają leki zobojętniające zawierające glin i magnez?", "a": "**Glin** – zaparcia, hipofosfatemia; **magnez** – biegunka, hipermagnezemia w niewydolności nerek. Dlatego często się je łączy."}, {"q": "Wchłanianie jakich leków zmniejszają leki zobojętniające?", "a": "**Tetracyklin, fluorochinolonów** (chelaty), **żelaza, lewotyroksyny**, digoksyny, bisfosfonianów – potrzebny odstęp ok. 2 h."}, {"q": "Jak działa sukralfat?", "a": "W kwaśnym środowisku **polimeryzuje** i tworzy lepką warstwę ochronną wiążącą się z dnem owrzodzenia; działanie niepożądane: zaparcia, ↓ wchłaniania innych leków."}, {"q": "Jaki jest mechanizm działania i główne przeciwwskazanie mizoprostolu?", "a": "Analog **prostaglandyny E1** – ↓ wydzielania kwasu, ↑ śluzu i wodorowęglanów (ochrona przed NLPZ). Przeciwwskazany w **ciąży** (działanie poronne – skurcze macicy)."}, {"q": "Jak wygląda terapia I linii eradykacji H. pylori w Polsce?", "a": "**Terapia poczwórna z bizmutem**: IPP + bizmut + **tetracyklina** + **metronidazol** przez **14 dni** (alternatywnie poczwórna bez bizmutu: IPP + amoksycylina + klarytromycyna + metronidazol)."}, {"q": "Dlaczego w Polsce nie zaleca się klasycznej terapii trójlekowej z klarytromycyną?", "a": "Ze względu na **wysoką oporność H. pylori na klarytromycynę** (> 15%)."}, {"q": "Kiedy można sprawdzić skuteczność eradykacji H. pylori?", "a": "Testem oddechowym lub antygenem w kale co najmniej **4 tygodnie po antybiotykach** i **2 tygodnie po odstawieniu IPP**."}, {"q": "Jaki jest mechanizm działania ondansetronu i jego działania niepożądane?", "a": "Antagonista **5-HT3** (obwodowo – nerw błędny, ośrodkowo – CTZ). Działania: **zaparcia**, ból głowy, **wydłużenie QT**."}, {"q": "Jakie leki stosuje się w zapobieganiu wymiotom po wysoko emetogennej chemioterapii?", "a": "**Antagonista 5-HT3 + antagonista NK1 (aprepitant) + deksametazon** (± olanzapina)."}, {"q": "Jakie są maksymalne dawki i czas stosowania metoklopramidu wg EMA (2013)?", "a": "Do **0,5 mg/kg/dobę** (dorośli zwykle 10 mg do 3× na dobę, max 30 mg/d), maksymalnie przez **5 dni**."}, {"q": "Dlaczego EMA ograniczyła stosowanie metoklopramidu?", "a": "Z powodu ryzyka **działań neurologicznych**: ostrych objawów pozapiramidowych (częściej u dzieci) i **późnych dyskinez** (seniorzy, długotrwałe leczenie, duże dawki); usunięto wskazania przewlekłe (gastropareza, dyspepsja, GERD)."}, {"q": "Jakie są zasady stosowania metoklopramidu u dzieci?", "a": "**Przeciwwskazany < 1. roku życia**; u starszych dzieci tylko jako lek **drugiego rzutu** (zapobieganie opóźnionym wymiotom po chemioterapii, leczenie wymiotów pooperacyjnych), 0,1–0,15 mg/kg do 3× dziennie."}, {"q": "Czym różni się domperidon od metoklopramidu?", "a": "Domperidon **nie przenika przez barierę krew–mózg** → nie wywołuje objawów pozapiramidowych (lek przeciwwymiotny w chorobie Parkinsona), ale **wydłuża QT** (arytmie, nagły zgon)."}, {"q": "Jakie ograniczenia stosowania domperidonu wprowadziła EMA w 2014 r.?", "a": "Tylko **nudności i wymioty**; **10 mg do 3× dziennie**, zwykle **≤ 1 tydzień**. Przeciwwskazany: zaburzenia przewodzenia/niewydolność serca, leki wydłużające QT, **silne inhibitory CYP3A4**, umiarkowana/ciężka niewydolność wątroby."}, {"q": "Jak działa prukalopryd?", "a": "Wybiórczy agonista **5-HT4** – pobudza perystaltykę jelita grubego; przewlekłe zaparcia."}, {"q": "Jak laktuloza działa w encefalopatii wątrobowej?", "a": "Rozkładana przez bakterie do kwasów → **zakwasza treść jelita** → NH₃ przechodzi w niewchłanialny NH₄⁺; działa też przeczyszczająco (↓ czasu pasażu, ↓ bakterii produkujących amoniak)."}, {"q": "Czym grozi przewlekłe stosowanie antrachinonów (senes)?", "a": "**Melanozą okrężnicy** (ciemne przebarwienie błony śluzowej), zaburzeniami elektrolitowymi (hipokaliemia), „jelitem leniwym”."}, {"q": "Jakie są wady parafiny płynnej jako środka przeczyszczającego?", "a": "Ryzyko **zachłystowego (lipidowego) zapalenia płuc**, ↓ wchłaniania witamin rozpuszczalnych w tłuszczach (A, D, E, K), wyciek z odbytu."}, {"q": "Kiedy loperamid jest przeciwwskazany?", "a": "W **biegunce krwawej z gorączką** (czerwonka – ryzyko megacolon toxicum), **rzekomobłoniastym zapaleniu jelit (C. difficile)**, zaostrzeniu WZJG, u małych dzieci (< 2 lat)."}, {"q": "Co jest podstawą leczenia ostrej biegunki?", "a": "**Nawadnianie** – doustne płyny nawadniające (ORS); leki objawowe (loperamid, racekadotryl, diosmektyt) są uzupełnieniem."}, {"q": "Jakie leki stosuje się w nieswoistych zapaleniach jelit?", "a": "**Mesalazyna (5-ASA)**, sulfasalazyna, GKS (**budezonid**, prednizon), tiopuryny (azatiopryna), metotreksat, leki biologiczne (**infliksymab, adalimumab**, wedolizumab, ustekinumab), inhibitory JAK."}, {"q": "Do czego stosuje się kwas ursodeoksycholowy?", "a": "**Pierwotne zapalenie dróg żółciowych (PBC)**, cholestaza wewnątrzwątrobowa ciężarnych, rozpuszczanie małych złogów cholesterolowych w czynnym pęcherzyku."}, {"q": "Jak przyjmuje się enzymy trzustkowe i jakie jest ryzyko dużych dawek?", "a": "Z **każdym posiłkiem** (niewydolność zewnątrzwydzielnicza trzustki, mukowiscydoza). Bardzo duże dawki – **kolonopatia włókniejąca**."}, {"q": "Jaki jest mechanizm działania mebendazolu i albendazolu?", "a": "Wiążą **β-tubulinę** robaków → hamowanie polimeryzacji mikrotubul i wychwytu glukozy. Albendazol – też bąblowica, wągrzyca."}, {"q": "Jakie leki stosuje się w zakażeniu tasiemcem i przywrami?", "a": "**Prazykwantel** (↑ przepuszczalności błon dla Ca²⁺ → skurcz i porażenie robaka); niklozamid (tasiemce)."}, {"q": "Jakie są zasady leczenia owsicy?", "a": "Mebendazol, albendazol lub pyrantel; leczyć **wszystkich domowników**, **powtórzyć dawkę po 2 tygodniach**, przestrzegać higieny."}, {"q": "Do czego stosuje się iwermektynę?", "a": "**Świerzb**, węgorczyca, onchocerkoza (aktywuje kanały chlorkowe bramkowane glutaminianem u bezkręgowców)."}], "sources": [{"t": "EMA – Metoclopramide-containing medicines, referral (2013)", "u": "https://www.ema.europa.eu/de/medicines/human/referrals/metoclopramide-containing-medicines"}, {"t": "EMA/CMDh – Restricting use of domperidone-containing medicines (komunikat, 2014)", "u": "https://ema.europa.eu/en/documents/press-release/cmdh-confirms-recommendations-restricting-use-domperidone-containing-medicines_en.pdf"}]}, {"id": "f-oddechowy", "num": "F17", "title": "Leki stosowane w chorobach układu oddechowego", "summary": ["**Leki rozszerzające oskrzela.** **β2-mimetyki**: krótko działające (SABA: salbutamol, fenoterol) i długo działające (LABA: formoterol, salmeterol, a z 24-godzinnych indakaterol, olodaterol i wilanterol). **Cholinolityki wziewne**: SAMA (ipratropium) i LAMA (tiotropium, glikopironium, umeklidynium, aklidynium). Cholinolityki są szczególnie skuteczne w **POChP**. Ich działania niepożądane to suchość w ustach, zatrzymanie moczu i ryzyko jaskry z wąskim kątem przy kontakcie z okiem. **Metyloksantyny** (teofilina, aminofilina) hamują fosfodiesterazy i receptory adenozynowe. Mają **wąski indeks terapeutyczny** (stężenie 5–15 mg/l) i kinetykę zależną od CYP1A2. Stężenie teofiliny podnoszą cyprofloksacyna, fluwoksamina, erytromycyna i cymetydyna, a obniżają palenie tytoniu i ryfampicyna. Toksyczność objawia się nudnościami, tachyarytmią, drgawkami i hipokaliemią.", "**Leczenie astmy (GINA)**: podstawą są **glikokortykosteroidy wziewne (wGKS)**: budezonid, flutikazon, beklometazon, cyklezonid, mometazon. Działają przeciwzapalnie. Miejscowo wywołują **kandydozę jamy ustnej** (dlatego po inhalacji płucze się usta) i chrypkę, a w dużych dawkach działają ogólnie. **Od 2019 r. GINA nie zaleca leczenia samym SABA**, bo nie chroni ono przed ciężkimi zaostrzeniami, a częste jego używanie zwiększa ryzyko zaostrzeń. Preferowana **ścieżka 1** to **mała dawka budezonidu z formoterolem stosowana doraźnie** (stopnie 1–2), a od stopnia 3 jako leczenie podtrzymujące i doraźne (**MART**). W ścieżce 2 lekiem doraźnym jest SABA, zawsze z wGKS. W stopniu 5 dodaje się LAMA i kieruje chorego do oceny fenotypu i **leczenia biologicznego**: anty-IgE (**omalizumab**), anty-IL-5 lub anty-IL-5R (mepolizumab, reslizumab, benralizumab), anty-IL-4Rα (**dupilumab**) i anty-TSLP (tezepelumab). Doustne GKS stosuje się tylko krótko w zaostrzeniach, bo już kilka kursów w życiu zwiększa ryzyko osteoporozy, cukrzycy i zaćmy. **LABA nigdy nie stosuje się w astmie bez wGKS**.", "**Leki przeciwleukotrienowe**: **montelukast** (antagonista receptora CysLT1). Stosuje się go w astmie (zwłaszcza z alergicznym nieżytem nosa i astmie wysiłkowej) oraz w astmie aspirynowej. Według EMA (2019) może wywoływać **zdarzenia neuropsychiatryczne** u dorosłych, młodzieży i dzieci: zmiany zachowania i nastroju, koszmary senne, depresję, myśli samobójcze, a bardzo rzadko jąkanie się. Zileuton hamuje 5-lipooksygenazę. **Kromony** (kromoglikan, nedokromil) stabilizują komórki tuczne i działają tylko profilaktycznie. Mają dziś niewielkie znaczenie. **Leki przeciwhistaminowe**: I generacji (klemastyna, difenhydramina, hydroksyzyna, prometazyna; przenikają do OUN, działają uspokajająco i cholinolitycznie) oraz II generacji (cetyryzyna, lewocetyryzyna, loratadyna, desloratadyna, feksofenadyna, bilastyna, rupatadyna; mało sedatywne). Stosuje się je w alergicznym nieżycie nosa i pokrzywce. Terfenadyna i astemizol zostały wycofane z powodu torsade de pointes.", "**POChP (GOLD)**: podstawą są leki rozszerzające oskrzela o przedłużonym działaniu: **LAMA**, **LABA** i ich połączenie (LAMA + LABA). **wGKS** dodaje się przy częstych zaostrzeniach i eozynofilii we krwi (≥ 300/µl). U osób z POChP zwiększają ryzyko **zapalenia płuc**. **Roflumilast** (inhibitor PDE4) stosuje się w zapaleniu oskrzeli z częstymi zaostrzeniami. Wywołuje biegunkę i spadek masy ciała. W zaostrzeniach POChP podaje się SABA ± SAMA, GKS ogólnie (5 dni), antybiotyk przy ropnej plwocinie i tlen pod kontrolą (cel SpO₂ 88–92%). **Mukolityki i leki wykrztuśne**: **N-acetylocysteina** (rozrywa mostki disiarczkowe mucyny), karbocysteina, **ambroksol i bromheksyna** (sekretolityki), erdosteina, gwajafenezyna oraz roztwory hipertoniczne i dornaza alfa (rozkłada DNA neutrofili w mukowiscydozie). Leków przeciwkaszlowych i mukolitycznych nie łączy się, bo blokada odruchu kaszlu przy upłynnionej wydzielinie sprzyja zaleganiu.", "**Leki przeciwkaszlowe** stosuje się tylko w **suchym, męczącym kaszlu**. Działające ośrodkowo to kodeina i dihydrokodeina (opioidy, przeciwwskazane u dzieci < 12 lat i w okresie karmienia piersią), **dekstrometorfan** (antagonista NMDA, który w dużych dawkach działa dysocjacyjnie i z SSRI grozi zespołem serotoninowym), butamirat i pentoksyweryna. Obwodowo działa lewodropropizyna. **Zaostrzenie astmy**: SABA wielokrotnie (inhalator z komorą lub nebulizacja) z ipratropium, **GKS ogólnie** (prednizon 40–50 mg przez 5–7 dni), tlen do SpO₂ 93–95% i **siarczan magnezu dożylnie** w ciężkim zaostrzeniu. Adrenalinę podaje się tylko przy anafilaksji. Pozostałe tematy: **leczenie uzależnienia od nikotyny** (terapia zastępcza nikotyną, **cytyzyna**, wareniklina, bupropion), a w mukowiscydozie modulatory CFTR (iwakaftor, eleksakaftor, tezakaftor)."], "review": [{"h": "Leki rozszerzające oskrzela", "items": ["**SABA**: salbutamol, fenoterol, terbutalina – doraźnie, działanie 4–6 h", "**LABA**: formoterol (szybki początek), salmeterol (wolny); 24 h: indakaterol, olodaterol, wilanterol", "**SAMA**: ipratropium; **LAMA**: **tiotropium**, glikopironium, umeklidynium, aklidynium – blokują M3 w oskrzelach", "Cholinolityki wziewne – suchość w ustach, zatrzymanie moczu, **jaskra z wąskim kątem** (kontakt z okiem, nebulizacja)", "**Teofilina** – nieselektywny inhibitor PDE (↑ cAMP) + antagonista adenozyny; **stężenie 5–15 mg/l** (wąski indeks)", "Teofilina: CYP1A2 – **↑ stężenia**: cyprofloksacyna, **fluwoksamina**, erytromycyna/klarytromycyna, cymetydyna, niewydolność serca/wątroby; **↓**: **palenie**, ryfampicyna, karbamazepina", "Toksyczność teofiliny: nudności, wymioty, tachykardia, **arytmie**, **drgawki**, hipokaliemia, hiperglikemia; aminofilina i.v. – wolno"]}, {"h": "Astma (GINA 2025)", "items": ["Podstawa: **wziewne GKS** (budezonid, flutikazon, beklometazon, cyklezonid, mometazon)", "wGKS miejscowo: **kandydoza jamy ustnej**, chrypka → **płukanie ust** po inhalacji, komora inhalacyjna; duże dawki: ↓ wzrastania u dzieci, osteoporoza, zaćma, siniaki", "**SABA bez wGKS – nie zalecane** (od 2019): nie chroni przed ciężkimi zaostrzeniami, częste użycie ↑ ryzyka zaostrzeń", "**Ścieżka 1 (preferowana)**: doraźnie **mała dawka budezonid + formoterol** (st. 1–2) → **MART** (st. 3–4) → st. 5: + LAMA, ocena fenotypu, leki biologiczne", "**Ścieżka 2**: doraźnie SABA (z wGKS przy każdym użyciu) → codziennie wGKS → wGKS + LABA → średnia dawka → + LAMA", "**LABA nigdy w monoterapii** w astmie", "Biologiczne: **omalizumab** (anty-IgE), **mepolizumab, reslizumab** (anty-IL-5), **benralizumab** (anty-IL-5R), **dupilumab** (anty-IL-4Rα), **tezepelumab** (anty-TSLP)", "Doustne GKS – już 4–5 kursów w życiu ↑ ryzyka osteoporozy, cukrzycy, zaćmy, niewydolności serca"]}, {"h": "Montelukast, kromony, przeciwhistaminowe", "items": ["**Montelukast** – antagonista receptora **CysLT1**; astma (z ANN, wysiłkowa, aspirynowa), ANN; 1×/d wieczorem", "EMA 2019: **zdarzenia neuropsychiatryczne** (dorośli, młodzież, dzieci) – zmiany zachowania i nastroju, koszmary, depresja, myśli samobójcze; bardzo rzadko **jąkanie**", "Zafirlukast; **zileuton** – inhibitor 5-lipooksygenazy (hepatotoksyczny)", "**Kromony** (kromoglikan, nedokromil) – stabilizacja komórek tucznych; tylko profilaktycznie", "Przeciwhistaminowe **I gen.** (klemastyna, difenhydramina, hydroksyzyna, prometazyna, dimenhydrynat): sedacja, działanie **cholinolityczne**, ↓ sprawności (kierowcy)", "**II gen.** (cetyryzyna, lewocetyryzyna, loratadyna, desloratadyna, feksofenadyna, bilastyna, rupatadyna): mało sedacji; ANN, pokrzywka", "Terfenadyna, astemizol – wycofane (**torsade de pointes** z inhibitorami CYP3A4)"]}, {"h": "POChP", "items": ["Podstawa: **LAMA** i/lub **LABA** (często LAMA + LABA)", "**wGKS** – przy częstych zaostrzeniach i **eozynofilii ≥ 300/µl**; ↑ ryzyka **zapalenia płuc** w POChP", "**Roflumilast** – inhibitor **PDE4**; przewlekłe zapalenie oskrzeli z częstymi zaostrzeniami, FEV1 < 50%; biegunka, ↓ masy ciała, bezsenność, depresja", "Azytromycyna przewlekle – ↓ zaostrzeń (ryzyko QT, oporność)", "Zaostrzenie: SABA ± SAMA, **GKS ogólnie 5 dni**, antybiotyk (ropna plwocina), **tlen do SpO₂ 88–92%** (ryzyko hiperkapnii)", "Szczepienia: grypa, pneumokoki, COVID-19, RSV, krztusiec"]}, {"h": "Mukolityki, wykrztuśne, przeciwkaszlowe", "items": ["**N-acetylocysteina** – rozrywa mostki **disiarczkowe** mukoprotein; też odtrutka w zatruciu paracetamolem", "Karbocysteina, erdosteina; **ambroksol, bromheksyna** (sekretolityki – ↑ surfaktantu i rzadkiej wydzieliny)", "Gwajafenezyna, preparaty roślinne (wykrztuśne odruchowe); sól hipertoniczna; **dornaza alfa** (mukowiscydoza – rozkład DNA)", "**Nie łączyć mukolityków z lekami przeciwkaszlowymi** (zaleganie wydzieliny)", "Przeciwkaszlowe – tylko **suchy, męczący kaszel**: **kodeina, dihydrokodeina** (przeciwwskazane < 12 lat, karmienie piersią), **dekstrometorfan** (antagonista NMDA; nadużywanie, zespół serotoninowy z SSRI/MAOI), butamirat, pentoksyweryna, lewodropropizyna (obwodowo)"]}, {"h": "Zaostrzenie astmy i inne", "items": ["**SABA** wielokrotnie (MDI z komorą / nebulizacja) + **ipratropium** (ciężkie)", "**GKS ogólnie**: prednizon 40–50 mg 5–7 dni (dzieci 1–2 mg/kg)", "Tlen – SpO₂ **93–95%** (dzieci 94–98%)", "**Siarczan magnezu i.v.** – ciężkie zaostrzenie bez odpowiedzi na leczenie wstępne", "Nie stosuje się rutynowo: aminofiliny, sedacji, mukolityków; adrenalina – tylko w anafilaksji", "Uzależnienie od nikotyny: NTZ (plastry, gumy), **cytyzyna**, **wareniklina** (częściowi agoniści α4β2), **bupropion**", "Mukowiscydoza: **modulatory CFTR** (iwakaftor, eleksakaftor/tezakaftor/iwakaftor), dornaza alfa, antybiotyki wziewne (tobramycyna, aztreonam)"]}], "cards": [{"q": "Czym różni się formoterol od salmeterolu?", "a": "Oba to LABA (~12 h), ale **formoterol działa szybko** (1–3 min) – może być lekiem doraźnym w połączeniu z budezonidem; **salmeterol** – powolny początek."}, {"q": "Jakie leki należą do LAMA?", "a": "**Tiotropium, glikopironium, umeklidynium, aklidynium** – długo działające antagonisty receptorów muskarynowych (POChP, astma ciężka)."}, {"q": "Jaki jest mechanizm działania teofiliny?", "a": "Nieselektywnie hamuje **fosfodiesterazy** (↑ cAMP) i blokuje **receptory adenozynowe** → rozkurcz oskrzeli, pobudzenie ośrodka oddechowego, działanie inotropowo dodatnie."}, {"q": "Jaki jest zakres terapeutyczny teofiliny i jakie są objawy toksyczności?", "a": "**5–15 mg/l**. Toksyczność: nudności, wymioty, niepokój, **tachyarytmie**, **drgawki**, hipokaliemia, hiperglikemia."}, {"q": "Jakie czynniki zwiększają, a jakie zmniejszają stężenie teofiliny?", "a": "**↑**: cyprofloksacyna, **fluwoksamina**, makrolidy, cymetydyna, niewydolność serca i wątroby, rzucenie palenia. **↓**: **palenie tytoniu** (indukcja CYP1A2), ryfampicyna, karbamazepina, fenytoina."}, {"q": "Jakie są miejscowe działania niepożądane wziewnych GKS i jak im zapobiegać?", "a": "**Kandydoza jamy ustnej**, chrypka (dysfonia) → **płukanie ust** wodą po inhalacji, stosowanie komory inhalacyjnej."}, {"q": "Dlaczego GINA od 2019 r. nie zaleca leczenia astmy samym SABA?", "a": "Leczenie samym SABA **nie chroni przed ciężkimi zaostrzeniami**, a częste stosowanie SABA zwiększa ryzyko zaostrzeń i zgonów; nie leczy zapalenia."}, {"q": "Na czym polega preferowana ścieżka 1 leczenia astmy wg GINA?", "a": "Lekiem doraźnym jest **mała dawka budezonidu z formoterolem** (stopnie 1–2 – tylko doraźnie); od stopnia 3 ten sam inhalator jako leczenie **podtrzymujące i doraźne (MART)**."}, {"q": "Czym jest terapia MART?", "a": "**Maintenance And Reliever Therapy** – jeden inhalator wGKS + formoterol stosowany codziennie i dodatkowo doraźnie."}, {"q": "Dlaczego LABA nie wolno stosować w astmie w monoterapii?", "a": "Monoterapia LABA nie hamuje zapalenia i **zwiększa ryzyko ciężkich zaostrzeń i zgonów** z powodu astmy – zawsze z wGKS."}, {"q": "Jakie leki biologiczne stosuje się w ciężkiej astmie?", "a": "Anty-IgE – **omalizumab**; anty-IL-5 – **mepolizumab**, reslizumab; anty-IL-5R – **benralizumab**; anty-IL-4Rα – **dupilumab**; anty-TSLP – **tezepelumab**."}, {"q": "Dlaczego należy ograniczać kursy doustnych GKS w astmie?", "a": "Już **4–5 kursów w ciągu życia** wiąże się z ↑ ryzyka osteoporozy, cukrzycy, zaćmy i niewydolności serca."}, {"q": "Jaki jest mechanizm działania montelukastu i jego wskazania?", "a": "Antagonista receptora leukotrienowego **CysLT1**; astma (zwłaszcza z alergicznym nieżytem nosa, wysiłkowa, aspirynowa), alergiczny nieżyt nosa."}, {"q": "Przed jakimi działaniami niepożądanymi montelukastu ostrzega EMA (2019)?", "a": "**Zdarzenia neuropsychiatryczne** u dorosłych, młodzieży i dzieci – zmiany zachowania i nastroju, koszmary, depresja, myśli samobójcze; bardzo rzadko **jąkanie się**."}, {"q": "Jak działają kromony?", "a": "**Stabilizują błony komórek tucznych** (↓ uwalniania mediatorów) – tylko działanie zapobiegawcze (kromoglikan, nedokromil)."}, {"q": "Czym różnią się leki przeciwhistaminowe I i II generacji?", "a": "**I gen.** przenikają do OUN – sedacja, działanie cholinolityczne (klemastyna, difenhydramina, hydroksyzyna). **II gen.** słabo przenikają do OUN – mało sedatywne (cetyryzyna, loratadyna, feksofenadyna, bilastyna)."}, {"q": "Dlaczego wycofano terfenadynę i astemizol?", "a": "Wywoływały **wydłużenie QT i torsade de pointes**, zwłaszcza z inhibitorami CYP3A4 (ketokonazol, erytromycyna)."}, {"q": "Jakie leki są podstawą leczenia POChP?", "a": "Długo działające leki rozszerzające oskrzela: **LAMA** i/lub **LABA** (często połączenie LAMA + LABA)."}, {"q": "Kiedy w POChP dodaje się wziewny GKS i jakie jest ryzyko?", "a": "Przy **częstych zaostrzeniach** i **eozynofilii we krwi ≥ 300/µl**; wGKS zwiększa ryzyko **zapalenia płuc**."}, {"q": "Jaki jest mechanizm działania roflumilastu i jego działania niepożądane?", "a": "Inhibitor **PDE4** (działanie przeciwzapalne). Działania: **biegunka**, nudności, **spadek masy ciała**, bezsenność, depresja."}, {"q": "Jaka jest docelowa saturacja w zaostrzeniu POChP i dlaczego?", "a": "**88–92%** – wyższe stężenia tlenu mogą nasilać **hiperkapnię** (osłabienie napędu hipoksycznego, zaburzenia V/Q)."}, {"q": "Jaki jest mechanizm działania N-acetylocysteiny jako mukolityku?", "a": "Wolna grupa tiolowa **rozrywa mostki disiarczkowe** glikoprotein śluzu → zmniejsza lepkość wydzieliny."}, {"q": "Czym różnią się ambroksol i bromheksyna od N-acetylocysteiny?", "a": "Są **sekretolitykami** – zwiększają wydzielanie rzadkiego śluzu i surfaktantu oraz klirens śluzowo-rzęskowy; ambroksol to metabolit bromheksyny."}, {"q": "Dlaczego nie łączy się leków mukolitycznych z przeciwkaszlowymi?", "a": "Mukolityki upłynniają wydzielinę, a leki przeciwkaszlowe znoszą odruch kaszlu → **zaleganie wydzieliny** w drogach oddechowych."}, {"q": "Kiedy stosuje się leki przeciwkaszlowe?", "a": "Tylko w **suchym, męczącym, nieproduktywnym kaszlu** (np. zaburzającym sen)."}, {"q": "Dlaczego kodeina jest przeciwwskazana u dzieci < 12 lat i matek karmiących?", "a": "Ultraszybki metabolizm przez **CYP2D6** może dawać duże ilości **morfiny** → depresja oddechowa (u dziecka i u noworodka karmionego piersią)."}, {"q": "Jakie są zagrożenia związane z dekstrometorfanem?", "a": "**Nadużywanie** (w dużych dawkach działanie dysocjacyjne – antagonista NMDA), **zespół serotoninowy** z SSRI/MAOI."}, {"q": "Jak leczy się ciężkie zaostrzenie astmy?", "a": "**SABA** wielokrotnie + **ipratropium**, **GKS ogólnie** (prednizon 40–50 mg przez 5–7 dni), **tlen** (SpO₂ 93–95%), **siarczan magnezu i.v.** przy braku odpowiedzi."}, {"q": "Jakie leki stosuje się w leczeniu uzależnienia od nikotyny?", "a": "**Nikotynowa terapia zastępcza**, **cytyzyna** i **wareniklina** (częściowi agoniści receptora α4β2), **bupropion**."}, {"q": "Jak działa dornaza alfa w mukowiscydozie?", "a": "Rekombinowana DNaza – **rozkłada pozakomórkowe DNA** z rozpadłych neutrofili, zmniejszając lepkość wydzieliny."}], "sources": [{"t": "IPU Review – Asthma update: GINA 2025 guidelines (omówienie wytycznych GINA)", "u": "https://ipu.ie/ipu-review-article/asthma-update-gina-2025-guidelines/"}, {"t": "EMA/CMDh – Montelukast, PSUSA/00002087/201807: zmiany w ChPL (zdarzenia neuropsychiatryczne, 2019)", "u": "https://www.ema.europa.eu/en/documents/psusa/montelukast-cmdh-scientific-conclusions-and-grounds-variation-amendments-product-information-and-timetable-implementation-psusa00002087201807_en.pdf"}]}, {"id": "f-krew", "num": "F18", "title": "Leki układu krwiotwórczego, przeciwzakrzepowe i preparaty krwi", "summary": ["**Leki przeciwniedokrwistościowe.** **Żelazo** doustnie podaje się jako sole Fe²⁺ (siarczan, glukonian, fumaran). Wchłania się lepiej na czczo, z witaminą C i co drugi dzień (mniej hepcydyny). Daje dolegliwości żołądkowo-jelitowe, ciemne stolce i zaparcia. Herbata, nabiał, IPP, leki zobojętniające i tetracykliny zmniejszają jego wchłanianie. **Żelazo dożylne** (karboksymaltoza żelaza, derizomaltoza) stosuje się przy nietolerancji, zaburzeniach wchłaniania, w przewlekłej chorobie nerek i niewydolności serca. Grozi reakcjami nadwrażliwości i hipofosfatemią (karboksymaltoza). W zatruciu żelazem u dzieci stosuje się **deferoksaminę**. **Witamina B12** (cyjanokobalamina, hydroksokobalamina) w niedokrwistości złośliwej podawana jest domięśniowo, bo brakuje czynnika wewnętrznego. **Kwas foliowy** podaje się w niedoborze i w profilaktyce wad cewy nerwowej (0,4 mg przed ciążą i w jej trakcie). Nie wolno leczyć niedoboru B12 samym kwasem foliowym, bo maskuje on niedokrwistość, a uszkodzenie neurologiczne postępuje.", "**Czynniki wzrostowe i immunomodulujące**: **erytropoetyna** i jej analogi (epoetyna, darbepoetyna) w niedokrwistości w przewlekłej chorobie nerek i po chemioterapii. Wymagają wcześniejszego uzupełnienia żelaza. Mogą podnosić **ciśnienie tętnicze** i zwiększać ryzyko zakrzepicy, a przy Hb > 12 g/dl rośnie ryzyko udaru. Rzadko wywołują aplazję czysto czerwonokrwinkową. Inne leki z tej grupy: **G-CSF** (filgrastym, pegfilgrastym) w neutropenii poterapeutycznej i przy mobilizacji komórek macierzystych (ból kostny, splenomegalia), agoniści receptora trombopoetyny (romiplostym, eltrombopag w ITP), interferony i interleukiny.", "**Leki przeciwkrzepliwe.** **Heparyna niefrakcjonowana (HNF)** wzmacnia działanie **antytrombiny**, która hamuje trombinę (IIa) i czynnik Xa. Podaje się ją dożylnie lub podskórnie i monitoruje **aPTT**. Odtrutka to **siarczan protaminy**. Działania niepożądane: krwawienia, **małopłytkowość poheparynowa (HIT typu II**, immunologiczna, 5–14 dni od włączenia, z paradoksalną zakrzepicą; leczy się ją odstawieniem wszystkich heparyn i podaniem argatrobanu lub fondaparynuksu), osteoporoza i hiperkaliemia. **Heparyny drobnocząsteczkowe (HDCz)**: enoksaparyna, dalteparyna, nadroparyna. Działają głównie na Xa, mają przewidywalną farmakokinetykę i podaje się je podskórnie bez rutynowego monitorowania (ewentualnie anty-Xa). Wydalane są przez nerki (zmniejszenie dawki przy CrCl < 30), rzadziej wywołują HIT, a protamina odwraca je tylko częściowo. Heparyny **nie przechodzą przez łożysko** i są lekiem z wyboru w ciąży. **Fondaparynuks** to syntetyczny pentasacharyd hamujący Xa przez antytrombinę. Biwalirudynę i argatroban (bezpośrednie inhibitory trombiny) stosuje się dożylnie, m.in. w HIT.", "**Antagoniści witaminy K (VKA)**: **warfaryna** i **acenokumarol**. Hamują reduktazę epoksydu witaminy K (VKORC1), więc wątroba wytwarza niepełnowartościowe czynniki **II, VII, IX i X** oraz białka C i S. Efekt pojawia się po kilku dniach, a na początku leczenia może dojść do przejściowej nadkrzepliwości (spadek białka C) i **martwicy skóry**, dlatego zaczyna się z pomostem heparynowym. Leczenie monitoruje się **INR**: zwykle 2–3, a przy mechanicznych zastawkach 2,5–3,5. Ma **liczne interakcje**: INR zwiększają amiodaron, flukonazol, metronidazol, kotrimoksazol i makrolidy, a zmniejszają ryfampicyna, karbamazepina i ziele dziurawca. Znaczenie ma też dieta (witamina K w zielonych warzywach) i polimorfizmy CYP2C9 i VKORC1. VKA są **teratogenne**. Działanie odwraca **witamina K** (doustnie lub dożylnie), a przy krwawieniu **koncentrat czynników zespołu protrombiny (PCC)** albo osocze. **Doustne antykoagulanty niebędące antagonistami witaminy K (NOAC)**: **dabigatran** (bezpośredni inhibitor trombiny, wydalany w 80% przez nerki, odtrutka **idarucyzumab** 5 g dożylnie) oraz inhibitory Xa: **rywaroksaban, apiksaban** (5 mg 2 razy dziennie w AF) i **edoksaban** (odtrutka andeksanet alfa). Nie wymagają monitorowania INR, ale są **przeciwwskazane przy mechanicznych zastawkach** i w umiarkowanej lub ciężkiej stenozie mitralnej, a dawkę dobiera się do czynności nerek.", "**Leki przeciwpłytkowe** (ASA, inhibitory P2Y12, GP IIb/IIIa) omówiono w rozdziale o chorobie wieńcowej. **Fibrynolityki** (alteplaza, tenekteplaza) stosuje się w STEMI, udarze niedokrwiennym (alteplaza do 4,5 h) i masywnej zatorowości płucnej. **Leki hamujące fibrynolizę**: **kwas traneksamowy** (krwawienia, urazy, krwotok poporodowy, zabiegi stomatologiczne u chorych na hemofilię) i kwas ε-aminokapronowy. **Desmopresyna** zwiększa uwalnianie czynnika von Willebranda i czynnika VIII. **Witamina K** leczy niedobory i przedawkowanie VKA. **Preparaty krwi i krwiopochodne**: koncentrat krwinek czerwonych, koncentrat krwinek płytkowych, osocze świeżo mrożone, krioprecypitat (fibrynogen, czynnik VIII, vWF), koncentraty czynników krzepnięcia (VIII i IX w hemofilii, PCC) oraz albuminy i immunoglobuliny. Przetoczenia grożą reakcjami hemolitycznymi (niezgodność AB0), TRALI, TACO i zakażeniami. **Płyny krwiozastępcze**: krystaloidy (0,9% NaCl, płyny zbilansowane jak PWE i mleczanowy Ringera) i koloidy (żelatyny, albuminy). Hydroksyetyloskrobia (HES) została praktycznie wycofana przez EMA z powodu uszkodzenia nerek i zwiększonej śmiertelności w sepsie."], "review": [{"h": "Żelazo, B12, foliany", "items": ["Żelazo p.o.: **Fe²⁺** (siarczan, glukonian, fumaran) – na czczo, z wit. C; co drugi dzień (↓ hepcydyny); nudności, bóle brzucha, **zaparcia, czarne stolce**", "↓ wchłaniania Fe: herbata, kawa, nabiał (Ca), **IPP, leki zobojętniające, tetracykliny, fluorochinolony** (wzajemnie), lewotyroksyna", "Żelazo i.v. (karboksymaltoza, derizomaltoza, sacharoza żelaza): nietolerancja/nieskuteczność p.o., IBD, PChN, HF; nadwrażliwość, **hipofosfatemia** (karboksymaltoza)", "Zatrucie żelazem (dzieci): wymioty, krwawienie z p. pokarmowego, kwasica, niewydolność wątroby → **deferoksamina**", "**Witamina B12** – niedokrwistość złośliwa (brak czynnika Castle'a) → **i.m.**; po resekcji żołądka/jelita krętego", "**Kwas foliowy** – niedobór; **0,4 mg/d** prewencja wad cewy nerwowej (wyższe dawki przy padaczce, przebytej wadzie); metotreksat (ratunek – folinian wapnia)", "Nie leczyć niedoboru B12 samym folianem – maskuje niedokrwistość, a **objawy neurologiczne postępują**"]}, {"h": "Czynniki wzrostowe", "items": ["**Erytropoetyna** (epoetyna α/β, darbepoetyna, pegylowana) – niedokrwistość w PChN, po chemioterapii; najpierw uzupełnić **żelazo**", "ESA: **↑ RR**, zakrzepica, udar przy Hb > 12 g/dl, aplazja czysto czerwonokrwinkowa (przeciwciała), progresja niektórych nowotworów; doping", "**G-CSF** (filgrastym, pegfilgrastym, lenograstym) – neutropenia po chemioterapii, mobilizacja komórek macierzystych; **bóle kostne**, splenomegalia (pęknięcie śledziony – rzadko)", "Agoniści receptora TPO: **romiplostym** (s.c.), **eltrombopag** (p.o.) – przewlekła ITP", "Immunomodulujące: interferony (IFN-α, IFN-β – SM), interleukiny, inhibitory HIF-PH (roksadustat)"]}, {"h": "Heparyny i fondaparynuks", "items": ["**HNF** – kompleks z **antytrombiną** → hamowanie **IIa i Xa** (1:1); i.v./s.c.; monitorowanie **aPTT** (1,5–2,5× norma); odtrutka **siarczan protaminy** (pełne odwrócenie)", "**HIT typu II**: przeciwciała przeciw kompleksowi PF4–heparyna, **5–14 dni** od włączenia, ↓ PLT > 50%, **zakrzepica** → odstawić wszystkie heparyny, **argatroban** / fondaparynuks / NOAC; nie podawać płytek", "Inne działania HNF: krwawienia, **osteoporoza** (długotrwale), **hiperkaliemia** (hipoaldosteronizm), ↑ transaminaz", "**HDCz** (enoksaparyna, dalteparyna, nadroparyna): głównie **anty-Xa**; s.c. 1–2×/d; bez rutynowego monitorowania (anty-Xa – otyłość, ciąża, niewydolność nerek); **nerki** – ↓ dawki przy CrCl < 30; protamina odwraca częściowo; HIT rzadziej", "Heparyny **nie przenikają przez łożysko** → antykoagulacja z wyboru w **ciąży**", "**Fondaparynuks** – syntetyczny pentasacharyd, wybiórczo **Xa** (przez antytrombinę); s.c.; nie wywołuje HIT; brak odtrutki; nerki", "Bezpośrednie inhibitory trombiny i.v.: **argatroban** (HIT, wątroba), **biwalirudyna** (PCI)"]}, {"h": "Antagoniści witaminy K", "items": ["**Warfaryna, acenokumarol** – hamują **reduktazę epoksydu wit. K (VKORC1)** → brak γ-karboksylacji czynników **II, VII, IX, X** oraz białek **C i S**", "Efekt po **3–5 dniach** (najpierw ↓ VII – krótki t½); początkowa nadkrzepliwość (↓ białka C) → **martwica skóry** → pomost heparynowy", "Monitorowanie **INR**: zwykle **2–3**; mechaniczne zastawki (mitralna, czynniki ryzyka) **2,5–3,5**", "↑ INR: **amiodaron, flukonazol, metronidazol, kotrimoksazol, makrolidy**, fluorochinolony, paracetamol (duże dawki), alkohol ostro, choroby wątroby, gorączka, nadczynność tarczycy", "↓ INR: **ryfampicyna, karbamazepina, fenobarbital, ziele dziurawca**, dieta bogata w wit. K (szpinak, brokuły, kapusta), przewlekły alkoholizm", "↑ krwawień bez zmiany INR: **NLPZ, ASA, SSRI**, klopidogrel", "Farmakogenetyka: **CYP2C9** (S-warfaryna), **VKORC1**", "**Teratogenna** (embriopatia warfarynowa – 6.–12. tydz.: hipoplazja nosa, zwapnienia nasad)", "Odwracanie: INR za wysokie bez krwawienia – pominąć dawkę / **wit. K p.o.**; poważne krwawienie – **wit. K i.v. + PCC (4-czynnikowy)** lub osocze"]}, {"h": "NOAC (DOAC)", "items": ["**Dabigatran** – bezpośredni inhibitor **trombiny**; prolek; **~80% nerki**; dyspepsja; kapsułek nie otwierać; odtrutka **idarucyzumab** (fragment przeciwciała, **5 g i.v.**, ewentualnie powtórzyć)", "Inhibitory **Xa**: **rywaroksaban** (z posiłkiem przy dawkach ≥ 15 mg), **apiksaban**, **edoksaban**; odtrutka: **andeksanet alfa** (Xa); alternatywnie PCC", "**Apiksaban** – AF: **5 mg 2×/d**; ŻChZZ (leczenie, prewencja nawrotów), profilaktyka po alloplastyce biodra/kolana; także dzieci od 28. dnia życia (ŻChZZ)", "Zalety: stała dawka, szybki początek, **bez monitorowania INR**, mniej interakcji z pokarmem, mniej krwawień wewnątrzczaszkowych", "**Przeciwwskazane**: **mechaniczne zastawki serca**, umiarkowana/ciężka **stenoza mitralna**, zespół antyfosfolipidowy (potrójnie dodatni), ciąża, czynne krwawienie", "Dawkowanie wg **czynności nerek**, wieku, masy; interakcje: silne inhibitory/induktory **CYP3A4 i P-gp** (ketokonazol, rytonawir ↑; ryfampicyna, karbamazepina ↓)", "Przed zabiegiem – odstawienie zwykle 24–48 h (dłużej dla dabigatranu przy ↓ GFR); zwykle bez pomostowania"]}, {"h": "Fibrynoliza, hemostatyki, preparaty krwi", "items": ["Fibrynolityki: **alteplaza** (STEMI, **udar niedokrwienny ≤ 4,5 h**, masywna ZP), **tenekteplaza** (bolus), reteplaza; streptokinaza (antygenowa)", "**Kwas traneksamowy** – analog lizyny, blokuje wiązanie plazminogenu z fibryną: krwotoki, urazy (≤ 3 h), **krwotok poporodowy**, zabiegi u chorych na hemofilię, obfite miesiączki; ryzyko zakrzepicy, drgawki (duże dawki)", "**Desmopresyna** – ↑ uwalniania **vWF i czynnika VIII**: choroba von Willebranda typu 1, łagodna hemofilia A; moczówka prosta; hiponatremia", "**Witamina K** (fitomenadion) – niedobory, noworodki, przedawkowanie VKA (nie odwraca heparyn ani NOAC)", "KKCz – niedokrwistość; KKP – małopłytkowość/krwawienie; **FFP** – niedobór wielu czynników; **krioprecypitat** – fibrynogen, VIII, vWF, XIII", "Koncentraty czynników: **VIII** (hemofilia A), **IX** (hemofilia B), **PCC** (II, VII, IX, X); emicizumab (hemofilia A – przeciwciało dwuswoiste)", "Powikłania przetoczeń: ostra reakcja hemolityczna (**AB0**), gorączkowa niehemolityczna, alergiczna, **TRALI**, **TACO**, zakażenia, przeciążenie żelazem", "Płyny: **krystaloidy** (0,9% NaCl – kwasica hiperchloremiczna; PWE, Ringer z mleczanami – zbilansowane), koloidy (żelatyny, albuminy); **HES** – ograniczony/wycofany (uszkodzenie nerek, ↑ śmiertelności w sepsie)"]}], "cards": [{"q": "Jak zwiększyć wchłanianie doustnego żelaza?", "a": "Przyjmować **Fe²⁺ na czczo**, z **witaminą C**; dawkowanie co drugi dzień (mniej hepcydyny); unikać herbaty, kawy, nabiału, leków zobojętniających i IPP w czasie przyjmowania."}, {"q": "Jakie są działania niepożądane doustnych preparatów żelaza?", "a": "Nudności, bóle brzucha, **zaparcia** (lub biegunka), **czarne zabarwienie stolca**."}, {"q": "Kiedy stosuje się żelazo dożylne?", "a": "Przy nietolerancji lub nieskuteczności żelaza doustnego, zaburzeniach wchłaniania (np. IBD), w przewlekłej chorobie nerek, niewydolności serca, gdy potrzebne jest szybkie uzupełnienie."}, {"q": "Jaka jest odtrutka w zatruciu żelazem?", "a": "**Deferoksamina** (chelator żelaza)."}, {"q": "Dlaczego w niedokrwistości złośliwej witaminę B12 podaje się domięśniowo?", "a": "Brakuje **czynnika wewnętrznego (Castle'a)** niezbędnego do wchłaniania B12 w jelicie krętym (autoimmunologiczne zapalenie żołądka)."}, {"q": "Dlaczego nie wolno leczyć niedoboru B12 samym kwasem foliowym?", "a": "Kwas foliowy poprawia obraz krwi (maskuje niedokrwistość), ale **nie zapobiega postępowi uszkodzeń neurologicznych** (zwyrodnienie sznurów tylnych)."}, {"q": "Jaka dawka kwasu foliowego zapobiega wadom cewy nerwowej?", "a": "**0,4 mg/dobę** od co najmniej kilku tygodni przed zajściem w ciążę do końca I trymestru (wyższe dawki w grupach ryzyka – np. leczenie przeciwpadaczkowe, wada w wywiadzie)."}, {"q": "Jakie są działania niepożądane erytropoetyny?", "a": "**Nadciśnienie tętnicze**, zakrzepica, ↑ ryzyka udaru przy dużych Hb (> 12 g/dl), aplazja czysto czerwonokrwinkowa (przeciwciała), bóle głowy."}, {"q": "Co trzeba sprawdzić przed włączeniem erytropoetyny?", "a": "**Zapasy żelaza** (ferrytyna, wysycenie transferyny) – niedobór żelaza powoduje oporność na leczenie."}, {"q": "Do czego stosuje się G-CSF i jakie ma typowe działanie niepożądane?", "a": "**Neutropenia** po chemioterapii, mobilizacja komórek macierzystych. Działanie niepożądane: **bóle kostne**, splenomegalia."}, {"q": "Jaki jest mechanizm działania heparyny niefrakcjonowanej?", "a": "Wiąże **antytrombinę** i tysiąckrotnie przyspiesza hamowanie **trombiny (IIa) i czynnika Xa** (oraz IXa, XIa)."}, {"q": "Jak monitoruje się leczenie HNF i jaka jest odtrutka?", "a": "**aPTT** (1,5–2,5× norma); odtrutka – **siarczan protaminy** (całkowicie odwraca HNF)."}, {"q": "Czym jest małopłytkowość poheparynowa typu II?", "a": "Immunologiczna reakcja (przeciwciała przeciw kompleksowi **PF4–heparyna**) pojawiająca się **5–14 dni** od włączenia heparyny: spadek PLT > 50% i **paradoksalna zakrzepica** (żylna i tętnicza)."}, {"q": "Jak postępować w HIT typu II?", "a": "Odstawić **wszystkie heparyny** (także płukanie cewników), włączyć antykoagulant niebędący heparyną – **argatroban**, fondaparynuks (lub NOAC); nie przetaczać płytek profilaktycznie."}, {"q": "Jakie są działania niepożądane długotrwałego leczenia heparyną?", "a": "**Osteoporoza**, **hiperkaliemia** (hamowanie aldosteronu), łysienie, ↑ transaminaz, HIT."}, {"q": "Czym różnią się HDCz od heparyny niefrakcjonowanej?", "a": "HDCz działają głównie na **Xa**, mają przewidywalną farmakokinetykę, podaje się je **s.c.** bez rutynowego monitorowania, rzadziej wywołują HIT i osteoporozę, są wydalane przez **nerki**, a protamina odwraca je tylko częściowo."}, {"q": "Kiedy monitoruje się aktywność anty-Xa u pacjentów na HDCz?", "a": "W **niewydolności nerek**, skrajnej otyłości lub małej masie ciała, w **ciąży**, u dzieci."}, {"q": "Dlaczego heparyny są antykoagulantami z wyboru w ciąży?", "a": "**Nie przechodzą przez łożysko**; warfaryna jest teratogenna, NOAC – przeciwwskazane."}, {"q": "Jak działa fondaparynuks?", "a": "Syntetyczny **pentasacharyd** – przez antytrombinę wybiórczo hamuje **czynnik Xa**; podawany s.c., nie wywołuje HIT, brak swoistej odtrutki."}, {"q": "Jaki jest mechanizm działania warfaryny?", "a": "Hamuje **reduktazę epoksydu witaminy K (VKORC1)** → brak γ-karboksylacji czynników **II, VII, IX, X** oraz białek C i S."}, {"q": "Dlaczego na początku leczenia warfaryną stosuje się pomost heparynowy?", "a": "Bo najpierw spada stężenie **białka C** (krótki t½) → przejściowa **nadkrzepliwość** (ryzyko zakrzepicy i **martwicy skóry**), a efekt przeciwkrzepliwy pojawia się po 3–5 dniach."}, {"q": "Jakie są docelowe wartości INR podczas leczenia VKA?", "a": "Zwykle **2,0–3,0**; przy mechanicznych zastawkach (zwłaszcza mitralnej, z czynnikami ryzyka) **2,5–3,5**."}, {"q": "Które leki nasilają działanie warfaryny (↑ INR)?", "a": "**Amiodaron, flukonazol, metronidazol, kotrimoksazol, makrolidy**, fluorochinolony, duże dawki paracetamolu, statyny (niektóre), alkohol (ostro)."}, {"q": "Które leki osłabiają działanie warfaryny (↓ INR)?", "a": "Induktory: **ryfampicyna, karbamazepina, fenobarbital, fenytoina, ziele dziurawca**; także dieta bogata w witaminę K."}, {"q": "Jak odwraca się działanie warfaryny w poważnym krwawieniu?", "a": "**Witamina K dożylnie** + **koncentrat czynników zespołu protrombiny (PCC)**; ewentualnie osocze świeżo mrożone."}, {"q": "Czym jest embriopatia warfarynowa?", "a": "Wady płodu po ekspozycji w **6.–12. tygodniu**: hipoplazja nosa, punktowe zwapnienia nasad kości (chondrodysplazja), zaburzenia OUN."}, {"q": "Jaki jest mechanizm działania dabigatranu i jaka jest jego odtrutka?", "a": "Bezpośredni **inhibitor trombiny**. Odtrutka: **idarucyzumab** (fragment przeciwciała monoklonalnego) – **5 g i.v.**; w razie potrzeby druga dawka 5 g."}, {"q": "Jakie leki należą do bezpośrednich doustnych inhibitorów czynnika Xa?", "a": "**Rywaroksaban, apiksaban, edoksaban**; odtrutka – **andeksanet alfa**."}, {"q": "Jaka jest standardowa dawka apiksabanu w migotaniu przedsionków?", "a": "**5 mg 2× na dobę** (dawkę zmniejsza się do 2,5 mg 2×/d wg kryteriów ChPL)."}, {"q": "Kiedy NOAC są przeciwwskazane?", "a": "U chorych z **mechanicznymi zastawkami serca** i z **umiarkowaną/ciężką stenozą mitralną**; także w zespole antyfosfolipidowym (potrójnie dodatnim), ciąży, czynnym krwawieniu."}, {"q": "Który NOAC jest najbardziej zależny od czynności nerek?", "a": "**Dabigatran** (ok. 80% wydalane przez nerki)."}, {"q": "Jaki jest mechanizm działania kwasu traneksamowego i jego zastosowania?", "a": "Analog lizyny – **blokuje wiązanie plazminogenu/plazminy z fibryną** (hamuje fibrynolizę). Zastosowania: krwotoki urazowe, **krwotok poporodowy**, obfite miesiączki, zabiegi u chorych na hemofilię, odwracanie fibrynolizy."}, {"q": "Jak działa desmopresyna w zaburzeniach krzepnięcia?", "a": "Zwiększa uwalnianie **czynnika von Willebranda i czynnika VIII** ze śródbłonka – choroba vWD typu 1, łagodna hemofilia A; działanie niepożądane: **hiponatremia**."}, {"q": "Co zawiera krioprecypitat i kiedy się go stosuje?", "a": "**Fibrynogen, czynnik VIII, vWF, czynnik XIII**, fibronektynę; niedobór fibrynogenu (np. DIC, masywne przetoczenia)."}, {"q": "Jakie są poważne powikłania przetoczeń krwi?", "a": "Ostra reakcja hemolityczna (niezgodność **AB0**), **TRALI** (ostre poprzetoczeniowe uszkodzenie płuc), **TACO** (przeciążenie krążenia), zakażenia, reakcje alergiczne/anafilaksja, przeciążenie żelazem."}, {"q": "Dlaczego ograniczono stosowanie hydroksyetyloskrobi (HES)?", "a": "Zwiększała ryzyko **uszkodzenia nerek** (konieczność dializ) i **śmiertelność** u chorych w stanie krytycznym i z sepsą."}], "sources": [{"t": "EMA – Eliquis (apiksaban), streszczenie EPAR (j. polski)", "u": "https://www.ema.europa.eu/pl/medicines/human/EPAR/eliquis"}, {"t": "EMA – Praxbind (idarucyzumab), streszczenie EPAR (j. polski)", "u": "https://www.ema.europa.eu/pl/medicines/human/EPAR/praxbind"}]}, {"id": "f-onkologia", "num": "F19", "title": "Leki przeciwnowotworowe", "summary": ["**Cytostatyki klasyczne** działają przede wszystkim na komórki szybko dzielące się, dlatego ich działania niepożądane dotyczą tkanek o dużym obrocie komórkowym: **szpiku** (neutropenia, małopłytkowość, niedokrwistość), błon śluzowych (zapalenie jamy ustnej, biegunka), mieszków włosowych (łysienie) i gonad (niepłodność). Wywołują też **nudności i wymioty**, **zespół rozpadu guza** (hiperurykemia, hiperkaliemia, hiperfosfatemia i hipokalcemia; zapobiega mu nawodnienie oraz allopurinol lub rasburykaza), są **teratogenne** i mogą indukować nowotwory wtórne. Ponadto wiele z nich ma toksyczność swoistą dla narządów. Leki **swoiste dla fazy cyklu** to antymetabolity (faza S) i alkaloidy (faza M). Leki alkilujące i antracykliny są **nieswoiste dla fazy**.", "**Leki alkilujące** tworzą wiązania krzyżowe w DNA. **Cyklofosfamid** i ifosfamid wymagają aktywacji wątrobowej, a ich metabolit **akroleina** wywołuje **krwotoczne zapalenie pęcherza**, któremu zapobiega **mesna** i nawodnienie. Inne leki alkilujące to chlorambucyl, melfalan, busulfan (zwłóknienie płuc), pochodne nitrozomocznika (karmustyna, przenikają do OUN), dakarbazyna i temozolomid (glejaki) oraz **pochodne platyny**: **cisplatyna** (silnie **nefrotoksyczna**, **ototoksyczna**, neurotoksyczna i najsilniej wymiotna; wymaga nawodnienia i uzupełniania Mg²⁺), karboplatyna (bardziej mielotoksyczna) i oksaliplatyna (neuropatia wywoływana zimnem). **Antymetabolity**: **metotreksat** (antagonista folianów; po dużych dawkach podaje się **folinian wapnia**, a stężenie zwiększają NLPZ, kotrimoksazol i penicyliny), **5-fluorouracyl** i **kapecytabina** (hamują syntazę tymidylanu; dają zapalenie śluzówek, zespół ręka–stopa, biegunkę i kardiotoksyczność), cytarabina, gemcytabina oraz **6-merkaptopuryna i azatiopryna**. Te ostatnie rozkłada TPMT i oksydaza ksantynowa, więc **allopurinol** zwiększa ich toksyczność. Według EMA (2020) przed 5-FU, kapecytabiną i tegafurem trzeba zbadać **niedobór DPD**: przy całkowitym niedoborze leki są przeciwwskazane, a przy częściowym zmniejsza się dawkę początkową.", "**Antybiotyki przeciwnowotworowe**: **antracykliny** (doksorubicyna, daunorubicyna, epirubicyna, idarubicyna) wnikają między zasady DNA, hamują topoizomerazę II i wytwarzają wolne rodniki. Ich **kardiotoksyczność** zależy od dawki kumulacyjnej (kardiomiopatia, niewydolność serca), dlatego monitoruje się EF, a chroni deksrazoksan. Wynaczynienie powoduje martwicę, a mocz barwi się na czerwono. **Bleomycyna** wywołuje **zwłóknienie płuc** i zmiany skórne, ale słabo hamuje szpik. Mitomycyna i daktynomycyna to inne leki tej grupy. **Inhibitory topoizomeraz**: I (**pochodne kamptotecyny**: irynotekan, który daje ciężką biegunkę wczesną, cholinergiczną i leczoną atropiną, oraz późną, a także topotekan) i II (**pochodne podofilotoksyny**: etopozyd, tenipozyd). **Alkaloidy i taksoidy działające na mikrotubule**: alkaloidy barwinka (**winkrystyna**, która daje **neuropatię obwodową** i zaparcia, słabo hamuje szpik i **podana dokanałowo jest śmiertelna**, oraz winblastyna i winorelbina, bardziej mielotoksyczne) hamują polimeryzację mikrotubul. **Taksoidy** (paklitaksel, docetaksel) stabilizują mikrotubule. Wywołują reakcje nadwrażliwości (premedykacja GKS i lekami przeciwhistaminowymi), neuropatię i neutropenię.", "**Leki celowane i nowe leki przeciwnowotworowe**: **inhibitory kinaz tyrozynowych** (imatynib w CML z BCR-ABL i w GIST, erlotynib i ozymertynib w raku płuca z EGFR, lapatynib, sunitynib, sorafenib; dają m.in. zmiany skórne, biegunkę, nadciśnienie i wydłużenie QT, a wiele z nich wchodzi w interakcje przez CYP3A4), **przeciwciała monoklonalne** (rytuksymab anty-CD20 z reakcjami wlewowymi i reaktywacją HBV, trastuzumab anty-HER2 z kardiotoksycznością, bewacyzumab anty-VEGF z nadciśnieniem, krwawieniami, perforacjami i gorszym gojeniem ran, cetuksymab anty-EGFR z wysypką trądzikopodobną), **inhibitory punktów kontrolnych** (niwolumab i pembrolizumab anty-PD-1, ipilimumab anty-CTLA-4; wywołują **immunologiczne działania niepożądane**: zapalenie jelita, wątroby, płuc i przysadki oraz zaburzenia tarczycy, leczone glikokortykosteroidami), inhibitory proteasomu (bortezomib, neuropatia), leki immunomodulujące (talidomid i lenalidomid, teratogenne i prozakrzepowe), inhibitory PARP, CDK4/6 i mTOR oraz terapia CAR-T. **Hormonoterapia**: tamoksyfen (SERM, ryzyko zakrzepicy i raka endometrium), inhibitory aromatazy (anastrozol, letrozol, eksemestan; osteoporoza i bóle stawów), analogi GnRH, antyandrogeny (bikalutamid, enzalutamid) i abirateron.", "**Leczenie wspomagające** w onkologii: **przeciwwymiotne** (antagonista 5-HT3, antagonista NK1, deksametazon, olanzapina), **G-CSF** (neutropenia), erytropoetyna, **allopurinol lub rasburykaza** (zespół rozpadu guza; rasburykaza jest przeciwwskazana przy niedoborze G6PD), **mesna** (cyklofosfamid i ifosfamid), **folinian wapnia** (metotreksat w dużych dawkach), **deksrazoksan** (antracykliny), **amifostyna** (cisplatyna, radioterapia) i nawodnienie z magnezem przy cisplatynie. **Gorączka neutropeniczna** (neutrofile < 500/µl i temperatura ≥ 38,3°C) jest stanem nagłym i wymaga natychmiastowej antybiotykoterapii o szerokim spektrum (np. piperacylina z tazobaktamem). Pracowników chroni się przy przygotowywaniu cytostatyków (dygestoria, rękawice)."], "review": [{"h": "Zasady i wspólne działania niepożądane", "items": ["Swoiste dla fazy: **antymetabolity (S)**, **alkaloidy barwinka i taksoidy (M)**, bleomycyna (G2), etopozyd (S/G2)", "Nieswoiste: **alkilujące**, platyny, antracykliny", "Wspólne: **mielosupresja** (nadir 7–14 dni), zapalenie śluzówek, łysienie, nudności/wymioty, niepłodność, **teratogenność**, nowotwory wtórne", "**Zespół rozpadu guza**: ↑ kwasu moczowego, ↑ K⁺, ↑ fosforanów, ↓ Ca²⁺ → ostre uszkodzenie nerek; profilaktyka: nawodnienie, **allopurinol/rasburykaza**", "**Gorączka neutropeniczna** (ANC < 500 + ≥ 38,3°C) → natychmiast antybiotyk szerokowidmowy"]}, {"h": "Leki alkilujące i platyny", "items": ["**Cyklofosfamid, ifosfamid** – aktywacja wątrobowa; **akroleina → krwotoczne zapalenie pęcherza** → **mesna** + nawodnienie; ifosfamid – neurotoksyczność; SIADH", "Chlorambucyl (PBL), **melfalan** (szpiczak), **busulfan** (zwłóknienie płuc, przebarwienia), nitrozomoczniki (karmustyna, lomustyna – OUN), dakarbazyna, **temozolomid** (glejaki)", "**Cisplatyna**: **nefrotoksyczność** (nawodnienie, Mg²⁺), **ototoksyczność**, neuropatia, **silnie wymiotna**, hipomagnezemia", "**Karboplatyna**: mniej nefro-/neurotoksyczna, bardziej **mielotoksyczna** (trombocytopenia); dawka wg AUC (wzór Calverta)", "**Oksaliplatyna**: **neuropatia wywoływana zimnem** (ostra) i przewlekła; rak jelita grubego"]}, {"h": "Antymetabolity", "items": ["**Metotreksat** – hamuje reduktazę dihydrofolianu; duże dawki → ratunek **folinianem wapnia (leukoworyna)**; nefrotoksyczność (alkalizacja moczu), zapalenie śluzówek, hepatotoksyczność, płuca; ↑ toksyczności: NLPZ, kotrimoksazol, penicyliny, IPP; glukarpidaza – przedawkowanie", "**5-fluorouracyl, kapecytabina** (prolek doustny) – hamują **syntazę tymidylanu**: zapalenie śluzówek, biegunka, **zespół ręka–stopa**, kardiotoksyczność (skurcz naczyń wieńcowych); leukoworyna nasila działanie", "EMA 2020: przed 5-FU/kapecytabiną/tegafurem – **test niedoboru DPD** (uracyl we krwi lub genotyp DPYD); **całkowity niedobór → przeciwwskazane**; częściowy → **↓ dawki początkowej**; nie dotyczy 5-FU miejscowo", "**Cytarabina** – AML; zapalenie spojówek, objawy móżdżkowe (duże dawki); **gemcytabina** – trzustka, płuco", "**6-merkaptopuryna, azatiopryna** – rozkład przez **TPMT** i **oksydazę ksantynową** → z **allopurinolem** ciężka mielosupresja (↓ dawki o 75%); niedobór TPMT/NUDT15 – badać", "Fludarabina, kladrybina – immunosupresja, zakażenia oportunistyczne"]}, {"h": "Antybiotyki i inhibitory topoizomeraz", "items": ["**Antracykliny** (doksorubicyna, daunorubicyna, epirubicyna, idarubicyna) – interkalacja, **topoizomeraza II**, wolne rodniki", "Antracykliny: **kardiotoksyczność zależna od dawki kumulacyjnej** (doksorubicyna ~450–550 mg/m²) → echo (EF), **deksrazoksan**; martwica przy wynaczynieniu; **czerwony mocz**; mielosupresja", "**Bleomycyna** – **zwłóknienie płuc** (dawka kumulacyjna, tlen), zmiany skórne, gorączka; mało mielotoksyczna", "Mitomycyna (HUS, zwłóknienie płuc), daktynomycyna, mitoksantron", "**Topoizomeraza I** – kamptotecyny: **irynotekan** (biegunka **wczesna – cholinergiczna → atropina**; późna → loperamid; UGT1A1*28 – toksyczność), topotekan", "**Topoizomeraza II** – podofilotoksyny: **etopozyd** (białaczki wtórne), tenipozyd"]}, {"h": "Leki działające na mikrotubule", "items": ["Alkaloidy barwinka – **hamują polimeryzację** mikrotubul", "**Winkrystyna**: **neuropatia obwodowa**, zaparcia/niedrożność porażenna, SIADH; słabo mielotoksyczna; **dokanałowo – śmiertelna**", "**Winblastyna, winorelbina** – głównie **mielosupresja**", "**Taksoidy** – **stabilizują** mikrotubule (hamują depolimeryzację): **paklitaksel** (nadwrażliwość – rozpuszczalnik → premedykacja GKS + H1/H2; neuropatia), **docetaksel** (zatrzymanie płynów, neutropenia); kabazytaksel", "Eribulina – rak piersi"]}, {"h": "Leki celowane, immunoterapia, hormonoterapia", "items": ["**Imatynib** – BCR-ABL (**CML**), c-KIT (**GIST**): obrzęki, kurcze; nilotynib, dazatynib", "EGFR-TKI (erlotynib, gefitynib, **ozymertynib**) – rak płuca z mutacją EGFR; wysypka trądzikopodobna, biegunka", "Multikinazowe (sunitynib, sorafenib, pazopanib) – nadciśnienie, zespół ręka–stopa, niedoczynność tarczycy", "**Rytuksymab** (anty-CD20) – reakcje wlewowe, **reaktywacja HBV**, PML", "**Trastuzumab** (anty-HER2) – **kardiotoksyczność** (odwracalna; nie łączyć jednocześnie z antracyklinami)", "**Bewacyzumab** (anty-VEGF) – **nadciśnienie**, białkomocz, krwawienia, **perforacje p. pokarmowego**, upośledzone gojenie ran", "**Cetuksymab, panitumumab** (anty-EGFR) – wysypka trądzikopodobna, hipomagnezemia; tylko RAS dzikiego typu", "**Inhibitory punktów kontrolnych**: niwolumab, pembrolizumab (anty-PD-1), atezolizumab (anty-PD-L1), ipilimumab (anty-CTLA-4) → **irAE**: zapalenie jelita, wątroby, płuc, przysadki, tarczycy, cukrzyca typu 1 → **GKS**", "Bortezomib (proteasom – neuropatia, reaktywacja VZV), **talidomid/lenalidomid** (teratogenne, ŻChZZ), inhibitory PARP (olaparyb – BRCA), CDK4/6 (palbocyklib), mTOR (ewerolimus)", "Hormonoterapia: **tamoksyfen** (SERM – ŻChZZ, **rak endometrium**, uderzenia gorąca; CYP2D6), **inhibitory aromatazy** (anastrozol, letrozol, eksemestan – **osteoporoza**, bóle stawów), analogi GnRH, bikalutamid, enzalutamid, **abirateron** (inhibitor CYP17 + prednizon)"]}, {"h": "Leczenie wspomagające", "items": ["Przeciwwymiotne: **5-HT3 + NK1 + deksametazon** (± olanzapina) – chemioterapia wysoko emetogenna", "**Mesna** – cyklofosfamid/ifosfamid (wiąże akroleinę)", "**Folinian wapnia** – metotreksat (duże dawki); nasila 5-FU", "**Deksrazoksan** – kardioprotekcja przy antracyklinach, wynaczynienie antracyklin", "**Amifostyna** – nefroprotekcja (cisplatyna), kserostomia po radioterapii", "**Rasburykaza** – rozkłada kwas moczowy; przeciwwskazana przy **niedoborze G6PD** (hemoliza, methemoglobinemia)", "**G-CSF** – profilaktyka/leczenie neutropenii; ESA – niedokrwistość", "Bezpieczeństwo personelu: przygotowanie w dygestorium, rękawice, utylizacja"]}], "cards": [{"q": "Jakie tkanki są najbardziej narażone na działania niepożądane klasycznych cytostatyków i dlaczego?", "a": "Tkanki o szybkim podziale komórek: **szpik** (mielosupresja), **błony śluzowe** (zapalenie jamy ustnej, biegunka), **mieszki włosowe** (łysienie), **gonady** (niepłodność)."}, {"q": "Które cytostatyki działają swoiście w fazie S, a które w fazie M?", "a": "**Faza S** – antymetabolity (metotreksat, 5-FU, cytarabina, 6-MP). **Faza M** – alkaloidy barwinka i taksoidy."}, {"q": "Czym jest zespół rozpadu guza i jak mu zapobiegać?", "a": "Masywny rozpad komórek nowotworowych → **hiperurykemia, hiperkaliemia, hiperfosfatemia, hipokalcemia**, ostre uszkodzenie nerek. Profilaktyka: **nawodnienie**, **allopurinol lub rasburykaza**."}, {"q": "Dlaczego cyklofosfamid podaje się z mesną?", "a": "Metabolit cyklofosfamidu (i ifosfamidu) – **akroleina** – wywołuje **krwotoczne zapalenie pęcherza**; **mesna** ją wiąże i inaktywuje w drogach moczowych."}, {"q": "Jakie są główne działania niepożądane cisplatyny?", "a": "**Nefrotoksyczność** (konieczne nawodnienie), **ototoksyczność**, neuropatia obwodowa, **silne działanie wymiotne**, **hipomagnezemia**."}, {"q": "Czym różni się karboplatyna od cisplatyny?", "a": "Mniej nefro-, neuro- i ototoksyczna, słabiej wymiotna, ale **bardziej mielotoksyczna** (zwłaszcza trombocytopenia); dawkowana wg AUC (wzór Calverta)."}, {"q": "Jakie charakterystyczne działanie niepożądane ma oksaliplatyna?", "a": "**Neuropatia** – ostra, prowokowana **zimnem** (parestezje, skurcz krtani przy zimnych napojach) i przewlekła, zależna od dawki kumulacyjnej."}, {"q": "Po co podaje się folinian wapnia po dużych dawkach metotreksatu?", "a": "Jako „ratunek” (leucovorin rescue) – dostarcza **zredukowanych folianów** z pominięciem zablokowanej reduktazy dihydrofolianu, chroniąc zdrowe komórki."}, {"q": "Jaki jest mechanizm działania 5-fluorouracylu i kapecytabiny?", "a": "Metabolit (FdUMP) hamuje **syntazę tymidylanu** → brak tymidyny do syntezy DNA; kapecytabina to doustny prolek 5-FU."}, {"q": "Jakie są typowe działania niepożądane fluoropirymidyn?", "a": "Zapalenie śluzówek, **biegunka**, mielosupresja, **zespół ręka–stopa** (kapecytabina), **kardiotoksyczność** (skurcz naczyń wieńcowych)."}, {"q": "Jakie badanie zaleca EMA (2020) przed leczeniem 5-FU, kapecytabiną lub tegafurem?", "a": "Badanie **niedoboru dehydrogenazy dihydropirymidynowej (DPD)** – stężenie uracylu we krwi lub genotyp DPYD. Całkowity niedobór → **przeciwwskazanie**; częściowy → **zmniejszona dawka początkowa**."}, {"q": "Dlaczego allopurinol zwiększa toksyczność 6-merkaptopuryny i azatiopryny?", "a": "Hamuje **oksydazę ksantynową**, która unieczynnia te leki → kumulacja → ciężka **mielosupresja**; dawkę trzeba zmniejszyć o ok. 75%."}, {"q": "Jaki enzym należy oznaczyć przed leczeniem tiopurynami?", "a": "**TPMT** (metylotransferaza tiopurynowa; także NUDT15) – niedobór → ciężka mielotoksyczność."}, {"q": "Jaki jest mechanizm działania antracyklin?", "a": "**Interkalacja** do DNA, hamowanie **topoizomerazy II**, wytwarzanie **wolnych rodników** (odpowiedzialnych m.in. za kardiotoksyczność)."}, {"q": "Jakie jest najważniejsze działanie niepożądane antracyklin i jak się mu zapobiega?", "a": "**Kardiotoksyczność** zależna od dawki kumulacyjnej (kardiomiopatia, niewydolność serca). Zapobieganie: limit dawki, **monitorowanie EF** (echo), **deksrazoksan**."}, {"q": "Jakie jest charakterystyczne działanie niepożądane bleomycyny?", "a": "**Zwłóknienie płuc** (zależne od dawki kumulacyjnej, nasilane przez tlen w wysokich stężeniach); bleomycyna słabo hamuje szpik."}, {"q": "Jakie są dwa typy biegunki po irynotekanie i jak się je leczy?", "a": "**Wczesna** (w ciągu 24 h) – cholinergiczna → **atropina**. **Późna** (po > 24 h) – groźna, odwodnienie → **loperamid** w dużych dawkach, nawadnianie."}, {"q": "Które leki należą do inhibitorów topoizomerazy I, a które II?", "a": "**Topoizomeraza I**: pochodne kamptotecyny (irynotekan, topotekan). **Topoizomeraza II**: pochodne podofilotoksyny (etopozyd, tenipozyd), antracykliny."}, {"q": "Jaki jest mechanizm działania alkaloidów barwinka?", "a": "Wiążą tubulinę i **hamują polimeryzację mikrotubul** → zatrzymanie mitozy w metafazie."}, {"q": "Jakie jest główne działanie niepożądane winkrystyny i jaki błąd jest śmiertelny?", "a": "**Neuropatia obwodowa** (i autonomiczna – zaparcia, niedrożność porażenna); słabo hamuje szpik. **Podanie dokanałowe** (do płynu mózgowo-rdzeniowego) jest **śmiertelne**."}, {"q": "Jak działają taksoidy i jakie wymagają premedykacji?", "a": "**Stabilizują mikrotubule** (hamują depolimeryzację). Paklitaksel wymaga premedykacji **GKS + leki przeciwhistaminowe (H1, H2)** – ryzyko reakcji nadwrażliwości (rozpuszczalnik)."}, {"q": "Jak działa imatynib i w jakich nowotworach się go stosuje?", "a": "Inhibitor kinazy tyrozynowej **BCR-ABL** (oraz c-KIT, PDGFR) – **przewlekła białaczka szpikowa**, **GIST**."}, {"q": "Jakie jest charakterystyczne działanie niepożądane trastuzumabu?", "a": "**Kardiotoksyczność** (zwykle odwracalna dysfunkcja lewej komory) – kontrola EF; nie łączyć jednocześnie z antracyklinami."}, {"q": "Jakie są działania niepożądane bewacyzumabu?", "a": "**Nadciśnienie tętnicze**, białkomocz, krwawienia, **perforacja przewodu pokarmowego**, **upośledzone gojenie ran**, zakrzepica tętnicza."}, {"q": "Jakie ryzyko wiąże się z rytuksymabem u nosicieli HBV?", "a": "**Reaktywacja WZW B** (możliwa piorunująca niewydolność wątroby) – badać HBsAg i anty-HBc przed leczeniem, profilaktyka przeciwwirusowa."}, {"q": "Jakie działania niepożądane wywołują inhibitory punktów kontrolnych?", "a": "**Immunologiczne działania niepożądane (irAE)**: zapalenie jelita, wątroby, płuc, **przysadki**, zaburzenia **tarczycy**, cukrzyca typu 1, zmiany skórne – leczone **glikokortykosteroidami**."}, {"q": "Jakie są działania niepożądane tamoksyfenu?", "a": "**Żylna choroba zakrzepowo-zatorowa**, **rak endometrium** (działanie agonistyczne na macicę), uderzenia gorąca, zaćma; skuteczność zależy od CYP2D6 (endoksyfen)."}, {"q": "Jakie są działania niepożądane inhibitorów aromatazy?", "a": "**Osteoporoza** i złamania, **bóle stawów i mięśni**, uderzenia gorąca, dyslipidemia."}, {"q": "Dlaczego rasburykaza jest przeciwwskazana przy niedoborze G6PD?", "a": "Rozkład kwasu moczowego wytwarza **nadtlenek wodoru** → ciężka **hemoliza** i methemoglobinemia u osób z niedoborem G6PD."}, {"q": "Czym jest gorączka neutropeniczna i jak się ją leczy?", "a": "Neutrofile **< 500/µl** + temperatura **≥ 38,3°C** (lub ≥ 38°C utrzymująca się) – stan nagły; **natychmiastowa antybiotykoterapia szerokowidmowa** (np. piperacylina/tazobaktam, cefepim)."}, {"q": "Do czego służy deksrazoksan?", "a": "Do **ochrony serca** przed kardiotoksycznością antracyklin (chelator żelaza) oraz leczenia ich wynaczynienia."}], "sources": [{"t": "EMA – Fluorouracil and related substances (capecitabine, tegafur, flucytosine), referral (2020): badanie niedoboru DPD", "u": "https://www.ema.europa.eu/en/medicines/human/referrals/fluorouracil-and-fluorouracil-related-substances-capecitabine-tegafur-and-flucytosine-containing-medicinal-products"}]}, {"id": "f-cukrzyca", "num": "F20", "title": "Leki przeciwcukrzycowe: insuliny i leki doustne/inkretynowe", "summary": ["**Insuliny** dzieli się według czasu działania: **szybko działające analogi** (lispro, aspart, glulizyna; początek 10–15 min, zwykle bezpośrednio przed posiłkiem), **krótko działająca insulina ludzka** (rozpuszczalna, podawana 30 min przed posiłkiem; jako jedyna stosowana dożylnie), **o pośrednim czasie działania** (NPH, izofanowa, mętna, wymaga wymieszania) i **długo działające analogi** (glargina, detemir, degludek z t½ > 24 h; insulina bazalna bez szczytu działania). W cukrzycy typu 1 stosuje się intensywną insulinoterapię (baza i bolusy albo pompa). Działania niepożądane: **hipoglikemia**, przyrost masy ciała, lipohipertrofia w miejscach wstrzyknięć (dlatego trzeba je zmieniać) i **hipokaliemia** (insulina przesuwa K⁺ do komórek, co wykorzystuje się w leczeniu hiperkaliemii). W **kwasicy ketonowej** podaje się płyny, insulinę krótko działającą dożylnie we wlewie i potas, a wodorowęglany tylko przy pH < 6,9 (wg części wytycznych < 7,0).", "**Metformina** (biguanid) to lek pierwszego wyboru w cukrzycy typu 2. **Hamuje glukoneogenezę w wątrobie** (aktywuje AMPK, hamuje kompleks I łańcucha oddechowego) i zwiększa wrażliwość na insulinę. **Nie wywołuje hipoglikemii** i nie zwiększa masy ciała. Najczęstsze działania niepożądane to dolegliwości żołądkowo-jelitowe (biegunka, metaliczny posmak), a przy długim stosowaniu **niedobór witaminy B12**. Rzadkim, ale groźnym powikłaniem jest **kwasica mleczanowa**. Według EMA (2016) metformina jest **przeciwwskazana przy GFR < 30 ml/min**, przy GFR 30–59 zmniejsza się dawkę, a GFR kontroluje się co najmniej raz w roku. Lek odstawia się czasowo przy odwodnieniu (wymioty, biegunka, gorączka), w ostrych stanach z niedotlenieniem i przed podaniem jodowego środka kontrastowego.", "**Pochodne sulfonylomocznika** (gliklazyd, glimepiryd, glipizyd, glibenklamid) i **glinidy** (repaglinid, nateglinid) zamykają **kanały K-ATP** w komórkach β, co powoduje depolaryzację, napływ Ca²⁺ i **wydzielanie insuliny**. Zwiększają masę ciała i grożą **hipoglikemią**, zwłaszcza długo działające (glibenklamid) u osób starszych i z niewydolnością nerek. Hipoglikemia po pochodnych sulfonylomocznika bywa przedłużona i nawracająca, dlatego wymaga obserwacji szpitalnej. Glinidy działają krótko i przyjmuje się je do posiłków. **Glitazony** (pioglitazon) są agonistami **PPAR-γ** i zwiększają insulinowrażliwość. Wywołują retencję płynów i **niewydolność serca** (są w niej przeciwwskazane), przyrost masy ciała, **złamania** i obrzęk plamki, a pioglitazon zwiększa ryzyko raka pęcherza. Rozyglitazon wycofano. **Inhibitory α-glukozydazy** (akarboza) spowalniają trawienie węglowodanów i dają wzdęcia oraz biegunkę. W hipoglikemii przy akarbozie podaje się **glukozę**, a nie sacharozę.", "**Leki inkretynowe**: **agoniści receptora GLP-1** (liraglutyd, dulaglutyd, **semaglutyd** podskórnie raz w tygodniu albo doustnie, eksenatyd) i podwójny agonista GIP/GLP-1 (**tirzepatyd**). Zwiększają zależne od glukozy wydzielanie insuliny, hamują glukagon, spowalniają opróżnianie żołądka i zmniejszają łaknienie. Dają **znaczny spadek masy ciała** i zmniejszają ryzyko sercowo-naczyniowe (liraglutyd, semaglutyd, dulaglutyd). Działania niepożądane: nudności, wymioty, biegunka, ryzyko zapalenia trzustki i kamicy żółciowej. Są przeciwwskazane przy raku rdzeniastym tarczycy i MEN2 w wywiadzie. **Inhibitory DPP-4** (sitagliptyna, wildagliptyna, saksagliptyna, linagliptyna, alogliptyna) hamują rozkład endogennego GLP-1. Są neutralne dla masy ciała i nie powodują hipoglikemii w monoterapii. Rzadko wywołują zapalenie trzustki, pemfigoid i bóle stawów, a saksagliptyna zwiększa liczbę hospitalizacji z powodu niewydolności serca.", "**Inhibitory SGLT2** (dapagliflozyna, empagliflozyna, kanagliflozyna, ertugliflozyna) hamują **wchłanianie zwrotne glukozy w kanaliku proksymalnym** (glukozuria). Obniżają masę ciała i RR oraz chronią serce i nerki: zmniejszają liczbę hospitalizacji z powodu niewydolności serca i spowalniają postęp przewlekłej choroby nerek, także u osób bez cukrzycy. Działania niepożądane: **zakażenia narządów płciowych** (grzybicze) i dróg moczowych, odwodnienie i hipotensja, zgorzel Fourniera (rzadko) oraz **kwasica ketonowa**, często **euglikemiczna**. Według EMA (2016) lek odstawia się czasowo przed dużym zabiegiem i w ostrej ciężkiej chorobie. **Wybór leku w cukrzycy typu 2** (zalecenia PTD): metformina, a u chorych z chorobą układu sercowo-naczyniowego, niewydolnością serca lub przewlekłą chorobą nerek, niezależnie od HbA1c, **SGLT2i lub GLP-1 RA** o udowodnionych korzyściach. Glukagon (domięśniowo, podskórnie lub donosowo) stosuje się w ciężkiej hipoglikemii, gdy nie można podać glukozy dożylnie."], "review": [{"h": "Insuliny", "items": ["**Szybko działające analogi**: lispro, aspart (też ultraszybki), glulizyna – początek 10–15 min, szczyt 1–2 h, 3–5 h; do posiłku", "**Krótko działająca ludzka (rozpuszczalna)** – 30 min przed posiłkiem; jedyna rutynowo **i.v.** (wlew w kwasicy ketonowej, OIT)", "**NPH (izofanowa)** – pośrednia, szczyt 4–8 h, 12–18 h; zawiesina – wymieszać", "**Długo działające analogi**: **glargina** (U100, U300), **detemir**, **degludek** (> 42 h) – baza bez szczytu", "Mieszanki (np. 30/70) – cukrzyca typu 2", "Działania: **hipoglikemia**, przyrost masy, **lipohipertrofia** (rotacja miejsc), reakcje miejscowe, **hipokaliemia**, obrzęki insulinowe", "Insulina + glukoza – leczenie **hiperkaliemii**", "Kwasica ketonowa: płyny (0,9% NaCl), **insulina i.v. we wlewie**, **potas** (gdy K⁺ < 5,3), korekta przyczyny"]}, {"h": "Metformina", "items": ["Biguanid; **↓ glukoneogenezy wątrobowej** (AMPK, kompleks I), ↑ insulinowrażliwości, ↓ wchłaniania glukozy", "I wybór w cukrzycy typu 2; **nie wywołuje hipoglikemii**, neutralna/↓ masy", "Działania: biegunka, nudności, metaliczny posmak (wolne zwiększanie dawki, postać XR), **niedobór B12**", "**Kwasica mleczanowa** – rzadka, ciężka", "EMA 2016: **przeciwwskazana przy GFR < 30**; GFR 30–59 – **↓ dawki**; GFR oceniać przed leczeniem i **≥ raz w roku**", "Czasowo odstawić: **odwodnienie** (wymioty, biegunka, gorączka, upał), ostre stany z hipoksją (wstrząs, sepsa, niewydolność oddechowa), **jodowe środki kontrastowe**, duże zabiegi; alkoholizm, niewydolność wątroby"]}, {"h": "Pochodne sulfonylomocznika, glinidy, glitazony, akarboza", "items": ["**PSM**: **gliklazyd**, **glimepiryd**, glipizyd, **glibenklamid** – zamykają **K-ATP** komórek β (SUR1) → wydzielanie insuliny", "PSM: **hipoglikemia** (przedłużona, nawracająca – obserwacja szpitalna; glibenklamid, seniorzy, niewydolność nerek), ↑ masy; reakcje krzyżowe z sulfonamidami", "**Glinidy**: repaglinid, nateglinid – krótko, do posiłków; mniejsze ryzyko przedłużonej hipoglikemii; repaglinid + gemfibrozyl (CYP2C8) – przeciwwskazane", "**Pioglitazon** – agonista **PPAR-γ** (↑ insulinowrażliwości w tkance tłuszczowej i mięśniach); **retencja płynów, niewydolność serca** (przeciwwskazany), ↑ masy, **złamania** (kobiety), obrzęk plamki, rak pęcherza; rozyglitazon – wycofany", "**Akarboza** – inhibitor **α-glukozydazy** jelitowej: ↓ poposiłkowej glikemii; **wzdęcia**, biegunka; hipoglikemię leczyć **glukozą** (nie sacharozą)"]}, {"h": "Leki inkretynowe", "items": ["**Agoniści GLP-1**: liraglutyd (1×/d), dulaglutyd, **semaglutyd** (1×/tydz. s.c. lub p.o.), eksenatyd; **tirzepatyd** – agonista **GIP/GLP-1**", "Działanie: ↑ wydzielania insuliny **zależne od glukozy**, ↓ glukagonu, **spowolnienie opróżniania żołądka**, ↓ łaknienia → **↓ masy ciała**", "Korzyści sercowo-naczyniowe (liraglutyd, semaglutyd, dulaglutyd); leczenie **otyłości**", "Działania: **nudności, wymioty**, biegunka, zaparcia, **zapalenie trzustki**, kamica żółciowa, ↑ HR; retinopatia (szybka poprawa glikemii)", "Przeciwwskazania: **rak rdzeniasty tarczycy**/MEN2 w wywiadzie, zapalenie trzustki; ostrożnie w gastroparezie; ryzyko aspiracji w znieczuleniu", "**Inhibitory DPP-4**: sitagliptyna, wildagliptyna (hepatotoksyczność – kontrola AlAT), saksagliptyna (↑ hospitalizacji z powodu HF), **linagliptyna** (bez korekty w niewydolności nerek), alogliptyna", "DPP-4i: neutralne dla masy, **bez hipoglikemii** w monoterapii; rzadko zapalenie trzustki, **pemfigoid pęcherzowy**, bóle stawów"]}, {"h": "Inhibitory SGLT2", "items": ["**Dapagliflozyna, empagliflozyna**, kanagliflozyna, ertugliflozyna", "Hamują **SGLT2 w kanaliku proksymalnym** → **glukozuria**, natriureza, diureza osmotyczna", "↓ HbA1c (słabiej przy niskim GFR), **↓ masy ciała, ↓ RR**", "**Ochrona serca i nerek**: ↓ hospitalizacji z powodu **niewydolności serca** (HFrEF i HFpEF), spowolnienie **PChN** – także bez cukrzycy", "Działania: **zakażenia grzybicze narządów płciowych**, ZUM, odwodnienie, hipotensja, **zgorzel Fourniera** (rzadko), ↑ hematokrytu", "**Kwasica ketonowa**, często **euglikemiczna** (EMA 2016): podejrzewać mimo niewysokiej glikemii; **odstawić przed dużym zabiegiem i w ostrej ciężkiej chorobie**; po DKA nie wznawiać bez wyjaśnienia przyczyny", "↓ stężenia **litu**"]}, {"h": "Strategia i hipoglikemia", "items": ["Cukrzyca typu 2: **metformina** + zmiana stylu życia", "Choroba sercowo-naczyniowa / wysokie ryzyko, **niewydolność serca, PChN** → **SGLT2i** lub **GLP-1 RA** niezależnie od HbA1c", "Otyłość – preferencja GLP-1 RA / tirzepatydu", "Hipoglikemia przytomna: 15–20 g glukozy doustnie, kontrola po 15 min", "Hipoglikemia nieprzytomna: **glukoza 20% i.v.**; gdy brak dostępu – **glukagon** i.m./s.c. lub donosowo (nieskuteczny przy wyczerpanym glikogenie – alkohol, głodzenie)", "β-blokery maskują objawy adrenergiczne hipoglikemii"]}], "cards": [{"q": "Które insuliny są szybko działającymi analogami i kiedy się je podaje?", "a": "**Lispro, aspart, glulizyna** – początek po 10–15 min; podawane **bezpośrednio przed posiłkiem** (lub tuż po)."}, {"q": "Którą insulinę podaje się dożylnie, np. w kwasicy ketonowej?", "a": "**Krótko działającą insulinę ludzką (rozpuszczalną)** we wlewie dożylnym (analogi szybkie też można, ale standardem jest insulina ludzka)."}, {"q": "Jakie insuliny pełnią rolę bazalną?", "a": "**NPH** (pośrednia, ze szczytem) oraz długo działające analogi: **glargina, detemir, degludek** (bez wyraźnego szczytu)."}, {"q": "Jakie są działania niepożądane insulinoterapii?", "a": "**Hipoglikemia**, przyrost masy ciała, **lipohipertrofia** w miejscach wstrzyknięć, **hipokaliemia**, obrzęki insulinowe, reakcje miejscowe."}, {"q": "Dlaczego insulinę z glukozą stosuje się w hiperkaliemii?", "a": "Insulina aktywuje **Na⁺/K⁺-ATPazę** → przesuwa **potas do komórek** (glukoza zapobiega hipoglikemii)."}, {"q": "Jakie są główne elementy leczenia kwasicy ketonowej?", "a": "**Płyny** (nawodnienie), **insulina krótko działająca i.v. we wlewie**, **suplementacja potasu**, leczenie przyczyny; wodorowęglany tylko w ciężkiej kwasicy."}, {"q": "Jaki jest mechanizm działania metforminy?", "a": "**Hamuje glukoneogenezę w wątrobie** (aktywacja AMPK, hamowanie kompleksu I łańcucha oddechowego), zwiększa insulinowrażliwość tkanek obwodowych."}, {"q": "Dlaczego metformina nie wywołuje hipoglikemii?", "a": "Nie zwiększa wydzielania insuliny – działa przez ↓ produkcji glukozy w wątrobie i ↑ insulinowrażliwości."}, {"q": "Jakie są działania niepożądane metforminy?", "a": "Dolegliwości żołądkowo-jelitowe (**biegunka**, nudności, metaliczny posmak), **niedobór witaminy B12**; rzadko **kwasica mleczanowa**."}, {"q": "Przy jakim GFR metformina jest przeciwwskazana wg EMA (2016)?", "a": "Przy **GFR < 30 ml/min**; przy GFR 30–59 – zmniejszona dawka; GFR kontrolować co najmniej raz w roku."}, {"q": "Kiedy należy czasowo odstawić metforminę?", "a": "Przy **odwodnieniu** (wymioty, biegunka, gorączka), ostrych stanach z niedotlenieniem (sepsa, wstrząs), przed **jodowym środkiem kontrastowym** i dużym zabiegiem."}, {"q": "Jaki jest mechanizm działania pochodnych sulfonylomocznika?", "a": "Wiążą **SUR1** i zamykają **kanały K-ATP** komórek β → depolaryzacja → napływ Ca²⁺ → **wydzielanie insuliny**."}, {"q": "Dlaczego hipoglikemia po pochodnych sulfonylomocznika wymaga hospitalizacji?", "a": "Może być **przedłużona i nawracająca** (długi czas działania, zwłaszcza glibenklamid, niewydolność nerek, seniorzy) – konieczna wielogodzinna obserwacja."}, {"q": "Czym różnią się glinidy od pochodnych sulfonylomocznika?", "a": "Też zamykają K-ATP, ale działają **szybko i krótko** – przyjmowane do posiłków (kontrola glikemii poposiłkowej), mniejsze ryzyko przedłużonej hipoglikemii."}, {"q": "Jaki jest mechanizm działania pioglitazonu?", "a": "Agonista receptora jądrowego **PPAR-γ** → ↑ wrażliwości na insulinę (tkanka tłuszczowa, mięśnie, wątroba)."}, {"q": "Jakie są działania niepożądane i przeciwwskazania pioglitazonu?", "a": "**Retencja płynów, obrzęki, niewydolność serca** (przeciwwskazany), przyrost masy, **złamania**, obrzęk plamki, ryzyko raka pęcherza moczowego."}, {"q": "Jak działa akarboza i jak leczyć hipoglikemię u pacjenta ją przyjmującego?", "a": "Hamuje **α-glukozydazy** jelitowe (wolniejsze trawienie węglowodanów). Hipoglikemię leczy się **glukozą** – sacharoza nie zostanie rozłożona."}, {"q": "Jaki jest mechanizm działania agonistów receptora GLP-1?", "a": "↑ wydzielania insuliny **zależnie od glukozy**, ↓ wydzielania glukagonu, **spowolnienie opróżniania żołądka**, ↓ łaknienia (ośrodkowo)."}, {"q": "Jakie korzyści, poza obniżeniem glikemii, dają agoniści GLP-1?", "a": "**Znaczny spadek masy ciała** (leczenie otyłości), zmniejszenie ryzyka sercowo-naczyniowego (liraglutyd, semaglutyd, dulaglutyd), ↓ RR."}, {"q": "Jakie są działania niepożądane agonistów GLP-1?", "a": "**Nudności, wymioty**, biegunka/zaparcia, **zapalenie trzustki**, kamica żółciowa, przyspieszenie HR; ryzyko aspiracji przy znieczuleniu (opóźnione opróżnianie żołądka)."}, {"q": "Kiedy agoniści GLP-1 są przeciwwskazani?", "a": "Przy **raku rdzeniastym tarczycy** lub **zespole MEN2** w wywiadzie (osobniczym lub rodzinnym), przebytym zapaleniu trzustki."}, {"q": "Jaki lek jest podwójnym agonistą GIP i GLP-1?", "a": "**Tirzepatyd** (cukrzyca typu 2, otyłość)."}, {"q": "Jak działają inhibitory DPP-4?", "a": "Hamują dipeptydylopeptydazę 4 → ↓ rozkładu endogennych **inkretyn (GLP-1, GIP)** → ↑ insuliny i ↓ glukagonu zależnie od glukozy."}, {"q": "Jakie są cechy kliniczne inhibitorów DPP-4?", "a": "Neutralne dla masy ciała, **bez hipoglikemii w monoterapii**, dobrze tolerowane; rzadko zapalenie trzustki, pemfigoid; saksagliptyna – ↑ hospitalizacji z powodu HF; linagliptyna – bez korekty dawki w niewydolności nerek."}, {"q": "Jaki jest mechanizm działania inhibitorów SGLT2?", "a": "Hamują kotransporter **sodowo-glukozowy 2** w kanaliku proksymalnym → **↓ wchłaniania zwrotnego glukozy** → glukozuria, natriureza."}, {"q": "Jakie korzyści pozaglikemiczne mają inhibitory SGLT2?", "a": "**↓ hospitalizacji z powodu niewydolności serca** (HFrEF i HFpEF), spowolnienie **przewlekłej choroby nerek**, ↓ masy ciała i RR – także u osób bez cukrzycy."}, {"q": "Jakie są działania niepożądane inhibitorów SGLT2?", "a": "**Zakażenia grzybicze narządów płciowych**, zakażenia dróg moczowych, odwodnienie, hipotensja, **zgorzel Fourniera** (rzadko), **kwasica ketonowa** (często euglikemiczna)."}, {"q": "Czym jest euglikemiczna kwasica ketonowa i jak jej zapobiegać przy SGLT2i (EMA 2016)?", "a": "Kwasica ketonowa przy **niezbyt wysokiej glikemii** – łatwa do przeoczenia. Zapobieganie: **czasowe odstawienie leku przed dużym zabiegiem i w ostrej ciężkiej chorobie**; ostrożność przy ↓ rezerwy insulinowej, ograniczeniu jedzenia, odwodnieniu."}, {"q": "Które leki przeciwcukrzycowe należy wybrać u chorego z cukrzycą typu 2 i chorobą sercowo-naczyniową lub PChN?", "a": "**Inhibitor SGLT2** lub **agonistę GLP-1** o udowodnionych korzyściach – niezależnie od HbA1c (zwykle obok metforminy)."}, {"q": "Jak leczy się ciężką hipoglikemię u nieprzytomnego pacjenta?", "a": "**Glukoza 20% i.v.**; jeśli brak dostępu żylnego – **glukagon** i.m./s.c. (1 mg) lub donosowo."}, {"q": "Kiedy glukagon może być nieskuteczny w hipoglikemii?", "a": "Gdy **zapasy glikogenu wątrobowego są wyczerpane** – głodzenie, alkoholizm, niewydolność wątroby, przedłużona hipoglikemia po PSM."}], "sources": [{"t": "EMA – Metformin and metformin-containing medicines, referral (2016): stosowanie przy obniżonym GFR", "u": "https://www.ema.europa.eu/en/medicines/human/referrals/metformin-metformin-containing-medicines"}, {"t": "EMA – SGLT2 inhibitors, referral (2016): ryzyko kwasicy ketonowej", "u": "https://www.ema.europa.eu/en/medicines/human/referrals/sglt2-inhibitors"}]}, {"id": "f-lipidy", "num": "F21", "title": "Leki hipolipemizujące, stosowane w osteoporozie i w otyłości", "summary": ["**
