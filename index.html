pertermia, sucha skóra, zaczerwienienie, rozszerzone źrenice, majaczenie**; do tego tachykardia, zatrzymanie moczu, porażenna niedrożność."}, {"q": "Dlaczego w zatruciu atropiną występuje hipertermia?", "a": "Bo zablokowane jest **pocenie się** – gruczoły potowe są unerwione przez cholinergiczne włókna współczulne (receptory M3)."}, {"q": "Jakie leki i rośliny mogą wywołać zespół antycholinergiczny?", "a": "Atropina, **pokrzyk wilcza jagoda, bieluń**, **TLPD**, leki przeciwhistaminowe I generacji (difenhydramina), fenotiazyny, leki przeciwparkinsonowskie (biperyden), cholinolityki urologiczne."}, {"q": "Jaka jest odtrutka w ciężkim zatruciu cholinolitykami?", "a": "**Fizostygmina** (przenika do OUN). Ostrożnie / przeciwwskazana w zatruciu TLPD z poszerzeniem QRS (ryzyko bradyarytmii i asystolii)."}, {"q": "Jakie są przeciwwskazania do stosowania cholinolityków?", "a": "**Jaskra z wąskim kątem przesączania**, przerost gruczołu krokowego z zaleganiem moczu, niedrożność przewodu pokarmowego, tachyarytmie, **miastenia**."}, {"q": "Jak działa wareniklina i cytyzyna?", "a": "**Częściowi agoniści** receptora nikotynowego **α4β2** – łagodzą objawy odstawienia i zmniejszają przyjemność z palenia (leczenie uzależnienia od nikotyny)."}, {"q": "Jaki jest mechanizm działania toksyny botulinowej?", "a": "Rozszczepia białka **SNARE** (np. SNAP-25) → blokuje egzocytozę i **uwalnianie acetylocholiny** z zakończeń nerwowych."}, {"q": "Jakie są wskazania do terapeutycznego stosowania toksyny botulinowej?", "a": "Dystonie (kręcz szyi, kurcz powiek), **spastyczność**, nadmierna potliwość, pęcherz nadreaktywny, przewlekła migrena, zabiegi kosmetyczne."}]}, {"id": "f-adrenergiczne", "num": "F8", "title": "Leki układu adrenergicznego: katecholaminy, sympatykomimetyki, α- i β-adrenolityki, sympatykolityki", "summary": ["**Noradrenalina** powstaje z tyrozyny (tyrozyna → DOPA → dopamina → noradrenalina; w rdzeniu nadnerczy dalej adrenalina). Jej działanie kończy głównie **wychwyt zwrotny** (NET, uptake-1, blokowany przez kokainę i TLPD), a rozkładają ją **MAO** i **COMT** do kwasu wanilinomigdałowego. Receptory: **α1** (Gq: skurcz naczyń, zwieracza pęcherza, rozszerzenie źrenicy), **α2** (Gi: presynaptyczne hamowanie uwalniania NA, ośrodkowe obniżenie aktywności współczulnej, hamowanie wydzielania insuliny), **β1** (Gs: serce, czyli efekt chronotropowy, inotropowy i dromotropowy dodatni, oraz uwalnianie reniny), **β2** (Gs: rozkurcz oskrzeli, macicy i naczyń mięśni szkieletowych, glikogenoliza, wychwyt K⁺ do komórek, drżenie mięśni) i **β3** (lipoliza, rozkurcz wypieracza pęcherza; mirabegron).", "**Katecholaminy** działają krótko, podaje się je pozajelitowo i nie przenikają do OUN. **Adrenalina** pobudza α i β. Jest lekiem z wyboru we **wstrząsie anafilaktycznym** (**0,5 mg i.m.** w przednio-boczną część uda u dorosłego, 0,01 mg/kg u dzieci) i w zatrzymaniu krążenia (1 mg i.v.), a dodaje się ją też do leków miejscowo znieczulających. **Noradrenalina** pobudza głównie α1 i β1 i jest lekiem pierwszego wyboru we **wstrząsie septycznym**. **Dopamina** działa zależnie od dawki (D1, potem β1, potem α1). **Dobutamina** to głównie β1 (inotropowo dodatnio, w niewydolności serca z małym rzutem). **Izoprenalina** to β1 i β2. Bezpośrednie sympatykomimetyki niekatecholaminowe to fenylefryna (α1, w kroplach do nosa i oczu oraz w hipotensji), midodryna (α1, hipotensja ortostatyczna) i ksylometazolina z oksymetazoliną (α, obkurczające błonę śluzową nosa; po > 5–7 dniach grożą polekowym nieżytem nosa). **Pośrednio działające**: efedryna i pseudoefedryna (uwalniają NA, wykazują tachyfilaksję), amfetamina, metylofenidat (ADHD) oraz kokaina (blokuje wychwyt).", "**β2-mimetyki**: krótko działające (**SABA**: salbutamol, fenoterol, terbutalina) w doraźnym leczeniu skurczu oskrzeli oraz długo działające (**LABA**: salmeterol, formoterol, który ma szybki początek działania, a także indakaterol, olodaterol i wilanterol). W astmie LABA stosuje się **zawsze z wziewnym GKS**. Działania niepożądane: **drżenie mięśni**, tachykardia, kołatanie serca, **hipokaliemia** i hiperglikemia. Według EMA (2013) doustnych i doodbytniczych SABA nie stosuje się już we wskazaniach położniczych, a postacie pozajelitowe hamują poród przedwczesny tylko między 22. a 37. tygodniem, maksymalnie przez 48 h, pod nadzorem i z monitorowaniem, z powodu ryzyka sercowo-naczyniowego. **α2-agoniści ośrodkowi**: klonidyna, **metyldopa** (nadciśnienie w ciąży), moksonidyna (agonista receptorów imidazolinowych I1), deksmedetomidyna (sedacja) i brymonidyna (jaskra). Klonidyna odstawiona nagle wywołuje **nadciśnienie z odbicia**.", "**α-adrenolityki**: nieselektywne (fentolamina i fenoksybenzamina, ta druga nieodwracalna, stosowana przed operacją **guza chromochłonnego**) oraz selektywne α1 (**doksazosyna**, prazosyna, terazosyna w nadciśnieniu i łagodnym rozroście prostaty; **tamsulosyna** i alfuzosyna wybiórczo α1A w prostacie). Typowe działanie niepożądane to **hipotonia ortostatyczna po pierwszej dawce**. Tamsulosyna może wywołać zespół wiotkiej tęczówki podczas operacji zaćmy. **β-adrenolityki** dzieli się według: **kardioselektywności** (β1: metoprolol, bisoprolol, atenolol, nebiwolol, betaksolol; nieselektywne: propranolol, sotalol, timolol, karwedilol), **wewnętrznej aktywności sympatykomimetycznej** (pindolol, acebutolol), działania rozszerzającego naczynia (karwedilol i labetalol przez blokadę α1, nebiwolol przez uwalnianie NO) oraz rozpuszczalności (lipofilny propranolol przenika do OUN). Sotalol dodatkowo blokuje kanały K⁺ (III klasa antyarytmików).", "Wskazania β-blokerów: nadciśnienie, **choroba wieńcowa** i stan po zawale, **przewlekła niewydolność serca z obniżoną frakcją wyrzutową** (tylko bisoprolol, metoprolol o przedłużonym uwalnianiu, karwedilol i nebiwolol, od małych dawek), tachyarytmie, nadczynność tarczycy (propranolol), profilaktyka migreny, drżenie samoistne, lęk sytuacyjny, **jaskra** (timolol) i nadciśnienie wrotne. Działania niepożądane: bradykardia i bloki AV, **skurcz oskrzeli** (nieselektywne), zaostrzenie objawów choroby tętnic obwodowych, zmęczenie, zaburzenia erekcji, **maskowanie objawów hipoglikemii** (tachykardii, drżenia) i zaburzenia lipidowe. Nagłe odstawienie grozi **zespołem z odbicia** (niedokrwienie, zawał). Przeciwwskazania: astma (nieselektywne), blok AV II–III stopnia, ciężka bradykardia, ostra niewyrównana niewydolność serca, wstrząs kardiogenny i nieleczony guz chromochłonny (najpierw podaje się α-bloker). W zatruciu β-blokerami stosuje się **glukagon**, atropinę, katecholaminy i duże dawki insuliny z glukozą. **Sympatykolityki** (rezerpina opróżniająca pęcherzyki przez VMAT, guanetydyna) mają dziś znaczenie historyczne."], "review": [{"h": "Receptory adrenergiczne", "items": ["**α1** (Gq) – skurcz naczyń, zwieracza pęcherza, prostaty, **rozszerzenie źrenicy** (m. rozszerzający)", "**α2** (Gi) – presynaptycznie ↓ uwalniania NA; ośrodkowo ↓ napięcia współczulnego; ↓ insuliny; agregacja płytek", "**β1** (Gs) – serce: ↑ HR, ↑ kurczliwości, ↑ przewodzenia AV; **↑ reniny**", "**β2** (Gs) – rozkurcz oskrzeli, macicy, naczyń mięśni; glikogenoliza; **↑ wychwytu K⁺** do komórek; drżenie mięśni", "**β3** – lipoliza; rozkurcz wypieracza (**mirabegron** – pęcherz nadreaktywny)", "Synteza: tyrozyna → (hydroksylaza tyrozynowa – etap ograniczający) DOPA → dopamina → NA → (PNMT, nadnercza) adrenalina", "Unieczynnianie: **wychwyt zwrotny NET** (kokaina, TLPD), MAO, COMT → VMA"]}, {"h": "Katecholaminy", "items": ["**Adrenalina** (α1, α2, β1, β2): **anafilaksja – 0,5 mg i.m.** (udo; dzieci 0,01 mg/kg), zatrzymanie krążenia **1 mg i.v.** co 3–5 min, z miejscowymi anestetykami (↓ wchłaniania), ciężka astma", "Mała dawka adrenaliny – przewaga β2 (↓ oporu obwodowego); duża – α1 (↑ RR)", "**Noradrenalina** (α1 > β1, słabo β2): **wstrząs septyczny** (I wybór), odruchowa bradykardia", "**Dopamina**: małe dawki D1 (nerki – efekt wątpliwy), średnie β1, duże α1", "**Dobutamina** (β1 > β2, α1): inotropowo dodatnio – wstrząs kardiogenny, ostra niewydolność serca, test obciążeniowy", "**Izoprenalina** (β1 + β2): bradykardia, blok AV (rzadko)", "Katecholaminy: krótki t½ (COMT, MAO), nieaktywne p.o., nie przenikają do OUN; wynaczynienie NA → martwica (fentolamina miejscowo)"]}, {"h": "Sympatykomimetyki niekatecholaminowe", "items": ["**Fenylefryna** (α1) – krople do nosa/oczu (mydriaza bez cykloplegii), hipotensja w anestezji", "**Midodryna** (α1, prolek) – hipotonia ortostatyczna", "**Ksylometazolina, oksymetazolina, nafazolina** (α) – obkurczanie śluzówki nosa; > 5–7 dni → **polekowy nieżyt nosa**; u niemowląt – depresja OUN", "**Efedryna, pseudoefedryna** – pośrednio (uwalnianie NA) + bezpośrednio; **tachyfilaksja**; ↑ RR, bezsenność, zatrzymanie moczu", "**Amfetamina, metylofenidat, lisdeksamfetamina** – uwalnianie/blokada wychwytu DA i NA; **ADHD**, narkolepsja", "**Kokaina** – blokuje wychwyt NA, DA, 5-HT; miejscowo znieczulająca i obkurczająca naczynia", "**Mirabegron** (β3) – pęcherz nadreaktywny"]}, {"h": "β2-mimetyki", "items": ["**SABA**: salbutamol, fenoterol, terbutalina – doraźnie, początek w minutach, 4–6 h", "**LABA**: **salmeterol** (powolny początek), **formoterol** (szybki początek – może być doraźnie w schemacie z budezonidem), indakaterol, olodaterol, wilanterol (ultra-LABA, 24 h)", "W astmie **LABA zawsze z wziewnym GKS** (monoterapia LABA ↑ ryzyko zgonu z powodu astmy)", "Działania: **drżenie mięśni**, tachykardia, kołatania, **hipokaliemia**, hiperglikemia, kwasica mleczanowa, niepokój; tolerancja (↓ regulacja receptorów)", "Hipokaliemia β2 – wykorzystywana w leczeniu **hiperkaliemii** (salbutamol nebulizacja)", "EMA 2013: SABA p.o. i doodbytniczo – **nie w położnictwie**; pozajelitowo: hamowanie porodu przedwczesnego tylko **22.–37. tydz., max 48 h**, nadzór, monitorowanie; przeciwwskazane przy chorobach serca"]}, {"h": "Agoniści α2 (ośrodkowo działające)", "items": ["**Klonidyna** – nadciśnienie, objawy odstawienia opioidów/alkoholu, ADHD; **nagłe odstawienie → przełom nadciśnieniowy z odbicia**; suchość w ustach, senność", "**Metyldopa** – prolek (α-metylonoradrenalina); **nadciśnienie u kobiet w ciąży**; dodatni odczyn Coombsa, hemoliza, hepatotoksyczność, sedacja", "**Moksonidyna** – agonista receptorów **imidazolinowych I1** (mniej sedacji)", "**Deksmedetomidyna** – sedacja na OIT (bez depresji oddechowej)", "**Brymonidyna, apraklonidyna** – jaskra (↓ produkcji cieczy wodnistej)", "Tyzanidyna – α2, zmniejsza napięcie mięśni (spastyczność)"]}, {"h": "α-adrenolityki", "items": ["Nieselektywne: **fentolamina** (odwracalna – przełom w guzie chromochłonnym, wynaczynienie NA), **fenoksybenzamina** (nieodwracalna – przygotowanie do operacji **guza chromochłonnego**)", "Selektywne α1: **doksazosyna, prazosyna, terazosyna** – nadciśnienie (lek dodany), **łagodny rozrost prostaty** (↓ napięcia mięśni gładkich)", "Uroselektywne α1A: **tamsulosyna, alfuzosyna, sylodosyna** – BPH, wydalanie kamieni moczowodowych", "Działania: **hipotonia ortostatyczna i omdlenie po pierwszej dawce** (zaczynać wieczorem, mała dawka), odruchowa tachykardia, zawroty, obrzęk błony śluzowej nosa, zaburzenia ejakulacji", "Tamsulosyna – **śródoperacyjny zespół wiotkiej tęczówki** (operacja zaćmy)", "Guz chromochłonny: najpierw **α-bloker**, dopiero potem β-bloker (inaczej – nieprzeciwstawiona stymulacja α → przełom nadciśnieniowy)"]}, {"h": "β-adrenolityki – podział", "items": ["**Kardioselektywne (β1)**: metoprolol, **bisoprolol**, atenolol, **nebiwolol**, betaksolol, esmolol (i.v., bardzo krótko – esterazy)", "**Nieselektywne**: **propranolol**, sotalol, timolol, nadolol, pindolol", "**Z blokadą α1** (rozszerzają naczynia): **karwedilol, labetalol** (nadciśnienie w ciąży, przełom nadciśnieniowy)", "Nebiwolol – rozszerza naczynia przez **NO**", "**ISA** (wewnętrzna aktywność sympatykomimetyczna): pindolol, acebutolol – mniejsza bradykardia, nie po zawale", "Lipofilne (OUN, metabolizm wątrobowy): propranolol, metoprolol; hydrofilne (nerki): atenolol, nadolol", "**Sotalol** – β-bloker + klasa III (blokada K⁺, wydłuża QT)"]}, {"h": "β-adrenolityki – kliniczne", "items": ["Wskazania: nadciśnienie, **choroba wieńcowa**, po zawale, **HFrEF** (bisoprolol, metoprolol CR/XL, karwedilol, nebiwolol – start małą dawką), migotanie przedsionków (kontrola rytmu komór), nadczynność tarczycy, migrena (profilaktyka), drżenie samoistne, lęk sytuacyjny, **jaskra** (timolol), nadciśnienie wrotne (propranolol), naczyniaki niemowlęce (propranolol)", "Działania: bradykardia, bloki AV, hipotensja, **skurcz oskrzeli**, zimne kończyny, zmęczenie, koszmary (lipofilne), zaburzenia erekcji, **maskowanie hipoglikemii**, ↑ TG i ↓ HDL", "Nagłe odstawienie → **zespół z odbicia** (tachykardia, niedokrwienie, zawał) – odstawiać stopniowo", "Przeciwwskazania: astma (nieselektywne; selektywne ostrożnie), **blok AV II–III°**, ciężka bradykardia, SSS, ostra niewyrównana niewydolność serca, wstrząs kardiogenny, nieleczony guz chromochłonny, ciężka choroba tętnic obwodowych", "Interakcje: **werapamil/diltiazem i.v.** (asystolia, blok), digoksyna, amiodaron (bradykardia); insulina (maskowanie hipoglikemii)", "Zatrucie: bradykardia, hipotensja, hipoglikemia, drgawki (propranolol) → **glukagon** (↑ cAMP z pominięciem receptora β), atropina, katecholaminy, insulina + glukoza (HIET), stymulacja"]}], "cards": [{"q": "Jakie są skutki pobudzenia receptora α1?", "a": "Skurcz mięśni gładkich naczyń (↑ RR), zwieracza pęcherza i prostaty, **rozszerzenie źrenicy** (m. rozszerzający źrenicę). Sprzężenie z Gq."}, {"q": "Jaką rolę pełni presynaptyczny receptor α2?", "a": "Hamuje uwalnianie noradrenaliny (ujemne sprzężenie zwrotne); ośrodkowo **zmniejsza napięcie współczulne** (klonidyna, metyldopa)."}, {"q": "Jakie są efekty pobudzenia receptora β1?", "a": "↑ częstości serca, ↑ kurczliwości, ↑ przewodzenia AV (dromotropowo +) oraz **↑ uwalniania reniny** z nerek."}, {"q": "Jakie są efekty pobudzenia receptora β2?", "a": "Rozkurcz oskrzeli, macicy i naczyń mięśni szkieletowych, glikogenoliza, **przesunięcie K⁺ do komórek** (hipokaliemia), drżenie mięśni szkieletowych."}, {"q": "Który enzym jest etapem ograniczającym syntezę katecholamin?", "a": "**Hydroksylaza tyrozynowa** (tyrozyna → L-DOPA)."}, {"q": "Jaki jest główny mechanizm kończący działanie noradrenaliny w synapsie?", "a": "**Wychwyt zwrotny** do zakończenia neuronu przez transporter NET (uptake-1) – blokowany przez kokainę i TLPD. Rozkład: MAO i COMT."}, {"q": "Jaka jest dawka i droga podania adrenaliny we wstrząsie anafilaktycznym u dorosłego?", "a": "**0,5 mg (0,5 ml roztworu 1 mg/ml) domięśniowo** w przednio-boczną część uda; można powtórzyć po 5 min. U dzieci 0,01 mg/kg."}, {"q": "Jaka jest dawka adrenaliny w zatrzymaniu krążenia?", "a": "**1 mg i.v./i.o.** co 3–5 minut."}, {"q": "Dlaczego adrenalinę dodaje się do leków miejscowo znieczulających?", "a": "Obkurcza naczynia (α1) → **spowalnia wchłanianie** anestetyku: wydłuża działanie, zmniejsza toksyczność ogólną i krwawienie. Nie stosować na palce, nos, uszy, prącie (martwica)."}, {"q": "Który lek wazopresyjny jest pierwszego wyboru we wstrząsie septycznym?", "a": "**Noradrenalina**."}, {"q": "Jak dawka dopaminy wpływa na jej działanie?", "a": "Małe dawki – receptory **D1** (rozszerzenie naczyń nerkowych, trzewnych); średnie – **β1** (inotropowo +); duże – **α1** (skurcz naczyń, ↑ RR)."}, {"q": "Kiedy stosuje się dobutaminę?", "a": "Jako lek **inotropowo dodatni** (głównie β1) we wstrząsie kardiogennym i ostrej niewydolności serca z małym rzutem; w obciążeniowej echokardiografii."}, {"q": "Czym grozi długotrwałe stosowanie kropli do nosa z ksylometazoliną?", "a": "Po > 5–7 dniach – **polekowym nieżytem nosa** (rhinitis medicamentosa) z odbicia; u niemowląt możliwa depresja OUN."}, {"q": "Jak działają efedryna i pseudoefedryna i dlaczego występuje tachyfilaksja?", "a": "Głównie **pośrednio – uwalniają noradrenalinę** z zakończeń (także bezpośrednio na receptory). Przy powtarzaniu dawek zapasy NA się wyczerpują → **tachyfilaksja**."}, {"q": "Jaki jest mechanizm działania metylofenidatu i w czym się go stosuje?", "a": "Hamuje wychwyt zwrotny **dopaminy i noradrenaliny**; stosowany w **ADHD** i narkolepsji."}, {"q": "Czym różni się salmeterol od formoterolu?", "a": "Oba to LABA (~12 h), ale **formoterol działa szybko** (kilka minut – może być stosowany doraźnie w skojarzeniu z budezonidem), a **salmeterol powoli**."}, {"q": "Dlaczego w astmie LABA stosuje się zawsze z wziewnym GKS?", "a": "Monoterapia LABA nie leczy zapalenia i wiąże się ze **wzrostem ryzyka ciężkich zaostrzeń i zgonów** z powodu astmy."}, {"q": "Jakie są działania niepożądane β2-mimetyków?", "a": "**Drżenie mięśni**, tachykardia, kołatanie serca, **hipokaliemia**, hiperglikemia, niepokój, bóle głowy, kurcze mięśni."}, {"q": "Dlaczego salbutamol stosuje się w hiperkaliemii?", "a": "Pobudzenie **β2** aktywuje Na⁺/K⁺-ATPazę → **przesunięcie potasu do komórek** (efekt przejściowy)."}, {"q": "Jakie ograniczenia stosowania SABA w położnictwie wprowadziła EMA w 2013 r.?", "a": "Postacie **doustne i doodbytnicze** – nie stosować w żadnym wskazaniu położniczym. Postacie **pozajelitowe** – hamowanie porodu przedwczesnego tylko między **22. a 37. tygodniem**, maks. **48 h**, pod nadzorem specjalisty z ciągłym monitorowaniem; przeciwwskazane u kobiet z chorobą serca."}, {"q": "Dlaczego klonidyny nie wolno nagle odstawiać?", "a": "Grozi **nadciśnieniem z odbicia** (przełom nadciśnieniowy) z tachykardią i pobudzeniem."}, {"q": "Który lek przeciwnadciśnieniowy działający ośrodkowo stosuje się w ciąży?", "a": "**Metyldopa** (prolek → α-metylonoradrenalina, agonista α2)."}, {"q": "Jakie działania niepożądane ma metyldopa?", "a": "Sedacja, suchość w ustach, **dodatni odczyn Coombsa** (rzadko niedokrwistość hemolityczna), hepatotoksyczność, hiperprolaktynemia."}, {"q": "Czym moksonidyna różni się od klonidyny?", "a": "Działa głównie na receptory **imidazolinowe I1** w rdzeniu przedłużonym – mniej sedacji i suchości w ustach."}, {"q": "Do czego stosuje się deksmedetomidynę?", "a": "Do **sedacji** (OIT, zabiegi) – agonista α2, nie powoduje istotnej depresji oddechowej."}, {"q": "Jakie leki stosuje się przed operacją guza chromochłonnego i w jakiej kolejności?", "a": "Najpierw **α-adrenolityk** (fenoksybenzamina, doksazosyna), dopiero potem β-adrenolityk (kontrola tachykardii)."}, {"q": "Dlaczego w guzie chromochłonnym nie wolno zaczynać od β-blokera?", "a": "Zablokowanie β2 (rozszerzenie naczyń) zostawia **nieprzeciwstawioną stymulację α1** przez katecholaminy → przełom nadciśnieniowy."}, {"q": "Jakie jest typowe działanie niepożądane selektywnych α1-adrenolityków (doksazosyny)?", "a": "**Hipotonia ortostatyczna i omdlenie po pierwszej dawce** – zaczynać od małej dawki, wieczorem; także zawroty głowy, odruchowa tachykardia, zatkany nos."}, {"q": "Do czego stosuje się tamsulosynę i jakie ma szczególne powikłanie?", "a": "Łagodny rozrost prostaty (wybiórcza blokada **α1A**), ułatwienie wydalenia kamienia moczowodowego. Powikłanie: **śródoperacyjny zespół wiotkiej tęczówki** podczas operacji zaćmy, zaburzenia ejakulacji."}, {"q": "Wymień kardioselektywne β-blokery.", "a": "**Metoprolol, bisoprolol, atenolol, nebiwolol**, betaksolol, esmolol."}, {"q": "Które β-blokery mają dodatkowe działanie rozszerzające naczynia i jakim mechanizmem?", "a": "**Karwedilol i labetalol** – blokada **α1**; **nebiwolol** – uwalnianie **NO** ze śródbłonka."}, {"q": "Które β-blokery stosuje się w przewlekłej niewydolności serca z obniżoną EF?", "a": "**Bisoprolol, metoprolol (bursztynian, CR/XL), karwedilol, nebiwolol** (> 70 r.ż.) – zaczynając od małych dawek, stopniowo zwiększając."}, {"q": "Czym jest wewnętrzna aktywność sympatykomimetyczna β-blokera?", "a": "Częściowy agonizm receptora β (np. **pindolol**, acebutolol) – mniejsza bradykardia w spoczynku; takich leków nie stosuje się po zawale."}, {"q": "Jakie są wskazania propranololu poza chorobami serca?", "a": "**Nadczynność tarczycy** (objawowo, ↓ konwersji T4→T3), profilaktyka migreny, drżenie samoistne, lęk sytuacyjny, nadciśnienie wrotne, **naczyniaki niemowlęce**."}, {"q": "Dlaczego β-blokery są niebezpieczne u diabetyków leczonych insuliną?", "a": "**Maskują objawy hipoglikemii** zależne od układu współczulnego (tachykardia, drżenie) i spowalniają powrót glikemii (↓ glikogenolizy). Potliwość pozostaje (cholinergiczna)."}, {"q": "Jakie są przeciwwskazania do β-blokerów?", "a": "**Astma** (nieselektywne), **blok AV II–III stopnia**, ciężka bradykardia, zespół chorego węzła, ostra niewyrównana niewydolność serca, wstrząs kardiogenny, nieleczony guz chromochłonny, ciężka choroba tętnic obwodowych."}, {"q": "Co grozi po nagłym odstawieniu β-blokera?", "a": "**Zespół z odbicia**: tachykardia, nadciśnienie, nasilenie dławicy, zawał serca (zwiększona gęstość receptorów β)."}, {"q": "Jakie połączenie z β-blokerem jest niebezpieczne ze względu na asystolię?", "a": "Z **werapamilem lub diltiazemem** (zwłaszcza dożylnie) – addytywne hamowanie węzła zatokowego i AV → ciężka bradykardia, blok, asystolia."}, {"q": "Dlaczego glukagon jest odtrutką w zatruciu β-blokerami?", "a": "Aktywuje własny receptor sprzężony z Gs → **↑ cAMP w kardiomiocytach z pominięciem receptora β** → ↑ HR i kurczliwości."}, {"q": "Czym wyróżnia się sotalol wśród β-blokerów?", "a": "Poza blokadą β blokuje **kanały potasowe** (klasa III antyarytmików) → wydłużenie QT, ryzyko torsade de pointes."}, {"q": "Czym wyróżnia się esmolol?", "a": "Kardioselektywny β-bloker podawany **i.v.**, o bardzo krótkim działaniu (t½ ~9 min – hydroliza przez **esterazy erytrocytów**) – kontrola rytmu w stanach ostrych, w okresie okołooperacyjnym."}, {"q": "Który β-bloker stosuje się miejscowo w jaskrze i dlaczego może działać ogólnie?", "a": "**Timolol** (krople) – ↓ produkcji cieczy wodnistej; wchłania się przez śluzówkę nosa (z pominięciem efektu pierwszego przejścia) → bradykardia, skurcz oskrzeli."}, {"q": "Jaki był mechanizm działania rezerpiny?", "a": "Nieodwracalnie blokuje transporter pęcherzykowy **VMAT** → opróżnienie neuronów z NA, DA, 5-HT (działanie hipotensyjne, ale depresja – dziś niestosowana)."}], "sources": [{"t": "EMA – Short-acting beta-agonists, referral (CMDh 2013): ograniczenia w położnictwie", "u": "https://www.ema.europa.eu/en/medicines/human/referrals/short-acting-beta-agonists"}]}, {"id": "f-neuroleptyki", "num": "F9", "title": "Leki przeciwpsychotyczne (neuroleptyki) i przeciwlękowe", "summary": ["**Leki przeciwpsychotyczne** działają przede wszystkim przez blokadę **receptorów dopaminowych D2**. Blokada w szlaku **mezolimbicznym** zmniejsza objawy pozytywne (urojenia, omamy). Blokada w szlaku **nigrostriatalnym** daje objawy pozapiramidowe, w szlaku **guzowo-lejkowym** hiperprolaktynemię (mlekotok, zaburzenia miesiączkowania, ginekomastia), a w szlaku mezokortykalnym może nasilać objawy negatywne i poznawcze. Blokada D2 w strefie chemoreceptorowej daje działanie **przeciwwymiotne**. Wiele neuroleptyków blokuje też receptory **H1** (sedacja, przyrost masy ciała), **α1** (hipotonia ortostatyczna), **M** (suchość w ustach, zaparcia, zatrzymanie moczu) i **5-HT2A**.", "**Neuroleptyki klasyczne (I generacji)**: pochodne fenotiazyny (chlorpromazyna, lewomepromazyna, perazyna, flufenazyna, perfenazyna, tiorydazyna), tioksantenu (chlorprotiksen, flupentyksol, zuklopentyksol), **butyrofenonu** (**haloperidol**, droperydol), difenylobutylopiperydyny (pimozyd) i benzamidy (sulpiryd, amisulpryd, tiapryd). Neuroleptyki silne, jak haloperidol i flufenazyna, wywołują dużo objawów pozapiramidowych i słabo działają uspokajająco. Słabe, jak chlorpromazyna i lewomepromazyna, działają silnie sedatywnie i hipotensyjnie przy mniejszej liczbie objawów pozapiramidowych. Dostępne są też postacie **depot** o przedłużonym działaniu (dekanoaty, palmitynian paliperydonu, aripiprazol).", "**Neuroleptyki atypowe (II generacji)**: **klozapina**, olanzapina, kwetiapina, **risperidon** i paliperidon, zyprazydon, sertindol, lurazydon, **aripiprazol** (częściowy agonista D2), kariprazyna i brekspiprazol. Wiążą 5-HT2A silniej niż D2, dlatego rzadziej dają objawy pozapiramidowe, ale częściej **zaburzenia metaboliczne** (przyrost masy ciała, hiperglikemia, dyslipidemia, najsilniej klozapina i olanzapina). Risperidon silnie podnosi prolaktynę. Kwetiapina działa uspokajająco i przeciwdepresyjnie, a zyprazydon i sertindol wydłużają QT. **Klozapina** to lek rezerwowy w **schizofrenii lekoopornej** i w psychozie w chorobie Parkinsona. Grozi **agranulocytozą**, dlatego ANC ≥ 1500/mm³ przed włączeniem, kontrola co tydzień przez 18 tygodni, potem co miesiąc, a przy ANC < 1000/mm³ trzeba ją odstawić na stałe. Poza tym daje zapalenie mięśnia sercowego (pierwsze 2 miesiące), drgawki, ślinotok, ciężkie zaparcia aż do niedrożności, sedację i hipotonię. Nie łączy się jej z karbamazepiną, a jej stężenie rośnie po fluwoksaminie, cyprofloksacynie i po rzuceniu palenia (CYP1A2).", "**Objawy pozapiramidowe**: **ostra dystonia** (godziny lub dni od włączenia, kręcz szyi, napad przymusowego patrzenia w górę, szczękościsk; leczy się ją cholinolitykiem, np. biperydenem), **akatyzja** (niepokój ruchowy, przymus ruchu; zmniejsza się dawkę, podaje propranolol lub benzodiazepinę), **parkinsonizm polekowy** (tygodnie; cholinolityk, zmiana leku) i **późne dyskinezy** (miesiące lub lata, mimowolne ruchy ust i języka; często nieodwracalne, cholinolityki je nasilają, stosuje się zmianę na klozapinę lub inhibitory VMAT2). **Złośliwy zespół neuroleptyczny** to sztywność mięśni, **hipertermia**, zaburzenia świadomości, chwiejność autonomiczna i **wzrost CK**. Leczenie: odstawienie neuroleptyku, chłodzenie, nawodnienie, **dantrolen** i **bromokryptyna**. Inne działania niepożądane: wydłużenie QT, obniżenie progu drgawkowego, cholestaza (chlorpromazyna), retinopatia barwnikowa (tiorydazyna), nadwrażliwość na światło i wzrost śmiertelności u osób starszych z otępieniem.", "**Leki przeciwlękowe**: **benzodiazepiny** są pozytywnymi allosterycznymi modulatorami **receptora GABA-A** (wiążą się między podjednostkami α i γ) i **zwiększają częstość otwierania** kanału chlorkowego. Barbiturany wydłużają czas otwarcia i w dużych dawkach otwierają kanał bezpośrednio, dlatego są groźniejsze. Benzodiazepiny działają przeciwlękowo, nasennie, przeciwdrgawkowo, miorelaksacyjnie i wywołują niepamięć następczą. Krótko działające to midazolam i triazolam, średnio lorazepam, alprazolam, oksazepam i estazolam, a długo diazepam, klonazepam i chlordiazepoksyd (aktywne metabolity, np. nordiazepam). **Lorazepam i oksazepam** podlegają tylko glukuronidacji, więc są bezpieczniejsze w chorobach wątroby i u osób starszych. Ryzyka: tolerancja, **uzależnienie**, zespół odstawienny (drgawki, dlatego odstawia się je stopniowo), upadki u seniorów, depresja oddechowa z opioidami i alkoholem, reakcje paradoksalne. Odtrutka to **flumazenil** (krótko działający; grozi drgawkami u osób uzależnionych i po TLPD). **Buspiron** (częściowy agonista 5-HT1A) działa dopiero po 2–4 tygodniach, nie uzależnia i nie sedatuje. Stosuje się też **hydroksyzynę** (antagonista H1), pregabalinę w lęku uogólnionym i SSRI/SNRI, które w zaburzeniach lękowych są leczeniem przewlekłym pierwszego wyboru."], "review": [{"h": "Szlaki dopaminowe i blokada D2", "items": ["**Mezolimbiczny** – blokada → ↓ objawów **pozytywnych** (cel terapeutyczny)", "**Mezokortykalny** – blokada → nasilenie objawów negatywnych/poznawczych", "**Nigrostriatalny** – blokada → **objawy pozapiramidowe** (EPS)", "**Guzowo-lejkowy** – blokada → **hiperprolaktynemia** (mlekotok, brak miesiączki, ginekomastia, ↓ libido)", "Strefa chemoreceptorowa (CTZ) – działanie **przeciwwymiotne**", "Inne receptory: **H1** (sedacja, ↑ masy), **α1** (hipotonia ortostatyczna), **M** (suchość, zaparcia, zatrzymanie moczu, zaburzenia akomodacji), 5-HT2A (atypowość)", "Efekt przeciwpsychotyczny po kilku tygodniach; sedacja – od razu"]}, {"h": "Neuroleptyki klasyczne (I generacji)", "items": ["Fenotiazyny: **chlorpromazyna**, **lewomepromazyna** (silnie sedatywne – „słabe”), perazyna, **flufenazyna**, perfenazyna (silne), tiorydazyna (QT, retinopatia)", "Tioksanteny: chlorprotiksen, **flupentyksol**, **zuklopentyksol**", "Butyrofenony: **haloperidol** (silny D2, dużo EPS, mało sedacji, mało działania na układ krążenia – majaczenie, ostre pobudzenie), **droperydol** (przeciwwymiotnie, QT)", "Difenylobutylopiperydyny: **pimozyd** (QT)", "Benzamidy: **sulpiryd, amisulpryd** (prolaktyna ↑↑), tiapryd (pląsawica, zespół abstynencyjny)", "Silne (haloperidol, flufenazyna) – dużo EPS, mało sedacji i hipotonii; słabe (chlorpromazyna) – odwrotnie", "Postacie **depot** i.m. – dekanoaty haloperidolu, flufenazyny, zuklopentyksolu; poprawa współpracy"]}, {"h": "Neuroleptyki atypowe (II generacji)", "items": ["Stosunek powinowactwa **5-HT2A > D2** → mniej EPS i hiperprolaktynemii (wyjątek: risperidon, amisulpryd)", "**Olanzapina** – silny przyrost masy, cukrzyca, dyslipidemia, sedacja", "**Kwetiapina** – sedacja (H1), hipotonia; działanie przeciwdepresyjne (choroba dwubiegunowa)", "**Risperidon / paliperidon** – **hiperprolaktynemia**, EPS w większych dawkach; depot", "**Zyprazydon, sertindol** – **wydłużenie QT**", "**Aripiprazol, kariprazyna, brekspiprazol** – **częściowi agoniści D2** (i 5-HT1A): mało metabolicznych działań, ↓ prolaktyny; **akatyzja**", "Lurazydon – mało działań metabolicznych", "Zaburzenia metaboliczne – kontrola masy, glikemii, lipidów"]}, {"h": "Klozapina (ChPL)", "items": ["Wskazania: **schizofrenia lekooporna** (lub nietolerancja EPS), **psychoza w chorobie Parkinsona**", "Słabo D1–D3, D5; silnie **D4**; α1, M, H1, 5-HT – brak EPS i późnych dyskinez (praktycznie)", "**Agranulocytoza**: start przy ANC ≥ **1500/mm³**; kontrola **co tydzień przez 18 tyg.**, potem co miesiąc (34 tyg.), dalej co 12 tyg., po 2 latach raz w roku; **ANC < 1000/mm³ → odstawić na stałe**; infekcja/gorączka/ból gardła → pilnie ANC", "**Zapalenie mięśnia sercowego**/kardiomiopatia – największe ryzyko w pierwszych **2 miesiącach**", "**Zaparcia → niedrożność** (cholinolityczne; zgony), zapalenie wyrostka (EMA 2025)", "**Drgawki** (zależne od dawki), **ślinotok**, sedacja, tachykardia, hipotonia ortostatyczna/zapaść, przyrost masy, cukrzyca, gorączka, DRESS", "Przeciwwskazane z **karbamazepiną** i innymi lekami mielotoksycznymi, depot neuroleptykami, alkoholem", "CYP1A2: **fluwoksamina, cyprofloksacyna, kofeina, rzucenie palenia → ↑ stężenia**; palenie, omeprazol, ryfampicyna → ↓", "Kwas walproinowy – ↑ ryzyko neutropenii i zapalenia mięśnia sercowego"]}, {"h": "Objawy pozapiramidowe i ZZN", "items": ["**Ostra dystonia** – godziny–dni; kręcz, napad przymusowego patrzenia (oculogyric crisis), szczękościsk, opistotonus; młodzi mężczyźni; leczenie: **biperyden** i.v./i.m., benzodiazepina", "**Akatyzja** – dni–tygodnie; wewnętrzny niepokój, przymus ruchu; ↓ dawki, **propranolol**, benzodiazepina", "**Parkinsonizm polekowy** – tygodnie; sztywność, spowolnienie, drżenie; cholinolityk, zmiana na atypowy", "**Późne dyskinezy** – miesiące–lata; mimowolne ruchy ust, języka, twarzy; często nieodwracalne; cholinolityki pogarszają; zmiana na klozapinę, inhibitory VMAT2 (tetrabenazyna, walbenazyna)", "**Złośliwy zespół neuroleptyczny**: sztywność „ołowiana”, **hipertermia**, zaburzenia świadomości, chwiejność autonomiczna (RR, tachykardia, poty), **↑ CK**, mioglobinuria, leukocytoza", "Leczenie ZZN: odstawić neuroleptyk, chłodzenie, płyny, **dantrolen**, **bromokryptyna**, benzodiazepiny", "Inne: **wydłużenie QT**, ↓ progu drgawkowego, cholestaza (chlorpromazyna), fotodermatoza, retinopatia barwnikowa (tiorydazyna), ↑ śmiertelności u osób starszych z otępieniem (udar)"]}, {"h": "Benzodiazepiny", "items": ["**Pozytywne modulatory allosteryczne GABA-A** (miejsce α/γ) → ↑ **częstości** otwarcia kanału Cl⁻ (barbiturany – ↑ czasu otwarcia)", "Działania: przeciwlękowe, nasenne, **przeciwdrgawkowe**, miorelaksacyjne, **niepamięć następcza**", "Krótko: **midazolam** (premedykacja, sedacja, stan padaczkowy – i.m./donosowo), triazolam", "Średnio: **lorazepam**, **alprazolam** (lęk napadowy), **oksazepam**, estazolam, temazepam", "Długo: **diazepam** (aktywny metabolit nordiazepam), **klonazepam** (padaczka, lęk), chlordiazepoksyd (alkoholowy zespół abstynencyjny), medazepam", "**Lorazepam, oksazepam, temazepam** – tylko glukuronidacja → bezpieczniejsze w **chorobach wątroby** i u seniorów", "Wskazania: lęk (krótko), bezsenność (krótko), stan padaczkowy, alkoholowy zespół abstynencyjny, premedykacja, spastyczność", "Ryzyka: senność, upadki (seniorzy), zaburzenia pamięci, **tolerancja i uzależnienie**, zespół odstawienny (lęk, bezsenność, **drgawki**) → odstawiać stopniowo; reakcje paradoksalne", "Interakcje: **opioidy, alkohol** → depresja oddechowa; inhibitory CYP3A4 ↑ midazolam, alprazolam", "Przeciwwskazania: miastenia, ciężka niewydolność oddechowa, bezdech senny, ciężka niewydolność wątroby"]}, {"h": "Flumazenil i inne leki przeciwlękowe", "items": ["**Flumazenil** – antagonista miejsca benzodiazepinowego; krótko działający (resedacja); ryzyko **drgawek** u uzależnionych i w zatruciu mieszanym z **TLPD**", "**Buspiron** – częściowy agonista **5-HT1A**; lęk uogólniony; efekt po **2–4 tyg.**; nie uzależnia, nie sedatuje, nie działa przeciwdrgawkowo", "**Hydroksyzyna** – antagonista H1; uspokajająco, przeciwświądowo; QT", "**Pregabalina** – wiąże podjednostkę α2δ kanałów Ca²⁺; lęk uogólniony, ból neuropatyczny; potencjał nadużywania", "**SSRI/SNRI** – I wybór w przewlekłym leczeniu zaburzeń lękowych (efekt po tygodniach)", "Propranolol – somatyczne objawy lęku sytuacyjnego"]}], "cards": [{"q": "Jaki jest główny mechanizm działania leków przeciwpsychotycznych?", "a": "Blokada receptorów **dopaminowych D2** w szlaku mezolimbicznym (↓ objawów pozytywnych); atypowe dodatkowo silnie blokują **5-HT2A**."}, {"q": "Jakie skutki ma blokada D2 w poszczególnych szlakach dopaminowych?", "a": "Mezolimbiczny – działanie przeciwpsychotyczne; nigrostriatalny – **objawy pozapiramidowe**; guzowo-lejkowy – **hiperprolaktynemia**; mezokortykalny – nasilenie objawów negatywnych; CTZ – działanie przeciwwymiotne."}, {"q": "Jakie są objawy hiperprolaktynemii polekowej?", "a": "Mlekotok, zaburzenia miesiączkowania/brak miesiączki, ginekomastia, zaburzenia erekcji, ↓ libido, osteoporoza."}, {"q": "Jakie działania niepożądane wynikają z blokady receptorów H1, α1 i M przez neuroleptyki?", "a": "**H1** – sedacja, przyrost masy; **α1** – hipotonia ortostatyczna, zawroty; **M** – suchość w ustach, zaparcia, zatrzymanie moczu, zaburzenia akomodacji, tachykardia."}, {"q": "Czym różnią się neuroleptyki „silne” od „słabych”?", "a": "**Silne** (haloperidol, flufenazyna) – duże powinowactwo do D2: dużo objawów pozapiramidowych, mało sedacji i hipotonii. **Słabe** (chlorpromazyna, lewomepromazyna) – silna sedacja i hipotonia, mniej EPS."}, {"q": "Do jakiej grupy należy haloperidol i kiedy się go stosuje?", "a": "**Butyrofenony** – silny neuroleptyk klasyczny; ostre pobudzenie psychotyczne, **majaczenie**, schizofrenia, uporczywe wymioty, czkawka; dostępny w postaci depot."}, {"q": "Które neuroleptyki należą do benzamidów i czym się wyróżniają?", "a": "**Sulpiryd, amisulpryd**, tiapryd – wybiórczo D2/D3; silnie zwiększają **prolaktynę**."}, {"q": "Dlaczego neuroleptyki atypowe rzadziej wywołują objawy pozapiramidowe?", "a": "Silniej blokują **5-HT2A** niż D2 (blokada 5-HT2A zwiększa uwalnianie dopaminy w prążkowiu), szybciej dysocjują od D2 lub są **częściowymi agonistami D2** (aripiprazol)."}, {"q": "Które neuroleptyki atypowe najsilniej wywołują zaburzenia metaboliczne?", "a": "**Klozapina i olanzapina** (przyrost masy ciała, cukrzyca, dyslipidemia); także kwetiapina, risperidon."}, {"q": "Który atypowy neuroleptyk silnie zwiększa stężenie prolaktyny?", "a": "**Risperidon** (i paliperidon); spośród innych – amisulpryd."}, {"q": "Czym wyróżnia się aripiprazol?", "a": "Jest **częściowym agonistą D2** (i 5-HT1A) – mało działań metabolicznych, nie podnosi prolaktyny; typowe działanie niepożądane: **akatyzja**."}, {"q": "Które neuroleptyki szczególnie wydłużają odstęp QT?", "a": "**Sertindol, zyprazydon, pimozyd, tiorydazyna, droperydol**, haloperidol i.v."}, {"q": "Jakie są wskazania do klozapiny?", "a": "**Schizofrenia lekooporna** (lub ciężkie objawy neurologiczne po innych neuroleptykach) oraz **psychozy w chorobie Parkinsona**."}, {"q": "Jakie są zasady kontroli morfologii u pacjenta leczonego klozapiną?", "a": "Rozpoczęcie przy ANC **≥ 1500/mm³**; kontrola **co tydzień przez 18 tygodni**, potem co miesiąc przez kolejne 34 tygodnie, następnie co 12 tygodni, a po 2 latach – raz w roku."}, {"q": "Kiedy klozapinę trzeba bezwzględnie odstawić z powodu neutropenii?", "a": "Gdy **ANC < 1000/mm³** – natychmiast i bez ponownego włączania. Gorączka, ból gardła lub infekcja wymagają pilnego oznaczenia ANC."}, {"q": "Jakie ciężkie działania niepożądane klozapiny (poza agranulocytozą) trzeba znać?", "a": "**Zapalenie mięśnia sercowego**/kardiomiopatia (zwłaszcza pierwsze 2 miesiące), **drgawki** (zależne od dawki), **ciężkie zaparcia i niedrożność jelit**, ślinotok, hipotonia ortostatyczna i zapaść, cukrzyca, DRESS."}, {"q": "Dlaczego klozapiny nie łączy się z karbamazepiną?", "a": "Karbamazepina sama hamuje czynność szpiku – łączenie zwiększa ryzyko **agranulocytozy** (przeciwwskazane z innymi lekami mielotoksycznymi)."}, {"q": "Jak palenie tytoniu wpływa na stężenie klozapiny?", "a": "Palenie **indukuje CYP1A2** → ↓ stężenia; **nagłe rzucenie palenia** → ↑ stężenia i toksyczność. Fluwoksamina, cyprofloksacyna, kofeina też ↑ stężenie."}, {"q": "Kiedy pojawia się ostra dystonia i jak się ją leczy?", "a": "W ciągu **godzin–kilku dni** od włączenia/zwiększenia dawki neuroleptyku (kręcz szyi, przymusowe patrzenie w górę, szczękościsk). Leczenie: **biperyden** (cholinolityk) parenteralnie, ewentualnie benzodiazepina."}, {"q": "Czym jest akatyzja i jak się ją leczy?", "a": "Subiektywny niepokój ruchowy i przymus poruszania się. Leczenie: zmniejszenie dawki/zmiana leku, **propranolol**, benzodiazepina (cholinolityki mało skuteczne)."}, {"q": "Czym są późne dyskinezy i dlaczego nie leczy się ich cholinolitykami?", "a": "Mimowolne ruchy ust, języka, twarzy (żucie, cmokanie) po **miesiącach–latach** leczenia; często nieodwracalne (nadwrażliwość receptorów D2). Cholinolityki je **nasilają**; stosuje się zmianę na klozapinę lub inhibitory VMAT2."}, {"q": "Jakie są objawy złośliwego zespołu neuroleptycznego?", "a": "**Sztywność mięśni**, **hipertermia**, zaburzenia świadomości, chwiejność autonomiczna (wahania RR, tachykardia, poty), **↑ kinazy kreatynowej**, mioglobinuria, leukocytoza."}, {"q": "Jak leczy się złośliwy zespół neuroleptyczny?", "a": "Odstawienie neuroleptyku, chłodzenie, nawodnienie (ochrona nerek), **dantrolen** (zwiotczenie), **bromokryptyna** (agonista D2), benzodiazepiny; intensywny nadzór."}, {"q": "Jakie są charakterystyczne działania niepożądane chlorpromazyny i tiorydazyny?", "a": "**Chlorpromazyna** – cholestaza, nadwrażliwość na światło, sedacja, hipotonia, obniżenie progu drgawkowego. **Tiorydazyna** – wydłużenie QT, **retinopatia barwnikowa**."}, {"q": "Dlaczego neuroleptyki stosuje się ostrożnie u osób starszych z otępieniem?", "a": "Zwiększają **śmiertelność** (udary mózgu, zdarzenia sercowo-naczyniowe, zapalenia płuc)."}, {"q": "Jaki jest mechanizm działania benzodiazepin?", "a": "Pozytywna modulacja allosteryczna **receptora GABA-A** (miejsce między podjednostkami α i γ) → **zwiększenie częstości otwierania** kanału chlorkowego w obecności GABA → hiperpolaryzacja."}, {"q": "Czym różni się działanie benzodiazepin i barbituranów na receptor GABA-A?", "a": "Benzodiazepiny zwiększają **częstość** otwierania kanału (tylko w obecności GABA – efekt pułapowy). Barbiturany wydłużają **czas** otwarcia, a w dużych dawkach otwierają kanał bezpośrednio → większa toksyczność."}, {"q": "Jakie działania wykazują benzodiazepiny?", "a": "Przeciwlękowe, uspokajające i nasenne, **przeciwdrgawkowe**, miorelaksacyjne, **niepamięć następczą**."}, {"q": "Dlaczego diazepam działa długo?", "a": "Ma długi t½ i tworzy aktywne metabolity (**nordiazepam** – t½ do ~100 h, oksazepam) – ryzyko kumulacji u osób starszych."}, {"q": "Które benzodiazepiny są bezpieczniejsze w niewydolności wątroby i u seniorów i dlaczego?", "a": "**Lorazepam, oksazepam, temazepam** – metabolizowane wyłącznie przez **glukuronidację** (bez udziału CYP450), brak aktywnych metabolitów."}, {"q": "Który lek benzodiazepinowy stosuje się w premedykacji i sedacji do zabiegów?", "a": "**Midazolam** – krótko działający, rozpuszczalny w wodzie (i.v., i.m., donosowo, podpoliczkowo – także w napadach drgawkowych)."}, {"q": "Jakie benzodiazepiny stosuje się w stanie padaczkowym?", "a": "**Lorazepam i.v., diazepam i.v. / doodbytniczo, midazolam i.m. / donosowo / podpoliczkowo**; klonazepam."}, {"q": "Jakie są główne ryzyka długotrwałego stosowania benzodiazepin?", "a": "**Tolerancja, uzależnienie**, zaburzenia pamięci i funkcji poznawczych, upadki i złamania u seniorów; zespół odstawienny (lęk, bezsenność, drżenie, **drgawki**) → odstawiać stopniowo."}, {"q": "Dlaczego łączenie benzodiazepin z opioidami jest niebezpieczne?", "a": "Sumowanie działania depresyjnego na OUN → głęboka sedacja, **depresja oddechowa**, śpiączka, zgon (także z alkoholem)."}, {"q": "Jaki jest mechanizm działania flumazenilu i jakie są ograniczenia jego stosowania?", "a": "**Kompetycyjny antagonista** miejsca benzodiazepinowego GABA-A. Działa krócej niż wiele benzodiazepin (resedacja); może wywołać **drgawki** u uzależnionych i w zatruciu mieszanym z TLPD."}, {"q": "Jaki jest mechanizm działania buspironu i jego cechy kliniczne?", "a": "**Częściowy agonista 5-HT1A**; działa przeciwlękowo dopiero po **2–4 tygodniach**, nie sedatuje, nie uzależnia, nie działa przeciwdrgawkowo ani miorelaksacyjnie."}, {"q": "Jakie leki są pierwszego wyboru w przewlekłym leczeniu zaburzeń lękowych?", "a": "**SSRI i SNRI** (np. escitalopram, sertralina, wenlafaksyna); benzodiazepiny tylko krótkotrwale."}, {"q": "Jaki jest mechanizm działania pregabaliny?", "a": "Wiąże podjednostkę **α2δ** napięciowozależnych kanałów wapniowych → ↓ uwalniania neuroprzekaźników pobudzających; lęk uogólniony, ból neuropatyczny, padaczka."}], "sources": [{"t": "ChPL – Clopizam (klozapina), Rejestr Produktów Leczniczych", "u": "https://rejestry.ezdrowie.gov.pl/api/rpl/medicinal-products/38360/characteristic"}, {"t": "EMA/CMDh – Klozapina, PSUSA/00000836/202503: zmiany w ChPL (zapalenie wyrostka, DRESS, interakcja z walproinianem)", "u": "https://www.ema.europa.eu/pl/documents/psusa/clozapine-cmdh-scientific-conclusions-grounds-variation-amendments-product-information-timetable-implementation-psusa-00000836-202503_pl.pdf"}]}, {"id": "f-depresja", "num": "F10", "title": "Leki przeciwdepresyjne, sole litu, leki nasenne i nootropowe", "summary": ["Leki przeciwdepresyjne zwiększają przekaźnictwo **serotoninowe i/lub noradrenergiczne** (i dopaminergiczne). Ich efekt kliniczny pojawia się dopiero po **2–4 tygodniach**, co wiąże się ze zmianami adaptacyjnymi receptorów (m.in. desensytyzacją autoreceptorów 5-HT1A) i neuroplastycznością. **SSRI** (fluoksetyna, sertralina, paroksetyna, citalopram, escitalopram, fluwoksamina) są lekami pierwszego wyboru w depresji i zaburzeniach lękowych. Działania niepożądane: nudności, zaburzenia seksualne, bezsenność lub senność, **hiponatremia (SIADH)** u osób starszych, zwiększone ryzyko krwawień (płytki nie wychwytują serotoniny) i, na początku leczenia u młodych, nasilenie myśli samobójczych. Citalopram i escitalopram wydłużają **QT** zależnie od dawki: maksymalnie 40/20 mg, a u osób > 65 lat 20/10 mg. Fluoksetyna ma bardzo długi t½ (aktywny metabolit norfluoksetyna). Paroksetyna i fluoksetyna silnie hamują CYP2D6, a fluwoksamina CYP1A2. Po nagłym odstawieniu (zwłaszcza paroksetyny) pojawia się zespół odstawienny.", "**SNRI** (wenlafaksyna, duloksetyna, milnacypran) dodatkowo hamują wychwyt noradrenaliny i bywają skuteczne w bólu neuropatycznym (duloksetyna). Mogą zwiększać RR. **TLPD** (amitryptylina, imipramina, klomipramina, doksepina, opipramol, a z tetracyklicznych maprotylina) hamują wychwyt 5-HT i NA, ale blokują też receptory M, H1 i α1 oraz **kanały sodowe** (efekt chinidynopodobny). Dają zespół cholinolityczny, sedację, hipotonię ortostatyczną i przyrost masy ciała. Przedawkowanie jest bardzo niebezpieczne: **poszerzenie QRS**, komorowe zaburzenia rytmu, drgawki i śpiączka. W leczeniu stosuje się **wodorowęglan sodu** i nie podaje fizostygminy ani flumazenilu. Małe dawki amitryptyliny stosuje się w bólu przewlekłym. **Inhibitory MAO**: nieodwracalne nieselektywne (tranylcypromina), odwracalny MAO-A (**moklobemid**) i MAO-B (selegilina, rasagilina, w chorobie Parkinsona). Grożą **przełomem nadciśnieniowym po tyraminie** („reakcja serowa”) i **zespołem serotoninowym** z innymi lekami serotoninergicznymi.", "Inne leki przeciwdepresyjne: **mirtazapina** (NaSSA, blokuje α2, 5-HT2 i 5-HT3 oraz H1, działa nasennie i zwiększa apetyt), **mianseryna**, **trazodon** (SARI, nasennie, priapizm), **bupropion** (NDRI, pomaga też w rzucaniu palenia, obniża próg drgawkowy, nie wywołuje zaburzeń seksualnych), **agomelatyna** (agonista MT1/MT2 i antagonista 5-HT2C, wymaga kontroli prób wątrobowych), wortioksetyna, tianeptyna i esketamina (donosowo, antagonista NMDA w depresji lekoopornej). **Zespół serotoninowy** to triada: zmiany stanu psychicznego (niepokój, majaczenie), nadmierna aktywność autonomiczna (hipertermia, tachykardia, poty, biegunka, rozszerzenie źrenic) i objawy nerwowo-mięśniowe (**klonie**, hiperrefleksja, drżenie). Wywołuje go połączenie SSRI/SNRI z MAOI, tramadolem, linezolidem, tryptanami, fentanylem czy zielem dziurawca. Leczenie: odstawienie leków, benzodiazepiny, chłodzenie, cyproheptadyna.", "**Sole litu** to lek normotymiczny pierwszego wyboru w **chorobie dwubiegunowej** (leczenie manii i zapobieganie nawrotom), który zmniejsza też ryzyko samobójstwa. Mechanizm obejmuje hamowanie inozytolomonofosfatazy i GSK-3. Lit ma **wąski indeks terapeutyczny**. Według ChPL docelowe stężenie wynosi **0,5–0,8 mmol/l** w leczeniu podtrzymującym i **0,6 (0,8)–1,2 mmol/l** w ostrej manii. Krew pobiera się **ok. 12 h po ostatniej dawce**. Objawy zatrucia pojawiają się od 1,5 mmol/l (biegunka, grube drżenie, ataksja, dyzartria), a przy 2–3 mmol/l dochodzi do splątania, drgawek i śpiączki. Leczenie: odstawienie i hemodializa. Stężenie litu zwiększają **NLPZ, tiazydy, ACEI, sartany**, metronidazol oraz odwodnienie i dieta niskosodowa. Zmniejszają je teofilina, gliflozyny i inhibitory anhydrazy węglanowej. Działania niepożądane: drżenie drobnofaliste, wielomocz (**moczówka nerkowa**), niedoczynność tarczycy i wole, hiperkalcemia (przytarczyce), przyrost masy ciała, trądzik i przewlekła nefropatia. W I trymestrze ciąży lit zwiększa ryzyko wad serca. Inne normotymiki to walproinian, karbamazepina, lamotrygina (zapobiega fazom depresyjnym) i atypowe neuroleptyki.", "**Leki nasenne**: pierwszeństwo ma niefarmakologiczne leczenie bezsenności (CBT-I). Leki stosuje się krótko: **„leki Z”** (zolpidem, zopiklon, zaleplon) wybiórczo działają na podjednostkę α1 receptora GABA-A, a obok nich benzodiazepiny o krótkim lub średnim czasie działania, melatonina (u osób > 55 lat, w zaburzeniach rytmu), doksepina w małych dawkach, trazodon i mirtazapina. Grożą upadkami, zaburzeniami pamięci, zachowaniami złożonymi we śnie, tolerancją i uzależnieniem. **Barbiturany** (fenobarbital) stosuje się dziś głównie w padaczce. Są induktorami enzymów i mają mały margines bezpieczeństwa. Historycznie stosowano sole bromu, wodzian chloralu, karbaminiany (meprobamat) i pochodne piperydyny. **Leki nootropowe i prokognitywne**: piracetam (pochodna GABA, w mioklonii korowej i zaburzeniach poznawczych, skuteczność ograniczona), inhibitory AChE (donepezil, rywastygmina, galantamina) i memantyna (antagonista NMDA w otępieniu umiarkowanym i ciężkim) w chorobie Alzheimera, a także winpocetyna i ginkgo (dowody słabe)."], "review": [{"h": "SSRI", "items": ["**Fluoksetyna** (t½ długi – norfluoksetyna; silny inhibitor CYP2D6), **sertralina**, **paroksetyna** (CYP2D6, cholinolityczna, najsilniejszy zespół odstawienny, teratogenna – wady serca), **citalopram, escitalopram** (QT), **fluwoksamina** (CYP1A2 – ↑ klozapina, teofilina)", "Wskazania: depresja, zaburzenia lękowe, OCD, PTSD, bulimia", "Działania: nudności, biegunka, **zaburzenia seksualne**, bezsenność/senność, pobudzenie na początku, **hiponatremia (SIADH)** – seniorzy, krwawienia (z NLPZ, antykoagulantami), osteoporoza", "Na początku leczenia u młodzieży i młodych dorosłych – ↑ ryzyka **myśli samobójczych** → kontrola", "**Citalopram max 40 mg (> 65 lat / niewydolność wątroby 20 mg); escitalopram max 20 mg (10 mg)**; przeciwwskazane z wrodzonym zespołem długiego QT i z innymi lekami wydłużającymi QT (MHRA 2011)", "Zespół odstawienny: zawroty, „elektryczne wstrząsy”, drażliwość → odstawiać stopniowo", "Opóźnienie efektu przeciwdepresyjnego: **2–4 tyg.**; leczenie podtrzymujące ≥ 6–12 mies."]}, {"h": "SNRI, TLPD, MAOI", "items": ["**SNRI**: wenlafaksyna (↑ RR w dużych dawkach), **duloksetyna** (ból neuropatyczny, nietrzymanie moczu z parcia), milnacypran (fibromialgia)", "**TLPD**: amitryptylina, imipramina, klomipramina (OCD), dezypramina, nortryptylina, doksepina, opipramol; tetracykliczne: maprotylina", "TLPD blokują: wychwyt **5-HT i NA** + receptory **M** (cholinolityczne), **H1** (sedacja, ↑ masy), **α1** (hipotonia ortostatyczna) + **kanały Na⁺** (chinidynopodobne)", "Przedawkowanie TLPD: **poszerzenie QRS > 100 ms**, arytmie komorowe, hipotensja, drgawki, śpiączka, zespół cholinolityczny → **NaHCO₃** (alkalizacja + Na⁺), nie fizostygmina, nie flumazenil, nie leki klasy IA/IC", "Amitryptylina w małych dawkach – ból neuropatyczny, migrena, napięciowe bóle głowy", "**MAOI**: tranylcypromina (nieodwracalny, nieselektywny), **moklobemid** (odwracalny MAO-A), selegilina/rasagilina (MAO-B – Parkinson)", "**Reakcja serowa**: tyramina (sery dojrzewające, wino, wędliny, sos sojowy) + nieodwracalny MAOI → **przełom nadciśnieniowy**", "Przerwa przy zmianie leków: MAOI ↔ SSRI zwykle **2 tyg.** (po fluoksetynie **5 tyg.**)"]}, {"h": "Inne leki przeciwdepresyjne", "items": ["**Mirtazapina** – antagonista α2 (↑ uwalniania NA i 5-HT), 5-HT2, 5-HT3, H1: sedacja, ↑ apetytu i masy; mało zaburzeń seksualnych", "**Mianseryna** – podobnie; agranulocytoza (rzadko)", "**Trazodon** – SARI (antagonista 5-HT2A + słaby SSRI): nasennie; **priapizm**, hipotonia", "**Bupropion** – NDRI; depresja, **rzucanie palenia**; **obniża próg drgawkowy** (przeciwwskazany w padaczce, bulimii); brak zaburzeń seksualnych", "**Agomelatyna** – agonista MT1/MT2, antagonista 5-HT2C; **hepatotoksyczność** → kontrola AlAT", "**Wortioksetyna** – multimodalny; **tianeptyna** – nadużywanie", "**Esketamina** donosowo – antagonista NMDA; depresja lekooporna (pod nadzorem: dysocjacja, ↑ RR)"]}, {"h": "Zespół serotoninowy", "items": ["Przyczyny: SSRI/SNRI/TLPD + **MAOI, tramadol, linezolid, fentanyl, petydyna, tryptany, dekstrometorfan, ziele dziurawca, lit, MDMA**", "Objawy: zmiany psychiczne (niepokój, pobudzenie, majaczenie) + autonomiczne (**hipertermia**, tachykardia, poty, biegunka, **rozszerzone źrenice**) + nerwowo-mięśniowe (**klonie** – zwłaszcza kończyn dolnych, hiperrefleksja, drżenie, sztywność)", "Początek szybki (godziny) – vs ZZN (dni, sztywność, bradykinezja, brak kloni)", "Leczenie: odstawienie, benzodiazepiny, chłodzenie, **cyproheptadyna** (antagonista 5-HT2A)"]}, {"h": "Sole litu (ChPL)", "items": ["Wskazania: **mania**, zapobieganie nawrotom choroby dwubiegunowej, zapobieganie epizodom nawracającej depresji; działanie przeciwsamobójcze", "Mechanizm: hamowanie **inozytolomonofosfatazy** (↓ IP3) i **GSK-3**", "Stężenia: **0,5–0,8 mmol/l** podtrzymująco; **0,6–1,2 mmol/l** w ostrej manii; krew **~12 h po ostatniej dawce**; początkowo co tydzień", "Zatrucie: **1,5–2 mmol/l** – biegunka, grube drżenie, osłabienie, dyzartria, ataksja; **2–3 mmol/l** – splątanie, drgawki, oczopląs, śpiączka, zgon → odstawić, płyny, **hemodializa** (brak odtrutki)", "↑ stężenia litu: **NLPZ, tiazydy, amiloryd, ACEI, sartany, metronidazol**, odwodnienie, dieta ubogosodowa, upały", "↓ stężenia: **teofilina**/ksantyny, mocznik, węglan sodu, **gliflozyny**, inhibitory anhydrazy węglanowej", "Neurotoksyczność ↑ z neuroleptykami, karbamazepiną, SSRI, TLPD", "Działania: drżenie drobnofaliste, **wielomocz/moczówka nerkowa**, **niedoczynność tarczycy**, wole, **hiperkalcemia** (przytarczyce), przyrost masy, trądzik, zmiany EKG, przewlekła nefropatia", "Ciąża (I trymestr) – wady **serca** (klasycznie anomalia Ebsteina); karmienie piersią – przeciwwskazane", "Przeciwwskazania: ciężka niewydolność nerek, świeży zawał, ciąża, karmienie"]}, {"h": "Leki nasenne i nootropowe", "items": ["Bezsenność: najpierw **CBT-I** i higiena snu; leki krótko (2–4 tyg.)", "**Zolpidem, zopiklon, zaleplon** („Z”) – wybiórczo α1 GABA-A; krótko; upadki, amnezja, zachowania złożone we śnie, uzależnienie; antagonizowane flumazenilem", "Benzodiazepiny nasenne: estazolam, temazepam, lorazepam, midazolam", "**Melatonina** (o przedłużonym uwalnianiu > 55 lat), ramelteon; **doksepina** 3–6 mg; trazodon, mirtazapina", "Antagoniści oreksyn: suworeksant, daridoreksant", "**Barbiturany** (fenobarbital) – induktory CYP, małe bezpieczeństwo; dziś padaczka, odstawienie alkoholu", "Historyczne: sole bromu (bromizm), wodzian chloralu, meprobamat (karbaminiany), glutetymid (piperydyny), metakwalon (chinazolon), klometiazol (tiazol)", "**Piracetam** – mioklonie korowe, zaburzenia poznawcze (dowody ograniczone); winpocetyna, ginkgo", "**Inhibitory AChE** (donepezil, rywastygmina, galantamina) – Alzheimer łagodny/umiarkowany; **memantyna** (antagonista NMDA) – umiarkowany/ciężki"]}], "cards": [{"q": "Dlaczego efekt przeciwdepresyjny pojawia się dopiero po 2–4 tygodniach?", "a": "Wymaga **zmian adaptacyjnych**: desensytyzacji autoreceptorów 5-HT1A i α2, zmian ekspresji receptorów i neuroplastyczności (BDNF) – samo zahamowanie wychwytu następuje od razu."}, {"q": "Wymień SSRI.", "a": "**Fluoksetyna, sertralina, paroksetyna, citalopram, escitalopram, fluwoksamina**."}, {"q": "Jakie są typowe działania niepożądane SSRI?", "a": "Nudności, biegunka, **zaburzenia seksualne**, bezsenność lub senność, niepokój na początku leczenia, **hiponatremia** (SIADH), zwiększone ryzyko **krwawień**, potliwość."}, {"q": "Dlaczego SSRI zwiększają ryzyko krwawień?", "a": "Płytki krwi nie syntetyzują serotoniny – pobierają ją z osocza przez transporter SERT, który SSRI blokują → ↓ serotoniny w płytkach → upośledzona agregacja (szczególnie z NLPZ i antykoagulantami)."}, {"q": "Jakie są maksymalne dawki citalopramu i escitalopramu ze względu na QT?", "a": "Citalopram – **40 mg/d** (≥ 65 lat lub niewydolność wątroby: **20 mg**); escitalopram – **20 mg/d** (odpowiednio **10 mg**). Przeciwwskazane w wrodzonym zespole długiego QT i z innymi lekami wydłużającymi QT."}, {"q": "Czym wyróżnia się fluoksetyna farmakokinetycznie?", "a": "Bardzo długim t½ (aktywny metabolit **norfluoksetyna** – 1–2 tyg.) i silnym hamowaniem **CYP2D6** → słaby zespół odstawienny, ale długa przerwa (**5 tygodni**) przed włączeniem MAOI."}, {"q": "Który SSRI najsilniej hamuje CYP1A2 i jaki ma to skutek?", "a": "**Fluwoksamina** → ↑ stężenia **klozapiny, teofiliny**, kofeiny, tyzanidyny."}, {"q": "Jaki jest problem z paroksetyną przy odstawianiu?", "a": "Krótki t½ → nasilony **zespół odstawienny** (zawroty głowy, parestezje „jak prąd”, drażliwość, bezsenność) – odstawiać stopniowo. Ponadto działanie cholinolityczne i ryzyko wad serca w I trymestrze."}, {"q": "Jakie ostrzeżenie dotyczy stosowania leków przeciwdepresyjnych u młodych?", "a": "Na początku leczenia u dzieci, młodzieży i młodych dorosłych (< 25 lat) może wzrosnąć ryzyko **myśli i zachowań samobójczych** → ścisła obserwacja."}, {"q": "Jakie są wskazania duloksetyny poza depresją?", "a": "**Ból neuropatyczny** (cukrzycowy), uogólnione zaburzenia lękowe, wysiłkowe nietrzymanie moczu."}, {"q": "Jakie receptory i kanały blokują TLPD i jakie są tego skutki?", "a": "**M** – suchość, zaparcia, zatrzymanie moczu, zaburzenia akomodacji, tachykardia; **H1** – sedacja, ↑ masy; **α1** – hipotonia ortostatyczna; **kanały Na⁺** – zaburzenia przewodzenia (QRS), arytmie."}, {"q": "Jakie są objawy zatrucia TLPD?", "a": "**Poszerzenie QRS**, komorowe zaburzenia rytmu, hipotensja, **drgawki**, śpiączka oraz zespół antycholinergiczny (rozszerzone źrenice, sucha skóra, hipertermia, zatrzymanie moczu)."}, {"q": "Jak leczy się zatrucie TLPD?", "a": "**Wodorowęglan sodu** i.v. (alkalizacja i obciążenie sodem – przy QRS > 100 ms lub arytmii), węgiel aktywowany, benzodiazepiny na drgawki. **Nie** podaje się fizostygminy, flumazenilu ani leków klasy IA/IC."}, {"q": "Do czego stosuje się małe dawki amitryptyliny?", "a": "W **bólu neuropatycznym**, profilaktyce migreny i napięciowego bólu głowy, bólu przewlekłym."}, {"q": "Czym jest reakcja serowa?", "a": "**Przełom nadciśnieniowy** po spożyciu pokarmów bogatych w **tyraminę** (sery dojrzewające, czerwone wino, wędliny, sos sojowy) u osoby przyjmującej nieodwracalny MAOI – tyramina nie jest rozkładana w jelicie i uwalnia noradrenalinę."}, {"q": "Czym różni się moklobemid od tranylcyprominy?", "a": "**Moklobemid** – odwracalny, wybiórczy inhibitor **MAO-A** (mniejsze ryzyko reakcji serowej). **Tranylcypromina** – nieodwracalny, nieselektywny MAOI."}, {"q": "Jak długa musi być przerwa między odstawieniem SSRI a włączeniem MAOI?", "a": "Zwykle **2 tygodnie**, a po **fluoksetynie – 5 tygodni** (długi t½ norfluoksetyny); po nieodwracalnym MAOI – 2 tygodnie przed SSRI."}, {"q": "Jaki jest mechanizm działania mirtazapiny i jej typowe działania niepożądane?", "a": "**Antagonista α2** (↑ uwalniania NA i 5-HT) oraz 5-HT2, 5-HT3 i **H1**. Działania: **sedacja, ↑ apetytu i masy ciała**; mało zaburzeń seksualnych i nudności."}, {"q": "Jakie charakterystyczne działanie niepożądane ma trazodon?", "a": "**Priapizm** (blokada α1); ponadto silne działanie nasenne, hipotonia ortostatyczna."}, {"q": "Jakie są zastosowania i przeciwwskazania bupropionu?", "a": "Depresja, **leczenie uzależnienia od nikotyny**. Przeciwwskazany w **padaczce**, bulimii/anoreksji (obniża próg drgawkowy). Nie wywołuje zaburzeń seksualnych ani przyrostu masy."}, {"q": "Jakie badania trzeba wykonywać podczas leczenia agomelatyną?", "a": "**Próby wątrobowe (AlAT/AspAT)** – ryzyko hepatotoksyczności (na początku i w trakcie leczenia)."}, {"q": "Jakie są objawy zespołu serotoninowego?", "a": "Zmiany psychiczne (niepokój, majaczenie) + autonomiczne (**hipertermia**, tachykardia, poty, biegunka, rozszerzone źrenice) + nerwowo-mięśniowe (**klonie**, hiperrefleksja, drżenie)."}, {"q": "Jakie leki w połączeniu z SSRI mogą wywołać zespół serotoninowy?", "a": "**MAOI, tramadol, linezolid**, fentanyl, petydyna, tryptany, dekstrometorfan, **ziele dziurawca**, lit, TLPD, MDMA."}, {"q": "Jak odróżnić zespół serotoninowy od złośliwego zespołu neuroleptycznego?", "a": "Serotoninowy – początek w ciągu **godzin**, **klonie i hiperrefleksja**, biegunka, rozszerzone źrenice. ZZN – rozwija się przez **dni**, sztywność „ołowiana”, bradykinezja, ↓ odruchów, wysokie CK."}, {"q": "Jak leczy się zespół serotoninowy?", "a": "Odstawienie leków serotoninergicznych, **benzodiazepiny**, chłodzenie i nawodnienie, w cięższych przypadkach **cyproheptadyna** (antagonista 5-HT2A)."}, {"q": "Jaki jest mechanizm działania litu?", "a": "Hamuje **inozytolomonofosfatazę** (↓ odtwarzania inozytolu i sygnalizacji IP3) oraz **GSK-3**; zmienia przekaźnictwo i neuroplastyczność."}, {"q": "Jakie są docelowe stężenia litu wg ChPL i kiedy pobiera się krew?", "a": "Leczenie podtrzymujące – **0,5–0,8 mmol/l**; ostra mania – **0,6 (0,8)–1,2 mmol/l**. Krew pobiera się **ok. 12 godzin po ostatniej dawce**."}, {"q": "Jakie objawy wskazują na zatrucie litem?", "a": "1,5–2 mmol/l: **biegunka, grube drżenie**, osłabienie mięśni, dyzartria, ataksja. 2–3 mmol/l: **splątanie, drgawki**, oczopląs, śpiączka, zgon."}, {"q": "Jak leczy się ciężkie zatrucie litem?", "a": "Odstawienie, nawodnienie, korekta elektrolitów; w ciężkich przypadkach **hemodializa** (brak swoistej odtrutki)."}, {"q": "Które leki zwiększają stężenie litu we krwi?", "a": "**NLPZ, diuretyki tiazydowe, amiloryd, ACEI, sartany, metronidazol**; także odwodnienie i dieta ubogosodowa."}, {"q": "Które leki zmniejszają stężenie litu?", "a": "**Teofilina** i inne ksantyny, **gliflozyny (SGLT2)**, inhibitory anhydrazy węglanowej, mocznik, wodorowęglan/węglan sodu."}, {"q": "Jakie zaburzenia endokrynologiczne i nerkowe wywołuje lit?", "a": "**Niedoczynność tarczycy** i wole, **hiperkalcemia** (nadczynność przytarczyc), **moczówka nerkowa** (wielomocz, wzmożone pragnienie), przewlekła nefropatia."}, {"q": "Dlaczego lit jest przeciwwskazany w I trymestrze ciąży?", "a": "Przenika przez łożysko i zwiększa ryzyko **wad układu sercowo-naczyniowego** (klasycznie anomalia Ebsteina)."}, {"q": "Jaki jest mechanizm działania „leków Z”?", "a": "**Zolpidem, zopiklon, zaleplon** – wiążą miejsce benzodiazepinowe receptora GABA-A, wybiórczo z podjednostką **α1** (działanie nasenne, słabe przeciwlękowe i miorelaksacyjne)."}, {"q": "Jakie są ryzyka stosowania zolpidemu?", "a": "Upadki, zaburzenia pamięci, **zachowania złożone we śnie** (prowadzenie auta, jedzenie), senność następnego dnia, tolerancja i **uzależnienie** – stosować krótko."}, {"q": "Jakie jest miejsce melatoniny w leczeniu bezsenności?", "a": "Melatonina o przedłużonym uwalnianiu – krótkotrwale u osób **> 55 lat**; zaburzenia rytmu okołodobowego (jet lag)."}, {"q": "Dlaczego barbiturany zostały wyparte jako leki nasenne?", "a": "**Mały margines bezpieczeństwa** (depresja oddechowa, śpiączka), indukcja enzymów (interakcje), uzależnienie, ciężki zespół odstawienny."}, {"q": "Jakie leki stosuje się w chorobie Alzheimera i jak działają?", "a": "**Inhibitory acetylocholinoesterazy** (donepezil, rywastygmina, galantamina) – postać łagodna i umiarkowana; **memantyna** (niekompetycyjny antagonista NMDA) – postać umiarkowana i ciężka."}, {"q": "Do czego stosuje się piracetam?", "a": "W **miokloniach pochodzenia korowego**; w zaburzeniach poznawczych – skuteczność ograniczona."}], "sources": [{"t": "ChPL – Lithium carbonicum GSK 250 mg (aktualizacja 2025)", "u": "https://pl.gsk.com/media/8641/lithium-carbonicum-gsk-chpl-psusa-ib-28_02_2025.pdf"}, {"t": "MHRA Drug Safety Update – Citalopram and escitalopram: QT interval prolongation (2011)", "u": "https://www.gov.uk/drug-safety-update/citalopram-and-escitalopram-qt-interval-prolongation"}]}, {"id": "f-hipotensyjne", "num": "F11", "title": "Leki hipotensyjne: ACEI, sartany, antagoniści wapnia, leki ośrodkowe i rozszerzające naczynia", "summary": ["Według wytycznych **ESC 2024** lekami pierwszego wyboru w nadciśnieniu są **ACEI lub sartany (ARB)**, **antagoniści wapnia z grupy dihydropirydyn** i **diuretyki tiazydowe lub tiazydopodobne**. U większości pacjentów leczenie zaczyna się od **dwóch leków w małych dawkach, najlepiej w jednej tabletce**, a w kolejnym kroku stosuje się trzy leki. Docelowe ciśnienie skurczowe dla większości chorych wynosi **120–129 mm Hg**, jeśli jest dobrze tolerowane. W **nadciśnieniu opornym** dodaje się **spironolakton** (albo eplerenon), potem β-bloker, α-bloker lub inne leki. **β-blokery** nie są lekami pierwszego wyboru. Dodaje się je, gdy jest ku temu konkretne wskazanie (choroba wieńcowa, niewydolność serca, migotanie przedsionków, ciąża).", "**Inhibitory konwertazy angiotensyny (ACEI)**: kaptopril, enalapril, peryndopryl, ramipril, lizynopryl, chinapryl, cilazapril i inne. Hamują przekształcanie angiotensyny I w **angiotensynę II** i rozkład **bradykininy**. Rozszerzają naczynia, zmniejszają wydzielanie aldosteronu i przerost mięśnia sercowego oraz działają nefroprotekcyjnie przez rozszerzenie tętniczki odprowadzającej i zmniejszenie białkomoczu. Wskazania: nadciśnienie, **niewydolność serca z obniżoną EF**, stan po zawale, nefropatia cukrzycowa i białkomocz. Działania niepożądane: **suchy kaszel** (bradykinina, 10–20% chorych), **obrzęk naczynioruchowy**, **hiperkaliemia**, wzrost kreatyniny (do 30% jest akceptowalne), hipotensja po pierwszej dawce i zaburzenia smaku (kaptopril). **Przeciwwskazania**: **ciąża** (fetotoksyczność w II i III trymestrze), obustronne zwężenie tętnic nerkowych (lub zwężenie tętnicy jedynej nerki), obrzęk naczynioruchowy w wywiadzie i jednoczesne stosowanie sakubitrylu (konieczne 36 h przerwy).", "**Sartany (ARB)**: losartan, walsartan, kandesartan, telmisartan, irbesartan, olmesartan, eprosartan, azilsartan. Blokują receptor **AT1**. Nie wpływają na bradykininę, więc **rzadko powodują kaszel** i są alternatywą, gdy ACEI wywołuje kaszel. Mają te same przeciwwskazania co ACEI (ciąża, obustronne zwężenie tętnic nerkowych) i podobnie grożą hiperkaliemią. Losartan działa dodatkowo urykozurycznie. **Sakubitryl z walsartanem (ARNI)** hamuje neprylizynę, co zwiększa stężenie peptydów natriuretycznych, i stosuje się go w HFrEF. **Aliskiren** jest bezpośrednim inhibitorem reniny. Według EMA (2014) **nie łączy się dwóch leków blokujących RAA**: ACEI z ARB jest przeciwwskazane w nefropatii cukrzycowej, a aliskiren z ACEI lub ARB w cukrzycy i przy GFR < 60. Takie połączenia grożą hiperkaliemią, hipotensją i niewydolnością nerek. Jedynym wyjątkiem jest kandesartan lub walsartan dodany do ACEI w niewydolności serca, pod ścisłą kontrolą.", "**Antagoniści wapnia** blokują kanały wapniowe typu L. **Dihydropirydyny** (amlodypina, nitrendypina, lerkanidypina, felodypina, nifedypina, nimodypina w krwawieniu podpajęczynówkowym) działają głównie na naczynia. Dają **obrzęki okolicy kostek** (rozszerzenie tętniczek przedwłośniczkowych), zaczerwienienie twarzy, bóle głowy, odruchową tachykardię (zwłaszcza krótko działająca nifedypina, której nie stosuje się w OZW) i przerost dziąseł. **Niedihydropirydynowe** (werapamil, diltiazem) działają głównie na serce: zwalniają akcję serca i przewodzenie AV oraz działają inotropowo ujemnie. Stosuje się je w kontroli rytmu i w dławicy, ale są **przeciwwskazane w HFrEF i blokach AV**, a z β-blokerami dożylnie grożą asystolią. Werapamil powoduje **zaparcia** i hamuje CYP3A4 oraz P-gp (podnosi stężenie digoksyny i statyn).", "**Leki o działaniu ośrodkowym**: klonidyna, metyldopa (w ciąży) i moksonidyna. **α1-adrenolityki** (doksazosyna, urapidyl dożylnie) stosuje się w nadciśnieniu opornym i łagodnym rozroście prostaty. **Leki bezpośrednio rozszerzające tętniczki**: **hydralazyna** (w ciąży, z azotanem w HFrEF; wywołuje odruchową tachykardię, retencję sodu i **toczeń polekowy** u wolnych acetylatorów), **minoksydyl** (otwiera kanały K-ATP; hirsutyzm, stąd stosowanie w łysieniu, obrzęki, wysięk osierdziowy) oraz **nitroprusydek sodu** (dożylnie w stanach nagłych, uwalnia NO; przy dłuższym stosowaniu grozi zatruciem cyjankami). **Ciąża**: metyldopa, labetalol, nifedypina o przedłużonym uwalnianiu. **Stany nagłe** (nadciśnienie złośliwe, przełom): urapidyl, labetalol, nitrogliceryna, nitroprusydek, klonidyna i esmolol dożylnie. Nowsze leki: antagoniści receptora endoteliny (aprocytentan) i finerenon (niesteroidowy MRA w cukrzycowej chorobie nerek)."], "review": [{"h": "Strategia leczenia (ESC 2024)", "items": ["I wybór: **ACEI lub ARB**, **CCB-dihydropirydyna**, **diuretyk tiazydowy/tiazydopodobny** (hydrochlorotiazyd, indapamid, chlortalidon)", "Start: **dwa leki w małych dawkach w jednej tabletce** (monoterapia: ≥ 85 lat, kruchość, hipotonia ortostatyczna, RR 130–139/80–89 przy wysokim ryzyku)", "Krok następny: **trzy leki** (ACEI/ARB + CCB + diuretyk), potem zwiększanie dawek", "Cel: skurczowe **120–129 mm Hg** (jeśli tolerowane), rozkurczowe 70–79", "Nadciśnienie oporne: **spironolakton** (eplerenon) → β-bloker → α-bloker, hydralazyna, inne", "β-blokery – nie I wybór; dodawać przy wskazaniach (choroba wieńcowa, HF, AF, ciąża, młode kobiety planujące ciążę)", "Nie łączyć **ACEI + ARB** (ani z aliskirenem)"]}, {"h": "ACEI", "items": ["Kaptopril (krótko, grupa SH), **enalapril** (prolek), **peryndopryl, ramipril** (proleki), **lizynopryl** (aktywny, wydalany przez nerki), chinapryl, cilazapril, trandolapril", "Mechanizm: ↓ angiotensyny II (rozszerzenie naczyń, ↓ aldosteronu, ↓ przebudowy serca), **↑ bradykininy**", "Rozszerzenie **tętniczki odprowadzającej** → ↓ ciśnienia w kłębuszku, ↓ białkomoczu (nefroprotekcja)", "Wskazania: nadciśnienie, **HFrEF**, po zawale, **nefropatia cukrzycowa / białkomocz**, prewencja sercowo-naczyniowa", "Działania: **suchy kaszel** (10–20%), **obrzęk naczynioruchowy** (częściej u osób rasy czarnej), **hiperkaliemia**, ↑ kreatyniny (do 30% – akceptowalne), hipotensja pierwszej dawki (odwodnienie, diuretyki), zaburzenia smaku, neutropenia (kaptopril)", "Przeciwwskazania: **ciąża** (II–III trymestr – małowodzie, niewydolność nerek płodu, hipoplazja czaszki), **obustronne zwężenie tętnic nerkowych**, obrzęk naczynioruchowy w wywiadzie, sakubitryl (**36 h** przerwy)", "Interakcje: **spironolakton, suplementy K⁺, trimetoprim** → hiperkaliemia; **NLPZ** → ↓ działania, ↑ nefrotoksyczności; **lit** ↑"]}, {"h": "Sartany i inne leki RAA", "items": ["**Losartan** (urykozuryczny), **walsartan, kandesartan, telmisartan** (najdłuższy t½), irbesartan, olmesartan (enteropatia – rzadko), azilsartan", "Blokada **AT1** → brak wpływu na bradykininę → **rzadko kaszel**", "Przeciwwskazania i działania jak ACEI (ciąża, zwężenie tętnic nerkowych, hiperkaliemia)", "**Sakubitryl/walsartan (ARNI)** – hamowanie **neprylizyny** (↑ peptydów natriuretycznych) + ARB; HFrEF; obrzęk naczynioruchowy, hipotensja", "**Aliskiren** – bezpośredni inhibitor **reniny**", "EMA 2014: nie łączyć ACEI + ARB + aliskiren; **ACEI + ARB przeciwwskazane w nefropatii cukrzycowej**; **aliskiren + ACEI/ARB przeciwwskazany w cukrzycy i przy GFR < 60**; ryzyka: hiperkaliemia, hipotensja, niewydolność nerek", "Wyjątek: **kandesartan/walsartan + ACEI w niewydolności serca** – pod nadzorem specjalisty"]}, {"h": "Antagoniści wapnia", "items": ["Blokada kanałów wapniowych typu **L**", "**Dihydropirydyny** (naczyniowo): **amlodypina** (długi t½), nitrendypina, lerkanidypina, lacydypina, felodypina, **nifedypina** (krótko działająca – nie w OZW: odruchowa tachykardia), **nimodypina** (krwotok podpajęczynówkowy – skurcz naczyń)", "Działania DHP: **obrzęki okolicy kostek** (nie ustępują po diuretyku), zaczerwienienie, bóle głowy, kołatania, **przerost dziąseł**", "**Niedihydropirydynowe** (sercowo): **werapamil, diltiazem** – ↓ HR, ↓ przewodzenia AV, inotropowo ujemnie", "Wskazania werapamilu/diltiazemu: kontrola rytmu komór w AF, częstoskurcze nadkomorowe, dławica (gdy β-bloker przeciwwskazany)", "Przeciwwskazania: **HFrEF**, bloki AV II–III°, SSS, bradykardia, WPW z AF; **nie z β-blokerem i.v.**", "Werapamil: **zaparcia**, hamuje **CYP3A4 i P-gp** (↑ digoksyna, statyny, dabigatran)"]}, {"h": "Leki ośrodkowe, α-blokery, wazodylatatory", "items": ["Ośrodkowe: **klonidyna** (odbicie po odstawieniu), **metyldopa** (ciąża), **moksonidyna** (I1)", "α1: **doksazosyna** (BPH + nadciśnienie oporne), **urapidyl** (i.v. – stany nagłe; także 5-HT1A)", "**Hydralazyna** – bezpośrednio rozszerza tętniczki; odruchowa tachykardia, retencja Na⁺, **toczeń polekowy** (wolni acetylatorzy); ciąża, HFrEF (z diazotanem izosorbidu)", "**Minoksydyl** – otwiera **kanały K-ATP**; **hirsutyzm** (stąd miejscowo w łysieniu), obrzęki, wysięk osierdziowy; zawsze z β-blokerem i diuretykiem", "**Nitroprusydek sodu** – i.v., donor NO, natychmiastowy; przełom nadciśnieniowy, rozwarstwienie aorty (z β-blokerem); **zatrucie cyjankami/tiocyjanianami** przy dłuższym wlewie, światłoczuły", "Ciąża: **metyldopa, labetalol, nifedypina (przedłużone uwalnianie)**; stan przedrzucawkowy – + MgSO₄", "Stany nagłe i.v.: urapidyl, labetalol, esmolol, nitrogliceryna, nitroprusydek, klonidyna, (fenoldopam)", "Nowe: aprocytentan (antagonista endoteliny), finerenon (niesteroidowy MRA – cukrzycowa choroba nerek)"]}], "cards": [{"q": "Jakie grupy leków są pierwszego wyboru w nadciśnieniu tętniczym wg ESC 2024?", "a": "**ACEI lub ARB**, **antagoniści wapnia (dihydropirydyny)**, **diuretyki tiazydowe/tiazydopodobne**; β-blokery – przy szczególnych wskazaniach."}, {"q": "Jak ESC 2024 zaleca rozpoczynać leczenie nadciśnienia u większości chorych?", "a": "Od **dwóch leków w małych dawkach, najlepiej w jednej tabletce** (np. ACEI/ARB + CCB lub + diuretyk); następny krok – trzy leki."}, {"q": "Jaki jest docelowy skurczowy RR u większości leczonych dorosłych wg ESC 2024?", "a": "**120–129 mm Hg**, jeśli leczenie jest dobrze tolerowane (inaczej – tak nisko, jak rozsądnie możliwe)."}, {"q": "Jaki lek dodaje się w nadciśnieniu opornym?", "a": "**Spironolakton** (przy nietolerancji – eplerenon); następnie β-bloker, α-bloker, hydralazyna."}, {"q": "Jaki jest mechanizm działania ACEI?", "a": "Hamują **konwertazę angiotensyny** → ↓ angiotensyny II (rozszerzenie naczyń, ↓ aldosteronu, ↓ przebudowy) oraz ↓ rozkładu **bradykininy** (↑ bradykininy – rozszerzenie naczyń, ale też kaszel)."}, {"q": "Dlaczego ACEI działają nefroprotekcyjnie?", "a": "Rozszerzają **tętniczkę odprowadzającą** kłębuszka → ↓ ciśnienia wewnątrzkłębuszkowego i **↓ białkomoczu** (nefropatia cukrzycowa, przewlekła choroba nerek)."}, {"q": "Które ACEI są prolekami?", "a": "**Enalapril, peryndopryl, ramipril**, chinapryl, cilazapril, trandolapril (wymagają aktywacji w wątrobie). Aktywne od razu: **kaptopril, lizynopryl**."}, {"q": "Jaka jest przyczyna suchego kaszlu po ACEI i jak postępować?", "a": "Kumulacja **bradykininy** i substancji P w drogach oddechowych (10–20% chorych). Postępowanie: zamiana na **sartan**."}, {"q": "Jakie jest najgroźniejsze działanie niepożądane ACEI?", "a": "**Obrzęk naczynioruchowy** (zależny od bradykininy) – może zagrażać życiu (obrzęk krtani); po jego wystąpieniu ACEI przeciwwskazane na zawsze."}, {"q": "Jakie są przeciwwskazania do ACEI i sartanów?", "a": "**Ciąża** (II i III trymestr – działanie fetotoksyczne), **obustronne zwężenie tętnic nerkowych** (lub tętnicy jedynej nerki), obrzęk naczynioruchowy w wywiadzie (ACEI), hiperkaliemia."}, {"q": "Dlaczego ACEI mogą wywołać ostrą niewydolność nerek przy obustronnym zwężeniu tętnic nerkowych?", "a": "Filtracja zależy wtedy od skurczu **tętniczki odprowadzającej** wywołanego angiotensyną II – jego zniesienie gwałtownie obniża GFR."}, {"q": "O ile może wzrosnąć kreatynina po włączeniu ACEI, by nie odstawiać leku?", "a": "Wzrost do ok. **30%** jest akceptowalny; większy – szukać zwężenia tętnic nerkowych, odwodnienia, odstawić/zmniejszyć dawkę."}, {"q": "Jakie leki w połączeniu z ACEI zwiększają ryzyko hiperkaliemii?", "a": "**Spironolakton/eplerenon, amiloryd, suplementy potasu, trimetoprim**, NLPZ, heparyna, sartany, aliskiren."}, {"q": "Ile godzin przerwy trzeba zachować między ACEI a sakubitrylem/walsartanem?", "a": "**36 godzin** – ryzyko obrzęku naczynioruchowego (oba szlaki zwiększają bradykininę)."}, {"q": "Jaki jest mechanizm działania sartanów i czym różnią się od ACEI?", "a": "Blokują receptor **AT1** angiotensyny II. Nie hamują rozkładu bradykininy → **rzadko wywołują kaszel** i obrzęk naczynioruchowy."}, {"q": "Który sartan ma dodatkowe działanie urykozuryczne?", "a": "**Losartan** (zwiększa wydalanie kwasu moczowego)."}, {"q": "Jak działa sakubitryl/walsartan i kiedy się go stosuje?", "a": "**Sakubitryl hamuje neprylizynę** (↑ peptydów natriuretycznych) + walsartan blokuje AT1. Stosowany w **niewydolności serca z obniżoną frakcją wyrzutową** (zamiast ACEI)."}, {"q": "Jaki jest mechanizm działania aliskirenu?", "a": "Bezpośredni **inhibitor reniny** – blokuje przekształcenie angiotensynogenu w angiotensynę I."}, {"q": "Jakie skojarzenia leków RAA ograniczyła EMA w 2014 r. i dlaczego?", "a": "Łączenie **ACEI + ARB** oraz któregokolwiek z **aliskirenem** – ryzyko **hiperkaliemii, hipotensji i niewydolności nerek**. ACEI + ARB przeciwwskazane w nefropatii cukrzycowej; aliskiren + ACEI/ARB – w cukrzycy i przy GFR < 60."}, {"q": "Kiedy dopuszcza się łączenie ACEI z sartanem?", "a": "Wyjątkowo w **niewydolności serca** – kandesartan lub walsartan dodany do ACEI, pod nadzorem specjalisty z kontrolą nerek, potasu i RR."}, {"q": "Czym różnią się dihydropirydyny od werapamilu i diltiazemu?", "a": "**Dihydropirydyny** działają głównie na **naczynia** (rozszerzenie, odruchowa tachykardia). **Werapamil i diltiazem** – głównie na **serce** (↓ HR, ↓ przewodzenia AV, inotropowo ujemnie)."}, {"q": "Jakie są typowe działania niepożądane amlodypiny?", "a": "**Obrzęki okolicy kostek**, zaczerwienienie twarzy, bóle głowy, kołatania serca, przerost dziąseł."}, {"q": "Dlaczego obrzęki po amlodypinie nie ustępują po diuretyku?", "a": "Nie wynikają z retencji sodu, lecz z **rozszerzenia tętniczek przedwłośniczkowych** (↑ ciśnienia hydrostatycznego w kapilarach); zmniejsza je dołączenie ACEI/ARB."}, {"q": "Dlaczego krótko działającej nifedypiny nie stosuje się w ostrym zespole wieńcowym?", "a": "Gwałtowny spadek RR wywołuje **odruchową tachykardię** i aktywację współczulną → nasilenie niedokrwienia (↑ śmiertelności)."}, {"q": "Do czego stosuje się nimodypinę?", "a": "W **krwotoku podpajęczynówkowym** – zapobieganie skurczowi naczyń mózgowych."}, {"q": "Jakie są przeciwwskazania do werapamilu i diltiazemu?", "a": "**Niewydolność serca z obniżoną EF**, bloki AV II–III stopnia, zespół chorego węzła, bradykardia, migotanie przedsionków w zespole WPW, dożylne łączenie z β-blokerem."}, {"q": "Jakie jest typowe działanie niepożądane werapamilu ze strony przewodu pokarmowego?", "a": "**Zaparcia**."}, {"q": "Jakie interakcje wynikają z hamowania CYP3A4 i P-gp przez werapamil?", "a": "↑ stężenia **digoksyny**, statyn (symwastatyna – miopatia), dabigatranu, cyklosporyny; z β-blokerem – bradykardia, bloki."}, {"q": "Jakie leki hipotensyjne można stosować w ciąży?", "a": "**Metyldopa, labetalol, nifedypina** o przedłużonym uwalnianiu (w stanach nagłych: labetalol i.v., urapidyl, hydralazyna)."}, {"q": "Jakie są działania niepożądane hydralazyny?", "a": "Odruchowa tachykardia, retencja sodu i wody, bóle głowy, **toczeń polekowy** (zwłaszcza u wolnych acetylatorów)."}, {"q": "Jaki jest mechanizm działania minoksydylu i jego charakterystyczne działanie niepożądane?", "a": "Otwiera **kanały potasowe zależne od ATP** w mięśniówce tętniczek → hiperpolaryzacja, rozkurcz. Działanie niepożądane: **hirsutyzm** (stąd miejscowo w łysieniu), obrzęki, wysięk osierdziowy, odruchowa tachykardia."}, {"q": "Jakie jest ryzyko długotrwałego wlewu nitroprusydku sodu?", "a": "**Zatrucie cyjankami** (i tiocyjanianami w niewydolności nerek) – kwasica metaboliczna; lek jest też światłoczuły."}, {"q": "Jakie leki stosuje się dożylnie w stanach nagłych w nadciśnieniu?", "a": "**Urapidyl, labetalol, esmolol, nitrogliceryna, nitroprusydek sodu**, klonidyna; w rozwarstwieniu aorty – β-bloker + wazodylatator."}, {"q": "Kiedy β-bloker ma szczególne wskazanie w leczeniu nadciśnienia?", "a": "Przy **chorobie wieńcowej, niewydolności serca z obniżoną EF, migotaniu przedsionków** (kontrola rytmu), po zawale, w ciąży (labetalol), u kobiet planujących ciążę."}], "sources": [{"t": "McCarthy CP i wsp. 2024 ESC Guidelines for the management of elevated blood pressure and hypertension: what is new in pharmacotherapy? Eur Heart J Cardiovasc Pharmacother 2025;11(1):7–9", "u": "https://academic.oup.com/ehjcvp/article/11/1/7/7831665"}, {"t": "EMA – Ograniczenie łączenia leków działających na układ renina–angiotensyna (2014, j. polski)", "u": "https://www.ema.europa.eu/pl/documents/referral/restriction-combined-use-medicines-affecting-renin-angiotensin-system-ras_pl.pdf"}]}, {"id": "f-wiencowe", "num": "F12", "title": "Leki w chorobie niedokrwiennej serca i ostrych zespołach wieńcowych", "summary": ["Leczenie przewlekłego zespołu wieńcowego ma dwa cele. Pierwszy to **zmniejszenie objawó
