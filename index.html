w dławicy**: β-blokery, antagoniści wapnia, azotany, iwabradyna, ranolazyna i trimetazydyna. Drugi to **poprawa rokowania**: kwas acetylosalicylowy (lub klopidogrel), statyny w dużych dawkach, ACEI lub ARB (zwłaszcza w nadciśnieniu, cukrzycy, HFrEF i przewlekłej chorobie nerek) oraz kontrola czynników ryzyka. W napadzie dławicy podaje się nitroglicerynę podjęzykowo. **Leki przeciwdławicowe** zmniejszają zapotrzebowanie mięśnia sercowego na tlen (zwolnienie akcji serca, zmniejszenie kurczliwości i obciążenia) albo zwiększają dowóz tlenu (rozszerzenie naczyń wieńcowych).", "**Azotany** (nitrogliceryna, diazotan i monoazotan izosorbidu) i **molsidomina** to donory **NO**. NO aktywuje cyklazę guanylanową, co zwiększa cGMP i rozkurcza mięśnie gładkie, przede wszystkim **żył**. Spada obciążenie wstępne i napięcie ściany komory, a w efekcie zapotrzebowanie na tlen. Azotany rozszerzają też duże tętnice wieńcowe i znoszą ich skurcz. **Nitroglicerynę** podaje się **podjęzykowo** (tabletki lub aerozol), bo ma silny efekt pierwszego przejścia, a w ostrych stanach dożylnie. Działania niepożądane: **ból głowy**, zaczerwienienie, hipotonia i odruchowa tachykardia. Szybko rozwija się **tolerancja**, dlatego potrzebna jest codzienna przerwa beznitratowa (8–12 h). **Przeciwwskazanie bezwzględne**: inhibitory **PDE-5** (sildenafil, tadalafil), bo grożą ciężką hipotensją. Azotanów nie podaje się też w zawale prawej komory, przy ciężkiej hipotensji i w kardiomiopatii przerostowej z zawężeniem drogi odpływu. Molsidomina nie wymaga bioaktywacji enzymatycznej i słabiej wywołuje tolerancję.", "**β-blokery** zmniejszają częstość, kurczliwość i zużycie tlenu oraz wydłużają rozkurcz (lepsza perfuzja wieńcowa). Po zawale poprawiają rokowanie. **Antagoniści wapnia** (dihydropirydyny i niedihydropirydynowe) są lekami pierwszego wyboru w **dławicy naczynioskurczowej (Prinzmetala)**, w której nieselektywne β-blokery mogą nasilać skurcz. **Iwabradyna** hamuje prąd **If** w węźle zatokowym i zwalnia rytm bez wpływu na kurczliwość. Według EMA (2014) w dławicy włącza się ją tylko przy **spoczynkowym HR ≥ 70/min**, jest przeciwwskazana z werapamilem i diltiazemem, zwiększa ryzyko migotania przedsionków i wywołuje zaburzenia widzenia (fosfeny). **Ranolazyna** hamuje późny prąd sodowy (wydłuża QT, hamuje CYP3A4). **Trimetazydyna** przestawia metabolizm na glukozę i może nasilać objawy parkinsonowskie. Nikorandil otwiera kanały K-ATP i jest donorem NO.", "**Leki przeciwpłytkowe**: **kwas acetylosalicylowy** (nieodwracalnie hamuje COX-1, czyli TXA2) i **inhibitory receptora P2Y12**. **Klopidogrel** jest prolekiem aktywowanym przez **CYP2C19**: wolni metabolizerzy mają słabszy efekt, a omeprazol i esomeprazol mogą osłabiać jego działanie. **Prasugrel** to również prolek, ale działa silniej i szybciej. Jest przeciwwskazany po udarze lub TIA i ostrożnie stosowany u osób ≥ 75 lat i < 60 kg. **Tikagrelor** działa bezpośrednio i **odwracalnie**. W OZW podaje się 180 mg dawki nasycającej, potem 90 mg 2 razy dziennie z ASA w dawce 75–150 mg. Daje **duszność**, krwawienia, hiperurykemię i bradyarytmie, jest przeciwwskazany z silnymi inhibitorami CYP3A4 i po krwawieniu śródczaszkowym, a przed planowym zabiegiem odstawia się go 5 dni wcześniej. **Podwójna terapia przeciwpłytkowa** (DAPT: ASA + inhibitor P2Y12) trwa zwykle 12 miesięcy po OZW lub PCI. Dożylnie stosuje się kangrelor i inhibitory GP IIb/IIIa (abcyksymab, eptyfibatyd, tirofiban). **Dipirydamol** hamuje PDE i wychwyt adenozyny.", "**Leczenie OZW**: leki przeciwpłytkowe (ASA + inhibitor P2Y12), **antykoagulant** w fazie ostrej (heparyna niefrakcjonowana, enoksaparyna, fondaparynuks lub biwalirudyna), szybka reperfuzja (**pierwotna PCI**, a gdy nie jest dostępna w czasie, **fibrynoliza**), azotany przy bólu i nadciśnieniu, opioid (morfina) przy silnym bólu, tlen tylko przy SpO₂ < 90%, a potem β-bloker, ACEI, statyna w dużej dawce i antagonista aldosteronu przy EF ≤ 40%. **Leki fibrynolityczne** (alteplaza, **tenekteplaza**, reteplaza, dawniej streptokinaza) przekształcają plazminogen w **plazminę**. Leki swoiste dla fibryny działają lepiej, a streptokinaza jest antygenowa (przeciwciała, alergia). Przeciwwskazania do fibrynolizy: przebyty udar krwotoczny, udar niedokrwienny w ostatnich 6 miesiącach, uszkodzenie OUN, niedawny duży uraz lub operacja, czynne krwawienie, rozwarstwienie aorty i nakłucia niepoddające się uciskowi. We wstrząsie kardiogennym stosuje się **noradrenalinę** i **dobutaminę**."], "review": [{"h": "Strategia w przewlekłym zespole wieńcowym", "items": ["Objawy: **β-bloker lub CCB** (I linia), azotany długo działające, iwabradyna, ranolazyna, trimetazydyna, nikorandil", "Napad: **nitrogliceryna podjęzykowo** (powtórzyć po 5 min; brak efektu po 3 dawkach / 15 min → podejrzenie zawału)", "Rokowanie: **ASA 75–100 mg** (lub klopidogrel), **statyna w dużej dawce** (cel LDL < 55 mg/dl), ACEI/ARB przy wskazaniach", "Dławica naczynioskurczowa: **CCB + azotany**; unikać nieselektywnych β-blokerów"]}, {"h": "Azotany i molsidomina", "items": ["Donory **NO** → cyklaza guanylanowa → **↑ cGMP** → rozkurcz mięśni gładkich", "Głównie **żyły** (↓ obciążenia wstępnego, ↓ napięcia ściany → ↓ MVO₂); także tętnice wieńcowe (znoszą skurcz), kolaterale", "**Nitrogliceryna** – podjęzykowo (efekt pierwszego przejścia), i.v. (OZW, obrzęk płuc), plastry; **diazotan i monoazotan izosorbidu** (monoazotan – bez efektu pierwszego przejścia)", "Działania: **ból głowy**, zaczerwienienie, hipotonia ortostatyczna, odruchowa tachykardia, methemoglobinemia (duże dawki)", "**Tolerancja** – szybka (wyczerpanie grup SH, stres oksydacyjny) → **przerwa beznitratowa 8–12 h**/dobę", "Przeciwwskazania: **inhibitory PDE-5** (sildenafil 24 h, tadalafil 48 h) → ciężka hipotensja; RR skurczowe < 90; **zawał prawej komory**; kardiomiopatia przerostowa z zawężeniem; ciężka stenoza aortalna", "**Molsidomina** – donor NO bez bioaktywacji enzymatycznej, mniejsza tolerancja"]}, {"h": "Inne leki przeciwdławicowe", "items": ["**β-blokery** – ↓ HR, ↓ kurczliwości, wydłużenie rozkurczu (perfuzja wieńcowa); po zawale ↓ śmiertelności", "**CCB** – DHP (amlodypina) rozszerzają naczynia; werapamil/diltiazem ↓ HR; I wybór w dławicy Prinzmetala", "**Iwabradyna** – hamuje prąd **If** („funny”) węzła zatokowego → ↓ HR bez wpływu na kurczliwość i RR", "Iwabradyna (EMA 2014): start tylko przy **spoczynkowym HR ≥ 70/min**; max 7,5 mg 2×/d; **przeciwwskazana z werapamilem/diltiazemem**; ↑ ryzyka **migotania przedsionków**; przerwać, jeśli brak poprawy po 3 mies.; **fosfeny** (zaburzenia widzenia); silne inhibitory CYP3A4 przeciwwskazane", "**Ranolazyna** – hamuje **późny prąd sodowy** (↓ przeładowania Ca²⁺); wydłuża QT, inhibitor CYP3A4/P-gp", "**Trimetazydyna** – hamuje β-oksydację kwasów tłuszczowych (↑ wykorzystania glukozy); może wywołać/nasilić **objawy parkinsonowskie** – leczenie II linii", "**Nikorandil** – otwiera kanały K-ATP + donor NO; owrzodzenia jamy ustnej i przewodu pokarmowego"]}, {"h": "Leki przeciwpłytkowe", "items": ["**ASA** – nieodwracalnie COX-1 → ↓ **TXA2**; 75–100 mg/d; dawka nasycająca w OZW 150–300 mg (rozgryźć)", "**Klopidogrel** – prolek (**CYP2C19**), nieodwracalny antagonista P2Y12; wolni metabolizerzy – słabszy efekt; **omeprazol/esomeprazol** ↓ działania (wybrać pantoprazol)", "**Prasugrel** – prolek, silniejszy i szybszy; przeciwwskazany po **udarze/TIA**; ostrożnie ≥ 75 lat, < 60 kg", "**Tikagrelor** – **bezpośredni, odwracalny** antagonista P2Y12 (+ hamowanie ENT-1 → ↑ adenozyny)", "Tikagrelor (ChPL): OZW **180 mg**, potem **90 mg 2×/d** + ASA 75–150 mg (ASA > 300 mg niezalecane); po zawale > 1 rok – 60 mg 2×/d", "Tikagrelor – działania: **krwawienia, duszność**, **hiperurykemia**, bradyarytmie/bloki; przeciwwskazania: czynne krwawienie, **krwawienie śródczaszkowe w wywiadzie**, ciężka niewydolność wątroby, **silne inhibitory CYP3A4**; odstawić **5 dni** przed zabiegiem", "**DAPT** (ASA + P2Y12) – zwykle 12 mies. po OZW; po PCI w stabilnej chorobie – krócej", "Dożylne: **kangrelor** (P2Y12), inhibitory **GP IIb/IIIa** (abcyksymab, eptyfibatyd, tirofiban) – trombocytopenia", "**Dipirydamol** – inhibitor PDE i wychwytu adenozyny (z ASA w prewencji udaru); **cilostazol** (PDE3) – chromanie przestankowe, przeciwwskazany w niewydolności serca"]}, {"h": "OZW i fibrynoliza", "items": ["Faza ostra: **ASA + inhibitor P2Y12 + antykoagulant** (HNF, enoksaparyna, fondaparynuks, biwalirudyna)", "Reperfuzja: **pierwotna PCI**; gdy niedostępna w czasie – **fibrynoliza** (STEMI)", "Ból: nitrogliceryna (gdy RR pozwala), **morfina** (osłabia wchłanianie doustnych P2Y12); tlen tylko przy **SpO₂ < 90%**", "Później: β-bloker, ACEI (ARB), **statyna w dużej dawce**, MRA (eplerenon) przy EF ≤ 40% + HF/cukrzyca", "**Fibrynolityki**: aktywują plazminogen → **plazmina** (rozkład fibryny)", "Swoiste dla fibryny: **alteplaza** (rt-PA, wlew), **tenekteplaza** (bolus), reteplaza; nieswoista: **streptokinaza** (antygenowa – przeciwciała, alergia, nie powtarzać)", "Przeciwwskazania bezwzględne: **udar krwotoczny kiedykolwiek**, udar niedokrwienny < 6 mies., uszkodzenie/nowotwór OUN, poważny uraz/operacja/uraz głowy < 1 mies., krwawienie z p. pokarmowego < 1 mies., skaza krwotoczna, **rozwarstwienie aorty**, nakłucia niepoddające się uciskowi", "Antidotum fibrynolizy: **kwas traneksamowy**, kwas ε-aminokapronowy (antyfibrynolityki)", "Wstrząs kardiogenny: **noradrenalina**, **dobutamina**; levosimendan, milrinon"]}], "cards": [{"q": "Jakie są dwa cele farmakoterapii przewlekłego zespołu wieńcowego i jakie leki im służą?", "a": "**Kontrola objawów**: β-blokery, CCB, azotany, iwabradyna, ranolazyna, trimetazydyna. **Poprawa rokowania**: ASA (lub klopidogrel), statyny w dużych dawkach, ACEI/ARB przy wskazaniach."}, {"q": "Jaki jest mechanizm działania azotanów?", "a": "Uwalniają **NO** → aktywacja rozpuszczalnej **cyklazy guanylanowej** → ↑ **cGMP** → rozkurcz mięśni gładkich naczyń, głównie żył."}, {"q": "Dlaczego azotany zmniejszają zapotrzebowanie serca na tlen?", "a": "Rozszerzają **żyły** → ↓ powrotu żylnego (obciążenia wstępnego) → ↓ objętości i napięcia ściany komory; dodatkowo rozszerzają tętnice wieńcowe i znoszą ich skurcz."}, {"q": "Dlaczego nitroglicerynę podaje się podjęzykowo?", "a": "Ma silny **efekt pierwszego przejścia** w wątrobie – podjęzykowo wchłania się szybko do krążenia ogólnego (działanie w 1–3 min)."}, {"q": "Jak postępować w napadzie dławicy z nitrogliceryną?", "a": "Podać podjęzykowo, w razie potrzeby powtórzyć po **5 minutach**; jeśli ból nie ustępuje po 3 dawkach (15 min) – podejrzewać **zawał**, wezwać pomoc."}, {"q": "Jakie są działania niepożądane azotanów?", "a": "**Ból głowy** (rozszerzenie naczyń mózgowych), zaczerwienienie twarzy, **hipotonia ortostatyczna**, omdlenia, odruchowa tachykardia; methemoglobinemia przy dużych dawkach."}, {"q": "Jak zapobiega się tolerancji na azotany?", "a": "Stosując **codzienną przerwę beznitratową** (8–12 h, zwykle w nocy) – dawkowanie asymetryczne."}, {"q": "Dlaczego azotanów nie wolno łączyć z sildenafilem?", "a": "Inhibitory **PDE-5** hamują rozkład cGMP – sumowanie z azotanami (↑ cGMP) → **ciężka hipotensja**, zawał, zgon. Odstęp: 24 h po sildenafilu, 48 h po tadalafilu."}, {"q": "W jakim zawale azotany są przeciwwskazane?", "a": "W **zawale prawej komory** (zależność od obciążenia wstępnego → ciężka hipotensja); także przy RR skurczowym < 90 mm Hg."}, {"q": "Czym molsidomina różni się od nitrogliceryny?", "a": "Uwalnia NO **bez bioaktywacji enzymatycznej** i słabiej wywołuje tolerancję."}, {"q": "Jak β-blokery zmniejszają niedokrwienie mięśnia sercowego?", "a": "↓ HR i kurczliwości (↓ zużycia tlenu) oraz **wydłużenie rozkurczu** (lepsza perfuzja wieńcowa, która zachodzi w rozkurczu)."}, {"q": "Jakie leki są pierwszego wyboru w dławicy naczynioskurczowej (Prinzmetala)?", "a": "**Antagoniści wapnia** (+ azotany); nieselektywne β-blokery mogą nasilać skurcz naczyń (nieprzeciwstawiony α)."}, {"q": "Jaki jest mechanizm działania iwabradyny?", "a": "Hamuje prąd **If** („funny current”) w komórkach węzła zatokowego → zwolnienie akcji serca **bez wpływu na kurczliwość** i ciśnienie."}, {"q": "Przy jakiej częstości rytmu serca można włączyć iwabradynę w dławicy (EMA 2014)?", "a": "Tylko gdy spoczynkowy HR wynosi **≥ 70/min** (dawka początkowa max 5 mg 2×/d, podtrzymująca max 7,5 mg 2×/d)."}, {"q": "Z jakimi lekami iwabradyna jest przeciwwskazana i jakie ma ryzyka?", "a": "Z **werapamilem i diltiazemem** (oraz silnymi inhibitorami CYP3A4). Ryzyka: **migotanie przedsionków**, bradykardia, **fosfeny** (przemijające zaburzenia widzenia)."}, {"q": "Jaki jest mechanizm działania ranolazyny?", "a": "Hamuje **późny prąd sodowy** w kardiomiocytach → ↓ przeładowania wapniem i ↓ napięcia ściany w rozkurczu; wydłuża QT, hamuje CYP3A4 i P-gp."}, {"q": "Jaki jest mechanizm działania trimetazydyny i jej ważne działanie niepożądane?", "a": "Hamuje **β-oksydację kwasów tłuszczowych** → serce zużywa więcej glukozy (mniej tlenu na ATP). Działanie niepożądane: **objawy parkinsonowskie** (drżenie, sztywność)."}, {"q": "Jaki jest mechanizm działania nikorandilu?", "a": "Otwiera **kanały K-ATP** i jest donorem **NO**; działanie niepożądane – owrzodzenia jamy ustnej i przewodu pokarmowego."}, {"q": "Dlaczego klopidogrel może być nieskuteczny u części pacjentów?", "a": "Jest **prolekiem aktywowanym przez CYP2C19** – wolni metabolizerzy (polimorfizm) i chorzy przyjmujący **omeprazol/esomeprazol** (inhibitory CYP2C19) mają słabszą inhibicję płytek."}, {"q": "Który inhibitor pompy protonowej wybrać u pacjenta na klopidogrelu?", "a": "**Pantoprazol** (słaby wpływ na CYP2C19); unikać omeprazolu i esomeprazolu."}, {"q": "Kiedy prasugrel jest przeciwwskazany?", "a": "U chorych po **udarze mózgu lub TIA**; ostrożnie (mniejsza dawka) u osób **≥ 75 lat** i ważących **< 60 kg** – ryzyko krwawień."}, {"q": "Czym tikagrelor różni się od klopidogrelu?", "a": "Tikagrelor **nie jest prolekiem** (działa bezpośrednio), wiąże P2Y12 **odwracalnie**, działa szybciej i silniej; podawany **2× na dobę**."}, {"q": "Jak dawkuje się tikagrelor w OZW (ChPL)?", "a": "Dawka nasycająca **180 mg**, potem **90 mg 2× na dobę** (zwykle 12 mies.) razem z **ASA 75–150 mg/d** (dawki ASA > 300 mg niezalecane)."}, {"q": "Jakie są charakterystyczne działania niepożądane tikagreloru?", "a": "**Krwawienia**, **duszność** (adenozyna), **hiperurykemia**, bradyarytmie i bloki AV, wzrost kreatyniny."}, {"q": "Jakie są przeciwwskazania do tikagreloru?", "a": "Czynne krwawienie, **krwawienie śródczaszkowe w wywiadzie**, ciężka niewydolność wątroby, jednoczesne stosowanie **silnych inhibitorów CYP3A4** (ketokonazol, klarytromycyna, rytonawir)."}, {"q": "Ile dni przed planowym zabiegiem odstawia się tikagrelor?", "a": "**5 dni** (klopidogrel – 5 dni, prasugrel – 7 dni)."}, {"q": "Czym jest DAPT i jak długo trwa po OZW?", "a": "Podwójna terapia przeciwpłytkowa: **ASA + inhibitor P2Y12** – standardowo **12 miesięcy** po ostrym zespole wieńcowym (modyfikowana wg ryzyka krwawienia)."}, {"q": "Jak działają inhibitory glikoproteiny IIb/IIIa?", "a": "Blokują receptor fibrynogenu **GP IIb/IIIa** na płytkach – wspólną końcową drogę agregacji (abcyksymab, eptyfibatyd, tirofiban; i.v. w PCI). Działanie niepożądane: krwawienia, **trombocytopenia**."}, {"q": "Kiedy w OZW podaje się tlen?", "a": "Tylko przy **hipoksemii (SpO₂ < 90%)** – rutynowa tlenoterapia nie jest zalecana."}, {"q": "Jaki jest mechanizm działania leków fibrynolitycznych?", "a": "Przekształcają **plazminogen w plazminę**, która rozkłada fibrynę skrzepliny."}, {"q": "Czym różni się tenekteplaza od streptokinazy?", "a": "**Tenekteplaza** – rekombinowana, **swoista dla fibryny**, podawana w jednym bolusie. **Streptokinaza** – nieswoista, bakteryjna, **antygenowa** (alergia, przeciwciała – nie można powtórzyć)."}, {"q": "Wymień bezwzględne przeciwwskazania do fibrynolizy.", "a": "**Udar krwotoczny w wywiadzie**, udar niedokrwienny < 6 mies., uszkodzenie/nowotwór OUN, niedawny poważny uraz/operacja/uraz głowy, krwawienie z p. pokarmowego < 1 mies., skaza krwotoczna, **rozwarstwienie aorty**, nakłucia niepoddające się uciskowi."}, {"q": "Jaki lek odwraca działanie fibrynolityków?", "a": "**Kwas traneksamowy** (antyfibrynolityk – hamuje wiązanie plazminogenu z fibryną); także kwas ε-aminokapronowy."}, {"q": "Jakie leki stosuje się we wstrząsie kardiogennym?", "a": "**Noradrenalina** (wazopresja) i **dobutamina** (inotropowo +); ewentualnie lewosimendan, milrinon; mechaniczne wspomaganie krążenia."}], "sources": [{"t": "EMA – Corlentor i Procoralan (iwabradyna), procedura art. 20 (2014/2015)", "u": "https://www.ema.europa.eu/pl/medicines/human/referrals/corlentor-procoralan"}, {"t": "EMA – Brilique (tikagrelor), Informacja o produkcie / ChPL (j. polski)", "u": "https://www.ema.europa.eu/en/documents/product-information/brilique-epar-product-information_pl.pdf"}]}, {"id": "f-antyarytmiki", "num": "F13", "title": "Glikozydy nasercowe i leki antyarytmiczne (klasyfikacja Vaughana Williamsa)", "summary": ["**Digoksyna** hamuje **Na⁺/K⁺-ATPazę** kardiomiocytów. Rośnie wewnątrzkomórkowe stężenie Na⁺, wymiennik Na⁺/Ca²⁺ słabiej usuwa Ca²⁺, więc przybywa wapnia w siateczce i rośnie **siła skurczu** (efekt inotropowo dodatni). Przez pobudzenie nerwu błędnego digoksyna **zwalnia przewodzenie w węźle AV** i rytm zatokowy. Wskazania według ChPL: **migotanie przedsionków z szybką czynnością komór** i niewydolność serca (NYHA II–IV), w której zmniejsza liczbę hospitalizacji, ale nie śmiertelność. Ma **wąski indeks terapeutyczny**: stężenie terapeutyczne to **0,8–2,0 ng/ml**, a w niewydolności serca celuje się w dolną część zakresu. Wydalana jest głównie przez nerki, ma długi t½ i dużą Vd. Toksyczność nasilają **hipokaliemia**, hipomagnezemia, hiperkalcemia, niewydolność nerek, podeszły wiek, niedotlenienie i niedoczynność tarczycy. Stężenie digoksyny podnoszą amiodaron, werapamil, diltiazem, chinidyna i spironolakton.", "**Zatrucie digoksyną** daje objawy żołądkowo-jelitowe (nudności, wymioty), neurologiczne (splątanie) i **zaburzenia widzenia barw** (żółto-zielone widzenie, mroczki), a także niemal każdą arytmię: dodatkowe pobudzenia komorowe (bigeminia), częstoskurcz przedsionkowy z blokiem, bloki AV, częstoskurcz komorowy dwukierunkowy i bradykardię. W EKG widać typowe „nieckowate” obniżenie ST, które samo nie oznacza zatrucia. W ostrym zatruciu występuje **hiperkaliemia**, która jest złym czynnikiem rokowniczym. Leczenie: odstawienie leku, węgiel aktywowany, wyrównanie potasu i magnezu, atropina w bradykardii, lidokaina lub fenytoina w arytmiach komorowych i swoista odtrutka, **fragmenty Fab przeciwciał przeciw digoksynie**. Przeciwwskazania: **zespół WPW** (ułatwia przewodzenie drogą dodatkową), blok AV II i III stopnia, **kardiomiopatia przerostowa** z zawężeniem drogi odpływu, częstoskurcz komorowy i zespół chorego węzła.", "**Klasyfikacja Vaughana Williamsa**: **klasa I** obejmuje blokery kanałów sodowych. **IA** (chinidyna, prokainamid, dizopiramid) wydłużają potencjał czynnościowy i QT. Chinidyna daje cynchonizm, a prokainamid zespół toczniopodobny. **IB** (lidokaina, meksyletyna, fenytoina) skracają potencjał czynnościowy, działają głównie w niedokrwionej tkance komór i stosuje się je w komorowych zaburzeniach rytmu. Lidokaina ma duży efekt pierwszego przejścia, dlatego podaje się ją tylko dożylnie. **IC** (**propafenon, flekainid**) silnie zwalniają przewodzenie i stosuje się je w migotaniu przedsionków u osób **bez strukturalnej choroby serca**. Po zawale i w niewydolności serca są przeciwwskazane, bo badanie CAST wykazało wzrost śmiertelności. **Klasa II** to **β-blokery**: zwalniają rytm i przewodzenie AV i zmniejszają śmiertelność po zawale.", "**Klasa III** to blokery kanałów **potasowych**, które **wydłużają repolaryzację i QT**: **amiodaron**, dronedaron, **sotalol**, dofetylid, ibutylid i wernakalant. **Amiodaron** działa na wszystkie klasy, jest skuteczny w arytmiach nadkomorowych i komorowych, jest bezpieczny w niewydolności serca, a w zatrzymaniu krążenia z VF lub VT bez tętna podaje się 300 mg i.v. Ma bardzo długi t½ (tygodnie lub miesiące) i zawiera dużo **jodu**. Jego działania niepożądane: **niedoczynność i nadczynność tarczycy**, **zwłóknienie płuc**, uszkodzenie wątroby, mikrozłogi w rogówce, **nadwrażliwość na światło i szaroniebieskie przebarwienia skóry**, neuropatia i bradykardia. Rzadko wywołuje torsade de pointes, mimo że znacznie wydłuża QT. Hamuje CYP i P-gp, więc podnosi stężenie warfaryny, digoksyny i statyn, a z sofosbuwirem grozi bradykardią. **Sotalol** łączy blokadę β z III klasą i grozi torsade de pointes, zwłaszcza w niewydolności nerek. **Dronedaron** jest przeciwwskazany w niewydolności serca i w utrwalonym migotaniu przedsionków.", "**Klasa IV** to niedihydropirydynowi **antagoniści wapnia** (werapamil, diltiazem): zwalniają przewodzenie AV i kontrolują rytm komór w migotaniu przedsionków. Nie podaje się ich w WPW z migotaniem przedsionków ani w HFrEF. Leki **spoza klasyfikacji**: **adenozyna** (receptory A1, krótkotrwały blok AV, t½ kilka sekund, podawana szybkim bolusem dożylnym w częstoskurczu nadkomorowym nawrotnym; wywołuje uczucie zbliżającej się śmierci, zaczerwienienie, duszność i skurcz oskrzeli, a jej działanie nasila dipirydamol i osłabia teofilina), **siarczan magnezu** (torsade de pointes), **atropina** (bradykardia) i **digoksyna**. **Torsade de pointes** to wielokształtny częstoskurcz komorowy przy wydłużonym QT. Wywołują go leki klasy IA i III, makrolidy, fluorochinolony, neuroleptyki, metadon, ondansetron oraz hipokaliemia i hipomagnezemia. Leczenie: **MgSO₄ dożylnie**, odstawienie leku, wyrównanie K⁺ i przyspieszenie rytmu."], "review": [{"h": "Digoksyna (ChPL)", "items": ["Hamuje **Na⁺/K⁺-ATPazę** → ↑ Na⁺ wewnątrz → ↓ wymiany Na⁺/Ca²⁺ → ↑ Ca²⁺ → **inotropowo +**", "Wagotonicznie: ↓ HR, **↓ przewodzenia AV**", "Wskazania: **AF z szybką akcją komór**, niewydolność serca NYHA II–IV (↓ hospitalizacji, bez wpływu na śmiertelność)", "Stężenie terapeutyczne **0,8–2,0 ng/ml** (> 2 ng/ml – objawy toksyczne u ~2/3, > 3 – prawie zawsze); w HF dąży się do niższych wartości", "Wydalanie **nerkowe** (↓ dawki w niewydolności nerek i u seniorów); długi t½ (~36–48 h); duża Vd", "↑ toksyczności: **hipokaliemia**, hipomagnezemia, **hiperkalcemia**, niewydolność nerek, zasadowica, niedotlenienie, niedoczynność tarczycy, wiek", "↑ stężenia: **amiodaron, werapamil, diltiazem, chinidyna, spironolakton**, makrolidy (P-gp)", "Diuretyki tiazydowe/pętlowe → hipokaliemia → ↑ toksyczności", "Przeciwwskazania: **WPW**, blok AV II–III°, **kardiomiopatia przerostowa**, VT/VF, SSS, ostra faza zawału, zapalenie mięśnia sercowego"]}, {"h": "Zatrucie digoksyną", "items": ["Objawy: nudności, wymioty, brak łaknienia, splątanie, omamy, **widzenie na żółto-zielono**, mroczki", "Arytmie: dodatkowe pobudzenia komorowe (**bigeminia**), **częstoskurcz przedsionkowy z blokiem**, bloki AV, **VT dwukierunkowy**, bradykardia", "EKG przy leczeniu: **„nieckowate” obniżenie ST** (efekt naparstnicowy, nie toksyczność)", "Ostre zatrucie → **hiperkaliemia** (zła prognoza); przewlekłe – często hipokaliemia", "Leczenie: odstawienie, węgiel aktywowany, K⁺ i Mg²⁺ (ostrożnie), atropina, lidokaina/fenytoina, **fragmenty Fab przeciwciał antydigoksynowych**; unikać kardiowersji (ryzyko VF)"]}, {"h": "Vaughan Williams – klasa I", "items": ["**IA** – blok Na⁺ (umiarkowany) + K⁺: ↑ czasu trwania potencjału, **↑ QT** – **chinidyna** (cynchonizm: szum w uszach, zaburzenia widzenia; ↑ digoksyny), **prokainamid** (zespół toczniopodobny – acetylacja), dizopiramid (cholinolityczny)", "**IB** – blok Na⁺ (słaby, szybka dysocjacja), skracają potencjał; działają w **niedokrwionych komorach**: **lidokaina** (tylko i.v. – efekt pierwszego przejścia; neurotoksyczność: parestezje, drgawki), meksyletyna, fenytoina (arytmie w zatruciu digoksyną)", "**IC** – silny blok Na⁺, ↓ przewodzenia (↑ QRS): **propafenon** (też β-bloker), **flekainid**; AF/SVT u osób **bez strukturalnej choroby serca** („pill in the pocket”)", "IC przeciwwskazane: **po zawale**, w niewydolności serca, chorobie wieńcowej (badanie **CAST** – ↑ śmiertelności); flekainid może zamienić AF w trzepotanie 1:1 → łączyć z lekiem blokującym AV"]}, {"h": "Klasy II–IV", "items": ["**II – β-blokery**: ↓ automatyzmu, ↓ przewodzenia AV; ↓ śmiertelności po zawale i w HFrEF; esmolol i.v.", "**III – blokery K⁺** (↑ repolaryzacji, **↑ QT**): amiodaron, dronedaron, **sotalol**, dofetylid, ibutylid, wernakalant (AF – kardiowersja farmakologiczna)", "**Amiodaron**: działa w klasach I–IV; arytmie nadkomorowe i komorowe; bezpieczny w HF; **zatrzymanie krążenia (VF/pVT) 300 mg i.v.** po 3. defibrylacji (+150 mg po 5.)", "Amiodaron: t½ **tygodnie–miesiące** (kumulacja w tkankach), dużo **jodu**", "Amiodaron – działania: **tarczyca** (niedoczynność, nadczynność), **płuca** (zapalenie, zwłóknienie), wątroba, **mikrozłogi w rogówce**, **nadwrażliwość na światło, szaroniebieskie przebarwienia skóry**, neuropatia, bradykardia; torsade rzadko", "Monitorowanie amiodaronu: TSH (i fT4), próby wątrobowe, RTG klatki/spirometria, EKG, okulista", "Interakcje amiodaronu: **warfaryna** (↑ INR), **digoksyna** (↓ dawki o ~50%), **statyny** (symwastatyna – miopatia), **sofosbuwir** (bradykardia), inne leki wydłużające QT", "**Sotalol** – β-bloker + III klasa; **torsade de pointes** (niewydolność nerek, hipokaliemia) – włączać pod kontrolą QT", "**Dronedaron** – przeciwwskazany w **niewydolności serca** i utrwalonym AF; hepatotoksyczny", "**IV – werapamil, diltiazem**: ↓ przewodzenia AV; kontrola rytmu w AF, SVT; **przeciwwskazane w WPW z AF** i HFrEF"]}, {"h": "Leki spoza klasyfikacji i torsade de pointes", "items": ["**Adenozyna** – receptory **A1** węzła AV → przejściowy blok; **szybki bolus i.v.** (6 mg → 12 mg) w SVT nawrotnym; t½ kilka sekund", "Adenozyna – działania: **uczucie zbliżającej się śmierci**, zaczerwienienie, duszność, ból w klatce, **skurcz oskrzeli** (ostrożnie w astmie), krótka asystolia; ↑ działania przez **dipirydamol**, ↓ przez **teofilinę/kofeinę**", "**Atropina** – bradykardia zatokowa i bloki węzłowe", "**Siarczan magnezu** – **torsade de pointes**", "**Digoksyna** – kontrola rytmu komór w AF", "Torsade de pointes – leki: klasa **IA i III**, makrolidy, fluorochinolony, neuroleptyki (haloperidol), **metadon**, ondansetron, TLPD, azole; czynniki: **hipokaliemia, hipomagnezemia**, bradykardia, płeć żeńska, wrodzone LQTS", "Leczenie TdP: **MgSO₄ 2 g i.v.**, odstawić lek, wyrównać K⁺, przyspieszyć rytm (stymulacja, izoprenalina), defibrylacja przy niestabilności"]}], "cards": [{"q": "Jaki jest mechanizm inotropowo dodatniego działania digoksyny?", "a": "Hamuje **Na⁺/K⁺-ATPazę** → ↑ Na⁺ w komórce → osłabienie usuwania Ca²⁺ przez wymiennik Na⁺/Ca²⁺ → ↑ Ca²⁺ w siateczce sarkoplazmatycznej → **↑ siły skurczu**."}, {"q": "Jak digoksyna wpływa na przewodzenie przedsionkowo-komorowe?", "a": "**Zwalnia przewodzenie w węźle AV** (działanie wagotoniczne) – stąd zastosowanie w kontroli częstości komór w migotaniu przedsionków."}, {"q": "Jakie są wskazania do digoksyny wg ChPL?", "a": "**Migotanie przedsionków z szybką czynnością komór** oraz **niewydolność serca** (NYHA II–IV) – zmniejsza hospitalizacje, nie wpływa na śmiertelność."}, {"q": "Jaki jest zakres stężeń terapeutycznych digoksyny?", "a": "**0,8–2,0 ng/ml** (powyżej 2 ng/ml objawy zatrucia u ok. 2/3, powyżej 3 ng/ml – niemal zawsze); w niewydolności serca celuje się w niższe wartości."}, {"q": "Jakie zaburzenia elektrolitowe zwiększają toksyczność digoksyny?", "a": "**Hipokaliemia** (K⁺ konkuruje z digoksyną o ATPazę), **hipomagnezemia**, **hiperkalcemia**."}, {"q": "Które leki zwiększają stężenie digoksyny?", "a": "**Amiodaron, werapamil, diltiazem, chinidyna**, spironolakton, makrolidy (klarytromycyna) – głównie przez hamowanie P-gp i ↓ klirensu."}, {"q": "Jakie są objawy zatrucia digoksyną?", "a": "Nudności, wymioty, brak łaknienia, splątanie, **zaburzenia widzenia barw (żółto-zielone)**, arytmie: bigeminia komorowa, częstoskurcz przedsionkowy z blokiem, bloki AV, VT dwukierunkowy, bradykardia."}, {"q": "Jakie zaburzenie elektrolitowe w ostrym zatruciu digoksyną jest złym czynnikiem rokowniczym?", "a": "**Hiperkaliemia** (zahamowanie Na⁺/K⁺-ATPazy w całym organizmie)."}, {"q": "Jaka jest swoista odtrutka w zatruciu digoksyną?", "a": "**Fragmenty Fab przeciwciał przeciwko digoksynie** (wiążą lek); ponadto leczenie objawowe: atropina, lidokaina/fenytoina, wyrównanie K⁺ i Mg²⁺."}, {"q": "Dlaczego digoksyna jest przeciwwskazana w zespole WPW?", "a": "Zwalnia przewodzenie przez węzeł AV, ale może **ułatwiać przewodzenie drogą dodatkową** → przy migotaniu przedsionków ryzyko bardzo szybkiej akcji komór i migotania komór."}, {"q": "Co oznacza „nieckowate” obniżenie ST u pacjenta na digoksynie?", "a": "To **efekt naparstnicowy** – typowa zmiana EKG podczas leczenia, sama w sobie nie świadczy o zatruciu."}, {"q": "Jak działają leki klasy IA i jakie są przykłady?", "a": "Blokują kanały **Na⁺** (umiarkowanie) i **K⁺** → wydłużają potencjał czynnościowy i **QT**. Przykłady: **chinidyna, prokainamid, dizopiramid**."}, {"q": "Czym jest cynchonizm?", "a": "Zespół objawów zatrucia **chinidyną** (i chininą): szum w uszach, zawroty głowy, zaburzenia słuchu i widzenia, ból głowy, nudności."}, {"q": "Jakie charakterystyczne działanie niepożądane ma prokainamid?", "a": "**Zespół toczniopodobny** (polekowy toczeń), częściej u wolnych acetylatorów; także agranulocytoza."}, {"q": "Jak działają leki klasy IB i kiedy się je stosuje?", "a": "Słabo blokują kanały Na⁺ z szybką dysocjacją, **skracają potencjał**; działają głównie w **niedokrwionej tkance komór** – komorowe zaburzenia rytmu (lidokaina, meksyletyna, fenytoina)."}, {"q": "Dlaczego lidokainę jako antyarytmik podaje się wyłącznie dożylnie?", "a": "Ma bardzo duży **efekt pierwszego przejścia** w wątrobie."}, {"q": "Jakie są objawy toksyczności lidokainy?", "a": "Neurologiczne: drętwienie wokół ust, parestezje, zawroty, szum w uszach, splątanie, **drgawki**; kardiologiczne: bradykardia, hipotensja, asystolia."}, {"q": "Kiedy stosuje się leki klasy IC i kiedy są przeciwwskazane?", "a": "**Propafenon, flekainid** – migotanie przedsionków i SVT u osób **bez strukturalnej choroby serca**. Przeciwwskazane **po zawale**, w niewydolności serca i chorobie wieńcowej (badanie **CAST** – ↑ śmiertelności)."}, {"q": "Dlaczego flekainid łączy się z β-blokerem lub werapamilem w migotaniu przedsionków?", "a": "Może przekształcić AF w **trzepotanie przedsionków z przewodzeniem 1:1** (bardzo szybka akcja komór) – lek blokujący węzeł AV temu zapobiega."}, {"q": "Jakie korzyści przynoszą β-blokery jako antyarytmiki (klasa II)?", "a": "↓ automatyzmu i przewodzenia AV, **zmniejszenie śmiertelności i nagłych zgonów** po zawale i w niewydolności serca; kontrola rytmu komór w AF."}, {"q": "Jaki jest mechanizm działania leków klasy III?", "a": "Blokada kanałów **potasowych** → wydłużenie repolaryzacji, potencjału czynnościowego i okresu refrakcji → **wydłużenie QT**."}, {"q": "Dlaczego amiodaron jest lekiem wielokierunkowym?", "a": "Oprócz blokady K⁺ (III) blokuje kanały **Na⁺ (I)**, **Ca²⁺ (IV)** i receptory **β (II)**; skuteczny w arytmiach nadkomorowych i komorowych, bezpieczny w niewydolności serca."}, {"q": "Jaka jest dawka amiodaronu w zatrzymaniu krążenia?", "a": "**300 mg i.v.** po 3. nieskutecznej defibrylacji (VF/VT bez tętna), kolejne **150 mg** po 5. defibrylacji."}, {"q": "Jakie są działania niepożądane amiodaronu na tarczycę i dlaczego?", "a": "**Niedoczynność i nadczynność tarczycy** – lek zawiera dużo **jodu** i bezpośrednio uszkadza tarczycę (tyreotoksykoza typu 1 i 2) oraz hamuje konwersję T4→T3."}, {"q": "Jakie działania niepożądane amiodaronu dotyczą płuc, oczu i skóry?", "a": "**Płuca**: śródmiąższowe zapalenie, **zwłóknienie**. **Oczy**: mikrozłogi w rogówce, neuropatia n. wzrokowego. **Skóra**: **nadwrażliwość na światło**, szaroniebieskie przebarwienia."}, {"q": "Jakie badania wykonuje się okresowo podczas leczenia amiodaronem?", "a": "**TSH (fT4), próby wątrobowe**, RTG klatki piersiowej / badania czynności płuc, EKG, badanie okulistyczne."}, {"q": "Jakie interakcje amiodaronu wymagają modyfikacji dawek innych leków?", "a": "**Warfaryna** (↑ INR – ↓ dawki), **digoksyna** (↓ dawki ok. o połowę), **symwastatyna** (ryzyko miopatii – ograniczenie dawki), leki wydłużające QT; z **sofosbuwirem** – ciężka bradykardia."}, {"q": "Dlaczego działanie amiodaronu utrzymuje się długo po odstawieniu?", "a": "Ma bardzo długi t½ (**tygodnie–miesiące**) z powodu kumulacji w tkankach (duża lipofilność, ogromna Vd)."}, {"q": "Jakie ryzyko wiąże się ze stosowaniem sotalolu?", "a": "**Torsade de pointes** (wydłużenie QT) – szczególnie przy niewydolności nerek, hipokaliemii, bradykardii; włączany pod kontrolą QT."}, {"q": "Kiedy dronedaron jest przeciwwskazany?", "a": "W **niewydolności serca** (↑ śmiertelności) i w **utrwalonym migotaniu przedsionków**; także w ciężkiej niewydolności wątroby."}, {"q": "Jaki jest mechanizm działania adenozyny i jej zastosowanie?", "a": "Pobudza receptory **A1** w węźle AV → krótkotrwały blok przewodzenia. Zastosowanie: przerwanie **częstoskurczu nadkomorowego nawrotnego** (szybki bolus i.v. 6 mg, potem 12 mg)."}, {"q": "Jakie działania niepożądane ma adenozyna?", "a": "Przemijające: **uczucie zbliżającej się śmierci**, zaczerwienienie, duszność, ból w klatce, **skurcz oskrzeli** (astma), krótka asystolia."}, {"q": "Jakie leki wpływają na działanie adenozyny?", "a": "**Dipirydamol** (hamuje wychwyt adenozyny) – nasila działanie; **teofilina i kofeina** (antagoniści receptorów adenozynowych) – osłabiają."}, {"q": "Dlaczego werapamil jest przeciwwskazany w migotaniu przedsionków w zespole WPW?", "a": "Blokuje węzeł AV, co może nasilić **przewodzenie drogą dodatkową** → bardzo szybka akcja komór, migotanie komór."}, {"q": "Jak leczy się torsade de pointes?", "a": "**Siarczan magnezu i.v.** (2 g), odstawienie leków wydłużających QT, wyrównanie potasu, przyspieszenie rytmu (stymulacja, izoprenalina); defibrylacja przy niestabilności."}, {"q": "Jakie leki (poza antyarytmikami) wydłużają QT?", "a": "Makrolidy, **fluorochinolony**, neuroleptyki (haloperidol, sertindol), **metadon**, ondansetron, TLPD, citalopram, azole, chlorochina."}], "sources": [{"t": "ChPL – Digoxin Teva (digoksyna), tabletki", "u": "https://gdziepolek.blob.core.windows.net/product-documents/doc191002/digoxin-teva-dokument.pdf"}]}, {"id": "f-diuretyki", "num": "F14", "title": "Leki moczopędne i leki w niewydolności serca", "summary": ["Diuretyki działają w różnych odcinkach nefronu. **Inhibitory anhydrazy węglanowej** (acetazolamid) działają w **kanaliku proksymalnym** i hamują wchłanianie wodorowęglanów. Diureza jest słaba, a efektem jest **kwasica metaboliczna hiperchloremiczna**. Wskazania: **jaskra** (lepiej miejscowo, dorzolamid i brynzolamid), choroba wysokogórska, zasadowica metaboliczna i idiopatyczne nadciśnienie śródczaszkowe. Leki te są pochodnymi sulfonamidów i grożą kamicą nerkową, parestezjami i hipokaliemią. **Diuretyki osmotyczne** (mannitol) zatrzymują wodę w świetle kanalika i działają w kanaliku proksymalnym oraz w ramieniu zstępującym pętli. Zmniejszają ciśnienie śródczaszkowe i śródgałkowe. Są przeciwwskazane w bezmoczu i w niewydolności serca, bo zwiększają objętość wewnątrznaczyniową i mogą wywołać obrzęk płuc.", "**Diuretyki pętlowe** (furosemid, torasemid, bumetanid, kwas etakrynowy) hamują kotransporter **Na⁺/K⁺/2Cl⁻ (NKCC2)** w grubym odcinku wstępującym pętli Henlego. Mają **najsilniejsze** działanie, w tym podany dożylnie furosemid rozszerza żyły jeszcze przed diurezą. Wskazania: **obrzęki w niewydolności serca** (także ostry obrzęk płuc), niewydolność nerek (działają także przy niskim GFR), marskość, **hiperkalcemia** (zwiększają kalciurię) i hiperkaliemia. Działania niepożądane: **hipokaliemia**, hipomagnezemia, **hipokalcemia**, zasadowica metaboliczna, odwodnienie, hipotensja, hiperurykemia, hiperglikemia i **ototoksyczność** (szybki wlew, łączenie z aminoglikozydami). Kwas etakrynowy nie jest sulfonamidem, więc stosuje się go przy alergii na sulfonamidy.", "**Diuretyki tiazydowe i tiazydopodobne** (hydrochlorotiazyd, **indapamid**, **chlortalidon**, metolazon) hamują kotransporter **Na⁺/Cl⁻ (NCC)** w **kanaliku dystalnym**. Są lekami pierwszego wyboru w **nadciśnieniu**. Poza tym stosuje się je w obrzękach (z diuretykiem pętlowym jako blokada sekwencyjna), w kamicy wapniowej (**zmniejszają kalciurię**) i w moczówce prostej nerkowej (paradoksalnie zmniejszają objętość moczu). Przy GFR < 30 ml/min działają słabiej (wyjątkiem jest metolazon). Działania niepożądane: **hipokaliemia**, **hiponatremia** (zwłaszcza u starszych kobiet), hipomagnezemia, **hiperkalcemia**, **hiperurykemia** (dna), hiperglikemia, dyslipidemia, zaburzenia erekcji i nadwrażliwość na światło. Według PRAC (2018) długotrwałe stosowanie hydrochlorotiazydu wiąże się z niewielkim wzrostem ryzyka **raka podstawnokomórkowego i kolczystokomórkowego skóry**, dlatego zaleca się ochronę przed słońcem i kontrolę skóry. Tiazydy zwiększają też stężenie litu.", "**Diuretyki oszczędzające potas** działają w **cewce zbiorczej**. Antagoniści receptora mineralokortykoidowego (MRA): **spironolakton** (antyandrogenny, wywołuje **ginekomastię** i zaburzenia miesiączkowania), **eplerenon** (bardziej selektywny) i finerenon (niesteroidowy). Wskazania: **HFrEF**, w której zmniejszają śmiertelność, **pierwotny hiperaldosteronizm**, **nadciśnienie oporne**, marskość z wodobrzuszem (spironolakton) oraz hirsutyzm i PCOS. Blokery kanału **ENaC** to **amiloryd** i triamteren. Największe zagrożenie to **hiperkaliemia**, zwłaszcza przy niewydolności nerek, łączeniu z ACEI, ARB i suplementami potasu, z NLPZ i trimetoprimem oraz w cukrzycy. Stosuje się je ostrożnie przy GFR < 30 i odstawia przy K⁺ > 5,5 mmol/l. Często łączy się je z tiazydem lub diuretykiem pętlowym, żeby zrównoważyć utratę potasu.", "**Farmakoterapia niewydolności serca z obniżoną frakcją wyrzutową (HFrEF)** opiera się na czterech filarach, które zmniejszają śmiertelność: **ACEI lub ARNI** (sakubitryl/walsartan; ARB przy nietolerancji ACEI), **β-bloker** (bisoprolol, metoprolol CR/XL, karwedilol, nebiwolol), **MRA** (spironolakton, eplerenon) i **inhibitor SGLT2** (dapagliflozyna, empagliflozyna, także bez cukrzycy). **Diuretyki pętlowe** łagodzą objawy przewodnienia, ale nie poprawiają rokowania. Inne leki to iwabradyna (rytm zatokowy ≥ 70/min), digoksyna, hydralazyna z diazotanem izosorbidu, werycyguat (stymulator cyklazy guanylanowej) i żelazo dożylnie przy niedoborze. W ostrej niewydolności serca podaje się furosemid dożylnie, azotany (gdy RR jest wysokie), a we wstrząsie dobutaminę, noradrenalinę, lewosimendan (uwrażliwia troponinę C na wapń) albo milrinon (inhibitor PDE3). W niewydolności serca nie stosuje się NLPZ, werapamilu, diltiazemu, glitazonów, leków klasy IC ani dronedaronu."], "review": [{"h": "Miejsca działania diuretyków", "items": ["**Kanalik proksymalny**: inhibitory anhydrazy węglanowej (acetazolamid); mannitol (też ramię zstępujące)", "**Gruba część wstępująca pętli Henlego**: diuretyki pętlowe – **NKCC2 (Na⁺/K⁺/2Cl⁻)**", "**Kanalik dystalny**: tiazydy – **NCC (Na⁺/Cl⁻)**", "**Cewka zbiorcza**: MRA (spironolakton, eplerenon) i blokery **ENaC** (amiloryd, triamteren)", "Siła działania natriuretycznego: pętlowe (~25% przesączonego Na⁺) > tiazydy (~5%) > oszczędzające K⁺ (~2%)", "Większość diuretyków działa od strony światła kanalika – musi być wydzielona (sekrecja kanalikowa; NLPZ i probenecyd ją hamują); wyjątek: MRA (od strony krwi)"]}, {"h": "Inhibitory anhydrazy węglanowej i osmotyczne", "items": ["**Acetazolamid** – ↓ wchłaniania HCO₃⁻ → **kwasica metaboliczna hiperchloremiczna**, alkalizacja moczu; słaba diureza, szybka tolerancja", "Wskazania: **jaskra** (miejscowo: **dorzolamid, brynzolamid**), **choroba wysokogórska**, zasadowica metaboliczna, idiopatyczne nadciśnienie śródczaszkowe, padaczka (rzadko)", "Działania: parestezje, **kamica nerkowa** (fosforan wapnia), hipokaliemia, senność; sulfonamid (alergia krzyżowa); przeciwwskazany w marskości (↑ NH₃)", "**Mannitol** – osmotyczny: ↓ ciśnienia śródczaszkowego i śródgałkowego, wymuszona diureza", "Mannitol: przeciwwskazany w **bezmoczu**, **niewydolności serca** (ekspansja objętości → obrzęk płuc), krwawieniu śródczaszkowym czynnym"]}, {"h": "Diuretyki pętlowe", "items": ["**Furosemid, torasemid** (lepsza biodostępność, dłuższe działanie), bumetanid, **kwas etakrynowy** (nie sulfonamid)", "Hamują **NKCC2** → najsilniejsza diureza; skuteczne także przy **niskim GFR**", "Furosemid i.v. – szybkie **rozszerzenie żył** (↓ obciążenia wstępnego) przed diurezą", "Wskazania: obrzęki (**niewydolność serca, ostry obrzęk płuc**), niewydolność nerek, marskość, zespół nerczycowy, **hiperkalcemia**, hiperkaliemia", "Działania: **hipokaliemia**, hipomagnezemia, **hipokalcemia**, hiponatremia, **zasadowica metaboliczna**, odwodnienie, hipotensja, **hiperurykemia**, hiperglikemia, **ototoksyczność** (szybkie i.v., duże dawki, + aminoglikozydy), nadwrażliwość (sulfonamid)", "Interakcje: aminoglikozydy/cisplatyna (ototoksyczność), lit (↑), digoksyna (hipokaliemia → toksyczność), NLPZ (↓ działania)", "„Opór na diuretyki” – blokada sekwencyjna: pętlowy + tiazyd (metolazon) / acetazolamid"]}, {"h": "Tiazydy i tiazydopodobne", "items": ["**Hydrochlorotiazyd**, **indapamid**, **chlortalidon** (długi t½), metolazon (działa przy niskim GFR), klopamid", "Hamują **NCC** w kanaliku dystalnym", "Wskazania: **nadciśnienie** (I wybór), obrzęki (łagodne), **kamica wapniowa** (↓ kalciurii), **moczówka prosta nerkowa** (paradoksalnie ↓ diurezy), osteoporoza (↑ wapnia)", "Słabsze działanie przy **GFR < 30 ml/min** (poza metolazonem i w blokadzie sekwencyjnej)", "Działania: **hipokaliemia**, **hiponatremia**, hipomagnezemia, **hiperkalcemia**, **hiperurykemia**, **hiperglikemia**, dyslipidemia, zasadowica, zaburzenia erekcji, **nadwrażliwość na światło**", "PRAC 2018: hydrochlorotiazyd długotrwale → niewielki ↑ ryzyka **raka podstawnokomórkowego i kolczystokomórkowego skóry** (fotouczulenie) → ochrona przed UV, kontrola skóry; po przebytym raku skóry – rozważyć inny lek", "↑ stężenia **litu**; hipokaliemia nasila toksyczność **digoksyny** i ryzyko torsade de pointes", "Mnemotechnika: tiazydy „**hiper-GLUC**” – hiperglikemia, hiperlipidemia, hiperurykemia, hiperkalcemia"]}, {"h": "Diuretyki oszczędzające potas", "items": ["**Spironolakton** – antagonista receptora mineralokortykoidowego (+ antyandrogenny): **ginekomastia**, ból piersi, zaburzenia miesiączkowania, impotencja", "**Eplerenon** – selektywny MRA (mniej działań hormonalnych); metabolizm CYP3A4", "**Finerenon** – niesteroidowy MRA: cukrzycowa choroba nerek, HFpEF", "Wskazania MRA: **HFrEF** (↓ śmiertelności), po zawale z EF ≤ 40%, **pierwotny hiperaldosteronizm**, **nadciśnienie oporne**, **wodobrzusze w marskości**, hirsutyzm, PCOS", "**Amiloryd, triamteren** – blokery **ENaC**; amiloryd – też moczówka nerkowa po licie, zespół Liddle'a", "Działania wspólne: **hiperkaliemia** (szczególnie: niewydolność nerek, cukrzyca, wiek, ACEI/ARB/ARNI, suplementy K⁺, NLPZ, trimetoprim, heparyna), kwasica metaboliczna", "Kontrola K⁺ i kreatyniny; ostrożnie przy GFR < 30; wstrzymać przy K⁺ > 5,5 mmol/l"]}, {"h": "Niewydolność serca (HFrEF)", "items": ["**4 filary** (↓ śmiertelności): **ACEI/ARNI** (ARB przy nietolerancji), **β-bloker** (bisoprolol, metoprolol CR/XL, karwedilol, nebiwolol), **MRA** (spironolakton/eplerenon), **SGLT2i** (dapagliflozyna, empagliflozyna)", "Diuretyki pętlowe – **objawowo** (przewodnienie), bez wpływu na śmiertelność", "Inne: **iwabradyna** (rytm zatokowy ≥ 70/min mimo β-blokera), **digoksyna**, hydralazyna + diazotan izosorbidu, **werycyguat**, **żelazo i.v.** (niedobór żelaza)", "Ostra HF: furosemid i.v., azotany (RR > 110), tlen przy hipoksemii; wstrząs: dobutamina, noradrenalina, **lewosimendan** (uwrażliwiacz Ca²⁺ troponiny C + otwieracz K-ATP), **milrinon** (inhibitor PDE3)", "Leki **szkodliwe w HF**: NLPZ, werapamil/diltiazem, glitazony, klasa IC, dronedaron, itrakonazol, saksagliptyna (hospitalizacje)"]}], "cards": [{"q": "Gdzie w nefronie działają poszczególne grupy diuretyków?", "a": "**Kanalik proksymalny** – acetazolamid (i mannitol); **gruba część wstępująca pętli Henlego** – diuretyki pętlowe; **kanalik dystalny** – tiazydy; **cewka zbiorcza** – MRA i blokery ENaC (oszczędzające potas)."}, {"q": "Jaki jest mechanizm działania acetazolamidu i jakie zaburzenie kwasowo-zasadowe wywołuje?", "a": "Hamuje **anhydrazę węglanową** w kanaliku proksymalnym → ↓ wchłaniania HCO₃⁻ → alkalizacja moczu i **kwasica metaboliczna hiperchloremiczna**."}, {"q": "Jakie są wskazania do acetazolamidu?", "a": "**Jaskra** (miejscowe: dorzolamid, brynzolamid), **choroba wysokogórska**, zasadowica metaboliczna, idiopatyczne nadciśnienie śródczaszkowe."}, {"q": "Jakie są przeciwwskazania do mannitolu?", "a": "**Bezmocz**, **niewydolność serca/obrzęk płuc** (zwiększa objętość wewnątrznaczyniową), ciężkie odwodnienie, czynne krwawienie śródczaszkowe."}, {"q": "Jaki jest mechanizm działania diuretyków pętlowych?", "a": "Hamują kotransporter **Na⁺/K⁺/2Cl⁻ (NKCC2)** w grubej części wstępującej pętli Henlego – najsilniejsze działanie moczopędne."}, {"q": "Dlaczego furosemid podany dożylnie przynosi szybką ulgę w obrzęku płuc?", "a": "Oprócz diurezy wywołuje szybkie **rozszerzenie naczyń żylnych** (↓ obciążenia wstępnego) – zanim zacznie się diureza."}, {"q": "Dlaczego diuretyki pętlowe stosuje się w hiperkalcemii, a tiazydy w kamicy wapniowej?", "a": "Pętlowe **zwiększają wydalanie wapnia** (kalciurię); tiazydy **zmniejszają wydalanie wapnia** (↑ wchłaniania w kanaliku dystalnym)."}, {"q": "Jakie są działania niepożądane diuretyków pętlowych?", "a": "**Hipokaliemia**, hipomagnezemia, **hipokalcemia**, hiponatremia, zasadowica metaboliczna, odwodnienie, hipotensja, hiperurykemia, hiperglikemia, **ototoksyczność**."}, {"q": "Kiedy furosemid jest szczególnie ototoksyczny?", "a": "Przy szybkim podaniu **dożylnym** dużych dawek, w niewydolności nerek i w skojarzeniu z **aminoglikozydami** (lub cisplatyną)."}, {"q": "Który diuretyk pętlowy można stosować u osoby uczulonej na sulfonamidy?", "a": "**Kwas etakrynowy** (nie jest pochodną sulfonamidu; bardziej ototoksyczny)."}, {"q": "Jaki jest mechanizm działania tiazydów?", "a": "Hamują kotransporter **Na⁺/Cl⁻ (NCC)** w kanaliku dystalnym."}, {"q": "Wymień diuretyki tiazydopodobne.", "a": "**Indapamid, chlortalidon**, metolazon, klopamid."}, {"q": "Jakie są metaboliczne działania niepożądane tiazydów?", "a": "**Hipokaliemia, hiponatremia**, hipomagnezemia, **hiperkalcemia**, **hiperurykemia** (dna), **hiperglikemia**, dyslipidemia, zasadowica metaboliczna."}, {"q": "U kogo tiazydy szczególnie często wywołują hiponatremię?", "a": "U **starszych kobiet** o niskiej masie ciała, przy dużym spożyciu wody, w skojarzeniu z SSRI."}, {"q": "Dlaczego tiazydy działają paradoksalnie w moczówce prostej nerkowej?", "a": "Łagodna hipowolemia nasila wchłanianie zwrotne Na⁺ i wody w kanaliku proksymalnym → **↓ objętości moczu**."}, {"q": "Przy jakim GFR słabnie działanie tiazydów?", "a": "Przy **GFR < 30 ml/min** (wyjątek: metolazon; w blokadzie sekwencyjnej z diuretykiem pętlowym nadal użyteczne)."}, {"q": "Jakie ryzyko nowotworowe przypisano hydrochlorotiazydowi (PRAC 2018)?", "a": "Niewielki wzrost ryzyka **raka podstawnokomórkowego i kolczystokomórkowego skóry** przy długotrwałym stosowaniu (prawdopodobnie przez **fotouczulenie**) → ochrona przed UV, kontrola skóry."}, {"q": "Jak tiazydy i diuretyki pętlowe wpływają na lit i digoksynę?", "a": "↑ **stężenia litu** (↓ klirensu); **hipokaliemia** nasila **toksyczność digoksyny** i ryzyko arytmii."}, {"q": "Jaki jest mechanizm działania spironolaktonu?", "a": "**Antagonista receptora mineralokortykoidowego** (aldosteronowego) w cewce zbiorczej → ↓ wchłaniania Na⁺ i ↓ wydalania K⁺ i H⁺; działa też antyandrogennie."}, {"q": "Jakie hormonalne działania niepożądane wywołuje spironolakton?", "a": "**Ginekomastia** i ból piersi, zaburzenia miesiączkowania, impotencja, ↓ libido (działanie antyandrogenne i progestagenne)."}, {"q": "Czym eplerenon różni się od spironolaktonu?", "a": "Jest **bardziej selektywny** wobec receptora mineralokortykoidowego – znacznie rzadziej wywołuje ginekomastię; metabolizowany przez CYP3A4."}, {"q": "Jakie są wskazania do antagonistów receptora mineralokortykoidowego?", "a": "**HFrEF** (↓ śmiertelności), po zawale z EF ≤ 40%, **pierwotny hiperaldosteronizm**, **nadciśnienie oporne**, **wodobrzusze w marskości**, hirsutyzm, PCOS."}, {"q": "Jak działają amiloryd i triamteren?", "a": "Blokują **nabłonkowy kanał sodowy ENaC** w cewce zbiorczej → ↓ wchłaniania Na⁺ i ↓ wydalania K⁺ (niezależnie od aldosteronu)."}, {"q": "Jakie jest najważniejsze zagrożenie diuretyków oszczędzających potas i kiedy rośnie?", "a": "**Hiperkaliemia** – zwłaszcza w niewydolności nerek, cukrzycy, u starszych, przy łączeniu z **ACEI/ARB/ARNI, suplementami potasu, NLPZ, trimetoprimem, heparyną**."}, {"q": "Po co łączy się tiazyd z amilorydem lub spironolaktonem?", "a": "Aby **zrównoważyć utratę potasu** (tiazyd ↓ K⁺, lek oszczędzający ↑ K⁺) i nasilić diurezę."}, {"q": "Jakie są cztery filary leczenia HFrEF zmniejszające śmiertelność?", "a": "**ACEI lub ARNI** (sakubitryl/walsartan), **β-bloker**, **antagonista mineralokortykoidowy**, **inhibitor SGLT2** (dapagliflozyna/empagliflozyna)."}, {"q": "Czy diuretyki pętlowe poprawiają rokowanie w niewydolności serca?", "a": "**Nie** – działają **objawowo** (zmniejszają przewodnienie i duszność); nie zmniejszają śmiertelności."}, {"q": "Jaki jest mechanizm działania lewosimendanu?", "a": "**Uwrażliwia troponinę C na wapń** (↑ kurczliwości bez ↑ zużycia tlenu) i otwiera kanały K-ATP (rozszerzenie naczyń); ostra niewydolność serca."}, {"q": "Jaki jest mechanizm działania milrinonu?", "a": "Inhibitor **fosfodiesterazy 3** → ↑ cAMP → działanie inotropowo dodatnie i rozszerzające naczynia („inodilator”); długotrwale ↑ śmiertelności."}, {"q": "Jakich leków unika się w niewydolności serca?", "a": "**NLPZ** (retencja Na⁺), **werapamil i diltiazem** (inotropowo ujemne), **glitazony** (retencja płynów), leki klasy **IC**, **dronedaron**, itrakonazol."}], "sources": [{"t": "Duńska Agencja Leków – komunikat o zaleceniach PRAC (EMA) 2018: hydrochlorotiazyd a nieczerniakowe raki skóry", "u": "https://laegemiddelstyrelsen.dk/en/news/2018/small-increased-risk-of-certain-types-of-skin-cancer-associated-with-the-use-of-hydrochlorothiazide/"}]}, {"id": "f-neuro", "num": "F15", "title": "Leki przeciwparkinsonowskie, przeciwpadaczkowe i stosowane w chorobie Alzheimera", "summary": ["**Choroba Parkinsona** wynika z utraty neuronów dopaminergicznych istoty czarnej. Brakuje wtedy dopaminy w prążkowiu i względnie przeważa przekaźnictwo cholinergiczne. Najskuteczniejszym lekiem jest **lewodopa**, prekursor dopaminy, który przenika przez barierę krew–mózg (sama dopamina nie przenika). Podaje się ją z **inhibitorem obwodowej dekarboksylazy** (karbidopa, benserazyd), co zmniejsza obwodowe działania niepożądane (nudności, hipotonię) i pozwala obniżyć dawkę. Inhibitory **COMT** (entakapon, opikapon) i **MAO-B** (selegilina, rasagilina, safinamid) przedłużają jej działanie. Przewlekłe leczenie lewodopą prowadzi do **fluktuacji ruchowych** (zjawisko „wearing-off” i „on-off”) i **dyskinez**. Inne działania niepożądane to nudności, hipotonia ortostatyczna, omamy i psychozy. Białka w posiłku zmniejszają wchłanianie lewodopy (konkurencja o transport aminokwasów), a witamina B6 podana bez inhibitora dekarboksylazy przyspiesza jej obwodową przemianę.", "**Agoniści dopaminy**: nieergolinowi (**pramipeksol, ropinirol, rotygotyna** w plastrach, apomorfina podskórnie w stanach „off”) i ergolinowi (bromokryptyna, kabergolina, które grożą **włóknieniem zastawek serca i opłucnej**). Stosuje się je u młodszych pacjentów, żeby odsunąć leczenie lewodopą, a także w **zespole niespokojnych nóg** i hiperprolaktynemii (kabergolina, bromokryptyna). Działania niepożądane: senność i **nagłe zasypianie**, **zaburzenia kontroli impulsów** (hazard, kompulsywne zakupy i objadanie się, hiperseksualność), omamy, obrzęki i hipotonia. **Amantadyna** (uwalnia dopaminę i blokuje NMDA) zmniejsza dyskinezy. **Cholinolityki** (biperyden, triheksyfenidyl) działają na drżenie, ale u osób starszych pogarszają funkcje poznawcze. W chorobie Parkinsona **nie stosuje się klasycznych neuroleptyków ani metoklopramidu** (blokada D2). Psychozę leczy się kwetiapiną lub klozapiną, a nudności domperidonem, który nie przenika do OUN.", "**Leki przeciwpadaczkowe** działają na trzy sposoby. Blokują **kanały sodowe** (fenytoina, karbamazepina, okskarbazepina, lamotrygina, lakozamid, częściowo walproinian i topiramat). Nasilają działanie **GABA** (benzodiazepiny, barbiturany, wigabatryna jako nieodwracalny inhibitor transaminazy GABA, tiagabina hamująca wychwyt GABA). Blokują **kanały wapniowe**: typu T w neuronach wzgórza (etosuksymid, walproinian, w napadach nieświadomości) albo podjednostkę α2δ (gabapentyna, pregabalina). Inne mechanizmy: **lewetyracetam** i brywaracetam wiążą białko pęcherzykowe SV2A, topiramat ma wiele mechanizmów, a perampanel blokuje receptor AMPA. Lekami pierwszego wyboru w napadach ogniskowych są **lamotrygina** i **lewetyracetam** (oraz karbamazepina). W napadach uogólnionych pierwszego wyboru jest **walproinian**, ale nie u kobiet w wieku rozrodczym. W napadach nieświadomości stosuje się **etosuksymid** lub walproinian. Karbamazepina, okskarbazepina i fenytoina mogą **nasilać napady nieświadomości i mioklonie**.", "**Działania niepożądane leków przeciwpadaczkowych.** **Karbamazepina** jest silnym **induktorem CYP3A4** i indukuje też własny metabolizm. Powoduje hiponatremię (SIADH), aplazję szpiku i agranulocytozę, ciężkie reakcje skórne (**SJS/TEN** u nosicieli HLA-B*15:02, czyli osób pochodzenia azjatyckiego, i DRESS) oraz podwójne widzenie i ataksję. **Fenytoina** ma kinetykę nieliniową i wąski indeks terapeutyczny. Wywołuje **przerost dziąseł**, hirsutyzm, oczopląs, ataksję, niedokrwistość megaloblastyczną i osteomalację, a podana dożylnie arytmie i zespół fioletowej rękawiczki. **Kwas walproinowy** jest **hepatotoksyczny** (zwłaszcza u dzieci < 2 lat), działa toksycznie na trzustkę, wywołuje hiperamonemię, przyrost masy ciała, wypadanie włosów, drżenie, trombocytopenię i PCOS. Jest **inhibitorem enzymów** (podnosi stężenie lamotryginy) i jest silnie **teratogenny**. Według EMA (2018) jest przeciwwskazany u dziewcząt i kobiet w wieku rozrodczym, chyba że spełniony jest program zapobiegania ciąży (testy ciążowe, skuteczna antykoncepcja, coroczny przegląd, formularz zapoznania się z ryzykiem). W ciąży jest przeciwwskazany w chorobie dwubiegunowej i migrenie, a w padaczce dopuszczony tylko wtedy, gdy nie ma innego skutecznego leczenia. Karbapenemy gwałtownie obniżają jego stężenie. **Lamotrygina** wymaga powolnego zwiększania dawki z powodu ryzyka **wysypki i SJS**, zwłaszcza w połączeniu z walproinianem. **Lewetyracetam** wywołuje drażliwość i zaburzenia nastroju, a **topiramat** kamicę nerkową, spadek masy ciała, zaburzenia poznawcze i jaskrę z zamkniętym kątem.", "**Stan padaczkowy**: najpierw **benzodiazepina** (lorazepam lub diazepam dożylnie, a przed szpitalem midazolam domięśniowo, donosowo lub podpoliczkowo). Jeśli napady trwają, podaje się dożylnie **lewetyracetam, walproinian lub fenytoinę (fosfenytoinę)**, a w stanie opornym znieczulenie ogólne (propofol, midazolam, tiopental). Leków przeciwpadaczkowych **nie odstawia się nagle** (grozi stan padaczkowy). Induktory enzymów (karbamazepina, fenytoina, fenobarbital, topiramat w dużych dawkach) **osłabiają antykoncepcję hormonalną**. **Choroba Alzheimera**: inhibitory acetylocholinoesterazy (**donepezil, rywastygmina, galantamina**) w postaci łagodnej i umiarkowanej oraz **memantyna**, niekompetycyjny antagonista NMDA, w postaci umiarkowanej i ciężkiej. Inhibitory AChE dają nudności, wymioty, biegunkę, **bradykardię** i omdlenia. Nowe przeciwciała przeciw β-amyloidowi (lekanemab, donanemab) mogą wywoływać obrzęk i mikrokrwawienia (ARIA)."], "review": [{"h": "Choroba Parkinsona – lewodopa", "items": ["Niedobór **dopaminy** w prążkowiu → względna przewaga **acetylocholiny**", "**Lewodopa** – prekursor DA, przenika przez BBB (transporter aminokwasów); najskuteczniejsza", "+ **inhibitor obwodowej dekarboksylazy DOPA**: **karbidopa, benserazyd** (nie przenikają do OUN) → ↓ obwodowych działań, ↓ dawki", "+ **inhibitory COMT**: entakapon (obwodowo), tolkapon (hepatotoksyczny), opikapon", "Działania: nudności, wymioty, **hipotonia ortostatyczna**, arytmie, **omamy, psychozy**, zaburzenia kontroli impulsów, zmiana koloru moczu", "Powikłania przewlekłe: **fluktuacje** („wearing-off”, „on-off”), **dyskinezy** szczytu dawki", "Białka w posiłku ↓ wchłaniania; **wit. B6** (bez inhibitora dekarboksylazy) ↓ działania; MAOI nieselektywne – przełom nadciśnieniowy", "Nagłe odstawienie → zespół podobny do **ZZN** (hipertermia, sztywność)"]}, {"h": "Inne leki przeciwparkinsonowskie", "items": ["Agoniści DA nieergolinowi: **pramipeksol, ropinirol, rotygotyna** (plaster), **apomorfina** (s.c. – stany „off”)", "Ergolinowi: **bromokryptyna, kabergolina** – **włóknienie zastawek, opłucnej, zaotrzewnowe**", "Działania agonistów: **nagłe zasypianie**, senność, **zaburzenia kontroli impulsów** (hazard, zakupy, objadanie, hiperseksualność), omamy, obrzęki nóg, hipotonia", "Zastosowania dodatkowe: **zespół niespokojnych nóg**, hiperprolaktynemia (kabergolina), hamowanie laktacji", "**Inhibitory MAO-B**: selegilina (metabolity amfetaminowe), **rasagilina**, safinamid", "**Amantadyna** – uwalnianie DA + blokada **NMDA**; ↓ **dyskinez**; siność marmurkowata, obrzęki, omamy", "**Cholinolityki** (biperyden, triheksyfenidyl) – drżenie; u seniorów – splątanie, zaparcia, zatrzymanie moczu", "Przeciwwskazane: **haloperidol, fenotiazyny, metoklopramid** (blokada D2); na psychozę – **kwetiapina, klozapina**; na nudności – **domperidon** (nie przenika do OUN; QT)"]}, {"h": "Mechanizmy leków przeciwpadaczkowych", "items": ["**Kanały Na⁺**: fenytoina, karbamazepina, okskarbazepina, eslikarbazepina, **lamotrygina**, lakozamid (wolna inaktywacja), rufinamid; częściowo walproinian, topiramat, zonisamid", "**GABA**: benzodiazepiny (↑ częstości otwarcia GABA-A), barbiturany (↑ czasu otwarcia), **wigabatryna** (nieodwracalny inhibitor transaminazy GABA – zawężenie pola widzenia), tiagabina (↓ wychwytu GABA)", "**Kanały Ca²⁺ typu T** (wzgórze): **etosuksymid**, walproinian → **napady nieświadomości**", "**α2δ**: gabapentyna, pregabalina (głównie ból neuropatyczny)", "**SV2A**: **lewetyracetam**, brywaracetam", "Wielokierunkowe: **walproinian**, **topiramat** (Na⁺, GABA, AMPA, anhydraza węglanowa); perampanel – antagonista AMPA; cenobamat"]}, {"h": "Dobór leków", "items": ["Napady **ogniskowe**: **lamotrygina, lewetyracetam** (I wybór), karbamazepina, okskarbazepina, lakozamid", "Napady **uogólnione** (toniczno-kloniczne): **walproinian** (nie u kobiet w wieku rozrodczym), lamotrygina, lewetyracetam", "**Napady nieświadomości**: **etosuksymid**, walproinian, lamotrygina", "Mioklonie: walproinian, lewetyracetam", "**Nasilają napady nieświadomości i mioklonie**: karbamazepina, okskarbazepina, fenytoina, gabapentyna, wigabatryna, tiagabina", "Nie odstawiać nagle (stan padaczkowy); monitorowanie stężeń: fenytoina, karbamazepina, walproinian"]}, {"h": "Działania niepożądane", "items": ["**Karbamazepina**: silny **induktor CYP3A4** (+ autoindukcja), **hiponatremia** (SIADH), aplazja szpiku, agranulocytoza, **SJS/TEN** (**HLA-B*15:02** – Azjaci), DRESS (HLA-A*31:01), podwójne widzenie, ataksja, teratogenność; ↓ antykoncepcji; neuralgia nerwu V – I wybór", "**Okskarbazepina** – mniej interakcji, ale **hiponatremia** częstsza", "**Fenytoina**: kinetyka nieliniowa, **przerost dziąseł**, hirsutyzm, gruboziarniste rysy, oczopląs, ataksja, **niedokrwistość megaloblastyczna** (foliany), osteomalacja, induktor; i.v. – hipotensja, arytmie, **zespół fioletowej rękawiczki**; teratogenna (zespół hydantoinowy)", "**Walproinian**: **hepatotoksyczność** (dzieci < 2 lat, choroby mitochondrialne – POLG), **zapalenie trzustki**, **hiperamonemia**, przyrost masy, łysienie, drżenie, trombocytopenia, PCOS; **inhibitor** (↑ lamotrygina, fenobarbital); **karbapenemy ↓ stężenia**", "**Lamotrygina**: **wysypka, SJS** – powolne zwiększanie dawki (wolniej z walproinianem); bezsenność; bezpieczniejsza w ciąży", "**Lewetyracetam**: drażliwość, agresja, depresja; mało interakcji; i.v.", "**Topiramat**: **kamica nerkowa**, ↓ masy ciała, zaburzenia poznawcze i mowy („słowa”), parestezje, **jaskra z zamkniętym kątem**, kwasica", "**Etosuksymid**: dolegliwości żołądkowo-jelitowe, czkawka, senność", "**Wigabatryna**: nieodwracalne **zawężenie pola widzenia**; **fenobarbital**: sedacja, induktor, uzależnienie"]}, {"h": "Walproinian a ciąża (EMA 2018)", "items": ["Wysokie ryzyko **wad wrodzonych** (cewa nerwowa, serce, twarz, kończyny) i **zaburzeń neurorozwojowych** (↓ IQ, autyzm)", "Przeciwwskazany u **dziewcząt i kobiet w wieku rozrodczym**, chyba że spełniony **program zapobiegania ciąży**:", "– ocena możliwości zajścia w ciążę; testy ciążowe przed i w trakcie leczenia", "– poradnictwo i **skuteczna antykoncepcja** przez cały okres leczenia", "– przegląd leczenia przez specjalistę **co najmniej raz w roku** + formularz potwierdzenia ryzyka", "W ciąży: przeciwwskazany w **chorobie dwubiegunowej i migrenie**; w **padaczce** – tylko gdy brak innego skutecznego leczenia", "Nie rozpoczynać, jeśli są alternatywy (także u dziewczynek przed dojrzewaniem); nie odstawiać samodzielnie"]}, {"h": "Stan padaczkowy i Alzheimer", "items": ["Stan padaczkowy: 1. **benzodiazepina** (lorazepam/diazepam i.v.; midazolam i.m./donosowo/podpoliczkowo) → 2. **lewetyracetam / walproinian / fenytoina (fosfenytoina) i.v.** → 3. anestezja (propofol, midazolam, tiopental)", "Induktory (karbamazepina, fenytoina, fenobarbital, okskarbazepina, topiramat ≥ 200 mg) → **nieskuteczna antykoncepcja hormonalna**", "Kobiety planujące ciążę: **kwas foliowy** (wyższa dawka), preferowane lamotrygina, lewetyracetam", "**Alzheimer**: **donepezil, rywastygmina** (też plaster; choroba Parkinsona z otępieniem), **galantamina** (+ modulacja receptorów nikotynowych) – postać łagodna/umiarkowana", "Działania inhibitorów AChE: nudności, wymioty, biegunka, **bradykardia**, omdlenia, koszmary senne", "**Memantyna** – niekompetycyjny antagonista **NMDA** (↓ ekscytotoksyczności) – postać umiarkowana i ciężka; zawroty, bóle głowy, zaparcia", "Przeciwciała anty-amyloidowe (lekanemab, donanemab) – **ARIA** (obrzęk, mikrokrwawienia); ryzyko ↑ u homozygot APOE ε4"]}], "cards": [{"q": "Dlaczego w chorobie Parkinsona podaje się lewodopę, a nie dopaminę?", "a": "**Dopamina nie przenika przez barierę krew–mózg**; lewodopa przenika (transporter aminokwasów obojętnych) i w mózgu jest przekształcana w dopaminę."}, {"q": "Po co lewodopę łączy się z karbidopą lub benserazydem?", "a": "Są **inhibitorami obwodowej dekarboksylazy DOPA** (nie przenikają do OUN) → mniej lewodopy przekształca się w dopaminę na obwodzie → ↓ nudności i hipotonii, ↓ dawki, więcej leku dociera do mózgu."}, {"q": "Jakie są późne powikłania leczenia lewodopą?", "a": "**Fluktuacje ruchowe** (zjawisko „wearing-off” – skracanie działania dawki, zjawisko „on-off”) i **dyskinezy** (pląsawicze ruchy, zwykle w szczycie dawki)."}, {"q": "Jak białka w diecie wpływają na lewodopę?", "a": "Aminokwasy z białek **konkurują o transport** w jelicie i przez barierę krew–mózg → słabsze i niestabilne działanie (lepiej przyjmować na czczo / rozkładać białko)."}, {"q": "Jak działają inhibitory COMT w chorobie Parkinsona?", "a": "Hamują obwodowy rozkład lewodopy (entakapon, opikapon) → **wydłużają jej działanie** i zmniejszają zjawisko „wearing-off”. Tolkapon – hepatotoksyczny."}, {"q": "Które inhibitory MAO-B stosuje się w chorobie Parkinsona?", "a": "**Selegilina, rasagilina, safinamid** – hamują rozkład dopaminy w mózgu."}, {"q": "Jakie są typowe działania niepożądane agonistów dopaminy?", "a": "Senność i **nagłe napady snu**, **zaburzenia kontroli impulsów** (hazard, kompulsywne zakupy, objadanie się, hiperseksualność), omamy, hipotonia ortostatyczna, obrzęki nóg."}, {"q": "Jakie powikłanie jest typowe dla ergolinowych agonistów dopaminy?", "a": "**Włóknienie** zastawek serca, opłucnej i przestrzeni zaotrzewnowej (bromokryptyna, kabergolina, pergolid)."}, {"q": "Jakie są wskazania do agonistów dopaminy poza chorobą Parkinsona?", "a": "**Zespół niespokojnych nóg** (pramipeksol, ropinirol, rotygotyna), **hiperprolaktynemia** i gruczolak przysadki (kabergolina, bromokryptyna), hamowanie laktacji."}, {"q": "Jak działa amantadyna w chorobie Parkinsona?", "a": "Zwiększa uwalnianie dopaminy i **blokuje receptory NMDA** – szczególnie **zmniejsza dyskinezy** polewodopowe."}, {"q": "Których leków unika się u chorych na Parkinsona?", "a": "**Klasycznych neuroleptyków** (haloperidol, fenotiazyny) i **metoklopramidu** – blokują D2 i nasilają objawy. Psychoza – kwetiapina/klozapina; nudności – **domperidon**."}, {"q": "Jakie leki przeciwpadaczkowe blokują kanały sodowe?", "a": "**Fenytoina, karbamazepina, okskarbazepina, lamotrygina, lakozamid**, eslikarbazepina; częściowo walproinian, topiramat."}, {"q": "Jaki jest mechanizm działania etosuksymidu i jego wskazanie?", "a": "Blokuje **kanały wapniowe typu T** w neuronach wzgórza; lek z wyboru w **napadach nieświadomości** (absencjach)."}, {"q": "Jaki jest mechanizm działania lewetyracetamu?", "a": "Wiąże **białko pęcherzyków synaptycznych SV2A** → moduluje uwalnianie neuroprzekaźników."}, {"q": "Jaki jest mechanizm działania wigabatryny i jej charakterystyczne działanie niepożądane?", "a": "**Nieodwracalnie hamuje transaminazę GABA** (↑ GABA). Działanie niepożądane: **nieodwracalne zawężenie pola widzenia**."}, {"q": "Które leki przeciwpadaczkowe są pierwszego wyboru w napadach ogniskowych?", "a": "**Lamotrygina i lewetyracetam** (także karbamazepina, okskarbazepina)."}, {"q": "Które leki mogą nasilać napady nieświadomości i mioklonie?", "a": "**Karbamazepina, okskarbazepina, fenytoina**, gabapentyna, pregabalina, wigabatryna, tiagabina."}, {"q": "Jakie są najważniejsze działania niepożądane karbamazepiny?", "a": "**Hiponatremia** (SIADH), aplazja szpiku/agranulocytoza, **SJS/TEN** (HLA-B*15:02), DRESS, podwójne widzenie, ataksja, hepatotoksyczność, teratogenność."}, {"q": "Dlaczego karbamazepina wymaga zwiększania dawki w pierwszych tygodniach?", "a": "**Indukuje własny metabolizm** (autoindukcja CYP3A4) → stężenie spada po kilku tygodniach."}, {"q": "U kogo przed karbamazepiną bada się HLA-B*15:02?", "a": "U osób pochodzenia **azjatyckiego** (Han, Tajowie i in.) – nosiciele mają wysokie ryzyko **zespołu Stevensa–Johnsona / TEN**."}, {"q": "Jakie są charakterystyczne działania niepożądane fenytoiny?", "a": "**Przerost dziąseł**, hirsutyzm, pogrubienie rysów twarzy, oczopląs, ataksja, **niedokrwistość megaloblastyczna**, osteomalacja, teratogenność; i.v. – arytmie, hipotensja, zespół fioletowej rękawiczki."}, {"q": "Jakie są najgroźniejsze działania niepożądane kwasu walproinowego?", "a": "**Hepatotoksyczność** (zwłaszcza dzieci < 2 lat, choroby mitochondrialne), **ostre zapalenie trzustki**, **hiperamonemia** (encefalopatia), działanie **teratogenne**; ponadto przyrost masy, łysienie, drżenie, trombocytopenia."}, {"q": "Jakie warunki programu zapobiegania ciąży dla walproinianu określiła EMA (2018)?", "a": "Ocena możliwości zajścia w ciążę, **testy ciążowe** przed i w trakcie leczenia, poradnictwo i **skuteczna antykoncepcja** przez cały czas leczenia, **coroczny przegląd** leczenia przez specjalistę z **formularzem potwierdzenia ryzyka**."}, {"q": "Kiedy walproinian jest przeciwwskazany w ciąży?", "a": "W **chorobie dwubiegunowej i migrenie** – zawsze; w **padaczce** – chyba że nie ma innego skutecznego leczenia."}, {"q": "Jaka interakcja dotyczy kwasu walproinowego i karbapenemów?", "a": "Karbapenemy (meropenem, imipenem) gwałtownie **obniżają stężenie walproinianu** → ryzyko napadów."}, {"q": "Jak walproinian wpływa na lamotryginę?", "a": "Jest **inhibitorem** jej glukuronidacji → ↑ stężenia lamotryginy (ok. 2×) → większe ryzyko **wysypki/SJS** – dawkę lamotryginy zwiększa się wolniej."}, {"q": "Dlaczego dawkę lamotryginy zwiększa się powoli?", "a": "Aby zmniejszyć ryzyko **ciężkich reakcji skórnych** (wysypka, zespół Stevensa–Johnsona)."}, {"q": "Jakie są charakterystyczne działania niepożądane topiramatu?", "a": "**Kamica nerkowa**, **spadek masy ciała**, zaburzenia poznawcze i trudności w znajdowaniu słów, parestezje, **ostra jaskra z zamkniętym kątem**, kwasica metaboliczna."}, {"q": "Jakie działania niepożądane może powodować lewetyracetam?", "a": "**Drażliwość, agresja, zmiany nastroju**, depresja, senność; ma mało interakcji."}, {"q": "Jak przebiega leczenie stanu padaczkowego?", "a": "1. **Benzodiazepina** (lorazepam/diazepam i.v. lub midazolam i.m./donosowo/podpoliczkowo) → 2. **lewetyracetam, walproinian lub fenytoina i.v.** → 3. znieczulenie ogólne (propofol, midazolam, tiopental)."}, {"q": "Które leki przeciwpadaczkowe osłabiają antykoncepcję hormonalną?", "a": "Induktory enzymów: **karbamazepina, fenytoina, fenobarbital**, okskarbazepina, topiramat (w większych dawkach)."}, {"q": "Jakie leki stosuje się w chorobie Alzheimera?", "a": "Inhibitory acetylocholinoesterazy (**donepezil, rywastygmina, galantamina**) – postać łagodna i umiarkowana; **memantyna** (antagonista NMDA) – umiarkowana i ciężka."}, {"q": "Jakie są działania niepożądane inhibitorów acetylocholinoesterazy?", "a": "Nudności, wymioty, biegunka, utrata masy ciała, **bradykardia**, omdlenia, koszmary senne, kurcze mięśni."}, {"q": "Jaki jest mechanizm działania memantyny?", "a": "**Niekompetycyjny antagonista receptora NMDA** – zmniejsza ekscytotoksyczność glutaminianu."}], "sources": [{"t": "EMA – Valproate and related substances, referral (2018): program zapobiegania ciąży", "u": "https://www.ema.europa.eu/pl/medicines/human/referrals/valproate-related-substances-0"}]}, {"id": "f-pokarmowy", "num": "F16", "title": "Leki stosowane w chorobach przewodu pokarmowego", "summary": ["**Leki zmniejszające kwaśność treści żołądkowej.** **Inhibitory pompy protonowej (IPP)**: omeprazol, esomeprazol, pantoprazol, lanzoprazol, rabeprazol. Są prolekami aktywowanymi w kwaśnym środowisku kanalików komórki okładzinowej, gdzie **nieodwracalnie** wiążą H⁺/K⁺-ATPazę. Działają najsilniej, gdy przyjmie się je **30–60 min przed posiłkiem**. Wskazania: choroba wrzodowa, GERD, eradykacja H. pylori, profilaktyka uszkodzeń przez NLPZ i zespół Zollingera–Ellisona. Przy długim stosowaniu grozi niedobór **witaminy B12**, magnezu (hipomagnezemia), żelaza i wapnia (złamania), zakażenie **C. difficile** i zapalenie płuc, śródmiąższowe zapalenie nerek, a ponadto polipy dna żołądka i podostra skórna postać tocznia. Omeprazol i esomeprazol hamują CYP2C19 (osłabiają klopidogrel). **Antagoniści receptora H2** (famotydyna, dawniej ranitydyna wycofana z powodu zanieczyszczenia NDMA i cymetydyna, inhibitor CYP i antyandrogen) działają słabiej. **Leki zobojętniające** (wodorotlenki glinu i magnezu, węglan wapnia) działają szybko i krótko. Związki glinu dają zaparcia, a magnezu biegunkę. Leki te zmniejszają wchłanianie tetracyklin, fluorochinolonów, żelaza i lewotyroksyny. **Leki osłaniające**: sukralfat (w kwaśnym środowisku tworzy warstwę ochronną) i związki bizmutu. **Mizoprostol** (analog PGE1) chroni przed NLPZ i ma działanie poronne (przeciwwskazany w ciąży).", "**Eradykacja Helicobacter pylori** w Polsce ma zwykle postać **terapii poczwórnej z bizmutem** (IPP + bizmut + tetracyklina + metronidazol) albo terapii poczwórnej bez bizmutu (IPP + amoksycylina + klarytromycyna + metronidazol), przez **14 dni**. Klarytromycyny nie stosuje się w terapii trójlekowej, bo oporność na nią jest wysoka. Skuteczność eradykacji ocenia się testem oddechowym lub antygenem w kale co najmniej 4 tygodnie po antybiotykach i 2 tygodnie po IPP.", "**Leki przeciwwymiotne**: antagoniści **5-HT3** (ondansetron, granisetron, palonosetron) w wymiotach po chemioterapii i pooperacyjnych (wywołują zaparcia, ból głowy i wydłużenie QT), antagoniści **NK1** (aprepitant, w chemioterapii wysoko emetogennej), **deksametazon**, antagoniści **D2**: **metoklopramid** (przenika do OUN i wywołuje **objawy pozapiramidowe**, zwłaszcza u dzieci i młodych, oraz późne dyskinezy) i **domperidon** (nie przenika do OUN, ale wydłuża QT), antyhistaminowe (dimenhydrynat, prometazyna, hydroksyzyna), cholinolityki (skopolamina w chorobie lokomocyjnej) i kannabinoidy. Według EMA (2013) metoklopramid stosuje się **najwyżej 5 dni**, w dawce **≤ 0,5 mg/kg/dobę** (dorośli 10 mg do 3 razy dziennie). Wycofano go z leczenia przewlekłych chorób (gastropareza, dyspepsia, GERD). U dzieci < 1 r.ż. jest przeciwwskazany, a u starszych dzieci stosuje się go tylko w drugiej linii. **Domperidon** według EMA (2014) stosuje się tylko w nudnościach i wymiotach, **10 mg do 3 razy dziennie, nie dłużej niż tydzień**. Jest przeciwwskazany w zaburzeniach przewodzenia i niewydolności serca, przy innych lekach wydłużających QT, silnych inhibitorach CYP3A4 i niewydolności wątroby. **Leki prokinetyczne**: metoklopramid, domperidon, itopryd, prukalopryd (agonista 5-HT4 w przewlekłych zaparciach) i erytromycyna (agonista motyliny).", "**Leki przeczyszczające**: zwiększające objętość stolca (babka płesznik, otręby, metyloceluloza; wymagają picia dużej ilości płynów), **osmotyczne** (**makrogole**, **laktuloza**, która w encefalopatii wątrobowej zakwasza treść jelita i zmniejsza wchłanianie NH₃, siarczan i cytrynian magnezu), **pobudzające** (bisakodyl, pikosiarczan sodu, senesydy, czyli antrachinony dające po latach melanozę okrężnicy) i zmiękczające (parafina, dokuzan). **Leki stosowane w zaparciach poopioidowych** to metylonaltrekson i naloksegol, a w zespole jelita drażliwego z zaparciami linaklotyd. **Leki przeciwbiegunkowe**: **loperamid** (agonista μ w jelicie, przeciwwskazany w biegunce krwawej, rzekomobłoniastym zapaleniu jelit i u małych dzieci), diosmektyt, węgiel, racekadotryl (inhibitor enkefalinazy) i probiotyki. Podstawą jest jednak nawadnianie (ORS). **Nieswoiste zapalenia jelit**: mesalazyna (5-ASA), sulfasalazyna, glikokortykosteroidy (budezonid), azatiopryna, metotreksat i leki biologiczne (infliksymab, adalimumab, wedolizumab, ustekinumab).", "**Leki hepatoprotekcyjne, żółciopędne, enzymy i leki przeciwrobacze.** **Kwas ursodeoksycholowy** (UDCA) stosuje się w pierwotnym zapaleniu dróg żółciowych (PBC), w cholestazie ciężarnych i do rozpuszczania drobnych złogów cholesterolowych. **Sylimaryna** i fosfolipidy (tzw. hepatoprotektory) mają słabe dowody skuteczności. Leki żółciotwórcze (cholerytyki) zwiększają wydzielanie żółci, a żółciopędne (cholekinetyki) opróżnianie pęcherzyka. **Enzymy trzustkowe** (pankreatyna) podaje się z posiłkami w zewnątrzwydzielniczej niewydolności trzustki i mukowiscydozie. Duże dawki grożą kolonopatią włókniejącą. **Leki przeciwrobacze**: **mebendazol i albendazol** (benzimidazole wiążące β-tubulinę: owsiki, glista, włosogłówka, bąblowce), pyrantel (agonista nikotynowy, porażenie spastyczne: owsiki, glista), **prazykwantel** (tasiemce, przywry; zwiększa przepuszczalność dla Ca²⁺), iwermektyna (świerzb, węgorek, agonista kanałów chlorkowych bramkowanych glutaminianem) i niklozamid. Przy owsicy leczy się wszystkich domowników i powtarza dawkę po 2 tygodniach."], "review": [{"h": "IPP i H2-blokery", "items": ["**IPP**: omeprazol, esomeprazol, **pantoprazol**, lanzoprazol, rabeprazol – proleki aktywowane w kwaśnym środowisku, **nieodwracalnie** hamują **H⁺/K⁺-ATPazę**", "Przyjmować **30–60 min przed posiłkiem** (pompy aktywne po stymulacji); efekt pełny po kilku dniach", "Wskazania: choroba wrzodowa, **GERD**, eradykacja H. pylori, gastroprotekcja przy NLPZ/DAPT, Zollinger–Ellison", "Długotrwale: niedobór **B12**, **hipomagnezemia**, ↓ Fe, ↑ ryzyka **złamań**, **C. difficile**, zapalenie płuc, śródmiąższowe zapalenie nerek, polipy dna żołądka, SCLE, hipergastrynemia; odbicie nadkwaśności po odstawieniu", "Omeprazol/esomeprazol – inhibitory **CYP2C19** (↓ klopidogrel, ↑ diazepam, citalopram) → u chorych na klopidogrelu **pantoprazol**", "**H2-blokery**: famotydyna (i.v. też), cymetydyna (**inhibitor CYP**, antyandrogenna – ginekomastia), ranitydyna (wycofana – NDMA); tachyfilaksja", "Pirenzepina – wybiórczy M1 (historycznie)"]}, {"h": "Zobojętniające, osłaniające, mizoprostol", "items": ["**Wodorotlenek glinu** – zaparcia, hipofosfatemia; **wodorotlenek magnezu** – biegunka (hipermagnezemia w niewydolności nerek); węglan wapnia – zespół mleczno-alkaliczny, odbicie kwaśności; wodorowęglan sodu – zasadowica, CO₂", "Leki zobojętniające ↓ wchłaniania: **tetracyklin, fluorochinolonów, żelaza, lewotyroksyny, digoksyny** – odstęp 2 h", "**Sukralfat** – w kwaśnym środowisku polimeryzuje i pokrywa owrzodzenie; zaparcia; ↓ wchłaniania innych leków", "**Związki bizmutu** – osłaniające, przeciw H. pylori; czarny stolec i język", "**Mizoprostol** – analog **PGE1**: ↓ wydzielania kwasu, ↑ śluzu; profilaktyka uszkodzeń przez NLPZ; biegunka; **poronny – przeciwwskazany w ciąży** (stosowany położniczo)"]}, {"h": "Eradykacja H. pylori", "items": ["I linia (Polska): **terapia poczwórna z bizmutem** – IPP + bizmut + **tetracyklina** + **metronidazol**, **14 dni**", "Alternatywa: poczwórna bez bizmutu (IPP + amoksycylina + klarytromycyna + metronidazol), 14 dni", "Klasyczna trójlekowa z klarytromycyną – niezalecana (oporność > 15%)", "Kontrola: test oddechowy / antygen w kale ≥ **4 tyg.** po antybiotykach i ≥ **2 tyg.** po IPP"]}, {"h": "Przeciwwymiotne i prokinetyczne", "items": ["**Antagoniści 5-HT3**: ondansetron, granisetron, palonosetron – CINV, PONV; zaparcia, ból głowy, **QT**", "**Antagoniści NK1**: aprepitant, fosaprepitant – CINV (wysoko emetogenna, faza opóźniona); interakcje CYP3A4", "**Deksametazon**, olanzapina – w schematach CINV", "**Metoklopramid** – antagonista D2 (+ 5-HT4): prokinetyk i przeciwwymiotny; **EPS** (ostra dystonia – dzieci, młodzi), **późne dyskinezy** (seniorzy, długotrwale), hiperprolaktynemia", "EMA 2013 – metoklopramid: max **0,5 mg/kg/24 h** (dorośli 10 mg do 3×/d), max **5 dni**; usunięte wskazania przewlekłe (gastropareza, dyspepsja, GERD); **< 1 r.ż. przeciwwskazany**, > 1 r.ż. – II linia", "**Domperidon** – antagonista D2 obwodowo (nie przenika do OUN); **QT**, arytmie, nagły zgon", "EMA 2014 – domperidon: tylko nudności i wymioty; **10 mg do 3×/d**, zwykle **≤ 1 tydzień**; przeciwwskazany: zaburzenia przewodzenia, niewydolność serca, leki wydłużające QT, **silne inhibitory CYP3A4**, umiarkowana/ciężka niewydolność wątroby", "Antyhistaminowe: dimenhydrynat, prometazyna; skopolamina – choroba lokomocyjna", "Prokinetyki: itopryd, **prukalopryd** (5-HT4 – przewlekłe zaparcia), erytromycyna (motylina)"]}, {"h": "Przeczyszczające i przeciwbiegunkowe", "items": ["Objętościowe: **babka płesznik**, otręby, metyloceluloza – + dużo płynów", "Osmotyczne: **makrogole (PEG)**, **laktuloza** (encefalopatia wątrobowa – zakwasza, NH₃ → NH₄⁺; wzdęcia), siarczan/cytrynian magnezu, sól glauberska; preparaty fosforanowe – nefropatia", "Pobudzające: **bisakodyl, pikosiarczan sodu, senesydy** (antrachinony – **melanoza okrężnicy**), olej rycynowy", "Zmiękczające: parafina płynna (zachłystowe zapalenie płuc, ↓ wit. ADEK), dokuzan", "Zaparcia poopioidowe: **metylonaltrekson, naloksegol**; IBS-C: linaklotyd; prukalopryd", "Przeciwwskazania do przeczyszczających: niedrożność, ostry brzuch", "**Loperamid** – agonista μ (nie przenika do OUN); przeciwwskazany: **biegunka krwawa/gorączka (czerwonka), C. difficile**, dzieci < 2 lat; przedawkowanie – arytmie (QT)", "Racekadotryl (inhibitor enkefalinazy), **diosmektyt**, węgiel
