rzeciwgorączkowe i rozkurczowe** (spazmolityczne); słabe przeciwzapalne. Pochodna pirazolonu."}, {"q": "Jakie jest najgroźniejsze działanie niepożądane metamizolu?", "a": "**Agranulocytoza** – niezależna od dawki, może wystąpić w trakcie leczenia lub krótko po nim, także u osób wcześniej tolerujących lek."}, {"q": "Jakie objawy wymagają natychmiastowego przerwania metamizolu (EMA 2024)?", "a": "**Gorączka, dreszcze, ból gardła, bolesne owrzodzenia błon śluzowych** (jama ustna, nos, gardło, narządy płciowe, odbyt) → przerwać lek i pilnie wykonać morfologię z rozmazem, nie czekając na wynik."}, {"q": "Czy przy metamizolu zaleca się rutynowe monitorowanie morfologii?", "a": "**Nie** – EMA uznała, że nie wykazano jego skuteczności we wczesnym wykrywaniu agranulocytozy; morfologię wykonuje się przy wystąpieniu objawów."}, {"q": "Jakie są przeciwwskazania do metamizolu?", "a": "Agranulocytoza po metamizolu lub innych pirazolonach/pirazolidynach w wywiadzie, **upośledzona czynność szpiku**, choroby układu krwiotwórczego, nadwrażliwość."}, {"q": "Jaki jest mechanizm działania metotreksatu?", "a": "**Antagonista kwasu foliowego** – hamuje reduktazę dihydrofolianową (w RZS dodatkowo ↑ adenozyny – działanie przeciwzapalne)."}, {"q": "Jak dawkuje się metotreksat w RZS i jak zmniejsza się jego toksyczność?", "a": "**Raz w tygodniu** (pomyłka w dawkowaniu codziennym – ciężkie zatrucie) + **kwas foliowy**; kontrola morfologii i prób wątrobowych."}, {"q": "Jakie są działania niepożądane metotreksatu?", "a": "Mielosupresja, **hepatotoksyczność** (zwłóknienie), śródmiąższowe zapalenie płuc, owrzodzenia jamy ustnej, nudności, działanie **teratogenne**."}, {"q": "Jakie leki nasilają toksyczność metotreksatu?", "a": "**NLPZ**, kotrimoksazol (trimetoprim – dodatkowy antagonizm folianów), penicyliny, probenecyd, IPP (↓ wydalania nerkowego)."}, {"q": "Na co rozkłada się sulfasalazyna i jakie ma działania niepożądane?", "a": "Na **5-ASA (mesalazynę) i sulfapirydynę**. Działania: nudności, wysypka, **oligospermia** (odwracalna), niedobór folianów, agranulocytoza, pomarańczowe zabarwienie moczu."}, {"q": "Jakie badanie trzeba wykonywać u pacjentów leczonych chlorochiną lub hydroksychlorochiną?", "a": "**Badania okulistyczne** – ryzyko nieodwracalnej **retinopatii**."}, {"q": "Jakie działania niepożądane mają sole złota?", "a": "**Proteinuria** (kłębuszkowe zapalenie nerek), cytopenie, zmiany skórne i śluzówkowe; obecnie rzadko stosowane."}, {"q": "Jaki jest mechanizm działania kolchicyny?", "a": "Wiąże **tubulinę** i hamuje polimeryzację mikrotubul → ↓ migracji i aktywności **neutrofili** w ognisku zapalenia (napad dny)."}, {"q": "Jakie są działania niepożądane i interakcje kolchicyny?", "a": "**Biegunka**, nudności, wymioty, mielosupresja, miopatia; wąski indeks terapeutyczny. Groźne interakcje z inhibitorami CYP3A4/P-gp (**klarytromycyna**, cyklosporyna, werapamil) – zatrucia śmiertelne."}, {"q": "Jak działają allopurinol i febuksostat?", "a": "Hamują **oksydazę ksantynową** → ↓ wytwarzania kwasu moczowego (leczenie przewlekłe dny)."}, {"q": "Jaka groźna interakcja dotyczy allopurinolu?", "a": "Z **azatiopryną i 6-merkaptopuryną** (metabolizowanymi przez oksydazę ksantynową) → kumulacja → ciężka **mielosupresja** (trzeba zmniejszyć dawkę o ok. 75%)."}], "sources": [{"t": "EMA – Metamizole-containing medicinal products, procedura art. 107i (decyzja KE 22.11.2024)", "u": "https://www.ema.europa.eu/pl/medicines/human/referrals/metamizole-containing-medicinal-products-0"}, {"t": "EMA – Diclofenac-containing medicines, referral (2013)", "u": "https://www.ema.europa.eu/en/medicines/human/referrals/diclofenac-containing-medicines"}]}, {"id": "f-antybiotyki1", "num": "F4", "title": "Antybiotyki cz. 1: β-laktamy, glikopeptydy, aminoglikozydy, makrolidy, tetracykliny, linkozamidy, polimyksyny", "summary": ["Antybiotyki dzieli się według **mechanizmu działania**: hamujące syntezę ściany komórkowej (β-laktamy, glikopeptydy, fosfomycyna), syntezę białek na rybosomie (podjednostka 30S: aminoglikozydy i tetracykliny; 50S: makrolidy, linkozamidy, chloramfenikol, oksazolidynony), działające na błonę komórkową (polimyksyny, daptomycyna) i na kwasy nukleinowe (fluorochinolony, ryfampicyna, metronidazol, sulfonamidy z trimetoprimem). Dzieli się je też według działania na **bakteriobójcze** (β-laktamy, glikopeptydy, aminoglikozydy, fluorochinolony) i **bakteriostatyczne** (makrolidy, tetracykliny, linkozamidy, sulfonamidy). Antybiotyki **zależne od czasu** (β-laktamy, wankomycyna) wymagają utrzymania stężenia powyżej MIC, czyli częstego dawkowania lub wlewów ciągłych. Antybiotyki **zależne od stężenia** (aminoglikozydy, fluorochinolony) podaje się w dużej dawce raz na dobę, co wykorzystuje efekt poantybiotykowy.", "**β-laktamy** (penicyliny, cefalosporyny, karbapenemy, monobaktamy) wiążą białka wiążące penicylinę (**PBP**, transpeptydazy) i hamują sieciowanie peptydoglikanu. Działają bakteriobójczo na dzielące się bakterie. Oporność wynika z **β-laktamaz** (penicylinaz, ESBL, karbapenemaz), zmiany PBP (MRSA ma PBP2a kodowane przez mecA, a pneumokoki zmienione PBP) i zmniejszonej przepuszczalności błony zewnętrznej. Inhibitory β-laktamaz to klawulanian, sulbaktam, tazobaktam i awibaktam. Najczęstsze działania niepożądane to **reakcje alergiczne**, od wysypki do anafilaksji (reakcje krzyżowe penicylin z cefalosporynami są rzadkie), a poza tym biegunka, w tym zakażenie *C. difficile*, oraz drgawki przy dużych dawkach (zwłaszcza imipenem). Amoksycylina podana w mononukleozie wywołuje wysypkę.", "**Penicyliny**: naturalne (benzylopenicylina i.v. lub i.m., fenoksymetylpenicylina p.o., benzatynowa o przedłużonym działaniu w kile i profilaktyce gorączki reumatycznej), izoksazolilowe oporne na penicylinazę (kloksacylina), aminopenicyliny (ampicylina, amoksycylina z klawulanianem lub bez) oraz przeciwpseudomonasowe (piperacylina z tazobaktamem). **Cefalosporyny**: generacja I (cefazolina, cefadroksyl) działa na Gram-dodatnie i jest stosowana w profilaktyce okołooperacyjnej. Generacja II (cefuroksym, cefaklor) obejmuje też H. influenzae. Generacja III (ceftriakson, cefotaksym, ceftazydym z aktywnością wobec Pseudomonas) przenika do OUN i leczy zapalenie opon. Generacja IV to cefepim, a V ceftarolina (działa na MRSA). Na **enterokoki i Listerię cefalosporyny nie działają**. **Karbapenemy** (imipenem z cylastatyną, meropenem, ertapenem bez aktywności wobec Pseudomonas) mają najszersze spektrum, w tym na ESBL. **Aztreonam** działa tylko na Gram-ujemne tlenowce.", "**Glikopeptydy** (wankomycyna, teikoplanina) wiążą końcówkę **D-Ala-D-Ala** prekursora peptydoglikanu. Działają tylko na Gram-dodatnie, w tym **MRSA**, a doustna wankomycyna leczy zakażenie C. difficile (nie wchłania się). Szybki wlew daje **zespół „czerwonego człowieka”** (uwalnianie histaminy), a poza tym wankomycyna jest nefrotoksyczna i ototoksyczna i wymaga monitorowania stężeń. **Aminoglikozydy** (gentamycyna, amikacyna, tobramycyna, streptomycyna) wiążą podjednostkę 30S, powodują błędny odczyt mRNA i działają bakteriobójczo, zależnie od stężenia, wyłącznie na **tlenowe bakterie Gram-ujemne** (do wnętrza bakterii przenikają z udziałem tlenu). Działają synergistycznie z β-laktamami. Są **nefrotoksyczne** (odwracalnie) i **ototoksyczne** (nieodwracalnie, ryzyko rośnie przy mutacji mitochondrialnej m.1555A>G), a także blokują przewodnictwo nerwowo-mięśniowe. Nie wchłaniają się z przewodu pokarmowego.", "**Makrolidy** (erytromycyna, klarytromycyna, azytromycyna) wiążą podjednostkę 50S i działają na bakterie atypowe (Mycoplasma, Chlamydia, Legionella), paciorkowce, Bordetella i H. pylori (klarytromycyna). **Wydłużają QT**. Erytromycyna i klarytromycyna **silnie hamują CYP3A4**, co nasila działanie statyn, kolchicyny, warfaryny i cyklosporyny. Erytromycyna pobudza też receptor motylinowy (działanie prokinetyczne). Azytromycyna ma bardzo długi t½ i słabo hamuje CYP3A4. **Tetracykliny** (doksycyklina, minocyklina, tygecyklina) wiążą 30S. Leczą zakażenia atypowe, riketsjozy, boreliozę, trądzik i cholerę. Tworzą **chelaty z jonami Ca, Mg, Fe i Al**, więc nie przyjmuje się ich z mlekiem ani z lekami zobojętniającymi. Odkładają się w zębach i kościach, dlatego są przeciwwskazane w ciąży i u dzieci < 8 lat. Powodują też nadwrażliwość na światło i uszkodzenie przełyku. **Linkozamidy** (klindamycyna) działają na beztlenowce i Gram-dodatnie, w tym na toksyny (zakażenia paciorkowcowe z martwicą), i najsilniej z antybiotyków predysponują do **zakażenia C. difficile**. **Polimyksyny** (kolistyna, polimyksyna B) działają jak detergent na błonę Gram-ujemnych, są lekiem ostatniej szansy wobec bakterii wielolekoopornych i działają nefro- oraz neurotoksycznie."], "review": [{"h": "Podział wg mechanizmu", "items": ["Ściana komórkowa: **β-laktamy**, **glikopeptydy**, fosfomycyna, bacytracyna", "Rybosom 30S: **aminoglikozydy**, **tetracykliny** (i glicylcykliny – tygecyklina)", "Rybosom 50S: **makrolidy**, **linkozamidy**, chloramfenikol, oksazolidynony (linezolid), streptograminy", "Błona komórkowa: **polimyksyny** (Gram–), daptomycyna (Gram+)", "Kwasy nukleinowe: fluorochinolony (gyraza), ryfampicyna (RNA-polimeraza), metronidazol, sulfonamidy + trimetoprim (foliany)", "Bakteriobójcze: β-laktamy, glikopeptydy, aminoglikozydy, fluorochinolony, polimyksyny", "Bakteriostatyczne: makrolidy, tetracykliny, linkozamidy, sulfonamidy, chloramfenikol", "**Zależne od czasu** (T > MIC): β-laktamy, wankomycyna → częste dawki / wlew ciągły", "**Zależne od stężenia** (Cmax/MIC): aminoglikozydy, fluorochinolony → raz na dobę; efekt poantybiotykowy"]}, {"h": "β-laktamy – mechanizm i oporność", "items": ["Wiążą **PBP** (transpeptydazy) → ↓ sieciowania peptydoglikanu → liza dzielących się bakterii", "Oporność: **β-laktamazy** (penicylinazy, ESBL, AmpC, karbapenemazy KPC/NDM), **zmiana PBP** (MRSA – PBP2a, gen *mecA*; PRSP), porynowe (Gram–), pompy", "Inhibitory β-laktamaz: **klawulanian, sulbaktam, tazobaktam**, awibaktam", "Działania: **alergia** (wysypka, pokrzywka, anafilaksja; IgE), biegunka, **C. difficile**, drgawki (duże dawki, imipenem, niewydolność nerek), śródmiąższowe zapalenie nerek, cytopenie", "Amoksycylina/ampicylina w **mononukleozie** → wysypka plamisto-grudkowa", "Reakcje krzyżowe penicylina–cefalosporyny rzadkie (~1–2%), większe przy podobnych łańcuchach bocznych"]}, {"h": "Penicyliny", "items": ["**Benzylopenicylina** (i.v./i.m.) – paciorkowce, kiła, meningokoki, Clostridium", "**Fenoksymetylpenicylina** (p.o.) – angina paciorkowcowa", "**Penicylina benzatynowa** – kiła, profilaktyka gorączki reumatycznej (co 3–4 tyg.)", "Izoksazolilowe (oporne na penicylinazę): **kloksacylina**, flukloksacylina – gronkowce MSSA", "Aminopenicyliny: **ampicylina, amoksycylina** (± klawulanian) – + H. influenzae, E. coli, **Enterococcus**, **Listeria**", "Przeciwpseudomonasowe: **piperacylina + tazobaktam**, tikarcylina", "Probenecyd ↓ sekrecji kanalikowej → ↑ stężenia penicylin"]}, {"h": "Cefalosporyny, karbapenemy, monobaktamy", "items": ["I gen.: **cefazolina**, cefadroksyl, cefaleksyna – Gram+, **profilaktyka okołooperacyjna**", "II gen.: **cefuroksym**, cefaklor – + H. influenzae, Moraxella", "III gen.: **ceftriakson** (wydalanie z żółcią – „szlam” w pęcherzyku; nie z wapniem i.v. u noworodków), **cefotaksym**, **ceftazydym** (Pseudomonas) – przenikają do OUN (zapalenie opon)", "IV gen.: **cefepim** (Gram+ i Gram–, Pseudomonas); V gen.: **ceftarolina** (MRSA)", "Nowe: ceftazydym/awibaktam, ceftolozan/tazobaktam", "**Cefalosporyny nie działają na enterokoki, Listerię, MRSA** (oprócz ceftaroliny), atypowe", "Grupa N-metylotiotetrazolowa (cefamandol, cefoperazon) – reakcja disulfiramowa, hipoprotrombinemia", "Karbapenemy: **imipenem + cylastatyna** (cylastatyna hamuje dehydropeptydazę nerkową), **meropenem**, ertapenem (bez Pseudomonas i Acinetobacter) – najszersze spektrum, ESBL", "Karbapenemy ↓ stężenie **kwasu walproinowego** (napady!)", "**Aztreonam** – tylko Gram– tlenowe; można w alergii na penicyliny (wyjątek: ceftazydym – wspólny łańcuch)"]}, {"h": "Glikopeptydy", "items": ["**Wankomycyna**, teikoplanina – wiążą **D-Ala-D-Ala** → hamują polimeryzację peptydoglikanu", "Tylko **Gram+**: **MRSA**, MRSE, enterokoki, C. difficile (wankomycyna **doustnie** – nie wchłania się)", "Oporność: VRE – zamiana D-Ala-D-Ala na **D-Ala-D-Lac**", "Działania: **zespół czerwonego człowieka** (szybki wlew – histamina) → wolny wlew ≥ 60 min; nefrotoksyczność (z aminoglikozydami), ototoksyczność", "Monitorowanie stężeń (AUC/MIC lub stężenie minimalne)"]}, {"h": "Aminoglikozydy", "items": ["**Gentamycyna, amikacyna, tobramycyna**, netylmycyna, **streptomycyna** (gruźlica), neomycyna (miejscowo/p.o. – encefalopatia wątrobowa)", "Wiążą **30S** → błędny odczyt mRNA, bakteriobójcze, **zależne od stężenia**, efekt poantybiotykowy → **1× dziennie**", "Spektrum: **tlenowe Gram–** (w tym Pseudomonas); synergizm z β-laktamami (enterokokowe IZW); nie działają na beztlenowce (transport tlenozależny)", "Nie wchłaniają się z p.pokarmowego; słabo do OUN; wydalanie nerkowe", "**Nefrotoksyczność** (cewki proksymalne; zwykle odwracalna)", "**Ototoksyczność** (ślimak i przedsionek; **nieodwracalna**); ↑ ryzyko przy mutacji mtDNA **m.1555A>G** (12S rRNA) – nawet przy prawidłowych stężeniach; ↑ z diuretykami pętlowymi", "**Blokada nerwowo-mięśniowa** (miastenia, leki zwiotczające – ostrożnie)", "Przeciwwskazane w ciąży (głuchota płodu – streptomycyna)", "Monitorowanie stężeń; dawkowanie wg masy ciała i czynności nerek"]}, {"h": "Makrolidy", "items": ["**Erytromycyna, klarytromycyna, azytromycyna**, roksytromycyna, spiramycyna (toksoplazmoza w ciąży)", "Wiążą **50S** (23S rRNA), bakteriostatyczne", "Spektrum: **atypowe** (Mycoplasma, Chlamydia, Legionella), paciorkowce (alergia na penicylinę), Bordetella pertussis, Campylobacter, **H. pylori** (klarytromycyna), MAC", "Oporność: metylacja rybosomu (*erm* – oporność krzyżowa MLSB), pompy (*mef*)", "**Wydłużenie QT**; nudności, biegunka (erytromycyna – agonista **motyliny**); cholestaza (estolan erytromycyny); ototoksyczność (duże dawki)", "Erytromycyna i **klarytromycyna** – silne **inhibitory CYP3A4**: statyny (rabdomioliza), kolchicyna, warfaryna, cyklosporyna, karbamazepina, teofilina", "**Azytromycyna** – bardzo długi t½ (3–5 dni leczenia), duże stężenia tkankowe, słaby wpływ na CYP3A4"]}, {"h": "Tetracykliny", "items": ["**Doksycyklina**, minocyklina, tetracyklina; glicylcyklina **tygecyklina** (MRSA, VRE, ESBL)", "Wiążą **30S** (blokują przyłączanie aminoacylo-tRNA), bakteriostatyczne", "Wskazania: atypowe, **riketsjozy, borelioza**, bruceloza, cholera, **trądzik**, malaria (profilaktyka), wąglik", "**Chelaty z Ca²⁺, Mg²⁺, Fe²⁺, Al³⁺** → nie z mlekiem, lekami zobojętniającymi, preparatami żelaza", "Odkładanie w **zębach i kościach** (przebarwienia, hipoplazja szkliwa) → przeciwwskazane w **ciąży, laktacji, u dzieci < 8 lat**", "**Fotodermatoza**; zapalenie/owrzodzenie przełyku (popijać, nie kłaść się); hepatotoksyczność; nadkażenia grzybicze; nasilenie niewydolności nerek (oprócz doksycykliny)", "Minocyklina – zawroty głowy (zaburzenia przedsionkowe), przebarwienia skóry"]}, {"h": "Linkozamidy i polimyksyny", "items": ["**Klindamycyna**, linkomycyna – 50S, bakteriostatyczne", "Spektrum: **beztlenowce** (powyżej przepony), gronkowce, paciorkowce; hamuje produkcję **toksyn** (martwicze zapalenie powięzi + penicylina), toksoplazmoza, trądzik (miejscowo)", "Najczęstsza przyczyna **rzekomobłoniastego zapalenia jelit** (C. difficile)", "**Polimyksyna B, kolistyna** – kationowe detergenty błony Gram– (wiążą LPS)", "Lek ostatniej szansy: **wielolekooporne** Pseudomonas, Acinetobacter, Klebsiella (KPC)", "**Nefrotoksyczność, neurotoksyczność** (parestezje, blokada nerwowo-mięśniowa)", "Nowe antybiotyki: daptomycyna (Gram+, błona; nie w zapaleniu płuc – inaktywowana przez surfaktant; miopatia), **linezolid** (MRSA, VRE; mielosupresja, neuropatia, **słaby MAOI** – zespół serotoninowy), dalbawancyna"]}], "cards": [{"q": "Które antybiotyki hamują syntezę ściany komórkowej?", "a": "**β-laktamy** (penicyliny, cefalosporyny, karbapenemy, monobaktamy), **glikopeptydy** (wankomycyna, teikoplanina), fosfomycyna, bacytracyna."}, {"q": "Które antybiotyki wiążą podjednostkę 30S, a które 50S rybosomu?", "a": "**30S**: aminoglikozydy, tetracykliny (tygecyklina). **50S**: makrolidy, linkozamidy, chloramfenikol, oksazolidynony (linezolid), streptograminy."}, {"q": "Czym różnią się antybiotyki zależne od czasu i od stężenia?", "a": "**Zależne od czasu** (β-laktamy, wankomycyna) – liczy się czas utrzymania stężenia > MIC → częste dawki/wlew ciągły. **Zależne od stężenia** (aminoglikozydy, fluorochinolony) – liczy się Cmax/MIC → duża dawka raz na dobę."}, {"q": "Jaki jest mechanizm działania β-laktamów?", "a": "Wiążą **białka wiążące penicylinę (PBP)** – transpeptydazy sieciujące peptydoglikan → osłabienie ściany i liza dzielących się bakterii (działanie bakteriobójcze)."}, {"q": "Jakie są mechanizmy oporności na β-laktamy?", "a": "Wytwarzanie **β-laktamaz** (penicylinazy, ESBL, AmpC, karbapenemazy), **zmiana PBP** (MRSA – PBP2a kodowane przez *mecA*; pneumokoki oporne na penicylinę), zmniejszona przepuszczalność błony zewnętrznej (utrata poryn), pompy efflux."}, {"q": "Dlaczego MRSA jest oporny na prawie wszystkie β-laktamy?", "a": "Wytwarza zmienione białko **PBP2a** (gen *mecA*) o niskim powinowactwie do β-laktamów. Wyjątek: **ceftarolina** (cefalosporyna V generacji)."}, {"q": "Wymień inhibitory β-laktamaz i leki, z którymi się je łączy.", "a": "**Klawulanian** (z amoksycyliną), **sulbaktam** (z ampicyliną), **tazobaktam** (z piperacyliną, ceftolozanem), **awibaktam** (z ceftazydymem)."}, {"q": "Jakie jest najczęstsze poważne działanie niepożądane penicylin?", "a": "**Reakcje nadwrażliwości** – od wysypki i pokrzywki po wstrząs anafilaktyczny (IgE-zależny)."}, {"q": "Co się dzieje po podaniu amoksycyliny w mononukleozie zakaźnej?", "a": "U większości chorych pojawia się **wysypka plamisto-grudkowa** (nie oznacza prawdziwej alergii)."}, {"q": "Do czego stosuje się penicylinę benzatynową?", "a": "Leczenie **kiły** i **profilaktyka nawrotów gorączki reumatycznej** (preparat o przedłużonym działaniu, i.m. co 3–4 tygodnie)."}, {"q": "Które penicyliny są oporne na penicylinazę gronkowcową?", "a": "Penicyliny **izoksazolilowe**: kloksacylina, flukloksacylina, dikloksacylina, oksacylina (oraz metycylina – historycznie)."}, {"q": "Które penicyliny działają na Pseudomonas aeruginosa?", "a": "**Piperacylina (z tazobaktamem)**, tikarcylina (z klawulanianem)."}, {"q": "Do czego stosuje się cefalosporyny I generacji (cefazolinę)?", "a": "Zakażenia bakteriami **Gram-dodatnimi** (MSSA, paciorkowce) i **profilaktyka okołooperacyjna**."}, {"q": "Które cefalosporyny przenikają do OUN i są stosowane w zapaleniu opon?", "a": "III generacji: **ceftriakson, cefotaksym** (oraz ceftazydym, cefepim)."}, {"q": "Która cefalosporyna działa na Pseudomonas aeruginosa?", "a": "**Ceftazydym** (III gen.) i **cefepim** (IV gen.); także ceftolozan/tazobaktam, ceftazydym/awibaktam."}, {"q": "Na jakie bakterie nie działają cefalosporyny?", "a": "**Enterokoki, Listeria monocytogenes**, MRSA (wyjątek ceftarolina), bakterie atypowe (Mycoplasma, Chlamydia, Legionella)."}, {"q": "Jaką cechą wyróżnia się ceftriakson?", "a": "Długi t½ (1× dziennie), wydalanie z żółcią (**„szlam” w pęcherzyku żółciowym**), nie podaje się go noworodkom z hiperbilirubinemią i nie łączy i.v. z preparatami wapnia u noworodków (precypitaty)."}, {"q": "Po co imipenem łączy się z cylastatyną?", "a": "**Cylastatyna hamuje dehydropeptydazę I** w nerkach, która rozkłada imipenem (↑ stężenia, ochrona przed nefrotoksycznymi metabolitami)."}, {"q": "Jakie jest charakterystyczne działanie niepożądane imipenemu?", "a": "Obniżenie progu drgawkowego – **drgawki** (zwłaszcza w niewydolności nerek i chorobach OUN)."}, {"q": "Jaka interakcja dotyczy karbapenemów i kwasu walproinowego?", "a": "Karbapenemy gwałtownie **obniżają stężenie kwasu walproinowego** → ryzyko napadów padaczkowych; nie należy ich łączyć."}, {"q": "Czym różni się ertapenem od imipenemu i meropenemu?", "a": "Nie działa na **Pseudomonas aeruginosa i Acinetobacter**; ma długi t½ (1× dziennie)."}, {"q": "Jakie spektrum ma aztreonam i kiedy jest przydatny?", "a": "Tylko **tlenowe Gram-ujemne** (także Pseudomonas). Może być stosowany u osób z alergią na penicyliny (brak reakcji krzyżowych, poza ceftazydymem)."}, {"q": "Jaki jest mechanizm działania wankomycyny?", "a": "Wiąże końcówkę **D-alanylo-D-alaniny** prekursorów peptydoglikanu → hamuje transglikozylację i transpeptydację ściany komórkowej."}, {"q": "Jakie jest spektrum wankomycyny?", "a": "Wyłącznie **Gram-dodatnie**: MRSA, MRSE, enterokoki, Clostridioides difficile (doustnie), paciorkowce."}, {"q": "Dlaczego wankomycynę podaje się doustnie w zakażeniu C. difficile?", "a": "Bo **nie wchłania się** z przewodu pokarmowego – osiąga duże stężenie w świetle jelita."}, {"q": "Czym jest zespół czerwonego człowieka i jak mu zapobiegać?", "a": "Zaczerwienienie skóry twarzy i tułowia, świąd, ↓ RR po **szybkim wlewie wankomycyny** (uwalnianie histaminy). Zapobieganie: wolny wlew (≥ 60 min), ewentualnie lek przeciwhistaminowy."}, {"q": "Na czym polega oporność enterokoków na wankomycynę (VRE)?", "a": "Zamiana końcówki prekursora **D-Ala-D-Ala na D-Ala-D-Lac** (geny *van*) – wankomycyna traci powinowactwo."}, {"q": "Jaki jest mechanizm działania aminoglikozydów?", "a": "Wiążą podjednostkę **30S** → błędny odczyt mRNA i synteza nieprawidłowych białek, uszkodzenie błony → działanie **bakteriobójcze**, zależne od stężenia."}, {"q": "Dlaczego aminoglikozydy nie działają na bakterie beztlenowe?", "a": "Ich transport do wnętrza komórki bakteryjnej jest **tlenozależny**."}, {"q": "Dlaczego aminoglikozydy łączy się z β-laktamami?", "a": "**Synergizm** – β-laktam uszkadza ścianę i ułatwia wnikanie aminoglikozydu (np. enterokokowe zapalenie wsierdzia: ampicylina + gentamycyna)."}, {"q": "Dlaczego aminoglikozydy podaje się raz na dobę?", "a": "Działają **zależnie od stężenia** i mają długi **efekt poantybiotykowy**; jednocześnie dawkowanie 1× dziennie zmniejsza kumulację w nerkach i uchu (mniejsza toksyczność)."}, {"q": "Jakie są główne działania niepożądane aminoglikozydów?", "a": "**Nefrotoksyczność** (zwykle odwracalna), **ototoksyczność** (ślimakowa i przedsionkowa, nieodwracalna), **blokada nerwowo-mięśniowa**."}, {"q": "Jaka mutacja zwiększa ryzyko ototoksyczności gentamycyny (ChPL po PSUSA 2023)?", "a": "Mutacje **mitochondrialnego DNA**, zwłaszcza **m.1555A>G w genie 12S rRNA** – ryzyko głuchoty nawet przy prawidłowych stężeniach w surowicy; należy rozważyć inne leczenie lub badania genetyczne (wywiad rodzinny ze strony matki)."}, {"q": "Jakie leki nasilają ototoksyczność i nefrotoksyczność aminoglikozydów?", "a": "**Diuretyki pętlowe** (furosemid – ototoksyczność), wankomycyna, cisplatyna, amfoterycyna B, cyklosporyna (nefrotoksyczność)."}, {"q": "U kogo aminoglikozydy mogą wywołać niebezpieczne osłabienie mięśni?", "a": "U chorych na **miastenię** i u pacjentów otrzymujących leki zwiotczające – działają jak bloker przewodnictwa nerwowo-mięśniowego."}, {"q": "Do czego stosuje się neomycynę doustnie?", "a": "Nie wchłania się – stosowana do **wyjałowienia jelit** (np. encefalopatia wątrobowa) i miejscowo."}, {"q": "Jaki jest mechanizm działania makrolidów?", "a": "Wiążą **23S rRNA podjednostki 50S** → hamują translokację i wydłużanie łańcucha peptydowego; zwykle bakteriostatycznie."}, {"q": "Jakie jest spektrum i główne wskazania makrolidów?", "a": "**Bakterie atypowe** (Mycoplasma, Chlamydia, Legionella), paciorkowce (alergia na penicylinę), **krztusiec**, Campylobacter, **H. pylori** (klarytromycyna), prątki atypowe (MAC)."}, {"q": "Które makrolidy silnie hamują CYP3A4 i jakie to ma skutki?", "a": "**Erytromycyna i klarytromycyna** → ↑ stężenia statyn (rabdomioliza), kolchicyny, cyklosporyny, takrolimusu, karbamazepiny, warfaryny, teofiliny. Azytromycyna – słaby wpływ."}, {"q": "Dlaczego erytromycyna wywołuje dolegliwości żołądkowo-jelitowe?", "a": "Jest **agonistą receptora motylinowego** – pobudza perystaltykę (wykorzystywana też jako prokinetyk w gastroparezie)."}, {"q": "Jakie działanie niepożądane na serce mają makrolidy?", "a": "**Wydłużenie odstępu QT** → ryzyko torsade de pointes (zwłaszcza z innymi lekami wydłużającymi QT)."}, {"q": "Czym wyróżnia się azytromycyna?", "a": "Bardzo długi t½ i duże stężenia tkankowe (kuracja 3–5 dni), dobrze działa na **H. influenzae** i atypowe, słabo hamuje CYP3A4."}, {"q": "Jaki jest mechanizm działania tetracyklin?", "a": "Wiążą podjednostkę **30S** i blokują przyłączanie aminoacylo-tRNA do rybosomu – działanie bakteriostatyczne."}, {"q": "Jakie są główne wskazania doksycykliny?", "a": "Zakażenia atypowe, **riketsjozy, borelioza** (rumień wędrujący), bruceloza, cholera, **trądzik**, profilaktyka malarii, wąglik, kiła (alergia na penicylinę)."}, {"q": "Dlaczego tetracyklin nie popija się mlekiem?", "a": "Tworzą nierozpuszczalne **chelaty z jonami Ca²⁺** (oraz Mg²⁺, Fe²⁺, Al³⁺ – leki zobojętniające, preparaty żelaza) → ↓ wchłaniania."}, {"q": "Dlaczego tetracykliny są przeciwwskazane w ciąży i u dzieci < 8 lat?", "a": "Odkładają się w **zębach i kościach** (wiążą wapń) → trwałe przebarwienia zębów, hipoplazja szkliwa, zaburzenia wzrostu kości."}, {"q": "Jakie działanie niepożądane tetracyklin wymaga unikania słońca?", "a": "**Nadwrażliwość na światło (fotodermatoza)** – zwłaszcza doksycyklina i demeklocyklina."}, {"q": "Jak przyjmować doksycyklinę, by uniknąć uszkodzenia przełyku?", "a": "Popić **dużą ilością wody**, w pozycji siedzącej/stojącej, nie kłaść się bezpośrednio po przyjęciu."}, {"q": "Czym jest tygecyklina?", "a": "Glicylcyklina (pochodna minocykliny) o szerokim spektrum, w tym **MRSA, VRE, ESBL**, Acinetobacter; nie działa na Pseudomonas."}, {"q": "Jakie jest spektrum klindamycyny?", "a": "**Beztlenowce** (zwłaszcza powyżej przepony – ropnie płuc, zakażenia jamy ustnej), gronkowce, paciorkowce; toksoplazmoza; trądzik (miejscowo)."}, {"q": "Dlaczego klindamycynę dodaje się w ciężkich zakażeniach paciorkowcowych (martwicze zapalenie powięzi)?", "a": "Hamuje syntezę białek, w tym **toksyn bakteryjnych** (efekt niezależny od fazy wzrostu)."}, {"q": "Który antybiotyk najczęściej wywołuje rzekomobłoniaste zapalenie jelita grubego?", "a": "**Klindamycyna** (także cefalosporyny, fluorochinolony, aminopenicyliny) – zakażenie *Clostridioides difficile*."}, {"q": "Jaki jest mechanizm działania polimyksyn i kiedy się je stosuje?", "a": "Kationowe **detergenty** wiążące LPS i uszkadzające błonę bakterii Gram-ujemnych. Lek ostatniej szansy w zakażeniach **wielolekoopornymi** Pseudomonas, Acinetobacter, Klebsiella."}, {"q": "Jakie są działania niepożądane kolistyny?", "a": "**Nefrotoksyczność** i **neurotoksyczność** (parestezje, zawroty głowy, blokada nerwowo-mięśniowa – bezdech)."}, {"q": "Jakie działania niepożądane i interakcje ma linezolid?", "a": "Mielosupresja (trombocytopenia przy > 2 tyg.), neuropatia obwodowa i nerwu wzrokowego, kwasica mleczanowa; jest **słabym inhibitorem MAO** → zespół serotoninowy z SSRI, przełom nadciśnieniowy z tyraminą."}, {"q": "Dlaczego daptomycyna nie jest stosowana w zapaleniu płuc?", "a": "Jest **inaktywowana przez surfaktant** płucny."}], "sources": [{"t": "EMA – Gentamycyna (stosowanie ogólne), PSUSA/00009159/202303: zmiany w ChPL (ototoksyczność, mutacje mtDNA)", "u": "https://www.ema.europa.eu/pl/documents/psusa/gentamicin-systemic-use-cmdh-scientific-conclusions-grounds-variation-amendments-product-information-timetable-implementation-psusa-00009159-202303_pl.pdf"}]}, {"id": "f-antybiotyki2", "num": "F5", "title": "Antybiotyki cz. 2: fluorochinolony, sulfonamidy, nitroimidazole, nitrofurany, leki przeciwgruźlicze, antyseptyki", "summary": ["**Fluorochinolony** (cyprofloksacyna, lewofloksacyna, moksyfloksacyna, norfloksacyna, ofloksacyna) hamują **gyrazę DNA** (topoizomerazę II, głównie u Gram-ujemnych) i **topoizomerazę IV** (głównie u Gram-dodatnich). Działają bakteriobójczo i zależnie od stężenia, dobrze wchłaniają się po podaniu doustnym i dobrze penetrują tkanki. Cyprofloksacyna działa najsilniej na Gram-ujemne (w tym Pseudomonas). Lewofloksacyna i moksyfloksacyna to fluorochinolony „oddechowe”, aktywne też wobec pneumokoków i bakterii atypowych. W 2019 r. EMA ograniczyła ich stosowanie z powodu **ciężkich, długotrwałych i potencjalnie trwałych działań niepożądanych**: zapalenia i zerwania ścięgien (zwłaszcza Achillesa), neuropatii obwodowej, zaburzeń OUN (depresja, zaburzenia pamięci i snu) oraz zaburzeń zmysłów. Nie stosuje się ich w zakażeniach łagodnych lub samoograniczających się, niebakteryjnych ani w profilaktyce, a ostrożność zachowuje się u osób starszych, z chorobami nerek, po przeszczepie i przyjmujących glikokortykosteroidy. Kwas pipemidowy i nalidyksowy wycofano. Inne działania niepożądane fluorochinolonów to **wydłużenie QT**, tętniak i rozwarstwienie aorty, dysglikemia, fototoksyczność, drgawki i zakażenie C. difficile. Tworzą chelaty z kationami wielowartościowymi, a cyprofloksacyna hamuje CYP1A2 (wzrost stężenia teofiliny).", "**Sulfonamidy** hamują syntetazę dihydropteroinianu, bo są analogami PABA, a **trimetoprim** hamuje bakteryjną reduktazę dihydrofolianu. Razem tworzą **kotrimoksazol** (sekwencyjna blokada syntezy folianów), który działa bakteriobójczo. Wskazania: zakażenia układu moczowego, **pneumocystozowe zapalenie płuc** (leczenie i profilaktyka), toksoplazmoza, nokardioza i część zakażeń MRSA. Działania niepożądane: **ciężkie reakcje skórne** (zespół Stevensa–Johnsona, TEN), hemoliza przy niedoborze G6PD, krystaluria, mielosupresja, hiperkaliemia (trimetoprim działa jak amiloryd) i żółtaczka jąder podkorowych u noworodków (wypieranie bilirubiny z albumin). Kotrimoksazol nasila działanie warfaryny i metotreksatu. **Sulfony** (dapson) stosuje się w trądzie i w profilaktyce PCP. Daje methemoglobinemię i hemolizę.", "**Nitroimidazole** (metronidazol, tynidazol, ornidazol) są prolekami redukowanymi w komórkach **beztlenowców i pierwotniaków** do reaktywnych rodników uszkadzających DNA. Wskazania: zakażenia beztlenowcowe (poniżej przepony), lamblioza, rzęsistkowica, ameboza, bakteryjne zapalenie pochwy, C. difficile i eradykacja H. pylori. Działania niepożądane to metaliczny posmak, **reakcja disulfiramowa z alkoholem**, neuropatia obwodowa i ciemny mocz. Metronidazol nasila działanie warfaryny. **Nitrofurany** (nitrofurantoina, furazydyna) działają wyłącznie w **dolnych drogach moczowych**, bo stężenia terapeutyczne osiągają tylko w moczu. Stosuje się je w niepowikłanym zapaleniu pęcherza. Przy długim stosowaniu dają zwłóknienie płuc, neuropatię i hepatotoksyczność, nie stosuje się ich przy obniżonym GFR i są przeciwwskazane w końcówce ciąży (hemoliza u noworodka).", "**Leki przeciwgruźlicze** pierwszego rzutu to izoniazyd (H), ryfampicyna (R), pirazynamid (Z) i etambutol (E). Standard leczenia to faza intensywna HRZE przez 2 miesiące, a potem faza kontynuacji HR przez 4 miesiące, zawsze lekami skojarzonymi, by zapobiec oporności. **Izoniazyd** hamuje syntezę kwasów mykolowych (prolek aktywowany przez KatG). Jest hepatotoksyczny i daje **neuropatię obwodową**, której zapobiega **witamina B6 (pirydoksyna)**. Wolni acetylatorzy są bardziej narażeni na toksyczność. **Ryfampicyna** hamuje zależną od DNA polimerazę RNA. Barwi płyny ustrojowe (mocz, łzy, soczewki kontaktowe) na **pomarańczowo-czerwono**, jest silnym **induktorem CYP450** (osłabia antykoncepcję, warfarynę, inhibitory proteazy, GKS) i działa hepatotoksycznie. **Pirazynamid** jest hepatotoksyczny i powoduje **hiperurykemię** (dnę). **Etambutol** wywołuje **pozagałkowe zapalenie nerwu wzrokowego** (zaburzenia ostrości i widzenia barwy zielonej), dlatego kontroluje się wzrok. Streptomycyna, aminoglikozyd ototoksyczny, jest lekiem rezerwowym.", "**Środki odkażające i antyseptyczne** niszczą drobnoustroje na powierzchniach (dezynfekcja) albo na skórze, błonach śluzowych i w ranach (antyseptyka). Należą do nich alkohole (etanol 70%, izopropanol: denaturacja białek, nie działają na przetrwalniki), związki jodu (**jodopowidon**: szerokie spektrum, ostrożnie w chorobach tarczycy i u noworodków), **chlorheksydyna** (biguanid uszkadzający błonę, działa długo, jest standardem do skóry przed zabiegami i do jamy ustnej), oktenidyna, nadtlenek wodoru, związki chloru (podchloryn), aldehydy (glutaral, formaldehyd do dezynfekcji narzędzi), czwartorzędowe związki amoniowe (benzalkonium) oraz związki srebra."], "review": [{"h": "Fluorochinolony", "items": ["Hamują **gyrazę DNA** (topoizomeraza II – Gram–) i **topoizomerazę IV** (Gram+); bakteriobójcze, zależne od stężenia", "**Cyprofloksacyna** – najsilniej Gram– (Pseudomonas), zakażenia układu moczowego, prostatitis bakteryjne, wąglik", "**Lewofloksacyna, moksyfloksacyna** – „oddechowe”: pneumokoki, atypowe; moksyfloksacyna – beztlenowce, nie do zakażeń moczowych", "Dobra biodostępność p.o. (≈ i.v.); **chelaty z Ca, Mg, Al, Fe, Zn** (odstęp od leków zobojętniających, mleka)", "EMA 2019: ciężkie, długotrwałe, potencjalnie **trwałe** działania – **zapalenie/zerwanie ścięgien (Achillesa)**, bóle mięśni/stawów, **neuropatia**, depresja, zaburzenia pamięci i snu, zaburzenia wzroku, słuchu, smaku, węchu", "Nie stosować: zakażenia łagodne/samoograniczające (gardło), niebakteryjne (przewlekłe niebakteryjne zapalenie prostaty), profilaktyka biegunki podróżnych i nawracających zakażeń pęcherza, gdy dostępne są inne leki", "Ostrożność: wiek podeszły, choroby nerek, **przeszczep narządu**, **glikokortykosteroidy** (unikać łączenia)", "Wycofane (zawieszone): **kwas pipemidowy**, kwas nalidyksowy, cynoksacyna, flumechina", "Inne: **wydłużenie QT**, tętniak/rozwarstwienie aorty, niedomykalność zastawek, dys-/hipoglikemia, fototoksyczność, drgawki, C. difficile; nie u dzieci i w ciąży (chrząstka stawowa – w badaniach na zwierzętach)", "Cyprofloksacyna hamuje **CYP1A2** → ↑ teofilina, klozapina, tyzanidyna"]}, {"h": "Sulfonamidy, trimetoprim, sulfony", "items": ["Sulfonamid = analog **PABA** → hamuje syntetazę dihydropteroinianu; **trimetoprim** – reduktazę dihydrofolianu bakterii", "**Kotrimoksazol** (sulfametoksazol + trimetoprim) – sekwencyjna blokada, bakteriobójczy", "Wskazania: ZUM, **Pneumocystis jirovecii** (leczenie i profilaktyka), toksoplazmoza, nokardioza, Stenotrophomonas, MRSA (skóra)", "Działania: **SJS/TEN**, wysypki, hemoliza (G6PD), krystaluria, mielosupresja (foliany), **hiperkaliemia** (trimetoprim blokuje ENaC), ↑ kreatyniny", "Noworodki i III trymestr: wypieranie bilirubiny → **żółtaczka jąder podkorowych**", "Interakcje: **warfaryna** (↑ INR), **metotreksat** (mielotoksyczność), fenytoina", "**Dapson** (sulfon) – trąd, profilaktyka PCP, dermatitis herpetiformis; methemoglobinemia, hemoliza", "Sulfasalazyna – IBD, RZS; sulfacetamid – miejscowo (oczy)"]}, {"h": "Nitroimidazole i nitrofurany", "items": ["**Metronidazol**, tynidazol, ornidazol – prolek redukowany w komórkach **beztlenowych** → wolne rodniki → uszkodzenie DNA", "Wskazania: beztlenowce (jama brzuszna, miednica), **lamblioza, rzęsistkowica, ameboza**, bakteryjne zapalenie pochwy, **C. difficile**, **H. pylori**", "Działania: metaliczny posmak, nudności, **reakcja disulfiramowa** z alkoholem, neuropatia obwodowa, drgawki, ciemny mocz", "Interakcje: **warfaryna** (↑ INR), lit", "**Nitrofurantoina, furazydyna** – stężenia terapeutyczne tylko w **moczu** → niepowikłane zapalenie pęcherza", "Nitrofurantoina: nudności, reakcje płucne (ostre – nadwrażliwość; przewlekłe – **zwłóknienie płuc**), neuropatia, hepatotoksyczność, hemoliza (G6PD)", "Nie stosować przy znacznie obniżonym GFR (nieskuteczne, toksyczne) i w końcówce ciąży / u noworodków"]}, {"h": "Leki przeciwgruźlicze", "items": ["Schemat: **2 HRZE + 4 HR** (zawsze skojarzenie – zapobieganie oporności)", "**Izoniazyd (H)** – prolek (KatG) → hamuje syntezę **kwasów mykolowych** (InhA); hepatotoksyczny, **neuropatia** (niedobór B6) → **pirydoksyna**; wolni acetylatorzy – ↑ toksyczność; toczeń polekowy; hamuje CYP (↑ fenytoina)", "**Ryfampicyna (R)** – hamuje **polimerazę RNA** zależną od DNA; **pomarańczowo-czerwone** zabarwienie moczu, łez, potu (soczewki!); silny **induktor CYP** (antykoncepcja, warfaryna, inhibitory proteazy HIV, GKS, azole, metadon); hepatotoksyczna; zespół grypopodobny przy przerywanym dawkowaniu", "**Pirazynamid (Z)** – działa w kwaśnym środowisku (makrofagi); hepatotoksyczny, **hiperurykemia** (dna), artralgia", "**Etambutol (E)** – hamuje arabinozylotransferazę; **pozagałkowe zapalenie nerwu wzrokowego** (↓ ostrości, zaburzenie widzenia barwy **zielonej**) → kontrola okulistyczna; ostrożnie u małych dzieci", "**Streptomycyna** – aminoglikozyd; ototoksyczna, nefrotoksyczna", "Leki II rzutu (MDR-TB): fluorochinolony, bedakilina, linezolid, amikacyna, delamanid, cykloseryna"]}, {"h": "Antyseptyki i środki dezynfekcyjne", "items": ["Dezynfekcja – przedmioty/powierzchnie; antyseptyka – skóra, błony śluzowe, rany", "**Alkohole** (etanol 60–80%, izopropanol) – denaturacja białek; szybkie; nie działają na przetrwalniki", "**Jodopowidon** – szerokie spektrum (też przetrwalniki przy dłuższym kontakcie); uwaga: choroby tarczycy, noworodki, ciąża, duże powierzchnie", "**Chlorheksydyna** – biguanid, uszkadza błonę; długie działanie resztkowe; przygotowanie skóry, płukanki jamy ustnej; nie do ucha środkowego i OUN", "**Oktenidyna** – rany, błony śluzowe", "Nadtlenek wodoru – działanie utleniające, krótkie; związki chloru (podchloryn sodu) – dezynfekcja", "**Aldehydy** (glutaral, formaldehyd) – dezynfekcja narzędzi, działanie sporobójcze; drażniące", "Czwartorzędowe sole amoniowe (chlorek benzalkonium) – słabsze, inaktywowane przez mydła", "Związki srebra (sulfadiazyna srebrowa – oparzenia), fiolet gencjany, nadmanganian potasu"]}], "cards": [{"q": "Jaki jest mechanizm działania fluorochinolonów?", "a": "Hamują **gyrazę DNA** (topoizomerazę II; główny cel u Gram-ujemnych) i **topoizomerazę IV** (główny cel u Gram-dodatnich) → zaburzenie replikacji DNA, działanie bakteriobójcze."}, {"q": "Czym różni się cyprofloksacyna od lewofloksacyny i moksyfloksacyny?", "a": "**Cyprofloksacyna** – najsilniej na Gram-ujemne (Pseudomonas), słabo na pneumokoki. **Lewofloksacyna, moksyfloksacyna** – „oddechowe”: pneumokoki, bakterie atypowe; moksyfloksacyna – także beztlenowce (nie do ZUM)."}, {"q": "Jakie ciężkie, długotrwałe działania niepożądane fluorochinolonów opisała EMA (2019)?", "a": "**Zapalenie i zerwanie ścięgien** (Achillesa), bóle mięśni i stawów, **neuropatia obwodowa**, zaburzenia OUN (depresja, zaburzenia pamięci, snu), zaburzenia wzroku, słuchu, smaku i węchu – mogą być **trwałe**."}, {"q": "W jakich sytuacjach EMA zaleciła niestosowanie fluorochinolonów?", "a": "Zakażenia łagodne lub samoograniczające się (np. gardła), zakażenia niebakteryjne (np. przewlekłe niebakteryjne zapalenie prostaty), **profilaktyka** biegunki podróżnych i nawracających zakażeń pęcherza, zakażenia łagodne/umiarkowane, gdy można zastosować inne leki."}, {"q": "U jakich pacjentów fluorochinolony stosuje się ze szczególną ostrożnością?", "a": "U **osób starszych**, z chorobami nerek, **po przeszczepieniu narządów** oraz przyjmujących **glikokortykosteroidy** (ryzyko uszkodzenia ścięgien – unikać łączenia)."}, {"q": "Które chinolony wycofano z obrotu w UE w 2019 r.?", "a": "**Kwas pipemidowy**, kwas nalidyksowy, cynoksacynę i flumechinę (zawieszenie pozwoleń)."}, {"q": "Jakie działanie fluorochinolonów na serce i naczynia trzeba znać?", "a": "**Wydłużenie QT** (torsade de pointes) oraz zwiększone ryzyko **tętniaka i rozwarstwienia aorty** (i niedomykalności zastawek)."}, {"q": "Jak przyjmować fluorochinolony względem leków zobojętniających i wapnia?", "a": "Z odstępem – tworzą **chelaty z Ca²⁺, Mg²⁺, Al³⁺, Fe²⁺, Zn²⁺**, co znacznie zmniejsza wchłanianie."}, {"q": "Jaka interakcja cyprofloksacyny wynika z hamowania CYP1A2?", "a": "↑ stężenia **teofiliny** (drgawki, arytmie), klozapiny, tyzanidyny (przeciwwskazane), kofeiny."}, {"q": "Jaki jest mechanizm działania sulfonamidów i trimetoprimu?", "a": "**Sulfonamidy** – analogi PABA, hamują syntetazę dihydropteroinianu. **Trimetoprim** – hamuje bakteryjną reduktazę dihydrofolianu. Razem (kotrimoksazol) – sekwencyjna blokada syntezy kwasu foliowego."}, {"q": "Jakie są główne wskazania kotrimoksazolu?", "a": "Zakażenia układu moczowego, **pneumocystozowe zapalenie płuc** (leczenie i profilaktyka u osób z immunosupresją), toksoplazmoza, nokardioza, Stenotrophomonas maltophilia, zakażenia skóry MRSA."}, {"q": "Jakie są groźne działania niepożądane kotrimoksazolu?", "a": "**Zespół Stevensa–Johnsona / TEN**, mielosupresja, hemoliza (niedobór G6PD), **hiperkaliemia**, krystaluria, hepatotoksyczność."}, {"q": "Dlaczego trimetoprim może powodować hiperkaliemię?", "a": "Blokuje **kanały sodowe ENaC** w cewce zbiorczej (działanie podobne do amilorydu) → ↓ wydalania K⁺."}, {"q": "Dlaczego sulfonamidów nie podaje się noworodkom i w końcówce ciąży?", "a": "Wypierają **bilirubinę** z połączeń z albuminami → ryzyko **żółtaczki jąder podkorowych** (kernicterus)."}, {"q": "Z jakimi lekami kotrimoksazol wchodzi w groźne interakcje?", "a": "**Warfaryna** (↑ INR, krwawienia), **metotreksat** (↑ mielotoksyczność – podwójny antagonizm folianów), fenytoina, ACEI/spironolakton (hiperkaliemia)."}, {"q": "Do czego stosuje się dapson i jakie ma działania niepożądane?", "a": "Trąd, profilaktyka PCP, opryszczkowate zapalenie skóry. Działania: **methemoglobinemia**, hemoliza (zwł. niedobór G6PD), agranulocytoza."}, {"q": "Jaki jest mechanizm działania metronidazolu?", "a": "Prolek – w komórkach **beztlenowców i pierwotniaków** grupa nitrowa jest redukowana do reaktywnych rodników, które uszkadzają DNA."}, {"q": "Jakie są wskazania metronidazolu?", "a": "Zakażenia **beztlenowcowe** (jama brzuszna, miednica), **lamblioza, rzęsistkowica, ameboza**, bakteryjne zapalenie pochwy, zakażenie **C. difficile**, eradykacja **H. pylori**."}, {"q": "Jakie są działania niepożądane metronidazolu?", "a": "Metaliczny posmak, nudności, **reakcja disulfiramowa z alkoholem**, neuropatia obwodowa (długie stosowanie), drgawki, ciemne zabarwienie moczu."}, {"q": "Jaka interakcja metronidazolu jest ważna u pacjenta na warfarynie?", "a": "Metronidazol hamuje metabolizm warfaryny (S-enancjomeru, CYP2C9) → ↑ **INR**, krwawienia."}, {"q": "Dlaczego nitrofurantoina jest stosowana tylko w zakażeniach dolnych dróg moczowych?", "a": "Osiąga stężenia terapeutyczne **wyłącznie w moczu** – nie działa ogólnoustrojowo (nie w odmiedniczkowym zapaleniu nerek)."}, {"q": "Jakie działania niepożądane ma nitrofurantoina przy długim stosowaniu?", "a": "Reakcje płucne (ostre zapalenie, **przewlekłe zwłóknienie płuc**), neuropatia obwodowa, hepatotoksyczność, hemoliza przy niedoborze G6PD."}, {"q": "Jaki jest standardowy schemat leczenia gruźlicy wrażliwej na leki?", "a": "**2 miesiące HRZE** (izoniazyd, ryfampicyna, pirazynamid, etambutol) + **4 miesiące HR**."}, {"q": "Dlaczego gruźlicę leczy się zawsze kilkoma lekami?", "a": "Aby zapobiec selekcji **szczepów opornych** (w dużej populacji prątków zawsze są spontaniczne mutanty oporne na pojedynczy lek)."}, {"q": "Jaki jest mechanizm działania izoniazydu?", "a": "Prolek aktywowany przez katalazo-peroksydazę prątka (**KatG**) → hamuje **syntezę kwasów mykolowych** ściany komórkowej (enzym InhA)."}, {"q": "Jakie są działania niepożądane izoniazydu i jak im zapobiegać?", "a": "**Hepatotoksyczność**, **neuropatia obwodowa** (niedobór witaminy B6) – profilaktycznie **pirydoksyna**; toczeń polekowy, drgawki."}, {"q": "Jakie znaczenie ma polimorfizm acetylacji dla izoniazydu?", "a": "Wolni acetylatorzy mają wyższe stężenia → większe ryzyko **neuropatii**; szybcy – częściej hepatotoksyczność (metabolit acetylohydrazyna)."}, {"q": "Jaki jest mechanizm działania ryfampicyny?", "a": "Hamuje **zależną od DNA polimerazę RNA** bakterii (podjednostka β, gen *rpoB*)."}, {"q": "O czym należy uprzedzić pacjenta rozpoczynającego leczenie ryfampicyną?", "a": "Że mocz, łzy, pot i ślina zabarwią się na **pomarańczowo-czerwono** (mogą trwale zabarwić soczewki kontaktowe) oraz że osłabia działanie **antykoncepcji hormonalnej**."}, {"q": "Dlaczego ryfampicyna wchodzi w liczne interakcje?", "a": "Jest silnym **induktorem CYP450** (3A4, 2C9 i in.) i P-gp → ↓ stężenia warfaryny, antykoncepcji, GKS, inhibitorów proteazy HIV, azoli, metadonu, cyklosporyny."}, {"q": "Jakie są działania niepożądane pirazynamidu?", "a": "**Hepatotoksyczność** (najbardziej hepatotoksyczny z leków I rzutu), **hiperurykemia** (napady dny), bóle stawów."}, {"q": "Jakie jest charakterystyczne działanie niepożądane etambutolu?", "a": "**Pozagałkowe zapalenie nerwu wzrokowego** – spadek ostrości wzroku, zawężenie pola widzenia, **zaburzenie rozpoznawania barwy zielonej** → regularne badania okulistyczne."}, {"q": "Czym różni się dezynfekcja od antyseptyki?", "a": "**Dezynfekcja** – niszczenie drobnoustrojów na przedmiotach i powierzchniach. **Antyseptyka** – na skórze, błonach śluzowych i w ranach."}, {"q": "Jaki jest mechanizm działania alkoholi jako antyseptyków i ich ograniczenie?", "a": "**Denaturacja białek** (najlepiej 60–80% roztwór z wodą); działają szybko, ale **nie niszczą przetrwalników**."}, {"q": "Na co uważać, stosując jodopowidon?", "a": "Wchłanianie jodu – ostrożnie w **chorobach tarczycy**, u noworodków, w ciąży i laktacji, na dużych powierzchniach (oparzenia)."}, {"q": "Jakie są zalety chlorheksydyny?", "a": "Szerokie spektrum, **długie działanie resztkowe** na skórze, niska toksyczność – przygotowanie pola operacyjnego, wkłucia, płukanie jamy ustnej. Nie stosować do ucha środkowego i OUN."}, {"q": "Które środki stosuje się do sterylizacji chemicznej/dezynfekcji wysokiego stopnia narzędzi?", "a": "**Aldehydy** – glutaral (aldehyd glutarowy), formaldehyd; działają sporobójczo, są drażniące."}], "sources": [{"t": "EMA – Quinolone and fluoroquinolone, art. 31 referral (2019): ograniczenia stosowania, zawieszenie chinolonów (j. polski)", "u": "https://www.ema.europa.eu/pl/documents/referral/quinolone-and-fluoroquinolone-article-31-referral-disabling-and-potentially-permanent-side-effects-lead-suspension-or-restrictions-quinolone-and-fluoroquinolone-antibiotics_pl.pdf"}]}, {"id": "f-wirusy-grzyby", "num": "F6", "title": "Leki przeciwwirusowe i przeciwgrzybicze", "summary": ["**Leki przeciwherpesowe** to analogi nukleozydów: acyklowir, walacyklowir (prolek o lepszej biodostępności), famcyklowir, gancyklowir i walgancyklowir. **Acyklowir** jest fosforylowany najpierw przez **wirusową kinazę tymidynową**, dlatego działa wybiórczo w zakażonych komórkach, a potem przez kinazy komórkowe do trifosforanu, który hamuje wirusową polimerazę DNA i kończy łańcuch. Stosuje się go w zakażeniach HSV i VZV (opryszczka, półpasiec, opryszczkowe zapalenie mózgu dożylnie). Duże dawki dożylne mogą wywołać **nefropatię krystaliczną**, której zapobiega nawodnienie, oraz neurotoksyczność. **Gancyklowir** działa na **CMV** (fosforylowany przez wirusową kinazę UL97) i jest **mielotoksyczny**. **Foskarnet** (bezpośredni inhibitor polimerazy, nie wymaga aktywacji) i **cydofowir** stosuje się przy oporności. Oba są nefrotoksyczne, a foskarnet zaburza dodatkowo gospodarkę Ca i Mg.", "**Grypa**: **oseltamiwir** (prolek doustny) i **zanamiwir** (wziewny, ostrożnie w astmie) hamują **neuraminidazę** wirusa grypy A i B, co blokuje uwalnianie nowych wirionów. Najskuteczniejsze są, gdy leczenie zacznie się w ciągu **48 h** od objawów. Oseltamiwiru używa się też w profilaktyce poekspozycyjnej, ale nie zastępuje on szczepienia. Najczęstsze działania niepożądane to nudności i wymioty, a opisano też zdarzenia neuropsychiatryczne, głównie u dzieci. Przy klirensie kreatyniny < 60 ml/min dawkę się zmniejsza. Amantadyna (blokuje białko M2) nie jest już stosowana w grypie, bo wirusy są na nią oporne, ale używa się jej w parkinsonizmie. **COVID-19**: nirmatrelwir z rytonawirem (inhibitor proteazy Mpro wzmocniony rytonawirem, który hamuje CYP3A4 i daje liczne interakcje) i remdesiwir (analog nukleotydu).", "**HIV** leczy się terapią skojarzoną (ART), zwykle trzema lekami, a obecnie często dwoma. Grupy leków: **NRTI** (tenofowir, emtrycytabina, lamiwudyna, abakawir, zydowudyna), czyli analogi nukleozydów hamujące odwrotną transkryptazę i kończące łańcuch DNA. Ich klasowe działanie niepożądane to toksyczność mitochondrialna z kwasicą mleczanową. Tenofowir uszkadza nerki i kości, abakawir może wywołać reakcję nadwrażliwości u nosicieli **HLA-B*5701**, a zydowudyna mielosupresję. **NNRTI** (efawirenz, rylpiwiryna, newirapina) wiążą się allosterycznie z odwrotną transkryptazą. Efawirenz daje objawy neuropsychiatryczne, a newirapina hepatotoksyczność i wysypkę. **Inhibitory proteazy** (darunawir, atazanawir, lopinawir) wzmacnia się rytonawirem lub kobicystatem, czyli inhibitorami CYP3A4. Dają zaburzenia metaboliczne i liczne interakcje. **Inhibitory integrazy** (dolutegrawir, biktegrawir, raltegrawir) są dziś podstawą ART. Inne grupy to inhibitory wejścia (marawirok, antagonista CCR5) i inhibitory fuzji (enfuwirtyd). **WZW B** leczy się tenofowirem lub entekawirem, a **WZW C** lekami o działaniu bezpośrednim (DAA): inhibitorami NS3/4A (glekaprewir), NS5A (pibrentaswir, welpataswir, ledipaswir) i NS5B (sofosbuwir). Wyleczalność przekracza 95%.", "**Leki przeciwgrzybicze**: **polieny** (amfoterycyna B, nystatyna) wiążą **ergosterol** błony grzyba i tworzą pory. Amfoterycyna B dożylnie leczy ciężkie grzybice układowe. Jest **nefrotoksyczna**, powoduje hipokaliemię i hipomagnezemię, a w trakcie wlewu reakcje z gorączką i dreszczami. Postacie lipidowe są mniej toksyczne. Nystatyna nie wchłania się i działa miejscowo (pleśniawki, przewód pokarmowy). **Azole** hamują **14α-demetylazę lanosterolu** (CYP51), co zmniejsza syntezę ergosterolu. Imidazole (ketokonazol, klotrimazol, mikonazol) stosuje się głównie miejscowo, a triazole (flukonazol, itrakonazol, worykonazol, pozakonazol, izawukonazol) ogólnoustrojowo. Flukonazol dobrze penetruje do OUN i moczu, ale nie działa na Aspergillus ani na C. krusei. Worykonazol jest lekiem z wyboru w **inwazyjnej aspergilozie**. Daje zaburzenia widzenia, wysypkę, nadwrażliwość na światło i zaburzenia czynności wątroby. Azole są **inhibitorami CYP3A4**, co oznacza liczne interakcje i wydłużenie QT. Itrakonazol jest kardiodepresyjny.", "**Echinokandyny** (kaspofungina, mikafungina, anidulafungina) hamują syntezę **β-1,3-glukanu** ściany komórkowej grzyba. Podaje się je dożylnie w kandydemii (lek z wyboru) i aspergilozie. Są dobrze tolerowane i mają mało interakcji. **Flucytozyna** jest antymetabolitem (przekształcanym w grzybie w 5-fluorouracyl) i stosuje się ją z amfoterycyną B w kryptokokowym zapaleniu opon. Działa mielotoksycznie. **Terbinafina** (alliloamina) hamuje **epoksydazę skwalenową**. Leczy grzybicę paznokci i skóry wywołaną przez dermatofity, a jej rzadkim działaniem niepożądanym jest hepatotoksyczność. **Gryzeofulwina** wiąże mikrotubule, odkłada się w keratynie, jest induktorem enzymów i teratogenem."], "review": [{"h": "Herpeswirusy", "items": ["**Acyklowir** – aktywacja przez **wirusową kinazę tymidynową** → trifosforan → hamuje polimerazę DNA, kończy łańcuch", "Wskazania: HSV, VZV (półpasiec, ospa), **opryszczkowe zapalenie mózgu** (i.v.)", "Działania: **nefropatia krystaliczna** (duże dawki i.v. – nawadniać), neurotoksyczność (splątanie, drgawki – niewydolność nerek)", "**Walacyklowir** – prolek acyklowiru (lepsza biodostępność); famcyklowir → pencyklowir", "**Gancyklowir / walgancyklowir** – **CMV** (kinaza UL97); **mielosupresja** (neutropenia), teratogenny", "**Foskarnet** – bezpośredni inhibitor polimerazy (bez fosforylacji) – oporne HSV/CMV; nefrotoksyczny, ↓ Ca²⁺/Mg²⁺ (drgawki)", "**Cydofowir** – CMV (zapalenie siatkówki); silnie nefrotoksyczny (+ probenecyd i nawodnienie)", "Oporność na acyklowir – mutacje kinazy tymidynowej"]}, {"h": "Grypa i COVID-19", "items": ["**Oseltamiwir** (p.o., prolek → karboksylan) i **zanamiwir** (wziewnie) – inhibitory **neuraminidazy** grypy A i B", "Rozpoczęcie leczenia w ciągu **48 h** od objawów; profilaktyka poekspozycyjna (od 1. r.ż.); nie zastępuje szczepienia", "Oseltamiwir: **nudności, wymioty**; zdarzenia neuropsychiatryczne (głównie dzieci); redukcja dawki przy CrCl < 60 ml/min", "Zanamiwir – **skurcz oskrzeli** (astma, POChP)", "Amantadyna, rymantadyna – blokery M2 (grypa A) – oporność, nie stosuje się w grypie", "**Nirmatrelwir + rytonawir** – inhibitor proteazy Mpro SARS-CoV-2; **rytonawir hamuje CYP3A4** → bardzo liczne interakcje", "**Remdesiwir** (i.v.) – analog nukleotydu, hamuje RNA-polimerazę; molnupirawir"]}, {"h": "HIV (ART)", "items": ["**NRTI**: tenofowir (TDF/TAF), emtrycytabina, lamiwudyna, abakawir, zydowudyna – analogi nukleozydów, kończą łańcuch DNA; klasowo: toksyczność mitochondrialna, **kwasica mleczanowa**", "Tenofowir (TDF) – **nefrotoksyczność**, ↓ gęstości kości; abakawir – nadwrażliwość (**HLA-B*5701** – badać przed leczeniem); zydowudyna – **mielosupresja** (niedokrwistość)", "**NNRTI**: efawirenz (zaburzenia snu, zawroty, objawy psychiczne; teratogenny?), rylpiwiryna (QT, wchłanianie z posiłkiem, nie z IPP), newirapina (hepatotoksyczność, wysypka/SJS)", "**Inhibitory proteazy (PI)**: darunawir, atazanawir (hiperbilirubinemia), lopinawir – **„boostowane” rytonawirem/kobicystatem**; dyslipidemia, insulinooporność, lipodystrofia, interakcje", "**Inhibitory integrazy (INSTI)**: **dolutegrawir, biktegrawir**, raltegrawir, kabotegrawir – podstawa ART; ↑ masy ciała", "Marawirok – antagonista **CCR5** (tylko wirusy R5); enfuwirtyd – inhibitor fuzji (gp41)", "PrEP: tenofowir + emtrycytabina"]}, {"h": "Wirusowe zapalenia wątroby", "items": ["WZW B: **entekawir, tenofowir** (wysoka bariera oporności); lamiwudyna – szybka oporność; interferon pegylowany", "WZW C: leki **DAA** – inhibitory NS3/4A (proteaza: glekaprewir, grazoprewir), **NS5A** (welpataswir, ledipaswir, pibrentaswir), **NS5B** (polimeraza: **sofosbuwir**) – wyleczalność > 95%", "Sofosbuwir + **amiodaron** → ciężka bradykardia", "Rybawiryna – analog guanozyny; **niedokrwistość hemolityczna**, silnie teratogenna"]}, {"h": "Polieny i azole", "items": ["**Amfoterycyna B** – wiąże **ergosterol** → pory w błonie; najszersze spektrum; grzybice układowe (kryptokokoza, mukormykoza, kandydoza)", "Amfoterycyna B: **nefrotoksyczność**, **hipokaliemia, hipomagnezemia**, reakcje wlewowe (gorączka, dreszcze), niedokrwistość; postacie **lipidowe** – mniej toksyczne", "**Nystatyna** – nie wchłania się: pleśniawki, kandydoza przewodu pokarmowego, miejscowo", "**Azole** hamują **14α-demetylazę lanosterolu** (CYP51 grzyba) → ↓ ergosterolu", "Imidazole: **ketokonazol** (ogólnie hepatotoksyczny, hamuje steroidogenezę – dziś w zespole Cushinga), klotrimazol, mikonazol (miejscowo)", "**Flukonazol** – Candida (bez C. krusei, słabo C. glabrata), kryptokoki; dobrze do **OUN i moczu**; nie działa na **Aspergillus**", "**Itrakonazol** – dermatofity, Aspergillus; kardiodepresyjny (nie w niewydolności serca); wchłanianie zależne od kwasu", "**Worykonazol** – lek z wyboru w **inwazyjnej aspergilozie**; **zaburzenia widzenia** (zmiana widzenia barw, światłowstręt), wysypka, nadwrażliwość na światło, ↑ enzymów wątrobowych", "Pozakonazol, izawukonazol – także mukormykoza", "Azole = **inhibitory CYP3A4** (statyny, cyklosporyna, takrolimus, midazolam, warfaryna); **wydłużenie QT**; induktory CYP3A4 osłabiają azole"]}, {"h": "Echinokandyny i inne", "items": ["**Kaspofungina, mikafungina, anidulafungina** – hamują syntezę **β-1,3-D-glukanu** ściany (i.v.)", "Lek z wyboru w **kandydemii**; aspergiloza (ratunkowo); dobrze tolerowane, mało interakcji", "**Flucytozyna** – w grzybie → 5-FU; z amfoterycyną B w **kryptokokowym zapaleniu opon**; mielotoksyczna", "**Terbinafina** – hamuje **epoksydazę skwalenową** (kumulacja skwalenu); grzybica paznokci (dermatofity) – 6–12 tyg.; hepatotoksyczność, zaburzenia smaku", "**Gryzeofulwina** – wiąże mikrotubule, gromadzi się w keratynie (grzybica skóry głowy u dzieci); induktor CYP, teratogenna, reakcja disulfiramowa", "Ciklopiroks, amorolfina – lakiery do paznokci"]}], "cards": [{"q": "Dlaczego acyklowir działa wybiórczo w komórkach zakażonych wirusem?", "a": "Pierwszą fosforylację przeprowadza **wirusowa kinaza tymidynowa** (HSV, VZV); dopiero potem kinazy komórkowe tworzą trifosforan hamujący wirusową polimerazę DNA."}, {"q": "Jaki jest mechanizm działania trifosforanu acyklowiru?", "a": "Kompetycyjnie hamuje **wirusową polimerazę DNA** i po wbudowaniu **kończy syntezę łańcucha DNA** (brak grupy 3'-OH)."}, {"q": "Jakie są wskazania do acyklowiru?", "a": "Zakażenia **HSV** (opryszczka wargowa i narządów płciowych, **opryszczkowe zapalenie mózgu** – i.v.) i **VZV** (ospa wietrzna, półpasiec)."}, {"q": "Jakie działanie niepożądane acyklowiru wymaga nawadniania pacjenta?", "a": "**Nefropatia krystaliczna** (wytrącanie kryształów w kanalikach) przy dużych dawkach dożylnych."}, {"q": "Czym jest walacyklowir?", "a": "**Prolekiem acyklowiru** (ester z waliną) o znacznie lepszej biodostępności doustnej – rzadsze dawkowanie."}, {"q": "Jaki lek stosuje się w zakażeniach CMV i jakie jest jego główne działanie niepożądane?", "a": "**Gancyklowir / walgancyklowir** – **mielosupresja** (neutropenia, trombocytopenia); działanie teratogenne."}, {"q": "Dlaczego foskarnet działa na wirusy oporne na acyklowir?", "a": "Bezpośrednio hamuje polimerazę DNA i **nie wymaga aktywacji przez wirusową kinazę** (oporność na acyklowir to najczęściej mutacja kinazy tymidynowej)."}, {"q": "Jakie są działania niepożądane foskarnetu?", "a": "**Nefrotoksyczność**, zaburzenia elektrolitowe (**hipokalcemia, hipomagnezemia** – drgawki), owrzodzenia narządów płciowych."}, {"q": "Jaki jest mechanizm działania oseltamiwiru?", "a": "Prolek → **karboksylan oseltamiwiru**, który hamuje **neuraminidazę** wirusa grypy A i B → blokada uwalniania nowych wirionów z komórek."}, {"q": "Kiedy należy rozpocząć leczenie oseltamiwirem, by było skuteczne?", "a": "W ciągu **48 godzin** (2 dni) od wystąpienia pierwszych objawów grypy."}, {"q": "Jakie są najczęstsze działania niepożądane oseltamiwiru?", "a": "**Nudności i wymioty** (zwykle jednorazowo w 1.–2. dobie); u dzieci – wymioty, ból brzucha. Opisano zdarzenia **neuropsychiatryczne** (majaczenie, halucynacje), głównie u dzieci."}, {"q": "Jak dostosować dawkę oseltamiwiru w niewydolności nerek (leczenie dorosłych)?", "a": "CrCl > 60: 75 mg 2×/d; 30–60: **30 mg 2×/d**; 10–30: **30 mg 1×/d**; ≤ 10: nie zaleca się."}, {"q": "Dlaczego zanamiwir stosuje się ostrożnie u chorych na astmę?", "a": "Podawany **wziewnie** może wywołać **skurcz oskrzeli**."}, {"q": "Dlaczego amantadyny nie stosuje się już w grypie?", "a": "Powszechna **oporność** wirusów grypy A (blokuje kanał jonowy M2); nie działa na grypę B. Stosowana w parkinsonizmie."}, {"q": "Dlaczego nirmatrelwir podaje się z rytonawirem i jaki ma to skutek?", "a": "Rytonawir **hamuje CYP3A4** i podwyższa stężenie nirmatrelwiru → jednocześnie powoduje **liczne, groźne interakcje** (statyny, amiodaron, leki przeciwkrzepliwe, immunosupresanty)."}, {"q": "Jaki jest mechanizm działania NRTI i ich klasowe działanie niepożądane?", "a": "Analogi nukleozydów/nukleotydów – po fosforylacji hamują **odwrotną transkryptazę** i kończą łańcuch DNA. Klasowo: **toksyczność mitochondrialna** (kwasica mleczanowa, stłuszczenie wątroby)."}, {"q": "Jakie badanie wykonuje się przed włączeniem abakawiru?", "a": "Oznaczenie **HLA-B*5701** – u nosicieli wysokie ryzyko ciężkiej **reakcji nadwrażliwości**."}, {"q": "Jakie są działania niepożądane tenofowiru (TDF)?", "a": "**Nefrotoksyczność** (tubulopatia, zespół Fanconiego) i **zmniejszenie gęstości mineralnej kości**."}, {"q": "Jakie jest główne działanie niepożądane zydowudyny?", "a": "**Mielosupresja** – niedokrwistość (makrocytarna), neutropenia; także miopatia."}, {"q": "Czym różnią się NNRTI od NRTI?", "a": "NNRTI (efawirenz, rylpiwiryna, newirapina) wiążą się **allosterycznie** z odwrotną transkryptazą (niekompetycyjnie), nie są analogami nukleozydów i nie wymagają fosforylacji."}, {"q": "Jakie działania niepożądane ma efawirenz?", "a": "Objawy **neuropsychiatryczne** (zawroty głowy, żywe sny, bezsenność, depresja), wysypka, hiperlipidemia."}, {"q": "Po co inhibitory proteazy HIV łączy się z rytonawirem lub kobicystatem?", "a": "Jako **„booster”** – hamują CYP3A4 i zwiększają stężenie inhibitora proteazy (np. darunawiru), co pozwala na rzadsze dawkowanie."}, {"q": "Jakie są działania niepożądane inhibitorów proteazy HIV?", "a": "Zaburzenia metaboliczne (**dyslipidemia, insulinooporność**, lipodystrofia), dolegliwości żołądkowo-jelitowe, liczne interakcje (CYP3A4); atazanawir – hiperbilirubinemia niesprzężona."}, {"q": "Jakie leki są obecnie podstawą terapii ART i jaki mają mechanizm?", "a": "**Inhibitory integrazy** (dolutegrawir, biktegrawir) – blokują wbudowywanie wirusowego DNA do genomu gospodarza; zwykle z dwoma NRTI lub w terapii dwulekowej."}, {"q": "Jaki jest mechanizm działania marawiroku?", "a": "Antagonista koreceptora **CCR5** – blokuje wnikanie HIV (tylko wirusów o tropizmie R5)."}, {"q": "Jakie leki stosuje się w przewlekłym WZW B?", "a": "**Entekawir** lub **tenofowir** (wysoka bariera oporności); ewentualnie interferon pegylowany."}, {"q": "Jakie są grupy leków DAA stosowanych w WZW C?", "a": "Inhibitory **proteazy NS3/4A** (np. glekaprewir), **NS5A** (welpataswir, ledipaswir, pibrentaswir) i **polimerazy NS5B** (sofosbuwir) – wyleczalność > 95%."}, {"q": "Jakie groźne powikłanie może wystąpić po połączeniu sofosbuwiru z amiodaronem?", "a": "**Ciężka, objawowa bradykardia** (nawet zatrzymanie krążenia)."}, {"q": "Jakie są działania niepożądane rybawiryny?", "a": "**Niedokrwistość hemolityczna** i silne działanie **teratogenne** (antykoncepcja u obojga partnerów do 6 mies. po leczeniu)."}, {"q": "Jaki jest mechanizm działania amfoterycyny B?", "a": "Wiąże **ergosterol** błony komórkowej grzyba i tworzy **pory** → wypływ jonów i śmierć komórki."}, {"q": "Jakie są działania niepożądane amfoterycyny B?", "a": "**Nefrotoksyczność**, **hipokaliemia i hipomagnezemia**, reakcje związane z wlewem (gorączka, dreszcze, hipotensja), niedokrwistość, zapalenie żył. Mniej toksyczne są postacie **lipidowe**."}, {"q": "Dlaczego nystatynę stosuje się tylko miejscowo?", "a": "Bo **nie wchłania się** z przewodu pokarmowego i jest zbyt toksyczna do podania pozajelitowego – pleśniawki, kandydoza jelit, skóry i pochwy."}, {"q": "Jaki jest mechanizm działania azoli?", "a": "Hamują grzybiczą **14α-demetylazę lanosterolu** (CYP51) → ↓ syntezy ergosterolu i gromadzenie toksycznych steroli."}, {"q": "Na jakie grzyby nie działa flukonazol?", "a": "Na **Aspergillus** i inne pleśnie oraz na **Candida krusei** (oporność naturalna); słabo na C. glabrata."}, {"q": "Jakie są zalety farmakokinetyczne flukonazolu?", "a": "Dobra biodostępność doustna, dobra penetracja do **OUN i moczu**, długi t½ (1× dziennie)."}, {"q": "Jaki lek jest z wyboru w inwazyjnej aspergilozie?", "a": "**Worykonazol** (alternatywnie izawukonazol, amfoterycyna B w postaci lipidowej)."}, {"q": "Jakie są charakterystyczne działania niepożądane worykonazolu?", "a": "**Zaburzenia widzenia** (niewyraźne widzenie, zmiana postrzegania barw, światłowstręt), wysypka, **nadwrażliwość na światło**, nieprawidłowe wyniki prób wątrobowych, obrzęki."}, {"q": "Dlaczego azole wchodzą w liczne interakcje?", "a": "Hamują **CYP3A4** człowieka → ↑ stężeń statyn, cyklosporyny, takrolimusu, midazolamu, warfaryny; wiele z nich wydłuża też **QT**. Induktory CYP3A4 (ryfampicyna, karbamazepina) ↓ stężenia azoli."}, {"q": "Dlaczego itrakonazolu nie stosuje się w niewydolności serca?", "a": "Działa **inotropowo ujemnie** (kardiodepresyjnie)."}, {"q": "Do czego obecnie stosuje się ketokonazol doustnie?", "a": "Ze względu na hepatotoksyczność nie jako lek przeciwgrzybiczy ogólnie, lecz w **zespole Cushinga** (hamuje steroidogenezę nadnerczową)."}, {"q": "Jaki jest mechanizm działania echinokandyn?", "a": "Hamują syntazę **β-1,3-D-glukanu** – składnika ściany komórkowej grzyba (ssaki go nie mają → mała toksyczność)."}, {"q": "W jakim zakażeniu echinokandyny są lekami z wyboru?", "a": "W **kandydemii** i inwazyjnej kandydozie (kaspofungina, mikafungina, anidulafungina – i.v.)."}, {"q": "W jakim skojarzeniu stosuje się flucytozynę?", "a": "Z **amfoterycyną B** w **kryptokokowym zapaleniu opon mózgowo-rdzeniowych** (w monoterapii szybko rozwija się oporność)."}, {"q": "Jaki jest mechanizm działania terbinafiny i jej główne wskazanie?", "a": "Hamuje **epoksydazę skwalenową** (kumulacja skwalenu, ↓ ergosterolu). Wskazanie: **grzybica paznokci** i skóry wywołana przez dermatofity."}, {"q": "Jakie są cechy gryzeofulwiny?", "a": "Wiąże mikrotubule (hamuje mitozę grzyba), odkłada się w **keratynie**; grzybica skóry owłosionej głowy u dzieci; induktor CYP, teratogenna, nadwrażliwość na światło."}], "sources": [{"t": "EMA – Tamiflu (oseltamiwir), Informacja o produkcie / ChPL (j. polski)", "u": "https://www.ema.europa.eu/pl/documents/product-information/tamiflu-epar-product-information_pl.pdf"}, {"t": "EMA – Vfend (worykonazol), streszczenie EPAR dla ogółu społeczeństwa (j. polski)", "u": "https://www.ema.europa.eu/pl/documents/overview/vfend-epar-summary-public_pl.pdf"}]}, {"id": "f-cholinergiczne", "num": "F7", "title": "Leki układu cholinergicznego: cholinomimetyki, inhibitory AChE, cholinolityki", "summary": ["**Acetylocholina** (ACh) jest syntetyzowana z choliny i acetylo-CoA przez acetylotransferazę cholinową, magazynowana w pęcherzykach i rozkładana w szczelinie synaptycznej przez **acetylocholinoesterazę (AChE)**. Butyrylocholinoesteraza (pseudocholinoesteraza) w osoczu rozkłada m.in. sukcynylocholinę i estrowe leki miejscowo znieczulające. Receptory **nikotynowe** są jonotropowe: N_M w płytce nerwowo-mięśniowej i N_N w zwojach autonomicznych, rdzeniu nadnerczy i OUN. Receptory **muskarynowe** sprzężone są z białkami G: **M1** (OUN, komórki okładzinowe żołądka, Gq), **M2** (serce, Gi: zwolnienie akcji serca i przewodzenia AV), **M3** (mięśnie gładkie i gruczoły, Gq: skurcz oskrzeli, jelit i pęcherza, wydzielanie, zwężenie źrenicy, rozszerzenie naczyń przez NO ze śródbłonka), M4 i M5 (OUN).", "**Cholinomimetyki bezpośrednie** to estry choliny (karbachol, betanechol, oporne na AChE) i alkaloidy (**pilokarpina**, muskaryna). Pilokarpinę stosuje się w **jaskrze** (zwężenie źrenicy, otwarcie kąta przesączania) i w suchości jamy ustnej. Betanechol pobudza pęcherz i jelita. **Cholinomimetyki pośrednie** to **inhibitory acetylocholinoesterazy**. Odwracalne: **neostygmina** i **pirydostygmina** (czwartorzędowe, nie przenikają do OUN; leczą miastenię i odwracają blokadę niedepolaryzującą), **fizostygmina** (trzeciorzędowa, przenika do OUN, odtrutka w zatruciu cholinolitykami), edrofonium (krótko działające, test w miastenii) oraz donepezil, rywastygmina i galantamina w chorobie Alzheimera. Nieodwracalne to **związki fosforoorganiczne** (insektycydy, bojowe środki trujące jak sarin), które fosforylują AChE.", "**Zatrucie inhibitorami AChE** (fosforoorganicznymi) wywołuje przełom cholinergiczny. Objawy muskarynowe obejmują „SLUDGE/DUMBELS”: ślinotok, łzawienie, oddawanie moczu, biegunkę, wymioty, **zwężenie źrenic**, bradykardię i **skurcz oskrzeli z bronchoreą**. Objawy nikotynowe to drżenia pęczkowe, osłabienie i porażenie mięśni (także oddechowych), a ośrodkowe to drgawki i śpiączka. Leczenie: **atropina** w dużych, miareczkowanych dawkach (do wysuszenia oskrzeli) oraz **reaktywatory AChE (oksymy: pralidoksym, obidoksym)** podane wcześnie, zanim enzym „zestarzeje się”. Dodatkowo stosuje się benzodiazepiny na drgawki, dekontaminację i wentylację.", "**Cholinolityki (antagoniści muskarynowi)** to **atropina** i **skopolamina** (alkaloidy pokrzyku i bielunia, trzeciorzędowe, przenikają do OUN; skopolaminę stosuje się w chorobie lokomocyjnej), **butylobromek hioscyny** (czwartorzędowy, spazmolityczny, bez działania ośrodkowego), **ipratropium i tiotropium** (wziewnie w POChP), **oksybutynina, solifenacyna i tolterodyna** (pęcherz nadreaktywny), **tropikamid i cyklopentolat** (rozszerzanie źrenic i porażenie akomodacji w okulistyce), **biperyden i triheksyfenidyl** (parkinsonizm polekowy) oraz pirenzepina (wybiórczo M1). Atropina leczy bradykardię, służy w premedykacji (ogranicza wydzielanie) i jest odtrutką w zatruciu fosforoorganicznym.", "**Zespół antycholinergiczny** to zatrucie atropiną, pokrzykiem, bieluniem, TLPD, lekami przeciwhistaminowymi I generacji lub fenotiazynami. Mnemotechnika: „gorący jak piec, suchy jak pieprz, czerwony jak burak, ślepy jak kret, szalony jak kapelusznik”. Oznacza to hipertermię, suchą skórę i śluzówki, zaczerwienienie, **rozszerzone źrenice** z zaburzeniem akomodacji, majaczenie i halucynacje, a ponadto tachykardię, zatrzymanie moczu i porażenną niedrożność jelit. Odtrutką jest **fizostygmina**. Przeciwwskazania do cholinolityków: **jaskra z wąskim kątem**, przerost prostaty z zaleganiem moczu, niedrożność przewodu pokarmowego, tachyarytmie i miastenia. **Leki blokujące zwoje** (heksametonium, mekamylamina) są dziś niemal nieużywane. **Toksyna botulinowa** hamuje uwalnianie ACh (rozszczepia SNARE) i stosuje się ją w dystoniach, spastyczności i nadmiernej potliwości."], "review": [{"h": "Receptory cholinergiczne", "items": ["**Nikotynowe** (jonotropowe, Na⁺/K⁺): **N_M** – płytka nerwowo-mięśniowa; **N_N** – zwoje autonomiczne, rdzeń nadnerczy, OUN", "**M1** (Gq) – OUN, zwoje, komórki okładzinowe (wydzielanie HCl)", "**M2** (Gi) – **serce**: ↓ HR, ↓ przewodzenia AV; presynaptycznie hamujące", "**M3** (Gq) – mięśnie gładkie (oskrzela, jelita, pęcherz – wypieracz), gruczoły (ślina, pot – cholinergiczne włókna współczulne!), zwieracz źrenicy, mięsień rzęskowy; śródbłonek → NO → rozszerzenie naczyń", "M4, M5 – OUN", "AChE – szczelina synaptyczna; **butyrylocholinoesteraza** – osocze (sukcynylocholina, estrowe znieczulające miejscowo, mivakurium)", "Hemicholinium – blokuje wychwyt choliny; wesamikol – pęcherzykowy transport ACh"]}, {"h": "Cholinomimetyki bezpośrednie", "items": ["Estry choliny: **karbachol** (M + N, oporny na AChE), **betanechol** (M; zatrzymanie moczu, atonia jelit), metacholina (test prowokacyjny w astmie)", "Alkaloidy: **pilokarpina** – **jaskra** (zwężenie źrenicy, skurcz m. rzęskowego → otwarcie kąta, ↑ odpływu cieczy), zespół Sjögrena/suchość jamy ustnej; muskaryna (muchomor, strzępiaki), arekolina", "Działania niepożądane: bradykardia, ↓ RR, skurcz oskrzeli, poty, ślinotok, biegunka, kolki", "Przeciwwskazania: astma, choroba wrzodowa, bradykardia/bloki, niedrożność mechaniczna, nadczynność tarczycy"]}, {"h": "Inhibitory acetylocholinoesterazy", "items": ["**Neostygmina** – czwartorzędowa (nie do OUN); miastenia, **odwracanie blokady niedepolaryzującej** (z atropiną/glikopironium), atonia jelit/pęcherza", "**Pirydostygmina** – dłuższe działanie; leczenie przewlekłe **miastenii**", "**Fizostygmina** – trzeciorzędowa (OUN); odtrutka w **zatruciu cholinolitykami**; jaskra", "Edrofonium – bardzo krótkie; test Tensilonowy (różnicowanie przełomu miastenicznego i cholinergicznego)", "**Donepezil, rywastygmina, galantamina** – choroba **Alzheimera** (OUN); bradykardia, nudności, wymioty", "**Nieodwracalne – związki fosforoorganiczne**: insektycydy (paration, malation), bojowe środki trujące (sarin, soman, tabun, VX), ekotiopat", "Karbaminiany (insektycydy, neostygmina) – inhibicja odwracalna (karbamylacja)"]}, {"h": "Zatrucie fosforoorganiczne", "items": ["Muskarynowe: ślinotok, łzawienie, poty, oddawanie moczu, biegunka, wymioty (**SLUDGE**), **zwężenie źrenic**, **bradykardia**, **skurcz oskrzeli + bronchorea**", "Nikotynowe: **drżenia pęczkowe**, osłabienie, porażenie mięśni oddechowych; tachykardia, ↑ RR (zwoje)", "OUN: niepokój, drgawki, śpiączka, depresja oddechowa", "Leczenie: dekontaminacja (ochrona personelu), drożność dróg oddechowych, **atropina** i.v. w dawkach powtarzanych/podwajanych do **wysuszenia oskrzeli** (nie do normalizacji źrenic)", "**Oksymy** (pralidoksym, obidoksym) – reaktywują AChE; skuteczne przed **„starzeniem się”** enzymu; działają na objawy nikotynowe", "Benzodiazepiny (diazepam, midazolam) – drgawki", "Zespół pośredni (24–96 h) – osłabienie mięśni proksymalnych, szyi, oddechowych; opóźniona polineuropatia"]}, {"h": "Cholinolityki", "items": ["**Atropina** – bradykardia, premedykacja, zatrucie fosforoorganiczne, rozszerzanie źrenic (długie – do 7–10 dni)", "**Skopolamina** – choroba lokomocyjna (plastry), silniejsze działanie ośrodkowe (sedacja, amnezja)", "**Butylobromek hioscyny** – czwartorzędowy, spazmolityczny (kolki), bez działania ośrodkowego", "**Ipratropium** (krótko), **tiotropium, glikopironium, umeklidynium, aklidynium** (długo) – wziewnie: **POChP**, astma", "**Oksybutynina, solifenacyna, tolterodyna, darifenacyna, trospium** – **pęcherz nadreaktywny** (M3)", "**Tropikamid, cyklopentolat** – okulistyka (mydriaza, cykloplegia; krótko)", "**Biperyden, triheksyfenidyl** – parkinsonizm, objawy pozapiramidowe po neuroleptykach", "**Pirenzepina** – wybiórczy M1 (dawniej choroba wrzodowa)", "Glikopironium i.v. – w anestezji (nie przenika do OUN)"]}, {"h": "Zespół antycholinergiczny i przeciwwskazania", "items": ["„**Gorący** (hipertermia – brak potu), **suchy** (skóra, śluzówki), **czerwony** (rozszerzenie naczyń skóry), **ślepy** (rozszerzone źrenice, cykloplegia), **szalony** (majaczenie, halucynacje)”", "+ **tachykardia**, zatrzymanie moczu, porażenna niedrożność jelit, drgawki", "Przyczyny: atropina, pokrzyk, bieluń, **TLPD**, leki przeciwhistaminowe I gen., fenotiazyny, leki przeciwparkinsonowskie", "Odtrutka: **fizostygmina** (nie w zatruciu TLPD z poszerzeniem QRS – ryzyko asystolii)", "Przeciwwskazania do cholinolityków: **jaskra z wąskim kątem**, **przerost prostaty** z zaleganiem moczu, niedrożność p. pokarmowego, megacolon, tachyarytmie, miastenia", "U osób starszych – splątanie, pogorszenie funkcji poznawczych (unikać – kryteria Beersa)"]}, {"h": "Zwoje i płytka nerwowo-mięśniowa", "items": ["Ganglioplegiki (heksametonium, trimetafan, mekamylamina) – blokują N_N; historycznie nadciśnienie; hipotensja ortostatyczna", "Nikotyna – w małych dawkach pobudza, w dużych blokuje zwoje (depolaryzacja); zastępcza terapia nikotynowa, **cytyzyna, wareniklina** (częściowi agoniści α4β2) – rzucanie palenia", "**Toksyna botulinowa** – rozszczepia białka **SNARE** → ↓ uwalniania ACh: dystonie, kurcz powiek, spastyczność, nadpotliwość, migrena przewlekła, kosmetyka", "Leki zwiotczające – patrz rozdział o anestetykach"]}], "cards": [{"q": "Jakie enzymy rozkładają acetylocholinę i inne estry choliny?", "a": "**Acetylocholinoesteraza** (synapsy, erytrocyty) i **butyrylocholinoesteraza** (pseudocholinoesteraza osocza – rozkłada też sukcynylocholinę i estrowe leki miejscowo znieczulające)."}, {"q": "Gdzie występują receptory nikotynowe N_M i N_N?", "a": "**N_M** – płytka nerwowo-mięśniowa mięśni szkieletowych. **N_N** – zwoje autonomiczne (współczulne i przywspółczulne), rdzeń nadnerczy, OUN."}, {"q": "Z jakim białkiem G sprzężony jest receptor M2 i jakie są skutki jego pobudzenia w sercu?", "a": "Z **Gi** → ↓ cAMP, otwarcie kanałów K⁺ → **zwolnienie akcji serca**, spowolnienie przewodzenia w węźle AV, ↓ kurczliwości przedsionków."}, {"q": "Jakie efekty wywołuje pobudzenie receptorów M3?", "a": "Skurcz mięśni gładkich (oskrzela, jelita, wypieracz pęcherza, zwieracz źrenicy, mięsień rzęskowy), wydzielanie gruczołów (ślinowych, potowych, oskrzelowych), rozszerzenie naczyń (przez **NO** ze śródbłonka)."}, {"q": "Dlaczego pilokarpina jest stosowana w jaskrze?", "a": "Pobudza M3 → skurcz **zwieracza źrenicy i mięśnia rzęskowego** → otwarcie kąta przesączania i ↑ odpływu cieczy wodnistej → ↓ ciśnienia śródgałkowego."}, {"q": "Do czego stosuje się betanechol?", "a": "Do pobudzenia pęcherza i jelit: **pooperacyjne zatrzymanie moczu**, atonia jelit (agonista M, oporny na AChE)."}, {"q": "Jakie są przeciwwskazania do cholinomimetyków?", "a": "**Astma**, bradykardia i bloki AV, choroba wrzodowa, mechaniczna niedrożność jelit i dróg moczowych, nadczynność tarczycy."}, {"q": "Czym różni się neostygmina od fizostygminy?", "a": "**Neostygmina** – czwartorzędowa amina, **nie przenika do OUN** (miastenia, odwracanie blokady). **Fizostygmina** – trzeciorzędowa, **przenika do OUN** (odtrutka w zatruciu cholinolitykami)."}, {"q": "Jaki lek stosuje się w przewlekłym leczeniu miastenii?", "a": "**Pirydostygminę** (inhibitor AChE o dłuższym działaniu niż neostygmina)."}, {"q": "Dlaczego neostygminę podaje się razem z atropiną lub glikopironium przy odwracaniu zwiotczenia?", "a": "Aby zablokować **muskarynowe** skutki nadmiaru ACh (bradykardia, ślinotok, skurcz oskrzeli), zachowując działanie nikotynowe w płytce."}, {"q": "Które inhibitory AChE stosuje się w chorobie Alzheimera?", "a": "**Donepezil, rywastygmina, galantamina** (przenikają do OUN); działania niepożądane: nudności, wymioty, biegunka, **bradykardia**."}, {"q": "Jak działają związki fosforoorganiczne?", "a": "**Nieodwracalnie fosforylują** acetylocholinoesterazę → kumulacja ACh w synapsach muskarynowych, nikotynowych i w OUN."}, {"q": "Jakie objawy muskarynowe występują w zatruciu fosforoorganicznym?", "a": "Ślinotok, łzawienie, poty, oddawanie moczu i stolca, wymioty, **zwężenie źrenic**, **bradykardia**, **skurcz oskrzeli i nadmierna wydzielina oskrzelowa**."}, {"q": "Jakie objawy nikotynowe występują w zatruciu fosforoorganicznym?", "a": "**Drżenia pęczkowe**, kurcze, osłabienie i porażenie mięśni (także oddechowych); pobudzenie zwojów – tachykardia, nadciśnienie."}, {"q": "Jaki jest cel podawania atropiny w zatruciu fosforoorganicznym?", "a": "Blokada objawów **muskarynowych**; dawki powtarzane/podwajane aż do **wysuszenia oskrzeli** i poprawy oddychania (HR > 80, skurczowe RR > 80), nie do normalizacji źrenic."}, {"q": "Jak działają oksymy (pralidoksym, obidoksym) i kiedy trzeba je podać?", "a": "**Reaktywują** fosforylowaną AChE (odłączają resztę fosforanową). Skuteczne tylko **wcześnie** – zanim kompleks ulegnie „starzeniu się” (dealkilacji). Działają też na objawy nikotynowe."}, {"q": "Czym jest „starzenie się” acetylocholinoesterazy?", "a": "Utrata grupy alkilowej z ufosforylowanego enzymu → kompleks staje się trwały i **niereaktywowalny przez oksymy** (dla somanu – minuty, dla insektycydów – godziny)."}, {"q": "Jaki lek stosuje się na drgawki w zatruciu fosforoorganicznym?", "a": "**Benzodiazepiny** (diazepam, midazolam)."}, {"q": "Czym różni się atropina od butylobromku hioscyny?", "a": "**Atropina** – trzeciorzędowa, przenika do OUN. **Butylobromek hioscyny** – czwartorzędowy, nie przenika do OUN, słabo wchłania się z p. pokarmowego; działa **spazmolitycznie** (kolki)."}, {"q": "Do czego stosuje się skopolaminę?", "a": "Profilaktyka **choroby lokomocyjnej** (plaster za uchem); ma silniejsze niż atropina działanie ośrodkowe (sedacja, amnezja)."}, {"q": "Jakie cholinolityki stosuje się w POChP?", "a": "Wziewne: krótko działający **ipratropium** (SAMA) i długo działające **tiotropium, glikopironium, umeklidynium, aklidynium** (LAMA)."}, {"q": "Jakie leki stosuje się w pęcherzu nadreaktywnym i jaki jest ich mechanizm?", "a": "**Oksybutynina, solifenacyna, tolterodyna, darifenacyna, trospium** – blokują receptory **M3** wypieracza pęcherza (alternatywa: mirabegron – agonista β3)."}, {"q": "Do czego w okulistyce stosuje się tropikamid?", "a": "Do krótkotrwałego **rozszerzenia źrenicy** (badanie dna oka) i porażenia akomodacji."}, {"q": "Jakie cholinolityki stosuje się w parkinsonizmie polekowym?", "a": "**Biperyden, triheksyfenidyl** – zmniejszają objawy pozapiramidowe (drżenie, sztywność) po neuroleptykach."}, {"q": "Jakie są objawy zespołu antycholinergicznego?", "a": "„Gorący jak piec, suchy jak pieprz, czerwony jak burak, ślepy jak kret, szalony jak kapelusznik” – **hi
