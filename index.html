<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Fiszki – pediatria i farmakologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef2; --surface:#ffffff; --surface2:#e2e5eb; --sunk:#d7dbe2;
  --ink:#0d0f14; --muted:#545b68; --line:#d3d7de; --line-strong:#b9bec8;
  --lime:#c6f03a; --lime-deep:#a9d81a; --on-lime:#0d0f14; --lime-text:#3a6300;
  --coral:#ff5a3c; --coral-text:#bf2d14; --coral-soft:#ffe1d9;
  --back:#0d0f14; --on-back:#f3f5f8; --back-muted:#a3aab6; --back-accent:#c6f03a;
  --focus:#3a6300;
  --shadow:0 1px 2px rgba(13,15,20,.06),0 8px 24px -8px rgba(13,15,20,.14);
  --shadow-lift:0 2px 4px rgba(13,15,20,.08),0 24px 48px -16px rgba(13,15,20,.28);
  --r:16px; --r-lg:22px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --sans:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0c10; --surface:#14161c; --surface2:#1c1f27; --sunk:#252933;
    --ink:#f2f4f7; --muted:#9aa1ae; --line:#262a33; --line-strong:#353a45;
    --lime-text:#c6f03a; --coral-text:#ff7a5e; --coral-soft:#3a1912;
    --back:#c6f03a; --on-back:#0d0f14; --back-muted:#3f5110; --back-accent:#0d0f14;
    --focus:#c6f03a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 24px 48px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0c10; --surface:#14161c; --surface2:#1c1f27; --sunk:#252933;
  --ink:#f2f4f7; --muted:#9aa1ae; --line:#262a33; --line-strong:#353a45;
  --lime-text:#c6f03a; --coral-text:#ff7a5e; --coral-soft:#3a1912;
  --back:#c6f03a; --on-back:#0d0f14; --back-muted:#3f5110; --back-accent:#0d0f14;
  --focus:#c6f03a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 24px 48px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-strong) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);font-feature-settings:"ss01","cv11";-webkit-font-smoothing:antialiased}
::selection{background:var(--lime);color:var(--on-lime)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num-tab{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px}
.logo{font:800 22px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:none;padding:4px 0}
.logo i{display:block;width:12px;height:12px;border-radius:4px;background:var(--lime);box-shadow:0 0 0 2px var(--ink) inset}
.crumb{flex:1;min-width:0;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;transition:border-color .2s var(--ease),transform .2s var(--ease)}
.back:hover{border-color:var(--line-strong)}
.back:active{transform:scale(.97)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s var(--ease)}
.iconbtn:hover{border-color:var(--line-strong)}
.theme-dark{display:none}
:root[data-theme="dark"] .theme-dark{display:block} :root[data-theme="dark"] .theme-light{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .theme-dark{display:block} :root:not([data-theme="light"]) .theme-light{display:none} }

.wrap{max-width:1200px;margin:0 auto;padding:0 16px 96px}

/* ---------- segmented controls ---------- */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2)}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s var(--ease),color .2s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* ---------- buttons ---------- */
.btn{line-height:1.2;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:14px;border:0;font-weight:650;font-size:16px;transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-lime{background:var(--lime);color:var(--on-lime);box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -12px rgba(120,160,0,.9)}
.btn-lime:hover{background:var(--lime-deep)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-line:hover{border-color:var(--line-strong)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.link:hover{color:var(--ink)}
.link.danger{color:var(--coral-text)}

/* ---------- progress bar (3 states) ---------- */
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.pbar i{display:block;height:100%;transition:width .5s var(--ease)}
.pbar .k{background:var(--lime)} .pbar .u{background:var(--coral)}
:root[data-theme="light"] .pbar .k, :root:not([data-theme]) .pbar .k{background:var(--lime-deep)}
.pbar.thin{height:5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--ink);font-weight:650}
.dot{width:9px;height:9px;border-radius:3px;background:var(--sunk);display:inline-block}
.dot.k{background:var(--lime-deep)} .dot.u{background:var(--coral)}

/* ---------- home ---------- */
.home{display:grid;gap:28px;padding-top:20px}
.book .seg{margin-bottom:28px}
.book h1{font:800 clamp(34px,6vw,52px)/1.02 var(--display);letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance}
.book .sub{color:var(--muted);margin:0 0 26px;max-width:46ch;text-wrap:pretty}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.prog-top strong{font:700 15px/1.2 var(--sans)}
.prog-top span{color:var(--muted);font-size:14px}
.actions{display:grid;gap:10px;margin-top:16px}
.note{text-wrap:pretty;color:var(--muted);font-size:13.5px;line-height:1.55;margin:22px 0 0;max-width:52ch}
.note + .link{margin-top:10px}

.chapters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.chapters-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.chapters-h h2{font:700 18px/1.2 var(--display);letter-spacing:-.01em;margin:0}
.chapters-h span{color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:64px 1fr 20px;align-items:center;gap:14px;width:100%;padding:16px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;transition:background .18s var(--ease)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row:hover .chev{transform:translateX(3px);color:var(--ink)}
.row .n{font:800 26px/1 var(--display);letter-spacing:-.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.row.done .n{color:var(--lime-text)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;line-height:1.35;margin-bottom:8px;text-wrap:pretty}
.row .meta{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.row .meta .pbar{flex:1;max-width:220px}
.chev{color:var(--line-strong);transition:transform .2s var(--ease),color .2s var(--ease)}

@media (min-width:960px){
  .home{grid-template-columns:400px 1fr;gap:48px;align-items:start;padding-top:40px}
  .book{position:sticky;top:96px}
  .row{padding:18px 24px;grid-template-columns:76px 1fr 20px}
  .chapters-h{padding:20px 24px 14px}
}

/* ---------- chapter ---------- */
.chap{max-width:860px;margin:0 auto;padding-top:28px}
.chap-h{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px}
.chap-h .n{flex:none;min-width:64px;height:64px;padding:0 12px;border-radius:18px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font:800 26px/1 var(--display);letter-spacing:-.04em}
.chap-h h1{font:800 clamp(26px,4.4vw,40px)/1.08 var(--display);letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
.chap .seg{margin-bottom:24px}
.chap.compact{padding-top:18px}
.chap.compact .chap-h{margin-bottom:16px;align-items:center}
.chap.compact .chap-h .n{min-width:48px;height:48px;border-radius:14px;font-size:20px}
.chap.compact .chap-h h1{font-size:clamp(20px,2.6vw,26px);margin:0;line-height:1.15}
.chap.compact .seg{margin-bottom:16px}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px 22px;font-size:17px;line-height:1.7}
.prose p{margin:0 0 1em;max-width:64ch;text-wrap:pretty}
.prose p:last-child{margin-bottom:0}
.prose b{font-weight:650;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--lime) var(--hl),transparent) 62%)}
.srcs{margin-top:14px;padding:16px 22px;border-radius:var(--r);border:1px dashed var(--line-strong);font-size:14px;color:var(--muted)}
.srcs h2{margin:0 0 6px;font:700 14px/1.3 var(--sans);color:var(--ink)}
.srcs ul{margin:0;padding-left:18px}
.srcs li{margin:3px 0}
.srcs a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line-strong);word-break:break-word}
.srcs a:hover{text-decoration-color:var(--ink)}
.next{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.next.one{grid-template-columns:1fr}

.rev{display:grid;gap:12px}
.rev section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.rev h2{margin:0 0 12px;font:700 19px/1.25 var(--display);letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.rev h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink) inset;flex:none}
.rev ul{margin:0;padding:0;list-style:none}
.rev li{text-wrap:pretty;position:relative;padding:7px 0 7px 22px;border-top:1px solid var(--line);line-height:1.55}
.rev li:first-child{border-top:0}
.rev li::before{content:"";position:absolute;left:4px;top:17px;width:7px;height:2px;background:var(--muted);border-radius:2px}
.rev b{font-weight:650}
@media (min-width:960px){ .rev{grid-template-columns:1fr 1fr;align-items:start} }

/* ---------- deck ---------- */
.deck.solo{max-width:760px;margin:0 auto}
.deck.solo{padding-top:28px}
.deck-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip svg.i{width:16px;height:16px}
.count{margin-left:auto;font:700 15px/1 var(--sans);font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-weight:500}
.deck .pbar{margin-bottom:18px}

.stage{perspective:1600px;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative}
.card{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .55s var(--ease),opacity .25s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:22px 22px 18px;display:flex;flex-direction:column;overflow:auto;box-shadow:var(--shadow-lift)}
.front{background:var(--surface);border:1px solid var(--line)}
.backf{background:var(--back);color:var(--on-back);transform:rotateY(180deg)}
.face .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.backf .lbl{color:var(--back-muted)}
.face .txt{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
.front .txt{font:700 clamp(23px,3.6vw,32px)/1.22 var(--display);letter-spacing:-.02em;text-wrap:balance}
.backf .txt{font-size:clamp(17px,2.4vw,20px);line-height:1.6}
.backf .txt b{color:var(--back-accent);font-weight:700}
:root[data-theme="dark"] .backf .txt b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .backf .txt b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px} }
.face .hint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted)}
.backf .hint{color:var(--back-muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.tag.k{background:var(--lime);color:var(--on-lime)}
.tag.u{background:var(--coral);color:#fff}
.backf .tag.k{box-shadow:0 0 0 1.5px var(--on-back) inset}

/* swipe verdict stamps */
.stamp{position:absolute;top:22px;z-index:3;pointer-events:none;font:800 22px/1 var(--display);letter-spacing:-.01em;padding:8px 14px;border-radius:12px;opacity:0;transform:rotate(-8deg) scale(.9);transition:opacity .12s linear}
.stamp.good{right:22px;background:var(--lime);color:var(--on-lime);transform:rotate(8deg) scale(.9)}
.stamp.bad{left:22px;background:var(--coral);color:#fff}

.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.vbtn{line-height:1.2;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:18px;border:0;font-weight:700;font-size:17px;transition:transform .18s var(--ease),filter .18s var(--ease)}
.vbtn:hover{filter:brightness(1.04)}
.vbtn:active{transform:scale(.97)}
.vbtn.bad{background:var(--coral-soft);color:var(--coral-text)}
.vbtn.good{background:var(--lime);color:var(--on-lime)}
kbd{display:none;font:600 12px/1 var(--sans);padding:4px 7px;border-radius:6px;border:1px solid currentColor;opacity:.6}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.navrow button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:10px 6px;border-radius:10px}
.navrow button:hover{color:var(--ink)}
.navrow button[disabled]{opacity:.35;cursor:default}
@media (hover:hover) and (pointer:fine){ kbd{display:inline-block} }
@media (max-width:420px){ .vbtn{font-size:16px;gap:8px} .vbtn kbd{display:none} }
@media (min-width:640px){ .card{min-height:400px} .face{padding:28px 30px 22px} }

.done{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:36px 24px;text-align:center;box-shadow:var(--shadow)}
.done h2{font:800 clamp(30px,5vw,44px)/1.05 var(--display);letter-spacing:-.035em;margin:0 0 10px}
.done p{text-wrap:pretty;color:var(--muted);margin:0 auto 22px;max-width:44ch}
.done .pbar{max-width:420px;margin:0 auto}
.done .legend{justify-content:center;margin-bottom:26px}
.done .next{max-width:460px;margin:0 auto}
.done .big{display:block;font:800 72px/1 var(--display);letter-spacing:-.05em;margin-bottom:6px;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="logo" id="logo" aria-label="Fiszki – strona główna"><i aria-hidden="true"></i>fiszki</button>
  <button class="back hidden" id="backBtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Spis</button>
  <div class="crumb" id="crumb"></div>
  <button class="iconbtn" id="themeBtn" aria-label="Przełącz jasny / ciemny motyw">
    <svg class="i theme-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i theme-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

<script id="data" type="application/json">{"books": [{"short": "Pediatria", "title": "Badanie podmiotowe i przedmiotowe w pediatrii", "subtitle": "Streszczenia, powtórki i fiszki na podstawie podręcznika pod red. A. Obuchowicz (PZWL, wyd. 2016).", "note": "Materiał do nauki opracowany na podstawie podręcznika (wyd. 2016). Niektóre dane – zwłaszcza kalendarz szczepień – mogły się od tego czasu zmienić. Postęp nauki zapisuje się tylko w tej przeglądarce.", "chapters": [{"id": "wstep", "num": "W", "title": "Wstęp – jak podchodzić do badania dziecka", "summary": ["Pediatria (medycyna wieku rozwojowego) obejmuje okres od urodzenia do **18. roku życia**. To czas intensywnego rozwoju somatycznego, psychicznego i motorycznego, dlatego dziecko **nie jest miniaturą dorosłego**: to, co u dorosłego jest objawem choroby, u dziecka bywa cechą fizjologiczną danego wieku (i odwrotnie).", "Przykłady takich różnic to proporcje obwodu głowy i klatki piersiowej, obecność ciemiączek, inne granice serca, szybsza akcja serca, wyczuwalny brzeg wątroby pod łukiem żebrowym czy odruchy noworodkowe.", "Badanie przedmiotowe dziecka wymaga cierpliwości i często elementów zabawy. Odbywa się w ciepłym, dobrze oświetlonym pomieszczeniu, po umyciu rąk w ciepłej wodzie. Dziecko informuje się (stosownie do wieku) o kolejnych etapach badania, a przed badaniem narządów płciowych u starszego dziecka wyjaśnia się jego potrzebę i prosi o zgodę. Małe dziecko można badać na kolanach opiekuna.", "Badanie prowadzi się według stałego schematu i w tej kolejności opisuje w historii choroby, ale kolejność można dostosować do nastroju pacjenta – np. **gardło ogląda się zwykle na końcu**, bo jest to dla dzieci najmniej przyjemne. Dobrze zebrany wywiad i pełne badanie przedmiotowe są podstawą różnicowania, diagnostyki i leczenia."], "review": [{"h": "Najważniejsze zasady", "items": ["Pediatria: od urodzenia do **18. r.ż.**", "Dziecko ≠ mały dorosły – interpretuj objawy w kontekście okresu rozwojowego", "Ciepłe, jasne pomieszczenie; umyte, ciepłe ręce; spokojny głos i ruchy", "Informuj dziecko o kolejnych etapach badania; przed badaniem narządów płciowych – wyjaśnij i poproś o zgodę", "Małe dziecko – można badać na kolanach opiekuna", "Kolejność wg schematu, ale elastycznie; **gardło na końcu**", "Motto prof. Jana Bogdanowicza: pediatra powinien lubić każde dziecko"]}], "cards": [{"q": "Jaki przedział wieku obejmuje pediatria?", "a": "Od urodzenia do **18. roku życia** (medycyna wieku rozwojowego)."}, {"q": "Dlaczego nie wolno traktować dziecka jak „miniatury dorosłego” podczas badania?", "a": "Bo cechy fizjologiczne danego okresu rozwojowego (np. ciemiączka, inne granice serca, szybsze tętno, wyczuwalny brzeg wątroby, odruchy noworodkowe) można błędnie uznać za objawy choroby – i odwrotnie."}, {"q": "W jakich warunkach powinno odbywać się badanie przedmiotowe dziecka?", "a": "W nagrzanym, dobrze oświetlonym pomieszczeniu, po umyciu rąk przez badającego w ciepłej wodzie; spokojny głos i spokojne ruchy."}, {"q": "Który element badania zwykle wykonuje się na końcu i dlaczego?", "a": "**Badanie gardła** – jest nieprzyjemne dla większości dzieci, więc zostawia się je na koniec, żeby nie zniechęcić dziecka do reszty badania."}, {"q": "Jak postąpić przed badaniem narządów moczowo-płciowych u starszego dziecka?", "a": "Rzeczowo wyjaśnić konieczność badania i poprosić dziecko o zgodę."}, {"q": "Jak można zbadać małe dziecko, które silnie reaguje na kontakt z lekarzem?", "a": "Częściowo **na kolanach opiekuna** (np. osłuchiwanie płuc, oglądanie gardła) – uspokaja to i dziecko, i matkę."}]}, {"id": "rozwoj", "num": "1", "title": "Rozwój fizyczny, motoryczny i psychiczny zdrowego dziecka", "summary": ["Rozdział porządkuje okresy rozwoju dziecka i opisuje, co jest **normą** w każdym z nich. To punkt odniesienia dla całej reszty podręcznika: bez znajomości fizjologii rozwoju nie da się poprawnie ocenić wywiadu ani badania.", "**Okresy rozwojowe.** Prenatalny dzieli się na zarodkowy (do 8. tyg.) i płodowy (od 9. tyg. do porodu). Postnatalny obejmuje okres noworodkowy (0–28. doba), niemowlęcy (do końca 1. r.ż.), poniemowlęcy (1–3 lata), przedszkolny (3–7 lat), wczesnoszkolny (przedpokwitaniowy) i pokwitaniowy.", "**Noworodek.** Donoszony (38.–42. tydz.) waży średnio 3000–3500 g (norma 2501–4500 g) i mierzy 50–52 cm. Wcześniak to dziecko urodzone przed ukończeniem 37. tygodnia. Masę urodzeniową ocenia się względem wieku ciążowego (AGA/SGA/LGA) oraz w kategoriach LBW, VLBW i ELBW. Noworodek ma dużą głowę (¼ długości ciała), ciemiączka, beczkowatą klatkę i duży brzuch. Fizjologiczne są m.in. akrocyjanoza w 1. dobie, milia, rumień toksyczny, „pocałunki aniołów”, plamy mongolskie, żółtaczka fizjologiczna, przejściowy ubytek masy ciała (do 10%) i objawy hormonalne (obrzęk gruczołów sutkowych, krwawienie z pochwy). Stan po porodzie ocenia się w skali Apgar.", "**Niemowlę.** Rośnie najszybciej w całym życiu: podwaja masę urodzeniową w 5.–6. miesiącu, a potraja ją około 12. miesiąca. Przybywa mu 23–25 cm długości i ok. 12 cm obwodu głowy. Około 3. miesiąca obwód klatki piersiowej przewyższa obwód głowy. Ciemiączko tylne zarasta do 6. tygodnia (najpóźniej do 4. miesiąca), a przednie między 9. a 18. miesiącem. Pierwsze zęby mleczne pojawiają się ok. 6. miesiąca. Kształtują się krzywizny kręgosłupa, zanikają odruchy noworodkowe i pojawiają się kolejne „kamienie milowe” ruchowe, mowy, wzroku i słuchu.", "**Okres poniemowlęcy (1–3 lata).** Wzrastanie wyraźnie zwalnia. Do 2,5 roku kompletne jest uzębienie mleczne (20 zębów). Typowa sylwetka małego dziecka to hiperlordoza, „brzuszek”, szpotawe podudzia i płaskostopie. Dziecko gwałtownie rozwija mowę (od kilku słów do zdań), przechodzi okres przekory i opanowuje kontrolę zwieraczy. Rozdział podaje sygnały nieprawidłowego rozwoju w sferze umysłowej, emocjonalnej i ruchowej w wieku 18, 24, 30 i 36 miesięcy.", "**Okres przedszkolny.** Dziecko smukleje, kształtuje się sklepienie stopy (do 5 lat), ustala się lateralizacja, to „wiek pytań” i zabaw z rówieśnikami. Moczenie nocne po 5. roku życia wymaga diagnostyki. Granice serca stają się takie jak u dorosłego. Pojawiają się niemiarowość oddechowa i niewinne szmery, a przez przerost migdałków dzieci częściej mają infekcje.", "**Okres wczesnoszkolny** jest somatycznie najbardziej stabilny: wyrzynają się zęby stałe, a rozwój dotyczy głównie myślenia (od konkretnego do słowno-logicznego). **Pokwitanie** zaczyna się u dziewcząt o 1–2 lata wcześniej niż u chłopców. U dziewcząt kolejno pojawiają się telarche, pubarche, skok wzrostowy i menarche (po której wzrost prawie się kończy). U chłopców skok wzrostowy jest późny i duży. Fizjologiczne, choć niepokojące dla pacjentów, są: asymetryczny rozwój piersi, nieregularne pierwsze miesiączki, ginekomastia pokwitaniowa (ok. 30% chłopców) i trądzik."], "review": [{"h": "Okresy rozwojowe", "items": ["Prenatalny: **zarodkowy** (do 8. tyg.) + **płodowy** (9. tyg. – poród)", "**Noworodkowy**: 0–28. doba", "**Niemowlęcy**: do końca 1. r.ż.", "**Poniemowlęcy** (wczesne dzieciństwo): 1–3 lata", "**Przedszkolny**: 3–7 lat", "**Wczesnoszkolny/przedpokwitaniowy** → **pokwitaniowy** (dojrzewanie)"]}, {"h": "Noworodek – liczby", "items": ["Donoszony: 38.–42. tydz.; wcześniak: < 37. tydz.; przenoszony: > 42. tydz.", "Masa 3000–3500 g (norma 2501–4500 g); długość 50–52 cm", "AGA: 10.–90. centyl; SGA (hipotrofia) < 10.; LGA (hipertrofia) > 90. centyla", "LBW < 2500 g; **MLBW** 1500–2499 g; **VLBW** 1000–1499 g; **ELBW** 500–999 g", "Głowa = **¼** długości ciała (dorosły ⅛); obwód głowy ok. **35 cm**, o 1–2 cm > obwód klatki", "Ciemiączko przednie 2–4 cm (romb); tylne ok. 1–1,5 cm", "Oddechy 40–60/min (tuż po porodzie 60–80); bezdech > 20 s = patologia", "HR 140–160/min tuż po porodzie (max 180); w 1. mies. 120–160", "RR ok. 60–80 / 40–60 mm Hg (nie mierzy się rutynowo)", "Temp. w odbycie ok. 37°C; termogeneza z **brunatnej tkanki tłuszczowej**", "Ubytek masy ciała: max w 3.–4. dobie, zwykle **≤ 10%**", "Mocz oddaje 93% w 24 h, 99% w 48 h"]}, {"h": "Noworodek – zjawiska fizjologiczne", "items": ["**Przedgłowie** – obrzęk nieograniczony szwami, znika w 24–48 h; vs **krwiak podokostnowy** – ograniczony szwami, utrzymuje się 6–8 tyg.", "Akrocyjanoza w 1. dobie; milia; **rumień toksyczny** (2.–3. doba, znika w ciągu tygodnia)", "„Pocałunki aniołów” (czoło, powieki) bledną w 1. r.ż.; „uszczypnięcia bociana” na karku – dłużej", "Plamy mongolskie (okolica krzyżowa) u dzieci o ciemnej karnacji", "**Żółtaczka fizjologiczna** (~60% donoszonych) – niedojrzałość glukuronizacji; postać późna od karmienia piersią (do 8.–12. tyg.)", "Niedobór czynników krzepnięcia → **witamina K** po urodzeniu", "Smółka w 1. dobie → stolce przejściowe → żółte", "Objawy hormonalne: obrzęk gruczołów sutkowych (obie płcie), krwawienie z pochwy"]}, {"h": "Skala Apgar (1., 5., 10. min)", "items": ["5 cech (0–2 pkt): **czynność serca, oddech, napięcie mięśni, odruchy, zabarwienie skóry**", "Serce: brak / < 100 / > 100 na min", "**8–10** stan dobry; **4–7** średni; **< 4** ciężki", "Leki przeciwbólowe matki mogą obniżyć wynik przy dobrym rokowaniu"]}, {"h": "Niemowlę", "items": ["Masa: ×2 w **5.–6. mies.**, ×3 ok. **12. mies.**", "Długość: +23–25 cm w 1. r.ż. (I kwartał ok. 10 cm)", "Obwód głowy: +12 cm w 1. r.ż.; od ok. **3. mies.** obwód klatki > obwód głowy", "Ciemiączko tylne zarasta do 6. tyg. (max 4. mies.); przednie **9.–18. mies.**", "Kręgosłup: lordoza szyjna 3.–4. mies.; kifoza piersiowa i lordoza lędźwiowa 9.–12. mies.", "Pierwsze zęby ok. **6. mies.** (dolne siekacze); roczne dziecko ma 6–8 zębów", "Ruch: 3 mies. kontrola głowy → 6 mies. siedzi z podparciem → 9 mies. pełza → 12 mies. chodzi na szerokiej podstawie", "Mowa: 2 mies. gruchanie → 4 mies. gaworzenie → 12 mies. pierwsze słowa", "Kamień milowy = wiek, w którym osiąga go 50% dzieci; diagnostyka po przekroczeniu średniej + 2 SD; u wcześniaków – **wiek skorygowany**"]}, {"h": "Okres poniemowlęcy (1–3 lata)", "items": ["Wzrost ok. 12 cm w 2. r.ż.; obwód głowy tylko ok. 2 cm", "Pełne uzębienie mleczne (**20 zębów**) ok. 2,5 roku", "Sylwetka: hiperlordoza, wypukły brzuch, podudzia szpotawe, płaskostopie (poduszeczka tłuszczowa)", "Oddechy ok. 26/min; częste zakażenia dróg oddechowych", "Mocz 500–600 ml/dobę; kontrola zwieraczy w 3. r.ż.", "Brak postępów mowy → najpierw podejrzewaj **niedosłuch**", "Okres przekory; koncentracja uwagi tylko kilka–kilkanaście minut – nie rozpoznawać pochopnie nadpobudliwości"]}, {"h": "Przedszkole, szkoła, pokwitanie", "items": ["Sklepienie stopy wykształcone ok. **5 lat**; koślawość kolan", "Lateralizacja; „wiek pytań”; zabawy z rówieśnikami", "Moczenie nocne **po 5. r.ż.** → diagnostyka", "Granice serca jak u dorosłego po 5. r.ż.; tętno ok. 100/min; **niemiarowość oddechowa**; niewinne szmery (np. buczenie żylne)", "Przerost migdałka gardłowego i podniebiennych → nawracające infekcje", "Wczesnoszkolny: najstabilniejszy somatycznie, wyrzynanie zębów stałych", "Pokwitanie: dziewczęta o 1–2 lata wcześniej niż chłopcy", "Dziewczęta: piersi 10–12 r.ż. → owłosienie łonowe → skok wzrostowy → **menarche 11–14 r.ż.**, po niej +4–9 cm", "Chłopcy: jądra 11–13 r.ż.; skok wzrostowy późno, do ~10 cm/rok; mutacja, zarost", "Kolejność wzrastania: stopy → podudzia i uda → kończyny górne → biodra/klatka → barki → tułów", "Fizjologiczne: asymetryczny bolesny rozwój piersi, biała wydzielina przed menarche, nieregularne miesiączki (> 2 lata → ginekolog), **ginekomastia ~30%** chłopców (1–2 lata)"]}], "cards": [{"q": "Jak dzieli się okres prenatalny?", "a": "**Stadium zarodka** – od zapłodnienia do 8. tygodnia; **faza płodowa** – od 9. tygodnia do porodu."}, {"q": "Ile trwa okres noworodkowy?", "a": "Pierwsze **28 dni** życia."}, {"q": "Kiedy noworodek jest donoszony, wcześniakiem, przenoszony?", "a": "Donoszony: 38.–42. tydz.; **wcześniak: przed ukończeniem 37. tygodnia**; przenoszony: ciąża > 42. tygodnia."}, {"q": "Jaka jest prawidłowa masa i długość ciała donoszonego noworodka?", "a": "Masa średnio 3000–3500 g (zakres 2501–4500 g); długość 50–52 cm. Chłopcy nieco więksi (ok. 300 g i 2 cm)."}, {"q": "Co oznaczają skróty AGA, SGA, LGA?", "a": "**AGA** – masa odpowiednia do wieku ciążowego (10.–90. centyl); **SGA** – za mała (< 10. centyla, hipotrofia); **LGA** – za duża (> 90. centyla, hipertrofia)."}, {"q": "Podaj progi MLBW, VLBW i ELBW.", "a": "**MLBW** 1500–2499 g; **VLBW** 1000–1499 g; **ELBW** 500–999 g."}, {"q": "Czym różni się hipotrofia asymetryczna od symetrycznej?", "a": "Asymetryczna: za mała masa, prawidłowa długość ciała. Symetryczna: zarówno masa, jak i długość ciała za małe w stosunku do wieku ciążowego."}, {"q": "Jaką część długości ciała stanowi głowa noworodka, a jaką u dorosłego?", "a": "U noworodka **¼**, u dorosłego **⅛**."}, {"q": "Jak odróżnić przedgłowie od krwiaka podokostnowego?", "a": "**Przedgłowie** – obrzęk tkanek miękkich **nieograniczony szwami**, ustępuje w 24–48 h. **Krwiak podokostnowy** – **ograniczony szwami** czaszkowymi, utrzymuje się 6–8 tygodni."}, {"q": "Jakie wymiary ma ciemiączko przednie i tylne u noworodka?", "a": "Przednie (duże): romb, przekątne 2–4 cm, miękkie, płaskie. Tylne (małe): ok. 1–1,5 cm."}, {"q": "Co mogą sugerować szerokie szwy i duże ciemiączko u noworodka?", "a": "Wrodzoną niedoczynność tarczycy, wodogłowie, wrodzoną łamliwość kości (oraz wzrost ciśnienia śródczaszkowego)."}, {"q": "Co sugeruje bardzo małe ciemiączko?", "a": "Małogłowie, przedwczesne zarastanie szwów czaszkowych; bywa też u wcześniaków."}, {"q": "Jaki jest średni obwód głowy noworodka donoszonego i jak ma się do obwodu klatki?", "a": "Ok. **35 cm** (34–36) – o 1–2 cm **większy** niż obwód klatki piersiowej."}, {"q": "Jaka jest częstość oddechów noworodka?", "a": "Tuż po porodzie 60–80/min, później **40–60/min**. Bezdechy 5–10 s fizjologiczne; > 20 s – patologia."}, {"q": "Jaka jest częstość akcji serca noworodka?", "a": "Tuż po porodzie 140–160/min (max 180); w 1. miesiącu ok. 120 (sen) – 160 (aktywność)."}, {"q": "Co jest źródłem termogenezy u noworodka?", "a": "**Brunatna tkanka tłuszczowa** (kark, okolica międzyłopatkowa, wokół nerek, wzdłuż aorty) – noradrenalina pobudza w niej lipolizę."}, {"q": "Jakie zmiany skórne u noworodka są fizjologiczne?", "a": "Akrocyjanoza w 1. dobie, **milia**, **rumień toksyczny** (2.–3. doba), „pocałunki aniołów” i „uszczypnięcia bociana”, plamy mongolskie."}, {"q": "Czym jest rumień toksyczny noworodków?", "a": "Plamisto-grudkowa wysypka u ok. połowy donoszonych noworodków, pojawia się w 2.–3. dobie, nasila się i słabnie, ustępuje w ciągu 1. tygodnia."}, {"q": "Jaka jest przyczyna żółtaczki fizjologicznej i jak często występuje?", "a": "Niedojrzałość wątroby – przejściowy niedobór glukuronylotransferazy (słaba glukuronizacja bilirubiny). Dotyczy ok. **60%** zdrowych donoszonych noworodków."}, {"q": "Dlaczego noworodkom podaje się witaminę K?", "a": "Aby zapobiec skutkom fizjologicznego niedoboru czynników krzepnięcia (II, VII, IX, X…). Dzieci karmione piersią wymagają dalszej profilaktyki; karmione mieszanką – nie."}, {"q": "Jaki jest fizjologiczny ubytek masy ciała noworodka?", "a": "Zaczyna się w 1. dobie, jest największy w **3.–4. dobie** i zwykle nie przekracza **10%** masy urodzeniowej."}, {"q": "Jakie objawy hormonalne mogą wystąpić u noworodka?", "a": "Obrzęk gruczołów sutkowych z wydzieliną (obie płcie) i krwawienie z pochwy u dziewczynek – po spadku estrogenów matczynych."}, {"q": "Wymień 5 elementów skali Apgar.", "a": "Czynność serca, oddech, napięcie mięśni, odruchy (reakcja na cewnik), zabarwienie skóry – każdy 0–2 pkt."}, {"q": "Jak interpretujemy wynik w skali Apgar?", "a": "**8–10** – stan dobry; **4–7** – średni; **poniżej 4** – ciężki."}, {"q": "Kiedy niemowlę podwaja i potraja masę urodzeniową?", "a": "Podwaja w **5.–6. miesiącu**, potraja ok. **12. miesiąca**."}, {"q": "O ile rośnie długość ciała w 1. roku życia?", "a": "O **23–25 cm** (najwięcej w I kwartale – ok. 10 cm)."}, {"q": "Kiedy obwód klatki piersiowej przewyższa obwód głowy?", "a": "Około **3. miesiąca** życia."}, {"q": "Kiedy zarastają ciemiączka?", "a": "**Tylne** – do 6. tygodnia (najpóźniej do 4. miesiąca). **Przednie** – między **9. a 18. miesiącem**."}, {"q": "Kiedy kształtują się krzywizny kręgosłupa?", "a": "Lordoza szyjna ok. 3.–4. miesiąca (unoszenie głowy); kifoza piersiowa i lordoza lędźwiowa ok. 9.–12. miesiąca (siadanie, wstawanie)."}, {"q": "Kiedy wyrzynają się pierwsze zęby mleczne i ile ma ich roczne dziecko?", "a": "Ok. **6. miesiąca** (dolne siekacze przyśrodkowe, 5.–7. mies.). Roczne dziecko ma średnio **6–8 zębów**."}, {"q": "Ile zębów mlecznych ma dziecko i kiedy uzębienie jest pełne?", "a": "**20 zębów** (4 pary siekaczy, 4 pary trzonowców, 2 pary kłów); pełne ok. **2,5 roku**."}, {"q": "Podaj podstawowe ruchowe kamienie milowe 1. roku życia.", "a": "3 mies. – kontrola głowy; 6 mies. – siedzi z podparciem; 9 mies. – pełza; 12 mies. – chodzi samodzielnie na szerokiej podstawie."}, {"q": "Jak rozwija się mowa w 1. roku życia?", "a": "2 mies. – gruchanie (samogłoski); 4 mies. – gaworzenie (sylaby ze spółgłoskami); 9 mies. – rozumie pierwsze słowa; 12 mies. – pojedyncze proste słowa."}, {"q": "Co oznacza wiek „kamienia milowego” i kiedy wymagana jest diagnostyka?", "a": "Wiek, w którym umiejętność osiąga **50%** populacji. Diagnostyki wymaga przekroczenie wieku granicznego (**średnia + 2 SD**). U wcześniaków stosuje się wiek skorygowany."}, {"q": "Jak wygląda typowa sylwetka dziecka w okresie poniemowlęcym?", "a": "Hiperlordoza lędźwiowa, wysklepiony brzuch, lekko szpotawe podudzia i płaskostopie (poduszeczka tłuszczowa na podeszwie)."}, {"q": "Co w pierwszej kolejności podejrzewać przy braku postępów mowy u 2–3-latka?", "a": "**Upośledzenie słuchu**, a dopiero w drugiej kolejności opóźnienie rozwoju psychicznego."}, {"q": "Kiedy dziecko powinno kontrolować zwieracze, a kiedy moczenie nocne wymaga diagnostyki?", "a": "Kontrola zwieraczy – w **3. roku życia**. Moczenie nocne po ukończeniu **5 lat** wymaga diagnostyki."}, {"q": "Podaj przykładowe sygnały nieprawidłowego rozwoju 24-miesięcznego dziecka.", "a": "Nie wskazuje części ciała ani przedmiotów na obrazku, nie buduje wieży z 4–6 klocków, nie łączy dwóch słów w zdanie, nie wykonuje prostych poleceń, nie biega, nie kopie piłki."}, {"q": "Podaj przykładowe sygnały nieprawidłowego rozwoju 36-miesięcznego dziecka.", "a": "Nie mówi zdaniami, nie próbuje rysować koła, nie stoi chwilę na jednej nodze, nie pedałuje na rowerku, nie załatwia samodzielnie potrzeb fizjologicznych, nie rozstaje się z matką."}, {"q": "Kiedy powinno być wykształcone sklepienie stopy?", "a": "Około **5. roku życia**."}, {"q": "Czym jest niemiarowość oddechowa?", "a": "Fizjologiczne przyspieszenie akcji serca na wdechu (i zwolnienie na wydechu) – pojawia się w wieku przedszkolnym i utrzymuje do dojrzałości."}, {"q": "Jaka jest kolejność zmian pokwitaniowych u dziewcząt?", "a": "Rozwój piersi (telarche, 10–12 r.ż.) → owłosienie łonowe → skok wzrostowy (do ok. 8 cm/rok) → **menarche** (11–14 r.ż.), po której dziewczynka rośnie jeszcze tylko 4–9 cm."}, {"q": "Czym różni się skok wzrostowy chłopców od dziewcząt?", "a": "U chłopców pojawia się **później** (po zaawansowanym rozwoju narządów płciowych) i jest **większy** – nawet ok. 10 cm/rok."}, {"q": "W jakiej kolejności rosną części ciała w czasie pokwitania?", "a": "Stopy → podudzia i uda oraz kończyny górne → biodra i klatka piersiowa → obręcz barkowa → na końcu tułów i głębokość klatki."}, {"q": "Jakie zjawiska pokwitaniowe są fizjologiczne, choć niepokoją pacjentów?", "a": "Asymetryczny, bolesny rozwój piersi; biała wydzielina z pochwy przed menarche; bolesne i nieregularne pierwsze miesiączki; **ginekomastia** u ok. 30% chłopców (ustępuje w 1–2 lata); trądzik, nadmierna potliwość."}, {"q": "Kiedy nieregularne miesiączki u nastolatki wymagają konsultacji ginekologicznej?", "a": "Gdy utrzymują się **dłużej niż 2 lata** od pierwszej miesiączki."}]}, {"id": "szczepienia", "num": "2", "title": "Szczepienia ochronne i zasady ich przeprowadzania", "summary": ["Powszechne szczepienia to najskuteczniejszy sposób zapobiegania chorobom zakaźnym. Dokładny wywiad szczepienny jest istotną częścią oceny stanu zdrowia dziecka. Rozdział wyjaśnia pojęcia potrzebne, żeby ten wywiad zebrać i zinterpretować.", "**Rodzaje uodpornienia.** Noworodek ma dość dobrze rozwiniętą odporność komórkową, a humoralna kształtuje się z czasem. Uodpornienie **czynne** polega na podaniu szczepionki. **Bierne** to podanie gotowych przeciwciał (surowice, immunoglobuliny) i daje krótkotrwałą ochronę. **Czynno-bierne** to immunoglobulina razem ze szczepionką, zwykle po narażeniu.", "**Typy szczepionek.** Żywe (atenuowane) dają szybką i trwałą odporność, często po jednej dawce: odra, świnka, różyczka, gruźlica (BCG), ospa wietrzna, doustna polio (OPV), rotawirusy. Inaktywowane są bezpieczniejsze, ale słabiej immunogenne i wymagają kilku dawek. Są też szczepionki rekombinowane (np. WZW B), podjednostkowe, polisacharydowe skoniugowane z białkiem (Hib, pneumokoki, meningokoki) i toksoidy (tężec, błonica). Szczepionki skojarzone zmniejszają liczbę wkłuć.", "**Zasady.** Kwalifikację przeprowadza lekarz najwyżej 24 h przed szczepieniem, a w punkcie szczepień musi być zestaw przeciwwstrząsowy. Cykl obejmuje szczepienie podstawowe (pierwotne + dawka uzupełniająca) i dawki przypominające. Szczepionki inaktywowane można łączyć ze sobą i z żywymi dowolnie. Dwie żywe podaje się razem albo w odstępie co najmniej 4 tygodni. Odstępów między dawkami tej samej szczepionki nie wolno skracać, można je wydłużać.", "**Przeciwwskazania** są zwykle krótkoterminowe: ostra choroba gorączkowa, zaostrzenie choroby przewlekłej, nasilona skaza krwotoczna, okres po immunoglobulinach (dla żywych). Trwałe przeciwwskazania to nadwrażliwość na składniki szczepionki i poważny NOP po poprzedniej dawce. Szczepionek żywych nie podaje się przy niedoborach odporności, AIDS (samo nosicielstwo HIV nie jest przeciwwskazaniem), nowotworach układu limforetikularnego, immunosupresji, w trakcie chemio- lub radioterapii i do 6 miesięcy po niej oraz po przeszczepach.", "**Odczyny poszczepienne** są zwykle łagodne: miejscowo zaczerwienienie, obrzęk, naciek, ból, powiększenie węzłów; ogólnie gorączka, złe samopoczucie, wysypka. **Ciężki NOP** kończy się zgonem, zagraża życiu, wymaga hospitalizacji albo powoduje trwały uszczerbek. **Poważny NOP** ma duże nasilenie, ale nie wymaga hospitalizacji. Każdy NOP lekarz zgłasza do Powiatowego Inspektora Sanitarnego.", "**Profilaktyka tężca po zranieniu** zależy od historii szczepień: przy pełnym cyklu i ostatniej dawce < 5 lat nic nie trzeba podawać, przy 5–10 latach lub niepełnym cyklu podaje się dawkę anatoksyny, a u nieszczepionych lub > 10 lat przy ranie wysokiego ryzyka stosuje się uodpornienie czynno-bierne (anatoksyna + LIT). Uwaga: kalendarz szczepień w podręczniku pochodzi z wydania z 2016 r. i od tego czasu się zmienił."], "review": [{"h": "Rodzaje uodpornienia", "items": ["**Czynne** – szczepionka (żywa, zabita, toksoid, antygeny)", "**Bierne** – gotowe przeciwciała: surowice, immunoglobuliny; ochrona krótkotrwała", "**Czynno-bierne** – immunoglobulina + szczepionka jednocześnie (po narażeniu)"]}, {"h": "Typy szczepionek", "items": ["**Żywe atenuowane**: odra, świnka, różyczka, gruźlica (BCG), ospa wietrzna, OPV (Sabin), rotawirusy – szybka, trwała odporność, często 1 dawka", "**Inaktywowane**: m.in. krztusiec, polio (IPV), KZM, WZW A – bezpieczniejsze, wymagają powtarzania", "**Rekombinowane**: WZW B, grypa", "**Podjednostkowe** – fragmenty drobnoustrojów", "**Polisacharydowe skoniugowane z białkiem**: Hib, pneumokoki, meningokoki", "**Toksoidy (anatoksyny)**: tężec, błonica, jad kiełbasiany", "Mono- / poliwalentne / **skojarzone** (kilka chorób – mniej wkłuć)"]}, {"h": "Zasady szczepień", "items": ["Kwalifikacja przez lekarza **≤ 24 h** przed szczepieniem; zestaw przeciwwstrząsowy obowiązkowy", "**Szczepienie pierwotne**: 2–3 dawki co **4–8 tyg.**", "**Dawka uzupełniająca**: 6–12 mies. po 1. dawce (pierwotne + uzupełniająca = szczepienie podstawowe)", "**Dawki przypominające** – co kilka lat", "Jednoczesne = w odstępie ≤ 24 h; nie mieszać w jednej strzykawce (chyba że producent pozwala)", "Inaktywowana + inaktywowana / żywa → **dowolnie**", "Żywa + żywa → razem lub **≥ 4 tyg.** odstępu (nie dotyczy doustnych)", "Odstępów między dawkami tej samej szczepionki **nie skracamy** (można wydłużać)", "Immunoglobuliny do 2 tyg. po szczepionce żywej → powtórzyć szczepienie po ≥ 3 mies."]}, {"h": "Przeciwwskazania", "items": ["Krótkoterminowe: ostra choroba gorączkowa; zaostrzenie choroby przewlekłej (np. tkanki łącznej, zespół nerczycowy); nasilona skaza krwotoczna (poza doustnymi); **3–11 mies.** po immunoglobulinach/preparatach krwi (dla żywych)", "**Trwałe**: udowodniona nadwrażliwość na składniki szczepionki; poważny NOP po poprzedniej dawce", "Dla **żywych**: niedobory odporności, AIDS (**HIV+ bez AIDS – nie** jest przeciwwskazaniem), nowotwory układu limforetikularnego, duże dawki immunosupresji, chemio-/radioterapia + 6 mies. po niej, przeszczepy"]}, {"h": "Odczyny i NOP", "items": ["Miejscowe: zaczerwienienie, obrzęk, naciek, bolesność, powiększenie węzłów", "Ogólne: gorączka, osłabienie, bóle głowy i mięśni, wysypka (pokrzywkowa), świąd", "Patologiczne reakcje: anafilaksja; encefalopatia, nieustanny płacz (krzyk mózgowy), drgawki, **zespół hipotoniczno-hiporeaktywny** (krztusiec); zapalenie mózgu (krztusiec, odra); zapalenie stawów (różyczka); **plamica małopłytkowa** (odra); porażenia wiotkie (OPV); **wgłobienie jelit** (rotawirusy)", "**Ciężki NOP**: zgon / zagrożenie życia / hospitalizacja / trwały uszczerbek", "**Poważny NOP**: duże nasilenie, bez hospitalizacji", "Zgłoszenie → **Powiatowy Inspektor Sanitarny**"]}, {"h": "Kalendarz (wg wydania 2016)", "items": ["Obowiązkowe (0–19 lat): WZW B, gruźlica, błonica, tężec, krztusiec, polio, odra, świnka, różyczka; Hib, ospa i pneumokoki – w wybranych grupach", "Zalecane: WZW A, grypa, meningokoki, pneumokoki, rotawirusy, ospa, KZM, HPV", "⚠️ Aktualny kalendarz zmienia się co roku – sprawdzaj bieżący PSO"]}, {"h": "Tężec po zranieniu", "items": ["Pełne szczepienie, ostatnia dawka **< 5 lat** → nic nie podajemy", "Niepełne szczepienie lub **5–10 lat** od szczepienia → **0,5 ml anatoksyny**", "Nieszczepieni / brak dokumentacji / **> 10 lat** i duże ryzyko → **czynno-bierne**: anatoksyna + 250–500 j.m. **LIT** (lub 3000 j.m. surowicy końskiej) w drugą kończynę", "Antytoksyna też przy rozległych, zakażonych ranach, immunosupresji, wyniszczeniu, wstrząsie"]}], "cards": [{"q": "Czym różni się uodpornienie czynne, bierne i czynno-bierne?", "a": "**Czynne** – podanie szczepionki (organizm sam wytwarza przeciwciała). **Bierne** – podanie gotowych przeciwciał (surowica, immunoglobulina), ochrona krótkotrwała. **Czynno-bierne** – immunoglobulina razem ze szczepionką, zwykle po narażeniu."}, {"q": "Jaką odporność ma już dobrze rozwiniętą noworodek?", "a": "Odporność **komórkową**; humoralna i mechanizmy nieswoiste kształtują się z czasem, po kontakcie z antygenami."}, {"q": "Wymień szczepionki żywe (atenuowane).", "a": "Przeciw odrze, śwince, różyczce, gruźlicy (BCG), ospie wietrznej, doustna przeciw polio (OPV – Sabin/Koprowski), przeciw rotawirusom."}, {"q": "Jakie są cechy szczepionek żywych?", "a": "Szybsze wytwarzanie przeciwciał i trwalsza odporność; zwykle wystarcza **jedna dawka** dla kilkuletniej odporności."}, {"q": "Jakie są cechy szczepionek inaktywowanych?", "a": "Bezpieczniejsze (zwłaszcza przy zaburzeniach odporności), ale **słabiej immunogenne** – wymagają kilku dawek i przypominania."}, {"q": "Czym są toksoidy i jakie szczepionki do nich należą?", "a": "Anatoksyny – mają właściwości antygenowe toksyny, ale nie są szkodliwe. Np. szczepionki przeciw **tężcowi, błonicy**, jadowi kiełbasianemu."}, {"q": "Które szczepionki są polisacharydowe skoniugowane z białkiem?", "a": "Przeciw **Haemophilus influenzae typu b**, **pneumokokom** i **meningokokom**."}, {"q": "Czym jest szczepionka skojarzona?", "a": "Uodparnia przeciw kilku drobnoustrojom wywołującym różne choroby – pozwala uniknąć wielu wkłuć i wydłużania kalendarza."}, {"q": "Kiedy należy przeprowadzić kwalifikację do szczepienia?", "a": "Każdorazowo, przez przeszkolonego lekarza, **nie wcześniej niż 24 h** przed szczepieniem."}, {"q": "Co obejmuje szczepienie podstawowe?", "a": "**Szczepienie pierwotne** (2–3 dawki co 4–8 tyg.) + **dawkę uzupełniającą** (6–12 mies. po pierwszej dawce). Później – dawki przypominające co kilka lat."}, {"q": "Jakie odstępy obowiązują między dwiema szczepionkami żywymi?", "a": "Podaje się je **jednocześnie** albo w odstępie **co najmniej 4 tygodni** (nie dotyczy doustnych szczepionek żywych)."}, {"q": "Jak można łączyć szczepionki inaktywowane z innymi?", "a": "Inaktywowane z inaktywowanymi oraz inaktywowane z żywymi – **jednocześnie lub w dowolnych odstępach**."}, {"q": "Czy można skracać odstępy między dawkami tej samej szczepionki?", "a": "**Nie** – można je jedynie wydłużać."}, {"q": "Co zrobić, gdy w ciągu 2 tyg. po szczepionce żywej podano immunoglobuliny?", "a": "Szczepienie trzeba **powtórzyć** po co najmniej **3 miesiącach** od podania immunoglobulin."}, {"q": "Wymień przeciwwskazania krótkoterminowe do szczepień.", "a": "Ostra choroba gorączkowa; zaostrzenie choroby przewlekłej; nasilona skaza krwotoczna (poza szczepionkami doustnymi); 3–11 mies. po dużych dawkach immunoglobulin lub preparatów krwi (dla szczepionek żywych)."}, {"q": "Co jest trwałym przeciwwskazaniem do szczepienia?", "a": "Udowodniona **nadwrażliwość na składniki szczepionki** oraz **poważny niepożądany odczyn** po poprzedniej dawce."}, {"q": "Kiedy nie podaje się szczepionek żywych?", "a": "Wrodzone i nabyte niedobory odporności, AIDS, nowotwory układu limforetikularnego, duże dawki immunosupresji, chemio-/radioterapia i 6 mies. po niej, immunosupresja po przeszczepach."}, {"q": "Czy nosicielstwo HIV jest przeciwwskazaniem do szczepień?", "a": "**Nie** – przeciwwskazaniem (do szczepionek żywych) jest AIDS, a nie samo nosicielstwo HIV."}, {"q": "Jakie są typowe miejscowe odczyny poszczepienne?", "a": "Zaczerwienienie, obrzęk, naciek, bolesność w miejscu wkłucia, powiększenie okolicznych węzłów chłonnych."}, {"q": "Który NOP wiąże się ze szczepionką przeciw rotawirusom?", "a": "**Wgłobienie jelit**."}, {"q": "Jakie NOP mogą wystąpić po szczepieniu przeciw krztuścowi?", "a": "Encefalopatia, nieustanny płacz (krzyk mózgowy), drgawki, **zespół hipotoniczno-hiporeaktywny**, zapalenie mózgu."}, {"q": "Jaki NOP wiąże się ze szczepieniem przeciw odrze, a jaki przeciw różyczce?", "a": "Odra – **plamica małopłytkowa** (i zapalenie mózgu). Różyczka – **przewlekłe zapalenie stawów**."}, {"q": "Czym różni się ciężki od poważnego NOP?", "a": "**Ciężki** – zgon, zagrożenie życia, hospitalizacja lub trwały uszczerbek. **Poważny** – reakcja o dużym nasileniu, ale bez potrzeby hospitalizacji."}, {"q": "Komu zgłasza się niepożądany odczyn poszczepienny?", "a": "**Powiatowemu Inspektorowi Sanitarnemu** (na specjalnym formularzu)."}, {"q": "Profilaktyka tężca: dziecko w pełni zaszczepione, ostatnia dawka 3 lata temu. Co podać?", "a": "**Nic** – odporność pełna, gdy od ostatniej dawki minęło < 5 lat."}, {"q": "Profilaktyka tężca: ostatnia dawka 7 lat temu lub szczepienie niepełne. Co podać?", "a": "**0,5 ml anatoksyny tężcowej** (dawka przypominająca)."}, {"q": "Kiedy stosuje się uodpornienie czynno-bierne przeciw tężcowi i na czym polega?", "a": "U nieszczepionych/bez dokumentacji oraz gdy od szczepienia minęło > 10 lat przy dużym ryzyku. Anatoksyna + w drugą kończynę **250–500 j.m. LIT** (ludzkiej immunoglobuliny przeciwtężcowej) lub 3000 j.m. surowicy końskiej."}]}, {"id": "wywiad", "num": "3", "title": "Badanie podmiotowe – wywiad", "summary": ["Wywiad to podstawa ukierunkowania diagnostyki i często sam prowadzi do rozpoznania. W pediatrii zbiera się go zwykle **od rodziców lub opiekunów**, a nie bezpośrednio od pacjenta. Odnotowujemy więc, kto jest rozmówcą (matka, babcia, wychowawca), bo od tego zależy wiarygodność danych.", "**Część formalna.** Obejmuje dane dziecka i opiekunów, telefon kontaktowy oraz to, kto ma władzę rodzicielską (pełną, ograniczoną czy żadną). Przy przyjęciu do szpitala notuje się datę, godzinę i tryb oraz pisemną zgodę rodziców. Po ukończeniu **16. roku życia** zgodę wyraża równolegle także pacjent. Nakłucie lędźwiowe, przetoczenie krwi, znieczulenie ogólne i badania inwazyjne wymagają **oddzielnej** zgody.", "**Schemat wywiadu (9 punktów):** 1) rodzina, 2) ciąża, 3) poród, 4) dotychczasowy rozwój, 5) żywienie, 6) szczepienia, 7) warunki bytowe, 8) choroby przebyte, 9) choroba obecna. Taka kolejność pozwala prześledzić rozwój dziecka na tle rodziny i środowiska.", "W **rodzinie** pytamy o zdrowie rodzeństwa i domowników, choroby dziedziczne i społeczne, podobne cechy u krewnych, kontakt z chorobami zakaźnymi w ostatnich **3 tygodniach** i kontakt ze zwierzętami. Przy **ciąży** pytamy, z której jest kolejno, o jej przebieg, choroby i leki matki (z miesiącem ciąży), pracę, palenie i wyniki poprzednich ciąż. Przy **porodzie** pytamy o tydzień, sposób (siłami natury czy cięcie i z jakiego powodu), punktację Apgar, wady, masę, długość i obwody.", "**Rozwój** omawia się osobno w sferze psychicznej, motorycznej i somatycznej, z orientacyjnymi wiekami kamieni milowych. U starszych dzieci pytamy o przedszkole, szkołę i relacje z rówieśnikami. **Żywienie** obejmuje czas karmienia piersią, mieszanki, rozszerzanie diety, diety eliminacyjne oraz suplementację witamin D i K. Pytamy też o **szczepienia** z dokumentacją i NOP, **warunki bytowe** (mieszkanie, liczba osób, sytuacja materialna, która decyduje m.in. o możliwości kupienia leków) i **choroby przebyte** chronologicznie: hospitalizacje, nawroty, leki, alergie, choroby zakaźne.", "**Choroba obecna** to najważniejszy punkt. Ustalamy, od kiedy dziecko choruje, jaki był początek (nagły czy stopniowy) i pierwsze objawy, co robili rodzice, jakie było wcześniejsze rozpoznanie i leczenie oraz dalszy przebieg. Pytamy też, czy podobne objawy były wcześniej i czy dziecko jest teraz pod wpływem leków, które mogą zniekształcić obraz choroby. Każdy objaw charakteryzujemy: charakter (przewlekły, nawrotowy, napadowy), okoliczności, lokalizację, czas trwania, sposób ustępowania i objawy towarzyszące.", "Rozdział omawia pytania przy częstych dolegliwościach: bólu głowy, bólu brzucha, zaburzeniach stolca, kaszlu, małym przyroście masy ciała i **gorączce**. Gorączka jest najczęstszym powodem wizyty. Ważne jest, czy temperaturę zmierzono, czy tylko oceniono dotykiem. Drgawki gorączkowe występują typowo między **6. miesiącem a 5. rokiem życia**, ale gorączka z drgawkami w każdym wieku nakazuje podejrzewać **zakażenie OUN**."], "review": [{"h": "Część formalna", "items": ["Dane dziecka, opiekunów, telefon; **władza rodzicielska** (pełna/ograniczona/brak)", "Szpital: data, godzina, tryb przyjęcia (nagły/planowy) + pisemna zgoda", "Od **16. r.ż.** – zgoda równoległa pacjenta", "Osobna zgoda: **nakłucie lędźwiowe**, przetoczenie krwi, znieczulenie ogólne, badania inwazyjne", "Zapisz, **kto udziela wywiadu**"]}, {"h": "9 punktów wywiadu", "items": ["1. Rodzina  2. Ciąża  3. Poród", "4. Dotychczasowy rozwój  5. Żywienie  6. Szczepienia", "7. Warunki bytowe  8. Choroby przebyte  9. **Choroba obecna**"]}, {"h": "Rodzina, ciąża, poród", "items": ["Rodzina: rodzeństwo, domownicy, choroby dziedziczne (alergie, cukrzyca, psychiczne) i społeczne (gruźlica, alkoholizm, narkomania)", "Kontakt z chorobami zakaźnymi w ostatnich **3 tygodniach**; kontakt ze zwierzętami", "Ciąża: która z kolei, przebieg, choroby i **leki** matki (z miesiącem ciąży), praca, palenie, zwierzęta, poprzednie ciąże/poronienia", "Poród: tydzień, siłami natury / cięcie (wskazanie), **Apgar**, wady, masa (norma 2501–4500 g), długość (48–52 cm), obwody – źródło: Książeczka zdrowia dziecka"]}, {"h": "Rozwój – pytania (wiek typowy)", "items": ["Psychiczny: uśmiech **3. mies.**, gaworzenie **4. mies.**, pierwsze słowa **9. mies.**, proste zdania **20. mies.**", "Motoryczny: unosi głowę **3. mies.**, siada **6.–7. mies.**, wstaje **9. mies.**, chodzi **12. mies.**", "Somatyczny: pierwsze zęby **6. mies.**; przyrost ok. **700 g/mies.** przez 5 mies., potem **500 g/mies.**; ×3 masa w 12. mies.", "Starsze dzieci: zabawa, rówieśnicy, szkoła (trudności, odroczenie, powtarzanie klasy, typ szkoły)"]}, {"h": "Żywienie, szczepienia, warunki, choroby przebyte", "items": ["Karmienie wyłącznie piersią – do kiedy; mieszane; sztuczne (jaka mieszanka / mleko krowie)", "Kiedy wprowadzono soki, zupy, mięso, żółtko, twaróg, **gluten**", "Diety eliminacyjne: przyczyna, czas, efekt", "Suplementacja **witaminy D** (preparat, dawka) i **witaminy K** (niemowlęta karmione piersią do 3. mies.)", "Szczepienia – z dokumentacji (karta, książeczka) + NOP", "Warunki: mieszkanie (izby, wilgoć, ogrzewanie), liczba osób, sytuacja materialna", "Choroby przebyte chronologicznie: okres noworodkowy, hospitalizacje (wiek, rozpoznania), nawroty, leki, **uczulenia**, choroby zakaźne"]}, {"h": "Choroba obecna", "items": ["Od kiedy? Początek **ostry czy stopniowy**? Pierwsze objawy?", "Co zrobili rodzice (leki, lekarz, SOR)? Wcześniejsze rozpoznanie i leczenie, efekt", "Dalszy przebieg, nowe objawy; czy podobne objawy były wcześniej", "Czy dziecko jest **teraz pod wpływem leków** (przeciwgorączkowe, przeciwbólowe, uspokajające) – zniekształcają obraz", "Każdy objaw: charakter, okoliczności, lokalizacja, czas trwania, ustępowanie, objawy towarzyszące"]}, {"h": "Częste dolegliwości", "items": ["Ból głowy + zaburzenia świadomości/widzenia, wymioty, gorączka, zaburzenia równowagi, niedrożność nosa, ból ucha", "Ból brzucha + łaknienie, nudności, wymioty, zgaga, wzdęcia, stolec, mocz, moczenie, gorączka", "Stolec: częstość, konsystencja, barwa, ilość, **śluz/krew**, nietrzymanie", "Kaszel (suchy/wilgotny) + duszność, chrypka, plwocina, ból w klatce, gorączka", "Mały przyrost masy: łaknienie, wymioty, stolce, infekcje; u starszych – celowe ograniczanie jedzenia, prowokowanie wymiotów", "Gorączka: **mierzona czy „na dotyk”**, max, wahania dobowe, sposoby obniżania, leki", "Drgawki gorączkowe: **6 mies. – 5 lat**; gorączka + drgawki → zawsze myśl o **zakażeniu OUN**"]}], "cards": [{"q": "Co jest swoistą cechą wywiadu pediatrycznego?", "a": "Zbiera się go zwykle **od rodziców/opiekunów**, a nie bezpośrednio od dziecka – dlatego trzeba zapisać, kto udziela informacji (wpływa to na ich wiarygodność)."}, {"q": "Od jakiego wieku pacjent wyraża równoległą pisemną zgodę na hospitalizację?", "a": "Od ukończenia **16. roku życia**."}, {"q": "Na jakie procedury wymagana jest oddzielna zgoda?", "a": "**Nakłucie lędźwiowe**, przetoczenie krwi i preparatów krwiopochodnych, badania w znieczuleniu ogólnym i inne badania inwazyjne."}, {"q": "Wymień 9 punktów wywiadu pediatrycznego w kolejności.", "a": "1. Rodzina 2. Ciąża 3. Poród 4. Dotychczasowy rozwój 5. Żywienie 6. Szczepienia ochronne 7. Warunki bytowe 8. Choroby przebyte 9. Choroba obecna."}, {"q": "Za jaki okres pytamy o kontakt dziecka z chorobami zakaźnymi?", "a": "Za ostatnie **3 tygodnie** – w rodzinie i w innych środowiskach dziecka."}, {"q": "O co pytamy w wywiadzie dotyczącym ciąży?", "a": "Która to ciąża; przebieg i powikłania (z miesiącem); choroby i leki matki (też OTC i suplementy, z miesiącem ciąży); praca, palenie, kontakt ze zwierzętami; przebieg poprzednich ciąż (porody/poronienia)."}, {"q": "O co pytamy w wywiadzie dotyczącym porodu?", "a": "Tydzień ciąży; poród siłami natury czy cięcie (i wskazanie); stan po urodzeniu – **Apgar**, wady wrodzone; masa i długość urodzeniowa, obwody głowy i klatki."}, {"q": "Jaka jest prawidłowa urodzeniowa masa i długość ciała wg rozdziału o wywiadzie?", "a": "Masa **2501–4500 g** (≤ 2500 g – mała urodzeniowa masa ciała); długość ok. **48–52 cm**."}, {"q": "W jakim wieku typowo dziecko zaczyna się uśmiechać, gaworzyć, mówić pierwsze słowa i zdania (wg wywiadu)?", "a": "Uśmiech – **3. mies.**; gaworzenie – **4. mies.**; pierwsze słowa – **9. mies.**; proste zdania – **20. mies.**"}, {"q": "W jakim wieku typowo dziecko unosi głowę, siada, wstaje i chodzi?", "a": "Unosi głowę – **3. mies.**; siada – **6.–7. mies.**; wstaje – **9. mies.**; chodzi – **12. mies.**"}, {"q": "Jaki jest typowy przyrost masy ciała niemowlęcia (wg wywiadu)?", "a": "Ok. **700 g/mies.** przez pierwsze 5 miesięcy, potem ok. **500 g/mies.**; do 12. miesiąca masa urodzeniowa się **potraja**."}, {"q": "O co pytamy w wywiadzie żywieniowym niemowlęcia?", "a": "Jak długo wyłącznie piersią; karmienie mieszane i sztuczne (jaka mieszanka/mleko krowie); kiedy wprowadzono produkty uzupełniające i **gluten**; diety eliminacyjne; aktualna liczba i objętość posiłków; suplementacja **witamin D i K**."}, {"q": "Komu i do kiedy wymaga się suplementacji witaminy K (pytanie w wywiadzie)?", "a": "Niemowlętom **karmionym piersią do 3. miesiąca** życia."}, {"q": "Po co pytamy o warunki bytowe?", "a": "Wpływały na zdrowie dziecka i określają warunki, do których wróci po leczeniu – np. możliwość zakupu leków, przestrzegania diety, zmiany klimatu."}, {"q": "Jak zbieramy wywiad o chorobach przebytych?", "a": "Chronologicznie od okresu noworodkowego: hospitalizacje (wiek, rozpoznania z kart wypisowych), leczenie ambulatoryjne, częstość nawrotów, leki z ostatnich miesięcy, **objawy uboczne i uczulenia**, alergie, przebyte choroby zakaźne."}, {"q": "Jakie pytania zadajemy w wywiadzie o chorobie obecnej?", "a": "Od kiedy; początek ostry czy stopniowy; pierwsze objawy; postępowanie rodziców; wcześniejsze rozpoznanie i leczenie oraz efekt; dalszy przebieg; czy podobne objawy były wcześniej; czy dziecko jest teraz pod wpływem leków."}, {"q": "Dlaczego pytamy, czy dziecko jest aktualnie pod wpływem leków?", "a": "Leki przeciwgorączkowe, przeciwbólowe czy uspokajające **zniekształcają obraz choroby** i mogą prowadzić do błędów diagnostycznych."}, {"q": "Jakie cechy każdego objawu należy ustalić?", "a": "Charakter (przewlekły, nawrotowy, napadowy), okoliczności/porę występowania, lokalizację, czas trwania, sposób ustępowania (nagle, stopniowo, po leku), zachowanie dziecka i objawy towarzyszące."}, {"q": "Co trzeba określić przy zaburzeniach oddawania stolca?", "a": "Częstość wypróżnień, konsystencję, zabarwienie, ilość, obecność **śluzu i/lub krwi**, nietrzymanie kału."}, {"q": "Jakie objawy mogą towarzyszyć kaszlowi?", "a": "Duszność stała lub okresowa, niedrożność nosa, wymioty, ból w klatce piersiowej, chrypka, odkrztuszanie plwociny, gorączka."}, {"q": "Co ustalamy w wywiadzie dotyczącym gorączki?", "a": "Czy temperatura była **mierzona**, czy oceniana dotykiem; wartość maksymalna; wahania dobowe; metody obniżania (kąpiel, leki) oraz liczba i rodzaj leków przeciwgorączkowych."}, {"q": "W jakim wieku występują typowo drgawki gorączkowe?", "a": "Od **6. miesiąca do 5. roku** życia."}, {"q": "Co powinno zawsze budzić współwystępowanie gorączki i drgawek?", "a": "Podejrzenie **zakażenia OUN** (zapalenie opon mózgowo-rdzeniowych, zapalenie mózgu) – w każdym wieku, mimo możliwości drgawek gorączkowych."}]}, {"id": "stan-ogolny", "num": "4.1", "title": "Badanie przedmiotowe: stan ogólny, odżywienie, skóra, węzły chłonne", "summary": ["Podstawowe metody badania to **oglądanie, obmacywanie (palpacja), opukiwanie i osłuchiwanie**, stosowane w tej kolejności. Wyjątkiem jest **brzuch**, który osłuchuje się przed palpacją. Kolejność można zmienić ze względu na stan dziecka, ale nie kosztem dokładności. Jeśli badanie jest rozłożone w czasie, zapisuje się godziny jego części, bo historia choroby jest podstawowym dokumentem stanu pacjenta i jakości pracy lekarza.", "**Stan ogólny** określamy jako dobry, średni, średnio ciężki, ciężki lub bardzo ciężki. Składają się na niego: świadomość, ułożenie ciała, sposób poruszania się, kontakt z otoczeniem, zgodność rozwoju z wiekiem i wrażenie choroby. **Ilościowe zaburzenia świadomości** pogłębiają się w kolejności: przymglenie → senność patologiczna → stan przedśpiączkowy → śpiączka. Najczęstsze przyczyny u dzieci to zatrucia, urazy głowy, zaburzenia metaboliczne, niewydolność oddechowa lub krążeniowa i stan po napadzie padaczkowym. **Omdlenie** (zwykle nastolatki, wazowagalne lub ortostatyczne) wymaga wykluczenia przyczyny kardiologicznej.", "**Ułożenie** może być dowolne lub przymusowe: opistotonus przy zapaleniu opon, orthopnoë przy duszności. Ograniczona ruchliwość leżącego dziecka świadczy o złym stanie. **Chód** może być utykający (np. zwichnięcie bioder), koszący (porażenie połowicze), marynarski (ataksja móżdżkowa) lub brodzący (porażenie nerwu strzałkowego). Chód na szerokiej podstawie jest normą do 2. roku życia. Oceniamy też symetrię ruchów, ruchy mimowolne i współruchy.", "**Budowa ciała i odżywienie.** Proporcje ciała zmieniają się z wiekiem, a obwody głowy i klatki wyrównują się około 12. miesiąca. Tkanka tłuszczowa przesuwa się z rozmieszczenia obwodowego na centralne. Masę i wysokość ocenia się na **siatkach centylowych**: WHO dla 0–5 lat i IP-CZD dla 5–18 lat. Szeroka norma to 10.–90. centyl, a patologia to < 3. i > 97. centyla (WHO) lub < 5. i > 95. centyla (IP-CZD), ewentualnie rozbieżność masy i wzrostu większa niż 2 kanały. Według **BMI** niedobór masy to < 5. centyla, nadwaga 85.–95., otyłość > 95. Stan odżywienia ocenia też **wskaźnik Cole'a**. U otyłego dziecka szuka się cech otyłości wtórnej.", "**Skóra.** Ocenia się zabarwienie, wykwity, elastyczność, ciepłotę, wilgotność, powierzchnię, przydatki i obrzęki. Ważne rozróżnienia to sinica **centralna**, w której język i śluzówki są sine, w odróżnieniu od **obwodowej**, oraz żółtaczka w odróżnieniu od hiperkarotenemii (przy tej twardówki nie są żółte). Żółtaczka zielonkawa ze świądem wskazuje na cholestazę. Wykwity dzieli się na pierwotne i wtórne. Opisuje się też ich typowe rozmieszczenie (półpasiec, odra, plamica Schönleina–Henocha, AZS) oraz podbiegnięcia krwawe, które mogą wskazywać na maltretowanie lub posocznicę. **Fałd stojący** najczęściej oznacza odwodnienie. Rozdział omawia także zmiany owłosienia i paznokci oraz obrzęki: miejscowe i uogólnione (najczęściej zespół nerczycowy, niewydolność nerek, niewydolność serca).", "**Węzły chłonne** ocenia się pod kątem lokalizacji, liczby, wielkości, przesuwalności, bolesności, konsystencji i zmian skóry. U noworodka węzły są niewyczuwalne. Do 3 lat mają ≤ 3 mm, a do 12 lat często < 1 cm (podżuchwowe, szyjne, pachowe, pachwinowe). Wyczuwalne węzły **przeduszne, zauszne, nadobojczykowe i podobojczykowe** są zawsze patologiczne. **Izolowane powiększenie nadobojczykowe** oznacza poważną chorobę (ziarnica, chłoniak, przerzuty). Bolesność przemawia za zapaleniem, a twardość, niebolesność i zrastanie się w pakiety za nowotworem."], "review": [{"h": "Metody i kolejność", "items": ["Oglądanie → obmacywanie → opukiwanie → osłuchiwanie", "Wyjątek: **brzuch** – osłuchiwanie **przed** palpacją", "Stan ogólny: dobry / średni / średnio ciężki / ciężki / bardzo ciężki"]}, {"h": "Świadomość", "items": ["**Przymglenie** – spowolnienie myślenia, kontakt słowny zachowany, odpowiedzi z opóźnieniem", "**Senność patologiczna** – stale zasypia, budzi się na silne bodźce, kontakt ograniczony do kilku słów, połykanie i żucie zachowane", "**Stan przedśpiączkowy** – brak kontaktu słownego, na silne bodźce grymas/jęk, połykanie i żucie zniesione", "**Śpiączka** – brak reakcji na ból, zniesione odruchy, bezwiedne oddawanie moczu i stolca", "Przyczyny: zatrucia (CO, alkohol, leki, „dopalacze”), uraz głowy, zaburzenia metaboliczne, niewydolność oddechowa/krążeniowa, stan po napadzie", "Jakościowe: majaczenie (delirium), pomroczność, splątanie (amentia)", "Omdlenie – zwykle nastolatki (częściej dziewczęta); wyklucz przyczynę **kardiologiczną**"]}, {"h": "Ułożenie, chód, ruchy", "items": ["Noworodek – ułożenie zgięciowe (jak płód)", "Przymusowe: **opistotonus** (zapalenie opon), **orthopnoë** (duszność)", "Chód utykający – zwichnięcie bioder, skrócenie/ból kończyny", "**Koszący** – porażenie połowicze; **marynarski** – ataksja móżdżkowa; **brodzący (koguci)** – porażenie n. strzałkowego wspólnego", "Szeroka podstawa – norma do **2. r.ż.**", "Ruchy mimowolne: tiki, mioklonie, drżenia, pląsawica, atetoza; współruchy nasilone (pozapiramidowe) / zniesione (niedowład połowiczy); „ruchy zwierciadlane”"]}, {"h": "Odżywienie – liczby", "items": ["Siatki: **WHO 0–5 lat**, **IP-CZD 5–18 lat**", "Szeroka norma: **10.–90. centyl**", "Patologia: WHO < 3. / > 97.; IP-CZD < 5. / > 95. centyla; różnica > **2 kanałów** masa vs wzrost", "**BMI** = masa [kg] / wzrost² [m]: < 5. centyla niedobór; **85.–95.** nadwaga; **> 95.** otyłość", "**Wskaźnik Cole'a**: > 110% nadmierne; 90–110% norma; 85–90% nieznaczne niedożywienie; 75–85% niedożywienie; < 75% wyniszczenie", "Głowa niemowlęcia ¼–⅕ długości ciała; obwód głowy = obwód klatki ok. **12. mies.**", "Otyłość wtórna – niskorosłość, dysmorfia, upośledzenie umysłowe, hipotonia, hipogonadyzm, endokrynopatie"]}, {"h": "Skóra", "items": ["Ocena: zabarwienie, wykwity, elastyczność, ciepłota, wilgotność, powierzchnia, przydatki, obrzęki", "Bladość: niedokrwistość, obrzęk śluzowaty, zimno; zaczerwienienie: gorączka, atropina, **CO**", "Żółtaczka – twardówki żółte; **hiperkarotenemia** – twardówki białe; zielonkawa + świąd = **cholestaza**; oceniaj w świetle dziennym", "Żółtaczka noworodkowa ustępuje od **obwodu** (dłonie, stopy)", "**Sinica centralna** (niedotlenienie krwi tętniczej) – sini **język i śluzówki**; **obwodowa** – policzki, ręce, stopy", "Pigmentacja: bielactwo, albinizm; wzmożona – choroba Addisona, hemosyderoza, pelagra", "Wykwity pierwotne: plama, bąbel, pęcherzyk, pęcherz, krosta, grudka, guzek, guz; wtórne: strup, nadżerka, rana, blizna, zanik", "Plamy mongolskie (80% dzieci ciemnoskórych, 10% białych) – różnicuj z podbiegnięciami; **café au lait**", "Półpasiec – wzdłuż nerwów; odra – zaczyna od policzków, szyi, za uszami; **Schönlein–Henoch** – prostowniki kończyn dolnych i pośladki", "AZS: 10–20% dzieci; kryteria **Hanifina i Rajki**; skala SCORAD", "Podbiegnięcia krwawe – myśl o **maltretowaniu**; szybko narastające ciemnoczerwone zmiany + ciężki stan = **posocznica**", "Ciepłota – grzbietem ręki, symetrycznie; suchość: niedoczynność tarczycy, niedobór wit. A, AZS, rybia łuska", "**Fałd stojący** (skóra brzucha) – najczęściej **odwodnienie**"]}, {"h": "Owłosienie, paznokcie, obrzęki", "items": ["Hirsutyzm – PCOS, guzy jajnika/nadnerczy, leki; nisko linia włosów na karku – **zespół Turnera**, Klippel–Feil", "Łysienie plackowate, **trichotillomania**; włosy słomkowe – fenyloketonuria", "Niedoczynność tarczycy – włosy szorstkie, suche; nadczynność – cienkie, jedwabiste", "**Koilonychia** (łyżeczkowate) – niedobór żelaza; leukonychia – metale ciężkie, niedożywienie; linijne wybroczyny pod płytką – **IZW**", "Obrzęki: uciskamy nad goleniami i kością krzyżową; uogólnione u dzieci – **zespół nerczycowy**, niewydolność nerek, niewydolność serca", "Obrzęki grzbietów rąk i stóp u noworodka → **zespół Turnera**"]}, {"h": "Węzły chłonne", "items": ["Oceniamy: lokalizacja, liczba, wielkość, przesuwalność, bolesność, konsystencja, skóra nad węzłami", "Noworodek – **niewyczuwalne**; do 3 lat ≤ **3 mm**; do 12 lat często < **1 cm**", "Zawsze patologiczne: **przeduszne, zauszne, nadobojczykowe, podobojczykowe**", "Potyliczne/zauszne – stan zapalny skóry głowy, kleszcz, zapalenie ucha, **różyczka**", "Szyjne – zakażenia jamy ustnej i gardła, **choroba Kawasaki**", "Nadobojczykowe izolowane – **ziarnica, chłoniak, przerzuty**, gruźlica", "Uogólnione: białaczki, chłoniaki, choroby tkanki łącznej, mononukleoza, AIDS, toksoplazmoza, choroba posurowicza", "Bolesne → zapalenie; niebolesne, twarde → nowotwór; rozmiękanie/chełbotanie → ropne, **choroba kociego pazura**, gruźlica; pakiety → ziarnica, błonica"]}], "cards": [{"q": "W jakiej kolejności stosuje się metody badania przedmiotowego i jaki jest wyjątek?", "a": "Oglądanie → obmacywanie → opukiwanie → osłuchiwanie. Wyjątek: **brzuch** – osłuchiwanie przed palpacją."}, {"q": "Jakie stopnie stanu ogólnego wyróżniamy?", "a": "Dobry, średni, średnio ciężki, ciężki, bardzo ciężki."}, {"q": "Co składa się na wrażenie ogólne?", "a": "Stan świadomości, ułożenie ciała, sposób poruszania się, kontakt z otoczeniem, zgodność rozwoju z wiekiem metrykalnym, ocena, czy dziecko sprawia wrażenie chorego."}, {"q": "Uszereguj ilościowe zaburzenia świadomości od najlżejszego.", "a": "Przymglenie → senność patologiczna → stan przedśpiączkowy → śpiączka."}, {"q": "Czym różni się senność patologiczna od stanu przedśpiączkowego?", "a": "W senności dziecko da się wybudzić silnym bodźcem, kontakt słowny ograniczony do kilku słów, **połykanie i żucie zachowane**. W stanie przedśpiączkowym brak kontaktu słownego, na silne bodźce tylko grymas/jęk, **połykanie i żucie zniesione**."}, {"q": "Jakie są najczęstsze przyczyny zaburzeń świadomości u dzieci?", "a": "Zatrucia (CO, alkohol, leki, narkotyki, „dopalacze”), urazy głowy, zaburzenia metaboliczne, niewydolność oddechowa/krążeniowa, stan po napadzie padaczkowym."}, {"q": "O czym trzeba pamiętać przy omdleniu u nastolatka?", "a": "Zwykle jest wazowagalne lub ortostatyczne (szybkie wstanie, duszne pomieszczenie, długie stanie), ale zawsze trzeba rozważyć inną przyczynę, w tym **kardiologiczną**."}, {"q": "Co to jest opistotonus i kiedy występuje?", "a": "Ułożenie przymusowe z głową odgiętą do tyłu z powodu napięcia mięśni karku – w **zapaleniu opon mózgowo-rdzeniowych**."}, {"q": "Co to jest orthopnoë?", "a": "Przymusowa pozycja siedząca z unieruchomieniem obręczy barkowej przy znacznej duszności."}, {"q": "Jaki chód występuje w porażeniu połowiczym, ataksji móżdżkowej i porażeniu nerwu strzałkowego?", "a": "Porażenie połowicze – **koszący**; ataksja móżdżkowa – **marynarski** (szeroka podstawa, chwiejny); porażenie n. strzałkowego wspólnego – **brodzący** (koguci, boćani)."}, {"q": "Do jakiego wieku chód na szerokiej podstawie jest fizjologiczny?", "a": "Do **2. roku życia**."}, {"q": "Jakich siatek centylowych używa się w Polsce?", "a": "**WHO** dla dzieci 0–5 lat i **IP-CZD** (polskie) dla 5–18 lat."}, {"q": "Jaki zakres centyli to szeroka norma, a jakie wartości są patologiczne?", "a": "Norma: **10.–90. centyl**. Patologia: < 3. lub > 97. (WHO), < 5. lub > 95. (IP-CZD), albo różnica > 2 kanałów centylowych między masą a wysokością."}, {"q": "Jak interpretujemy BMI u dzieci?", "a": "Na siatce centylowej: < 5. centyla – niedobór masy; **85.–95.** – nadwaga; **> 95.** – otyłość."}, {"q": "Jak interpretujemy wskaźnik Cole'a?", "a": "> 110% nadmierne odżywienie; 90–110% norma; 85–90% nieznaczne niedożywienie; 75–85% niedożywienie; < 75% wyniszczenie."}, {"q": "Jakie cechy u otyłego dziecka sugerują otyłość wtórną?", "a": "Niskorosłość, dysmorfia, upośledzenie umysłowe, wady narządów, zaburzenia wzroku/słuchu, hipotonia, hipogonadyzm, cechy endokrynopatii."}, {"q": "Jak odróżnić sinicę centralną od obwodowej?", "a": "Po **języku i błonie śluzowej jamy ustnej** – w sinicy centralnej są sine; w obwodowej sine są głównie policzki, ręce i stopy, a język różowy."}, {"q": "Jakie są przyczyny sinicy centralnej i obwodowej?", "a": "**Centralna**: sinicze wady serca, niewydolność krążenia, zapalenie płuc, niedodma, odma. **Obwodowa**: hipotermia, zaburzenia odpływu żylnego, niestabilność naczynioruchowa, wstrząs septyczny."}, {"q": "Jak odróżnić żółtaczkę od hiperkarotenemii?", "a": "W hiperkarotenemii skóra jest żółtopomarańczowa, ale **twardówki nie są zażółcone**."}, {"q": "Na co wskazuje zielonkawe zabarwienie skóry ze świądem?", "a": "Na **cholestazę** (wzrost bilirubiny bezpośredniej)."}, {"q": "W jakiej kolejności ustępuje żółtaczka noworodkowa?", "a": "Skóra wraca do normy najpierw na **obwodzie** – dłonie i stopy."}, {"q": "Wymień wykwity pierwotne i wtórne.", "a": "**Pierwotne**: plama, bąbel, pęcherzyk, pęcherz, krosta, grudka, guzek, guz. **Wtórne**: strup, nadżerka, rana, blizna, wyprysk, zanik skóry."}, {"q": "Gdzie typowo lokalizują się zmiany w plamicy Schönleina–Henocha?", "a": "Na **wyprostnych powierzchniach kończyn dolnych i pośladkach**."}, {"q": "Od jakiej okolicy zaczyna się wysypka w odrze?", "a": "Od policzków, bocznych powierzchni szyi i okolic zausznych."}, {"q": "Na podstawie czego rozpoznaje się AZS i jak ocenia się jego nasilenie?", "a": "Rozpoznanie – kryteria **Hanifina i Rajki**; nasilenie – skala Rajki i Langelanda lub **SCORAD**. AZS dotyczy 10–20% dzieci."}, {"q": "Jakie dwa groźne rozpoznania trzeba rozważyć przy podbiegnięciach krwawych?", "a": "**Maltretowanie dziecka** (lokalizacja/kształt) oraz **posocznicę** (szybko narastające ciemnoczerwone zmiany zatorowo-zakrzepowe przy ciężkim stanie)."}, {"q": "Jak ocenia się ciepłotę skóry?", "a": "Grzbietową powierzchnią ręki, symetrycznie, od czoła do stóp. Obwodowe części kończyn są fizjologicznie nieco chłodniejsze."}, {"q": "Co oznacza „fałd stojący”?", "a": "Fałd skóry brzucha nie rozprostowuje się od razu po zwolnieniu – zmniejszona elastyczność, najczęściej z powodu **odwodnienia**."}, {"q": "Co oznacza nisko położona linia włosów na karku?", "a": "Może wskazywać na **zespół Turnera**, zespół Klippla–Feila lub inne wady wrodzone."}, {"q": "Z czym wiąże się koilonychia?", "a": "Z **niedoborem żelaza** (paznokcie kruche, płaskie, łyżeczkowate)."}, {"q": "Jaka zmiana paznokci może występować w infekcyjnym zapaleniu wsierdzia?", "a": "**Linijne wybroczyny pod płytkami** paznokciowymi."}, {"q": "Jak bada się obrzęki i jakie są najczęstsze przyczyny obrzęków uogólnionych u dzieci?", "a": "Uciskiem palca nad goleniami i kością krzyżową (pozostaje dołek), oglądanie powiek. Najczęściej: **zespół nerczycowy**, ostra/przewlekła niewydolność nerek, zastoinowa niewydolność krążenia."}, {"q": "Co mogą sugerować obrzęki grzbietów rąk i stóp u noworodka?", "a": "**Zespół Turnera**."}, {"q": "Jakie cechy węzłów chłonnych oceniamy?", "a": "Lokalizację, liczbę, wielkość, przesuwalność (względem skóry, podłoża, siebie), bolesność, konsystencję, zmiany skóry nad węzłami."}, {"q": "Jaka jest fizjologiczna wielkość węzłów chłonnych w różnym wieku?", "a": "Noworodek – **niewyczuwalne**; do 3 lat – do **3 mm**; do 12 lat – często < **1 cm** (podżuchwowe, szyjne, pachowe, pachwinowe), jeśli pozostałe cechy prawidłowe."}, {"q": "Które wyczuwalne węzły chłonne są zawsze patologiczne?", "a": "**Przeduszne, zauszne, nadobojczykowe i podobojczykowe** – w każdym wieku."}, {"q": "Co oznacza izolowane powiększenie węzłów nadobojczykowych?", "a": "Zawsze **poważną chorobę** – najczęściej ziarnica złośliwa, chłoniak nieziarniczy, przerzuty nowotworów z jamy brzusznej/klatki; także gruźlica."}, {"q": "W jakich chorobach powiększają się węzły potyliczne i zauszne?", "a": "Stany zapalne owłosionej skóry głowy, ukąszenie kleszcza, zapalenie ucha, **różyczka**."}, {"q": "Jak bolesność i konsystencja węzłów pomaga w różnicowaniu?", "a": "Bolesność → proces **zapalny**; brak bolesności i **twardość** → nowotwór; rozmiękanie/chełbotanie → ropne zapalenie, choroba kociego pazura, gruźlica."}, {"q": "W jakich chorobach węzły tworzą pakiety?", "a": "W **ziarnicy złośliwej** i w **błonicy** (pakiety węzłów szyjnych)."}]}, {"id": "narzad-ruchu", "num": "4.2", "title": "Badanie przedmiotowe: kończyny, stawy, biodra, kręgosłup, stopy", "summary": ["Kończyny bada się oglądaniem i obmacywaniem. Oceniamy kształt, długość i proporcje. Długość kończyn dolnych orientacyjnie porównuje się u leżącego dziecka z nogami zgiętymi pod kątem prostym, bo kolano krótszego uda leży niżej. Dokładny pomiar wykonuje się **od kolca biodrowego przedniego górnego do kostki przyśrodkowej**. Różnica **≥ 1 cm** to patologiczna anizomelia.", "Rozdział wymienia wady rozwojowe kończyn (amelia, fokomelia, mikromelia, adaktylia, polidaktylia, syndaktylia) i cechy charakterystyczne: arachnodaktylia w zespole Marfana, krótkie szerokie palce w zespole Downa, skrócony IV i V palec w rzekomej niedoczynności przytarczyc, **palce pałeczkowate** przy przewlekłym niedotlenieniu tkanek (sinicze wady serca, choroby płuc, mukowiscydoza). Opisuje też objawy **krzywicy**: na czaszce (spłaszczenie i rozmiękanie potylicy, czaszka kwadratowa, opóźnione zarastanie ciemiączka i ząbkowanie), na klatce piersiowej (różaniec krzywiczy, bruzda Harrisona, klatka dzwonowata lub kurza), na miednicy i kończynach (bransolety, koślawość lub szpotawość). Rozpoznanie krzywicy wymaga badań laboratoryjnych.", "W **stawach** oceniamy symetrię i obrysy, zaczerwienienie, bolesność oraz ruchomość czynną i bierną. Jednakowe ograniczenie obu rodzajów ruchomości wskazuje na ból lub obrzęk stawu. Ograniczenie tylko ruchomości czynnej przy zachowanej biernej wskazuje na uszkodzenie ścięgien albo porażenie wiotkie.", "Szczególnie ważne jest badanie **stawów biodrowych** u noworodka i niemowlęcia: od dysplazji panewki do pełnego zwichnięcia. Szukamy pozornego skrócenia uda, asymetrii fałdów pachwinowych i pośladkowych (po stronie zwichnięcia fałd jest wyżej) oraz ograniczenia **odwodzenia** (norma 70–80°). Do 3. miesiąca bada się ostrożnie **objaw Ortolaniego** (przeskakiwania) i **Barlowa** (wyważania). Obecnie podstawą jest obowiązkowe **USG przesiewowe**. U starszego dziecka zwichnięcie objawia się skróceniem kończyny, chodem utykającym lub kaczkowatym i dodatnim **objawem Trendelenburga**.", "**Kręgosłup.** Krzywizny fizjologiczne nie są widoczne u noworodka. Kształtują się wraz z unoszeniem głowy, siadaniem i chodzeniem, a ustalają do 6.–7. roku życia. U przedszkolaka nadmierna lordoza lędźwiowa jest fizjologiczna. Pion od guzowatości potylicznej powinien przechodzić przez wyrostek kolczysty C7 i szparę międzypośladkową. Odchylenie od tej linii to **skolioza**, którą ujawnia **test Adamsa** (garb żebrowy i wał mięśniowy). Badamy ruchomość, bolesność wyrostków kolczystych, opukiwanie i **objaw szczytowy**.", "**Stopy.** Najczęstsza nieprawidłowość to płaskostopie (stopy płasko-koślawe), które do
