aleniem?", "a": "W **kwaśnym pH** większość leku (słabej zasady) jest **zjonizowana** i nie przenika przez błonę komórkową do miejsca działania."}, {"q": "W jakiej kolejności leki miejscowo znieczulające blokują włókna nerwowe?", "a": "Najpierw **cienkie włókna bólowe (C, Aδ)** i autonomiczne, potem czucie temperatury i dotyku, **na końcu włókna ruchowe**."}, {"q": "Czym różnią się estrowe i amidowe leki miejscowo znieczulające?", "a": "**Estry** (prokaina, tetrakaina, benzokaina) – rozkład przez **esterazy osoczowe**, częstsze **alergie** (PABA). **Amidy** (lidokaina, bupiwakaina, ropiwakaina) – metabolizm **wątrobowy**, alergie rzadkie."}, {"q": "Po co dodaje się adrenalinę do leków miejscowo znieczulających?", "a": "Obkurcza naczynia → **↓ wchłaniania** → **dłuższe działanie, mniejsza toksyczność ogólna**, mniejsze krwawienie w polu zabiegowym."}, {"q": "Jakie są objawy toksyczności ogólnej leków miejscowo znieczulających (LAST)?", "a": "OUN: **drętwienie wokół ust, metaliczny smak, szumy uszne**, zawroty, pobudzenie → **drgawki** → śpiączka. Serce: bradyarytmie, komorowe zaburzenia rytmu, zatrzymanie krążenia."}, {"q": "Jak leczy się LAST?", "a": "Przerwać podawanie, tlen, **benzodiazepina na drgawki**, **20% emulsja lipidowa i.v.**, RKO (z mniejszymi dawkami adrenaliny)."}, {"q": "Który lek miejscowo znieczulający jest najbardziej kardiotoksyczny?", "a": "**Bupiwakaina** (wolna dysocjacja z kanałów sodowych w sercu); ropiwakaina i lewobupiwakaina są mniej kardiotoksyczne."}, {"q": "Który lek miejscowo znieczulający wywołuje methemoglobinemię i jak ją leczyć?", "a": "**Prilokaina** (metabolit o-toluidyna) i benzokaina; leczenie – **błękit metylenowy** i.v."}, {"q": "Czym kokaina różni się od innych leków miejscowo znieczulających?", "a": "**Obkurcza naczynia** (hamuje wychwyt zwrotny noradrenaliny) – pozostałe raczej rozszerzają naczynia; działa sympatykomimetycznie i uzależnia."}], "sources": [{"t": "EMA – Bridion (sugammadeks): podsumowanie EPAR dla społeczeństwa", "u": "https://www.ema.europa.eu/documents/overview/bridion-epar-summary-public_en.pdf"}, {"t": "EMA – Agilus (dantrolen i.v.): podsumowanie planu zarządzania ryzykiem (hipertermia złośliwa, mechanizm RYR1, interakcje)", "u": "https://ema.europa.eu/en/documents/rmp-summary/agilus-epar-risk-management-plan_en.pdf"}]}, {"id": "f-szczep", "num": "F26", "title": "Szczepionki, immunoglobuliny, witaminy i biopierwiastki", "summary": ["**Szczepionki** wywołują **odporność czynną** (swoiste przeciwciała i komórki pamięci). Nie działają natychmiast, a ochrona pojawia się po kilku tygodniach. Rodzaje: **żywe atenuowane** (MMR – odra, świnka, różyczka; ospa wietrzna, BCG, rotawirusy, doustna przeciw durowi, żółta gorączka, donosowa przeciw grypie) są silnie immunogenne, ale **przeciwwskazane w ciąży i w ciężkiej immunosupresji**. **Inaktywowane i podjednostkowe** (IPV, przeciw WZW A i B, HPV, grypie i krztuścowi bezkomórkowe), **anatoksyny** (toksoid tężcowy i błoniczy), **skoniugowane polisacharydowe** (Hib, pneumokoki PCV, meningokoki; koniugacja z białkiem daje odpowiedź zależną od limfocytów T, także u niemowląt), **mRNA** i **wektorowe**. Żywe szczepionki podaje się tego samego dnia albo w odstępie co najmniej 4 tygodni. Prawdziwe przeciwwskazania to ciężka reakcja alergiczna (anafilaksja) po poprzedniej dawce lub na składnik oraz ostra choroba z gorączką (szczepienie się odracza). Łagodna infekcja nie jest przeciwwskazaniem.", "**Odporność bierna** to podanie gotowych przeciwciał: **immunoglobuliny swoiste** (przeciw tężcowi, wściekliźnie, WZW B i VZV, anty-D), **przeciwciała monoklonalne** (nirsewimab i paliwizumab przeciw RSV u niemowląt) i **antytoksyny** (np. przeciwjadowa przeciw jadowi żmii). Ochrona jest natychmiastowa, ale krótka (tygodnie–miesiące). W **profilaktyce poekspozycyjnej** łączy się często czynną i bierną immunizację: przy ranie u osoby nieuodpornionej szczepionkę przeciw tężcowi z immunoglobuliną, przy wściekliźnie szczepionkę z immunoglobuliną, a u noworodka matki HBsAg(+) szczepionkę z HBIG w ciągu 12 h. Immunoglobulinę podaje się w inne miejsce niż szczepionkę. **Immunoglobulina anty-D** zapobiega immunizacji matki Rh(−) krwinkami płodu Rh(+). Immunoglobuliny i przetoczenia krwi osłabiają odpowiedź na żywe szczepionki (MMR, ospa), dlatego obowiązują odstępy.", "**Witaminy rozpuszczalne w tłuszczach (A, D, E, K)** kumulują się w organizmie, a ich przedawkowanie jest toksyczne. Witamina **A** (retinol) odpowiada za widzenie i nabłonki. Jej niedobór powoduje kurzą ślepotę i kseroftalmię. Przedawkowanie daje nadciśnienie śródczaszkowe i hepatotoksyczność, a retinoidy (izotretynoina, acytretyna) są **silnie teratogenne**. Witamina **D** reguluje gospodarkę wapniową. Niedobór wywołuje krzywicę i osteomalację, a nadmiar **hiperkalcemię**. Profilaktykę stosuje się u niemowląt od pierwszych dni życia. Witamina **E** to antyoksydant. Witamina **K** jest kofaktorem γ-karboksylacji czynników II, VII, IX i X. Fitomenadion podaje się **noworodkom** (profilaktyka choroby krwotocznej) i przy przedawkowaniu antagonistów witaminy K.", "**Witaminy rozpuszczalne w wodzie.** **B1 (tiamina)**: jej niedobór wywołuje beri-beri i **encefalopatię Wernickego** (u alkoholików tiaminę podaje się **przed glukozą**). **B3 (niacyna)**: niedobór to pelagra (biegunka, zapalenie skóry, otępienie), a duże dawki powodują zaczerwienienie (flush) i hepatotoksyczność. **B6 (pirydoksyna)**: neuropatię wywołuje zarówno niedobór (np. podczas leczenia **izoniazydem**, dlatego się ją suplementuje), jak i nadmiar. **B9 (kwas foliowy)**: niedobór daje niedokrwistość megaloblastyczną i **wady cewy nerwowej**, dlatego kobiety planujące ciążę przyjmują 0,4 mg/dobę. Leczenie samym kwasem foliowym przy niedoborze B12 może zamaskować niedokrwistość, podczas gdy objawy neurologiczne postępują. **B12 (kobalamina)**: niedobór daje niedokrwistość megaloblastyczną i zwyrodnienie sznurów tylnych rdzenia. Przy niedokrwistości złośliwej i po resekcji żołądka podaje się ją pozajelitowo. Niedobór mogą wywołać **metformina, IPP** i N₂O. **Hydroksokobalamina** to także odtrutka w zatruciu cyjankami. **Witamina C**: jej niedobór to szkorbut, a duże dawki grożą kamicą szczawianową.", "**Biopierwiastki.** **Żelazo** podaje się doustnie (sole Fe²⁺ wchłaniają się najlepiej na czczo; witamina C zwiększa wchłanianie, a IPP, leki zobojętniające, wapń, tetracykliny i herbata je zmniejszają). Działania niepożądane: zaparcia, ciemny stolec i nudności. Żelazo dożylne (karboksymaltoza, sacharoza) stosuje się przy nietolerancji, zaburzeniach wchłaniania lub PChN. Grozi reakcjami nadwrażliwości, dlatego pacjenta obserwuje się 30 minut, a karboksymaltoza może wywołać hipofosfatemię. Ostre zatrucie żelazem (zwłaszcza u dzieci) leczy się **deferoksaminą**. **Wapń** (węglan wymaga kwaśnego środowiska, cytrynian nie) podaje się z witaminą D w osteoporozie, a glukonian wapnia dożylnie w hipokalcemii i hiperkaliemii (stabilizuje błonę kardiomiocytów). **Potas**: hipokaliemię wyrównuje się doustnie lub dożylnie we wlewie, rozcieńczonym i z ograniczoną szybkością, **nigdy w bolusie**. **Magnez** dożylnie podaje się w torsade de pointes, rzucawce i ciężkiej astmie (grozi depresja oddechu i zniesienie odruchów, antidotum to wapń). **Cynk** wspomaga gojenie (zmniejsza wchłanianie miedzi), **fluor** zapobiega próchnicy (nadmiar daje fluorozę), a **jod** (jodek potasu) stosuje się w profilaktyce u kobiet w ciąży i karmiących. Leki roślinne też wchodzą w interakcje: **ziele dziurawca** silnie indukuje CYP3A4 i P-gp (zmniejsza stężenie antykoncepcji, cyklosporyny, warfaryny i NOAC), a **miłorząb** zwiększa ryzyko krwawień.", "Uwaga do źródeł: ten rozdział opiera się na wiedzy podręcznikowej, w zakresie zgodnym z literaturą z sylabusu. Nie weryfikowałem go dodatkowo w konkretnych ChPL. Szczegóły kalendarza szczepień sprawdź w aktualnym Programie Szczepień Ochronnych."], "review": [{"h": "Rodzaje szczepionek", "items": ["**Żywe atenuowane**: MMR, ospa wietrzna, **BCG**, rotawirusy (p.o.), żółta gorączka, dur brzuszny (p.o.), donosowa przeciw grypie → **przeciwwskazane w ciąży i ciężkiej immunosupresji** (także wysokie dawki GKS, leki biologiczne)", "**Inaktywowane/podjednostkowe/rekombinowane**: IPV, WZW A, **WZW B** (HBsAg rekombinowany), HPV, grypa (inaktywowana), krztusiec bezkomórkowy, wścieklizna, półpasiec (rekombinowana)", "**Anatoksyny (toksoidy)**: tężec, błonica (DTaP, Td, Tdap)", "**Skoniugowane polisacharydowe**: Hib, **pneumokoki (PCV)**, meningokoki – koniugacja z białkiem → odpowiedź **T-zależna**, pamięć immunologiczna, skuteczne u **niemowląt < 2 lat**", "mRNA i wektorowe (COVID-19)", "Żywe szczepionki pozajelitowe: **tego samego dnia albo odstęp ≥ 4 tyg.**", "Przeciwwskazania: **anafilaksja** po poprzedniej dawce/na składnik; ostra choroba z gorączką → odroczenie; łagodna infekcja – nie przeciwwskazanie", "NOP (niepożądany odczyn poszczepienny): odczyny miejscowe, gorączka; anafilaksja – **adrenalina i.m.**, obserwacja po szczepieniu ~15 min"]}, {"h": "Odporność bierna", "items": ["Gotowe przeciwciała → **natychmiastowa, krótkotrwała** ochrona", "Immunoglobuliny swoiste: **tężcowa (TIG)**, **przeciw wściekliźnie (RIG)**, **anty-HBs (HBIG)**, VZIG, **anty-D**", "Przeciwciała monoklonalne przeciw RSV: **nirsewimab**, paliwizumab (niemowlęta)", "Profilaktyka poekspozycyjna: tężec (szczepionka ± TIG zależnie od rany i historii szczepień), wścieklizna (szczepionka + RIG), **noworodek matki HBsAg(+) – szczepionka + HBIG ≤ 12 h**", "Immunoglobulina i szczepionka – **w różne miejsca**", "**Anty-D** – matka Rh(−): ok. 28 tyg. ciąży i ≤ 72 h po porodzie dziecka Rh(+), po poronieniu, zabiegach", "Immunoglobuliny/krew → osłabiają odpowiedź na **żywe szczepionki** (MMR, ospa) – odstępy miesięcy", "Surowice zwierzęce (antytoksyny, surowica przeciwjadowa) – ryzyko anafilaksji i choroby posurowiczej"]}, {"h": "Witaminy rozpuszczalne w tłuszczach", "items": ["**A (retinol)**: niedobór – kurza ślepota, kseroftalmia, rogowacenie; nadmiar – nadciśnienie śródczaszkowe, hepatotoksyczność, bóle kości; **retinoidy (izotretynoina, acytretyna) – teratogenne** → program zapobiegania ciąży", "**D**: cholekalcyferol, alfakalcydol, kalcytriol; niedobór – krzywica, osteomalacja; nadmiar – **hiperkalcemia**; profilaktyka u **niemowląt od pierwszych dni życia**", "**E (tokoferol)**: antyoksydant; niedobór – neuropatia, ataksja (zaburzenia wchłaniania tłuszczów)", "**K**: kofaktor γ-karboksylacji czynników **II, VII, IX, X** (i białek C, S); **fitomenadion** – **profilaktyka choroby krwotocznej noworodka**, odwracanie działania **warfaryny/acenokumarolu**; niedobór – antybiotyki, cholestaza, zaburzenia wchłaniania"]}, {"h": "Witaminy rozpuszczalne w wodzie", "items": ["**B1 (tiamina)**: beri-beri, **encefalopatia Wernickego** (splątanie, ataksja, oczopląs) → u alkoholików **tiamina przed glukozą**", "**B2 (ryboflawina)**: zajady, zapalenie języka", "**B3 (niacyna)**: **pelagra** (biegunka, zapalenie skóry, otępienie); duże dawki – **flush** (prostaglandyny), hepatotoksyczność, hiperurykemia", "**B6 (pirydoksyna)**: niedobór przy **izoniazydzie** (neuropatia → suplementacja), niedokrwistość syderoblastyczna, drgawki u niemowląt; nadmiar – neuropatia czuciowa", "**B9 (kwas foliowy)**: niedokrwistość megaloblastyczna, **wady cewy nerwowej** → **0,4 mg/d przed ciążą i w I trymestrze** (większe dawki w grupach ryzyka); niedobór przy metotreksacie, trimetoprimie, fenytoinie", "Kwas foliowy przy niedoborze B12 – poprawia morfologię, ale **maskuje i nie zatrzymuje uszkodzeń neurologicznych**", "**B12 (cyjano-/hydroksokobalamina)**: niedokrwistość megaloblastyczna, **zwyrodnienie sznurów tylnych**; niedokrwistość złośliwa, po gastrektomii → **pozajelitowo**; niedobór przy **metforminie, IPP**, N₂O, diecie wegańskiej", "**Hydroksokobalamina** – odtrutka w zatruciu **cyjankami**", "**C (kwas askorbinowy)**: szkorbut (krwawienia z dziąseł, wybroczyny okołomieszkowe); ↑ wchłaniania żelaza; duże dawki – **kamica szczawianowa**"]}, {"h": "Biopierwiastki i leki roślinne", "items": ["**Żelazo p.o.** (Fe²⁺): na czczo; ↑ wchłaniania – witamina C; ↓ – **IPP, leki zobojętniające, wapń, tetracykliny, chinolony**, herbata; działania: zaparcia, **czarny stolec**, nudności", "**Żelazo i.v.** (karboksymaltoza, sacharoza, derizomaltoza): nietolerancja, zaburzenia wchłaniania, PChN, szybka odbudowa; **nadwrażliwość** (obserwacja ≥ 30 min), hipofosfatemia (karboksymaltoza)", "Zatrucie żelazem (dzieci): wymioty, krwawienie z p. pokarmowego, kwasica, niewydolność wątroby → **deferoksamina**", "**Wapń**: węglan (wymaga kwasu – z posiłkiem), cytrynian (niezależny od pH); **glukonian wapnia i.v.** – hipokalcemia, **hiperkaliemia** (stabilizacja błony), zatrucie magnezem i blokerami kanału wapniowego", "**Potas**: KCl p.o. lub i.v. – **rozcieńczony, wolny wlew, nigdy bolus** (zatrzymanie krążenia); ostrożnie z ACEI/ARB, spironolaktonem, w PChN", "**Magnez** i.v.: **torsade de pointes**, **rzucawka/stan przedrzucawkowy**, ciężki napad astmy, hipomagnezemia; toksyczność – zniesienie odruchów, depresja oddechu → **glukonian wapnia**", "**Cynk** (↓ wchłaniania miedzi), **fluor** (próchnica; nadmiar – fluoroza), **jod** (KI – ciąża, karmienie), selen", "**Ziele dziurawca** – silny **induktor CYP3A4 i P-gp**: ↓ antykoncepcji, cyklosporyny, takrolimusu, warfaryny, NOAC, leków przeciwwirusowych; z SSRI – zespół serotoninowy", "**Miłorząb** – ↑ ryzyka krwawień (z antykoagulantami, antyagregantami); grejpfrut – inhibitor CYP3A4 (jelitowego)"]}], "cards": [{"q": "Wymień szczepionki żywe atenuowane.", "a": "**MMR** (odra, świnka, różyczka), **ospa wietrzna**, **BCG**, **rotawirusy**, żółta gorączka, dur brzuszny doustna, donosowa przeciw grypie."}, {"q": "U kogo przeciwwskazane są szczepionki żywe?", "a": "U **kobiet w ciąży** i osób z **ciężkim niedoborem odporności** (wrodzonym, chemioterapia, wysokie dawki GKS, leki biologiczne, zaawansowane zakażenie HIV)."}, {"q": "Dlaczego szczepionki polisacharydowe koniguje się z białkiem?", "a": "Sam polisacharyd daje odpowiedź **T-niezależną** – słabą u dzieci < 2 lat i bez pamięci. Koniugacja z białkiem daje odpowiedź **T-zależną** z pamięcią immunologiczną (Hib, PCV, meningokoki)."}, {"q": "Czym jest anatoksyna? Podaj przykłady.", "a": "**Unieczynniona toksyna** bakteryjna zachowująca immunogenność – **tężcowa i błonicza** (składniki DTaP, Td, Tdap)."}, {"q": "Jaki odstęp musi dzielić dwie szczepionki żywe podawane pozajelitowo?", "a": "Podaje się je **tego samego dnia** albo w odstępie **co najmniej 4 tygodni**."}, {"q": "Jakie są bezwzględne przeciwwskazania do szczepienia?", "a": "**Ciężka reakcja alergiczna (anafilaksja)** po poprzedniej dawce lub na składnik szczepionki; dla żywych – ciąża i ciężka immunosupresja. Ostra choroba z gorączką → odroczenie."}, {"q": "Czym różni się odporność czynna od biernej?", "a": "**Czynna** (szczepionka) – własne przeciwciała i pamięć, trwała, ale rozwija się po tygodniach. **Bierna** (immunoglobuliny) – **natychmiastowa**, ale krótkotrwała (tygodnie–miesiące)."}, {"q": "Jak postępuje się z noworodkiem matki HBsAg-dodatniej?", "a": "W ciągu **12 godzin po urodzeniu**: **szczepionka przeciw WZW B + immunoglobulina anty-HBs (HBIG)**, w różne miejsca."}, {"q": "Jaka jest profilaktyka poekspozycyjna wścieklizny?", "a": "Opracowanie rany + **szczepionka przeciw wściekliźnie** (seria dawek) + u osób nieszczepionych **immunoglobulina przeciw wściekliźnie** (naciek wokół rany)."}, {"q": "Kiedy podaje się immunoglobulinę anty-D?", "a": "Kobiecie **Rh(−)**: profilaktycznie ok. **28. tygodnia ciąży** oraz **≤ 72 h po porodzie** dziecka Rh(+), po poronieniu, zabiegach inwazyjnych, urazie brzucha – zapobiega immunizacji."}, {"q": "Jakie przeciwciało monoklonalne chroni niemowlęta przed RSV?", "a": "**Nirsewimab** (jedna dawka na sezon) i starszy **paliwizumab** (comiesięczne iniekcje u dzieci z grup ryzyka)."}, {"q": "Dlaczego po przetoczeniu krwi lub immunoglobulin odracza się szczepienie MMR?", "a": "Przeciwciała z preparatu mogą **neutralizować wirusy szczepionkowe** i osłabić odpowiedź na żywe szczepionki (MMR, ospa)."}, {"q": "Jakie witaminy rozpuszczają się w tłuszczach i czym grozi ich nadmiar?", "a": "**A, D, E, K** – kumulują się w tkankach; przedawkowanie jest toksyczne (np. A – nadciśnienie śródczaszkowe, hepatotoksyczność; D – hiperkalcemia)."}, {"q": "Dlaczego retinoidy wymagają programu zapobiegania ciąży?", "a": "**Izotretynoina, acytretyna** i inne retinoidy są **silnie teratogenne** (wady OUN, serca, twarzoczaszki) – wymagana skuteczna antykoncepcja i testy ciążowe."}, {"q": "Do czego stosuje się witaminę K (fitomenadion)?", "a": "**Profilaktyka choroby krwotocznej noworodka**, odwracanie działania **antagonistów witaminy K** (warfaryna, acenokumarol), niedobory (cholestaza, zaburzenia wchłaniania, antybiotykoterapia)."}, {"q": "Dlaczego u alkoholika tiaminę podaje się przed glukozą?", "a": "Glukoza zwiększa zużycie tiaminy (kofaktor metabolizmu węglowodanów) i może **wywołać lub nasilić encefalopatię Wernickego**."}, {"q": "Jakie są objawy encefalopatii Wernickego?", "a": "**Splątanie, ataksja, oczopląs/porażenie mięśni gałkoruchowych** – wynik niedoboru tiaminy (B1)."}, {"q": "Jakie objawy daje niedobór niacyny i jakie działanie niepożądane mają jej duże dawki?", "a": "Niedobór – **pelagra**: biegunka, zapalenie skóry, otępienie (3 × D). Duże dawki – **zaczerwienienie (flush)**, świąd, hepatotoksyczność, hiperurykemia, hiperglikemia."}, {"q": "Dlaczego przy leczeniu izoniazydem podaje się pirydoksynę?", "a": "Izoniazyd powoduje **niedobór witaminy B6** → **neuropatia obwodowa**; suplementacja jej zapobiega."}, {"q": "Ile kwasu foliowego powinna przyjmować kobieta planująca ciążę i po co?", "a": "**0,4 mg/dobę** (min. 4–12 tyg. przed ciążą i w I trymestrze; więcej w grupach ryzyka) – zapobiega **wadom cewy nerwowej**."}, {"q": "Czym grozi leczenie samym kwasem foliowym niedoboru witaminy B12?", "a": "Poprawia obraz krwi, ale **maskuje niedobór B12**, a **uszkodzenie neurologiczne** (zwyrodnienie sznurów tylnych) postępuje."}, {"q": "Jakie leki mogą powodować niedobór witaminy B12?", "a": "**Metformina**, **IPP** i antagoniści H₂ (długotrwale), podtlenek azotu (inaktywacja), kolchicyna."}, {"q": "Dlaczego w niedokrwistości złośliwej witaminę B12 podaje się pozajelitowo?", "a": "Brak **czynnika wewnętrznego Castle'a** → B12 nie wchłania się w jelicie krętym (choć bardzo duże dawki doustne wchłaniają się biernie)."}, {"q": "Jaka witamina jest odtrutką w zatruciu cyjankami?", "a": "**Hydroksokobalamina** – wiąże cyjanek, tworząc cyjanokobalaminę wydalaną z moczem."}, {"q": "Jak przyjmować doustne preparaty żelaza i co zmniejsza ich wchłanianie?", "a": "**Na czczo** (lub co drugi dzień), z witaminą C. Wchłanianie zmniejszają: **IPP, leki zobojętniające, wapń, tetracykliny, chinolony**, herbata, kawa, nabiał."}, {"q": "Jakie są działania niepożądane żelaza doustnego i dożylnego?", "a": "Doustne: **zaparcia, czarny stolec**, nudności, bóle brzucha. Dożylne: **reakcje nadwrażliwości** (obserwacja ≥ 30 min), hipofosfatemia (karboksymaltoza)."}, {"q": "Jaka jest odtrutka w ostrym zatruciu żelazem?", "a": "**Deferoksamina** (chelator) – w ciężkim zatruciu, i.v."}, {"q": "Do czego stosuje się glukonian wapnia dożylnie?", "a": "**Hipokalcemia** (tężyczka), **hiperkaliemia** (stabilizacja błony kardiomiocytów), przedawkowanie **magnezu** i **blokerów kanału wapniowego**."}, {"q": "Jak bezpiecznie podawać potas dożylnie?", "a": "**Rozcieńczony, we wlewie z ograniczoną szybkością**, pod kontrolą stężenia i EKG – **nigdy w bolusie** (ryzyko zatrzymania krążenia)."}, {"q": "W jakich stanach podaje się dożylnie siarczan magnezu?", "a": "**Torsade de pointes**, **stan przedrzucawkowy/rzucawka**, ciężki napad astmy, hipomagnezemia; toksyczność – zniesienie odruchów, depresja oddechu (antidotum: wapń)."}, {"q": "Dlaczego ziele dziurawca jest niebezpieczne w połączeniu z innymi lekami?", "a": "Silnie **indukuje CYP3A4 i P-gp** → ↓ stężenia antykoncepcji hormonalnej, cyklosporyny, takrolimusu, warfaryny, NOAC, leków na HIV; z SSRI – ryzyko **zespołu serotoninowego**."}], "sources": []}, {"id": "f-toks", "num": "F27", "title": "Toksykologia – zatrucia i odtrutki", "summary": ["**Postępowanie w ostrym zatruciu** zaczyna się od zabezpieczenia funkcji życiowych (ABCDE), oceny glikemii i ustalenia, co, ile i kiedy pacjent przyjął. Objawy często układają się w **toksydromy**. **Cholinolityczny** (atropina, leki przeciwhistaminowe I generacji, TLPD, bieluń): sucha, gorąca, zaczerwieniona skóra, szerokie źrenice, tachykardia, zatrzymanie moczu i majaczenie. **Cholinergiczny** (fosforoorganiczne, karbaminiany): zwężenie źrenic, ślinienie, łzawienie, oddawanie moczu i stolca, skurcz oskrzeli, bradykardia (SLUDGE / DUMBELS) i drżenia pęczkowe mięśni. **Opioidowy**: śpiączka, **szpilkowate źrenice** i depresja oddechu. **Sympatykomimetyczny** (kokaina, amfetaminy): pobudzenie, tachykardia, nadciśnienie, szerokie źrenice, ale skóra **spocona**, co odróżnia go od cholinolitycznego. **Serotoninowy**: klonusy, hiperrefleksja, hipertermia i pobudzenie.", "**Zmniejszanie wchłaniania i przyspieszanie eliminacji.** **Węgiel aktywowany** (jednorazowo, najlepiej w ciągu 1 h od połknięcia, u pacjenta z drożnymi drogami oddechowymi) **nie wiąże** alkoholi, glikoli, metali (Fe, Li), kwasów, zasad ani węglowodorów. Dawki wielokrotne przyspieszają eliminację m.in. karbamazepiny, fenobarbitalu, teofiliny i dapsonu. **Wymiotów nie wywołuje się** (zatrucia substancjami żrącymi i węglowodorami, ryzyko aspiracji). Płukanie żołądka stosuje się wyjątkowo. Płukanie całego jelita wchodzi w grę przy żelazie, licie i preparatach o przedłużonym uwalnianiu oraz u przemytników przenoszących pakiety w przewodzie pokarmowym. **Alkalizacja moczu** wodorowęglanem pomaga w zatruciu salicylanami (i fenobarbitalem). **Hemodializę** stosuje się przy licie, metanolu, glikolu etylenowym, salicylanach, teofilinie, metforminie (kwasica mleczanowa) i walproinianie.", "**Paracetamol**: przy przedawkowaniu wyczerpują się zapasy glutationu i toksyczny metabolit **NAPQI** uszkadza hepatocyty, co prowadzi do ostrej niewydolności wątroby (szczyt w 3.–4. dobie). Wczesne objawy są skąpe. O leczeniu decyduje stężenie paracetamolu oznaczone **co najmniej 4 h po połknięciu** i naniesione na nomogram. Według MHRA (2012) wystarczy jedna linia leczenia (100 mg/l w 4. godzinie), niezależnie od czynników ryzyka. Przy nieznanym czasie lub przyjmowaniu dawek w odstępach (*staggered overdose*) **N-acetylocysteinę** podaje się od razu. Odtrutka uzupełnia glutation i jest niemal w pełni skuteczna, jeśli poda się ją **w ciągu 8 h**. Reakcja anafilaktoidna na NAC nie jest przeciwwskazaniem, a pierwszą dawkę wlewa się przez 60 minut. **Salicylany** powodują szum w uszach, wymioty, hiperwentylację (zasadowicę oddechową), a potem **kwasicę metaboliczną z luką anionową**, hipertermię i obrzęk płuc. Leczy się je węglem aktywowanym, wodorowęglanem (alkalizacja moczu) i hemodializą.", "**Alkohole toksyczne**: **metanol** (metabolizowany do kwasu mrówkowego; daje ślepotę i kwasicę) oraz **glikol etylenowy** (metabolizowany do szczawianów; daje niewydolność nerek, hipokalcemię i kryształy szczawianu wapnia w moczu). Oba powodują **kwasicę z luką anionową i osmolalną**. Leczenie polega na zablokowaniu **dehydrogenazy alkoholowej**: **fomepizol** lub **etanol**, do tego wodorowęglan, kwas foliowy (metanol), tiamina z pirydoksyną (glikol) i hemodializa. **Tlenek węgla** wiąże się z hemoglobiną (karboksyhemoglobina), co przesuwa krzywą dysocjacji w lewo. Pulsoksymetr pokazuje fałszywie prawidłową saturację. Objawy: ból głowy, wymioty, zaburzenia świadomości, a później powikłania neurologiczne. Leczenie: **100% tlen** (skraca t½ COHb), a w ciężkich przypadkach tlen hiperbaryczny. **Cyjanki** (pożary, nitroprusydek) blokują oksydazę cytochromową i wywołują ciężką kwasicę mleczanową. Leczy się je **hydroksokobalaminą**.", "**Wybrane odtrutki**: opioidy – **nalokson** (działa krócej niż wiele opioidów, więc trzeba obserwować pacjenta i powtarzać dawki); benzodiazepiny – **flumazenil** (ostrożnie, grozi drgawkami u osób uzależnionych i po TLPD); fosforoorganiczne – **atropina** w dużych dawkach z **pralidoksymem** (reaktywuje AChE przed jej „starzeniem się”); β-blokery – glukagon, duże dawki insuliny z glukozą; blokery kanału wapniowego – wapń i insulina; **digoksyna** – fragmenty Fab przeciwciał przeciw digoksynie; TLPD (poszerzenie QRS) – **wodorowęglan sodu**; antagoniści witaminy K – **witamina K** i PCC; dabigatran – **idarucyzumab**; heparyna – **protamina**; methemoglobinemia – **błękit metylenowy** (przeciwwskazany przy niedoborze G6PD); żelazo – **deferoksamina**; ołów – chelatory (EDTA wapniowo-sodowy, DMSA); izoniazyd – pirydoksyna; metotreksat – **folinian wapnia**; lit – nawodnienie i hemodializa; muchomor sromotnikowy – sylibinina; hipoglikemia po pochodnych sulfonylomocznika – glukoza i oktreotyd."], "review": [{"h": "Toksydromy", "items": ["**Cholinolityczny** (atropina, bieluń, I gen. przeciwhistaminowe, TLPD, neuroleptyki): **sucha, gorąca, czerwona skóra**, **szerokie źrenice**, tachykardia, zatrzymanie moczu, ↓ perystaltyki, **majaczenie** („red as a beet, dry as a bone, blind as a bat, mad as a hatter”); odtrutka – fizostygmina (wybiórczo)", "**Cholinergiczny** (fosforoorganiczne, karbaminiany, sarin): **zwężenie źrenic**, ślinienie, łzawienie, pocenie, biegunka, oddawanie moczu, **skurcz oskrzeli i bronchorea**, bradykardia; nikotynowe – fascykulacje, osłabienie, porażenie", "**Opioidowy**: śpiączka, **źrenice szpilkowate**, **depresja oddechu** (bradypnoë)", "**Sympatykomimetyczny** (kokaina, amfetamina, MDMA): pobudzenie, tachykardia, nadciśnienie, hipertermia, szerokie źrenice, **spocona skóra**; leczenie – benzodiazepiny, chłodzenie (unikać czystych β-blokerów przy kokainie)", "**Serotoninowy**: **klonusy** (indukowane, oczne), hiperrefleksja, hipertermia, pobudzenie, biegunka; leczenie – odstawienie, benzodiazepiny, cyproheptadyna", "**Złośliwy zespół neuroleptyczny**: sztywność ołowiana, hipertermia, zaburzenia świadomości, ↑ CK (rozwija się w ciągu dni)", "**Sedatywno-nasenny** (benzodiazepiny, barbiturany, alkohol): senność, śpiączka, prawidłowe źrenice, depresja oddechu (zwłaszcza w skojarzeniu z opioidami/alkoholem)"]}, {"h": "Dekontaminacja i eliminacja", "items": ["**Węgiel aktywowany** – 1 dawka (najlepiej ≤ 1 h), drożne drogi oddechowe", "Węgiel **nie wiąże**: alkoholi i glikoli, **żelaza, litu**, metali ciężkich, **kwasów i zasad (żrących)**, węglowodorów, cyjanków (słabo)", "**Wielokrotne dawki węgla**: karbamazepina, **fenobarbital**, dapson, chinina, **teofilina**", "**Prowokowanie wymiotów – nie** (aspiracja, ponowna ekspozycja na środek żrący)", "Płukanie całego jelita: **żelazo, lit**, preparaty o przedłużonym uwalnianiu, pakiety z narkotykami", "**Alkalizacja moczu** (NaHCO₃): **salicylany**, fenobarbital", "**Hemodializa**: **lit, metanol, glikol etylenowy, salicylany**, teofilina, metformina (kwasica mleczanowa), walproinian, barbiturany (ciężko)", "Zasada: leczy się chorego, nie wynik – ale stężenia (paracetamol, salicylany, lit, digoksyna, Fe) kierują leczeniem"]}, {"h": "Paracetamol, salicylany", "items": ["Paracetamol – przedawkowanie: wysycenie glukuronidacji i sulfatacji → ↑ **NAPQI** (CYP2E1) → wyczerpanie **glutationu** → martwica hepatocytów (strefa 3)", "Przebieg: 0–24 h – skąpe objawy (nudności); 24–72 h – ↑ aminotransferaz, ból w prawym podżebrzu; **3–4 doba** – szczyt niewydolności wątroby; potem zdrowienie lub zgon/przeszczep; możliwe ostre uszkodzenie nerek", "Stężenie oznaczać **≥ 4 h po połknięciu** → nomogram; **MHRA 2012: jedna linia 100 mg/l w 4 h (do 15 mg/l w 15 h)** – bez względu na czynniki ryzyka", "**N-acetylocysteina (NAC)** – prekursor glutationu; **niemal w pełni skuteczna ≤ 8 h**; później skuteczność wyraźnie maleje, ale nadal wskazana", "Czas nieznany lub *staggered overdose* → **NAC od razu**, bez nomogramu", "Reakcja anafilaktoidna na NAC (zaczerwienienie, świąd, skurcz oskrzeli) – **nie przeciwwskazanie**; pierwsza dawka wlewana przez **60 min**", "Salicylany: **szumy uszne**, wymioty, **hiperwentylacja → zasadowica oddechowa**, potem **kwasica metaboliczna z luką anionową**, hipertermia, hipoglikemia (także neuroglikopenia przy prawidłowej glikemii), obrzęk płuc, drgawki", "Leczenie salicylanów: węgiel aktywowany, **NaHCO₃ (alkalizacja moczu)**, uzupełnianie K⁺, glukoza, **hemodializa** (ciężkie, wysokie stężenie, zaburzenia świadomości, obrzęk płuc)"]}, {"h": "Alkohole toksyczne i gazy", "items": ["**Metanol** → formaldehyd → **kwas mrówkowy**: zaburzenia widzenia (**ślepota**, „burza śnieżna”), kwasica, uszkodzenie jąder podstawy", "**Glikol etylenowy** → kwas glikolowy, **szczawiany**: **ostra niewydolność nerek**, **hipokalcemia**, kryształy szczawianu wapnia w moczu", "Oba: **kwasica z ↑ luką anionową i ↑ luką osmolalną**", "Leczenie: **fomepizol** lub **etanol** (blokują dehydrogenazę alkoholową), NaHCO₃, **hemodializa**; metanol – **kwas foliowy/folinowy**; glikol – **tiamina i pirydoksyna**", "**Tlenek węgla**: COHb (powinowactwo do Hb ~200–250× większe niż O₂), przesunięcie krzywej dysocjacji w lewo, **pulsoksymetr zawyża saturację**; ból głowy, nudności, zaburzenia świadomości, zespół opóźnionych następstw neurologicznych", "Leczenie CO: **100% tlen** (t½ COHb ~5 h → ~1 h), **tlen hiperbaryczny** (ciężkie, utrata przytomności, ciąża)", "**Cyjanki** (pożary zamkniętych pomieszczeń, nitroprusydek, pestki): blokada **oksydazy cytochromu c** → **kwasica mleczanowa**, wysokie wysycenie krwi żylnej O₂; leczenie – **hydroksokobalamina**, tiosiarczan sodu, 100% O₂", "**Etanol**: depresja OUN, **hipoglikemia** (dzieci), hipotermia, aspiracja; zespół abstynencyjny – benzodiazepiny, tiamina"]}, {"h": "Odtrutki", "items": ["Opioidy → **nalokson** (krótszy t½ niż metadon/morfina o przedłużonym uwalnianiu → obserwacja, powtarzanie/wlew; może wywołać zespół odstawienny)", "Benzodiazepiny → **flumazenil** (ryzyko drgawek przy uzależnieniu i zatruciu mieszanym z TLPD)", "Fosforoorganiczne → **atropina** (do ustąpienia oskrzelotoku) + **pralidoksym/obidoksym** (reaktywacja AChE przed „starzeniem”)", "Cholinolityki → fizostygmina (wybrane przypadki majaczenia)", "**Digoksyna** → **fragmenty Fab** przeciwciał (zagrażające życiu arytmie, hiperkaliemia)", "**TLPD** (poszerzenie QRS, arytmie, hipotensja) → **wodorowęglan sodu** (alkalizacja + Na⁺)", "β-blokery → **glukagon**, wysokodawkowa insulina + glukoza; blokery kanału wapniowego → **wapń**, insulina, emulsja lipidowa (ciężkie)", "**Warfaryna** → **witamina K** + **koncentrat czynników zespołu protrombiny (PCC)**; **dabigatran** → **idarucyzumab**; ksabany → andeksanet alfa; **heparyna** → **siarczan protaminy**", "Methemoglobinemia (azotyny, dapson, prilokaina) → **błękit metylenowy** (nie przy niedoborze **G6PD**)", "**Żelazo** → deferoksamina; **ołów** → EDTA wapniowo-sodowy, DMSA (sukcymer); **arsen/rtęć** → dimerkaprol (BAL), DMPS", "**Metotreksat** → **folinian wapnia (leukoworyna)**, glukarpidaza; **izoniazyd** (drgawki) → **pirydoksyna**", "**Lit** → nawodnienie, **hemodializa**; **cyjanki** → hydroksokobalamina; **CO** → tlen", "**Muchomor sromotnikowy** (amanityna, objawy po 6–24 h) → **sylibinina**, NAC, przeszczep wątroby", "Hipoglikemia po **pochodnych sulfonylomocznika** → glukoza + **oktreotyd**; LAST → 20% emulsja lipidowa"]}], "cards": [{"q": "Jakie są objawy toksydromu cholinolitycznego?", "a": "**Sucha, gorąca, zaczerwieniona skóra**, **szerokie źrenice**, tachykardia, zatrzymanie moczu, porażenna niedrożność, **majaczenie**, hipertermia."}, {"q": "Jakie są objawy toksydromu cholinergicznego i co go wywołuje?", "a": "Zwężenie źrenic, **ślinienie, łzawienie, pocenie, biegunka, oddawanie moczu**, skurcz oskrzeli i oskrzelotok, bradykardia, fascykulacje – związki **fosforoorganiczne**, karbaminiany, bojowe środki paralityczno-drgawkowe."}, {"q": "Jak odróżnić toksydrom sympatykomimetyczny od cholinolitycznego?", "a": "Oba: tachykardia, szerokie źrenice, pobudzenie. **Sympatykomimetyczny – skóra spocona**, cholinolityczny – **sucha**, z zatrzymaniem moczu i ↓ perystaltyki."}, {"q": "Jaka triada wskazuje na zatrucie opioidami?", "a": "**Śpiączka, szpilkowate źrenice, depresja oddechu** (bradypnoë)."}, {"q": "Czym różni się zespół serotoninowy od złośliwego zespołu neuroleptycznego?", "a": "**Serotoninowy**: szybki początek (godziny), **klonusy, hiperrefleksja**, biegunka. **ZZN**: rozwija się w ciągu dni, **sztywność ołowiana**, bradykinezja, ↑↑ CK."}, {"q": "Kiedy podaje się węgiel aktywowany?", "a": "Po połknięciu substancji wiązanej przez węgiel, najlepiej **w ciągu 1 godziny**, u pacjenta przytomnego lub z zabezpieczonymi drogami oddechowymi."}, {"q": "Jakich substancji nie wiąże węgiel aktywowany?", "a": "**Alkoholi i glikoli**, **żelaza i litu** (metali), **kwasów i zasad**, węglowodorów, cyjanków (słabo)."}, {"q": "Dlaczego w zatruciach nie prowokuje się wymiotów?", "a": "Ryzyko **aspiracji** (zwłaszcza przy zaburzeniach świadomości i węglowodorach) oraz **ponownego oparzenia** przełyku substancjami żrącymi; brak udowodnionej korzyści."}, {"q": "W jakich zatruciach stosuje się alkalizację moczu?", "a": "W zatruciu **salicylanami** (i fenobarbitalem) – zjonizowany słaby kwas nie wchłania się zwrotnie w kanalikach."}, {"q": "W jakich zatruciach stosuje się hemodializę?", "a": "**Lit, metanol, glikol etylenowy, salicylany**, teofilina, metformina (kwasica mleczanowa), walproinian – małe cząsteczki o małej objętości dystrybucji."}, {"q": "Jaki jest mechanizm hepatotoksyczności paracetamolu?", "a": "Po wysyceniu glukuronidacji i sulfatacji powstaje więcej **NAPQI**, który po wyczerpaniu **glutationu** wiąże się z białkami hepatocytów → martwica (strefa okołożylna)."}, {"q": "Kiedy oznacza się stężenie paracetamolu po przedawkowaniu?", "a": "**Co najmniej 4 godziny po połknięciu** (wcześniejsze oznaczenie jest niemiarodajne) i nanosi na nomogram."}, {"q": "Jaka linia leczenia na nomogramie paracetamolu obowiązuje według MHRA (2012)?", "a": "**Jedna linia: 100 mg/l w 4. godzinie** (do 15 mg/l w 15. godzinie) – leczy się każdego pacjenta na linii lub powyżej, **niezależnie od czynników ryzyka**."}, {"q": "Kiedy podaje się N-acetylocysteinę bez czekania na stężenie paracetamolu?", "a": "Gdy **czas połknięcia jest nieznany** lub przedawkowanie było **rozłożone w czasie** (*staggered*), a także przy dużej dawce, gdy wynik nie będzie dostępny przed 8. godziną."}, {"q": "Jak działa N-acetylocysteina w zatruciu paracetamolem i kiedy jest najskuteczniejsza?", "a": "Jest **prekursorem glutationu** (odtwarza zapasy, wiąże NAPQI); niemal w pełni chroni wątrobę, gdy poda się ją **w ciągu 8 godzin**."}, {"q": "Czy wcześniejsza reakcja na acetylocysteinę jest przeciwwskazaniem do jej podania?", "a": "**Nie** – reakcje są **anafilaktoidalne** (zależne od dawki), nie immunologiczne; pierwszą dawkę wlewa się przez **60 minut**, by je ograniczyć."}, {"q": "Kiedy występuje szczyt uszkodzenia wątroby po przedawkowaniu paracetamolu?", "a": "W **3.–4. dobie** – pierwsza doba bywa prawie bezobjawowa (nudności), co usypia czujność."}, {"q": "Jakie zaburzenia kwasowo-zasadowe wywołuje zatrucie salicylanami?", "a": "Najpierw **zasadowica oddechowa** (pobudzenie ośrodka oddechowego), potem **kwasica metaboliczna z luką anionową** – typowo zaburzenie mieszane."}, {"q": "Jak leczy się zatrucie salicylanami?", "a": "Węgiel aktywowany, **wodorowęglan sodu** (alkalizacja moczu), uzupełnianie potasu, glukoza, w ciężkich przypadkach **hemodializa**."}, {"q": "Jakie są skutki zatrucia metanolem i glikolem etylenowym?", "a": "**Metanol** (kwas mrówkowy) – **uszkodzenie nerwu wzrokowego/ślepota**, kwasica. **Glikol** (szczawiany) – **ostra niewydolność nerek**, hipokalcemia, kryształy szczawianu wapnia. Oba – kwasica z ↑ luką anionową i osmolalną."}, {"q": "Jak leczy się zatrucie metanolem lub glikolem etylenowym?", "a": "Blokada **dehydrogenazy alkoholowej** – **fomepizol** lub **etanol**; wodorowęglan, **hemodializa**; metanol – kwas foliowy/folinowy; glikol – tiamina i pirydoksyna."}, {"q": "Dlaczego pulsoksymetr jest niewiarygodny w zatruciu tlenkiem węgla?", "a": "Nie odróżnia **karboksyhemoglobiny** od oksyhemoglobiny → **zawyża saturację**; potrzebna gazometria z kooksymetrią (COHb)."}, {"q": "Jak leczy się zatrucie tlenkiem węgla?", "a": "**100% tlen** przez maskę z rezerwuarem (skraca t½ COHb z ~5 h do ~1 h); w ciężkich przypadkach (utrata przytomności, objawy neurologiczne, ciąża) – **tlen hiperbaryczny**."}, {"q": "Jaki jest mechanizm toksyczności cyjanków i jak się je leczy?", "a": "Blokują **oksydazę cytochromu c** → niedotlenienie komórkowe, **kwasica mleczanowa**. Leczenie: **hydroksokobalamina** i.v. (± tiosiarczan sodu), 100% tlen."}, {"q": "Dlaczego po podaniu naloksonu pacjenta trzeba obserwować?", "a": "**Nalokson działa krócej** niż wiele opioidów (metadon, preparaty o przedłużonym uwalnianiu) → ryzyko **nawrotu depresji oddechu** (powtarzanie dawek, wlew)."}, {"q": "Jakie ryzyko niesie flumazenil?", "a": "**Drgawki** – u osób uzależnionych od benzodiazepin, przy zatruciu mieszanym z **TLPD** lub lekami prodrgawkowymi; zespół odstawienny."}, {"q": "Jak leczy się zatrucie związkami fosforoorganicznymi?", "a": "Odkażenie, **atropina** w dużych, powtarzanych dawkach (do ustąpienia oskrzelotoku) + **oksym (pralidoksym, obidoksym)** – reaktywuje AChE przed jej „starzeniem”; benzodiazepiny na drgawki."}, {"q": "Jak leczy się poszerzenie QRS w zatruciu TLPD?", "a": "**Wodorowęglan sodu i.v.** – alkalizacja i ładunek sodu zmniejszają blokadę kanałów sodowych; unikać leków klasy IA i IC."}, {"q": "Jakie są odtrutki w zatruciu β-blokerami i blokerami kanału wapniowego?", "a": "β-blokery – **glukagon**, wysokodawkowa insulina z glukozą; blokery kanału wapniowego – **sole wapnia**, insulina z glukozą; w obu wazopresory, ewentualnie emulsja lipidowa."}, {"q": "Jaka jest odtrutka dla digoksyny i kiedy się ją stosuje?", "a": "**Fragmenty Fab przeciwciał przeciw digoksynie** – przy zagrażających życiu zaburzeniach rytmu, ciężkiej hiperkaliemii, bardzo wysokim stężeniu."}, {"q": "Jak odwraca się działanie warfaryny przy ciężkim krwawieniu?", "a": "**Witamina K i.v.** + **koncentrat czynników zespołu protrombiny (PCC)** (lub osocze, gdy PCC niedostępny)."}, {"q": "Jakie są odtrutki dla heparyny i dabigatranu?", "a": "Heparyna – **siarczan protaminy** (HDCz w pełni, HDCz częściowo). Dabigatran – **idarucyzumab** (fragment przeciwciała)."}, {"q": "Jak leczy się methemoglobinemię i kiedy leczenie jest przeciwwskazane?", "a": "**Błękit metylenowy i.v.**; przeciwwskazany przy **niedoborze G6PD** (hemoliza, brak skuteczności)."}, {"q": "Jaka jest odtrutka w zatruciu żelazem i ołowiem?", "a": "Żelazo – **deferoksamina**; ołów – **EDTA wapniowo-sodowy**, **DMSA (sukcymer)**, w ciężkim – dimerkaprol (BAL)."}, {"q": "Jaka odtrutka chroni przed toksycznością metotreksatu?", "a": "**Folinian wapnia (leukoworyna)** – omija zablokowaną reduktazę dihydrofolianu; przy niewydolności nerek – glukarpidaza."}, {"q": "Jak leczy się drgawki w zatruciu izoniazydem?", "a": "**Pirydoksyna (B6)** i.v. (izoniazyd wyczerpuje B6 → ↓ GABA) + benzodiazepiny."}, {"q": "Jak leczy się ciężkie zatrucie litem?", "a": "Nawodnienie 0,9% NaCl, odstawienie leków ↓ wydalanie litu, **hemodializa** (węgiel aktywowany nie wiąże litu; płukanie jelit przy preparatach SR)."}, {"q": "Jak leczy się zatrucie muchomorem sromotnikowym?", "a": "Toksyna (amanityna) – objawy po **6–24 h**, potem niewydolność wątroby; leczenie: węgiel aktywowany wielokrotnie, **sylibinina**, NAC, płyny, przeszczep wątroby."}, {"q": "Jak leczy się nawracającą hipoglikemię po przedawkowaniu pochodnych sulfonylomocznika?", "a": "**Glukoza** i.v. + **oktreotyd** (hamuje wydzielanie insuliny), długa obserwacja (długie działanie)."}], "sources": [{"t": "MHRA Drug Safety Update – Treating paracetamol overdose with intravenous acetylcysteine: new guidance (linia 100 mg/l, 8 h, reakcje anafilaktoidalne, wlew 60 min)", "u": "https://www.gov.uk/drug-safety-update/treating-paracetamol-overdose-with-intravenous-acetylcysteine-new-guidance"}]}, {"id": "f-recept", "num": "F28", "title": "Receptura i zasady wystawiania recept", "summary": ["**Recepta** to dokument, na podstawie którego apteka wydaje lek. W Polsce standardem jest **e-recepta** w systemie P1. Pacjent realizuje ją na podstawie 4-cyfrowego kodu dostępu i numeru PESEL, kodu kreskowego z wydruku informacyjnego albo przez Internetowe Konto Pacjenta. Lek na recepcie można przepisać pod **nazwą powszechnie stosowaną** (substancja czynna, wtedy farmaceuta może wydać dowolny odpowiednik) albo **handlową**. Wpis **„NZ” (nie zamieniać)** zabrania zamiany na odpowiednik. Recepta zawiera m.in. dane pacjenta i lekarza (z numerem prawa wykonywania zawodu), datę wystawienia, nazwę leku, postać, dawkę, ilość (liczbę opakowań lub łączną ilość), **sposób dawkowania** oraz poziom odpłatności (100% albo zniżka refundacyjna). Kategorie dostępności: **OTC** (bez recepty), **Rp** (na receptę), **Rpz** (do zastrzeżonego stosowania), **Rpw** (zawiera środki odurzające lub substancje psychotropowe, np. opioidy, metylofenidat, niektóre benzodiazepiny) oraz **Lz** (stosowane wyłącznie w lecznictwie zamkniętym).", "**Terminy realizacji e-recepty** według pacjent.gov.pl: standardowo **30 dni** od daty wystawienia albo od daty „realizacji od”, jeśli ją wpisano. **Antybiotyki do stosowania ogólnego: 7 dni**. **Preparaty immunologiczne: 120 dni**. **Recepta roczna (365 dni)** służy w leczeniu przewlekłym i wymaga oznaczenia przez lekarza oraz podania **sposobu dawkowania**. Można na niej przepisać leki na maksymalnie **360 dni** terapii. Jednorazowo wydaje się ilość na nie więcej niż 120 dni, a kolejną część po wykorzystaniu 3/4 poprzedniej. Pierwszą część trzeba wykupić w ciągu 30 dni, inaczej apteka wyda proporcjonalnie mniej. Przepisy w tym zakresie były wielokrotnie nowelizowane (np. rozporządzenie MZ zmieniające rozporządzenie w sprawie recept z lipca 2024 r.), dlatego przed egzaminem warto sprawdzić aktualny stan prawny i materiały z ćwiczeń.", "**Recepta na lek recepturowy (magistralny)**, przygotowywany w aptece, ma tradycyjny zapis łaciński. **Rp.** (*Recipe* – weź) zaczyna przepis. Każdy składnik zapisuje się w osobnym wierszu, w **dopełniaczu** łacińskim, z ilością w gramach (np. *Hydrocortisoni 1,0*). Typowa kolejność składników: substancja czynna (*basis*), środek wspomagający (*adiuvans*), poprawiający smak lub zapach (*corrigens*) i podłoże (*constituens*, *vehiculum*). Po składnikach następuje polecenie dla farmaceuty, np. **M.f. ungt.** (*Misce, fiat unguentum* – zmieszaj, niech powstanie maść), a potem **D.S.** (*Da, signa* – wydaj, oznacz) z instrukcją dla pacjenta po polsku. Ilości: **aa** (*ana partes aequales*, po równo), **ad** (do łącznej ilości), **q.s.** (*quantum satis*, ile potrzeba). Ilości w płynach podaje się w gramach lub mililitrach, a kropli (*guttae*) w liczbie. Ilość substancji silnie działających (bardzo silnych, oznaczanych dawniej jako *venena*, oraz silnych, *separanda*) farmaceuta sprawdza z dawkami maksymalnymi według Farmakopei Polskiej. Przy przekroczeniu dawki lekarz powinien to potwierdzić, np. pisząc dawkę słownie z wykrzyknikiem.", "**Postacie leku recepturowego**: **proszki** (*pulveres*; dzielone, *divisi*, w liczbie sztuk, np. *D.t.d. No 10* – *da tales doses*, wydaj takich dawek 10; lub niedzielone), **maści** (*unguentum*) i **pasty** (*pasta*, ≥ 25% substancji stałych), **kremy**, **czopki** (*suppositoria*, podłoże np. masło kakaowe – *Butyrum Cacao*), **globulki** (*globuli* dopochwowe), **roztwory** (*solutio*), **mieszanki** (*mixtura*), **zasypki** (*pulvis adspersorius*), **krople** (*guttae*; do oczu – jałowe), **zawiesiny** (*suspensio*; „przed użyciem wstrząsnąć”) i **kapsułki** (*capsulae*). Dawkowanie płynów doustnych: łyżka stołowa ≈ 15 ml, deserowa ≈ 10 ml, łyżeczka ≈ 5 ml. Dawkowanie musi być jednoznaczne, a skróty typu „1×1” na recepcie powinny opisywać schemat dawkowania zrozumiały dla pacjenta. Lekarz odpowiada za dawkę, farmaceuta za sporządzenie i kontrolę niezgodności recepturowych (fizycznych, chemicznych i farmakologicznych).", "**Recepty pro auctore i pro familiae**: lekarz może wystawić receptę dla siebie (*pro auctore*) lub dla członka rodziny (*pro familiae*), z odpowiednim oznaczeniem. Na receptach **Rpw** przepisuje się środki odurzające i substancje psychotropowe objęte ustawą o przeciwdziałaniu narkomanii. Obowiązują przy nich szczególne wymagania co do ilości i dokumentacji, a apteka prowadzi ewidencję. **Dobre praktyki przepisywania**: sprawdź alergie, interakcje, czynność nerek i wątroby (dostosowanie dawek), ciążę i karmienie; pisz czytelnie i jednoznacznie, bez niebezpiecznych skrótów (np. „U” zamiast „jednostek”, kropka dziesiętna i zbędne zera: pisz 5 mg, nie 5,0 mg, a 0,5 mg, nie ,5 mg); podaj czas leczenia i ilość odpowiednią do niego (antybiotyki); przy lekach z wąskim indeksem terapeutycznym (lit, digoksyna, warfaryna, leki przeciwpadaczkowe) unikaj zbędnych zamian preparatu. Informacje dla pacjenta zawiera **ulotka (PIL)**, a dla lekarza **ChPL** (Charakterystyka Produktu Leczniczego, Rejestr Produktów Leczniczych)."], "review": [{"h": "E-recepta – podstawy", "items": ["Realizacja: **kod 4-cyfrowy + PESEL**, kod kreskowy z wydruku informacyjnego, SMS/e-mail, IKP", "Elementy: dane pacjenta (PESEL), dane wystawcy i numer prawa wykonywania zawodu, **data wystawienia** (i ewentualnie „realizacji od”), nazwa leku, **postać, dawka, ilość**, **sposób dawkowania**, odpłatność", "Nazwa **powszechnie stosowana** (substancja czynna) lub **handlowa**; **„NZ” – nie zamieniać** na odpowiednik", "Odpłatność: **100%** albo poziom refundacji (ryczałt, 30%, 50%, bezpłatnie – zależnie od wykazu i uprawnień, np. S – seniorzy, DZ – dzieci)", "Kategorie dostępności: **OTC**, **Rp**, **Rpz** (zastrzeżone stosowanie), **Rpw** (środki odurzające i psychotropowe), **Lz** (lecznictwo zamknięte)", "*Pro auctore* (dla siebie), *pro familiae* (dla rodziny)"]}, {"h": "Terminy realizacji (wg pacjent.gov.pl)", "items": ["Standard: **30 dni** od wystawienia lub od daty „realizacji od”", "**Antybiotyki**: **7 dni**", "**Preparaty immunologiczne** (np. szczepionki, odczulanie): **120 dni**", "**Recepta roczna (365 dni)** – leczenie przewlekłe; konieczne oznaczenie i **dawkowanie**; maks. **360 dni** terapii", "Recepta roczna: jednorazowo **≤ 120 dni** leczenia; kolejna część po wykorzystaniu **3/4** (po 90 dniach); pierwsza część w ciągu **30 dni** (później – ilość proporcjonalnie mniejsza)", "Stan prawny się zmienia (np. nowelizacja rozporządzenia w sprawie recept, Dz.U. 2024 poz. 991) → sprawdzić aktualne przepisy"]}, {"h": "Recepta magistralna – łacina", "items": ["**Rp.** = *Recipe* – weź", "Składniki w **dopełniaczu** (genetivus), każdy w osobnym wierszu, ilość w gramach (np. *Acidi salicylici 2,0*)", "Kolejność: *basis* (substancja czynna) → *adiuvans* (wspomagający) → *corrigens* (smaku/zapachu) → *constituens/vehiculum* (podłoże)", "**aa** (*ana partes aequales*) – po równo; **ad** – do (łącznej ilości); **q.s.** (*quantum satis*) – ile potrzeba", "**M.f.** (*Misce, fiat*) – zmieszaj, niech powstanie (np. *M.f. ungt.*, *M.f. pulv.*, *M.f. supp.*)", "**D.t.d. No X** (*Da tales doses*) – wydaj takich dawek X (proszki dzielone, czopki)", "**D.S.** (*Da, signa*) – wydaj, oznacz → instrukcja dla pacjenta po polsku", "Przekroczenie dawki maksymalnej substancji silnie działającej – lekarz zaznacza świadome przekroczenie (dawka **słownie i „!”**)", "Niezgodności recepturowe: fizyczne, chemiczne, farmakologiczne"]}, {"h": "Postacie recepturowe", "items": ["**Pulveres** (proszki): *divisi* (dzielone) / *non divisi*; *pulvis adspersorius* – zasypka", "**Unguentum** (maść), **pasta** (≥ 25% substancji stałych), **cremor** (krem)", "**Suppositoria** (czopki – podłoże *Butyrum Cacao*), **globuli** (globulki dopochwowe)", "**Solutio** (roztwór), **mixtura** (mieszanka), **suspensio** (zawiesina – „przed użyciem wstrząsnąć”), **emulsio**", "**Guttae** (krople) – do oczu jałowe; dawkowanie kroplami", "**Capsulae** (kapsułki)", "Miary: **łyżka stołowa ≈ 15 ml**, **deserowa ≈ 10 ml**, **łyżeczka ≈ 5 ml** (dokładniej – miarka/strzykawka doustna)"]}, {"h": "Bezpieczne przepisywanie", "items": ["Przed przepisaniem: **alergie**, **interakcje**, **czynność nerek i wątroby** (dostosowanie dawek), **ciąża/karmienie**, wiek (dzieci – dawki na kg, seniorzy – kryteria Beersa/STOPP)", "Jednoznaczny zapis: jednostki w pełnym brzmieniu („jednostek” zamiast „U”), **bez zbędnego zera po przecinku** (5 mg, nie 5,0 mg), **zero przed przecinkiem** (0,5 mg)", "Ilość leku dopasowana do czasu leczenia (antybiotyki – pełna kuracja)", "Leki o **wąskim indeksie terapeutycznym** (lit, digoksyna, warfaryna, leki przeciwpadaczkowe, cyklosporyna, lewotyroksyna) – unikać zbędnych zmian preparatu, monitorować", "**ChPL** – źródło dla profesjonalisty (Rejestr Produktów Leczniczych); **ulotka** – dla pacjenta", "Działania niepożądane zgłasza się do **URPL** (system zgłaszania działań niepożądanych)"]}], "cards": [{"q": "Jak pacjent może zrealizować e-receptę?", "a": "Podając w aptece **4-cyfrowy kod dostępu i PESEL**, okazując kod kreskowy z **wydruku informacyjnego** lub przez Internetowe Konto Pacjenta (IKP)."}, {"q": "Co oznacza adnotacja „NZ” na recepcie?", "a": "**Nie zamieniać** – farmaceuta nie może wydać tańszego odpowiednika zamiast przepisanego leku."}, {"q": "Co oznaczają kategorie dostępności OTC, Rp, Rpz, Rpw i Lz?", "a": "**OTC** – bez recepty; **Rp** – na receptę; **Rpz** – do zastrzeżonego stosowania; **Rpw** – zawiera środki odurzające lub substancje psychotropowe; **Lz** – tylko w lecznictwie zamkniętym (szpitalu)."}, {"q": "Ile dni jest ważna standardowa e-recepta?", "a": "**30 dni** od daty wystawienia albo od wpisanej daty „realizacji od”."}, {"q": "Ile dni jest ważna recepta na antybiotyk?", "a": "**7 dni** od daty wystawienia (lub daty „realizacji od”)."}, {"q": "Ile dni jest ważna recepta na preparat immunologiczny?", "a": "**120 dni**."}, {"q": "Jakie warunki musi spełniać recepta roczna (365 dni)?", "a": "Lekarz oznacza ją jako roczną, podaje **sposób dawkowania**; można przepisać leki na maks. **360 dni** terapii."}, {"q": "Na ile dni leczenia można jednorazowo wykupić lek z recepty rocznej?", "a": "Na **nie więcej niż 120 dni**; kolejną część – po wykorzystaniu 3/4 poprzedniej (po ok. 90 dniach). Pierwszą część trzeba wykupić w ciągu **30 dni**."}, {"q": "Czym jest recepta pro auctore i pro familiae?", "a": "*Pro auctore* – wystawiona przez lekarza **dla siebie**; *pro familiae* – **dla członka rodziny**."}, {"q": "Co oznacza „Rp.” na początku recepty magistralnej?", "a": "*Recipe* – **„weź”**; rozpoczyna przepis leku recepturowego."}, {"q": "W jakim przypadku gramatycznym zapisuje się składniki recepty łacińskiej?", "a": "W **dopełniaczu** (genetivus), np. *Hydrocortisoni*, *Acidi salicylici*, *Vaselini albi* – bo podaje się ilość „czego”."}, {"q": "W jakiej kolejności wpisuje się składniki recepty magistralnej?", "a": "*Basis* (substancja czynna) → *adiuvans* (środek wspomagający) → *corrigens* (poprawiający smak/zapach/barwę) → *constituens/vehiculum* (podłoże)."}, {"q": "Co oznacza skrót „aa”?", "a": "*Ana partes aequales* – **po równo** (każdego z wymienionych składników ta sama ilość)."}, {"q": "Co oznacza „ad” w recepcie magistralnej?", "a": "**Do** – podłoża dodaje się tyle, by **łączna masa/objętość** osiągnęła podaną wartość (np. *Vaselini albi ad 50,0*)."}, {"q": "Co oznacza „q.s.”?", "a": "*Quantum satis* – **ile potrzeba** (np. podłoża lub wody do uzyskania postaci)."}, {"q": "Co oznacza „M.f.”?", "a": "*Misce, fiat* – **zmieszaj, niech powstanie**, np. *M.f. ungt.* (maść), *M.f. pulv.* (proszek), *M.f. supp.* (czopki)."}, {"q": "Co oznacza „D.t.d. No 10”?", "a": "*Da tales doses numero 10* – **wydaj takich dawek 10** (np. 10 proszków dzielonych lub czopków o podanym składzie)."}, {"q": "Co oznacza „D.S.”?", "a": "*Da, signa* – **wydaj, oznacz**; po nim następuje instrukcja dla pacjenta (po polsku) – jak i kiedy stosować."}, {"q": "Jak lekarz zaznacza świadome przekroczenie dawki maksymalnej w recepcie magistralnej?", "a": "Pisze **ilość słownie i stawia wykrzyknik (!)** przy dawce – potwierdzając, że przekroczenie jest zamierzone."}, {"q": "Czym różni się pasta od maści?", "a": "**Pasta** zawiera **≥ 25% substancji stałych** (proszków) – jest gęstsza, chłonie wydzielinę; maść ma mniej substancji stałych."}, {"q": "Jakie podłoże stosuje się klasycznie do czopków?", "a": "**Masło kakaowe (*Butyrum Cacao*)** – topi się w temperaturze ciała; ewentualnie podłoża syntetyczne (np. makrogole)."}, {"q": "Jaką informację trzeba dodać przy zawiesinie?", "a": "**„Przed użyciem wstrząsnąć”** – substancja czynna sedymentuje."}, {"q": "Jakim objętościom odpowiadają łyżki przy dawkowaniu płynów doustnych?", "a": "Łyżka stołowa **≈ 15 ml**, deserowa **≈ 10 ml**, łyżeczka **≈ 5 ml** (dokładniej dawkować miarką lub strzykawką)."}, {"q": "Jakie są rodzaje niezgodności recepturowych?", "a": "**Fizyczne** (np. rozwarstwienie, upłynnienie), **chemiczne** (reakcje między składnikami) i **farmakologiczne** (antagonizm lub niebezpieczny synergizm)."}, {"q": "Jakich błędów w zapisie dawki należy unikać?", "a": "**Zbędnego zera po przecinku** (5,0 mg → 50 mg), **braku zera przed przecinkiem** (,5 → 5), skrótów typu „U”/„IU” (pomyłka z 0 lub 10), niejasnych skrótów dawkowania."}, {"q": "Co trzeba sprawdzić przed przepisaniem leku?", "a": "**Alergie**, **interakcje**, **czynność nerek i wątroby**, **ciążę i karmienie**, wiek i masę ciała, choroby współistniejące, wcześniejsze działania niepożądane."}, {"q": "Przy jakich lekach należy unikać zbędnej zamiany preparatu?", "a": "O **wąskim indeksie terapeutycznym**: lit, digoksyna, warfaryna, leki przeciwpadaczkowe, cyklosporyna, takrolimus, lewotyroksyna."}, {"q": "Gdzie lekarz znajdzie urzędową informację o leku i gdzie zgłasza działania niepożądane?", "a": "**ChPL** w Rejestrze Produktów Leczniczych; działania niepożądane zgłasza do **URPL** (Departament Monitorowania Niepożądanych Działań) lub podmiotu odpowiedzialnego."}], "sources": [{"t": "pacjent.gov.pl – Ile jest ważna e-recepta (terminy realizacji, recepta roczna)", "u": "https://pacjent.gov.pl/print/pdf/node/205"}, {"t": "Rozporządzenie MZ z 2 lipca 2024 r. zmieniające rozporządzenie w sprawie recept (Dz.U. 2024 poz. 991)", "u": "https://eli.gov.pl/eli/DU/2024/991/ogl"}]}]}, {"short": "Patofizjologia", "title": "Patofizjologia kliniczna", "subtitle": "Streszczenia, powtórki i fiszki na podstawie podręcznika pod red. M. Olszaneckiej-Glinianowicz, E. Małeckiej-Tendery i J. Chudka (wyd. 3, Edra Urban & Partner 2023).", "note": "Materiał pomocniczy – opracowany na podstawie OCR skanu podręcznika; w razie wątpliwości sprawdź w książce.", "chapters": [{"id": "z-dziedz", "num": "1", "title": "Choroby dziedziczne", "summary": ["**Genom człowieka** to ok. 3 mld nukleotydów i ok. 21–23 tys. genów kodujących białka. Sekwencje kodujące stanowią zaledwie **ok. 1,5% DNA**, a reszta („ciemna materia” DNA, dawniej „śmieciowe” DNA) to przede wszystkim sekwencje regulatorowe: promotory, wzmacniacze, regiony wiążące czynniki chromatyny, geny niekodujących RNA, transpozony (ok. 1/3 DNA) oraz telomery i centromery. Gen jest nieciągły (eksony i introny), a dzięki **alternatywnemu składaniu mRNA** i modyfikacjom potranslacyjnym z ok. 23 tys. genów powstaje 80–100 tys. transkryptów i nawet 250–300 tys. białek. Ekspresję regulują m.in. **mikroRNA** (20–24 nukleotydy, wyciszają translację) i długie niekodujące RNA (lncRNA). Około 20% genów to geny metabolizmu podstawowego (*housekeeping*), a 80% ulega ekspresji tylko w określonych komórkach i okresach życia. Ludzie są identyczni w 99,5% DNA. Zmienność dotyczy głównie **SNP** (polimorfizmów jednego nukleotydu, ok. 10 mln) i **CNV** (zmienności liczby kopii).", "**Polimorfizm a mutacja**: zmianę sekwencji występującą u > 1% populacji uznaje się za polimorfizm, a allele o częstości < 1% za rzadkie. Ostatecznym kryterium jest jednak wpływ na fenotyp: mutacja to zmiana chorobotwórcza. Czasem heterozygoty mają **przewagę selekcyjną**, co utrzymuje zmutowany gen w populacji: niedokrwistość sierpowata, talasemie i niedobór G6PD chronią przed malarią, mukowiscydoza przed zakażeniami jelitowymi Gram(−), hemochromatoza (prawdopodobnie) przed dżumą. Na częstość chorób w populacji wpływa też **efekt założyciela** (np. ΔF508 u Finów). Grupy krwi to klasyczny polimorfizm i wiążą się z podatnością na choroby (np. osoby z grupą 0 częściej chorują na chorobę wrzodową, bo *H. pylori* lepiej wiąże komórki bez antygenów A i B). Trzeba odróżniać chorobę **dziedziczną**, **wrodzoną** i **rodzinną**: pląsawica Huntingtona jest dziedziczna, ale nie wrodzona, a kiła wrodzona jest wrodzona, ale nie dziedziczna. Ok. 50% wczesnych poronień wynika z aberracji chromosomowych. Choroby jednogenowe dotyczą ok. 1,4% noworodków, a choroby wielogenowe (złożone) są znacznie częstsze i zgodność ich występowania u bliźniąt jednojajowych wynosi zwykle 20–40%.", "**Patomechanizmy chorób jednogenowych** zależą od funkcji białka. **Enzym lub inhibitor**: fenyloketonuria (hydroksylaza fenyloalaniny), choroba Taya-Sachsa (heksozaminidaza A), SCID (deaminaza adenozyny), niedobór α1-antytrypsyny (rozedma), hemofilie (czynnik VIII i IX), niedobór G6PD (spadek NADPH i glutationu, hemoliza po lekach utleniających i bobie). **Receptor lub białko transdukcji sygnału**: zespół Larona (receptor GH), oporność na TSH, rzekoma niedoczynność przytarczyc (podjednostka Gsα), nerkowa moczówka prosta (receptor V2 w ok. 90%, akwaporyna 2 w ok. 10%), rodzinna hipercholesterolemia (receptor LDL, PCSK9, apoB). **Kanał jonowy**: mukowiscydoza (CFTR). **Czynnik transkrypcyjny lub receptor jądrowy**: SRY (dysgenezja gonad XY), PAX8 (wrodzona niedoczynność tarczycy), zespół niewrażliwości na androgeny (genotyp XY, fenotyp żeński, brak miesiączki), krzywica oporna na witaminę D (VDR). **Białko strukturalne**: osteogenesis imperfecta (kolagen I), zespół Marfana (fibrylina 1: wysoki wzrost, pajęcze palce, podwichnięcie soczewki, wypadanie płatka zastawki mitralnej, tętniak aorty wstępującej), hemoglobinopatie.", "**Typ mutacji a sposób dziedziczenia.** Mutacje dzieli się według mechanizmu molekularnego (delecja, substytucja, insercja, duplikacja, inwersja, translokacja), wpływu na kod (zmiana sensu, nonsens, przesunięcie ramki odczytu, zaburzenie składania) i efektu funkcjonalnego: amorficzne (pełna utrata funkcji), hipomorficzne (częściowa), **antymorficzne (dominujące negatywnie)** i neomorficzne (przyrost funkcji, zwykle dominujące). Utrata funkcji enzymu jest zwykle **recesywna**, bo 50% aktywności wystarcza. Utrata połowy białka strukturalnego daje chorobę już u heterozygoty (OI typu I, zespół Marfana). W **OI typu II** zmieniony łańcuch kolagenu unieczynnia też prawidłowe łańcuchy, przez co prawidłowego kolagenu jest o ok. 75% mniej i choroba jest letalna. **Rodzinna hipercholesterolemia** to dominacja niepełna: heterozygoty mają cholesterol 2–3 razy wyższy, a homozygoty 5–6 razy wyższy, z zawałami przed 20. r.ż. Jedynym przykładem pełnej dominacji jest **pląsawica Huntingtona** (ekspansja CAG > 34 w genie huntingtyny, zanik neuronów GABA-ergicznych prążkowia, początek w 40.–50. r.ż., **antycypacja**). **Mukowiscydoza** to najczęstsza ciężka choroba jednogenowa w północnej Europie (AR, nosiciele ≥ 5%). Opisano > 1500 mutacji CFTR. ΔF508 (ok. 70%) powoduje nieprawidłowe fałdowanie i degradację białka w siateczce, a skutki to zwiększone stężenie chlorków w pocie, gęsty śluz, niewydolność zewnątrzwydzielnicza trzustki i niepłodność męska. Większość chorych z chorobami recesywnymi to **heterozygoty złożone**. Pojęcia: **penetracja** (odsetek nosicieli z objawami) i **ekspresywność** (nasilenie objawów, np. nerwiakowłókniakowatość).", "**Dziedziczenie niemendlowskie** i choroby genomowe. **Piętnowanie genomowe** (*imprinting*, metylacja zależna od pochodzenia allelu) wyjaśnia, dlaczego mikrodelecja 15q11–13 na chromosomie **ojcowskim** daje **zespół Pradera-Willego** (hipotonia, hiperfagia, otyłość, hipogonadyzm, niepełnosprawność intelektualna), a na **matczynym** daje **zespół Angelmana** (ataksja, padaczka, napady śmiechu). Oba mogą też wynikać z **disomii jednorodzicielskiej**. **Ekspansja trójnukleotydów**: zespół łamliwego chromosomu X (CGG w regionie 5′ genu FMR1; u zdrowych ≤ 54 powtórzeń, premutacja do ok. 200, pełna mutacja > 200 prowadzi do metylacji i wyciszenia genu; najczęstsza dziedziczna przyczyna niepełnosprawności intelektualnej, makroorchidyzm, wydłużona twarz) oraz pląsawica Huntingtona. **Dziedziczenie mitochondrialne** przechodzi wyłącznie od matki, a objawy pojawiają się po przekroczeniu progu (ok. 85% zmutowanego mtDNA). **Choroby genomowe** wynikają z nieallelicznej rekombinacji homologicznej między powtórzeniami LCR: duplikacja PMP22 daje CMT1A, a delecja daje HNPP. Należą tu też mikrodelecje (zespół DiGeorge'a 22q11). Na fenotyp wpływa środowisko: **fenyloketonuria** (AR, 1–2/10 tys.) jest wykrywana w badaniu przesiewowym z kropli krwi z pięty i leczona dietą z ograniczeniem fenyloalaniny, a delecja CCR5 chroni przed zakażeniem HIV. Atopię (20–30% populacji) dziedziczy się wielogenowo. Ryzyko astmy u dziecka wynosi 3–6% bez obciążenia, 26–30% przy jednym rodzicu z atopią i ok. 50% przy obojgu. Geny identyfikowano przez klonowanie funkcjonalne i pozycyjne (DMD – dystrofina, Xp21), a dziś przez **NGS**."], "review": [{"h": "Genom i zmienność", "items": ["Genom ~3 mld nukleotydów, ~21–23 tys. genów kodujących białka; sekwencje kodujące **~1,5% DNA**", "DNA niekodujące: promotory, wzmacniacze, regiony chromatyny, geny niekodujących RNA, **transpozony (~1/3 DNA)**, telomery, centromery", "**Alternatywne składanie** → 80–100 tys. transkryptów; modyfikacje potranslacyjne → 250–300 tys. białek", "**mikroRNA** (20–24 nt) – wyciszanie ekspresji (hamowanie translacji); **lncRNA** (~200 nt) – regulacja", "~20% genów – geny metabolizmu podstawowego (*housekeeping*); ~80% – ekspresja tkankowo i czasowo swoista", "Ludzie identyczni w **99,5%** DNA; zmienność: **SNP** (~10 mln) i **CNV** (zmienność liczby kopii)", "Polimorfizm: częstość > 1% populacji; allel rzadki < 1%; o mutacji decyduje skutek fenotypowy", "Przewaga heterozygot: **HbS, talasemie, G6PD → malaria**; mukowiscydoza → zakażenia jelitowe; hemochromatoza → dżuma", "**Efekt założyciela** – wysoka częstość mutacji w izolowanych populacjach (np. ΔF508 u Finów)", "Grupa krwi 0 – częstsza choroba wrzodowa (H. pylori lepiej wiąże komórki bez antygenów A/B)"]}, {"h": "Choroby dziedziczne – podział i pojęcia", "items": ["**Dziedziczna ≠ wrodzona ≠ rodzinna**: pląsawica Huntingtona – dziedziczna, nie wrodzona; kiła wrodzona – wrodzona, nie dziedziczna; otyłość – często rodzinna bez tła dziedzicznego", "Mutacja **de novo** – ujemny wywiad rodzinny; mozaicyzm – mutacja we wczesnych podziałach zygoty", "~50% wczesnych poronień – aberracje chromosomowe; ~1% noworodków – wada genetyczna", "Choroby jednogenowe ~1,4% noworodków (2/3 AD); wielogenowe – znacznie częstsze", "Bliźnięta jednojajowe w chorobach złożonych – zgodność zwykle **20–40%**", "Aberracje: trisomia 21 (~1/700), Klinefelter 47,XXY (1/850 chłopców), Turner 45,X0 (1/2000–3000 dziewczynek), Edwards (trisomia 18), Patau (trisomia 13 – 1/15 tys.)", "Wady wielogenowe: wrodzona wada serca (8/1000), zwężenie odźwiernika, rozszczep kręgosłupa, rozszczep wargi/podniebienia, dysplazja stawu biodrowego, stopa końsko-szpotawa"]}, {"h": "Patomechanizmy chorób jednogenowych", "items": ["**Enzymy/inhibitory**: fenyloketonuria (hydroksylaza Phe), Tay-Sachs (heksozaminidaza A), SCID (deaminaza adenozyny), niedobór **α1-antytrypsyny** (rozedma, marskość), hemofilia A/B (cz. VIII/IX), **niedobór G6PD** (↓ NADPH → ↓ glutationu → hemoliza po lekach utleniających, bobie)", "**Receptory/transdukcja**: zespół **Larona** (receptor GH → brak IGF-1), oporność na TSH, **rzekoma niedoczynność przytarczyc** (Gsα – GNAS1), **nerkowa moczówka prosta** (receptor V2 ~90%, AQP2 ~10%), **rodzinna hipercholesterolemia** (receptor LDL, PCSK9, apoB)", "**Kanały**: mukowiscydoza – **CFTR** (kanał chlorkowy, 7q31)", "**Czynniki transkrypcyjne/receptory jądrowe**: **SRY** (dysgenezja gonad XY), **PAX8** (agenezja tarczycy, wady nerek), **zespół niewrażliwości na androgeny** (XY, fenotyp żeński, pierwotny brak miesiączki), krzywica oporna na witaminę D (VDR)", "**Białka strukturalne**: **osteogenesis imperfecta** (COL1A1/COL1A2 – złamania, niebieskie twardówki), **zespół Marfana** (fibrylina 1, 15q21 – wysoki wzrost, pajęcze palce, podwichnięcie soczewki, wypadanie płatka mitralnego, poszerzenie aorty wstępującej), niedokrwistość sierpowata (Glu6Val w łańcuchu β – jedyna choroba zależna od jednej mutacji punktowej), talasemia (↓ ilości łańcucha)"]}, {"h": "Mutacje i sposób dziedziczenia", "items": ["Mechanizm: delecja, substytucja, insercja, duplikacja, inwersja, translokacja", "Znaczenie: zmiana sensu, utrata sensu (kodon stop), **przesunięcie ramki**, zaburzenie składania", "Efekt: neutralna, **amorficzna** (pełna utrata), **hipomorficzna** (częściowa), **antymorficzna** (dominująca negatywnie), **neomorficzna** (przyrost funkcji – zwykle dominująca; geny fuzyjne → onkoproteiny)", "Enzymy – zwykle **recesywnie** (50% aktywności wystarcza); białka strukturalne – **dominująco** (OI typu I, Marfan); transportery – zwykle recesywnie", "**OI typu II** – mutacja antymorficzna: ↓ prawidłowego kolagenu o ~75% → postać letalna", "**Rodzinna hipercholesterolemia** – dominacja niepełna: heterozygoty cholesterol ×2–3, homozygoty ×5–6, zawał < 20. r.ż.", "**Kodominacja** – oba allele ujawniają się w heterozygocie (grupy krwi)", "Pełna dominacja – tylko **pląsawica Huntingtona** (homo- = heterozygoty)", "**Heterozygota złożona** – dwie różne mutacje w obu allelach tego samego genu (większość „homozygot” w chorobach AR)", "**Penetracja** – odsetek nosicieli z chorobą; **ekspresywność** – nasilenie fenotypu (np. nerwiakowłókniakowatość: od plam *café au lait* do licznych guzów)", "AD: przekazywanie pionowe, częste de novo, niepełna penetracja, zmienna ekspresywność; AR: heterozygoty bez objawów klinicznych, pełna penetracja"]}, {"h": "Mukowiscydoza i pląsawica Huntingtona", "items": ["Mukowiscydoza: **AR**, najczęstsza w płn. Europie, nosiciele **≥ 5%**; gen **CFTR** (kanał chlorkowy, domeny przezbłonowe, wiążące nukleotydy, regulatorowa – PKA/PKC)", "> 1500 mutacji; **ΔF508 (~70%)** – brak Phe508 → nieprawidłowa glikozylacja, białko nie opuszcza siateczki → degradacja", "Skutki: **↑ chlorków w pocie** (test potowy), gęsty śluz → rozstrzenie oskrzeli i zakażenia, **niewydolność zewnątrzwydzielnicza trzustki**, niedrożność nasieniowodów → niepłodność", "Mutacje łagodne (zmiana swoistości kanału) → lżejszy przebieg, zachowana czynność trzustki", "Pląsawica Huntingtona: **AD**, 4p16.3, **ekspansja CAG** (prawidłowo 11–34) w genie **huntingtyny** → fragment poliglutaminowy, agregaty, wtręty jądrowe", "Zanik neuronów **prążkowia** (jądro ogoniaste > skorupa; GABA, enkefaliny, substancja P); początek 40.–50. r.ż., ruchy pląsawicze, otępienie, zgon po ~15 latach", "**Antycypacja** – więcej powtórzeń w kolejnych pokoleniach → wcześniejszy początek; problem etyczny diagnostyki nosicieli"]}, {"h": "Dziedziczenie niemendlowskie i choroby genomowe", "items": ["**Piętnowanie genomowe** – epigenetyczne (metylacja) wyłączenie allelu zależnie od pochodzenia od matki/ojca", "Delecja 15q11–13 **ojcowska → Prader-Willi**: hipotonia, hiperfagia, otyłość, hipogonadyzm, niski wzrost, niepełnosprawność intelektualna", "Delecja 15q11–13 **matczyna → Angelman**: niepełnosprawność intelektualna, **ataksja, padaczka, napady śmiechu** („śmiejąca się lalka”)", "**Disomia jednorodzicielska**: oba chr. 15 od matki → Prader-Willi; oba od ojca → Angelman", "**Zespół łamliwego X**: gen **FMR1**, Xq27.3, **CGG** w regionie 5′ (zdrowi ≤ 54; premutacja do ~200; > 200 → metylacja promotora, wyciszenie); niepełnosprawność intelektualna, ADHD, autyzm, **makroorchidyzm**, wydłużona twarz, duże uszy", "**Dziedziczenie mitochondrialne** – wyłącznie od matki; objawy po przekroczeniu progu (~85% zmutowanego mtDNA)", "**Choroby genomowe** – niealleliczna rekombinacja homologiczna między LCR: **duplikacja PMP22 → CMT1A**, **delecja PMP22 → HNPP**; mikrodelecje (DiGeorge 22q11, Prader-Willi, Angelman)"]}, {"h": "Geny a środowisko, diagnostyka", "items": ["**Fenyloketonuria**: AR, hydroksylaza fenyloalaniny → ↑ Phe, kwas fenylopirogronowy; uszkodzenie OUN w pierwszych 6 mies., jasna karnacja (↓ melaniny), padaczka, wyprysk", "Przesiew noworodkowy (krew z pięty na bibule) → **dieta ubogofenyloalaninowa** → prawidłowy rozwój", "**Delecja CCR5** – oporność na zakażenie HIV (receptor wejścia wirusa)", "**Atopia** (20–30% populacji) – wielogenowa; ryzyko astmy u dziecka: 3–6% (brak obciążenia), 26–30% (jedno z rodziców), ~50% (oboje); zgodność u bliźniąt jednojajowych ~75%", "Klonowanie **funkcjonalne** (od białka do genu) vs **pozycyjne** (od lokalizacji do genu – np. **dystrofina**, Xp21, DMD)", "**DMD**: XR, chłopcy, postępujący zanik mięśni, **rzekomy przerost** (tkanka tłuszczowa), objaw Gowersa, zgon z niewydolności oddechowej", "Diagnostyka: RFLP, sekwencjonowanie, **NGS**, mikromacierze SNP (GWAS); OMIM – katalog > 7 tys. chorób jednogenowych"]}], "cards": [{"q": "Jaki odsetek ludzkiego DNA stanowią sekwencje kodujące białka?", "a": "Ok. **1,5%**; pozostałe ~98,5% to głównie sekwencje regulatorowe, geny niekodujących RNA, transpozony, telomery i centromery."}, {"q": "Jak z ok. 23 tys. genów powstaje 250–300 tys. białek?", "a": "Dzięki **alternatywnemu składaniu mRNA** (80–100 tys. transkryptów) i **modyfikacjom potranslacyjnym**."}, {"q": "Czym są mikroRNA i jaką pełnią funkcję?", "a": "Krótkie (20–24 nukleotydy) RNA kodowane w genomie, które **wyciszają ekspresję genów**, głównie hamując translację."}, {"q": "Czym różni się polimorfizm od mutacji?", "a": "Polimorfizm – zmiana sekwencji występująca u **> 1% populacji**, bez skutków chorobotwórczych; mutacja – zmiana **chorobotwórcza** (allel rzadki < 1%). Decyduje efekt fenotypowy."}, {"q": "Jakie są dwie najczęstsze formy zmienności ludzkiego DNA?", "a": "**SNP** – polimorfizmy jednego nukleotydu (~10 mln) i **CNV** – zmienność liczby kopii długich sekwencji."}, {"q": "Podaj przykłady przewagi selekcyjnej heterozygot.", "a": "**HbS, talasemie, niedobór G6PD** – ochrona przed malarią; **mukowiscydoza** – przed zakażeniami jelitowymi Gram(−); **hemochromatoza** – przed dżumą."}, {"q": "Czym jest efekt założyciela?", "a": "Wysoka częstość danej mutacji w populacji wywodzącej się od małej, izolowanej grupy przodków (np. ΔF508 u Finów, choroby u Afrykanerów)."}, {"q": "Dlaczego choroba wrzodowa jest częstsza u osób z grupą krwi 0?", "a": "*H. pylori* wykazuje większe powinowactwo do komórek nabłonka żołądka i dwunastnicy **pozbawionych antygenów A i B**."}, {"q": "Podaj przykład choroby dziedzicznej, która nie jest wrodzona, i wrodzonej, która nie jest dziedziczna.", "a": "Dziedziczna, nie wrodzona: **pląsawica Huntingtona** (ujawnia się w 40.–50. r.ż.). Wrodzona, nie dziedziczna: **kiła wrodzona**, wrodzone zakażenie HIV."}, {"q": "Jaki odsetek wczesnych poronień samoistnych wynika z aberracji chromosomowych?", "a": "Ok. **50%**."}, {"q": "Jaka jest zgodność występowania chorób złożonych u bliźniąt jednojajowych?", "a": "Znacznie wyższa niż u dwujajowych, ale zwykle tylko **20–40%** (nie 100%) – udział środowiska."}, {"q": "Jaki jest patomechanizm niedoboru G6PD?", "a": "Brak dehydrogenazy glukozo-6-fosforanu → **↓ NADPH → ↓ zredukowanego glutationu** → mniejsza odporność erytrocytów na stres oksydacyjny → hemoliza po lekach utleniających (np. przeciwmalarycznych) lub bobie."}, {"q": "Jaki jest mechanizm rozedmy w niedoborze α1-antytrypsyny?", "a": "Brak inhibitora **elastazy neutrofilowej** → niekontrolowane niszczenie elastyny ścian pęcherzyków płucnych (dodatkowo marskość wątroby)."}, {"q": "Czym jest zespół Larona?", "a": "Mutacja **receptora GH** – mimo obecności GH wątroba nie wytwarza **IGF-1** → niskorosłość."}, {"q": "Jaka jest przyczyna rzekomej niedoczynności przytarczyc?", "a": "Mutacja genu **podjednostki α białka Gs (GNAS1)** współpracującego z receptorem PTH → brak wzrostu cAMP i brak tkankowych efektów PTH."}, {"q": "Jakie mutacje powodują nerkową moczówkę prostą?", "a": "Mutacje **receptora wazopresyny V2** (~90%, sprzężone z X) lub **akwaporyny 2** (~10%, AR) → brak zagęszczania moczu."}, {"q": "Jakie geny mogą być zmutowane w rodzinnej hipercholesterolemii?", "a": "Gen **receptora LDL** (najczęściej), **PCSK9** (degradacja receptora), **APOB** → upośledzony wychwyt LDL przez wątrobę."}, {"q": "Czym jest zespół niewrażliwości na androgeny?", "a": "Mutacja **receptora androgenowego** – osoba 46,XY z czynnymi jądrami ma **żeński fenotyp** (aromatyzacja testosteronu → rozwój piersi); diagnozowana z powodu **pierwotnego braku miesiączki**."}, {"q": "Jaka mutacja wywołuje zespół Marfana i jakie są jego objawy?", "a": "Mutacja genu **fibryliny 1** (15q21, AD). Wysoki wzrost, długie kończyny i **pajęcze palce**, nadmierna ruchomość stawów, zniekształcenie klatki, **podwichnięcie soczewek**, wypadanie płatka zastawki mitralnej, **poszerzenie/tętniak aorty wstępującej**."}, {"q": "Która choroba zależy tylko od jednego rodzaju mutacji punktowej?", "a": "**Niedokrwistość sierpowata** – zamiana kwasu glutaminowego na **walinę w pozycji 6** łańcucha β globiny."}, {"q": "Czym jest mutacja antymorficzna (dominująca negatywnie)?", "a": "Zmutowane białko łączy się z prawidłowym (polimer) i **unieczynnia je** – utrata funkcji większa niż przy braku jednego allelu (np. **OI typu II**)."}, {"q": "Dlaczego mutacje genów enzymów są zwykle recesywne, a białek strukturalnych dominujące?", "a": "Dla enzymu **50% aktywności zwykle wystarcza** (heterozygota zdrowa); utrata połowy **białka strukturalnego** (kolagen, fibrylina) daje już objawy u heterozygoty."}, {"q": "Czym różni się osteogenesis imperfecta typu I od typu II?", "a": "**Typ I** – mutacja amorficzna/hipomorficzna COL1A1 → **o połowę mniej** prawidłowego kolagenu: złamania bez deformacji, niebieskie twardówki. **Typ II** – mutacja antymorficzna → **↓ ~75%** kolagenu, ciężkie deformacje, postać letalna."}, {"q": "Jak dziedziczy się rodzinną hipercholesterolemię i jak różnią się heterozygoty od homozygot?", "a": "**Dominacja niepełna**: heterozygoty – cholesterol **×2–3**, przedwczesna miażdżyca; homozygoty – **×5–6**, miażdżyca u nastolatków, zawały przed 20. r.ż."}, {"q": "Która choroba jest jedynym znanym przykładem pełnej dominacji?", "a": "**Pląsawica Huntingtona** – fenotyp homo- i heterozygot nie różni się."}, {"q": "Jaki jest mechanizm genetyczny pląsawicy Huntingtona?", "a": "**AD**, ekspansja trójnukleotydów **CAG** (prawidłowo 11–34) w genie **huntingtyny** (4p16.3) → wydłużony fragment poliglutaminowy, toksyczne agregaty → zanik neuronów **prążkowia**."}, {"q": "Czym jest antycypacja genetyczna?", "a": "Ujawnianie się choroby w kolejnych pokoleniach **wcześniej, z cięższym przebiegiem** lub wyższą penetracją – wynik narastania liczby powtórzeń trójnukleotydów (Huntington, łamliwy X)."}, {"q": "Czym różni się penetracja od ekspresywności genu?", "a": "**Penetracja** – odsetek nosicieli mutacji, u których choroba się ujawnia; **ekspresywność** – nasilenie objawów u chorych."}, {"q": "Co to jest heterozygota złożona?", "a": "Osoba z **dwiema różnymi mutacjami** w obu allelach tego samego genu – czynnościowo zachowuje się jak homozygota (typowe w chorobach AR, np. mukowiscydozie)."}, {"q": "Jaka jest najczęstsza mutacja w mukowiscydozie i jaki jest jej skutek?", "a": "**ΔF508** (~70%) – delecja fenyloalaniny 508 → nieprawidłowa glikozylacja, białko CFTR nie przechodzi z siateczki do aparatu Golgiego i ulega **degradacji**."}, {"q": "Jakie są skutki kliniczne mukowiscydozy?", "a": "**↑ chlorków w pocie** (diagnostyka), gęsty śluz → zaczopowanie oskrzeli, zakażenia, rozstrzenie; **niewydolność zewnątrzwydzielnicza trzustki**; niedrożność nasieniowodów → **niepłodność męska**."}, {"q": "Czym jest piętnowanie genomowe?", "a": "Epigenetyczne (metylacja) **wyłączenie ekspresji allelu zależnie od tego, czy pochodzi od matki, czy od ojca**."}, {"q": "Kiedy delecja 15q11–13 daje zespół Pradera-Willego, a kiedy Angelmana?", "a": "Delecja na chromosomie **ojcowskim → Prader-Willi**; na **matczynym → Angelman**."}, {"q": "Jakie są objawy zespołu Pradera-Willego?", "a": "Niepełnosprawność intelektualna, **hipotonia**, niedobór wzrostu, **hiperfagia i otyłość**, **hipogonadyzm**."}, {"q": "Jakie są objawy zespołu Angelmana?", "a": "Niepełnosprawność intelektualna, **ataksja**, **padaczka**, napady **nieadekwatnego śmiechu** („śmiejąca się lalka”)."}, {"q": "Jak disomia jednorodzicielska może wywołać zespół Pradera-Willego?", "a": "Gdy **oba chromosomy 15 pochodzą od matki** – oba allele są napiętnowane (nieczynne), brak czynnego allelu ojcowskiego (mimo braku delecji)."}, {"q": "Jaki jest mechanizm zespołu łamliwego chromosomu X?", "a": "Ekspansja **CGG** w regionie 5′ genu **FMR1** (Xq27.3): zdrowi ≤ 54, premutacja do ~200, **> 200 → metylacja promotora i wyciszenie genu**."}, {"q": "Jakie są cechy kliniczne zespołu łamliwego X?", "a": "Niepełnosprawność intelektualna (najczęstsza dziedziczna przyczyna), nadaktywność, cechy autystyczne, **makroorchidyzm**, wydłużona twarz, duże uszy."}, {"q": "Jak dziedziczą się choroby mitochondrialne?", "a": "**Wyłącznie od matki** (mitochondria komórki jajowej); objawy pojawiają się po przekroczeniu progu (~85% zmutowanego mtDNA), często później w życiu."}, {"q": "Czym są choroby genomowe? Podaj przykład.", "a": "Choroby wynikające ze **zmiany dawki genu** przez delecje/duplikacje powstałe w nieallelicznej rekombinacji między powtórzeniami LCR – np. **duplikacja PMP22 → CMT1A**, **delecja PMP22 → HNPP**."}, {"q": "Jak wykrywa się i leczy fenyloketonurię?", "a": "**Przesiew noworodkowy** (krew z pięty na bibule) → **dieta ubogofenyloalaninowa** (hydrolizaty białkowe) – zapobiega uszkodzeniu OUN."}, {"q": "Dlaczego chorzy z nieleczoną fenyloketonurią mają jasną karnację?", "a": "Zaburzony metabolizm fenyloalaniny (brak tyrozyny) upośledza **syntezę melaniny**."}, {"q": "W jaki sposób mutacja CCR5 chroni przed AIDS?", "a": "CCR5 jest koreceptorem wejścia **HIV** do limfocytów T; nieprawidłowe białko uniemożliwia wniknięcie i replikację wirusa."}, {"q": "Jakie jest ryzyko astmy alergicznej u dziecka zależnie od atopii rodziców?", "a": "Bez obciążenia **3–6%**, jedno z rodziców **26–30%**, oboje **~50%**."}, {"q": "Jakie są cechy dystrofii mięśniowej Duchenne'a?", "a": "**XR** (chłopcy), mutacja **dystrofiny** (Xp21); postępujący zanik mięśni od kończyn dolnych, **rzekomy przerost** (tłuszcz), wstawanie z podpieraniem o uda (objaw Gowersa), zgon z niewydolności oddechowej."}, {"q": "Czym różni się klonowanie funkcjonalne od pozycyjnego?", "a": "**Funkcjonalne** – od znanego białka do genu; **pozycyjne** (genetyka odwrotna) – od lokalizacji chromosomowej sprzężonej z chorobą do genu (np. dystrofina)."}], "sources": []}, {"id": "z-nowotw", "num": "2", "title": "Nowotwory", "summary": ["**Nowotwór** powstaje, gdy klon komórek wymyka się mechanizmom kontroli proliferacji i apoptozy. Rozrost jest **autonomiczny** i zwykle **monoklonalny**. Do powstania guza sama transformacja nie wystarcza: potrzebna jest też ucieczka spod nadzoru immunologicznego i **angiogeneza**. Cechy nowotworu złośliwego to niezależność od sygnałów wzrostu, niewrażliwość na inhibitory wzrostu, oporność na apoptozę i **anoikis**, nieograniczony potencjał replikacyjny (**reaktywacja telomerazy**), angiogeneza (VEGF, FGF), inwazja i przerzuty, przestawienie metabolizmu na glikolizę (**efekt Wa
