 błony naczyniowej oka."}, {"q": "Z jakimi chorobami wiążą się HLA-DR3 i DR4?", "a": "**DR3** – celiakia, choroba Gravesa, cukrzyca typu 1; **DR4** – reumatoidalne zapalenie stawów."}, {"q": "Jakie cytokiny są głównymi induktorami białek ostrej fazy?", "a": "**IL-6**, IL-1, **TNF-α** (i IFN-γ)."}, {"q": "Które białka ostrej fazy rosną najbardziej, a które maleją?", "a": "**CRP i SAA** – ponad 1000-krotnie; haptoglobina i fibrynogen > 100×; **albumina maleje** (ujemne białko ostrej fazy)."}, {"q": "Podaj przykłady leków anty-TNF i mechanizm etanerceptu.", "a": "Przeciwciała: **infliksymab, adalimumab, golimumab**; **etanercept** – białko fuzyjne, „fałszywy” rozpuszczalny receptor TNF-α."}, {"q": "Jak działa abatacept?", "a": "Białko fuzyjne **CTLA-4-Ig** – blokuje **kostymulację** (CD80/86–CD28) i aktywację limfocytów T."}, {"q": "Jak działają inhibitory JAK i podaj przykłady.", "a": "Hamują kinazy janusowe w szlaku **JAK-STAT** przekazującym sygnał z receptorów cytokin – **tofacytynib, barycytynib, upadacytynib**, ruksolitynib."}, {"q": "Jakie są trzy drogi aktywacji dopełniacza i co je zapoczątkowuje?", "a": "**Klasyczna** – kompleksy z IgG/IgM (C1q), ciałka apoptotyczne, CRP; **lektynowa** – MBL wiążąca cukry bakterii; **alternatywna** – samoistna hydroliza C3 na powierzchni drobnoustrojów (czynnik B, properdyna)."}, {"q": "Jakie są efekty aktywacji dopełniacza?", "a": "**Opsonizacja (C3b)**, **anafilatoksyny (C3a, C5a)** – przepuszczalność, chemotaksja, **liza (MAC, C5b–C9)**, usuwanie kompleksów immunologicznych."}, {"q": "Jak prezentowane są antygeny wewnątrz- i zewnątrzkomórkowe?", "a": "**Wewnątrzkomórkowe** (wirusy) – z **MHC I** limfocytom **CD8+**; **zewnątrzkomórkowe** (sfagocytowane) – z **MHC II** limfocytom **CD4+**."}, {"q": "Czym są superantygeny?", "a": "Antygeny aktywujące limfocyty T **bez przetwarzania i typowej prezentacji** przez komórki prezentujące antygen – masowa aktywacja limfocytów."}, {"q": "Która immunoglobulina przechodzi przez łożysko, a która jest pentamerem?", "a": "Przez łożysko – **IgG**; pentamer – **IgM** (pierwsza klasa w odpowiedzi pierwotnej)."}, {"q": "Jaka immunoglobulina dominuje w wydzielinach?", "a": "**IgA** (ślina, mleko, wydzieliny dróg oddechowych i moczowo-płciowych) – 15–20% Ig."}, {"q": "Jaka jest rola IgE i gdzie występuje?", "a": "Śladowo w surowicy; związana z **mastocytami i bazofilami**; obrona przed pasożytami i reakcje alergiczne (typ I)."}, {"q": "Jakie są klasyczne objawy zapalenia?", "a": "**Zaczerwienienie, obrzęk, ocieplenie, ból** oraz **upośledzenie funkcji**."}, {"q": "Czym różni się COX-1 od COX-2?", "a": "**COX-1** – konstytutywna, m.in. prostaglandyny ochraniające śluzówkę żołądka; **COX-2** – indukowana przez czynniki prozapalne."}, {"q": "Jakie przeciwstawne działania mają prostacyklina i tromboksan?", "a": "**Prostacyklina** (śródbłonek) – rozszerza naczynia, hamuje agregację płytek; **tromboksan** – kurczy naczynia i agreguje płytki."}, {"q": "Jakie działanie ma leukotrien B4?", "a": "Zwiększa **przyleganie leukocytów** do śródbłonka, przepuszczalność naczyń i chemotaksję."}, {"q": "Jakie są efekty pobudzenia receptorów histaminowych H1 i H2?", "a": "**H1** – ↑ przepuszczalności żyłek, rozszerzenie naczyń, skurcz oskrzeli i jelit, ↑ śluzu. **H2** – ↑ wydzielania soku żołądkowego, wpływ na limfocyty T."}, {"q": "Co hamuje metaloproteinazy macierzy?", "a": "**TIMP** – tkankowe inhibitory metaloproteinaz."}, {"q": "Jaki jest mechanizm nadwrażliwości typu I?", "a": "Alergen mostkuje **IgE** związane z receptorem FcεRI na **mastocytach** → degranulacja (histamina, cytokiny, leukotrieny) – katar sienny, astma, anafilaksja."}, {"q": "Podaj przykłady nadwrażliwości typu II.", "a": "Reakcja na przetoczenie niezgodnej krwi, **choroba hemolityczna noworodka**, AIHA, **zespół Goodpasture'a**, miastenia, choroba Gravesa."}, {"q": "Podaj przykłady nadwrażliwości typu III.", "a": "**Choroba posurowicza**, **toczeń rumieniowaty układowy**, krioglobulinemia w zakażeniu HCV, bakteryjne zapalenie wsierdzia."}, {"q": "Jakie są podtypy nadwrażliwości typu IV?", "a": "**Kontaktowy** (wyprysk kontaktowy – hapteny), **tuberkulinowy** (odczyn po PPD), **ziarniniakowy** (gruźlica, trąd, sarkoidoza, choroba Crohna)."}, {"q": "Czym różni się ziarniniak immunologiczny od ziarniniaka wokół ciała obcego?", "a": "Immunologiczny zawiera komórki nabłonkowate, makrofagi i **limfocyty**; nieimmunologiczny (ciało obce) – **nie zawiera limfocytów**."}, {"q": "Jakie są mechanizmy rozwoju autoimmunizacji?", "a": "Niepełna eliminacja autoreaktywnych klonów w grasicy, ujawnienie **antygenów ukrytych**, **mimikra antygenowa**, bezpośrednia stymulacja limfocytów B; predyspozycja HLA."}, {"q": "Jakie autoprzeciwciała są najbardziej swoiste dla tocznia?", "a": "**Anty-dsDNA** (natywne DNA) i **anty-Sm**; przeciwciała antyhistonowe – toczeń polekowy."}, {"q": "Jakie leki biologiczne stosuje się w toczniu?", "a": "**Rytuksymab** (anty-CD20), **belimumab** (anty-BLyS/BAFF), **anifrolumab** (receptor IFN typu I); podstawą – hydroksychlorochina, GKS, immunosupresja."}, {"q": "Czym jest czynnik reumatoidalny i czy jest swoisty dla RZS?", "a": "Autoprzeciwciało (najczęściej IgM) przeciw **fragmentowi Fc IgG** – **nieswoiste**; bardziej swoiste dla RZS są **przeciwciała anty-CCP** (przeciw peptydom cytrulinowanym)."}, {"q": "Jakie autoprzeciwciała są charakterystyczne dla twardziny układowej?", "a": "**Anty-Scl-70** (topoizomeraza I) – postać uogólniona; **antycentromerowe** – postać ograniczona; anty-RNAP III; PM-Scl – zespół nakładania z zapaleniem mięśni."}, {"q": "Jakie przeciwciała wskazują na zespół antysyntetazowy?", "a": "**Anty-Jo-1** (syntetaza histydylo-tRNA), także PL-7, PL-12 – zapalenie mięśni + śródmiąższowe zapalenie płuc."}, {"q": "Jakie są ANCA i z czym się wiążą?", "a": "Autoprzeciwciała przeciw antygenom cytoplazmy neutrofili: **c-ANCA (PR3)** – ziarniniakowatość z zapaleniem naczyń (Wegener); **p-ANCA (MPO)** – mikroskopowe zapalenie naczyń, EGPA."}, {"q": "Jak dzieli się układowe zapalenia naczyń?", "a": "Według kalibru: **duże** (Takayasu, olbrzymiokomórkowe, Behçet), **średnie** (guzkowe zapalenie tętnic, Kawasaki), **małe** (GPA, EGPA, MPA, krioglobulinemia, leukoklastyczne)."}, {"q": "Jakie przeciwciała występują w chorobie Hashimoto i Gravesa?", "a": "**Hashimoto** – anty-TPO i anty-tyreoglobulina; **Graves** – przeciwciała **pobudzające receptor TSH (TSI/TRAb)**."}, {"q": "Jakie choroby wchodzą w skład APS-1 i APS-2?", "a": "**APS-1**: Addison + niedoczynność przytarczyc + kandydoza błon śluzowych (+ zapalenie wątroby, niedokrwistość złośliwa). **APS-2**: Addison + cukrzyca typu 1 + autoimmunologiczne choroby tarczycy."}, {"q": "Przeciw czemu skierowane są przeciwciała w miastenii i zespole Lamberta-Eatona?", "a": "**Miastenia** – przeciw **receptorowi acetylocholiny** (~90%); **Lambert-Eaton** – przeciw presynaptycznym **kanałom wapniowym**."}, {"q": "Jakie zakażenia są typowe dla niedoborów limfocytów B, a jakie dla T?", "a": "**B** – nawracające zakażenia **bakteriami otoczkowymi** (ropotwórczymi). **T** – **zakażenia oportunistyczne**, uogólnione zakażenia po szczepionkach żywych (BCG)."}, {"q": "Jaki defekt powoduje agammaglobulinemię Brutona?", "a": "Mutacja genu **kinazy tyrozynowej Brutona (BTK)** na chromosomie X → brak dojrzewania limfocytów B."}, {"q": "Jaki jest najczęstszy pierwotny niedobór odporności?", "a": "**Izolowany niedobór IgA** (ogólnie 50–65% pierwotnych niedoborów dotyczy przeciwciał)."}, {"q": "Jaki jest mechanizm przewlekłej choroby ziarniniakowej?", "a": "Niedobór **oksydazy NADPH** → fagocyty nie wytwarzają rodników tlenowych → bakterie przeżywają w fagocytach → **ropnie i ziarniniaki**."}, {"q": "Jaka jest przyczyna LAD (upośledzonej adhezji leukocytów)?", "a": "Mutacja genu **łańcucha β integryny (CD18)** receptora CR3 → brak adhezji i fagocytozy opsonizowanych bakterii → zakażenia ropne."}, {"q": "Jaki niedobór dopełniacza wykrywa się najczęściej i co powoduje?", "a": "Niedobór **inhibitora C1-esterazy** → **wrodzony obrzęk naczynioruchowy**."}, {"q": "Jak HIV infekuje limfocyty?", "a": "Glikoproteina otoczki **gp120** wiąże **CD4** (+ koreceptor CCR5/CXCR4) → zakażenie i zniszczenie limfocytów T pomocniczych."}, {"q": "Jak działają cyklosporyna i takrolimus?", "a": "Hamują **kalcyneurynę** → brak aktywacji czynnika transkrypcyjnego **NF-AT** → ↓ syntezy **IL-2** i aktywacji limfocytów T."}, {"q": "Jak działają azatiopryna i mykofenolan mofetylu?", "a": "**Azatiopryna** – hamuje syntezę puryn; **mykofenolan** – inhibitor **dehydrogenazy monofosforanu inozyny** (synteza guanozyny) – antyproliferacyjnie na limfocyty."}, {"q": "Czym są choroby autozapalne?", "a": "Genetyczne defekty białek regulujących **odporność wrodzoną** (np. inflamasomopatie z ↑ IL-1β i IL-18, TRAPS) – nawracające gorączki i zapalenie bez zakażenia, nie reagują na antybiotyki."}, {"q": "Czym są antygeny onkopłodowe? Podaj przykłady.", "a": "Białka obecne fizjologicznie w życiu płodowym, a ponownie wytwarzane przez odróżnicowane komórki nowotworowe – **AFP**, **CEA**."}, {"q": "Czym jest terapia CAR-T?", "a": "Limfocyty T chorego modyfikowane genetycznie, by wyrażały **chimeryczny receptor antygenowy** (rozpoznanie antygenu + aktywacja), namnażane in vitro i podawane choremu."}, {"q": "Jakie zalety mają szczepionki mRNA?", "a": "Nie zawierają materiału zakaźnego, **mRNA nie wnika do jądra**, antygen powstaje wewnątrzkomórkowo – dobra stymulacja odporności **komórkowej i humoralnej**; podawane w nanocząstkach lipidowych."}], "sources": []}]}]}</script>
<script>
(function(){
const ALL = JSON.parse(document.getElementById('data').textContent);
let BI = 0; let DATA = ALL.books[0];
const P = () => '#b' + BI + '/';
const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const crumb = document.getElementById('crumb');
const LS_KEY = 'fiszki-pediatria-v1';

// ---------- icons ----------
const I = {
  shuffle:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
  filter:'<path d="M3 5h18M6 12h12M10 19h4"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  flip:'<path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  play:'<path d="M6 4l14 8-14 8z"/>',
  redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',
  tap:'<path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v1M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L4 14.5a2 2 0 0 1 3.3-2.3L9 14"/>'
};
const ic = (n, s) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${s?` style="width:${s}px;height:${s}px"`:''}>${I[n]}</svg>`;

// ---------- storage (best effort) ----------
let known = {};
try { known = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch(e){ known = {}; }
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(known)); } catch(e){} }
let theme = null;
try { theme = localStorage.getItem(LS_KEY+'-theme'); } catch(e){}
if (theme) document.documentElement.setAttribute('data-theme', theme);
function syncThemeColor(){
  const dark = (document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light')) === 'dark';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0c10' : '#eceef2';
}
syncThemeColor();
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_KEY+'-theme', next); } catch(e){}
  syncThemeColor();
};

// ---------- helpers ----------
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
const cardId = (ci, i) => DATA.chapters[ci].id + ':' + i;
function stats(cis){
  let n=0,k=0,u=0;
  cis.forEach(ci => { const c = DATA.chapters[ci]; for (let i=0;i<c.cards.length;i++){ n++; const s=known[cardId(ci,i)]; if(s==='k')k++; else if(s==='u')u++; } });
  return {n,k,u,nw:n-k-u};
}
const allIdx = () => DATA.chapters.map((_,i)=>i);
function pbar(s, cls){
  const pc = x => s.n ? (100*x/s.n) : 0;
  return `<div class="pbar ${cls||''}" role="img" aria-label="Umiem ${s.k}, do powtórki ${s.u}, nowe ${s.nw} z ${s.n}"><i class="k" style="width:${pc(s.k)}%"></i><i class="u" style="width:${pc(s.u)}%"></i></div>`;
}
function legend(s){
  return `<div class="legend num-tab"><span><i class="dot k"></i>umiem <b>${s.k}</b></span><span><i class="dot u"></i>do powtórki <b>${s.u}</b></span><span><i class="dot"></i>nowe <b>${s.nw}</b></span></div>`;
}
function plural(n, one, few, many){ const a=n%10, b=n%100; if(n===1) return one; if(a>=2&&a<=4&&!(b>=12&&b<=14)) return few; return many; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// ---------- routing ----------
function go(hash){ if (location.hash !== hash) location.hash = hash; else render(); }
window.addEventListener('hashchange', render);
backBtn.onclick = () => go(P());
document.getElementById('logo').onclick = () => go(P());

function render(){
  let h = location.hash.replace(/^#/, '');
  window.scrollTo(0,0);
  document.onkeydown = null;
  const bm = h.match(/^b(\d+)\/?(.*)$/);
  if (bm && ALL.books[+bm[1]]) { BI = +bm[1]; h = bm[2]; }
  DATA = ALL.books[BI];
  if (!h) return renderHome();
  const m = h.match(/^r\/(\d+)(?:\/(\w+))?$/);
  if (m && DATA.chapters[+m[1]]) return renderChapter(+m[1], m[2] || 'summary');
  if (h === 'all') return renderDeck(null);
  if (h === 'hard') { deckState.onlyUnknown = true; return renderDeck(null); }
  renderHome();
}

// ---------- home ----------
function renderHome(){
  backBtn.classList.add('hidden');
  crumb.textContent = '';
  document.title = 'Fiszki – ' + (DATA.short || '');
  const s = stats(allIdx());
  const toLearn = s.n - s.k;
  app.innerHTML = '';
  const home = el('<div class="home"></div>');
  const tabs = ALL.books.length > 1 ? `<div class="seg" role="tablist" aria-label="Przedmiot">${ALL.books.map((bk,i)=>`<button role="tab" data-b="${i}" aria-selected="${i===BI}">${esc(bk.short)}</button>`).join('')}</div>` : '';
  const book = el(`<section class="book">
    ${tabs}
    <h1>${esc(DATA.title)}</h1>
    <p class="sub">${esc(DATA.subtitle||'')}</p>
    <div class="prog">
      <div class="prog-top"><strong>Twój postęp</strong><span class="num-tab">${s.k} / ${s.n} ${plural(s.n,'fiszka','fiszki','fiszek')}</span></div>
      ${pbar(s)}
      ${legend(s)}
      <div class="actions">
        <button class="btn btn-lime" id="allBtn">${ic('play',16)}Ucz się: wszystkie fiszki</button>
        <button class="btn btn-line" id="hardBtn" ${toLearn?'':'disabled'}>Tylko nieopanowane <span class="num-tab" style="color:var(--muted)">${toLearn}</span></button>
      </div>
    </div>
    ${DATA.note ? `<p class="note">${esc(DATA.note)}</p>` : ''}
    <button class="link" id="resetBtn">Wyzeruj postęp w tym przedmiocie</button>
  </section>`);
  book.querySelectorAll('[data-b]').forEach(b => b.onclick = () => go('#b'+b.dataset.b+'/'));
  book.querySelector('#allBtn').onclick = () => { deckState.onlyUnknown = false; go(P()+'all'); };
  book.querySelector('#hardBtn').onclick = () => { deckState.onlyUnknown = true; go(P()+'all'); };
  const rb = book.querySelector('#resetBtn');
  rb.onclick = () => {
    if (rb.dataset.armed) {
      const ids = new Set(DATA.chapters.map(c=>c.id));
      Object.keys(known).forEach(k=>{ if (ids.has(k.split(':')[0])) delete known[k]; });
      save(); renderHome();
    } else {
      rb.dataset.armed = '1'; rb.classList.add('danger'); rb.textContent = 'Na pewno? Kliknij ponownie, aby wyzerować';
      setTimeout(()=>{ if(rb.isConnected){ delete rb.dataset.armed; rb.classList.remove('danger'); rb.textContent='Wyzeruj postęp w tym przedmiocie'; } }, 4000);
    }
  };
  home.appendChild(book);

  const list = el(`<section class="chapters" aria-labelledby="chh"><div class="chapters-h"><h2 id="chh">Rozdziały</h2><span>${DATA.chapters.length}</span></div></section>`);
  DATA.chapters.forEach((c,ci)=>{
    const cs = stats([ci]);
    const r = el(`<button class="row${cs.n && cs.k===cs.n ? ' done':''}">
      <span class="n">${esc(c.num)}</span>
      <span class="t"><b>${esc(c.title)}</b>
        <span class="meta num-tab">${pbar(cs,'thin')}<span>${cs.k}/${cs.n}</span></span></span>
      <span class="chev">${ic('right')}</span>
    </button>`);
    r.onclick = () => go(P()+'r/'+ci);
    list.appendChild(r);
  });
  home.appendChild(list);
  app.appendChild(home);
}

// ---------- chapter ----------
function renderChapter(ci, tab){
  const c = DATA.chapters[ci];
  backBtn.classList.remove('hidden');
  crumb.textContent = DATA.short + ' · ' + c.num;
  document.title = c.title + ' – fiszki';
  app.innerHTML = '';
  const wrap = el(`<div class="chap${tab==='cards'?' compact':''}">
    <div class="chap-h"><span class="n">${esc(c.num)}</span><h1>${esc(c.title)}</h1></div>
    <div class="seg" role="tablist" aria-label="Widok rozdziału">
      <button role="tab" data-t="summary">Streszczenie</button>
      <button role="tab" data-t="review">Powtórka</button>
      <button role="tab" data-t="cards">Fiszki <span class="num-tab" style="opacity:.6;font-weight:500">${c.cards.length}</span></button>
    </div></div>`);
  wrap.querySelectorAll('[data-t]').forEach(b=>{
    b.setAttribute('aria-selected', b.dataset.t===tab);
    b.onclick = () => go(P()+'r/'+ci+'/'+b.dataset.t);
  });
  app.appendChild(wrap);
  const body = el('<div></div>'); wrap.appendChild(body);
  if (tab==='summary'){
    body.appendChild(el(`<div class="prose">${c.summary.map(p=>`<p>${md(p)}</p>`).join('')}</div>`));
    if (c.sources && c.sources.length) body.appendChild(el(`<div class="srcs"><h2>Źródła</h2><ul>${c.sources.map(x=>`<li><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a></li>`).join('')}</ul></div>`));
    const nb = el(`<div class="next"><button class="btn btn-line">Powtórka</button><button class="btn btn-lime">Fiszki ${ic('right')}</button></div>`);
    nb.children[0].onclick=()=>go(P()+'r/'+ci+'/review'); nb.children[1].onclick=()=>go(P()+'r/'+ci+'/cards');
    body.appendChild(nb);
  } else if (tab==='review'){
    body.appendChild(el(`<div class="rev">${c.review.map(s=>`<section><h2>${esc(s.h)}</h2><ul>${s.items.map(i=>`<li>${md(i)}</li>`).join('')}</ul></section>`).join('')}</div>`));
    const nb = el(`<div class="next one"><button class="btn btn-lime">Przejdź do fiszek ${ic('right')}</button></div>`);
    nb.children[0].onclick=()=>go(P()+'r/'+ci+'/cards');
    body.appendChild(nb);
  } else {
    renderDeck(ci, body);
  }
}

// ---------- deck ----------
const deckState = { onlyUnknown:false, shuffled:false };
function renderDeck(ci, mount){
  if (!mount){
    backBtn.classList.remove('hidden');
    crumb.textContent = DATA.short + ' · wszystkie rozdziały';
    document.title = 'Fiszki – ' + DATA.short;
    app.innerHTML=''; mount = el('<div class="deck solo"></div>'); app.appendChild(mount);
  } else {
    const d = el('<div class="deck"></div>'); mount.appendChild(d); mount = d;
  }
  const chs = ci===null ? allIdx() : [ci];
  let pool = [];
  chs.forEach(k => DATA.chapters[k].cards.forEach((card,i)=>pool.push({ci:k,i,card})));
  let order, pos=0;
  function build(){
    order = pool.filter(x => !deckState.onlyUnknown || known[cardId(x.ci,x.i)]!=='k');
    if (deckState.shuffled) shuffle(order);
    pos = 0;
  }
  build();
  const head = el(`<div>
    <div class="deck-h">
      <button class="chip" id="shBtn" aria-pressed="${deckState.shuffled}">${ic('shuffle')}Tasuj</button>
      <button class="chip" id="unBtn" aria-pressed="${deckState.onlyUnknown}">${ic('filter')}Tylko nieopanowane</button>
      <span class="count" id="cnt" aria-live="polite"></span>
    </div><div id="bar"></div></div>`);
  mount.appendChild(head);
  const area = el('<div></div>'); mount.appendChild(area);
  head.querySelector('#shBtn').onclick = e => { deckState.shuffled=!deckState.shuffled; e.currentTarget.setAttribute('aria-pressed',deckState.shuffled); build(); show(); };
  head.querySelector('#unBtn').onclick = e => { deckState.onlyUnknown=!deckState.onlyUnknown; e.currentTarget.setAttribute('aria-pressed',deckState.onlyUnknown); build(); show(); };
  const cnt = head.querySelector('#cnt');
  const bar = head.querySelector('#bar');
  function deckStats(){ let k=0,u=0; order.forEach(x=>{ const s=known[cardId(x.ci,x.i)]; if(s==='k')k++; else if(s==='u')u++; }); return {n:order.length,k,u,nw:order.length-k-u}; }
  function updBar(){ bar.innerHTML = order.length ? pbar(deckStats(),'thin') : ''; }

  function show(){
    area.innerHTML=''; updBar();
    if (!order.length){
      area.appendChild(el(`<div class="done"><h2>Wszystko opanowane</h2><p>Każda fiszka w tym zestawie jest oznaczona jako „umiem”. Wyłącz filtr „Tylko nieopanowane”, żeby przejrzeć je jeszcze raz.</p></div>`));
      cnt.textContent=''; return;
    }
    if (pos >= order.length){
      const s = deckStats();
      const d = el(`<div class="done">
        <span class="big">${s.k}/${s.n}</span>
        <h2>Koniec zestawu</h2>
        <p>${s.u ? `Zostało ${s.u} ${plural(s.u,'fiszka','fiszki','fiszek')} do powtórki. Powtórz je teraz, póki są świeże.` : 'Wszystkie fiszki z tego zestawu masz opanowane.'}</p>
        ${pbar(s)}${legend(s)}
        <div class="next"><button class="btn btn-line" id="again">${ic('redo')}Od nowa</button><button class="btn btn-lime" id="hard" ${s.n-s.k?'':'disabled'}>Powtórz trudne</button></div></div>`);
      d.querySelector('#again').onclick=()=>{ build(); show(); };
      d.querySelector('#hard').onclick=()=>{ deckState.onlyUnknown=true; head.querySelector('#unBtn').setAttribute('aria-pressed',true); build(); show(); };
      area.appendChild(d); cnt.textContent=''; return;
    }
    cnt.innerHTML = `${pos+1} <span>/ ${order.length}</span>`;
    const x = order[pos]; const id = cardId(x.ci,x.i); const st = known[id];
    const chName = ci===null ? 'Rozdział '+DATA.chapters[x.ci].num : 'Pytanie '+(x.i+1);
    const tag = st==='k' ? `<span class="tag k">${ic('check',12)}umiem</span>` : st==='u' ? '<span class="tag u">do powtórki</span>' : '';
    const stage = el(`<div class="stage">
      <span class="stamp bad" aria-hidden="true">Powtórka</span><span class="stamp good" aria-hidden="true">Umiem</span>
      <div class="card" role="button" tabindex="0" aria-label="Fiszka, naciśnij aby odwrócić">
      <div class="face front"><div class="lbl"><span>${esc(chName)}</span>${tag}</div><div class="txt"><div>${md(x.card.q)}</div></div><div class="hint">${ic('tap',15)}<span>Dotknij, aby zobaczyć odpowiedź</span><kbd>Spacja</kbd></div></div>
      <div class="face backf"><div class="lbl"><span>Odpowiedź</span>${tag}</div><div class="txt"><div>${md(x.card.a)}</div></div><div class="hint"><span>Przesuń w prawo, jeśli umiesz, w lewo, jeśli nie</span></div></div>
    </div></div>`);
    area.appendChild(stage);
    const card = stage.querySelector('.card');
    const sGood = stage.querySelector('.stamp.good'), sBad = stage.querySelector('.stamp.bad');
    requestAnimationFrame(()=>{
      const f = stage.querySelectorAll('.face'); let hmax = 0;
      f.forEach(fc=>{ fc.style.position='relative'; hmax=Math.max(hmax, fc.scrollHeight); fc.style.position=''; });
      card.style.minHeight = Math.max(hmax, window.innerWidth<640?340:400)+'px';
    });
    let flipped=false;
    const flip = () => { flipped=!flipped; card.classList.toggle('flipped', flipped); };
    card.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); flip(); } });
    // swipe
    let sx=0, sy=0, dx=0, dragging=false, moved=false;
    stage.addEventListener('pointerdown', e=>{ if (e.button>0) return; sx=e.clientX; sy=e.clientY; dx=0; dragging=true; moved=false; });
    stage.addEventListener('pointermove', e=>{
      if(!dragging) return; dx=e.clientX-sx; const dy=e.clientY-sy;
      if (Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ moved=true; card.style.transition='none';
        card.style.transform=`translateX(${dx}px) rotate(${dx/28}deg)` + (flipped?' rotateY(180deg)':'');
        const a = Math.min(1, Math.abs(dx)/90);
        sGood.style.opacity = dx>0 ? a : 0; sBad.style.opacity = dx<0 ? a : 0; }
    });
    const end = ()=>{
      if(!dragging) return; dragging=false;
      card.style.transition='';
      if (moved && Math.abs(dx)>80){ mark(dx>0?'k':'u', dx>0?1:-1); }
      else { card.style.transform=''; sGood.style.opacity=0; sBad.style.opacity=0; if(!moved) flip(); }
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', ()=>{ dragging=false; card.style.transition=''; card.style.transform=''; sGood.style.opacity=0; sBad.style.opacity=0; });
    let marking=false;
    function mark(v, dir){
      if (marking) return; marking=true;
      known[id]=v; save(); updBar();
      (dir>0?sGood:sBad).style.opacity=1;
      card.style.transform=`translateX(${dir*120}%) rotate(${dir*14}deg)` + (flipped?' rotateY(180deg)':'');
      card.style.opacity='0';
      setTimeout(()=>{ pos++; show(); }, 240);
    }
    const acts = el(`<div><div class="verdict">
        <button class="vbtn bad">${ic('x')}Do powtórki<kbd>←</kbd></button>
        <button class="vbtn good">${ic('check')}Umiem<kbd>→</kbd></button></div>
      <div class="navrow"><button id="prev" ${pos?'':'disabled'}>${ic('left',16)}Poprzednia</button><button id="flip">${ic('flip',16)}Odwróć</button><button id="next">Pomiń${ic('right',16)}</button></div></div>`);
    area.appendChild(acts);
    acts.querySelector('.bad').onclick=()=>mark('u',-1);
    acts.querySelector('.good').onclick=()=>mark('k',1);
    acts.querySelector('#prev').onclick=()=>{ if(pos>0){pos--; show();} };
    acts.querySelector('#next').onclick=()=>{ pos++; show(); };
    acts.querySelector('#flip').onclick=flip;
  }
  document.onkeydown = e => {
    if (!area.isConnected || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key===' '){ e.preventDefault(); area.querySelector('#flip')?.click(); }
    else if (e.key==='ArrowRight') area.querySelector('.vbtn.good')?.click();
    else if (e.key==='ArrowLeft') area.querySelector('.vbtn.bad')?.click();
    else if (e.key==='ArrowDown') { e.preventDefault(); area.querySelector('#next')?.click(); }
    else if (e.key==='ArrowUp') { e.preventDefault(); area.querySelector('#prev')?.click(); }
  };
  show();
}

render();
})();
</script>
</body>
</html>
